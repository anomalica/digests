      The United States Department of Defense (DoD) did not officially look at Unidentified Anomalous Phenomena (UAP) again until mid-2000, when select members of United States Congress initiated and funded the Advanced Aerospace Weapon Systems Applications Program (AAWSAP) to study UAP, under the direction of the Defense Intelligence Agency (DIA).
