    quote: |-
      After a review of the laws, policies, and guidance issued by Congress, the DoD, and other Federal agencies, we determined that, while the Services and Components have an important role to play, the combatant commands would be the logical organizations to detect, report, collect, and identify UAP incidents to AARO.
