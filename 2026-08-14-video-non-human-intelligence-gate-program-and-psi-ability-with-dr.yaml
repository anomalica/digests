      So unconditional love doesn't change anything, but what it does do is when you are already in a state of unconditional love, I think what it actually allows you to do is not have any conditions on time or space. So it's almost like a belief factor. It's like if you could imagine the universe as this giant bubble of love, why are you privileging or saying that you could only get information from this half of the universe, but not this half of the universe
    text: |-
