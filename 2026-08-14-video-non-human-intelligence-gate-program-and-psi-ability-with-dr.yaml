      - id: 0fae0215-9ad6-4aa0-a655-4360321d2ffc
        name: precognitive remote viewing
    quote: |-
      I've gone to the really unconscious physiological scale and doing things at the 100 milliseconds to seconds time scale. And then on the other end, the more conscious, more deliberate precognitive remote viewing, you know, minutes, days, weeks, et cetera, scale. So I've studied both of those.
    text: |-
      Julia Mossbridge has studied precognition at two scales: unconscious physiological responses on the 100-millisecond to seconds scale, and conscious, deliberate precognitive remote viewing on the minutes, days and weeks scale.
  - id: fda4c04a-7712-4d2c-bbe4-f3c9955754fa
