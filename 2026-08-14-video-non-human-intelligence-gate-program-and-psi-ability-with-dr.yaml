        name: presentiment
    quote: |-
      So one of the first studies I did was bringing people in and showing them a picture of a gun versus a picture of a sunset, and then they started crying because it was kind of emotional, so I stopped that experiment because the gun is scary.
    text: |-
      In one of her first presentiment studies Julia Mossbridge showed participants a picture of a gun versus a picture of a sunset, and stopped the experiment because participants started crying at the frightening gun image.
