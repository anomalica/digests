    quote: |-
      when i was at Monroe there was a brief uh talk because they they'd also mentioned something uh along the lines of you know, meditating on your past trauma, going back, healing yourself. One thing they would do is have you go back to this, like, whether it's traumatic or whether it was just an event you would rather have a different outcome to and live the different outcome.
    text: |-
      At the Monroe Institute, Chris Ramsay heard a talk about meditating on past trauma, going back to a traumatic event or one with an unwanted outcome, making the other decision and living out the different outcome, from which participants would feel better.
  - id: f9c52a7e-176c-420e-9eee-77ccb341dbc7
