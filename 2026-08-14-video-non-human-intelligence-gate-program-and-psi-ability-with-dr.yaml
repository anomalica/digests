        name: out-of-body experience
      - id: edf790d2-ad26-48f5-99b4-bdfef3008322
        name: remote viewing
    quote: |-
      And he did that, but he couldn't, he couldn't physically interact the envelope cause he was out of his body... And so he just tried to like project where he would be, where that photo was taken... And he drew and it was like a one for one.
    text: |-
      In the out-of-body session recounted by Joseph McMoneagle, he could not physically interact with the envelope because he was out of his body, so he projected to where the photograph had been taken from and produced a drawing that matched the photograph exactly.
