        name: unconditional love
    quote: |-
      remembering what it was like for me as a kid in this really rough household, where I had these very loving parents. Unconditional love was present. I could feel it almost like a force, but there was so much dysfunction. There was abuse, there's neglect, and mental illness going on.
    text: |-
      Julia Mossbridge grew up in a household in which her parents were loving and unconditional love was present, but which also contained abuse, neglect and mental illness.
  - id: b2ae30bf-f5f5-44b3-a1a7-84d7c451ff8b
    type: testimony
    attestation: first_hand
    speaker:
