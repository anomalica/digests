      Julia Mossbridge believes the Israel Defense Forces (IDF) originated the therapeutic idea of returning to a past trauma, which they called something like Back to the Future therapy.
  - id: f7623c61-a7f4-49ff-b04f-10af01200afa
    type: hearsay
    attestation: second_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
      name: Julia Mossbridge
    provenance_chain:
      origin_kind: named
