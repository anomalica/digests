    quote: |-
      when you find it on the seconds or minutes time scale or with remote viewing precognitive remote viewing it could be days, weeks, years.
    text: |-
      Precognitive effects found with remote viewing can occur over days, weeks or years, not only seconds or minutes.
  - id: c9bc3ca6-7c42-4e48-a11e-411f23935c03
    type: testimony
    attestation: first_hand
