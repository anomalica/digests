        name: informational substrate
    quote: |-
      what we experience in terms of human experience could be what that grows up into. So this can, you know, sparkling water and these microphones and our headphones and our bodies, those are all the ones and zeros growing up into that.
    text: |-
      Julia Mossbridge holds that human experience, bodies and physical objects are what the informational substrate grows up into.
