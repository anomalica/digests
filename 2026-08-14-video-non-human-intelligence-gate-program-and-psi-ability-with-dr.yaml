      the informational substrate knows that there's going to be this missile launch. It gives you this information at the football game. and you prepare to destroy the missile ... The knowledge that there's this intention for the missile launch ... and the knowledge that you will foil that intention.
    text: |-
      Julia Mossbridge holds that in an averted precognition the informational substrate already contains the intention behind the event, the giving of the warning, the fact that the person could foil the intention, and the fact that they will foil it, so no timeline is changed.
