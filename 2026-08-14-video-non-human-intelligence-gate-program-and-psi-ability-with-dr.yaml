        name: obsessive-compulsive disorder (OCD)
    quote: |-
      And my father had obsessive-compulsive disorder, and I'm not going to go into too-depth for anyone who might have been traumatized in this particular way, but every night he would act out a ritual on myself and my sister that didn't on the face of it seem sexual, but it did sort of seem sexual.
    text: |-
      Julia Mossbridge's father had obsessive-compulsive disorder (OCD) and every night acted out a ritual on her and her sister that seemed somewhat sexual.
