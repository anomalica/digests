    quote: |-
      when I was in my 40s and went through therapy, that my 30s and 40s went through therapy, and my therapist had me do like a little time travel narrative, we call it in the therapy world, and had me go back and hold my hand and talk to myself.
    text: |-
      In her thirties and forties Julia Mossbridge went through therapy in which her therapist had her do a time travel narrative exercise, going back to hold her own childhood self's hand and talk to herself.
