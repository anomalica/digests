        name: predictive anticipatory activity
      - id: 72cb2492-82b5-41c3-938e-122b8d563316
        name: presentiment
    quote: |-
      I made up other terms for it to try to get it published, like predictive anticipatory activity so it didn't sound scary to people. And it worked. I got it in a mainstream journal. But then I regretted it because it's so much easier to talk about pre-sentiment.
    text: |-
      Julia Mossbridge invented the term predictive anticipatory activity for presentiment so that it would sound less frightening and could be published, and it succeeded in getting the work into a mainstream journal, though she later regretted the coinage.
  - id: 7969339b-601a-4803-9951-3cd029375ec5
    type: testimony
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
      name: Julia Mossbridge
    provenance_chain:
      origin_kind: speaker
      origin: Julia Mossbridge
    attribution_in_text: false
    location: 01:23:05.1-01:23:22.4
    refs:
      - id: 72cb2492-82b5-41c3-938e-122b8d563316
        name: presentiment
      - id: f3541566-b750-4e49-b9fe-3faf2f6f98d7
        name: electroencephalography (EEG)
    quote: |-
      So it's the idea that your body can change its heart rhythm, respiration, EEG, you name it, whatever sensor you want on the body before an event occurs, and the event is random. So your body's responding to a future event that it can't know about according to the usual means.
    text: |-
      Presentiment is the idea that the body changes its heart rhythm, respiration or electroencephalography (EEG) signal before a random event occurs, so the body responds to a future event it cannot know about by usual means.
  - id: 77f9ba4a-82a4-4d32-9e4f-afb795b74c93
    type: testimony
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
      name: Julia Mossbridge
    provenance_chain:
      origin_kind: speaker
      origin: Julia Mossbridge
    attribution_in_text: false
    location: 01:23:27.1-01:23:46.2
    refs:
      - id: 72cb2492-82b5-41c3-938e-122b8d563316
        name: presentiment
    quote: |-
      You hook someone up to whatever monitor you're using, And you have some stimuli, some that are maybe gonna make them scared or excited, and some that are gonna just be neutral. And you don't know, and the person doesn't know, no one on the planet knows which stimulus is gonna show up.
    text: |-
      In a presentiment test a participant is hooked to a monitor and shown stimuli, some arousing and some neutral, where neither the experimenter, the participant, nor anyone else knows which stimulus will appear.
  - id: 7c09c29c-7537-486b-bb10-4bb7e31ffaf5
    type: measurement
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
      name: Julia Mossbridge
    provenance_chain:
      origin_kind: speaker
      origin: Julia Mossbridge
    attribution_in_text: false
    location: 01:23:47.3-01:24:10.1
    refs:
      - id: 72cb2492-82b5-41c3-938e-122b8d563316
        name: presentiment
    quote: |-
      just before the stimulus shows up, there will be a amping up uh like your heart rate might go up or your skin conductance might go up you might sweat a little bit more if it's going to be an arousing stimulus ... and it will just be neutral or maybe go down if it's just a neutral stimulus and that's the result and it's been shown just a lot
    text: |-
      In presentiment experiments the participant's heart rate or skin conductance rises just before an arousing stimulus appears, and stays neutral or drops before a neutral stimulus, a result that has been shown many times.
  - id: f5e3e939-52f8-4fe1-a8c3-7677b73d3afc
    type: testimony
    attestation: first_hand
