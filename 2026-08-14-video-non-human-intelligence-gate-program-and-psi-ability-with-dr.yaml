        name: remote viewing
    quote: |-
      But you get rid of things like positional bias. ... Because you can give the same AI the two images in an opposite position, and it doesn't remember that it saw it in the other position. ... Whereas with a human, you'd have to give two different humans. It's a lot of humans.
    text: |-
      Artificial intelligence judging removes positional bias from remote viewing scoring, because the same model can be given two images in opposite positions without remembering the earlier arrangement, whereas doing this with humans would require two different people.
