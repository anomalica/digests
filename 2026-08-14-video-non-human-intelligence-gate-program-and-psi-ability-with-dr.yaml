        name: Julia Mossbridge
    quote: |-
      And they found that it really helps PTSD to go back. with all you know now because you survived the PTSD because you're in therapy for it so with all you know now go back to the trauma and sit with yourself and give yourself idea you know an idea about what to do
    text: |-
      The Israel Defense Forces (IDF) found that going back to a trauma with everything one now knows really helps post-traumatic stress disorder (PTSD).
  - id: 451c7ca7-69b7-4b55-8ab3-7fa125c2db71
    type: testimony
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
      name: Julia Mossbridge
    provenance_chain:
      origin_kind: speaker
      origin: Julia Mossbridge
    attribution_in_text: false
    location: 02:31:13.5-02:31:28.2
    refs:
      - id: 8d3ca113-3f28-4808-998e-34d2837332a5
        name: Julia Mossbridge
      - id: 8b222035-5a1b-4a81-b0b6-03d9c7ffead2
        name: post-traumatic stress disorder (PTSD)
    quote: |-
      and like let yourself know you're not alone and then do it in the opposite direction go back and be the one who's alone and is having the traumatic experience and notice that this future person is there to help you and go take their advice so it's just super powerful
    text: |-
      The trauma-revisiting exercise is done in both directions: first going back as the present-day self to advise the traumatised self, then re-experiencing the trauma as the earlier self and noticing the future person present to help and taking their advice.
