    quote: |-
      He did say that he he had one session. I spoke to Ed May about this as well, Dr. May. And he said he had one session where there was a you know, get out of your body, go into the other, they started with the, uh, with the ping pong balls in the eye of the Gansfield sort of, uh, effect to like stimulate this, uh, out of body state. And then they said, get out of your body, walk into the other room and the envelope, there's a picture, go look at the picture and tell me what's on the picture.
    text: |-
      In a session described to Chris Ramsay by Joseph McMoneagle and by Edwin May, experimenters used ping-pong balls over the eyes to produce a Ganzfeld effect to stimulate an out-of-body state before asking Joseph McMoneagle to view a picture in an envelope in another room.
  - id: a6b08856-356d-4873-8e41-84e846b2acb1
