    text: |-
      In the polygraph process, examiners accuse the subject of things as theatre in order to observe the reaction, a practice Julia Mossbridge describes as public information.
  - id: 1cee72ab-a36e-4b20-9c36-f4b05ac07ae9
    type: opinion
    attestation: first_hand
