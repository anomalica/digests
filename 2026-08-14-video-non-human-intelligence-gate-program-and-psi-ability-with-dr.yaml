        name: precognition
    quote: It's called pre-sentiment. ... It means pre-feeling.
    text: |-
      Studying precognition in the body physiologically is called presentiment, which means pre-feeling.
  - id: c25aead3-99ea-45d8-aa9f-08ba7c8fa821
    type: testimony
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
