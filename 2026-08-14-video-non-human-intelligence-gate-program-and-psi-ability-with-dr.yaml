        name: Julia Mossbridge
    quote: |-
      there was a rocking chair near my bed. It wasn't even a real rocking chair, but in my mind's eye, it was a real rocking chair. And there was this woman in her 40s or 50s, with dark hair, who was telling me it's okay to be angry. He doesn't know what he's doing. He's not in his right mind. But it's fine to be angry, and someday you're gonna thrive.
    text: |-
      As a child Julia Mossbridge experienced seeing, in her mind's eye, a woman in her forties or fifties with dark hair sitting in a rocking chair near her bed telling her it was all right to be angry, that her father did not know what he was doing, and that she would one day thrive.
