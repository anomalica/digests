    quote: |-
      conditional love is like an and statement. Both things have to be true in order for love to happen. Like I have to love you, you have to love me, now we're in love. That's what we usually think of as love. Unconditional love is like, You could be completely ignoring me or hate me, but I unconditionally love - everybody.
    text: |-
      Julia Mossbridge distinguishes conditional love, which she likens to a logical AND statement requiring both parties to love each other, from unconditional love, which is given regardless of whether the other person ignores or hates you and includes everybody.
  - id: dd7b9c6f-912a-40df-80f3-5657ad33dd1b
