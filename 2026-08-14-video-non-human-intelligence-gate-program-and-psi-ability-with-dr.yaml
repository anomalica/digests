        name: Time Machine (timemachine.love)
    quote: |-
      we showed that if people worked at it, we had them do it for 10 days, the people who had early childhood trauma that was severe improved to the point of people who didn't have early childhood trauma in terms of their overall well-being. So they really benefited. Everyone improved, but the people who were much worse off at the beginning just did a lot better.
    text: |-
      In the Time Machine study, participants with severe early childhood trauma improved in overall well-being to the level of participants without early childhood trauma, and although everyone improved, those who started off worse improved most.
