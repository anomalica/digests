    quote: |-
      it goes like january february march april may june and then you turn a corner you start going down okay so it's not like looking at a calendar and seeing like no no no then it goes to september and then now you're going this other direction you go to december and there's this big gap between december and january
    text: |-
      In Julia Mossbridge's spatial perception of the year, the months run from January through June, turn a corner and descend, then change direction again at September and continue to December, with a large gap between December and January.
