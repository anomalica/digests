        name: informational substrate
    quote: |-
      it's this idea of this informational substrate if you want to think about it as Like a bunch of ones and zeros that aren't being manifested on a page or on a computer. They're just presence, absence. One, zero, presence, absence. And it's timeless, it's spaceless, but it contains all the information in the universe from the beginning to the death of the universe.
    text: |-
      Julia Mossbridge describes the informational substrate as a timeless, spaceless set of presences and absences, like ones and zeros not manifested on any page or computer, containing all the information in the universe from its beginning to its death.
  - id: b6d421a1-f598-4a43-8b61-2b0077d7a9a8
    type: opinion
