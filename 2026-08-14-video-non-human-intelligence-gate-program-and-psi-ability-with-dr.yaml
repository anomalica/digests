    quote: |-
      There's a feeling among some physicists that they're science cops. Like, we're going to tell you that there's a law, it can't happen, no signaling theorem ... We're moving towards what can we build that we didn't think we could build because the science cops said we shouldn't be able to.
    text: |-
      Julia Mossbridge considers that some physicists act as science cops, declaring things impossible by law, and that the field should instead move towards building what was thought impossible.
