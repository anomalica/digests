        name: unconditional love
    quote: |-
      There seems to be two opposing ends of this, of a way to interact with the substrate. And on one end, the end that you speak of, which is this loving intention, this calming of the mind... But then on the other side, there seems to be like this opposite way of inducing similar effects through trauma
    text: |-
      Chris Ramsay considers there to be two opposing ways of interacting with the informational substrate: loving intention and calming of the mind on one side, and inducing similar effects through trauma on the other.
