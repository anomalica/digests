    quote: |-
      it really matters how people feel ... and so we've been in this behaviorist tradition that says that doesn't matter only things that are you know apparent on the outside
    text: |-
      Julia Mossbridge holds that how people feel really matters, against a behaviourist tradition that says only what is apparent on the outside matters.
  - id: bfb09fc2-83d7-4f7f-94d8-f67863a1a11d
    type: opinion
    attestation: first_hand
    speaker:
      id: 8d3ca113-3f28-4808-998e-34d2837332a5
