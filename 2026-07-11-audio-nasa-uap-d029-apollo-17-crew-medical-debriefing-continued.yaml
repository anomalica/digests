        name: Apollo 17
    quote: |-
      I thought in the CSM that I would use the orbit monitor charts. I guess that's what they're called. And I had an extra one put on so it wouldn't interfere with the planned activities of the CMP.
    text: |-
      Harrison Schmitt had an extra orbit monitor chart put on board the Command and Service Module during Apollo 17 so that it would not interfere with the Command Module Pilot's planned activities.
