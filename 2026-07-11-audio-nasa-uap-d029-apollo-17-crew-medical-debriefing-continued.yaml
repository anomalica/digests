        name: Harrison Schmitt
    quote: |-
      The difficulty in going to sleep was variable. and when sequinol was used generally no difficulty in going to sleep
    text: |-
      Harrison Schmitt's difficulty in going to sleep was variable, and he generally had no difficulty going to sleep when Seconal was used.
  - id: d49a0bff-eee3-4da4-9f8f-bdb21ebbf86d
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
