        name: Harrison Schmitt
    quote: |-
      I think it had that kind of thing as an individual preference item, And if you have experiment, it ought to be flight planned. If you're just planning to use your spare time for specific observational targets or types of observations, then I think the Penn & Inc. is maybe the easiest way to go, since it shouldn't concern any large number of people.
    text: |-
      Harrison Schmitt recommends that pen-and-ink notation is the easiest way to flight-plan personal observational targets during spare time, since it does not require involving a large number of people, whereas a designated experiment ought to be formally flight planned.
