      The CSM landmark maps that the LNP had added in the rear of that book, again, were not used.
    text: |-
      The Command and Service Module landmark maps added to the rear of a book by the Lunar Module Pilot were not used during Apollo 17.
  - id: 495e4a2a-2e6f-44b4-8976-06be06bd528a
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
