        name: Harrison Schmitt
      - id: 42312510-c6f0-4f17-87ef-8f44977a088a
        name: Apollo Lunar Surface Experiments Package (ALSEP)
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Most of our ALSEP changes were all taken care of prior to our training, and we had a few minor suggestions that were taken care of early in the training cycle and we essentially had an up-to-date ALSEP to train with
    text: |-
      Most changes to the Apollo Lunar Surface Experiments Package (ALSEP) for Apollo 17 were taken care of prior to crew training, with a few minor suggestions addressed early in the training cycle, resulting in an up-to-date ALSEP for training.
  - id: 7fd1778d-2783-4f16-bf9e-617dfe73936e
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
