    location: 00:10:16.8-00:10:29.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      Again, though, I think having selected them and studied them pre-flight made it worth having them around. The necessity for flying them was probably less than the necessity for having reviewed them and studied them.
    text: |-
      Harrison Schmitt considers that having selected and studied the landmark maps pre-flight was worthwhile even though flying them in-flight was not, and believes the necessity for having reviewed them exceeded the necessity for flying them.
