        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      The quantity of food eaten on the lunar surface I think was high, although probably no more than half of that food that was available.
    text: |-
      During Apollo 17, the quantity of food eaten on the lunar surface was high, though probably no more than half of the food that was available.
  - id: 8f1d252d-cc3d-4872-8e5d-26330162425a
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:41:57.1-00:42:07.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      We used a blue bag. The blue bag is not a bad way to to defecate unless the stool is loose.
    text: |-
      During Apollo 17, a blue bag was used for defecation, which Harrison Schmitt described as not a bad method unless the stool was loose.
  - id: d0fdf386-b350-4a89-b2d3-4efd05265d3a
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:42:09.1-00:42:11.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: If it's loose, it's just about impossible to use.
    text: |-
      A loose stool is nearly impossible to manage using the blue bag defecation method.
  - id: 8a7564f1-9854-4190-8450-3e860a34ed2b
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:42:41.5-00:42:56.2
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      A loose stool is one of the major hygiene and sanitary and operational problems that you can have on a flight. I can't emphasize that more.
    text: |-
      Harrison Schmitt considers a loose stool one of the major hygiene, sanitary, and operational problems that can occur on a spaceflight.
  - id: 5038bbd9-fa64-4625-ae5b-cdd121a81ff8
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:43:03.0-00:43:14.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      I think eventually cut the efficiency of the crew member with the problem by a significant percentage, possibly as much as 30%, depending on the magnitude of the problem.
    text: |-
      Harrison Schmitt estimated that a daily loose stool problem could eventually cut a crew member's efficiency by a significant percentage, possibly as much as 30 percent, depending on the magnitude of the problem.
  - id: 59823a5d-0bac-485b-adce-31eac3ddd183
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:43:16.2-00:43:32.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
      - id: 15bf5f37-ee05-4834-a203-1a7bf46898fd
        name: Apollo 16
    quote: |-
      I think it's important to try to understand why Apollo 17 was different than 16, and at least in the delay of a problem with loose stools until about the 11th or 12th day.
    text: |-
      On Apollo 17, the onset of a loose-stool problem was delayed until about the 11th or 12th day, unlike on Apollo 16.
  - id: b2c46bfc-b128-404b-b83d-0218fcbf0e75
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:43:33.5-00:43:35.9
    refs:
      - id: d684dfbd-2868-40a7-b1ea-2c6faa08d1b8
        name: Eugene Cernan
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: And in the case of the commander, no problem with loose tools.
    text: |-
      Eugene Cernan, as commander of Apollo 17, had no problem with loose stools during the mission.
  - id: 31cfa078-9577-4437-b151-3abf534ab345
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:43:36.8-00:44:07.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 15bf5f37-ee05-4834-a203-1a7bf46898fd
        name: Apollo 16
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      And my personal opinion at this point, based on very little information other than observation in flight and thinking about levels of electrolyte intake, is that with the electrolyte quantity down from that imposed on Apollo 16 that we did not reach an electrolyte saturation level until the 11th or 12th day, in terms of the CMP and the LMP
    text: |-
      Harrison Schmitt's personal opinion, based on limited in-flight observation and consideration of electrolyte intake levels, was that the reduced electrolyte quantity compared to Apollo 16 meant electrolyte saturation was not reached until the 11th or 12th day for the Command Module Pilot and Lunar Module Pilot on Apollo 17.
  - id: 342b187d-e607-4e14-be68-1e80a8c4f19f
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:44:08.6-00:44:17.0
    refs:
      - id: d684dfbd-2868-40a7-b1ea-2c6faa08d1b8
        name: Eugene Cernan
    quote: |-
      in terms of the commander, because his electrolyte intake was generally less, I think, and that can be documented, he did not reach a saturation level at all.
    text: |-
      Eugene Cernan, whose electrolyte intake was generally less, did not reach an electrolyte saturation level at all during Apollo 17, according to Harrison Schmitt.
  - id: bee8f466-e5df-4b8e-af9e-7a447e71a946
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:44:23.7-00:44:39.8
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      I suspect that the electrolytes we were eating were dumped, in a sense, or concentrated in the intestines and tended to act pretty much as a laxity and as an Epsom salt type laxity, if you will, in concentrated water in the stool.
    text: |-
      Harrison Schmitt suspected that once electrolyte saturation was reached, excess electrolytes were concentrated in the intestines and acted as a laxative, similar to an Epsom salt-type laxative, in the stool.
  - id: ecde8f45-d764-448d-904b-ff3534576543
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:44:40.1-00:44:55.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8f9b2669-1c18-4342-9f0d-146a7b6f3f3a
        name: Skylab
    quote: |-
      I think it's important for Skylab that, first of all, we probably reduce the electrolytes intake so that saturation is never reached.
    text: |-
      Harrison Schmitt recommended that for Skylab, electrolyte intake should be reduced so that saturation is never reached.
  - id: c1d1196c-adb8-40cf-847b-95a39b37723f
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:44:57.2-00:45:18.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8f9b2669-1c18-4342-9f0d-146a7b6f3f3a
        name: Skylab
    quote: |-
      secondly, that if a loose stool problem develops, it appears to be an electrolyte problem other than any other biological problem, that we decrease the intake of electrolytes.
    text: |-
      Harrison Schmitt recommended that if a loose stool problem develops on Skylab and appears to be an electrolyte-related issue, electrolyte intake should be decreased.
  - id: 086771d4-46e2-458d-8057-847a595f107d
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:45:19.2-00:45:20.4
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: This is what I did on my own.
    text: |-
      Harrison Schmitt reduced his own electrolyte intake on his own initiative during Apollo 17.
  - id: 080032a6-5896-4d14-93c6-5ad24c0641fb
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:45:22.2-00:45:29.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      whether or not it worked or not is hard to say because the flight was terminated before any other stools occurred.
    text: |-
      Whether reducing electrolyte intake worked to prevent further loose stools was hard to say because the Apollo 17 flight ended before any other stool problems occurred.
  - id: 8df81f17-c03c-43b4-ae71-22b6df58d47c
    type: observation
    attestation: first_hand
