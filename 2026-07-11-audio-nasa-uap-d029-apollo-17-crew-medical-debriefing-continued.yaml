    quote: |-
      and he also, Thorson also was a major organizer of the creation of and the updating of those emergency cue cards.
    text: |-
      Dick Thorson was a major organiser of the creation and updating of the Apollo 17 Lunar Module emergency cue cards.
  - id: 36796e2b-f3db-4b4a-85a0-85e7c0cc9f55
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:24:56.6-00:25:55.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Post-flight, it's my understanding that some of the things I had hoped could be done during the flight were not possible because of real-time discussions in the mission control. Specifically, one of those things was to have some summary of the thinking of the science background given to me while in flight, and that would be the thinking based on the data that we had transmitted to them verbally and to, in a sense, visually through the television camera. I had hoped that I would have the benefit of their thinking, but apparently this was not possible to do.
    text: |-
      Harrison Schmitt had hoped to receive a real-time summary of the ground science team's thinking during the Apollo 17 flight, based on data transmitted verbally and via television camera, but this was not possible due to real-time discussions in mission control.
  - id: 516c0219-38b3-46cc-b908-f282065f8562
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:25:57.0-00:26:30.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      I would like to think that in the future we can look at ways of using the team approach to science investigations in space rather than depending solely on the observational capability and the interpretive capability of the men who are performing the job. There's no reason that I can see to not use all the brain power that's available for any given task. Part of that brain power is on the ground.
    text: |-
      Harrison Schmitt would like future missions to use a team approach to science investigations in space, drawing on ground-based brain power, rather than relying solely on the crew's own observational and interpretive capability.
  - id: cfbbbf7a-46f3-4c39-97aa-1abdf9256830
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:26:49.1-00:27:07.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: d684dfbd-2868-40a7-b1ea-2c6faa08d1b8
        name: Eugene Cernan
      - id: a73b0bd3-0a75-4426-82c6-cc7ac9a4ddb1
        name: Pre-Flight Health Stabilization Control Program
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      The brunt of the discussions and organization from the crew point of view of the Pre-Flight Health Stabilization Control Program was borne by the commander, and the LMP just sort of went along with whatever was decided.
    text: |-
      During Apollo 17, discussion and organisation of the Pre-Flight Health Stabilization Control Program from the crew's point of view was borne mainly by the commander, with the Lunar Module Pilot going along with whatever was decided.
  - id: a9f8d662-d0e2-40c3-b136-bea3a2c20fd3
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:27:13.3-00:27:23.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: a73b0bd3-0a75-4426-82c6-cc7ac9a4ddb1
        name: Pre-Flight Health Stabilization Control Program
    quote: |-
      I personally did not find any great difficulty in working out adhering to the requirements of that program.
    text: |-
      Harrison Schmitt did not find any great difficulty adhering to the requirements of the Pre-Flight Health Stabilization Control Program.
  - id: baa0d48c-f432-47b5-b178-a55a53e93a1d
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:27:35.1-00:27:45.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      A couple sinus infections I had reacted just like they always had, and we were able over a period of 10 days or two weeks to get those cleared up.
    text: |-
      Harrison Schmitt experienced a couple of sinus infections before Apollo 17 that reacted as they always had, and were cleared up over 10 days to two weeks.
  - id: 72e1f2cf-a0df-4e0f-9bba-c57bb8fdd34f
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:27:49.4-00:28:04.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Time for exercise probably was less than it should have been, although I was able to get a good workout just about every other day, in addition to the workouts we got as a normal course of our EVA training.
    text: |-
      Harrison Schmitt was able to get a good workout about every other day during Apollo 17 pre-flight training, in addition to EVA training workouts.
  - id: 107ac6cd-2b83-4274-920d-ae4c82d07e56
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:28:06.5-00:28:22.4
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Eventually, Techs started putting on the schedule time in the late afternoon for exercise, and that helped as a reminder. and buffer to see that that exercise was obtained.
    text: |-
      During Apollo 17 pre-flight training, technicians eventually scheduled exercise time in the late afternoon, which helped as a reminder and buffer to ensure exercise was obtained.
  - id: e301a0d4-3c2f-46f9-a323-38abf3df27af
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:28:26.6-00:28:38.4
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: d8439423-d716-48f0-ae8d-a0dc3ca8240b
        name: USA, Florida, Cape Kennedy
    quote: |-
      It is generally hard, at least in the lunar training program, to get exercise periods in during the day and quite frequently the exercise was done in the Cape Gym at night.
    text: |-
      Harrison Schmitt considers it generally hard, in the lunar training programme, to get exercise periods in during the day, so exercise was often done at the Cape Kennedy gym at night.
  - id: 781311a1-0882-4f1c-ae57-4a4d5318e91e
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:28:45.6-00:29:02.2
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      I made a particular effort to always get as much as I possibly could and try never to get behind the power curve on rest because my personal experience is that that is when I tend to get colds and resulting sinus infections.
    text: |-
      Harrison Schmitt made a particular effort to get as much rest as possible and avoid falling behind on rest, because his personal experience is that lack of rest leads to colds and sinus infections.
  - id: 6d210ad0-1aeb-4d7b-b165-7306321e6154
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:29:09.3-00:29:20.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      The exams seemed to go very well in my estimation. They were as expeditious as possible under the circumstances.
    text: |-
      Harrison Schmitt considers the medical exams to have gone very well and to have been as expeditious as possible under the circumstances.
  - id: 9c7984fc-903a-41ef-b54f-b772bcf3e785
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:29:23.2-00:29:47.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 08b830e2-52ea-42a0-8616-e29f48409232
        name: USS Ticonderoga
    quote: |-
      And I think the operational medical personnel who carried out the exams are to be complimented in their efforts to see that the exam was as painless and as efficient as possible. and this should also include the post-flight exams on the Ticonderoga.
    text: |-
      Harrison Schmitt compliments the operational medical personnel, including those who carried out the post-flight exams on the USS Ticonderoga, for making the exams as painless and efficient as possible.
  - id: 1443fc2c-f6c7-45f2-89bb-c9c6d6751874
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:29:53.4-00:30:09.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      Eating habits and amount of food consumption were normal, except during those periods of time when we were on the in-flight food prior to launch, and those times there tended to be, in my case, a decrease of appetite
    text: |-
      Harrison Schmitt experienced a decrease in appetite during the periods when eating in-flight food prior to launch.
  - id: c79ada65-81d4-4fdd-a4f0-af3d952e6449
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:30:14.8-00:30:26.5
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      although the food was certainly palatable. My appetite did go down, and it certainly was not possible for me to eat the amount of food that was provided for me.
    text: |-
      Harrison Schmitt was not able to eat the amount of food provided to him during the pre-flight in-flight food testing, even though the food was palatable.
  - id: 29becc13-ba72-4361-bacf-faf442be3eb1
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:30:39.5-00:30:50.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Although I did not eat everything that was available to me in my food packages, I apparently needed to if I had wanted to avoid losing weight.
    text: |-
      Harrison Schmitt did not eat everything available to him in his food packages during Apollo 17 in-flight eating, and believes he needed to in order to avoid losing weight.
  - id: b7f38b42-7ccf-4271-94f1-f9482c6d5555
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:30:51.6-00:31:16.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      My appetite was down, but also apparently, for some reason, I had a loss of weight. And at the time of this recording, my weight is still down. It has not gone up to pre-flight levels, which may have been a little high, by the way.
    text: |-
      Harrison Schmitt lost weight during Apollo 17 despite a low appetite, and at the time of this recording his weight had not returned to pre-flight levels.
  - id: 3afb037f-dcf1-4876-8ad1-749a64f1752e
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
