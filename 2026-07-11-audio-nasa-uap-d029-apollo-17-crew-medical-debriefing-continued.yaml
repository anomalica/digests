      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      And occasionally, when the crew had to be involved, that was handled almost entirely by the support crew, Bob Parker in the science area and Cordy Fullerton and Bob Obermeyer in the operational areas.
    text: |-
      During Apollo 17 pre-flight training, crew-related requirement issues were handled almost entirely by the support crew: Bob Parker in the science area, Gordon Fullerton, and Bob Obermeyer in the operational areas.
  - id: d4d0e5ec-e26b-4e40-ba66-ce0572852122
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:19:57.6-00:20:03.9
    refs:
