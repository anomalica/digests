        name: Harrison Schmitt
    quote: Chlorientation odor was not apparent to me except during chlorination.
    text: |-
      Chlorination odour was not apparent to Harrison Schmitt except during chlorination itself.
  - id: 4be0b03f-5c90-4265-8d25-04ce95c06c92
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
