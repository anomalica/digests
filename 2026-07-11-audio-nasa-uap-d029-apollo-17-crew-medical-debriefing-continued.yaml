        name: Harrison Schmitt
      - id: b2e744a4-1f5c-45b8-8234-e286377ce430
        name: Lunar Module (LM)
    quote: |-
      Iodentation odor is very slight apparent in the limb water but not of any significance to the LMP.
    text: |-
      An iodine odour was slightly apparent to Harrison Schmitt in the Lunar Module's water but was not of any significance to him.
  - id: be3a0c4c-f017-48ac-b724-8178d67dd36f
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:46:02.0-00:46:20.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      Physical discomfort, no physical discomfort for the LMP other than tiredness on occasion and in the case of the EVA work, sore muscles and the bruises under the fingernails.
    text: |-
      Harrison Schmitt experienced no physical discomfort other than occasional tiredness, sore muscles from extravehicular activity (EVA) work, and bruises under his fingernails.
  - id: f57caec5-26f9-46be-81fd-c9944e69b43b
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
