    quote: |-
      And I think that just a function that there was a lot of time to look at the moon and make a sketch and then look back and fix it up post-EEI, where in orbit the time just did not exist.
    text: |-
      Harrison Schmitt attributes his post-trans-Earth-injection use of visual target maps to there being more time available to look at the Moon, sketch, and later revise the sketch, whereas in lunar orbit that time did not exist.
