        name: Apollo 17 Flight Data File
    quote: Pre-flight support was excellent in the flight data file area.
    text: |-
      Harrison Schmitt considers pre-flight support to have been excellent in the Apollo 17 Flight Data File area.
  - id: 2bed2a4f-b25e-487c-b9cc-f74278e684c5
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:13:23.2-00:14:06.5
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
      - id: ae5d2efd-f3df-47d4-9ad6-781323677e47
        name: Command and Service Module (CSM)
    quote: |-
      I had two or three, I don't remember, two or three briefing sessions where in the portions of the lunar orbit flight plan that I was going to be during which I was going to be in the spacecraft, in the CSM, we went over in detail the attitudes and maneuvers and the window availability so that I was able to plan in a very short amount of time, with minimum effort on my part, my own personal observations of the lunar surface, which went very well as far as planning was concerned.
    text: |-
      Harrison Schmitt had two or three briefing sessions once the Apollo 17 Flight Plan was well established, covering attitudes, manoeuvres, and window availability for the portions of the lunar orbit flight plan he would spend in the Command and Service Module.
  - id: 6d371017-65c9-4537-aad2-4de0c8c95d75
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:14:11.5-00:14:20.8
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      That was extra above and beyond the call of duty on the part of the flight planners, and I appreciated their taking time out to do that for me.
    text: |-
      Harrison Schmitt considers the extra briefing sessions on lunar orbit attitudes and manoeuvres to have been above and beyond the call of duty by the flight planners, and appreciated the time they took for him.
  - id: 97d3fac8-a096-4611-82de-db92928b5f2a
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:14:27.4-00:14:49.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: |-
      I think it was useful to have the, I think it was a day-long session where The flight controllers and the crew and the flight planners sat around in one room and went over those portions of the flight plan which were not normally simulated.
    text: |-
      A day-long session was held in which flight controllers, the crew, and flight planners reviewed the portions of the Apollo 17 Flight Plan that were not normally simulated.
  - id: c9ac4dde-cf74-4613-b568-ceb008073f81
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:14:52.4-00:15:04.4
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: |-
      It turned out that the flight plan had been so well done that I doubt if there were any specific items that came up that we needed to change or there seemed to be a lack of coordination on.
    text: |-
      Harrison Schmitt considers the Apollo 17 Flight Plan to have been so well done that no specific items needed changing at the day-long flight plan review session.
  - id: a60127ce-6a88-4acd-9cc0-bcf05e0581cf
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:15:05.5-00:15:23.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: |-
      This was in contrast to previous flights where I think we were still learning, all of us were learning on how to put together flight plans and integrate requirements. Apollo 17 flight plan apparently reached the peak of perfection.
    text: |-
      Harrison Schmitt considers that the Apollo 17 Flight Plan reached the peak of perfection, in contrast to previous flights where the crew and planners were still learning to integrate flight plan requirements.
  - id: f0d2e4a2-3c8d-43c3-b91d-0568dac06f5d
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:15:26.1-00:15:46.5
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      I was a little bit disappointed in that briefing in that some of the people who would be eventually intimately involved in the mission were not at the flight plan review, and I think this was because of conflicts with other programs which were the center it was carrying out at the time.
    text: |-
      Harrison Schmitt was disappointed that some people eventually intimately involved in the Apollo 17 mission were not at the flight plan review, due to conflicts with other programmes at their centre.
  - id: 265263e7-bddd-43b2-953f-37869243d776
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:17:01.8-00:17:12.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      I don't know whether I recorded yet that although we had light flashes just about continuously during the whole flight when you were dark-adapted.
    text: |-
      Harrison Schmitt experienced light flashes almost continuously throughout the Apollo 17 flight when dark-adapted.
  - id: 1d4e0684-ba5b-4e66-acc1-3de386d82b3b
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:17:14.9-00:17:21.1
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      And I may have even had one which I thought was a flash on the lunar surface during the first rev.
    text: |-
      Harrison Schmitt may have seen a light flash on the lunar surface during the first revolution of Apollo 17.
  - id: e6a2adfc-4f11-4185-b85c-5d22d4ecedff
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:17:25.6-00:17:31.7
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      That one period of time when we had the blindfolds on for the ALPMET experiment, there just were no visible flashes.
    text: |-
      During the period when the crew wore blindfolds for the ALPMET experiment on Apollo 17, there were no visible light flashes.
  - id: 3aedb2dd-34fe-4f9f-b0f3-aa18477ba570
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:17:32.9-00:17:38.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Although that evening, that night, before I went to sleep, I noticed I was seeing the light flashes again.
    text: |-
      Harrison Schmitt noticed the light flashes returning that evening before he went to sleep, after the ALPMET blindfold period on Apollo 17.
  - id: 0c5448a4-d511-4589-8a43-80890ee159dd
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:17:39.7-00:17:50.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: d684dfbd-2868-40a7-b1ea-2c6faa08d1b8
        name: Eugene Cernan
      - id: 64977787-2b5d-4859-aae8-bb7bec4a4a99
        name: Ronald Evans
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      So it just seemed to be that one interval on either side of it where the light flash phenomena was not visible to myself or to the other two crewmen.
    text: |-
      Harrison Schmitt observed that the light flash phenomena was not visible to himself or the other two crewmen during only that one interval around the ALPMET blindfold experiment.
  - id: 65eeb65e-0f5d-44f6-b476-166d71dc973f
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
