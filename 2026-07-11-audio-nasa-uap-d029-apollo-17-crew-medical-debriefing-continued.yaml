        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      We used the germicidal tablets. I did, at any rate, in all the juice bags and the food spoon bowl bags and the wet packs. I did not use them in the tea and coffee.
    text: |-
      During Apollo 17, germicidal tablets were used in all the juice bags, food spoon bowl bags, and wet packs, but not in the tea and coffee.
  - id: fb68bdb9-1819-4723-a2f9-a341c1ba1889
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:39:25.9-00:39:42.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Undesirable odors, really, except for the passing of gas occasionally, By the other crewmen and some occasionally by myself, undesirable odors were at a minimum.
    text: |-
      Undesirable odours in the spacecraft cabin during Apollo 17 were at a minimum, occurring occasionally from passing gas by crewmen including Harrison Schmitt.
  - id: 11c18550-0164-49a5-acfa-44459f16de3f
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:39:42.7-00:39:47.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: I did not find that the atmosphere was unpleasant as a general rule.
    text: |-
      Harrison Schmitt did not find the cabin atmosphere unpleasant as a general rule during Apollo 17.
  - id: b6f8daa2-21e9-42fb-837c-2dec07c0c557
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:39:53.0-00:40:03.8
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      I might say that I generally had a continuous, almost continuous passage of gas, most of which apparently was not with significant odor.
    text: |-
      Harrison Schmitt experienced an almost continuous passage of gas, most of which was apparently without significant odour.
  - id: 35dca904-3ba6-4594-8e73-9bbbe18af5e0
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:40:14.6-00:40:33.3
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      And I think most of that was the water gas. And the reason I think that is that upon eating, upon starting to eat, there would be an increased desire to pass gas. The increased pressure in my stomach apparently was transmitted almost immediately into the bowels.
    text: |-
      Harrison Schmitt believed that most of his gas problem was caused by water gas, based on an increased desire to pass gas upon starting to eat and increased stomach pressure transmitted to the bowels.
  - id: 34645354-ac99-4e17-96ff-e6340503a52e
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:40:35.2-00:40:54.0
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      And after eating, it would pass gas for a couple hours to three hours. And just before eating the next time, the desire would have pretty well dissipated, and then it would start again immediately upon eating, before any digestion was possible, I'm sure.
    text: |-
      After eating, Harrison Schmitt would pass gas for two to three hours, with the desire dissipating by the time of the next meal.
  - id: 5e5f2bc9-77e7-4aab-8dbd-660fb22e335a
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:40:54.3-00:41:02.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      So I suspect water gas was the main culprit in the LMP's gas problem, which were not significant.
    text: |-
      Harrison Schmitt, as Lunar Module Pilot, suspected that water gas was the main cause of his gas problem, which he did not consider significant.
  - id: 229b620a-11f1-4b73-939a-2120cf15ec5b
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:41:07.9-00:41:14.8
    refs:
