        name: Harrison Schmitt
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: |-
      And I can't think of anything that I would change in the way the flight plan was written.
    text: |-
      Harrison Schmitt could not think of anything he would change about the way the Apollo 17 Flight Plan was written.
