    attribution_in_text: false
    location: 00:23:55.1-00:24:12.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 0de71b63-f41e-4b6f-951a-589de985d460
        name: Dick Thorson
      - id: ae5d2efd-f3df-47d4-9ad6-781323677e47
        name: Command and Service Module (CSM)
      - id: b2e744a4-1f5c-45b8-8234-e286377ce430
        name: Lunar Module (LM)
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      I particularly want to point out the help that Dick Thorson gave in organizing most of the limb sessions and even some of the joint CSM limb sessions that we had.
    text: |-
      Dick Thorson helped organise most of the Lunar Module sessions and some of the joint Command and Service Module/Lunar Module sessions for Apollo 17.
  - id: 71727d52-ed5f-465f-a86d-24e7956b88d0
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:24:21.1-00:24:32.9
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 0de71b63-f41e-4b6f-951a-589de985d460
        name: Dick Thorson
