        name: Harrison Schmitt
    quote: |-
      One item is that that chart should have been identical to the CMP's chart, and there were a few pen and ink changes left off of it that caused some confusion at one point, pen and ink exposure settings for certain photo targets.
    text: |-
      Harrison Schmitt noted that his orbit monitor chart should have been identical to the Command Module Pilot's chart, and that some pen-and-ink changes, including photo exposure settings for certain targets, were left off it, causing some confusion.
