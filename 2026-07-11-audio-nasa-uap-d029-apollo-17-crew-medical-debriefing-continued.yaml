        name: Tommy Holloway
      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: Tommy Holloway and his people are to be complimented on that.
    text: |-
      Harrison Schmitt compliments Tommy Holloway and his people on the Apollo 17 Flight Plan.
  - id: 74876ebc-4f91-415d-8d8d-57c9d0f7f441
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
