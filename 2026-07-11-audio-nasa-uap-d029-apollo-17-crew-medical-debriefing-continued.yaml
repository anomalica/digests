      - id: cd4a8951-3929-4888-8371-108369afafe0
        name: Apollo 17 Flight Plan
    quote: |-
      A number of different requirements and experiments and general operational items that were required to be integrated one with the other was very, very high, and it was done in an extremely competent and usable way.
    text: |-
      Harrison Schmitt considers that the high number of different requirements and experiments integrated into the Apollo 17 Flight Plan was handled in an extremely competent and usable way.
  - id: 8e22003f-4779-435c-83ac-f59e0170ee2f
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
