        name: Harrison Schmitt
      - id: adf5e079-55c4-4352-9cd9-37c37371b138
        name: Phil Schafer
      - id: 1a14477e-af68-4e87-9f95-f88bc33e6e2b
        name: Jerry Griffin
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Mission rules and techniques, were fairly well defined very early by Phil Schafer and his crowd in the techniques area and the mission rules, certainly Jerry Griffin and people working on that.
    text: |-
      Mission rules and techniques for Apollo 17 were fairly well defined early on by Phil Schafer and his group in the techniques area, and by Jerry Griffin and others in mission rules.
  - id: e4d7f653-396c-43b8-806e-634500f853bd
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
