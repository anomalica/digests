    attribution_in_text: false
    location: 00:21:06.2-00:21:16.5
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      No major changes, and the only changes were all, I felt, in the right direction in that they enhanced the probability of making a landing in a successful mission.
    text: |-
      Harrison Schmitt considers that the only changes made to Apollo 17 mission rules were in the right direction, enhancing the probability of a successful landing and mission.
