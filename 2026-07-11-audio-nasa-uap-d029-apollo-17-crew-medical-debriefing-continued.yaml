        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      although there were periods of some difficulty pre-flight, particularly in the area of medical requirements, and in some last-minute possible scientific requirements, particularly on the samples, everything seemed to get resolved, satisfactory, near as I could tell.
    text: |-
      There were periods of some difficulty pre-flight for Apollo 17, particularly regarding medical requirements and some last-minute scientific requirements on sample collection.
  - id: e51e6409-b4c8-4f8e-99d4-76e5bfabdca1
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:19:38.9-00:19:53.5
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 4f79d469-2e10-46ee-a6e6-b857fdc9e050
        name: Bob Parker
      - id: 11010fa9-68b8-4762-aa67-91d364802530
