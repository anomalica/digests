        name: Apollo 17
    quote: |-
      I think I still, if I had to do it again, I still would want to have that kind of data available in the spacecraft, even though on this particular mission it was not used.
    text: |-
      Harrison Schmitt would still want that kind of landmark map data available in the spacecraft on a future mission even though it was not used on Apollo 17.
