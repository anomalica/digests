        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      There were no significant spacecraft changes in the course of our training period.
    text: |-
      There were no significant spacecraft changes during the Apollo 17 crew's training period.
  - id: 8d679ea3-f46f-4b76-bcbe-d5051ea52287
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:20:05.7-00:20:12.1
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 64977787-2b5d-4859-aae8-bb7bec4a4a99
        name: Ronald Evans
      - id: 3998e88f-70fd-4fd9-afa1-aa4a8bea2362
        name: Lunar Sounder
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Ron, I guess the biggest single area that took time was one that Ron had to deal with, and that was Lunar Sounder.
    text: |-
      Ronald Evans dealt with the Lunar Sounder, which took the most training time of any single area for the Apollo 17 crew.
  - id: 14704e83-82a0-4a36-8feb-07a140d60cce
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
