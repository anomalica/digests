        name: Moon, Gagarin
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      I really thought I would use those, but you became reluctant as you were observing a specific point or area target, say, such as Gagarin or something like that, to take time out to sketch on the photo.
    text: |-
      During Apollo 17, Harrison Schmitt observed a specific point or area target such as Gagarin on the Moon but became reluctant to take time to sketch on a photo while observing it.
  - id: 25d6a2a3-38e1-4029-a12a-a3d27ac1a497
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:09:35.1-00:09:48.6
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: 06ce77c9-58c5-4bfa-b98c-62f02dc59efd
        name: Harrison Schmitt's Apollo 17 Crew Notebook
    quote: |-
      I tended for the two or three minutes that observation was possible of a given area, I tended to look and then at the first opportunity to take notes in the notebook rather than trying to sketch on the photograph.
    text: |-
      During the two- to three-minute observation window for a given lunar area, Harrison Schmitt tended to look and then take notes in his notebook at the first opportunity rather than sketching on the photograph.
  - id: 06fc326a-f528-409b-a47d-4bd63b239801
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:09:50.4-00:10:14.2
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      And I suspect that this was because I tended to look for generalizations about the target that I was trying to observe rather than checking out specific individual features, and there really did not seem to be any need to make notes about specific points on the pictures, and as a result, I did not use them.
    text: |-
      Harrison Schmitt suspects he looked for generalisations about lunar observation targets rather than checking specific individual features, so there seemed no need to make notes about specific points on photographs.
  - id: 513b9c06-acc2-40f2-8708-5f2d8d793cbd
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
