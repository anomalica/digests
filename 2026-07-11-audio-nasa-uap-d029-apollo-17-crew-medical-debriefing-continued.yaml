        name: Apollo 17 Flight Plan
    quote: |-
      In the flight plan, I added some pen and ink cues along the margins for certain observational targets that I particularly wanted to look at. These were independent of any experiment, designated experiment, and I entered them as a function of time, and that seemed to work very well for me.
    text: |-
      Harrison Schmitt added pen and ink cues along the margins of the Apollo 17 Flight Plan for observational targets he wanted to look at, entered as a function of time, independent of any designated experiment.
  - id: e18745b6-3cfa-4c95-aa5e-cd1029050bd4
