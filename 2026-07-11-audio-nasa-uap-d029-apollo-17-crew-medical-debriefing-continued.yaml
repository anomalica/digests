        name: Harrison Schmitt's Apollo 17 Crew Notebook
    quote: |-
      I eventually did some sketching on it post-TEI. I think there are about five specific points that I labeled as areas, A, B, C, D, maybe E. And these are referenced on my crew notebook in my crew notebook for specific observations.
    text: |-
      Harrison Schmitt sketched about five specific areas, labelled A through E, on the orbit monitor chart after trans-Earth injection, referenced in his crew notebook for specific observations.
