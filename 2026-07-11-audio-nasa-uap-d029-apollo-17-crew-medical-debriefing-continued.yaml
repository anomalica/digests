        name: Harrison Schmitt
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      and all other lunar surface gear was up-to-date for most of the 12-month training period, or the final 12 months of the training period.
    text: |-
      All other Apollo 17 lunar surface gear was up-to-date for most of the final twelve months of the training period.
  - id: 6adef4b0-890e-4be8-9675-713a721229f0
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
