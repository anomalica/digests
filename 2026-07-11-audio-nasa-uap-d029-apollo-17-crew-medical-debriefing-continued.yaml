      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:22:39.4-00:23:14.2
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: ae5d2efd-f3df-47d4-9ad6-781323677e47
        name: Command and Service Module (CSM)
      - id: b2e744a4-1f5c-45b8-8234-e286377ce430
        name: Lunar Module (LM)
    quote: |-
      I think this includes the number of extracurricular hours that the LIM people and the e-coms for the CSM in particular put in with me on Saturdays and other times, just generally talking over systems and techniques, mission rules, and that was a major factor in helping me understand and keep up to speed on those items.
    text: |-
      Lunar Module personnel and CSM electrical/communications officers put in significant extracurricular hours with Harrison Schmitt on Saturdays and other times discussing systems, techniques, and mission rules, which helped him stay up to speed.
  - id: 8e44b3b3-a732-468f-b52a-33a1cdc92562
    type: opinion
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:23:22.3-00:23:33.4
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: b2e744a4-1f5c-45b8-8234-e286377ce430
        name: Lunar Module (LM)
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      In fact, as they essentially did it, they did the design of the emergency cue cards that we did for Apollo 17 for the LEM was a major contribution.
    text: |-
      Mission control personnel designed the emergency cue cards used for the Apollo 17 Lunar Module, which Harrison Schmitt considers a major contribution.
  - id: 212032f0-51b9-47a7-a95f-ea2540aa367a
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: false
    location: 00:23:34.7-00:23:47.8
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
      - id: b2e744a4-1f5c-45b8-8234-e286377ce430
        name: Lunar Module (LM)
      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Although, fortunately, we did not use them, they still made it possible to understand very quickly systems problems and to solve those problems in the simulations.
    text: |-
      The Apollo 17 crew did not end up using the emergency cue cards for the Lunar Module, but they still helped the crew understand systems problems quickly and solve them in simulations.
  - id: f8b76919-0399-403f-917e-021ac3215bbc
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
