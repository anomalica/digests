      - id: 8671e6b7-b36f-418a-a532-8a67c5f91010
        name: Apollo 17
    quote: |-
      Gas water separator didn't work very effectively, and I'm sure that's been discussed elsewhere.
    text: The gas-water separator did not work very effectively during Apollo 17.
  - id: 10259b7f-3e2e-4307-b82a-a47aceb9a927
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
      name: Harrison Schmitt
    provenance_chain:
      origin_kind: speaker
      origin: Harrison Schmitt
    attribution_in_text: true
    location: 00:46:30.9-00:46:49.2
    refs:
      - id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
        name: Harrison Schmitt
    quote: |-
      Intensity of thirst during admission, never really thirsty, extensively thirsty, even during the EVAs, although I did stop to take a drink of water occasionally. But I never drank all the water in the in-flight drink bag, in-suit drink bag.
    text: |-
      Harrison Schmitt was never extensively thirsty during the mission, even during extravehicular activities (EVAs), though he stopped to drink water occasionally and never drank all the water in the in-suit drink bag.
  - id: fc4964a8-6a18-4b48-9fa5-ce1088e33b30
    type: observation
    attestation: first_hand
    speaker:
      id: ff26748c-1f2d-4563-bbd4-1e7cbf5f2ec5
