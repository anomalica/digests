    name: |-
      Anomalous Phenomena in Space Shuttle Mission STS-80 Video (Mark J. Carlotto, 2005)
  quote: |-
    Analysis of video from Space Shuttle mission STS-80 provides new insight into a number of unusual events captured by a camera aboard the space shuttle Columbia in 1996. Three different phenomena are analyzed: 1) two slow moving circular objects, 2) a number of fast moving objects in space near the shuttle, and 3) a strange luminous apparition near the earth's surface.
  text: |-
    Analysis of video from Space Shuttle mission STS-80, recorded by a camera aboard the Space Shuttle Columbia in 1996, examines three different phenomena: two slow-moving circular objects, a number of fast-moving objects in space near the shuttle, and a luminous apparition near the earth's surface.
