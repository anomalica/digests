  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    that preceded the actual sighting, which I've seen the well-described type of vehicles often round saucer-shaped, crescent-shape, whatever you will, of the men there.
  text: |-
    Barney and Betty Hill described the sighted vehicle as often round, saucer-shaped or crescent-shaped, with men aboard.
- id: 19e1200d-7c88-44c7-a434-43b5ff570b8f
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:08:54.2-00:09:00.8
  refs:
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    They were trying to determine what it was. They thought of a plane, of a Piper Cub, various things like that.
  text: |-
    Barney and Betty Hill initially tried to determine what the sighted object was, considering it might be a plane or a Piper Cub.
- id: 3783bed3-e007-44ff-a1cb-961aafd5e85b
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
