    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:09:01.2-00:09:08.8
  refs:
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  quote: |-
    Barney did not show strong convictions that it was anything but some wayward plane or what you will.
  text: |-
    Barney Hill did not show strong conviction that the sighted object was anything other than a wayward plane.
- id: b8368518-9569-4f38-868c-5fbbe3fa5860
