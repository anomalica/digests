    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  quote: Betty stayed in the car for the most part.
  text: |-
    Betty Hill stayed in the car for most of the sighting while Barney Hill was outside.
- id: a3b161eb-de6c-4418-bdf5-f9f5bc46ac85
  type: testimony
  attestation: first_hand
  speaker:
