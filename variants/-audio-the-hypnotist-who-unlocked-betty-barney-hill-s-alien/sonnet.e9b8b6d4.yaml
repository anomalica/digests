  text: |-
    Under hypnosis, Barney Hill described a state of intense fear before the sighting in which he groveled on the ground and screamed with terror, near some lonely woods where he feared bears might come out and harm him.
- id: 703f7bed-7808-4270-b5e3-9909752dc681
