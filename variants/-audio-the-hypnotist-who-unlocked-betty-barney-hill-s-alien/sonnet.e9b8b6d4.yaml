  quote: Thier little dog, Delphi, was frightened.
  text: Betty and Barney Hill's dog, Delphi, was frightened during the sighting.
- id: a0782016-777b-4e5f-8360-89090b0c164b
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:09:19.5-00:09:33.4
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 951fcce1-6f63-4ad2-98cd-7eea58cda395
    name: Unidentified Flying Object (UFO)
  quote: |-
    It seemed to me she was much more anxious about Barney out on the road and sort of walking away and then back to the car. Then she wasn't about what they saw, though she herself thought that it was some sort of UFO.
  text: |-
    Benjamin Simon observed that Betty Hill was more anxious about Barney Hill walking away from and back to the car than about what they had seen, though she herself thought it was some sort of UFO.
- id: be4254d0-3660-41ae-9f8c-533200740fc3
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:09:33.7-00:09:35.6
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 951fcce1-6f63-4ad2-98cd-7eea58cda395
    name: Unidentified Flying Object (UFO)
  quote: She had much more conviction on that than Barney.
  text: |-
    Betty Hill had much more conviction that the sighted object was a UFO than Barney Hill did.
- id: a3c395dd-667e-4ca9-9de6-63767bb96c7c
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:10:18.5-00:10:29.3
  refs:
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  quote: |-
    I finished Barney on a sort of a note of exaltation. His fears were quieted, and he was feeling better...He had been through an experience and took a deep breath and went home.
  text: |-
    Barney Hill's hypnosis session ended on a note of exaltation, with his fears quieted and feeling better, after which he took a deep breath and went home in his account.
- id: 4137d5a3-2c92-4045-9431-1d2f0666fb0a
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:10:39.2-00:10:52.2
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  quote: |-
    Betty's story and Barnie's were the same. She, being a different personality, gave a little more gandy to it and so on, didn't show as much terror, and she went much further than Barney
  text: |-
    Betty Hill's story matched Barney Hill's story up to the point of the sighting, but she gave more detail and showed less terror, and continued the narrative further than Barney did.
- id: ef42e44d-3cce-42e0-900d-3bd910ed5bbd
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:11:05.8-00:11:25.6
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: 951fcce1-6f63-4ad2-98cd-7eea58cda395
    name: Unidentified Flying Object (UFO)
  quote: |-
    Betty's story went on beyond that in telling the story of having been, that the UFO had landed, had made beeping sounds and had stalled their motor and various things of that sort and had caused silver-like spots to appear on their car.
  text: |-
    Betty Hill's account described the sighted UFO as landing, making beeping sounds, stalling their car's motor, and causing silver-like spots to appear on the car.
- id: 68b40266-8e53-474d-b890-7aed3b0421a9
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:11:30.6-00:11:47.9
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    men emerged from it, and I suppose everyone who has seen the movie had to see what the men were supposed to look like, a rather oriental cast and so on, a usual type of presumed extraterritorial visitors from wherever they may come.
  text: |-
    Betty Hill's account described men emerging from the landed UFO with a rather oriental cast, presumed to be extraterrestrial visitors.
- id: c3465329-c11a-4f7f-8fcb-c4be488fa564
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:11:49.0-00:12:12.6
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  quote: |-
    She went on with a fantastic story of having been taken aboard. She described Barney as, with his eyes closed, as sort of suspended between two men who were half dragging him along to the same vehicle, and she had her eyes open and did not have to be dragged, and she was taken along by what appeared to be the leader of the group
  text: |-
    Betty Hill's account described being taken aboard the UFO, with Barney Hill, his eyes closed, being half-dragged by two men to the vehicle while Betty walked with her eyes open, led by the apparent leader of the group.
- id: 2e19eaae-8aa6-4a0d-828a-94d8d7bfdb14
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:12:15.3-00:12:26.9
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  quote: |-
    They were separated. Barney was taken into a room, presumably for the same purpose as she was, into her room, that is an examination, and on board they conducted a physical examination of her
  text: |-
    In Betty Hill's account, she and Barney Hill were separated aboard the UFO, with Barney taken to a room for an examination presumably similar to the physical examination conducted on Betty.
- id: 41aaa783-a38b-4cec-beaf-10173e80943d
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:12:39.6-00:12:41.8
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: I believe implicitly in the honesty of these people
  text: |-
    Benjamin Simon says he believes implicitly in the honesty of Barney and Betty Hill.
- id: 6b58fd2e-cc62-4ea5-85dd-68ec4f22c495
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:12:51.4-00:12:53.0
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: There certainly was not psychotic hallucinations.
  text: |-
    Benjamin Simon did not consider Barney and Betty Hill's experience to be psychotic hallucination.
- id: 8057b129-1c4f-4540-bba4-524da71fc3c4
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:13:01.9-00:13:20.6
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    when she began to give all the experiences of being examined, taken aboard, reading maps, all sorts of things like that, I still didn't feel they were hallucinations in the more psychotic sense, but they certainly were a marked deviation from the very matter-of-fact things that had gone up to then.
  text: |-
    Benjamin Simon considers Betty Hill's account of being examined and taken aboard the UFO a marked deviation from the matter-of-fact accounts given up to that point, though not psychotic hallucination.
- id: ceb94734-e3e8-4357-80f7-36030104c196
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:14:12.3-00:14:28.4
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: 951fcce1-6f63-4ad2-98cd-7eea58cda395
    name: Unidentified Flying Object (UFO)
  quote: |-
    I must define UFO as I see it. It means an unidentified flying object, and that's all it means. It can be Mendel's balloons, weather balloons, misinterpreted, or anything else. It does not by its definition, imply visitation from out of space
  text: |-
    Benjamin Simon defines a UFO as simply an unidentified flying object, which can be a weather balloon or something misinterpreted, and whose definition does not by itself imply visitation from outer space.
- id: 7aa1ef4f-fbcc-4fdb-b95a-aa5c4c43c284
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:14:35.2-00:14:42.0
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: 951fcce1-6f63-4ad2-98cd-7eea58cda395
    name: Unidentified Flying Object (UFO)
  quote: |-
    I, too, have seen a couple of UFOs, and both of them became IFOs at a later time. That is, they became identified flying objects.
  text: |-
    Benjamin Simon says he has personally seen a couple of UFOs which both later became identified flying objects (IFOs).
- id: 8bcc1515-7d4c-4635-92a5-48523bbaafb2
  type: observation
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:15:02.7-00:15:24.5
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    up to the point of the sighting and those experiences, the two stories were exactly alike...Betty's experiences were far more vivid, fog there, and much more material there than Barney, who simply felt himself as being supportive with his eyes closed...Nothing of Betty's story, but nothing was in Barney's story.
  text: |-
    Benjamin Simon found that up to the point of the sighting, Barney and Betty Hill's stories were exactly alike, but from that point onward Betty's account of the abduction was far more vivid and detailed while Barney simply felt himself being supported with his eyes closed, and nothing in Betty's account of the abduction appeared in Barney's account.
- id: e056c5d9-2259-4999-a723-47739c18a877
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:15:54.2-00:15:58.8
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: 4d5f5888-1efb-4e47-99ab-eba6bdc48d32
    name: Betty and Barney Hill hypnotherapy sessions with Benjamin Simon
  quote: |-
    The question of validity came up much later when everything was over and we were going over the material.
  text: |-
    The question of whether the abduction story was valid came up later, after the hypnosis sessions were complete and the material was reviewed.
- id: fdcf03e4-faad-4392-925a-00e6373ab53e
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:16:04.3-00:16:16.9
  refs:
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    Both of them gave the same...It was not due to that abduction, which they suppose had taken place in the two hours and had been repressed on instruction from these visitors.
  text: |-
    Barney and Betty Hill both gave the same clear account that the missing two hours were due to an abduction which they supposed had taken place and had been repressed on instruction from the visitors.
- id: e39c3857-2d6f-41f7-99b4-661bcffe46d5
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:16:31.1-00:16:42.8
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    if it was true, they should be identical. Everything else was identical up until then. But now the question, they two were not alike, very markedly different.
  text: |-
    Benjamin Simon says that if the abduction story were true, two other people undergoing the same two-hour experience should give identical testimony, and everything else in the Hills' accounts was identical up to the point of the abduction, but the abduction accounts themselves were markedly different.
- id: fb68e512-0530-46b1-9a6b-fe9d4268a7bd
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: false
  location: 00:16:51.6-00:16:57.4
  refs:
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    Betty gave by far the most elaborate story, the needle in the navel and all the things which I can't stop to describe.
  text: |-
    Betty Hill's account included the detail of a needle being inserted into her navel during the examination aboard the UFO.
- id: ba725670-5d45-48e2-8476-9c445296aa88
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:17:22.8-00:17:34.3
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    Oh, everything you worked on was American style or American type instruments. And even in England, for example, while surgeons may do the same thing, the instruments may accomplish the same, and they're different.
  text: |-
    Benjamin Simon determined that some detail in the equipment described by Betty Hill in the examination aboard the UFO resembled American-style or American-type instruments, which raised questions for him.
- id: 6a99e37e-da18-450a-abf3-d5443aa99103
  type: opinion
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  provenance_chain:
    origin_kind: speaker
    origin: Benjamin Simon
  attribution_in_text: true
  location: 00:17:45.2-00:18:11.6
  refs:
  - id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
    name: Benjamin Simon
  - id: b34d61e6-617c-4ade-84eb-778f68c643dd
    name: Barney Hill
  - id: 8a339318-fa8d-4b03-8019-2f485457aa0f
    name: Betty Hill
  quote: |-
    the turning point was, again, as I said, that difference in their two stories. And the second realization that Betty gave a very elaborate story...and Barney gave a minimal story that everything that occurred with Barney was known to Betty and nothing of Betty was known to Barney. Then I realized that there had to be some substance, something behind that difference.
  text: |-
    Benjamin Simon determined that the difference between Barney Hill's minimal account and Betty Hill's elaborate account of the abduction was the turning point that led him to look for an explanation of the story's origin.
- id: 99f13aa6-b641-4797-9f17-eee6ddab3c95
  type: testimony
  attestation: first_hand
  speaker:
    id: 959346ec-29ba-4c9d-96af-7d52ceb8d239
