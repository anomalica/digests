    name: Project Blue Book
  quote: |-
    They also noted that vapor or condensation trails from jet aircraft will sometimes appear to glow fiery red or orange when reflecting sunlight.
  text: |-
    Project Blue Book staff noted that vapour or condensation trails from jet aircraft will sometimes appear to glow fiery red or orange when reflecting sunlight.
