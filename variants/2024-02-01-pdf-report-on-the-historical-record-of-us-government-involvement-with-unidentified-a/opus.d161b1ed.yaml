  location: char:43457-43620
  refs:
  - id: cd5f4528-0592-47aa-8049-247686927e28
    name: Project Blue Book
  quote: |-
    **Balloons:** These included weather balloons, radiosondes, and large research balloons with diameters up to 300 feet, which together accounted for several thousand cases.
  text: |-
    Project Blue Book attributed several thousand UFO cases to balloons, including weather balloons, radiosondes, and large research balloons with diameters up to approximately 90 metres.
