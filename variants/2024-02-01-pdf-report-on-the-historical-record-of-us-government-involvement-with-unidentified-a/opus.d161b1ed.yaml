    name: Project Blue Book
  quote: |-
    **Astronomical Sightings**: These consisted of bright stars, planets, comets, fireballs, meteors, auroral streamers, and other celestial bodies. When observed through haze, light fog, moving clouds, or other obscurations or unusual conditions, the planets - including Venus, Jupiter and Mars - were often reported as UFOs.
  text: |-
    Project Blue Book classified astronomical sightings - bright stars, planets, comets, fireballs, meteors, auroral streamers, and other celestial bodies - as a category of identified UFO reports, noting that when observed through haze, light fog, moving clouds or other obscurations, the planets Venus, Jupiter and Mars were often reported as UFOs.
- id: 65b623e6-7bdf-4254-ab58-9a55f7bcbe18
  type: observation
  attestation: second_hand
  provenance_chain:
    origin_kind: document
    origin: |-
