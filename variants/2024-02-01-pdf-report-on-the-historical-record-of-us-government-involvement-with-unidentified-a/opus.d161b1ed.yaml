    name: Project Blue Book
  quote: |-
    **Aircraft:** According to Project BLUE BOOK, various aircraft accounted for another major source of UFO reports; particularly during adverse weather conditions. The staff noted that when observed at high altitudes and at a distance, the reflection of the sun on aircrafts' surfaces can make them appear as "disc" or "rocket-shaped."
  text: |-
    According to Project Blue Book, various aircraft accounted for another major source of UFO reports, particularly during adverse weather conditions, with sun reflection on aircraft surfaces at high altitude and distance making them appear disc- or rocket-shaped.
