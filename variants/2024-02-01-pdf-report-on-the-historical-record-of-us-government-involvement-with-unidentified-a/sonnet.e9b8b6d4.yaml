  - id: 4b8970fb-f60b-44f7-bade-ad0953dce49e
    name: The Reliability of Eyewitness Testimony
  quote: |-
    A person who reports a case might be credible, in that they believe the elements of their account to be accurate. However, their reliability, which is their ability to accurately interpret events - as well as to recall and convey those events due to a range of factors - is altogether different from their inherent sincerity.
  text: |-
    A person who reports a case might be credible, in that they believe the elements of their account to be accurate, but their reliability - their ability to accurately interpret, recall, and convey events - is altogether different from their inherent sincerity.
