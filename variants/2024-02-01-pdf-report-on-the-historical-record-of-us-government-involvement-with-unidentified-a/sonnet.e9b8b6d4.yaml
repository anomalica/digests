  attribution_in_text: false
  location: char:18678-18993
  refs:
  - id: b66f0731-a4eb-40c9-aac2-00e5584ece41
    name: 'Eyewitness Testimony: A Psychological and Legal Perspective'
  - id: 8e6acb2f-fb89-4aee-b45b-9011a45d522a
