    Radio broadcaster Frank Edwards claimed in a 1966 book that a piece of a UFO was recovered near Washington, D.C. in the summer of 1952 during the spike in UFO sightings over the U.S. Capitol in July and August, when he alleged that a United States Navy jet fired on a 0.6-metre diameter glowing disc and dislodged a 0.45-kilogram fragment that was recovered by a ground team.
