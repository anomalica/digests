    quote: |-
      But I don't have you in the sextant. That's okay. Your blinking light's just not blinking, that's all.
    text: |-
      During the Apollo 12 mission, at GET 06:00:21, Dick Gordon told the Apollo 12 Lunar Module Intrepid crew that he did not have them in the sextant and that their blinking tracking light was not blinking.
