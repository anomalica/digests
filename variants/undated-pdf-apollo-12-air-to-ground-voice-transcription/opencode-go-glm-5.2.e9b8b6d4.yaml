    quote: |-
      I'm getting an all 8's flash on both the address and the information registers at about one-fifth the brilliance of the normal numbers. And a - It's pulsing every second.
    text: |-
      During the Apollo 12 mission, Al Bean observed an all-8s flash on both the address and information registers of the Data Entry and Display Assembly (DEDA) of the Abort Guidance System (AGS) at about one-fifth the brilliance of normal numbers, pulsing every second.
