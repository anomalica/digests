        name: Apollo 12 Command Service Module Yankee Clipper
    quote: |-
      Hey, Houston. It looks like our tracking light's burned out. Dick hasn't been able to find us in his sextant. And on the first nightside pass we had little bits and pieces floating along with us and we could tell that the tracking light was flashing on them. And we still have, I've presumed to think, bits and pieces floating along and nothing's flashing on them, so I'm pretty sure it burned out.
    text: |-
      During the Apollo 12 mission, Pete Conrad reported that the Apollo 12 Lunar Module Intrepid's tracking light appeared to have burned out, because on the first nightside pass bits and pieces floating along were illuminated by the flashing tracking light, but on a subsequent pass the bits and pieces were still floating along with nothing flashing on them.
