  quote: |-
    Roger. Your target is LM; T1 is 139:57:39; T2 is 140:02:38; {{illegible: south}} 05; latitude is minus 3 - -
  text: |-
    During Apollo 12, Manned Spacecraft Center (Houston Mission Control) passed Yankee Clipper (Apollo 12 Command and Service Module) a P22 tracking Pre-Advisory Data (PAD) with Intrepid (Apollo 12 Lunar Module) as the target, T1 at Ground Elapsed Time (GET) 139:57:39 and T2 at 140:02:38, with a latitude of minus 3.
