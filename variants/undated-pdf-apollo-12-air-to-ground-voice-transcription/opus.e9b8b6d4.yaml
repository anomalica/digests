  - id: 92fc19cc-23b3-49b8-8625-e49afc941cc2
    name: Jerry Carr
  quote: |-
    Clipper, Houston. We prefer that you terminate at LOS on this pass. ... That would be one less thing for us to keep track of prior to lift-off.
  text: |-
    Manned Spacecraft Center (Houston Mission Control) directed Yankee Clipper (Apollo 12 Command and Service Module) to terminate the battery charge at Loss of Signal (LOS) on that pass, to reduce the items to be tracked before lift-off.
