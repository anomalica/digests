  refs:
  - id: e79f0e72-c5d8-4a10-bcbf-6058f1b10339
    name: Apollo 12
  - id: 2ec7dc8a-6fca-48f7-a8c7-0f2dd8efc8e3
    name: Alan Bean
  - id: d9cda9ad-c97f-4dba-93ab-25e47dc7887d
    name: Abort Guidance System (AGS)
  - id: dd16cbb5-ddff-4475-8bb0-41b339007f93
    name: Intrepid (Apollo 12 Lunar Module)
  quote: |-
    Got sort of an interesting thing going on AGS right now. I didn't notice earlier, but it may just be because the lights are brighter now. I'm getting an all 8's flash on both the address and the information registers at about one-fifth the brilliance of the normal numbers. And a - It's pulsing every second.
  text: |-
    Alan Bean observed an all-8s flash on both the address and information registers of the Abort Guidance System (AGS) aboard Intrepid (Apollo 12 Lunar Module), at about one-fifth the brilliance of the normal numbers and pulsing every second.
