  location: char:2598-2868
  date: '1969-11-20'
  refs:
  - id: e79f0e72-c5d8-4a10-bcbf-6058f1b10339
    name: Apollo 12
  - id: 2ec7dc8a-6fca-48f7-a8c7-0f2dd8efc8e3
    name: Alan Bean
  - id: dab29567-0657-4f1d-958a-423394a4e05e
    name: Alignment Optical Telescope (AOT)
  - id: dd16cbb5-ddff-4475-8bb0-41b339007f93
    name: Intrepid (Apollo 12 Lunar Module)
  quote: |-
    When you look out the AOT in the dark quadrant? You can see these lights - particles of light, flashes of light just seem to come from - in this case, I'm looking in quadrant 1 which is the left one. It's coming from behind me, the left, and they're just sailing off in space.
  text: |-
    Alan Bean saw particles and flashes of light through the Alignment Optical Telescope (AOT) in the dark quadrant, looking through quadrant 1 on the left, with the lights coming from behind and to the left of him and sailing off into space.
- id: fa1dbea4-41cf-46be-9611-23e681a34490
  type: opinion
  attestation: first_hand
  speaker:
    id: 2ec7dc8a-6fca-48f7-a8c7-0f2dd8efc8e3
    name: Alan Bean
  provenance_chain:
    origin_kind: speaker
    origin: Alan Bean aboard Intrepid
  attribution_in_text: true
  location: char:2875-3046
  date: '1969-11-20'
  refs:
  - id: e79f0e72-c5d8-4a10-bcbf-6058f1b10339
    name: Apollo 12
  - id: 2ec7dc8a-6fca-48f7-a8c7-0f2dd8efc8e3
    name: Alan Bean
  - id: dab29567-0657-4f1d-958a-423394a4e05e
    name: Alignment Optical Telescope (AOT)
  - id: 0f46e036-3146-450a-a0fc-7e5761c8006e
    name: Moon
  quote: |-
    I was thinking they're dropping from my water boiler, but it looks like some of those things are escaping the Moon. They really haul out of here and just press off at the stars.
  text: |-
    Alan Bean initially thought the particles of light seen through the Alignment Optical Telescope (AOT) were dropping from his water boiler, but judged that some of them appeared to be escaping the Moon and moving rapidly away towards the stars.
