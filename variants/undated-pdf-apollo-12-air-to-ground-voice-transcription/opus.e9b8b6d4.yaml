  quote: |-
    Okay. And Jerry, will you find out what they want to do about this battery charge, because I'm using the bus ties during the rendezvous?
  text: |-
    Richard Gordon was using the bus ties aboard Yankee Clipper (Apollo 12 Command and Service Module) during the Apollo 12 lunar orbit rendezvous and asked Jerry Carr what should be done about the battery charge.
