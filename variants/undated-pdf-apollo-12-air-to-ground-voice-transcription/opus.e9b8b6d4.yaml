  - id: d9cda9ad-c97f-4dba-93ab-25e47dc7887d
    name: Abort Guidance System (AGS)
  quote: If I turn down the illumination level just a little bit, it's not noticeable.
  text: |-
    Alan Bean found the all-8s flash on the Abort Guidance System (AGS) registers was not noticeable when he turned the illumination level down slightly.
