  quote: |-
    If you will give us P00 and ACCEPT, we'll give you a CSM state vector and RLS update.
  text: |-
    During Apollo 12, Manned Spacecraft Center (Houston Mission Control) uplinked a Command and Service Module (CSM) state vector and a Radius of the Landing Site (RLS) update to Intrepid (Apollo 12 Lunar Module) after the crew set the computer to P00 and ACCEPT.
