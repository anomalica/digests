  - id: 46e3e548-87a1-4cbf-bb68-9b5abb96ae0c
    name: Yankee Clipper (Apollo 12 Command and Service Module)
  quote: |-
    All right; I could let it go until I ... just before lift-off. That way it might take it all the way up.
  text: |-
    Richard Gordon suggested that letting the Yankee Clipper (Apollo 12 Command and Service Module) battery charge run until just before lift-off might charge the battery fully.
