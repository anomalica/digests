  quote: |-
    He and I have both seen that phenomena on your DEDA during testing of most all the spacecrafts up at Bethpage, and it's probably an EMI.
  text: |-
    Jerry Carr considered the all-8s flash on the Data Entry and Display Assembly (DEDA) of Intrepid (Apollo 12 Lunar Module) probably to be Electromagnetic Interference (EMI).
