    quote: |-
      also, Yankee Clipper informs me he has the television all set up. When we come around the {{illegible: horn}}, we'll come around with the television on in VOX.
    text: |-
      Dick Gordon reported that he had the television equipment set up aboard the Command and Service Module Yankee Clipper and ready for transmission via Voice Operated Transmit (VOX) during the lunar horizon pass.
