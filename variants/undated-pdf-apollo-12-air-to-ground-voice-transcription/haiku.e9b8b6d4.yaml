        name: Command and Service Module Yankee Clipper
    quote: |-
      Yankee Clipper, Houston. Why don't you figure on terminating the battery charge at LOS?
    text: |-
      Mission Control Center, Houston recommended terminating battery charge on the Command and Service Module Yankee Clipper at Loss of Signal (LOS) during the lunar orbit pass.
  - id: 0cbde6c6-dfe9-4e92-ab7a-9144a0214cd7
    type: administrative
    provenance_chain:
      origin_kind: unattributed
      origin: Apollo 12 mission control operations
    attribution_in_text: false
