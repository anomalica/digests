        name: Lunar Module Intrepid
    quote: |-
      Our electrical watchers say that the current indicates that your tracking light is on.
    text: |-
      Mission Control Center, Houston electrical telemetry analysis indicated that the Lunar Module Intrepid tracking light current remained positive, suggesting the light remained active.
