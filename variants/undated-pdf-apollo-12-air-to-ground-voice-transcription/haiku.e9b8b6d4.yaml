    quote: |-
      Roger, Al. Fredo is here. He and I have both seen that phenomena on your DEDA during testing of most all the spacecrafts up at Bethpage, and it's probably an EMI.
    text: |-
      A technician from Mission Control Center, Houston reported that the Data Entry and Display Assembly (DEDA) anomaly observed on the Lunar Module Intrepid had been witnessed during testing of most spacecraft at Grumman Aircraft Engineering Corporation in Bethpage, New York, and was likely caused by electromagnetic interference (EMI).
