      origin: Alan Bean
    attribution_in_text: false
    location: char:2875-2985
    date: '1969-11-19'
    refs:
      - id: 5be31b3f-14e6-471b-a607-a45dd950ce77
        name: Alan Bean
      - id: fb3a64cb-66ed-45de-b606-e2e4a987b6f9
        name: Lunar Module Intrepid
      - id: 4e0bac07-a264-4475-8888-438be8edb764
        name: Moon
    quote: |-
      I was thinking they're dropping from my water boiler, but it looks like some of those things are escaping the Moon.
    text: |-
      Alan Bean considered that the lights observed through the Alignment Optical Telescope (AOT) could possibly derive from the water boiler vent but appeared to be escaping the lunar surface.
