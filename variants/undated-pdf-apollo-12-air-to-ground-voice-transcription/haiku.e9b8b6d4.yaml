    quote: You're flying through the air backwards, then, Pete, because I don't see it.
    text: |-
      Dick Gordon reported from the Command and Service Module Yankee Clipper that he could not see the tracking light on the Lunar Module Intrepid despite Mission Control Center, Houston's telemetry indication that it was active.
