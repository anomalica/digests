        name: Lunar Module Intrepid
      - id: cd9ea241-eb2a-439e-aa6a-4102009c6b49
        name: Data Entry and Display Assembly (DEDA)
    quote: |-
      Got sort of an interesting thing going on AGS right now. I didn't notice earlier, but it may just be because the lights are brighter now. I'm getting an all 8's flash on both the address and the information registers at about one-fifth the brilliance of the normal numbers. And a - It's pulsing every second.
    text: |-
      Alan Bean reported an anomalous display on the Abort Guidance System (AGS) Data Entry and Display Assembly (DEDA) showing all 8's flashing on both address and information registers at approximately one-fifth the brightness of normal numbers, pulsing every second.
