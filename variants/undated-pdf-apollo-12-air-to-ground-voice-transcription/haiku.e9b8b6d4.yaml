      origin: Pete Conrad
    attribution_in_text: true
    location: char:5421-5701
    date: '1969-11-20'
    refs:
      - id: 81941004-dca2-4c38-bda9-a563151d1596
        name: Pete Conrad
      - id: fb3a64cb-66ed-45de-b606-e2e4a987b6f9
        name: Lunar Module Intrepid
      - id: 4e0bac07-a264-4475-8888-438be8edb764
        name: Moon
    quote: |-
      On the first nightside pass we had little bits and pieces floating along with us and we could tell that the tracking light was flashing on them. And we still have, I've presumed to think, bits and pieces floating along and nothing's flashing on them, so I'm pretty sure it burned out.
    text: |-
      Pete Conrad observed that during the first lunar nightside pass, the tracking light on the Lunar Module Intrepid was flashing on debris particles floating alongside, indicating it was functioning; in the current pass, similar debris was observed without flashing light, confirming the tracking light had burnt out.
