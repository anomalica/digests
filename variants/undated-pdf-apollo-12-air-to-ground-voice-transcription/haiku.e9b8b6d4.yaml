      origin: Alan Bean
    attribution_in_text: true
    location: char:2598-3046
    date: '1969-11-19'
    refs:
      - id: 5be31b3f-14e6-471b-a607-a45dd950ce77
        name: Alan Bean
      - id: fb3a64cb-66ed-45de-b606-e2e4a987b6f9
        name: Lunar Module Intrepid
      - id: 4e0bac07-a264-4475-8888-438be8edb764
        name: Moon
    quote: |-
      When you look out the AOT in the dark quadrant? You can see these lights - particles of light, flashes of light just seem to come from - in this case, I'm looking in quadrant 1 which is the left one. It's coming from behind me, the left, and they're just sailing off in space. I was thinking they're dropping from my water boiler, but it looks like some of those things are escaping the Moon. They really haul out of here and just press off at the stars.
    text: |-
      Alan Bean reported observing particles of light and flashes of light through the Alignment Optical Telescope (AOT) in the dark quadrant of the Lunar Module Intrepid, originating from behind and to the left, appearing to escape from the Moon towards space.
  - id: 45b217b1-1222-40e9-989c-4e76724572c8
    type: observation
    attestation: first_hand
    speaker:
      id: 5be31b3f-14e6-471b-a607-a45dd950ce77
      name: Alan Bean
    provenance_chain:
