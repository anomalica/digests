      - id: f3a4be8f-e41d-4165-8581-4044679b575e
        name: Command and Service Module Yankee Clipper
    quote: |-
      Clipper, Houston. We prefer that you terminate at LOS on this pass. / Roger. That would be one less thing for us to keep track of prior to lift-off.
    text: |-
      Mission Control Center, Houston preferred terminating battery charge at Loss of Signal (LOS) on the current pass to reduce pre-lift-off tracking requirements.
  - id: d6a61405-4b96-4d55-bd49-e16fbab1e44a
    type: observation
    attestation: first_hand
    speaker:
      id: 5be31b3f-14e6-471b-a607-a45dd950ce77
      name: Alan Bean
    provenance_chain:
