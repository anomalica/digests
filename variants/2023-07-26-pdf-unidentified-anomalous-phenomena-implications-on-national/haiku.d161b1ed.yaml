        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      there is a small bit of anger, I would say, I would feel if those pilots are still facing that difficulty in reporting this topic and they do not have the tools to be able to mitigate this issue. It just goes to show how serious this is and why this is such an important issue for our pilots and for our Nation.
    text: |-
      Ryan Graves expresses concern that pilots involved in Unidentified Anomalous Phenomena (UAP) sightings continue to face difficulties in reporting these incidents and lack adequate tools to mitigate associated difficulties, contributing to ongoing stigma and reluctance to report observations.
  - id: 743c5c58-164d-4869-9ada-459747175c0a
    type: hearsay
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: test pilots at Eglin Air Force Base
      origin_ref: eglin-test-pilots
      relay:
        - Matt Gaetz in congressional hearing
    attribution_in_text: true
    location: char:113918-114200
    date: '2023-04-26'
    refs:
      - id: f1464979-1b09-4a27-8498-a048e0834b63
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      It was stated explicitly to me by these test pilots that if you have a UAP experience the best thing you can do for your career is forget it and not tell anyone because any type of reporting, either above the surface or below the surface, does have a perceived consequence to these people
