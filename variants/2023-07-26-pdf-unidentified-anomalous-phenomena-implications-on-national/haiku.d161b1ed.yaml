        name: Gimbal Video
    quote: |-
      The recording on the AT FLIR system shows a single object that rotates. You hear the pilots refer to a fleet of objects that is not visible on the FLIR system and that was something that I witnessed during the debrief as part of the radar data on the situational awareness page.
    text: |-
      During the Gimbal video incident, forward-looking infrared (FLIR) sensor footage shows a single rotating object, whilst pilots in radio communications reference a fleet of multiple objects not visible on the FLIR system, as confirmed by Ryan Graves who reviewed radar data during the operational debrief.
  - id: 423ca17f-254a-489f-a137-68aafc79edf1
    type: opinion
