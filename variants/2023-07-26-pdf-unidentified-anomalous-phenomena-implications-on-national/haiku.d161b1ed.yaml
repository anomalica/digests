        name: USA, Florida, Eglin Air Force Base
    quote: |-
      We asked to see any of the evidence that had been taken by flight crew in this endeavor and to observe any radar signature as long as-as well as to meet with the flight crew. We were not afforded access to all of the flight crew and initially we were not afforded access to images and to radar. Thereafter, we had a bit of a discussion about how authorities flow in the United States of America and we did see the image and we did meet with one member of the flight crew who took the image.
    text: |-
      Representatives Matt Gaetz, Tim Burchett, and Anna Paulina Luna were initially denied access to imagery and radar signatures related to a Unidentified Anomalous Phenomena (UAP) incident at Eglin Air Force Base, though they subsequently obtained access to one image and met with one flight crew member.
  - id: 560896fc-09b9-493a-a7ef-3c8d81eb7fc9
    type: testimony
    attestation: first_hand
    speaker:
      id: 986c925c-aaa8-4cae-a842-8e8f5f9a3d31
      name: Gaetz, Matt
    provenance_chain:
      origin_kind: speaker
      origin: Matt Gaetz
    attribution_in_text: false
    location: char:110808-111138
    date: '2023-04-26'
    refs:
      - id: 986c925c-aaa8-4cae-a842-8e8f5f9a3d31
        name: Gaetz, Matt
    quote: |-
      The image was of something that I am not able to attach to any human capability either from the United States or from any of our adversaries and I am somewhat informed on the matter having served on the Armed Services Committee for 7 years, having served on the committee that oversees DARPA and advanced technologies for several years.
    text: |-
      Representative Matt Gaetz, having served on the United States House Armed Services Committee for 7 years and on the committee overseeing advanced technologies for several years, observed imagery of an unidentified object that he cannot attribute to any known human capability from the United States or its adversaries.
  - id: 752353c7-ae09-454b-a2f6-d6573f0fadd0
    type: testimony
    attestation: first_hand
    speaker:
      id: 986c925c-aaa8-4cae-a842-8e8f5f9a3d31
      name: Gaetz, Matt
    provenance_chain:
      origin_kind: speaker
      origin: Matt Gaetz
    attribution_in_text: false
