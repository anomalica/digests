        name: United States Congress
    quote: |-
      they saw a sequence of four craft in a clear diamond formation for which there is a radar sequence that I and I alone have observed in the U.S. Congress.
    text: |-
      Representative Matt Gaetz has observed a radar sequence depicting four craft arranged in a clear diamond formation during the Eglin Air Force Base test mission, and states he is the only member of the United States Congress to have observed this particular radar signature.
