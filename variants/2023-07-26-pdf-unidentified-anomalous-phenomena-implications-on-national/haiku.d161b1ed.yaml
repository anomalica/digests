    quote: |-
      One of the pilots goes to check out that diamond formation and sees a large floating, what I can only describe as an orb, again, like I said, not of any human capability that I am-that I am aware of.
    text: |-
      During the Eglin Air Force Base test mission, a pilot investigating the diamond formation of craft encountered a large, spherical Unidentified Anomalous Phenomena (UAP) object described as an 'orb', which the pilot reported as unlike any known human-developed aircraft.
  - id: 1e4d6fbb-0c03-468a-9292-390ce2aac48d
    type: testimony
    attestation: first_hand
    speaker:
      id: 986c925c-aaa8-4cae-a842-8e8f5f9a3d31
