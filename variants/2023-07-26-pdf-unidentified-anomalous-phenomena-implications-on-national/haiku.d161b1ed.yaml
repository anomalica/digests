    quote: |-
      I sought a briefing regarding that episode and brought with me Congressman Burchett and Congresswoman Luna.
    text: |-
      Representatives Matt Gaetz, Tim Burchett, and Anna Paulina Luna sought a classified briefing regarding a Unidentified Anomalous Phenomena (UAP) incident at Eglin Air Force Base.
  - id: a7359150-20c9-4b0f-b369-ebf3db5bae39
    type: testimony
    attestation: first_hand
    speaker:
      id: 986c925c-aaa8-4cae-a842-8e8f5f9a3d31
      name: Gaetz, Matt
    provenance_chain:
      origin_kind: speaker
      origin: Matt Gaetz
    attribution_in_text: false
    location: char:110315-110800
    date: '2023-04-26'
    refs:
