        name: Gaetz, Matt
    quote: |-
      They were out on a test mission that day over the Gulf of Mexico and when you are on a test mission you are supposed to have clear airspace. Not supposed to be anything that shows up.
    text: |-
      During a test mission over the Gulf of Mexico at Eglin Air Force Base, pilots were operating in clear airspace with no other traffic expected, as is required for classified weapons testing missions.
