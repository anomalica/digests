    quote: |-
      when he approached he said that his radar went down. He said that his FLIR system malfunctioned and that he had to manually take this image from one of the lenses and it was not automated in collection as you would typically see in a test mission.
    text: |-
      When a pilot at Eglin Air Force Base approached an Unidentified Anomalous Phenomena (UAP) object, the aircraft's radar system malfunctioned and the forward-looking infrared (FLIR) system failed, requiring the pilot to manually photograph the object instead of using automated sensor collection methods.
  - id: c34793e5-18cf-4baf-8c12-3998a0acc05c
    type: opinion
    attestation: first_hand
    speaker:
      id: ac8e4354-c61a-4769-93ee-da44ac44648d
