    text: |-
      The ability to disable sensors and radar systems during close approach by Unidentified Anomalous Phenomena (UAP) represents a significant national security concern, according to Commander David Fravor.
  - id: 6f2fc58f-9d41-443b-be6e-9e1dd6cfb87f
    type: testimony
