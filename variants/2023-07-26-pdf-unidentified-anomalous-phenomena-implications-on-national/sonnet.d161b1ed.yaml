    name: Graves, Ryan
  - id: 1fac194e-10f9-4c37-b121-1c5607504c96
    name: Unidentified Anomalous Phenomena (UAP)
  quote: |-
    So, there was a large number of my colleagues that were detecting these objects off the Eastern Seaboard. They were further correlating that information with their other onboard sensors and many of them also had their own eye sightings as well of these objects.
  text: |-
    A large number of Ryan Graves's colleagues detected Unidentified Anomalous Phenomena off the Eastern Seaboard and correlated the radar detections with other onboard sensors and their own eye sightings.
