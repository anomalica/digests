  text: |-
    David Grusch considers that Unidentified Anomalous Phenomena information from 20 years ago or earlier should not be withheld from the public unless it shows a specific national security vulnerability relating to a weakness in a particular defence system.
- id: 97ec7df4-e173-4b48-a0aa-2465fc6ba282
  type: testimony
  attestation: first_hand
