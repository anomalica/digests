  - id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  quote: |-
    I think the most vivid sighting of that would have been a near mid-air that we had at the entrance to our working area. One of these objects was completely stationary at the exact entrance to our working areas, not only geographically but also altitude. So, it was right where all the jets are going, essentially, on the Eastern Seaboard.
  text: |-
    Ryan Graves describes the most vivid sighting he knows of a cube-like object as a near mid-air encounter in which a stationary object was positioned exactly at the entrance to the squadron's working area off the Eastern Seaboard of the United States, both geographically and in altitude.
