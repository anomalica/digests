  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: b7603648-1fda-47e8-96a9-105fc86b0d8d
    name: USA, California, San Diego
  - id: 3b1eeb4c-b8e3-494d-b0ff-56c9a4c50d59
    name: USS Nimitz
  quote: |-
    We were at a work up with all the battle groups. So, we integrate the ships with the carrier, the airwing with the carrier, and we start working.
  text: |-
    On 2004-11-14, David Fravor was off the coast of San Diego, California participating in a work-up integrating ships and the carrier airwing with the USS Nimitz carrier group.
- id: c15d392e-b316-4de9-ad10-8f879222ec59
  type: testimony
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:121819-122145
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: af497c22-c09e-456e-9e10-886be0005a7c
    name: USS Princeton
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    So, we were doing an air to air defense to hone not only our skills but those of the USS Princeton when they had been tracking them for 2 weeks. The problem was that there was never manned aircraft airborne when they were tracking them and this was the first day and, unfortunately, we were the ones airborne and went and saw it.
  text: |-
    The USS Princeton had been tracking the Tic Tac object for two weeks before David Fravor's squadron encountered it on 2004-11-14, with no manned aircraft airborne during that tracking period until that day.
- id: 57f9ae7e-7a42-42ca-bcf6-be2c16947b1f
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:122300-122415
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: b7603648-1fda-47e8-96a9-105fc86b0d8d
    name: USA, California, San Diego
  quote: |-
    It was actually-if you are familiar San Diego, it was a perfect day, light winds, no whitecaps, clear skies. Not a cloud.
  text: |-
    The weather off San Diego on 2004-11-14 was clear with light winds, no whitecaps, and no clouds.
- id: 540976d3-29ef-43f5-a7a1-1be19ff2f764
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:122474-122551
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    Now, is it true that you saw, in your words, a 40-foot flying Tic Tac shaped object?
  text: David Fravor saw a flying Tic Tac-shaped object approximately 12 metres long.
- id: da75d2bf-9ca1-4035-803b-f2355fae66db
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:122578-122675
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    That is correct. For some people that cannot-know what a Tic Tac is it is a giant flying propane tank.
  text: |-
    David Fravor described the Tic Tac object as resembling a giant flying propane tank.
- id: 4fc37f08-806b-401d-8481-c2fce175bb6a
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:122801-122940
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: af497c22-c09e-456e-9e10-886be0005a7c
    name: USS Princeton
  - id: 3b1eeb4c-b8e3-494d-b0ff-56c9a4c50d59
    name: USS Nimitz
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    The Princeton tracked it. The Nimitz tracked it. The E2 tracked it. We never saw it on our radars. Our fire control radars never picked it up.
  text: |-
    The Tic Tac object was tracked by the USS Princeton, the USS Nimitz, and an E-2 aircraft, but never appeared on David Fravor's own aircraft's fire control radar.
- id: 00892ba0-4e15-4d82-9b84-77a9fabdf42f
  type: observation
  attestation: second_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: named
    origin: Chad, the pilot who filmed the Tic Tac object
    relay:
    - David Fravor
  attribution_in_text: false
  location: char:122945-123151
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 8bc487ee-9e5e-4abb-a60e-4f092c63a14e
    name: F/A-18
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    The other airplane that took the video did get it on a radar. As soon as it tried to lock it, it jammed the radar, spit the lock and he rapidly switched over to the targeting pod, which you can do in the F-18.
  text: |-
    When the pilot who filmed the Tic Tac object tried to lock radar onto it, the radar was jammed and lost the lock, prompting the pilot to switch to the targeting pod on the F/A-18.
- id: 5bd79b1e-0b18-4401-adb6-e91ef8d73a5d
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:123422-123657
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    No, there is none. There is no IR plume coming out and Chad, who took the video, went through all the EO, which is black and white TV and the I\&R modes and there is no visual signs of propulsion. It is just sitting in space at 20,000 feet.
  text: |-
    David Fravor observed no infrared plume or visual signs of propulsion from the Tic Tac object, which was hovering stationary at approximately 6,100 metres.
- id: c80ecfd0-7b4f-4ee6-b70d-2fd411c76723
  type: opinion
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:123680-123786
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    In your career have you ever seen a propulsion system that creates no thermal exhaust? Commander FRAVOR. No.
  text: |-
    David Fravor has never seen a propulsion system that creates no thermal exhaust, in his career, other than the Tic Tac object.
- id: 8382d157-4180-4ce3-8aaf-12b8c7a15a76
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:123872-124056
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    Abruptly, very determinant. It knew exactly what it was doing. It was aware of our presence and it had acceleration rates-I mean, it went from zero to matching our speed in no time at all.
  text: |-
    The Tic Tac object manoeuvred abruptly and with apparent awareness of the aircraft's presence, accelerating from a standstill to matching the aircraft's speed almost instantly.
- id: 58bfe7c6-4bbd-4eac-9fe6-99d7628b0f89
  type: opinion
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:124078-124228
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    Now, if the fastest plane on Earth was trained to do these maneuvers that you saw, would it be capable of doing that? Commander FRAVOR. No, not even close.
  text: |-
    David Fravor considers that the fastest plane on Earth would not be capable of performing the manoeuvres exhibited by the Tic Tac object.
- id: df1c4dab-f9f2-47f6-8b14-76c8b8ae52cf
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:124252-124330
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    And just to confirm, this object had no wings, correct? Commander FRAVOR. No wings.
  text: The Tic Tac object had no wings.
- id: 8d8f419b-25e7-44b6-bacb-938457e4c935
  type: observation
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:124430-124463
  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: No, and never felt threatened at all.
  text: |-
    David Fravor's aircraft was unarmed during the encounter with the Tic Tac object and he never felt threatened.
