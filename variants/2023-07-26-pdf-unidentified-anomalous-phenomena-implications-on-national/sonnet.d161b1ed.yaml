- id: a0a2945e-29ca-43aa-88e5-a0009b6afd8c
  type: testimony
  attestation: first_hand
  speaker:
    id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  provenance_chain:
