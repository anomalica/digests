  location: char:49624-49854
  refs:
  - id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  quote: |-
    Identifying friend from foe is very important to us, and so when we have unidentified targets, and we continue to ignore those due to a stigma or fear of what it could be that is an opening that our adversaries can take advantage of.
  text: |-
    Ryan Graves considers that ignoring unidentified targets due to stigma or fear creates an opening that adversaries can take advantage of.
- id: 5cb3bdc8-46bb-4097-b071-b84d00dc4f16
  type: opinion
  attestation: first_hand
  speaker:
    id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  provenance_chain:
    origin_kind: speaker
    origin: Ryan Graves
  attribution_in_text: false
  location: char:50002-50308
  refs:
  - id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  - id: 1fac194e-10f9-4c37-b121-1c5607504c96
    name: Unidentified Anomalous Phenomena (UAP)
  quote: |-
    There needs to be a location where this information is centralized for processing and there needs to be a two-way communication loop so the operators on the front end have a feedback and can get best practices on how to process information, what to do, and to ensure that their reporting is being listened to.
  text: |-
    Ryan Graves considers that a centralised location for processing Unidentified Anomalous Phenomena information with a two-way communication loop between operators and processors is needed to better respond to UAP encounters.
- id: 9ad9a56c-dfe3-482f-9f9a-8ab9a5059167
  type: testimony
  attestation: first_hand
  speaker:
    id: b1c6db2e-f79f-4aee-a240-4486c018950f
    name: Grusch, David Charles
  provenance_chain:
    origin_kind: speaker
