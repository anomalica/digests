  quote: No, because I was the commanding officer of the squadron. So, no.
  text: |-
    David Fravor was the commanding officer of his squadron at the time of the 2004 USS Nimitz Tic Tac UAP encounter, and no commanding officer provided justification for the lack of investigation.
- id: 08fd87e3-7990-4b58-8918-8d7c526917d8
  type: testimony
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
