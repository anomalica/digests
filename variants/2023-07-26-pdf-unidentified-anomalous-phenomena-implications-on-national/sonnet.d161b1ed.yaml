    name: Unidentified Anomalous Phenomena (UAP)
  quote: |-
    First, when we were first experiencing these objects off the Eastern Seaboard in the 2014 to 2015 time period, anyone that had upgraded their radar systems were seeing these objects.
  text: |-
    When pilots first began experiencing Unidentified Anomalous Phenomena off the Eastern Seaboard in the 2014 to 2015 period, anyone who had upgraded their radar systems began seeing these objects.
- id: d63f53ac-37c2-4a0f-ab35-dffb1cf22651
  type: testimony
  attestation: first_hand
  speaker:
    id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
    name: Graves, Ryan
  provenance_chain:
    origin_kind: speaker
    origin: Ryan Graves
  attribution_in_text: false
  location: char:52022-52275
  refs:
