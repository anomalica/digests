    name: Graves, Ryan
  quote: |-
    They are similar. Pilots-commercial pilots have less range and less sensors to be able to reach out and look for objects over wide swaths of airspace. And so pilots are seeing them. Commercial pilots are seeing them and they are typically closer and the range of what they are seeing is pretty large.
  text: |-
    Ryan Graves states that commercial pilots have also encountered similar sightings to those described by military pilots, but commercial pilots have less range and fewer sensors to detect objects over wide areas of airspace.
