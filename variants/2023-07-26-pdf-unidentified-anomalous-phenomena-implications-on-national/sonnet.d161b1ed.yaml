  - id: 3c28503f-12f3-474b-a659-981f88fd4004
    name: 2004 USS Nimitz Tic Tac UAP encounter
  - id: 3b1eeb4c-b8e3-494d-b0ff-56c9a4c50d59
    name: USS Nimitz
  quote: |-
    None. We had a standard debrief where the backseaters went down to our carrier intel center and briefed would have happened and that was it. No one else talked to us and I was in the top 20 in the battle group. No one came. That captain was aware. The admiral was aware. Nothing was done.
  text: |-
    After the 2004 USS Nimitz Tic Tac UAP encounter, David Fravor's squadron received only a standard debrief with the backseaters going to the carrier intelligence centre, and no further reporting took place.
- id: 93c6b663-9057-4267-865b-cb287e83b7b7
  type: testimony
  attestation: first_hand
  speaker:
