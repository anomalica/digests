    name: Grusch, David Charles
  - id: c5bdd4db-8be2-4865-92a4-be6d319e3c08
    name: Intelligence Community Inspector General
  - id: 1fac194e-10f9-4c37-b121-1c5607504c96
    name: Unidentified Anomalous Phenomena (UAP)
  - id: 4e8e7bbc-c62d-4eca-90f6-78703c8590fa
    name: PPD-19 urgent concern filing
  quote: |-
    As you know, the preponderance of my complaint was classified to the intelligence communities. Both material acquisition and exploitation activity, also baselining the UAPs but not sharing it with, you know, intelligence professionals that are actually doing step briefs to pilots, that kind of information.
  text: |-
    David Grusch's complaint to the Intelligence Community Inspector General included classified material about both material acquisition and exploitation activity related to Unidentified Anomalous Phenomena, as well as baselining UAP information not shared with intelligence professionals conducting step briefs to pilots.
