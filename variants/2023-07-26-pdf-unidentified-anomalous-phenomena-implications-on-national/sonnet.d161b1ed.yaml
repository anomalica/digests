  date: '2004-11-14'
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 3c28503f-12f3-474b-a659-981f88fd4004
    name: 2004 USS Nimitz Tic Tac UAP encounter
  quote: |-
    Mr. GROTHMAN. Was this incident the only UAP event that you encountered while you were a pilot? Commander FRAVOR. Yes, it was.
  text: |-
    The 2004 USS Nimitz Tic Tac UAP encounter was the only UAP event David Fravor encountered while he was a pilot.
- id: cbc78ecf-7534-4de7-afea-60cd39619b00
  type: opinion
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:49012-49130
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 1fac194e-10f9-4c37-b121-1c5607504c96
    name: Unidentified Anomalous Phenomena (UAP)
  - id: 3c28503f-12f3-474b-a659-981f88fd4004
    name: 2004 USS Nimitz Tic Tac UAP encounter
  quote: |-
    Yes, and here is why. The technology that we faced was far superior than anything that we had, and you could put that anywhere.
  text: |-
    David Fravor considers that Unidentified Anomalous Phenomena pose a potential threat to national security because the technology his crew faced during the 2004 USS Nimitz Tic Tac UAP encounter was far superior to anything the United States had.
- id: a4424b8a-7272-4849-aba3-3fb84a1cfdc4
  type: opinion
  attestation: first_hand
  speaker:
    id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  provenance_chain:
    origin_kind: speaker
    origin: David Fravor
  attribution_in_text: false
  location: char:49141-49393
  refs:
  - id: 6f3aa87b-1427-434c-9984-0e3ef23d1b35
    name: Fravor, David
  - id: 45b6ef75-301e-4677-9d1e-b9088715bb9d
    name: Tic Tac object
  quote: |-
    If you had one, you captured one, you reverse engineered it, you got it to work, you are talking something that can go into space, go someplace, drop down in a matter of seconds, do whatever it wants, and leave and there is nothing we can do about it. Nothing.
  text: |-
    David Fravor considers that if the technology behind the Tic Tac object were captured and reverse-engineered, it could travel into space, go elsewhere, drop down within seconds, and leave with nothing able to stop it.
- id: b35c5ee7-9a9b-425b-9073-540cbf0ac739
  type: opinion
  attestation: first_hand
  speaker:
    id: fc2cadf0-90a4-4f4b-88f2-a97039607af7
