    name: Unidentified Anomalous Phenomena (UAP)
  quote: |-
    On the military aviation side, veterans that have recently got out have shared their stories and have expressed how the objects we were seeing in 2014 and 2015 continued all the way to 2019, 2020, and beyond.
  text: |-
    Military veterans who recently left service told Ryan Graves that the Unidentified Anomalous Phenomena seen off the Eastern Seaboard in 2014 and 2015 continued through 2019 and 2020 and beyond.
