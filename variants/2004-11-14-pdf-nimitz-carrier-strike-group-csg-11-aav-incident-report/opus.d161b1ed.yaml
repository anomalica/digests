    quote: |-
      LT Underwood was controlling the radar and FLIR and attempted multiple times to transition the radar to Single Target Track (STT) mode on the object. The radar could not take a lock, the b-sweep would raster around the hit, build an initial aspect vector (which never stabilized) and then would drop and continue normal RWS b-sweep.
    text: |-
      During the 2004 USS Nimitz encounter, Chad Underwood was controlling the radar and forward-looking infrared (FLIR) and attempted multiple times to transition the radar to Single Target Track (STT) mode on the anomalous aerial vehicle (AAV), but the radar could not take a lock; the b-sweep would raster around the hit, build an initial aspect vector that never stabilised, then drop and continue normal Range While Search sweep.
