      Typically most if not all reporting on any CSG mission related air activity is completed in CVIC by the Intelligence personnel. At least one pilot or aircrew member of each flight or aircraft will stop by CVIC to be debriefed by intelligence. Intelligence personnel will then take the information provided by the pilot or aircrew member and complete a mission report (MISREP). During contingency or wartime operations a MISREP is filed even if the aircrew had nothing significant to report (NSTR).
    text: |-
      On a Carrier Strike Group mission, most or all reporting of air activity is completed in the Carrier Intelligence Center (CVIC) by intelligence personnel, with at least one pilot or aircrew member of each flight stopping by CVIC to be debriefed and intelligence personnel then completing a mission report (MISREP); during contingency or wartime operations a MISREP is filed even if the aircrew had nothing significant to report.
