  - id: f77eedb7-ce01-4ae3-869a-88c32ed8ab50
    name: USS Princeton (CG-59)
  - id: dd57b177-e873-45bb-9a45-228bb0f2a2c5
    name: anomalous aerial vehicle (AAV)
  quote: |-
    Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track of the AAVs and was quickly "dropped" by the radar meaning it was eliminated by the computer to reduce the amount of clutter on the radar, as any other false target is handled.
  text: |-
    Because the AN/SPY-1 radar aboard the USS Princeton (CG-59) was in a mode to handle air intercept of conventional aircraft, it never obtained an accurate track of the Anomalous Aerial Vehicles (AAVs) in November 2004, and the contacts were quickly dropped by the computer to reduce radar clutter as with any other false target.
