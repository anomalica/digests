    name: Anomalous Aerial Vehicle (AAV)
  quote: |-
    Initial awareness of an object came via the radar. According to the radar display, the initial tracks were at approximately 30-40 nm to the south of the aircraft.
  text: |-
    Initial awareness of an object during Chad Underwood's flight came via the radar, with initial tracks at approximately 55 to 75 kilometres to the south of the aircraft.
- id: 6bca237e-965d-4312-a971-7eb72976ebb3
  type: testimony
  attestation: first_hand
  speaker:
    id: 42ada2c4-0654-4017-b351-9261425124a9
    name: Chad Underwood
  provenance_chain:
    origin_kind: speaker
    origin: Chad Underwood
  attribution_in_text: true
  location: char:24754-25080
  refs:
