  - id: 744b2422-3304-4a66-a921-6a3f3d60714b
    name: Anomalous Aerial Vehicle (AAV)
  quote: |-
    During the period of approximately 10-16 November 2004, the Nimitz Carrier Strike Group (CSG) was operating off the western coast of the United States in preparation for their deployment to the Arabian Sea. The USS Princeton on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the CSG.
  text: |-
    During the period of approximately 10-16 November 2004, the USS Princeton (CG-59) on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the CSG.
