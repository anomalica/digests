    name: Forward Looking Infrared (FLIR)
  - id: ee120146-80d5-4287-93f0-97a2c2b4464b
    name: Link-16
  quote: |-
    All on board systems were functioning normally. The radar was in a standard search mode (RWS/ 80NM/ 4bar/ intr) and the FLIR was in L+S slave (the FLIR would point in direction of an L+S track). There were no radio or communication interference and they had entry into the Link-16 network.
  text: |-
    All on-board systems on Chad Underwood's aircraft were functioning normally, with no radio or communication interference, and they had entry into the Link-16 network.
- id: 7d715d2f-46c5-4037-aa9b-c632be62bf45
  type: observation
  attestation: first_hand
  speaker:
