    name: Chad Underwood
  - id: 4539631d-0a5d-4752-98bf-d61447aaede8
    name: APG-73 radar
  quote: |-
    LT Underwood was controlling the radar and FLIR and attempted multiple times to transition the radar to Single Target Track (STT) mode on the object. The radar could not take a lock, the b-sweep would raster around the hit, build an initial aspect vector (which never stabilized) and then would drop and continue normal RWS b-sweep.
  text: |-
    Chad Underwood attempted multiple times to transition the radar to Single Target Track mode on the object, but the radar could not take a lock.
- id: 1f5cc344-d827-4f9c-a473-90c5c67aa73d
  type: testimony
  attestation: first_hand
  speaker:
    id: 42ada2c4-0654-4017-b351-9261425124a9
    name: Chad Underwood
  provenance_chain:
