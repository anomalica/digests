    name: Anomalous Aerial Vehicle (AAV)
  quote: |-
    The AAVs would descend "very rapidly" from approximately 60,000 feet down to approximately 50 feet in a matter of seconds.
  text: |-
    The Anomalous Aerial Vehicles (AAVs) would descend 'very rapidly' from approximately 18,000 metres down to approximately 15 metres in a matter of seconds.
