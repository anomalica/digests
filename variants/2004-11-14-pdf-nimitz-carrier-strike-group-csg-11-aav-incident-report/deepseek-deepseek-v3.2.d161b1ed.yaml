    name: Chad Underwood
  quote: |-
    They flew at 20,000 feet and were flying a max endurance profile at approximately 300 knots ground speed.
  text: |-
    Chad Underwood's flight flew at 6,100 metres at a max endurance profile at approximately 550 kilometres per hour ground speed.
- id: f09a0bc7-b5e9-4eec-a840-233e31a046f7
  type: testimony
  attestation: first_hand
  speaker:
