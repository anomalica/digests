  refs:
  - id: 42ada2c4-0654-4017-b351-9261425124a9
    name: Chad Underwood
  - id: 4539631d-0a5d-4752-98bf-d61447aaede8
    name: APG-73 radar
  quote: |-
    When asked, LT Underwood stated that there were no jamming cues (strobe, champagne bubbles, "any normal EA indications"). It "just appeared as if the radar couldn't hack it." The radar couldn't receive enough information to create a single target track file.
  text: |-
    Chad Underwood stated there were no jamming cues or normal electronic attack indications; it appeared as if the radar could not receive enough information to create a single target track file.
