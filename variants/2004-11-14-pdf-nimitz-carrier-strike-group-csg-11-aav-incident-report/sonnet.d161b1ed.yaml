      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      He did not see any object or vessel associated with the disturbance either above the surface, on the surface, or below the surface. He also never made visual contact with the other fighter aircraft that were vectored to the location or the AAV.
    text: |-
      The VMFA-232 Commanding Officer did not see any object or vessel associated with the water disturbance either above, on, or below the surface, and never made visual contact with the other fighter aircraft or the Anomalous Aerial Vehicle (AAV).
  - id: e07de2fa-ebc1-43cf-ba27-c66c0d31865d
    type: opinion
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: char:15744-15864
    refs:
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      It is possible that the disturbance was being caused by an AAV but that the AAV was 'cloaked' or invisible to the human eye.
    text: |-
      It is possible that the water disturbance observed by the VMFA-232 Commanding Officer was being caused by an Anomalous Aerial Vehicle (AAV) that was 'cloaked' or invisible to the human eye.
  - id: 7c9366c7-66b2-4b21-8d0b-0716b8d294fa
