    text: |-
      An unnamed lieutenant was flying as the Air Control Officer on the E-2C Hawkeye during the mission where the Anomalous Aerial Vehicle (AAV) was observed by the flight of F/A-18s, controlling the F/A-18s conducting work-ups prior to deployment.
