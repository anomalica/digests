    attribution_in_text: false
    location: char:13202-13443
    date: '2004-11-14'
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 94e996c8-6188-492a-bd7c-076cc75a16e2
