        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      According to CDR Fravor the first indication he had of the unknown contact was a visual of a disturbance on the water below the AAV. As he scanned the area he gained a visual on the object. It is important to note that when asked to describe the disturbance on the water he stated that it was localized underneath the object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
    text: |-
      David Fravor's first indication of the unknown contact was a visual of a disturbance on the water below the Anomalous Aerial Vehicle (AAV), which was localised underneath the object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
