    quote: |-
      Lt. Col {{redacted: ~1 word}} Commanding Officer VMFA-232, was flying a single-seat F/A-18C that launched from the USS Nimitz at approximately 1030L to conduct a Functional Check Flight of an aircraft that had recently completed significant maintenance.
    text: |-
      An unnamed Lieutenant Colonel, Commanding Officer of Marine Fighter Attack Squadron 232 (VMFA-232), was flying a single-seat F/A-18C that launched from USS Nimitz (CVN-68) at approximately 1030 local time to conduct a Functional Check Flight of an aircraft that had recently completed significant maintenance.
  - id: a5750344-ddf0-45f9-b249-cf744bf74b67
    type: testimony
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:13539-13705
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: |-
      After 30 minutes into his flight he received a radio call from his air controller asking him to investigate an unidentified airborne contact. This was not a standard request.
    text: |-
      The VMFA-232 Commanding Officer received a radio call from his air controller asking him to investigate an unidentified airborne contact, which was not a standard request.
  - id: 32a03cea-d72e-4825-81d8-f70637023b97
    type: opinion
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:13714-13919
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: |-
      Additionally the controller asked if he had ordnance onboard, which was odd since no controller had ever asked that question during a situation of identifying an unknown contact over U.S. or International territory.
    text: |-
      The air controller asked the VMFA-232 Commanding Officer if he had ordnance onboard, which was odd since no controller had ever asked that question during a situation of identifying an unknown contact over U.S. or international territory.
  - id: aa9f9b38-0d96-4a21-a6da-91b94833d04a
