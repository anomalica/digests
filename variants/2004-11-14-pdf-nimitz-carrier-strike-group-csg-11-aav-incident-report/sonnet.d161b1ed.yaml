        name: USS Princeton (CG-59)
    quote: |-
      If the radar were set up in a mode for Ballistic Missile tracking they likely would have had the capability to track the AAV.
    text: |-
      If the AN/SPY-1 radar aboard USS Princeton (CG-59) had been set up in Ballistic Missile tracking mode, it likely would have had the capability to track the Anomalous Aerial Vehicle (AAV).
