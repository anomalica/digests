        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The controller informed him to remain above 10,000 feet, as there was other fighter traffic at low altitude investigating the AAV.
    text: |-
      The controller informed the VMFA-232 Commanding Officer to remain above approximately 3,000 metres, as there was other fighter traffic at low altitude investigating the Anomalous Aerial Vehicle (AAV).
  - id: 462455d7-5d2e-4292-894e-2200cb5645c6
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:14524-14714
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      As he approached approximately 15nm from the AAV descending through approximately 15,000 feet, he could see a water disturbance in the ocean surface. He recalled that the sea state was low (calm).
    text: |-
      As he approached approximately 28 kilometres from the Anomalous Aerial Vehicle (AAV) descending through approximately 4,600 metres, the VMFA-232 Commanding Officer could see a water disturbance on the ocean surface, with the sea state calm.
  - id: 69a1865d-c9d8-427c-bb95-47a0e491e5cd
    type: testimony
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:14721-14932
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      At approximately 5-10 nm away from the AAV, the controller told him to "skip it" and return to his operating area. Since he was close he elected to fly over the water disturbance to try and see what was causing it.
    text: |-
      At approximately 9-19 kilometres from the Anomalous Aerial Vehicle (AAV), the controller told the VMFA-232 Commanding Officer to skip it and return to his operating area, but he elected to fly over the water disturbance since he was close.
  - id: 577d0cf3-7e0d-4074-8693-1bcd89fe1dca
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:14937-15190
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The disturbance appeared to be 50 to 100 meters in diameter and close to round. It was the only area and type of whitewater activity that could be seen and reminded him of images of something rapidly submerging from the surface like a submarine or ship sinking.
    text: |-
      The water disturbance associated with the Anomalous Aerial Vehicle (AAV) sighting appeared to be 50 to 100 metres in diameter and close to round, and was the only area of whitewater activity visible, reminding the VMFA-232 Commanding Officer of something rapidly submerging like a submarine or ship sinking.
  - id: c22512b0-c141-48f4-b8eb-33f7b4c2c7d3
    type: testimony
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:15199-15311
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: |-
      It also looked like a possible area of shoal water where the swell was breaking over a barely submerged reef or island.
    text: |-
      The VMFA-232 Commanding Officer also thought the water disturbance looked like a possible area of shoal water where the swell was breaking over a barely submerged reef or island.
  - id: db5e6f75-ef67-407c-9fd3-7e67de6d61e2
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:15499-15739
    refs:
