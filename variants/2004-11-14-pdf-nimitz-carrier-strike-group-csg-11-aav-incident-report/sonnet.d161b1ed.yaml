    quote: |-
      He and LT {{redacted: ~2 words}} were in the lead aircraft of the first F/A-18F section airborne that day from VFA-41, call sign FastEagle 01. The flight walked, started and launched with no issue. They completed their departure from the USS Nimitz and flew to the working area to conduct the training portion of the flight.
    text: |-
      On 2004-11-14, David Fravor and his WSO flew as the lead aircraft of the first F/A-18F section airborne that day from Strike Fighter Squadron 41 (VFA-41), call sign FastEagle 01, launching from USS Nimitz (CVN-68) with no issues.
