      Situational awareness to the object was initially received via sporadic Link-16 tracks (Link-16 is a time division multiple access data-link) via an off-board sensor. Lt {{redacted: ~1 word}} assumed that the sensor providing the information was the USS Princeton's SPY-1 radar.
    text: |-
      Situational awareness of the Anomalous Aerial Vehicle (AAV) was initially received via sporadic Link-16 tracks, a time division multiple access data-link, from an off-board sensor, which Fravor's WSO assumed to be USS Princeton (CG-59)'s AN/SPY-1 radar.
  - id: 1e7b40be-8af5-4d71-a9e1-e3f90fc1dbad
    type: testimony
    attestation: first_hand
    speaker:
