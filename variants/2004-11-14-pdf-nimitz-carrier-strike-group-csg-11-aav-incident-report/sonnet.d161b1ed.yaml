    quote: |-
      Senior Chief {{redacted: ~1 word}} added that based on his experience, which is 17 years as a Fire Control on Aegis cruisers, the AAV exhibited Ballistic Missile Characteristics in reference to its appearance, velocity, and indications on the radar.
    text: |-
      A Senior Chief aboard USS Princeton (CG-59), based on his 17 years of experience as a Fire Control technician on Aegis cruisers, assessed that the Anomalous Aerial Vehicle (AAV) exhibited ballistic missile characteristics in its appearance, velocity, and radar indications.
  - id: 9d49e485-ccb1-4a8d-9e77-e1eadf43b5e6
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: char:7079-7364
    refs:
      - id: ca30e3ea-e3fe-4216-8774-e87df461edc6
        name: AN/SPY-1 radar
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
      - id: 4f855aad-8172-4b5d-86f9-94383215b905
        name: USS Princeton (CG-59)
    quote: |-
      Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track of the AAVs and was quickly "dropped" by the radar meaning it was eliminated by the computer to reduce the amount of clutter on the radar, as any other false target is handled.
    text: |-
      Because the AN/SPY-1 radar aboard USS Princeton (CG-59) was set to handle Air Intercept of conventional aircraft, it never obtained an accurate track of the Anomalous Aerial Vehicle (AAV) and was quickly dropped by the radar as clutter, as with any other false target.
