      Lt Col {{redacted: ~1 word}} recovered aboard the Nimitz at approximately 1200L. He reported to the Carrier Intelligence Center (CVIC) and was asked by his Intelligence Officer, 1stLt {{redacted: ~2 words}} if he saw the "supersonic Tic Tac"?
    text: |-
      The VMFA-232 Commanding Officer recovered aboard USS Nimitz (CVN-68) at approximately 1200 local time and reported to the Carrier Intelligence Center (CVIC), where his Intelligence Officer asked if he saw the 'supersonic Tic Tac'.
  - id: 10e6aad8-cafd-43bf-88b9-b67a92657a1a
