    quote: |-
      This section provides the debrief of the F/A-18 pilots and weapon system operators (WSOs) from VFA-41 that were able to get both a visual and sensor contact with the AAV on 14 November 2004 at approximately N31 20' W117 10' about 70nm south of the U.S./Mexico Border 30 nm off the Baja Mexico Coast (Figure 1).
    text: |-
      F/A-18 pilots and weapon systems officers from Strike Fighter Squadron 41 (VFA-41) obtained both visual and sensor contact with the Anomalous Aerial Vehicle (AAV) on 2004-11-14 at approximately N31 20' W117 10', about 130 kilometres south of the U.S./Mexico border and 56 kilometres off the Baja Mexico coast.
  - id: aa96c755-c1b6-49ad-a3d2-d4213b8a1e80
    type: administrative
    attestation: second_hand
    provenance_chain:
      origin_kind: named
