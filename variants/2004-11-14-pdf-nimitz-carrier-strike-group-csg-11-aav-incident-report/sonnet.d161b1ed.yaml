        name: Anomalous Aerial Vehicle (AAV)
    quote: The object was reported to be at "slow speed and low altitude".
    text: |-
      The Anomalous Aerial Vehicle (AAV) was reported to be at slow speed and low altitude.
  - id: 40dba39b-1e63-4555-b3fa-aaaaa3b614d7
    type: observation
    attestation: second_hand
    provenance_chain:
      origin_kind: named
      origin: unnamed VMFA-232 Commanding Officer
    attribution_in_text: true
    location: char:14101-14345
    refs:
      - id: b7b6fd16-29a4-41ee-89e7-a490aed78a1c
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 66ab94f6-f3db-49a8-b379-f8650fe18880
        name: F/A-18F
      - id: 996edaae-b2d6-4566-b215-c739664b300c
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      While enroute at approximately 250 knots indicated/400 knots groundspeed at medium altitude (15-25,000 feet), he gained radar contact of what he believed to be two F/A-18Fs that were approaching the AAV from the west at low altitude (500-5,000 feet).
    text: |-
      While en route at approximately 460 kilometres per hour indicated airspeed and 740 kilometres per hour groundspeed at medium altitude (approximately 4,600-7,600 metres), the VMFA-232 Commanding Officer gained radar contact of what he believed to be two F/A-18Fs approaching the Anomalous Aerial Vehicle (AAV) from the west at low altitude (approximately 150-1,500 metres).
  - id: 3e711d32-e3f6-4544-85a8-f7ebb58e2598
    type: testimony
    attestation: second_hand
    provenance_chain:
      origin_kind: named
