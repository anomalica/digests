  - id: a32ca485-cc4f-4954-85a7-0329a18fea2c
    name: Fravor, David
  - id: c3fa6dc5-6260-43cf-9a11-74c91ab54c85
    name: Anomalous Aerial Vehicle (AAV)
  quote: |-
    It is important to note that when asked to describe the disturbance on the water he stated that it was localized underneath the object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
  text: |-
    Fravor observed the water disturbance was localised underneath the Anomalous Aerial Vehicle object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
