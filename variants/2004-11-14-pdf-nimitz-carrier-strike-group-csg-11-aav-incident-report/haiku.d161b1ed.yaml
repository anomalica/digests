  quote: |-
    On 14 November after again detecting the AAV, the USS Princeton took the opportunity of having a flight of two F/A-18Fs returning from a training mission to further investigate the AAV. The USS Princeton took over control of the F/A-18s from the E-2C Airborne Early Warning aircraft and vectored in the F/A-18s for intercept leading to visual contact approximately one mile away from the AAV
  text: |-
    On 2004-11-14, after detecting the Anomalous Aerial Vehicle again, the USS Princeton (CG-59) vectored in a flight of two F/A-18F Super Hornet aircraft returning from a training mission for intercept, leading to visual contact approximately one mile away from the Anomalous Aerial Vehicle.
