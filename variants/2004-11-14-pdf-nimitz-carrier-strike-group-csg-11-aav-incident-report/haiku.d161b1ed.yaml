  - id: 8bb8f172-eb3e-46bf-b9cd-eea33fa2ce07
    name: F/A-18F Super Hornet
  quote: |-
    CDR Fravor, Commanding Officer VFA-41, was the pilot of FastEagle 01. He and LT {{redacted: ~2 words}} were in the lead aircraft of the first F/A-18F section airborne that day from VFA-41, call sign FastEagle 01.
  text: |-
    Commander David Fravor, Commanding Officer of Strike Fighter Squadron 41 (VFA-41), piloting the FastEagle 01 F/A-18F Super Hornet, observed the Anomalous Aerial Vehicle on 2004-11-14 at approximately 31°20' north, 117°10' west.
- id: 42b7ae1a-87d8-4c9d-be8a-50099a9cbd75
  type: observation
  attestation: second_hand
  speaker:
    id: a32ca485-cc4f-4954-85a7-0329a18fea2c
    name: Fravor, David
  provenance_chain:
    origin_kind: named
    origin: Fravor, David
  attribution_in_text: false
  location: char:19522-19952
  date: '2004-11-14'
  refs:
  - id: 97de4c34-a0e4-4d33-8b36-19460bf1b00f
    name: 2004 USS Nimitz UAP Encounter
  - id: a32ca485-cc4f-4954-85a7-0329a18fea2c
    name: Fravor, David
  - id: c3fa6dc5-6260-43cf-9a11-74c91ab54c85
    name: Anomalous Aerial Vehicle (AAV)
  - id: 71cc3bc8-5942-4947-aac6-ce016a99ae7d
    name: AV-8B Harrier
  - id: 7b8d9766-b373-4cb4-8bad-9d165368ef4f
    name: Tic Tac (codename)
  quote: |-
    CDR Fravor stated that the object was "holding like a Harrier." (Referring to the AV-8B jet aircraft, which is capable of hovering and Vertical/Short Takeoff and Landing (V/STOL) via thrust vectoring.) According to CDR Fravor, the object's shape was like an elongated egg or a 'Tic Tac' and had a discernable midline horizontal axis. However, the object was uniformly white across the entire body. It was approximately 46 feet in length.
  text: |-
    Fravor observed the Anomalous Aerial Vehicle was holding like an AV-8B Harrier aircraft with an elongated egg or Tic Tac shape, uniformly white across the entire body, approximately 14 metres in length, with a discernable midline horizontal axis.
- id: 0fb75425-54b4-4d2b-9c1b-84c836a7c786
  type: observation
  attestation: second_hand
  speaker:
    id: a32ca485-cc4f-4954-85a7-0329a18fea2c
    name: Fravor, David
  provenance_chain:
