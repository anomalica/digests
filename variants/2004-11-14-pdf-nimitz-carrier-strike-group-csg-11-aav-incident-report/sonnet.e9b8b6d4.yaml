      - id: 63f6aa76-1daf-4667-8ac4-592e2e017065
        name: USS Princeton (CG-59)
    quote: |-
      Senior Chief {{redacted: ~1 word}} added that based on his experience, which is 17 years as a Fire Control on Aegis cruisers, the AAV exhibited Ballistic Missile Characteristics in reference to its appearance, velocity, and indications on the radar.
    text: |-
      A Senior Chief aboard USS Princeton (CG-59) with 17 years of experience as a Fire Control operator on Aegis cruisers assessed that the Anomalous Aerial Vehicle (AAV) exhibited Ballistic Missile Characteristics in reference to its appearance, velocity, and radar indications.
  - id: 4679a657-5835-4338-8332-c86cac8db223
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: char:7079-7364
    date: '2004-11-14'
    refs:
      - id: 6ee3fcd6-971f-4554-8e31-769502d5a29e
        name: AN/SPY-1
      - id: 63f6aa76-1daf-4667-8ac4-592e2e017065
        name: USS Princeton (CG-59)
      - id: 5ab2008d-7e60-42e2-a4ad-f7a27e239761
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track of the AAVs and was quickly "dropped" by the radar meaning it was eliminated by the computer to reduce the amount of clutter on the radar, as any other false target is handled.
    text: |-
      Since the AN/SPY-1 radar aboard USS Princeton (CG-59) was set to a mode for Air Intercept of conventional aircraft, it never obtained an accurate track of the Anomalous Aerial Vehicles (AAVs) and quickly dropped the contacts as clutter.
