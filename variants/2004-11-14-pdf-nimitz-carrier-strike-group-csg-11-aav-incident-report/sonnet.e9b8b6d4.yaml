        name: Nimitz Carrier Strike Group (CSG-11)
    quote: |-
      During the period of approximately 10-16 November 2004, the Nimitz Carrier Strike Group (CSG) was operating off the western coast of the United States in preparation for their deployment to the Arabian Sea.
    text: |-
      The Nimitz Carrier Strike Group (CSG-11) was operating off the western coast of the United States from approximately 2004-11-10 to 2004-11-16 in preparation for deployment to the Arabian Sea.
