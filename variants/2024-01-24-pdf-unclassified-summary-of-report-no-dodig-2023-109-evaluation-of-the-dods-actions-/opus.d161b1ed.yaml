    quote: |-
      In 2020, as a result of increased concerns of flight crew safety, national security, and adversary technology advances, Congress directed the DoD, through the FY 2022 National Defense Authorization Act, to develop, fund, and staff a formal interagency entity to study, collect data, and report on UAP.
    text: |-
      In 2020, as a result of increased concerns of flight crew safety, national security, and adversary technology advances, the United States Congress directed the United States Department of Defense (DoD), through the FY 2022 National Defense Authorization Act (NDAA), to develop, fund, and staff a formal interagency entity to study, collect data, and report on UAP.
