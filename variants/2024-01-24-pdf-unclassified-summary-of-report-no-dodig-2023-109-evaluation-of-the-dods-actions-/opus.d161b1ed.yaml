    text: |-
      The FY 2022 National Defense Authorization Act (NDAA) required the All-domain Anomaly Resolution Office (AARO) to synchronise and standardise efforts across the United States Department of Defense (DoD) to collect, report, and analyse UAP incidents; to develop processes and procedures to ensure UAP incidents are reported and included in a centralised database; and to coordinate with other departments and agencies, allies, and partners to better assess the nature and extent of UAP.
