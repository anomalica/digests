  - id: 6c49b658-e621-4eb0-ae88-8c61f04f632c
    name: United States Atomic Energy Commission (AEC)
  quote: |-
    the detail of the documents check out with contemporary diaries, which were not released at the time. The meetings that are referred to in the documents are reflected in the diaries of not just the president, but Forrestal, Eisenhower. I've looked at the diaries of the head of the Atomic Energy Commission, and it just does knit together.
