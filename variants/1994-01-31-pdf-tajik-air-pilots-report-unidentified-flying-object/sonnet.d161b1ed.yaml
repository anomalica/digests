  quote: |-
    THEY FIRST ENCOUNTERED THE OBJECT AS A BRIGHT LIGHT OF ENORMOUS INTENSITY, APPROACHING THEM FROM OVER THE HORIZON TO THE EAST AT A GREAT RATE OF SPEED AND AT A MUCH HIGHER ALTITUDE THAN THEIR OWN
  text: |-
    The Tajik Air crew first encountered the object as a bright light of enormous intensity, approaching them from over the horizon to the east at a great rate of speed and at a much higher altitude than their own aircraft.
