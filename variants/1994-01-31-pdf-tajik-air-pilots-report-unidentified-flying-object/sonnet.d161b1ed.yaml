  quote: |-
    TO OUR SUGGESTION THAT THE OBJECT MIGHT HAVE BEEN A METEOR ENTERING AND SKIPPING OFF THE EARTH'S ATMOSPHERE, RHODES AND HIS CREW WERE ADAMANT THAT THEY HAD SEEN THOUSANDS OF "FALLING STARS" AND OTHER SPACE JUNK ENTERING THE ATMOSPHERE IN THEIR YEARS OF FLYING PASSENGER AIRCRAFT FOR PANAM. THIS, THEY INSISTED, WAS NOTHING LIKE A METEOR.
  text: |-
    When asked whether the object might have been a meteor entering and skipping off the earth's atmosphere, Ed Rhodes and his crew were adamant that they had seen thousands of falling stars and other space junk entering the atmosphere in their years of flying passenger aircraft for Pan American World Airways (Pan Am), and insisted this was nothing like a meteor.
