  quote: |-
    AMCIT ED RHODES, AND HIS TWO AMERICAN PILOT COLLEAGUES REPORTED JANUARY 29 THAT, ON JANUARY 27, THEY HAD ENCOUNTERED A UFO WHILE FLYING AT 41,000 FEET IN THEIR BOEING 747SP
  text: |-
    On 1994-01-29, Ed Rhodes and his two American pilot colleagues reported that on 1994-01-27 they had encountered a UFO while flying at approximately 12,500 metres in their Boeing 747SP.
