  quote: WE HAVE NO OPINION AND REPORT THE ABOVE FOR WHAT IT MAY BE WORTH.
  text: |-
    Escudero reported that the United States Embassy, Dushanbe held no opinion on the UFO encounter and reported the observations for whatever they might be worth.
