    name: Unidentified Flying Object (UFO)
  quote: |-
    AFTER SOME TIME, THE OBJECT ADOPTED A HORIZONTAL HIGH-SPEED COURSE AND DISAPPEARED OVER THE HORIZON.
  text: |-
    After observing the UFO for some time, it adopted a horizontal high-speed course and disappeared over the horizon.
