  - id: b1f468fb-d3f2-43e9-a38a-047cd4913096
    name: 1994 Tajik Air Boeing 747SP Unidentified Flying Object Encounter
  quote: |-
    ON JANUARY 27, THEY HAD ENCOUNTERED A UFO WHILE FLYING AT 41,000 FEET IN THEIR BOEING 747SP AT LAT 45 NORTH AND LONG 55 EAST, OVER KAZAKHSTAN.
  text: |-
    On 1994-01-27, Ed Rhodes and two American pilot colleagues, flying a Boeing 747SP at approximately 7,620 metres altitude, encountered a Unidentified Flying Object (UFO) at latitude 45 North, longitude 55 East, over Kazakhstan.
- id: 296c41fe-e232-4565-9486-210f64ad5900
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: speaker
    origin: Ed Rhodes
  attribution_in_text: false
  location: char:1403-1595
  date: '1994-01-27'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    THEY FIRST ENCOUNTERED THE OBJECT AS A BRIGHT LIGHT OF ENORMOUS INTENSITY, APPROACHING THEM FROM OVER THE HORIZON TO THE EAST AT A GREAT RATE OF SPEED AND AT A MUCH HIGHER ALTITUDE THAN THEIR OWN.
  text: |-
    The UFO first appeared as a bright light of enormous intensity, approaching from the eastern horizon at a very high rate of speed and at a much higher altitude than the Boeing 747SP.
- id: d0ad068d-0f18-4347-b64a-4a5ebffa9a85
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: speaker
    origin: Ed Rhodes
  attribution_in_text: false
  location: char:1600-1758
  date: '1994-01-27'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    THEY WATCHED THE OBJECT FOR SOME FORTY MINUTES AS IT MANEUVERED IN CIRCLES, CORKSCREWS AND MADE 90-DEGREE TURNS AT RAPID RATES OF SPEED AND UNDER VERY HIGH G'S.
  text: |-
    Ed Rhodes and his crew observed the UFO for approximately 40 minutes as it manoeuvred in circles, corkscrews, and made 90-degree turns at rapid rates of speed.
