  attribution_in_text: false
  location: char:2515-2587
  date: '1994-01-27'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: RHODES ESTIMATED THE ALTITUDE OF THE CONTRAILS AT APPROXIMATELY 100,000 FEET
  text: |-
    Ed Rhodes estimated the altitude of the contrails left by the UFO at approximately 30,000 metres.
- id: 2bec715f-d22f-4fd2-8d09-e9bd1674cdce
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: speaker
    origin: Ed Rhodes
  attribution_in_text: false
  location: char:2593-2783
  date: '1994-01-27'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  quote: |-
    NOTING THAT THERE IS TOO LITTLE AIR/MOISTURE AT THAT EXTREME ALTITUDE TO ENABLE THE CREATION OF CONTRAILS BY THE PROPULSION MECHANISMS OF ORDINARY AIRCRAFT WHICH MIGHT BE ABLE TO REACH THAT HEIGHT.
  text: |-
    Ed Rhodes noted that the extreme altitude of approximately 30,000 metres contains too little air and moisture to enable the creation of contrails by the propulsion mechanisms of ordinary aircraft capable of reaching that height.
- id: 6d5811ee-9211-4cd4-850b-6bc9531aed13
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: speaker
    origin: Ed Rhodes
  attribution_in_text: false
  location: char:2791-2884
  date: '1994-01-27'
  refs:
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    THE PATHS OF THE CONTRAILS REFLECTED THE MANEUVERS OF THE OBJECT, I.E., CIRCLES, CORKSCREWS, ETC.
  text: |-
    The paths of the contrails left by the UFO reflected the object's manoeuvres, including circles and corkscrews.
- id: dd591206-2f1f-495c-90f2-f37dd9ddd2af
  type: testimony
  attestation: second_hand
  speaker:
    id: c8008e17-2e4a-4fd4-89f4-6ef8c65054e1
    name: Escudero
  provenance_chain:
    origin_kind: named
    origin: Ed Rhodes
    relay:
    - Escudero
  attribution_in_text: true
  location: char:2893-3254
  date: '1994-01-31'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  - id: 55584f2f-45cf-4b9f-8e9f-91f9d6016f12
    name: Pan American Airways (PanAm)
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    TO OUR SUGGESTION THAT THE OBJECT MIGHT HAVE BEEN A METEOR ENTERING AND SKIPPING OFF THE EARTH'S ATMOSPHERE, RHODES AND HIS CREW WERE ADAMANT THAT THEY HAD SEEN THOUSANDS OF "FALLING STARS" AND OTHER SPACE JUNK ENTERING THE ATMOSPHERE IN THEIR YEARS OF FLYING PASSENGER AIRCRAFT FOR PANAM. THIS, THEY INSISTED, WAS NOTHING LIKE A METEOR.
  text: |-
    In response to a suggestion that the object might have been a meteor entering and skipping off Earth's atmosphere, Ed Rhodes and his crew insisted they had seen thousands of falling stars and other space debris entering the atmosphere during their years of flying passenger aircraft for Pan American Airways (PanAm), and that the UFO was nothing like a meteor.
- id: 0abf522b-f0c5-4b02-865f-fd9570cea41d
  type: opinion
  attestation: second_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: named
    origin: Ed Rhodes
    relay:
    - Escudero
  attribution_in_text: true
  location: char:3262-3432
  date: '1994-01-31'
  refs:
  - id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  - id: 78ef0b59-284a-40ba-a5c0-9364e356e5dc
    name: Extraterrestrial hypothesis
  quote: |-
    ON THE BASIS OF ITS SPEED AND MANEUVERABILITY, RHODES EXPRESSED THE OPINION, WHICH HIS CREW SEEMED TO SUPPORT, THAT THE OBJECT WAS EXTRATERRESTRIAL AND UNDER INTELLIGENT CONTROL.
  text: |-
    Ed Rhodes, on the basis of the UFO's speed and maneuverability, considers the object to be extraterrestrial and under intelligent control; his crew seemed to support this assessment.
