    origin: Ed Rhodes
  attribution_in_text: false
  location: char:2130-2324
  date: '1994-01-27'
  refs:
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    THEY DESCRIBED THE LIGHT IT EMITTED AS HAVING A "BOW WAVE" AND AS RESEMBLING A HIGH-SPEED PHOTO OF A BULLET IN FLIGHT, IN WHICH A VERY SMALL OBJECT GIVES OFF A MUCH LARGER TRAILING WAVE OF HEAT/LIGHT.
  text: |-
    The UFO's light emission resembled a high-speed photograph of a bullet in flight, with a very small object producing a much larger trailing wave of heat and light.
- id: 958ced46-fbee-4c75-b196-3bd59ba7c306
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
    origin_kind: speaker
    origin: Ed Rhodes
  attribution_in_text: false
  location: char:2331-2508
  date: '1994-01-27'
  refs:
  - id: 3f4d9241-c982-47c3-b4f8-19d62bd3ab84
    name: Boeing 747SP
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    SOME FORTY-FIVE MINUTES AFTER THE INITIAL SIGHTING, AS THE SUN WAS RISING, THE AIRCRAFT FLEW UNDER THE CONTRAILS WHICH THE OBJECT HAD LEFT BEHIND. THE PLANE WAS MAKING OVER 500 KNOTS.
  text: |-
    Approximately 45 minutes after the initial sighting of the UFO, as the sun was rising, the Boeing 747SP flew under contrails left behind by the object, with the aircraft travelling at over 900 kilometres per hour.
- id: 78d3e0c3-9432-48d3-87eb-62603956e21e
  type: measurement
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
