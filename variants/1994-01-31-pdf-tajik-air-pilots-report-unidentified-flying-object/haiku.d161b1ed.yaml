  date: '1994-01-27'
  refs:
  - id: 514175c3-e627-47a2-bae1-57309ac2a3e3
    name: Unidentified Flying Object (UFO)
  quote: |-
    AS IT WAS DARK WHEN THE OBJECT WAS OBSERVED, THE CREW WERE UNABLE TO DISCERN ITS SHAPE.
  text: |-
    Because it was dark when the UFO was observed, the crew were unable to discern its shape.
- id: 5da9638f-0fee-4107-88f7-883642f498aa
  type: observation
  attestation: first_hand
  speaker:
    id: d09cb5cd-7913-4fe4-8a77-6e3765b0cd0c
    name: Rhodes, Ed
  provenance_chain:
