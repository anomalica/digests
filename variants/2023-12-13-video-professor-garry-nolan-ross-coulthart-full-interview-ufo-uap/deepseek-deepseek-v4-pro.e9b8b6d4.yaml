  quote: |-
    Garry Nolan: The best science is always noticing the points that are off the curve, that are the unexpected, because first of all, you have to explain why that point is off the curve, because there might be something wrong with your experiment. But if it is off the curve, and it's absolutely reproducible, then you've discovered something novel.
  text: |-
    The best science is always noticing the points that are off the curve and unexpected, because you first have to explain why that point is off the curve, and a reproducible off-curve point means you have discovered something novel.
