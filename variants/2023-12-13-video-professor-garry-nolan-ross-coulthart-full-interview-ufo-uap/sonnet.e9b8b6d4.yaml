  quote: |-
    The best science is always noticing the points that are off the curve, that are the unexpected, because first of all, you have to explain why that point is off the curve, because there might be something wrong with your experiment.
    But if it is off the curve, and it's absolutely reproducible, then you've discovered something novel.
  text: |-
    Garry Nolan considers that the best science always notices data points that are off the expected curve, since an unexpected point either reveals a flaw in the experiment or, if reproducible, a genuine novel discovery.
