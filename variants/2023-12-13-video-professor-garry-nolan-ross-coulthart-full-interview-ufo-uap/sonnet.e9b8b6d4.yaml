    we found that there is a bundle of nerves at the head of the caudate and putamen in their basal ganglia. This is an important area of the brain that has to do with sensory perceptions and actually integration of that information for goal seeking... this area of the brain, and especially this one area at the head of the caudate impotainment, had overdeveloped interactions with this, compared to normals. There was a density of neuronal structure there.
  text: |-
    During research using magnetic resonance imaging (MRI), Garry Nolan and colleagues found that individuals exposed to the UAP phenomenon showed an overdeveloped bundle of nerves at the head of the caudate and putamen in the basal ganglia, an area of the brain involved in sensory perception and goal-seeking integration, compared to normal subjects.
