  text: |-
    Garry Nolan considers that the US government's admission about unidentified aerial phenomena (UAP) gives solace to people who had been told they were crazy for believing in or seeing such phenomena.
- id: 19c68003-7484-4e04-a2a3-3ad14b51312f
  type: opinion
  attestation: first_hand
  speaker:
    id: 546cd559-5a16-48db-a9e2-7c6bafab4574
