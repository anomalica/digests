    name: Garry Nolan
  - id: 0dae0aa4-752b-49f0-9141-179b911abf11
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    But second, they didn't want to admit that they didn't have control over our airspace. We didn't have control over our own airspace.
  text: |-
    Garry Nolan considers that the US government also lied about unidentified aerial phenomena (UAP) because it did not want to admit it lacked control over US airspace.
- id: 9d8af04b-2667-4101-9cc6-d9d59d8bc3f6
  type: opinion
  attestation: first_hand
  speaker:
    id: 546cd559-5a16-48db-a9e2-7c6bafab4574
