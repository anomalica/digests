    name: Garry Nolan
  - id: 0dae0aa4-752b-49f0-9141-179b911abf11
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I think it's because, frankly, they didn't understand what it was, and nobody wanted to admit that, first of all.
  text: |-
    Garry Nolan considers that the US government lied about unidentified aerial phenomena (UAP) because it did not understand what the phenomena were and did not want to admit that.
- id: af420cb0-767a-46c5-a6f8-5d78ad9af652
  type: opinion
  attestation: first_hand
  speaker:
    id: 546cd559-5a16-48db-a9e2-7c6bafab4574
