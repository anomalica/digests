  quote: Yes. It certainly acts it, and in some cases it seems to have a sense of humor.
  text: |-
    Garry Nolan considers unidentified aerial phenomena (UAP) to be intelligent, and believes they in some cases appear to have a sense of humour.
- id: 88d75fce-7b60-4f2b-b4a6-31f23217adf1
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:05:04.2-00:05:18.5
  refs:
