  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: I'm sure it's not human.
  text: |-
    Garry Nolan is sure that unidentified aerial phenomena (UAP) are not of human origin.
- id: 33d8f581-772e-41a7-ab06-9e0927e5ddc8
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
