    name: Council Bluffs molten slag sample
  quote: |-
    And there's one case I'm fascinated with, which is the Council Bluffs Iowa event in December 1977. And tell me if I'm wrong, Police and 11 different witnesses from four different groups came across a pile of molten slag that they saw fall from a craft of some kind. A blinking craft.
  text: |-
    In 1977-12, at Council Bluffs, Iowa, police and eleven witnesses from four different groups witnessed a pile of molten slag fall from a blinking craft of some kind.
