- id: ca8e2940-0cec-4506-9569-fe1b5a4d889a
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:02:05.9-00:02:11.5
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I think it tells us that, first of all, the government has been lying to us for the last 60 or 70 years.
  text: |-
    The US government has lied to the public about unidentified aerial phenomena (UAP) for the last 60 to 70 years.
- id: d73b2601-c68b-464b-bb11-c64fe5b446cc
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:02:12.0-00:02:19.2
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I think it gives solace to people who have been told that they were crazy to have been believing or seeing this.
  text: |-
    The US government's admission that unidentified aerial phenomena (UAP) are real gives solace to people who had previously been told they were crazy for believing in or seeing UAP.
- id: babbb58c-d92d-437b-b9df-7adf9b5568d4
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:02:31.3-00:02:36.5
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I think it's because, frankly, they didn't understand what it was, and nobody wanted to admit that, first of all.
  text: |-
    Garry Nolan believes the US government lied about unidentified aerial phenomena (UAP) because it did not understand what the phenomena were and did not want to admit that.
- id: 2d807546-77d0-464c-b684-f6971fd0f51f
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:02:37.1-00:02:42.6
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    But second, they didn't want to admit that they didn't have control over our airspace. We didn't have control over our own airspace.
  text: |-
    Garry Nolan believes the US government also lied about unidentified aerial phenomena (UAP) because it did not want to admit that it lacked control over US airspace.
- id: c5879ca0-d2ce-4c52-bf23-e8e6ac69f097
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:03:24.4-00:03:32.8
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I mean, there has been both a cover up as well as a disinformation campaign to make people look like they were crazy.
  text: |-
    Garry Nolan believes there has been both a cover-up and a disinformation campaign designed to make people who reported unidentified aerial phenomena (UAP) look crazy.
- id: a2b48921-26ba-498a-b53e-6c2952943ea5
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
  attribution_in_text: false
  location: 00:03:57.3-00:04:18.0
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    I think that this is the kind of thing that if we continue to ignore it, if we continue to ignore the potential danger of what it might represent, we are putting ourselves at risk, both to what it might do to us sometime in the future, but then ignoring the physics of what these things are capable of doing.
  text: |-
    Garry Nolan considers it dangerous to continue ignoring the potential danger represented by unidentified aerial phenomena (UAP), given uncertainty about what they might do in the future and the physics of their capabilities.
- id: 2af0fb43-bd12-4378-be14-9bd8244b3ea8
  type: opinion
  attestation: second_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  provenance_chain:
    origin_kind: speaker
    origin: Garry Nolan
    relay:
    - unnamed insiders Garry Nolan has spoken with
  attribution_in_text: false
  location: 00:04:23.2-00:04:41.0
  refs:
  - id: d224fd61-daaa-4e88-9485-2bad4412621d
    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    You know, I wish I knew, and of all the people that I've spoken with on the inside, there's really very little unanimity about what it is, except for that whatever it is appears to be so far advanced from us that it beggars understanding.
  text: |-
    Among the insiders Garry Nolan has spoken with, there is very little unanimity about what unidentified aerial phenomena (UAP) actually are, except that they appear far more advanced than human technology.
- id: 0381e07a-cf9d-4f31-89f6-57bdb2672bf8
  type: opinion
  attestation: first_hand
  speaker:
    id: d224fd61-daaa-4e88-9485-2bad4412621d
