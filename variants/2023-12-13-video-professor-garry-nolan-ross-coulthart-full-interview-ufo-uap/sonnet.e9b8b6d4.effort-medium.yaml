    name: Garry Nolan
  - id: 106ad91c-d07c-49a0-9ab7-5aa179d72567
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    Yeah, I almost hesitate even to call it a civilization. A civilization implies a lot of interacting parts that are moving towards some sort of goal. I couldn't even say whether or not what it is that is being observed is something like that.
  text: |-
    Garry Nolan hesitates to describe what is behind unidentified aerial phenomena (UAP) as a civilisation, since he cannot say whether what is observed involves interacting parts moving toward a shared goal.
