    name: Mohs scale
  quote: |-
    In 1822, Friedrich Mohs [German-Austrian: 1773-1839] created a hardness scale based on assigning numbers to common minerals.
  text: |-
    In 1822, Friedrich Mohs created a hardness scale based on assigning numbers to common minerals.
- id: b0d97f65-0abf-4fe7-ac0f-d7a1dbefcd5f
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:13747-13834
  refs:
  - id: 16837b5b-771c-4914-b578-b73986801620
    name: Mohs scale
  quote: |-
    It is a scale used to measure the relative hardness of a mineral by its resistance to scratching.
  text: |-
    The Mohs scale measures the relative hardness of a mineral by its resistance to scratching.
- id: bca08c1c-3c71-46dd-841c-39d83b3d8a95
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:13973-14059
  refs:
  - id: 16837b5b-771c-4914-b578-b73986801620
    name: Mohs scale
  quote: |-
    The concept is that a harder mineral (one with a higher number) can scratch a softer one.
  text: |-
    On the Mohs scale, a harder mineral with a higher number can scratch a softer mineral with a lower number.
- id: 0a36542c-4382-487f-b77b-3dbe08889602
  type: measurement
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:14127-14260
  refs:
  - id: 16837b5b-771c-4914-b578-b73986801620
    name: Mohs scale
  quote: |-
    steel used in a pocketknife is about 5.5 and glass is about 6, so glass can scratch steel, but a common pocketknife will NOT scratch glass.
  text: |-
    Steel used in a pocketknife measures about 5.5 on the Mohs hardness scale, and glass measures about 6, so glass can scratch steel but a common pocketknife will not scratch glass.
- id: c967826e-4998-4a8d-a5b0-f3993e013f15
