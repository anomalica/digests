  attribution_in_text: false
  location: char:14336-14559
  refs:
  - id: 16837b5b-771c-4914-b578-b73986801620
    name: Mohs scale
  quote: |-
    talc = measuring 1 on the hardness scale ... gypsum = 2 ... calcite = 3 ... fluorite = 4 ... apatite = 5 ... orthoclase feldspar = 6 ... quartz = 7 ... topaz = 8 ... corundum = 9 (including ruby and sapphire) ... diamond = 10
  text: |-
    On the Mohs scale, talc measures 1, gypsum 2, calcite 3, fluorite 4, apatite 5, orthoclase feldspar 6, quartz 7, topaz 8, corundum 9, and diamond 10, from softest to hardest.
