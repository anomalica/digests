    She leaves Kirtland.
    She's driving on the Interstate 25 to Colorado.
    ...
    She gets near Springer, New Mexico, which is about 40 miles from the Colorado state line.
    And the car, she has problems with the car.
    She pulls off the side of the road.
    It's just before the first exit going into Springer, New Mexico, a little town.
    And all of a sudden, the car lights up.
    She feels dizzy, and she loses time.
  text: |-
    Richard Doty related a case in which a female dependent wife of a United States Air Force captain experienced an alleged alien abduction while driving near Springer, New Mexico.
