    name: Missing time
  quote: |-
    he couldn't see their face. ... he starts hearing voices in his head and he thought, they're communicating with me. So he sits down and he, he never could explain why he sat down, but he sat down on the ground and he doesn't know how long this occurred, but he, when he woke up, he was in his sleeping bag in his tent. ... He knows that he got up at seven in the morning. He knows he made breakfast and had a campfire and then he went fishing and it was like 15 or 20 minutes after he started fishing that this happened. So he figured it was about 8:30 in the morning. And when he looked at his clock, it was 21:30, 9:30 PM.
  text: |-
    The pilot experienced approximately 10 hours of missing time; he sat down voluntarily after hearing voices in his head, and woke up in his sleeping bag in his tent at 21:30, having last checked his clock at approximately 08:30 that morning.
