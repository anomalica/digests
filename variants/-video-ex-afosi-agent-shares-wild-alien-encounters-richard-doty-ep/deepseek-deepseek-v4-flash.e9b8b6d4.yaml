    um pilots flying uh classified missions seeing UFOs and the fact that their mission was classified uh you can't talk about that and they they had a close encounter they had a ... you know they saw the UFO chased them or they chased it or they shot it down or there's just two in there where they actually shot down something but it mended itself and it flew back it was like uh This is way before Transformers movie ever came out.
  text: |-
    Some of the case files involve pilots flying classified missions who saw unidentified flying objects (UFOs), and in two separate incidents, pilots shot down an object with missiles, but the object repaired itself and flew away.
- id: bf5b8e25-bf3d-484f-b9ae-a529840963f9
  type: testimony
  attestation: first_hand
  speaker:
    id: 5d7ac5df-6589-4d28-86be-1726de02178e
