  text: |-
    Richard Doty stated that the United States government performs autopsies on dead extraterrestrial bodies recovered from crash sites, and that he knows this from people such as Kit Green who worked at the Armed Forces Institute of Pathology.
- id: 7f957d28-003c-433e-b92c-d978c5713bed
  type: opinion
  attestation: first_hand
  speaker:
