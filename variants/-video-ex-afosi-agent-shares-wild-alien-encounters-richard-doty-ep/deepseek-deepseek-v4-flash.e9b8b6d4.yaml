  quote: |-
    This guy was a crew member on a submarine in the probably 70s. Yeah, it would have been the 70s. They went someplace. They found something. He took a piece, a widget, and he took it, and he got out of the Navy, and he lived in Albuquerque, New Mexico. He worked on Kirtland Air Force Base as a civilian for a contractor. And he gave this widget to the contractor to try to figure out what it was. And Naval Intelligence had gotten information, I can't go into all that, but they knew all about this. And they came to Albuquerque and said, we need to go find this guy. We need to go pull him in. We need to get the FBI involved because he's civilian now.
  text: |-
    A United States Navy submarine crew member in the 1970s found an unidentified widget, which he took after leaving the Navy and living in Albuquerque, New Mexico, and gave to a contractor at Kirtland Air Force Base for analysis.
