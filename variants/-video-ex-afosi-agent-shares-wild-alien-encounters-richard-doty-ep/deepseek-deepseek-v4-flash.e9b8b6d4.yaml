    Different types of environments.
    Some where the extraterrestrials were breathing a little bit of methane.
  text: |-
    Richard Doty stated that there were 30 environmental cages or facilities at the site, each capable of housing an extraterrestrial, with some environments containing a small amount of methane for breathing.
