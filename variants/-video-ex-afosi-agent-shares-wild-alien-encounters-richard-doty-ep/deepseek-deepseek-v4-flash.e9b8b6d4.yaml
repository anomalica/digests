    And that's why all these abductions are occurring from different species, and they're just trying to examine us as we would them.
  text: |-
    Richard Doty expressed the opinion that extraterrestrials are interested in human biology, including body structure, skin, eyes, and reproduction, and that they abduct humans to examine them without intending harm.
