    name: Richard Doty
  quote: |-
    I thoroughly believe we had a civilization on Earth billions of years ago.
    And that they killed themselves with nuclear weapons because you can go to places, and I've been there in Malaysia and one place in Australia where there's remnants of radiation that has gone through their life, their half-life and full life, which is millions and millions of years.
    And you can find that stuff.
    Well, we didn't have radiation, nuclear weapons, millions of millions of years ago.
  text: |-
    Richard Doty expressed the personal opinion, not derived from documents, that an advanced civilisation existed on Earth billions of years ago and destroyed itself with nuclear weapons, based on evidence of old radiation traces found in Malaysia and Australia.
- id: a2b8a126-35b9-4182-adbe-a169e1d2f56b
  type: opinion
  attestation: first_hand
