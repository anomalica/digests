  text: |-
    The 7602nd Air Intelligence Wing, based at Fort Belvoir, Virginia, had a unit that conducted covert operations including so-called 'dirty tricks'; its operatives were known as 'thugs', were 'sheep dipped' with false identification (e.g., postal workers, construction company employees), and the United States Department of Justice was pre-briefed and could extract them if caught.
