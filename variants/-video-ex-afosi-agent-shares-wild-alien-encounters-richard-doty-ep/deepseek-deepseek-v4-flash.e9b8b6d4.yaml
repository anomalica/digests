  quote: |-
    I went in there to interview somebody.
    I wasn't supposed to see this.
    I was in there watching this and I asked the guy that I was supposed to be interviewed.
    I said, what's that?
    He said, oh, they're talking to one of the visitors.
    They call them visitors.
    And I watched maybe 20 seconds, 25 seconds of it.
    And then this colonel comes in and he says, can I help you?
    And I said, yeah, I'm here to interview so-and-so.
    He said, you're not cleared for here, sir.
    You need to get out of here.
  text: |-
    In 1979, Richard Doty viewed a closed-circuit television feed at a facility at Groom Lake, Nevada, showing an alien being with a large head and large eyes inside a harness or swing-like apparatus, similar to the entity depicted in the film The Alien Interview.
