    name: Groom Lake, Nevada
  - id: 8e1a46ef-8a1f-4055-8b86-5975482ab8f3
    name: AIM-9 Sidewinder
  quote: |-
    I can tell you they're flying out of the Groom Lake area. And this thing comes up, a flying saucer, comes up and almost hits his cockpit. I mean, his canopy almost just goes right over it. It really pisses him off. So he banks and he goes after it. And he's protecting this other flying, highly classified craft. And it goes down and he goes down and he shoots it. He shoots at it with his side winder missile. Two of them. And it hits it. And it crashes. Now, he's in a jet, so he can't obviously land. So he's circling it. And this thing, he says, it repaired itself and it flew away.
  text: |-
    A pilot flying a classified mission out of the Groom Lake, Nevada, area encountered a flying saucer that came up and almost hit his cockpit; the pilot banked and chased it, firing two AIM-9 Sidewinder missiles that hit the object, which crashed on the ground, then repaired itself and flew away.
- id: 1b8df0e9-11a2-4529-9265-c1f7edab67a7
  type: testimony
  attestation: first_hand
  speaker:
    id: 5d7ac5df-6589-4d28-86be-1726de02178e
