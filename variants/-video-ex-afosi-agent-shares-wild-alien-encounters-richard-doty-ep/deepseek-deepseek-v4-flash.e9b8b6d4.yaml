    She doesn't have her child with her.
    She doesn't know where she is.
    She doesn't know what happened six hours later.
  text: |-
    Richard Doty stated that during the alleged abduction case, the woman lost approximately six hours of time and woke up at Eagle Nest Lake, New Mexico, which is about 113 kilometres to the west of Springer, New Mexico.
