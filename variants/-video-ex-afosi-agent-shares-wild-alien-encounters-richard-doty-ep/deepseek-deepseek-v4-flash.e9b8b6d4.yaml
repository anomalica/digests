  - id: 479296e3-530f-45d7-995e-4f17f0a42c5b
    name: Lake Solidwood, New Mexico
  - id: 511fe008-03f5-46dd-a60b-a89f0272d45a
    name: A-7 Corsair II
  quote: |-
    This Air Force pilot loves fishing. So he's up in a lake, northern New Mexico, Lake Solidwood place. Just him. He's camping too. He sets up his tent and he's camping. There's a stream and then there's a lake, very small lake, and he's fishing. And there's a clearing. He's in a barely wooded area except for the lake. And then off to his north, yeah, north is a clearing. And one morning he gets up and he eats his breakfast and he goes and throws a pole in and he hears a sound. He says, I've never heard this sound before. He said, it's like a pulsating, boo, boo, boo, boo sound. ... Then he sees it and it starts to come down and it's something's pulsating under it this is flying saucer so he immediately goes over and he has a camera in fact one of those uh polaroid canaries he has in his in his tent because he always takes pictures of his fish He gets his polaroid camera and he comes out because then he drops his pole. He goes over to the clearing, to the tree line to take pictures of this. ... He gets over and he's waiting and he starts taking pictures. And next thing you know, there's two beings right next to him. ... these things were like seven foot tall. They had helmets on. He couldn't see their face.
  text: |-
    An Air Force pilot flying an A-7 Corsair II on a fishing and camping trip at Lake Solidwood in northern New Mexico in the morning encountered a flying saucer that descended with a pulsating sound; he took two Polaroid photographs of the craft, then found two approximately 2.1-metre-tall beings in helmets standing next to him.
