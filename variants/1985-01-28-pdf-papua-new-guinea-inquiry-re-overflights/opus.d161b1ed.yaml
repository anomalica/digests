    WE WOULD MOST APPRECIATE CONFIRMATION OF PARA 3 ABOVE AND ANY LIGHT YOU MIGHT THROW ON THESE REPORTS.
  text: |-
    Gardner requested confirmation from the United States Pacific Command (USCINCPAC) that there were no B-52 overflights and no US aircraft in Papua New Guinea airspace on 1985-01-24, and any further light on the reports.
