  quote: |-
    MATTER CAME TO NIO'S ATTENTION WHEN ITS OFFICER IN WEWAK REPORTED LOCAL RESIDENTS HAD BEEN FRIGHTENED BY OVERFLIGHTS
  text: |-
    The January 1985 Papua New Guinea overflight sightings came to the attention of the National Intelligence Organization (NIO) of Papua New Guinea when its officer in Wewak reported that local residents had been frightened by the overflights.
