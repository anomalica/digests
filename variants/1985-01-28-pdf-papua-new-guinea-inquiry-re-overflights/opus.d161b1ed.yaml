    name: Papua New Guinea, National Capital District, Port Moresby
  quote: |-
    EMBASSY JANUARY 28 RECEIVED INFORMAL INQUIRY FROM PNG NATIONAL INTELLIGENCE ORGANIZATION (NIO) CONCERNING REPORTED SIGHTINGS OF HIGH-ALTITUDE, HIGH-SPEED AIRCRAFT OVER PNG DURING EVENING JANUARY 24.
  text: |-
    On 1985-01-28 the United States Embassy Port Moresby received an informal inquiry from the National Intelligence Organization (NIO) of Papua New Guinea concerning reported sightings of high-altitude, high-speed aircraft over Papua New Guinea during the evening of 1985-01-24.
