  - id: 0065a057-11ff-498c-ab32-d0937503854a
    name: 1985 Papua New Guinea overflight sightings
  quote: |-
    PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
  text: |-
    The Air Niugini pilot said his radar picked up an aircraft flying south to north at high altitude and high speed while he was over Angoram, at approximately 4 degrees south, 144 degrees east.
