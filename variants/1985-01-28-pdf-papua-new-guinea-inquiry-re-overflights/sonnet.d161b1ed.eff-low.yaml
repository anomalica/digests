    name: 1985 Papua New Guinea overflight sightings
  quote: |-
    NIO SAID THERE HAVE BEEN VARIOUS REPORTS OF UNIDENTIFIED AERIAL PHENOMENA THE NIGHT OF JANUARY 24, INCLUDING FAST-MOVING OBJECTS WITH LIGHTS, CONTRAILS, AND NOISE.
  text: |-
    The Papua New Guinea National Intelligence Organization (NIO) reported that there were various reports of Unidentified Aerial Phenomena (UAP) on the night of 1985-01-24, including fast-moving objects with lights, contrails, and noise.
