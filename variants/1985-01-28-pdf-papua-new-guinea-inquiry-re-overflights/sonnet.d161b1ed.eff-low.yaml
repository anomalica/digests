    name: Papua New Guinea, East Sepik Province, Wewak
  quote: |-
    WHICH LED TO THE PROVINCIAL PREMIER'S CALLING OF A PUBLIC MEETING ON THE SUBJECT ATTENDED BY THE PRIME MINISTER WHO WAS WEEKENDING IN HIS ELECTORAL DISTRICT.
  text: |-
    Reports of the overflights led the provincial premier to call a public meeting on the subject, which was attended by the Prime Minister of Papua New Guinea, who was weekending in his electoral district.
