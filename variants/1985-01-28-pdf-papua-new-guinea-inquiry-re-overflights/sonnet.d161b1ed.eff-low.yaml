  quote: |-
    ALTHOUGH INFORMATION PROVIDED US ON THESE SIGHTINGS IS VERY SKETCHY AND SOURCES WERE UNSURE OF THE DIRECTIONS IN WHICH AIRCRAFT WERE FLYING
  text: |-
    Gardner (AMEMBASSY PORT MORESBY) considers the information provided on the 1985 Papua New Guinea overflight sightings to be very sketchy, with sources unsure of the directions in which the aircraft were flying.
