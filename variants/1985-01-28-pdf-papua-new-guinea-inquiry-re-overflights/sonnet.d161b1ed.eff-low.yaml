  - id: 0065a057-11ff-498c-ab32-d0937503854a
    name: 1985 Papua New Guinea overflight sightings
  quote: |-
    BASED ON OUR RECORDS AND TELCON WITH 43SW, WE HAVE TOLD NIO WE KNEW OF NO B-52 OVERFLIGHTS AND NO U.S. AIRCRAFT IN PNG AIRSPACE ON JANUARY 24.
  text: |-
    Based on the Embassy's records and a telephone conversation with the 43rd Strategic Wing (43SW), Gardner (AMEMBASSY PORT MORESBY) told the Papua New Guinea National Intelligence Organization (NIO) that the Embassy knew of no B-52 overflights and no US aircraft in Papua New Guinea airspace on 1985-01-24.
