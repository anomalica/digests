    name: Papua New Guinea National Intelligence Organization (NIO)
  - id: a8ec09fa-590a-440a-ad6b-3265fc054d6e
    name: Papua New Guinea, East Sepik Province, Wewak
  - id: 0065a057-11ff-498c-ab32-d0937503854a
    name: 1985 Papua New Guinea overflight sightings
  quote: |-
    MATTER CAME TO NIO'S ATTENTION WHEN ITS OFFICER IN WEWAK REPORTED LOCAL RESIDENTS HAD BEEN FRIGHTENED BY OVERFLIGHTS
  text: |-
    During the 1985 Papua New Guinea overflight sightings, the matter came to the attention of the Papua New Guinea National Intelligence Organization (NIO) when its officer in Wewak reported that local residents had been frightened by the overflights.
