  - id: 0065a057-11ff-498c-ab32-d0937503854a
    name: 1985 Papua New Guinea overflight sightings
  quote: |-
    EMBASSY JANUARY 28 RECEIVED INFORMAL INQUIRY FROM PNG NATIONAL INTELLIGENCE ORGANIZATION (NIO) CONCERNING REPORTED SIGHTINGS OF HIGH-ALTITUDE, HIGH-SPEED AIRCRAFT OVER PNG DURING EVENING JANUARY 24.
  text: |-
    On 1985-01-28, the Embassy at Port Moresby received an informal inquiry from the Papua New Guinea National Intelligence Organization (NIO) concerning reported sightings of high-altitude, high-speed aircraft over Papua New Guinea during the evening of 1985-01-24.
- id: ebbe7c26-9bf0-4376-bd79-d9d604545fa4
  type: observation
