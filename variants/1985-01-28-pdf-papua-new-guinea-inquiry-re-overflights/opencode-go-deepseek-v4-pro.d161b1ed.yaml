    quote: |-
      NIO SAID THERE HAVE BEEN VARIOUS REPORTS OF UNIDENTIFIED AERIAL PHENOMENA THE NIGHT OF JANUARY 24, INCLUDING FAST-MOVING OBJECTS WITH LIGHTS, CONTRAILS, AND NOISE.
    text: |-
      The Papua New Guinea National Intelligence Organization (NIO) reported various sightings of unidentified aerial phenomena on the night of 1985-01-24, including fast-moving objects with lights, contrails, and noise.
