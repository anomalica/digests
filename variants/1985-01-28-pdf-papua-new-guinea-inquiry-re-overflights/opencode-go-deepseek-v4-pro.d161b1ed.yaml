    quote: |-
      PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
    text: |-
      An Air Niugini pilot, in a report relayed by the Papua New Guinea National Intelligence Organization (NIO), stated that his radar picked up an aircraft flying south to north at high altitude and high speed while he was over Angoram (in the vicinity of 4°S, 144°E) on 1985-01-24.
