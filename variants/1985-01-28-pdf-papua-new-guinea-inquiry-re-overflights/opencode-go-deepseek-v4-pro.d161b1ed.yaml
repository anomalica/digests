    quote: |-
      THE REPORT IN WHICH NIO PLACES SOME CREDENCE ORIGINATED WITH AN AIR NIUGINI PILOT WHO HAD JUST TAKEN OFF FROM WEWAK ENROUTE PORT MORESBY.
    text: |-
      The Papua New Guinea National Intelligence Organization (NIO) placed credence in a report that originated with an Air Niugini pilot who had just taken off from Wewak en route to Port Moresby on 1985-01-24.
