        name: 1985-01-24 Papua New Guinea Overflights
    quote: |-
      BASED ON OUR RECORDS AND TELCON WITH 43SW, WE HAVE TOLD NIO WE KNEW OF NO B-52 OVERFLIGHTS AND NO U.S. AIRCRAFT IN PNG AIRSPACE ON JANUARY 24.
    text: |-
      The United States Embassy, Port Moresby, based on its records and a telephone conversation with the 43rd Strategic Wing (43SW), informed the Papua New Guinea National Intelligence Organization (NIO) that it knew of no B-52 Stratofortress overflights and no U.S. aircraft in Papua New Guinea airspace on 1985-01-24.
