    quote: |-
      WE WOULD MOST APPRECIATE CONFIRMATION OF PARA 3 ABOVE AND ANY LIGHT YOU MIGHT THROW ON THESE REPORTS.
    text: |-
      Gardner requested confirmation from the United States Commander in Chief, Pacific Command (USCINCPAC) that there were no known B-52 Stratofortress overflights or U.S. aircraft in Papua New Guinea airspace on 1985-01-24, and any additional information on the sightings.
