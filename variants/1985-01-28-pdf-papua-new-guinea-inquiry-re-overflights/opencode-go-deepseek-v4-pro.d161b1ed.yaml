        name: 1985-01-24 Papua New Guinea Overflights
    quote: |-
      ALTHOUGH INFORMATION PROVIDED US ON THESE SIGHTINGS IS VERY SKETCHY AND SOURCES WERE UNSURE OF THE DIRECTIONS IN WHICH AIRCRAFT WERE FLYING
    text: |-
      The information provided to the United States Embassy, Port Moresby about the sightings of 1985-01-24 was sketchy, and the sources were unsure of the directions in which the aircraft were flying.
