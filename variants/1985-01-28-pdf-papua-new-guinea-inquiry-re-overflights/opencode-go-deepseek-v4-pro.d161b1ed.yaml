        name: 1985-01-24 Papua New Guinea Overflights
    quote: |-
      SEVERAL VISUAL SIGHTINGS OF CONTRAILS WERE ALSO REPORTED FROM VARIOUS POINTS AROUND PNG, OF ONE AIRCRAFT MOVING NORTH TO SOUTH AT 1900 LOCAL AND OF SIX-EIGHT AIRCRAFT TRAVELING SOUTH TO NORTH AT 2200 LOCAL.
    text: |-
      Unnamed witnesses in various locations around Papua New Guinea reported visual sightings of contrails on 1985-01-24, as relayed by the Papua New Guinea National Intelligence Organization (NIO), including one aircraft moving north to south at approximately 1900 local time and six to eight aircraft travelling south to north at approximately 2200 local time.
