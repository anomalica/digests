    quote: |-
      MATTER CAME TO NIO'S ATTENTION WHEN ITS OFFICER IN WEWAK REPORTED LOCAL RESIDENTS HAD BEEN FRIGHTENED BY OVERFLIGHTS
    text: |-
      According to the Papua New Guinea National Intelligence Organization (NIO), the matter came to its attention when its officer in Wewak, Papua New Guinea reported that local residents had been frightened by the overflights of 1985-01-24.
