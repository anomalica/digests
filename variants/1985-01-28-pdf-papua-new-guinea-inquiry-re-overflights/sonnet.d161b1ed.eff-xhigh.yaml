    quote: |-
      PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
    text: |-
      An Air Niugini pilot who had just taken off from Wewak, Papua New Guinea en route to Port Moresby, Papua New Guinea reported that his radar detected aircraft flying from south to north at high altitude and high speed while he was over Angoram, Papua New Guinea, in the vicinity of 4 degrees south, 144 degrees east, according to a report relayed to the United States Embassy Port Moresby by the Papua New Guinea National Intelligence Organization (NIO).
