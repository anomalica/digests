    PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
  text: |-
    An Air Niugini pilot had just taken off from Wewak, Papua New Guinea, and was en route to Port Moresby, Papua New Guinea, when his radar detected aircraft flying south to north at high altitude and high speed while he was over Angoram, Papua New Guinea (vicinity 4 degrees south, 144 degrees east).
