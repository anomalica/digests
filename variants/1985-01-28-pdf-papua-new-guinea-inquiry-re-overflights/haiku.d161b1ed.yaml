    name: Wewak
  quote: |-
    MATTER CAME TO NIO'S ATTENTION WHEN ITS OFFICER IN WEWAK REPORTED LOCAL RESIDENTS HAD BEEN FRIGHTENED BY OVERFLIGHTS
  text: |-
    The Papua New Guinea National Intelligence Organization (NIO) first became aware of the reported overflights when its officer in Wewak reported that local residents had been frightened by overflights.
