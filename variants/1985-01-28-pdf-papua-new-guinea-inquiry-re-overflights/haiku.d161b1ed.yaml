  - id: 32e48933-38f2-4c7a-b857-cfd6bd2614dc
    name: Angoram
  quote: |-
    THE REPORT IN WHICH NIO PLACES SOME CREDENCE ORIGINATED WITH AN AIR NIUGINI PILOT WHO HAD JUST TAKEN OFF FROM WEWAK ENROUTE PORT MORESBY. PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
  text: |-
    An Air Niugini pilot who had just taken off from Wewak en route to Port Moresby reported that their radar picked up aircraft flying south to north at high altitude and high speed when the pilot was over Angoram (approximately 4 degrees south, 144 degrees east).
