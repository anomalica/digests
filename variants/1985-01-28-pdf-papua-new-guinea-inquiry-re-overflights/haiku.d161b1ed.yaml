    name: Papua New Guinea
  quote: |-
    EMBASSY JANUARY 28 RECEIVED INFORMAL INQUIRY FROM PNG NATIONAL INTELLIGENCE ORGANIZATION (NIO) CONCERNING REPORTED SIGHTINGS OF HIGH-ALTITUDE, HIGH-SPEED AIRCRAFT OVER PNG DURING EVENING JANUARY 24.
  text: |-
    On 1985-01-28, the Papua New Guinea National Intelligence Organization (NIO) made an informal inquiry to the United States Embassy Port Moresby concerning reported sightings of high-altitude, high-speed aircraft over Papua New Guinea during the evening of 1985-01-24.
