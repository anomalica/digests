    name: United States Air Force
  - id: 7a2cbe0e-e78e-4ec5-998e-d7e7d0669964
    name: Gardner
  quote: |-
    BASED ON OUR RECORDS AND TELCON WITH 43SW, WE HAVE TOLD NIO WE KNEW OF NO B-52 OVERFLIGHTS AND NO U.S. AIRCRAFT IN PNG AIRSPACE ON JANUARY 24.
  text: |-
    Based on records and telephone conversation with the 43rd Strategic Wing (43 SW), Gardner of the United States Embassy Port Moresby informed the Papua New Guinea National Intelligence Organization (NIO) that the United States knew of no B-52 overflights and no United States aircraft in Papua New Guinea airspace on 1985-01-24.
