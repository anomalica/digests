  refs:
  - id: 930138fa-097c-4c58-a045-b29ef7c8a33d
    name: Papua New Guinea
  quote: |-
    SEVERAL VISUAL SIGHTINGS OF CONTRAILS WERE ALSO REPORTED FROM VARIOUS POINTS AROUND PNG, OF ONE AIRCRAFT MOVING NORTH TO SOUTH AT 1900 LOCAL AND OF SIX-EIGHT AIRCRAFT TRAVELING SOUTH TO NORTH AT 2200 LOCAL.
  text: |-
    Visual sightings of contrails were reported from various points around Papua New Guinea, including one aircraft moving north to south at approximately 1900 local time and six to eight aircraft travelling south to north at approximately 2200 local time on 1985-01-24.
