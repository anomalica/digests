  - id: b3c24a68-6737-4d1b-b3ed-021ee34e4cb8
    name: United States Embassy Port Moresby
  - id: 1dfa8d24-b9e3-41b0-9d31-a1775495fca2
    name: Papua New Guinea National Intelligence Organization (NIO)
