  - id: b60f8729-e380-4511-808e-3cf12d75c6fc
    name: Unidentified Aerial Phenomena (UAP)
  quote: |-
    NIO SAID THERE HAVE BEEN VARIOUS REPORTS OF UNIDENTIFIED AERIAL PHENOMENA THE NIGHT OF JANUARY 24, INCLUDING FAST-MOVING OBJECTS WITH LIGHTS, CONTRAILS, AND NOISE.
  text: |-
    On the night of 1985-01-24, various reports of Unidentified Aerial Phenomena (UAP) were received, including fast-moving objects with lights, contrails, and noise.
