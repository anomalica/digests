    name: Papua New Guinea
  quote: |-
    OVERFLIGHTS, WHICH LED TO THE PROVINCIAL PREMIER'S CALLING OF A PUBLIC MEETING ON THE SUBJECT ATTENDED BY THE PRIME MINISTER WHO WAS WEEKENDING IN HIS ELECTORAL DISTRICT.
  text: |-
    The overflights on 1985-01-24 led to the Provincial Premier of Papua New Guinea calling a public meeting on the subject, which was attended by the Prime Minister who was weekending in his electoral district.
