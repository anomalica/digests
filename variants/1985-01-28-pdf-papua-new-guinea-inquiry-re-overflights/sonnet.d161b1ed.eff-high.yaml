  quote: |-
    PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
  text: |-
    An unnamed Air Niugini pilot, flying from Wewak to Port Moresby on the evening of 1985-01-24, reported via the Papua New Guinea National Intelligence Organization (NIO) that his aircraft's radar detected an aircraft flying from south to north at high altitude and high speed while he was over Angoram, Papua New Guinea (approximately 4 degrees south, 144 degrees east).
