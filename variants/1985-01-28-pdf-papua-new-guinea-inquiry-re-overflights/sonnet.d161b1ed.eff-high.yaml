  quote: |-
    THE REPORT IN WHICH NIO PLACES SOME CREDENCE ORIGINATED WITH AN AIR NIUGINI PILOT WHO HAD JUST TAKEN OFF FROM WEWAK ENROUTE PORT MORESBY.
  text: |-
    The report about the 1985 Papua New Guinea overflight sightings that the Papua New Guinea National Intelligence Organization (NIO) placed the most credence in originated with an Air Niugini pilot who had just taken off from Wewak en route to Port Moresby.
