    Based on Embassy records and a telephone conversation with the 43rd Strategic Wing (43SW), USA, Embassy Port Moresby told the Papua New Guinea National Intelligence Organization (NIO) that it knew of no B-52 overflights of Papua New Guinea on 1985-01-24.
