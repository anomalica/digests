  quote: |-
    EMBASSY JANUARY 28 RECEIVED INFORMAL INQUIRY FROM PNG NATIONAL INTELLIGENCE ORGANIZATION (NIO) CONCERNING REPORTED SIGHTINGS OF HIGH-ALTITUDE, HIGH-SPEED AIRCRAFT OVER PNG DURING EVENING JANUARY 24.
  text: |-
    On 1985-01-28, the United States Embassy Port Moresby received an informal inquiry from the Papua New Guinea National Intelligence Organization (NIO) concerning reported sightings of aircraft over Papua New Guinea on the evening of 1985-01-24.
