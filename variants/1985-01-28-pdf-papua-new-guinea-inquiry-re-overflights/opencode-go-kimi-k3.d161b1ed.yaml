  quote: |-
    PILOT SAID HIS RADAR PICKED UP AIRCRAFT FLYING SOUTH TO NORTH AT HIGH ALTITUDE AND HIGH SPEED WHEN HE WAS OVER ANGORAM (VIC 4 DEG S, 144 DEG E).
  text: |-
    An unnamed Air Niugini pilot flying from Wewak to Port Moresby reported that his radar picked up an aircraft flying south to north at high altitude and high speed while he was over Angoram, Papua New Guinea, in the vicinity of 4 degrees south and 144 degrees east, during the 1985 Papua New Guinea unidentified aircraft sightings; the account reached the United States Embassy Port Moresby through the Papua New Guinea National Intelligence Organization (NIO).
