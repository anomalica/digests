  quote: |-
    MATTER CAME TO NIO'S ATTENTION WHEN ITS OFFICER IN WEWAK REPORTED LOCAL RESIDENTS HAD BEEN FRIGHTENED BY OVERFLIGHTS
  text: |-
    During the 1985 Papua New Guinea unidentified aircraft sightings, local residents in Wewak, Papua New Guinea were frightened by overflights on the evening of 1985-01-24, according to a report by an unnamed Papua New Guinea National Intelligence Organization (NIO) officer in Wewak that was relayed by the NIO to the United States Embassy Port Moresby.
