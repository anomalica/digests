    SEVERAL VISUAL SIGHTINGS OF CONTRAILS WERE ALSO REPORTED FROM VARIOUS POINTS AROUND PNG, OF ONE AIRCRAFT MOVING NORTH TO SOUTH AT 1900 LOCAL
  text: |-
    Unnamed witnesses at various points around Papua New Guinea reported a visual sighting of a contrail from one aircraft moving north to south at 19:00 local time on 1985-01-24, according to accounts relayed by the Papua New Guinea National Intelligence Organization (NIO) to the United States Embassy Port Moresby.
