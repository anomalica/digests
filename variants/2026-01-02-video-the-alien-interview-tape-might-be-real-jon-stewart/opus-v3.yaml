        name: Victor
    quote: if you're this egomaniac actor that most actors are they want their name they want their recognition... but if
      Victor is a government employee, a military person, somebody from an administration, an elected official, a chaplain
      with the government, wow, now we got a whole new ballgame.
    text: Jon Stewart argues that if Victor were an ego-driven paid actor he would have wanted his identity known, whereas
      Victor's insistence on protecting his identity suggests he was a government employee, military person, official, or
      chaplain.
