    quote: the biggest reason was no one could guarantee his anonymity... They would not be willing to sign a contract, pay
      him in cash, and not really use his name.
    text: The Hollywood television studios turned Victor down primarily because no one could guarantee his anonymity, pay
      him in cash, and withhold his name.
