    And they actually threw him out of the program. They did things she felt to inhibit him from getting a real job. She said he was an adjunct professor or lecturer, not a full-time... She said, Jon, I'm telling you, two of his students from UCLA came up to him when we were out, because they lived in Los Angeles... they turned him into a bum, effectively.
  text: |-
    The widow of a USA, Nevada, S4 telepath reported that her husband was removed from his classified programme after objecting to military offensive use of his system, and subsequently faced systematic impediments to securing full-time academic employment despite being qualified to teach at University of California, Los Angeles (UCLA).
