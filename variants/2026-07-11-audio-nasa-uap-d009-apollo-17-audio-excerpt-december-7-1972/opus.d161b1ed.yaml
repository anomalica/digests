  - id: 7489596f-23bb-4b58-bd53-9e94de98a341
    name: Apollo 17 mission
  quote: |-
    There's a whole bunch of big ones on my window there. Just bright. Looks like the 4th of July out Ron's window.
  text: |-
    During the Apollo 17 mission, an Apollo 17 crew member observed a whole bunch of large bright particles on his window, likened to the 4th of July display, seen out of Ronald Evans's window.
