    quote: |-
      Roger, they look like fluid of some sort? / Not to me. They look like pieces or something.
    text: |-
      During the Apollo 17 fragment field sighting on 1972-12-07, ground control asked whether the fragments looked like fluid of some sort, and a crew member responded that they did not look like fluid to him but instead looked like pieces or something.
