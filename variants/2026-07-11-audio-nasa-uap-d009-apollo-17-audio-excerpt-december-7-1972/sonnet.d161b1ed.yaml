    quote: |-
      All right, I noticed on one trip up the elevator last week, one of the flags, I thought it was in the S-2, but it might be on the S-4. It looked like it was peeling. Maybe that's what you got.
    text: |-
      Ground control on Apollo 17 recalled noticing during a prior elevator trip that a flag on either the S-II or S-IVB stage appeared to be peeling, and suggested this could relate to the fragments observed on 1972-12-07.
