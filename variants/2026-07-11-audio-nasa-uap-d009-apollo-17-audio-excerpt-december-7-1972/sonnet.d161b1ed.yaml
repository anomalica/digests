    quote: |-
      Yeah, now you can see some of them in shape. They're very jagged, angular, fragmented or tumbling.
    text: |-
      During the Apollo 17 fragment field sighting on 1972-12-07, a crew member observed that the fragments were very jagged, angular, and either fragmented or tumbling in shape.
