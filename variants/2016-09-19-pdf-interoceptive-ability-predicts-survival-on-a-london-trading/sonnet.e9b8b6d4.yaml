  - id: 18911692-e946-4280-9cf1-53953b587de4
    name: heartbeat detection task
  quote: |-
    We measured individual differences in each trader's capacity to detect interoceptive signals - i.e. the changes, often subtle, in the physiological state of their bodies – by means of two established heartbeat detection tasks.
  text: |-
    Narayanan Kandasamy, Sarah N. Garfinkel, Lionel Page, Ben Hardy, Hugo D. Critchley, Mark Gurnell and John M. Coates measured individual differences in each trader's capacity to detect interoceptive signals using two established heartbeat detection tasks.
- id: 08bd1294-db75-4851-8c6c-3c7e99f387e6
  type: administrative
  provenance_chain:
    origin_kind: unattributed
