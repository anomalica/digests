    name: heartbeat detection task
  quote: |-
    After each trial of the counting task, the traders rated their confidence in their heartbeat detection using a visual analogue scale. At one end of this scale was marked "Total guess/No heartbeat awareness", at the other end "Complete confidence/Full perception of heartbeat".
  text: |-
    After each trial of the heartbeat counting task, the traders rated their confidence in their heartbeat detection using a visual analogue scale ranging from 'Total guess/No heartbeat awareness' to 'Complete confidence/Full perception of heartbeat'.
- id: 4d851c2c-ae1a-4d99-b1ed-3023179a94c5
