    name: heartbeat detection task
  - id: 05d72895-77c0-4913-ae95-004871e9624f
    name: Interoceptive Ability Predicts Survival on a London Trading Floor
  quote: |-
    Each trader first performed a heartbeat counting task, in which he was instructed to silently count, without touching chest or any pulse point, how many heartbeats he felt over brief time intervals.
  text: |-
    In the heartbeat counting task, each trader was instructed to silently count, without touching chest or any pulse point, how many heartbeats he felt over brief time intervals.
- id: 1d945142-9e5b-4690-a4a0-a98a62434765
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:6792-6894
  refs:
  - id: 18911692-e946-4280-9cf1-53953b587de4
    name: heartbeat detection task
  quote: |-
    This counting task was repeated six times, using randomized time periods of 25, 30, 35, 40, 45 and 50 seconds.
  text: |-
    The heartbeat counting task was repeated six times, using randomised time periods of 25, 30, 35, 40, 45 and 50 seconds.
- id: da7bb71b-1f11-4145-befc-3dd3142576e6
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:6903-7098
  refs:
  - id: 18911692-e946-4280-9cf1-53953b587de4
    name: heartbeat detection task
  quote: |-
    The number of heartbeats perceived by the trader within each time period was compared with the actual number of heartbeats, as recorded over that interval objectively and non-invasively by pulse oximetry.
  text: |-
    The number of heartbeats perceived by each trader within each time period was compared with the actual number of heartbeats, as recorded objectively and non-invasively by pulse oximetry over that interval.
- id: 59bd9b3a-bd67-4abf-8178-59b9f4481366
  type: administrative
  provenance_chain:
