    name: Interoceptive Ability Predicts Survival on a London Trading Floor
  - id: 18911692-e946-4280-9cf1-53953b587de4
    name: heartbeat detection task
  quote: |-
    We found that traders are better able to perceive their own heartbeats than matched controls from the non-trading population.
  text: |-
    The traders studied on the London trading floor are better able to perceive their own heartbeats than matched controls from the non-trading population.
- id: 630c219d-c126-4a71-abf6-67d7490e06bb
  type: measurement
