    name: somatic marker hypothesis
  quote: |-
    Antoine Bechara and Antonio Damasio have observed that high-risk choices made on the Iowa Gambling Task are accompanied by rapid and subtle physiological changes – for example, sympathetic skin response - which they call 'somatic markers'.
  text: |-
    Antoine Bechara and Antonio Damasio observed that high-risk choices made on the Iowa Gambling Task are accompanied by rapid and subtle physiological changes, for example sympathetic skin response, which they call 'somatic markers'.
- id: 2b3e9804-1556-4adc-9367-d6b87b79bc7f
  type: observation
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:2517-2688
  refs:
  - id: 8e6b679f-ca68-4d2d-852d-2f0f77fcbc81
    name: somatic marker hypothesis
  quote: |-
    Such autonomic responses feedback on the brain to bias our decisions, steering us away from gambles with negative expected returns and towards ones with positive expected returns.
  text: |-
    Such autonomic responses (somatic markers) feed back on the brain to bias decisions, steering people away from gambles with negative expected returns and towards ones with positive expected returns.
- id: bbfaec1d-1f22-44e5-a8f0-cd17dc30d1bb
  type: observation
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:2697-2835
  refs:
  - id: 8e6b679f-ca68-4d2d-852d-2f0f77fcbc81
    name: somatic marker hypothesis
  quote: |-
    People can generate somatic markers and make optimal decisions on gambling tasks before they are able to articulate the reasons for their decisions.
  text: |-
    People can generate somatic markers and make optimal decisions on gambling tasks before they are able to articulate the reasons for their decisions.
- id: 6cd81219-350b-42eb-b104-70f963ea2e7f
