    name: Interoceptive Ability Predicts Survival on a London Trading Floor
  quote: |-
    Here, we report on a study in which we quantified heartbeat detection skills in a group of financial traders working on a London trading floor.
  text: |-
    Narayanan Kandasamy, Sarah N. Garfinkel, Lionel Page, Ben Hardy, Hugo D. Critchley, Mark Gurnell and John M. Coates quantified heartbeat detection skills in a group of financial traders working on a London trading floor.
- id: 9848ddaa-f7d3-4112-865a-97548d429d64
  type: measurement
  provenance_chain:
