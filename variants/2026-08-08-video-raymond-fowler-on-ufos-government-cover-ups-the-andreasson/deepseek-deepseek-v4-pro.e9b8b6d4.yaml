  - id: 28fde273-7ed5-4a03-85eb-173f4ba17b0b
    name: Avrocar (VZ-9)
  quote: |-
    The Canadian government attempted to build a circular airfoil. It was being built by the Avro Company Limited The United States Air Force worked with them, and they produced what essentially became a hovercraft, which could move maybe three or four feet above the ground. It rode in a cushion of air, but it was very, very unstable, and that also was at an air museum.
  text: |-
    The Canadian government attempted to build a circular airfoil through the Avro Company; in collaboration with the United States Air Force, they produced the Avrocar (VZ-9), a hovercraft that could move only a few feet above the ground on a cushion of air and was very unstable.
- id: 86a0a815-b18f-4a80-b592-4021d527d5b6
  type: opinion
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
