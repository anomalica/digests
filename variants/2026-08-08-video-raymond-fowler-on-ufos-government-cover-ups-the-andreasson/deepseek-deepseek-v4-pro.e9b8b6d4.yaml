    name: Unidentified Flying Objects (UFO)
  quote: |-
    We've talked to radar operators who've clocked UFOs along the East Coast here. We had an alert back in the 60s, I believe it was, tracked at 18,000 miles per hour.
  text: |-
    Radar operators have tracked UFOs along the US East Coast, with one alert in the 1960s recording a speed of approximately 29,000 kilometres per hour.
- id: aefe721a-87cf-4c18-a3ad-2b1729f70688
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
