  quote: |-
    I think that we're going through a sort of process that has been instigated by whatever it is. The first sightings were just flyovers, and then you had the close encounters, and then you had the close encounters of the second kind, and then you had the close encounters of the third kind. It was almost a conditioning process... So it seems to be a conditioning thing that we see that we are gradually accepting the existence of whatever they are. I think it's been instigated probably by them
  text: |-
    Raymond Fowler believes a process of gradual conditioning occurs through the succession of closer UFO encounter types, instigated by the phenomenon itself, leading to gradual public acceptance of their existence.
