    name: Project Sign
  - id: b0f93a2d-9aab-45a0-bc61-d8622b00b4e9
    name: Hoyt Vandenberg
  quote: |-
    And they sent a top secret estimate of the situation to General Vandenberg, who was the commander of the Army Air Force at that particular time.
  text: |-
    Project Sign sent a top-secret estimate of the situation to General Hoyt Vandenberg, the commander of the Army Air Force.
- id: 32ea71e0-ad25-4150-8e61-9c20d629c09e
  type: observation
  attestation: first_hand
  speaker:
