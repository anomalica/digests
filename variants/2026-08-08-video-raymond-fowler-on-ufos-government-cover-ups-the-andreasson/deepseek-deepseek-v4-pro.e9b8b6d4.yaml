    name: Project Sign
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    And in January of 1948, Project Sign was initiated. Sign concluded, after eliminating Russian and domestic origin, that they could be extraterrestrial.
  text: |-
    Project Sign was initiated in January 1948 and, after eliminating Russian and domestic origin, concluded that UFOs could be extraterrestrial.
- id: 7a1809aa-5730-4e90-8235-75b216c18d14
  type: observation
  attestation: first_hand
