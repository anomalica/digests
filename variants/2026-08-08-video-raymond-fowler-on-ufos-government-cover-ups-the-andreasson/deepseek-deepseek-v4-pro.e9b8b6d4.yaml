    name: Hoyt Vandenberg
  - id: 0848be85-fdef-4e13-8eaf-99bb4ef1f32a
    name: Project Sign
  quote: |-
    On the surface, General Vandenberg rejected the estimate of the situation. He said there was no proof. But concurrently, he replaced everybody on Project Sign that was on Project Sign
  text: |-
    General Hoyt Vandenberg publicly rejected Project Sign's estimate of the situation, stating there was no proof, but concurrently replaced the entire Project Sign staff.
- id: 18cd52fa-912a-47c3-8205-48b204559152
  type: observation
  attestation: first_hand
  speaker:
