  - id: 6a4f0781-7d0b-4f06-ae80-ed5750adf330
    name: Nathan Twining
  - id: 66a7d488-e132-40a2-a03b-f74c9d8800af
    name: Twining memorandum (September 23, 1947)
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    And on September 23, 1947, General Nathan Twining provided their conclusion or their estimate of the situation at that time in a memo to the commander of the Army Air Force. And he said that the UFOs are real. They're not visionary. and he gave him a description in this particular memo which we were able to get through the Freedom of Information Act and urged that immediately a project should be set up to investigate what they were
  text: |-
    On 1947-09-23, General Nathan Twining sent a memo to the commander of the Army Air Force concluding that UFOs are real, not visionary, and urging the establishment of an investigation project.
- id: 9d6349a9-1064-4ac1-a342-50ce9be8d954
  type: observation
