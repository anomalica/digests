  refs:
  - id: b3ce560f-70cd-4003-b676-84d7b3e94a89
    name: United States Air Force (USAF)
  - id: 9362a002-ca53-4a18-afce-e5a2d81283df
    name: Project Blue Book
  quote: |-
    So in December of 1969, December 17, 1969, the United States Air Force again told the public that it had terminated its UFO program
  text: |-
    On 1969-12-17, the United States Air Force publicly announced the termination of its UFO program, Project Blue Book.
