  refs:
  - id: 9362a002-ca53-4a18-afce-e5a2d81283df
    name: Project Blue Book
  quote: |-
    This was until March of 1952, when we had so many sightings in this country, banner headlines, Congress pounding on the Pentagon's door asking for explanations, that they opened Project Blue Book, which you mentioned.
  text: |-
    Project Blue Book was opened in March 1952 in response to a massive wave of sightings, banner headlines, and congressional inquiries.
- id: e29593c1-e40c-492b-aae2-1a6bfec764b8
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:12:54.8-00:13:08.8
  refs:
  - id: 9362a002-ca53-4a18-afce-e5a2d81283df
    name: Project Blue Book
  - id: 231ad7d6-0e96-4f09-96aa-a4ae3b907add
    name: Life Magazine
  - id: b3ce560f-70cd-4003-b676-84d7b3e94a89
    name: United States Air Force (USAF)
  quote: |-
    And Project Blue Book again allowed public participation in the Air Force UFO program. And they had to do this in order to get data. They were anxious for data. They even made deals with Life Magazine to use Life Magazine's worldwide correspondence to get data that were so interested in data.
  text: |-
    Project Blue Book allowed public participation in the Air Force UFO program and the Air Force made deals with Life Magazine to use its global correspondence network to gather UFO data.
- id: d218ccbd-1c7e-4470-9e11-dee6d5f011d7
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:13:17.7-00:13:33.5
  refs:
  - id: b3ce560f-70cd-4003-b676-84d7b3e94a89
    name: United States Air Force (USAF)
  - id: 9362a002-ca53-4a18-afce-e5a2d81283df
    name: Project Blue Book
  quote: |-
    Their regulations indicated that they couldn't tell the public that there were unknowns, that they were only to tell the public the ones that they had identified. And because of this, they had to give all types of explanations for UFOs, and it caused the Air Force to have a very bad name.
  text: |-
    Air Force regulations of the era instructed personnel not to disclose unknowns to the public, only identified cases, leading to a poor public image for the Air Force due to the numerous prosaic explanations given for UFOs.
- id: 0c4aeb1d-ba98-4879-abc0-3c043364e2d8
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:13:34.3-00:13:42.8
  refs:
  - id: b3ce560f-70cd-4003-b676-84d7b3e94a89
    name: United States Air Force (USAF)
  - id: 9362a002-ca53-4a18-afce-e5a2d81283df
    name: Project Blue Book
  quote: |-
    Not only that, the information concerning UFOs was highly classified, and having the public participation in the UFO program wasn't to the best of the Air Force interests.
  text: |-
    UFO information was highly classified, and public participation in the program was not in the best interests of the Air Force.
