  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    I would say that the first well-documented UFO wave of sightings took place in 1896 1897 if you examine the newspapers from that day in this country and abroad you see the typical flying saucer type of reports back then except they call them airships
  text: |-
    Raymond Fowler identifies the first well-documented UFO wave as the 1896–1897 mystery airship wave, when newspapers reported flying saucer-type objects called airships.
- id: 82f1ea48-0755-4f1c-ab3f-2a168828106e
  type: observation
  attestation: first_hand
