  attribution_in_text: false
  location: 00:07:07.6-00:07:30.6
  refs:
  - id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    They don't really fly, Bill. They operate just like diving bells. They come in, they wobble almost as if they're weightless. They do their thing. They usually don't go from A to B over a long distance. They're very localized. When they're through doing what they're doing, they sort of tilt up, and they're drawn almost straight up like they're attached to a string or something. They just go right up. So they really don't fly.
  text: |-
    Raymond Fowler observed that UFOs do not fly in the conventional sense but operate like diving bells, wobbling as if weightless and being drawn straight up as if pulled by a string.
- id: e0018d0d-7c7a-4afb-8bd9-75cee041147a
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:00:00.0-00:00:00.0
  refs:
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    And when they do move, they don't create a sonic boom. They're able to take right-angle turns. ... The 90-degree angle seems to be a 90-degree turn without a curve radius at all, which seems to be almost impossible.
  text: |-
    UFOs do not create a sonic boom and are able to make right-angle turns without a curve radius, which seems almost impossible.
- id: 8b0c0bfc-8a0f-4393-a20c-9653e411b79a
  type: opinion
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:07:38.6-00:07:51.5
  refs:
  - id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    But it's almost as if they're being directed by something above them, by some kind of invisible energy. They seem to have infinite mass to throw away, but don't seem to have any mass themselves.
  text: |-
    Raymond Fowler suggests that UFOs appear to be directed by some kind of invisible energy from above, possessing infinite mass to throw away while seeming to have no mass themselves.
- id: fa1bc537-85e0-4f19-bdf0-bbeeed25d0f0
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
    origin_kind: speaker
    origin: Raymond Fowler
  attribution_in_text: false
  location: 00:07:53.2-00:08:15.7
  refs:
  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    When they stop and hover, they sort of waft and wobble almost like a boat on an ocean of water, but they seem to be on an ocean of turbulent air. When they move, they go up and down like this, almost like a boat would in the water. So whatever they are, they seem to be able to almost become lighter than air
  text: |-
    When hovering, UFOs waft and wobble like a boat on turbulent air; when moving, they move up and down like a boat in water, seeming to become lighter than air.
- id: e6fa7fc9-98b3-4747-baf0-bf246aa09aaa
  type: observation
  attestation: first_hand
  speaker:
