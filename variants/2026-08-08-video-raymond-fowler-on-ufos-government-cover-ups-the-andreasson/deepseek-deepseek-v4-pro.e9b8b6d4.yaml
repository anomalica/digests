  - id: a005ea0a-dabd-416e-9c6c-8fe382fc36c3
    name: 1946 ghost rocket wave
  - id: 1a0f7ef1-373d-4b43-bba0-a03691edbe3b
    name: Ghost rockets (phenomenon)
  quote: |-
    And then the next World Wide Wave took place in 1946, especially in Europe and specifically in Scandinavian countries. Britain, The United States and France were so sure that what the people were calling ghost rockets were Russian missiles overflying European territory
  text: |-
    A worldwide wave of sightings in 1946, especially in Scandinavia, involved objects called ghost rockets, which the US, Britain, and France suspected were Russian missiles.
- id: 8a1368e5-e06e-4bbe-8d5a-7b983bf4aac7
