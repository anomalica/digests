  - id: a0419cde-8bf3-4e6a-b366-948163914639
    name: Unidentified Flying Objects (UFO)
  quote: |-
    That's orbital speed, and that's within the near envelope of the Earth without burning up, without a sonic boom, and able to take right-angle turns at this speed.
  text: |-
    A UFO tracked at approximately 29,000 kilometres per hour was moving at orbital speed within the near envelope of the Earth without burning up, creating a sonic boom, and was able to make right-angle turns.
