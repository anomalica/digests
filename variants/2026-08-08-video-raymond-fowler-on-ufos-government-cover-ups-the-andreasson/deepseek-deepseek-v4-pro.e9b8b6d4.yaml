  - id: a20af9f5-611f-4b0e-95df-53fbbda47b88
    name: JANAP 146
  quote: |-
    Once they make an official report, they're subjected to $10,000 fine and or 10 years in jail if they reveal the contents of this report.
  text: |-
    Under JANAP 146, a pilot making an official UFO report is subject to a $10,000 fine and/or 10 years in jail for revealing the contents of the report.
