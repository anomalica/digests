  refs:
  - id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  quote: |-
    Trouble with a circular-type aircraft that's very unstable in an atmosphere, it hasn't got long wings to store fuel in, and they found that as far as a circular aircraft operating within the confines of the Earth's atmosphere. It was a very unstable vehicle.
  text: |-
    Raymond Fowler asserts that circular-type aircraft are very unstable in the atmosphere, lack long wings for fuel storage, and are very unstable vehicles for operating within the Earth's atmosphere.
- id: e047bd0e-5d87-4557-bb87-04e6dc298113
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
    name: Raymond Fowler
  provenance_chain:
