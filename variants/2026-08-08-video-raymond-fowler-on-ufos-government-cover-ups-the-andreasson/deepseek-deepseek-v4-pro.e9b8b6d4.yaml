    name: World War II Foo fighter sightings
  - id: 61e1c89f-0fa3-41a4-86ee-78319a4b8c48
    name: Foo fighter (phenomenon)
  quote: |-
    The next wave of strange objects took place in 1944-1945 period during World War II, and both the Allied and Axis services spotted what they dubbed Foo Fighters. And these were disc-shaped objects and globe-shaped objects which paced both Allied and Axis aircraft over bombing missions in Europe and in the Far East.
  text: |-
    During the 1944–1945 World War II period, both Allied and Axis services spotted disc-shaped and globe-shaped objects that they dubbed Foo Fighters, which paced their aircraft over bombing missions in Europe and the Far East.
- id: 847beb77-5610-4f59-85ee-26a1bbb6a6ed
  type: observation
