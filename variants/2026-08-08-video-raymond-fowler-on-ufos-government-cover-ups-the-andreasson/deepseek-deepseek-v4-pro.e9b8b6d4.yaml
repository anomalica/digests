    name: JANAP 146
  quote: |-
    a Joint Army Air Force Navy order, which outlines what military civilian pilots are supposed to do when they see a UFO sighting. They submit what they call a surveys report, which contains information vital to the security of the United States.
  text: |-
    JANAP 146 is a Joint Army Navy Air Force publication that outlines the procedure for military and civilian pilots reporting UFO sightings, involving the submission of a report with information vital to the security of the United States.
- id: c6b4c1e0-eae7-464f-85a7-fd8b4c728112
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
