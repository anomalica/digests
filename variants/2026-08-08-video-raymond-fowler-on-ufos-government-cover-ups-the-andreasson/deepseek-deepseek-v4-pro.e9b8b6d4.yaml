    that they persuaded Russia to allow an on-site inspection. And we sent General Doolittle over there with other members of the armed forces along with Britain and France to actually go into Russia and examine their missile sites. And they came back empty-handed and realized whatever they were, they weren't Russian.
  text: |-
    The US, Britain, and France persuaded the Soviet Union to allow an on-site inspection of their missile sites, led by General Doolittle, to investigate if the ghost rockets were Russian; the team returned empty-handed.
