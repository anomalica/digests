  refs:
  - id: c662ff47-c6ce-4163-9ed0-0b329fa71e98
    name: Robert B. McLaughlin
  - id: 1252b1cd-2ef1-4c59-a915-01dffa95473d
    name: USA, New Mexico, White Sands
  - id: 4e6f59e5-ec02-4467-802e-032ebe608433
    name: V-2 rocket
  - id: e4f6259e-f7ab-4c11-85a1-dfe1acc773f3
    name: WAC Corporal
  - id: 3680afe1-6b8d-42bd-a69c-3b3e5f8e10f7
    name: White Sands V-2 UFO observation
  quote: |-
    In the 1950s, a Commander McLaughlin, a Navy commander who was in charge of V-2 experiments down in White Sands, New Mexico, they were using a theodolite, which essentially is a telescope that also gives you readings of altitude and azimuth. And they were tracking a V-2 and a WAC corporal, I think, attached to it when they saw something else.
  text: |-
    In the 1950s, Commander Robert B. McLaughlin was in charge of V-2 experiments at White Sands, New Mexico; using a theodolite to track a V-2 rocket and a WAC Corporal, the team sighted an additional object.
- id: 491257c1-ce47-4d5c-86da-b90708b8f784
