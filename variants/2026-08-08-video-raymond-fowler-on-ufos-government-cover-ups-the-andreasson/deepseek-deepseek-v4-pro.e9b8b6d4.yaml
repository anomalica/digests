    name: 1973 UFO wave
  quote: |-
    Also, in 1973, after the last huge UFO wave, worldwide UFO wave, UFOs mysteriously disappeared from the national newspapers. The only way usually you're going to find out about UFO sightings, other than belonging to an organization who's investigating UFOs, would be to subscribe to a local news clip service. And you would see that UFO sightings are still happening in this country and abroad all over the place, but they aren't getting reported in the national press, which is very unusual.
  text: |-
    After the worldwide 1973 UFO wave, UFO sightings mysteriously disappeared from national newspapers, though local news clip services show they are still occurring worldwide.
