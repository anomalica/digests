  refs:
  - id: b0f93a2d-9aab-45a0-bc61-d8622b00b4e9
    name: Hoyt Vandenberg
  - id: 0848be85-fdef-4e13-8eaf-99bb4ef1f32a
    name: Project Sign
  - id: f49b625b-18c6-4c26-9e45-da16d1a1b8e9
    name: Project Grudge
  quote: |-
    and brought in new people and told them, as far as UFOs in the public went, that they were to provide explanations. The public was told that the project was closed, in fact. And meanwhile, Project Grudge continued covertly.
  text: |-
    General Vandenberg replaced the Project Sign staff and ordered the new team to provide explanations for UFOs to the public, while Project Grudge continued covertly.
- id: f6eec947-c93e-4bab-bf6d-d5b6016168df
  type: observation
  attestation: first_hand
  speaker:
