  text: |-
    After the public termination of Project Blue Book, the United States Air Force continued to covertly investigate better civilian sightings and concentrated on government source control cases and airline pilot cases under JANAP 146.
- id: 499d35c6-4c20-4645-a7b3-2c6bb18bd728
  type: observation
  attestation: first_hand
  speaker:
    id: a3947df4-0582-47ce-9502-1c687f81e8a9
