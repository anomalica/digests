  quote: |-
    These small luminescent particles drift away from you. Small in forward. In this light they appear brilliant white without seeing it all in them. They appear to move on out. Turn around back towards the flight path.
  text: |-
    During the Mercury Atlas 9 Mission, L. Gordon Cooper Jr. observed small luminescent particles drifting away from the spacecraft, appearing as brilliant white in the light and appearing to move away before turning back towards the flight path.
