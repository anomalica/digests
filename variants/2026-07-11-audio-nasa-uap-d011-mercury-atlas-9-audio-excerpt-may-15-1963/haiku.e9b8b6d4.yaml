  refs:
  - id: ae747b16-bf09-456c-8990-8095a9f625e3
    name: L. Gordon Cooper Jr.
  - id: 7dab6396-3a29-43b9-92e8-c51fe342f217
    name: Mercury Atlas 9 Mission
  quote: |-
    There's been a beautiful view coming over Florida. Now on 180 yaw. I got here on manual proportional control. I'm at last daylight going in the dark. I've been looking for the flashing beacons.
  text: |-
    During the Mercury Atlas 9 Mission, L. Gordon Cooper Jr. was searching for flashing beacons whilst transitioning from daylight into darkness at a 180-degree yaw orientation using manual proportional control.
