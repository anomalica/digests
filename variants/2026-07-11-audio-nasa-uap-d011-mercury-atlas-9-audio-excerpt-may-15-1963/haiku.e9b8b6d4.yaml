    name: L. Gordon Cooper Jr.
  - id: 7dab6396-3a29-43b9-92e8-c51fe342f217
    name: Mercury Atlas 9 Mission
  quote: |-
    It's light in sight. It is below me. It's quite a brownish, reddish-brown. and considerable altitude above the ground. On my fiery pitch-down thruster, I get a shower of these little fireflies. It is flashing now. It is the light. It's quite bright, quite discernible. Must be about 10 to 12 miles away.
  text: |-
    During the Mercury Atlas 9 Mission, L. Gordon Cooper Jr. observed a bright, brownish-red light at considerable altitude above the ground that flashed and was approximately 16 to 19 kilometres away.
