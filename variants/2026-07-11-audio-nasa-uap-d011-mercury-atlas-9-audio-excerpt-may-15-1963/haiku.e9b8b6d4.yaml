    name: Mercury Atlas 9 Mission
  quote: |-
    And I'm beginning to get the brilliant blue of sun rising in the east. Bright blue band underneath all this haze layer. I can see the haze layer. And the right band of light demarcation coming underneath it. Quite distinctive.
  text: |-
    During the Mercury Atlas 9 Mission, L. Gordon Cooper Jr. observed the brilliant blue of the sun rising in the east, with a bright blue band underneath a haze layer and a distinct right band of light demarcation beneath it.
