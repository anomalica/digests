  text: |-
    During the Mercury Atlas 9 Mission, fuel computations performed at USA, Hawaii indicated approximately 88 to 98 units (automatic to manual readings), which Ground Control reported as somewhat better than L. Gordon Cooper Jr. was indicating with on-board readings of 96 to 102 units.
