  - id: d07bb862-9164-4d98-8206-231e17692d5c
    name: USA, Florida
  quote: |-
    Ah, boy, what a beautiful shot of Florida. Roger. The whole state is clear. I can see I'm just about off. There's been a beautiful view coming over Florida.
  text: |-
    During the Mercury Atlas 9 Mission, L. Gordon Cooper Jr. observed a clear view of the entire state of USA, Florida while approaching over the state.
