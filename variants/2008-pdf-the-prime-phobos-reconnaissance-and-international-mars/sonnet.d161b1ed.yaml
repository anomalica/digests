  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    The PRIME Lander Mars mission concept was developed with the central scientific goal of determining the nature and origin of Phobos.
  text: |-
    The PRIME Lander Mars mission concept was developed with the central scientific goal of determining the nature and origin of Phobos.
- id: 47cfabd8-8795-4cea-a434-3d10bd3a2682
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
