    name: Circum-Mars formation hypothesis (Phobos origin)
  - id: 39ebdb63-96d4-425f-bc15-e3241e1032d5
    name: Capture hypothesis (Phobos origin)
  quote: In each of these cases, Deimos might be genetically related to Phobos, or not.
  text: |-
    Under either the circum-Mars formation or capture hypothesis of Phobos's origin, Deimos might be genetically related to Phobos, or might not be.
