  - id: 81b11c77-4cd5-4312-8db8-750c477ebc3c
    name: Mars
  - id: 557c2990-aaf5-42ae-ba40-a8e03f221ed1
    name: Mars Sample Return (MSR)
  quote: |-
    Resolving this issue will not only address the nature of Mars's inner satellite, but also answer fundamental questions about planet and satellite formation, small body evolution, impact cratering frequency and dynamics, Mars surface evolution, and the role Phobos might play in future Mars exploration, from Mars Sample Return to human missions
  text: |-
    Resolving the question of Phobos's origin will address the nature of Mars's inner satellite and answer fundamental questions about planet and satellite formation, small body evolution, impact cratering frequency and dynamics, Mars surface evolution, and the role Phobos might play in future Mars exploration.
