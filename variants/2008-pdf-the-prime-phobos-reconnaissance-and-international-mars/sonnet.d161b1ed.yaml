  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:4252-4293
  refs:
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: A lander capable of precision landing is required.
  text: |-
    A lander capable of precision landing is required to access a representative sample of Phobos's bulk.
