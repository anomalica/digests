  refs:
  - id: 59a12e6f-06bb-4122-a3aa-1f6dc945ea33
    name: PRIME Lander
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    Important but secondary scientific goals are to understand better Phobos's evolution through time and to assess the object's current state, including the processes that affect it.
  text: |-
    Secondary scientific goals of the PRIME Lander mission are to better understand Phobos's evolution through time and to assess the object's current state, including the processes that affect it.
- id: f354f51b-f95e-44ea-8bee-910778d7fe4b
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3328-3464
  refs:
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    The single most reliable measurement that can be made to answer the question of Phobos's origin is to determine the martian moon's bulk composition.
  text: |-
    The single most reliable measurement to answer the question of Phobos's origin is to determine the martian moon's bulk composition.
- id: b2633c9b-4d65-4476-859e-20c5d2da4e69
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3477-3681
  refs:
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    While remote sensing studies may help constrain the bulk composition of Phobos, they characterize strictly only the composition of Phobos's surface regolith, which might not be representative of Phobos's bulk.
  text: |-
    Remote sensing studies characterise only the composition of Phobos's surface regolith, which might not be representative of Phobos's bulk composition.
- id: 18ba272c-479d-423f-9e76-5e5d948e4e7d
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3687-3832
  refs:
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    Determining the bulk composition of Phobos can be done unambiguously only by determining the composition of a representative sample of Phobos's bulk.
  text: |-
    Determining the bulk composition of Phobos can be done unambiguously only by determining the composition of a representative sample of Phobos's bulk.
- id: 33ac8bd9-b147-4802-b735-4a04412e4c93
