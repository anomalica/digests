    name: CAMELOT-2 lidar
  quote: |-
    The PRIME Lander is a fixed lander that will first characterize potential landing sites from orbit - actually pseudo-orbits about Phobos -, then soft land on Phobos using a short-range lidar (CAMELOT-2), then conduct in situ measurements.
  text: |-
    The PRIME Lander is a fixed lander that will first characterise potential landing sites from pseudo-orbits about Phobos, then soft land on Phobos using a short-range lidar, the CAMELOT-2, then conduct in situ measurements.
