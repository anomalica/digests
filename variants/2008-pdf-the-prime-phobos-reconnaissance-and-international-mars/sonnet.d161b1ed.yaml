  quote: |-
    As reiterated during the First International Conference on the Exploration of Phobos and Deimos held at NASA Ames on Nov 5-7, 2007, the single most important science objective in the exploration of Phobos is to determine its origin.
  text: |-
    During the First International Conference on the Exploration of Phobos and Deimos held at NASA Ames Research Center on 2007-11-05 to 2007-11-07, it was reiterated that the single most important science objective in the exploration of Phobos is to determine its origin.
- id: e9be23c8-4cf9-4884-9623-05ae97c2bee3
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
