  refs:
  - id: 50eff9cd-0bfb-46f0-b460-dda7c8976989
    name: Phobos
  quote: |-
    Access to a representative sample of Phobos's bulk for the proposed investigation can only be done reliably by contacting Phobos's surface and by examining within an arm's length fresh, dust-free lithic material, an outcrop or boulder.
  text: |-
    Access to a representative sample of Phobos's bulk can only be done reliably by contacting Phobos's surface and examining within an arm's length fresh, dust-free lithic material, an outcrop or boulder.
- id: 6b4bdd03-2975-457b-956d-a86c10137c65
