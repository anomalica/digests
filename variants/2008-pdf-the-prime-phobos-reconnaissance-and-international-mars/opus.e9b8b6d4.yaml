  - id: 1e618d9d-148a-4177-a842-721f12b1f4a9
    name: Mars Sample Return (MSR)
  quote: |-
    Resolving this issue will not only address the nature of Mars's inner satellite, but also answer fundamental questions about planet and satellite formation, small body evolution, impact cratering frequency and dynamics, Mars surface evolution, and the role Phobos might play in future Mars exploration, from Mars Sample Return to human missions
  text: |-
    Resolving the origin of Phobos would address the nature of Mars's inner satellite and answer fundamental questions about planet and satellite formation, small body evolution, impact cratering frequency and dynamics, Mars surface evolution, and the role Phobos might play in future Mars exploration from Mars Sample Return (MSR) to human missions.
