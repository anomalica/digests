  quote: |-
    living conditions on these bodies lets say the moon, or the planet Mars, would have to be such as to permit a stable, and to a certain extent, independent life, from an economic standpoint
  text: |-
    J. Robert Oppenheimer and Albert Einstein hold that living conditions on celestial bodies such as the moon or Mars would need to permit a stable and, to a certain extent economically independent, life for independent settlement to be possible.
