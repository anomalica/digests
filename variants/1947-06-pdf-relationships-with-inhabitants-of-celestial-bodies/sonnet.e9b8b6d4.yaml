  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Relationships with extraterrestrial men presents no bascially new problem from the standpoint of international law
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that relationships with extraterrestrial men present no basically new problem from the standpoint of international law.
- id: b10c9097-43c5-4304-b44c-38198a612b8b
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:364-509
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    the possibility of confronting intelligent beings that do not belong to the human race would bring up problems whose solution it is difficult to conceive
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that confronting intelligent beings that do not belong to the human race would bring up problems whose solution is difficult to conceive.
- id: 46baedc3-4a0c-42ba-8bd6-151f29d3583d
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:520-772
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    In principle, there is no difficulty in accepting the possibility of coming to an understanding with them, and of establishing all kinds of relationships. The difficulty lies in trying to establish the principles on which these relationships should be based.
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that there is no principled difficulty in accepting the possibility of coming to an understanding with extraterrestrial beings and establishing relationships with them, but that the difficulty lies in establishing the principles on which those relationships should be based.
- id: ed180747-a595-48d1-a0f2-df0827623087
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:800-1004
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    it would be necessary to establish communication with them through some language or other, and afterwards, as a first condition for all intelligence, that they should have a psychology similar to that of men
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that establishing communication with extraterrestrial beings through some language would be necessary as a first condition, along with the beings having a psychology similar to that of humans.
- id: 951e710f-c7b0-43c8-aa0c-e927bbbed518
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:1023-1187
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  - id: 204c1263-8b3f-43f8-bf9b-7e8eea8588a6
    name: Law Among Planetary Peoples
  quote: |-
    international law should make place for a new law on a different basis, and it might be called "Law Among Planetary Peoples," following the guidelines found in the Pentateuch
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that international law should make place for a new law on a different basis, which might be called "Law Among Planetary Peoples," following guidelines found in the Pentateuch.
- id: 9127b111-c64a-4424-9caa-347a3d5d8940
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:1210-1435
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    the idea of revolutionizing international law to the point where it would be capable of coping with new situations would compel us to make a change in its structure, a change so basic that it would no longer be international law
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that revolutionising international law to cope with extraterrestrial relations would require a change so basic that the result could no longer be called international law.
- id: 4a5267fb-03e2-437a-9e53-8feb20d1b885
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:1566-1771
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    If these intelligent beings were in possession of a more or less culture, and a more or less perfect political organization, they would have an absolute right to be recognized as independent and sovereign peoples
  text: |-
    J. Robert Oppenheimer and Albert Einstein hold that if intelligent extraterrestrial beings possessed a culture and a political organisation, they would have an absolute right to be recognized as independent and sovereign peoples, requiring an agreement establishing legal regulations for future relationships.
- id: 993b84eb-eb81-4920-95ad-eaa489f26c9e
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:1984-2175
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    if they should reject all peaceful cooperation and become an imminent threat to the earth, we would have the right to legitimate defense, but only insofar as would be necessary to annul this danger
  text: |-
    J. Robert Oppenheimer and Albert Einstein hold that if extraterrestrial beings rejected peaceful cooperation and became an imminent threat to Earth, humanity would have the right to legitimate defence, but only insofar as necessary to annul the danger.
- id: 3af1b271-9363-4380-a9e8-844468468f3b
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:2189-2422
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Another possibility may exist, that a species of homo sapiens might have established themselves as an independent nation on another celestial body in our solar system and evolved culturely indenpendently from ours
  text: |-
    J. Robert Oppenheimer and Albert Einstein raise the possibility that a species of homo sapiens might have established itself as an independent nation on another celestial body in the solar system and evolved culturally independently from humanity on Earth.
- id: af83eb16-1d91-42c0-bd7c-4a6e7d5e1f13
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:2634-2812
  refs:
