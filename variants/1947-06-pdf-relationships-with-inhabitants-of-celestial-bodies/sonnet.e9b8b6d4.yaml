  quote: |-
    there are those who go so far as to give formulas for the creation of an artificial atmosphere on the moon, which undoubtedly have a certain scientific foundation
  text: |-
    J. Robert Oppenheimer and Albert Einstein note that some have proposed formulas for creating an artificial atmosphere on the moon.
- id: 4f6c46cd-0f9b-41ba-a954-b544592e14b1
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3157-3246
  refs:
  - id: ccb079ba-f68e-48e1-892b-b0fa49539852
    name: the moon
  quote: |-
    Lets assume that magnesium silicates on the moon may exist and contain up to 13 per cent water.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that magnesium silicates on the moon may exist and contain up to 13 per cent water.
- id: 4dc4334d-9fb1-4fc4-86f9-686f055b486b
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3253-3414
  refs:
  - id: ccb079ba-f68e-48e1-892b-b0fa49539852
    name: the moon
  quote: |-
    Using energy and machines brought to the moon, perhaps from a space station, the rooks could be broken up, pulverized, and then backed to drive off the water of crystallization.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that, using energy and machines brought to the moon, perhaps from a space station, lunar rock could be broken up, pulverised, and heated to drive off the water of crystallisation.
- id: 36bf54f0-bf89-4319-922a-e8031b92ee96
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3431-3648
  refs:
  - id: ccb079ba-f68e-48e1-892b-b0fa49539852
    name: the moon
  quote: |-
    This could be collected and then decomposed into hydrogen and oxygen, using an electric current or the short wave radiation of the sun. The oxygen could be used for breathing purposes; the hydrogen might be used as a fuel.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that water collected from lunar rock could be decomposed into hydrogen and oxygen using an electric current or the short-wave radiation of the sun, with the oxygen used for breathing and the hydrogen possibly used as fuel.
- id: 121c3d70-f25e-4901-b405-07c0b9475db5
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:3668-3957
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    if no existence is possible on celestial bodies except for enterprises for the exploration of their natural riches, with a continuous interchange of the men who work on them, unable to establish themselves there indefinitely and be able to live isolated life, independence will never take place
  text: |-
    J. Robert Oppenheimer and Albert Einstein hold that if no existence is possible on celestial bodies except for extraction enterprises requiring continuous interchange of workers unable to live there indefinitely, independence of a settlement on such a body will never take place.
- id: 90d7a6ae-6d0a-4d8c-bf2a-c2d13a3f1370
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:3970-4126
  refs:
  - id: b212fc3d-6612-4e27-80d3-63f87ce1ffad
    name: extraterrestrial biological entity (EBE)
  quote: |-
    Now we come to the problem of determining what to do if the inhabitants of celestial bodies, or extraterrestrial biological entitles (EBE) desire to settle here.
  text: |-
    J. Robert Oppenheimer and Albert Einstein term the inhabitants of celestial bodies "extraterrestrial biological entities (EBE)" when considering what to do if such beings desire to settle on Earth.
- id: f9788bdf-c056-4d45-88fa-5fc389a2cb74
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:4136-4346
  refs:
  - id: b212fc3d-6612-4e27-80d3-63f87ce1ffad
    name: extraterrestrial biological entity (EBE)
  quote: |-
    If they are politically organised and possess a certain culture similar to our own, they may be recognized as a independent people. They could consider what degree of development would be required on earth for colonizing.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that if extraterrestrial biological entities are politically organised and possess a culture similar to humanity's, they may be recognised as an independent people who could determine what degree of development would be required on Earth for colonising.
- id: e7b17fdc-40c6-4c53-9644-9b3eae789255
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:4362-4523
  refs:
  - id: b212fc3d-6612-4e27-80d3-63f87ce1ffad
    name: extraterrestrial biological entity (EBE)
  quote: |-
    If they consider our culture to be devoid of political unity, they would have the right to colonize. Of course, this colonization cannot be conducted on classic lines.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that if extraterrestrial biological entities consider human culture to lack political unity, they would have the right to colonise Earth, though not on classic colonial lines.
- id: 8fb1b337-1197-473a-b3d5-9a1f0e16daac
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:4531-4672
  refs:
  - id: c50ff26d-e44d-48cc-a7ec-e650e38fb650
    name: United Nations (UN)
  - id: b212fc3d-6612-4e27-80d3-63f87ce1ffad
    name: extraterrestrial biological entity (EBE)
  quote: |-
    A superior form of colonizing will have to be conceived, that could be a kind of tutelage, possibly through the tacit approval of the United Nations.
  text: |-
    J. Robert Oppenheimer and Albert Einstein propose that a superior form of colonisation, possibly a kind of tutelage, could be conceived through the tacit approval of the United Nations (UN).
- id: 69fd61f5-cd54-41b1-8ae4-cd91137a3857
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:4814-5001
  refs:
  - id: c50ff26d-e44d-48cc-a7ec-e650e38fb650
    name: United Nations (UN)
  quote: |-
    Although the United Nations is an international organization, there is no doubt that it would have no right of tutelage, since its domain does not extend beyond relationships between its members.
  text: |-
    J. Robert Oppenheimer and Albert Einstein argue that although the United Nations (UN) is an international organisation, it would have no right of tutelage over humanity because its domain does not extend beyond relationships between its member states.
- id: 0a3c61d3-ce44-4749-8c1f-0c4b68a9842e
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:5221-5339
  refs:
  - id: c50ff26d-e44d-48cc-a7ec-e650e38fb650
    name: United Nations (UN)
  quote: |-
    But if those relationships entailed a conflict with another member nation, the United Nations would have the right to intervene.
  text: |-
    J. Robert Oppenheimer and Albert Einstein argue that the United Nations (UN) would have the right to intervene if relationships between a member nation and an extraterrestrial people entailed a conflict with another member nation.
- id: ec9befbd-9933-4f3b-9fb4-3abcf7e9c8ba
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:5355-5649
  refs:
  - id: c50ff26d-e44d-48cc-a7ec-e650e38fb650
    name: United Nations (UN)
  quote: |-
    If the United Nations were a supra-national organisation, it would have competency to deal with all problems related to extraterrestrial peoples. Of course, even though it is merely an international organisation, it could have this competence if its member states would be willing to recognize it.
  text: |-
    J. Robert Oppenheimer and Albert Einstein argue that if the United Nations (UN) were a supra-national organisation, it would have competency to deal with all problems related to extraterrestrial peoples, and even as a merely international organisation it could gain this competence if member states recognised it.
- id: 3b339865-7c66-483b-8de4-5209af0f7640
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:5659-5915
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    It is difficult to predict what the attitude of international law will be with regard to the occupation by celestial peoples of certain locations on our planet, but the only thing that can be foreseen is that there will be a profound change in traditional concepts.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that it is difficult to predict the attitude of international law toward occupation by celestial peoples of locations on Earth, but foresee a profound change in traditional legal concepts.
- id: 38f52854-fe58-4653-8576-d64a9966dc94
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:5926-6104
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    We cannot exclude the possibility that a race of extraterrstrial people more advanced technologically and economically may take upon itself the right to occupy another celestial body.
  text: |-
    J. Robert Oppenheimer and Albert Einstein raise the possibility that a technologically and economically more advanced extraterrestrial race may take upon itself the right to occupy another celestial body.
- id: ffefe886-68d2-4e6f-8094-5118ce1903bd
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:6410-6707
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    The division of a celestial body into zones and the distribution of them among other celestial states. This would present the problem of distribution. Moreover, other celestial states would be deprived of the possibility of owning an area, or if they were granted one it would involve complicated operations.
  text: |-
    J. Robert Oppenheimer and Albert Einstein describe division of a celestial body into zones distributed among celestial states as one possible model of occupation, noting it would raise problems of distribution and could deprive some states of the possibility of owning an area.
- id: 3539a848-70ef-46be-8a6e-2b72b11da85f
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:6723-6960
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Indivisible co-sovereignty, giving each celestial state the right to make whatever use is most convenient to its interests, independently of the others. This would create a situation of anarchy, as the strongest one would win out in the end.
  text: |-
    J. Robert Oppenheimer and Albert Einstein describe indivisible co-sovereignty, giving each celestial state the right to use a celestial body as convenient to its own interests, as a model that would create a situation of anarchy in which the strongest state would win out.
- id: 8e7ad175-7b41-47b0-a373-98c20051c88f
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:7063-7242
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    submitt an agreement providing far the peaceful absorbtion of a celestial race(s) in such a manner that our culture would remain intact with guarantees that their presence not be revealed
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider that the most feasible solution would be an agreement providing for the peaceful absorption of a celestial race in a manner that keeps human culture intact and guarantees that the presence of the celestial race is not revealed.
- id: 2f5bbd4d-5db8-41a2-8010-0cbcd92e6e97
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:7253-7490
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  - id: c50ff26d-e44d-48cc-a7ec-e650e38fb650
    name: United Nations (UN)
  quote: |-
    Actually, we do not believe it necessary to go that far. It would merely be a matter of internationalizing celestial peoples, and creating an international treaty intsrument preventing exploitation of all nations belonging to the United Nations.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that they do not believe it necessary to go as far as concealment, proposing instead an international treaty instrument internationalising celestial peoples and preventing their exploitation by United Nations (UN) member states.
- id: e5f08821-b293-44dd-baa6-0103b3359bb1
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:7505-7708
  refs:
  - id: 4fd10fd0-08ee-4f4f-897e-93164a94366f
    name: res nullius
  quote: |-
    Occupation by states here on earth, which has lost all interest for international law, since there were no more res nullius territories, is beginning to regain all its importance in cosmic international law.
  text: |-
    J. Robert Oppenheimer and Albert Einstein observe that occupation of territory on Earth had lost all interest for international law once no more res nullius territories remained, but that this concept is regaining importance in cosmic international law.
- id: 2abf98a6-2e74-4566-979a-f901817aa37a
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:7714-7773
  refs:
  - id: 4fd10fd0-08ee-4f4f-897e-93164a94366f
    name: res nullius
  quote: Occupation consists in the appropriation by a state of res nullius.
  text: |-
    J. Robert Oppenheimer and Albert Einstein define occupation as the appropriation by a state of res nullius.
- id: b62fdc47-3b9c-45d1-a196-0cb85140482a
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:7783-7991
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Until the last century, occupation was the normal means of acquiring sovereignty over territories, when explorations made possible the discovery of new regions, either unihabited or in an elementary state of civilization.
  text: |-
    J. Robert Oppenheimer and Albert Einstein note that until the last century occupation was the normal means of acquiring sovereignty over territories when exploration made possible the discovery of new, uninhabited, or elementary-state regions.
- id: 67a6cfaf-8eee-40be-985d-41bf9e6411ad
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:8006-8234
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    The imperialist expansion of the states came to an end with the end of regions capable of being occupied, which have now been drained from the earth and exist only in interplanetary space, where the celestial states present new problems.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that the imperialist expansion of states on Earth came to an end with the exhaustion of occupiable regions, which now exist only in interplanetary space, where celestial states present new problems.
- id: e73db489-e856-4738-81ff-b049ca277be2
  type: administrative
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: false
  location: char:8250-8419
  refs:
  - id: 4fd10fd0-08ee-4f4f-897e-93164a94366f
    name: res nullius
  - id: ccb079ba-f68e-48e1-892b-b0fa49539852
    name: the moon
  quote: |-
    Res nullius is something that belongs to nobody such as the moon. In international law a celestial body is not subject to the sovereignty of any state is considered res nullius.
  text: |-
    J. Robert Oppenheimer and Albert Einstein define res nullius as something that belongs to nobody, such as the moon, and state that under international law a celestial body not subject to any state's sovereignty is considered res nullius.
- id: ed6a3eb3-6e4e-4949-b628-74f924c5a906
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:8428-8800
  refs:
  - id: 4fd10fd0-08ee-4f4f-897e-93164a94366f
    name: res nullius
  - id: bb8fad29-0c19-4642-b835-a8f6d3d11c9e
    name: res communis
  - id: ccb079ba-f68e-48e1-892b-b0fa49539852
    name: the moon
  quote: |-
    If it could be established that a celestial body within our solar system such as our moon was, or is occupied by another celestial race, there could be no claim of res nullius by any state on earth (if that state should decide in the future to send explorers to lay claim to it). It would exist as res communis, that is that all celestial states have the same rights over it.
  text: |-
    J. Robert Oppenheimer and Albert Einstein argue that if it could be established that a celestial body within the solar system, such as the moon, was or is occupied by another celestial race, no state on Earth could claim it as res nullius, and it would instead exist as res communis, meaning all celestial states would have equal rights over it.
- id: 33785340-4e56-4003-820d-dc1d06a28f0c
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:8810-8948
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    And now to the final question of whether the presence of celestial astroplanes in our atmosphere is a direct result of our testing atomic weapons?
  text: |-
    J. Robert Oppenheimer and Albert Einstein raise the question of whether the presence of celestial astroplanes in Earth's atmosphere is a direct result of atomic weapons testing.
- id: 88c8fa8f-54da-42ec-ae38-030de8a4d4f3
  type: observation
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:8958-9120
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    The presence of unidentified space craft flying in our atmosphere (and possibly maintaining orbits about our planet) is now, however, accepted as de facto by our military.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that the presence of unidentified spacecraft flying in Earth's atmosphere, and possibly maintaining orbits about the planet, is accepted as de facto by the US military.
- id: 3d2cd4c7-9cc5-47b7-8650-82bbb2cc9469
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:9154-9633
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    On every question of whether the United States will continue testing of fission bombs and develop fusion devices (hydrogen bombs), or reach an agreement to disarm and the exclusion of weapons that are too destructive, with the exception of chemical warfare, on which, by some miracle we cannot explain, an agreement has been reached, the lamentations of philosophers, the efforts of politicians, and the conferences of diplomats have been doomed to failure and have accomplished nothing.
  text: |-
    J. Robert Oppenheimer and Albert Einstein observe that attempts to reach an agreement on continued testing of fission bombs, development of fusion (hydrogen) bombs, and disarmament have been doomed to failure, with the exception of an agreement reached on chemical warfare.
- id: 852024f3-eed3-477d-afde-6a89b002c11f
  type: observation
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:9643-10085
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    The use of the atomic bomb combined with space vehicles poses a threat on a scale which makes it absolutely necessary to come to an agreement in this area. With the appearance of unidentified space vehicles (opinions are sharply divided as to their origin) over the skies of Europe and the United States has sustained an ineradical fear, an anxiety about security, that is driving the great powers to make an effort to find a solution to the threat.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that the combination of atomic bombs and space vehicles poses a threat requiring an agreement, and that the appearance of unidentified space vehicles over the skies of Europe and the United States has sustained an ineradicable fear and anxiety about security among the great powers.
- id: 5574afe5-bc90-4ab0-bd16-aba6479dc1fd
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:10094-10194
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Military strategists foresee the use of space craft with nuclear warheads as the ultimate weapon of war.
  text: |-
    J. Robert Oppenheimer and Albert Einstein foresee military strategists anticipating the use of spacecraft with nuclear warheads as the ultimate weapon of war.
- id: bb894a56-71e8-40ae-b319-b3cef368bba8
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:10199-10303
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    Even the deployment of artificial satellites for intelligence gathering and target selection is not far off.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that deployment of artificial satellites for intelligence gathering and target selection is not far off.
- id: 8140cd1a-65bf-4006-b2ee-ef8726448948
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:10398-10718
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    since they project war from the horizontal plane to the vertical plane in its fullest sense. Attack no longer comes from an exclusive direction, nor from a determined country, but from the sky, with the practical impossibility of determining who the aggressor is, how to intercept the attack, or how to effect immediate reprisals.
  text: |-
    J. Robert Oppenheimer and Albert Einstein argue that space vehicles, satellites and rockets project warfare from the horizontal plane to the vertical plane, meaning attack no longer comes from an exclusive direction or a determined country, making it practically impossible to determine the aggressor, intercept the attack, or effect immediate reprisals.
- id: bc8a9788-bf07-4d9e-8ac0-ee42610a31ab
  type: observation
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:10877-11042
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    At present, we can breath a little easier knowing that slow moving bombers are the mode of delivery of atomic bombs that can be detected by long-range early warning radar.
  text: |-
    J. Robert Oppenheimer and Albert Einstein state that at present slow-moving bombers are the mode of delivery of atomic bombs, and can be detected by long-range early warning radar.
- id: f6b5362d-bbbb-4179-aea5-6acfdc46b011
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:11240-11424
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    One must consider the fact that mis-identification of these space craft for a intercontenental missile in a re-entry phase of flight could lead to accidental nuclear war with horrible consequences.
  text: |-
    J. Robert Oppenheimer and Albert Einstein warn that misidentification of unidentified spacecraft for an intercontinental missile in a re-entry phase of flight could lead to accidental nuclear war with horrible consequences.
- id: e6cecce9-a78d-4eca-ba3c-513db594c628
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:11447-11627
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    we should consider the possibility that our atmospheric tests of late could have influenced the arrival of celestial scrutiny. They could have been curious or even alarmed by such activity
  text: |-
    J. Robert Oppenheimer and Albert Einstein consider it possible that recent atmospheric atomic tests could have influenced the arrival of celestial scrutiny, and that observers could have been curious or alarmed by such activity.
- id: 380cc774-f3df-4ffb-8fc3-4bc2ec8371f5
  type: opinion
  provenance_chain:
    origin_kind: unattributed
  attribution_in_text: true
  location: char:11637-11721
  refs:
  - id: 74a8e911-50c9-4e3a-97ce-16718ceb5d89
    name: J. Robert Oppenheimer
  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    (and rightly so, for the Russians would make every effort to observe and record such tests)
  text: |-
    J. Robert Oppenheimer and Albert Einstein note that the Russians would make every effort to observe and record atmospheric atomic tests.
- id: a37f570d-adbc-4d7d-bb9f-2f6f206e1ade
  type: opinion
  provenance_chain:
    origin_kind: unattributed
