  - id: 21bbd50f-833a-42c8-aa95-4632f719ea45
    name: Albert Einstein
  quote: |-
    it is our professional opinion based on submitted data that this situation is extremely perilous, and measures must be taken to rectify a very serious problem are very apparent
  text: |-
    J. Robert Oppenheimer and Albert Einstein conclude, as their professional opinion based on submitted data, that the situation regarding celestial spacecraft is extremely perilous and that measures must be taken to rectify a very serious problem.
