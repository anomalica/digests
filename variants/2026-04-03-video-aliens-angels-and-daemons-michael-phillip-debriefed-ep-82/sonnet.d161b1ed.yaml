  quote: |-
    what he's saying in the divided line is there's a kind of knowing that's above all of the intellectual kinds of knowing. It's a pure experiencing sort of knowing, and this is noesis, and it's very difficult to try to encapsulate this concept of noesis, but it's knowing and being at the same time.
  text: |-
    In Plato's divided line allegory, the highest form of knowing described is noesis, a form of pure experiential knowing that is simultaneously knowing and being, difficult to fully define in concepts.
