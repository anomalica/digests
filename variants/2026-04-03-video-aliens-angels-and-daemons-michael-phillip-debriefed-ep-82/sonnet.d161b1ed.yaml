  refs:
  - id: 366c91fd-b42d-4de2-8f85-fa70f1191fbf
    name: Hoffman, Donald
  quote: |-
    it is a very poor representation of whatever the higher reality is like it's a very tiny pixel of what the truth is and we have to be in this kind of a state for uh evolutionary fitness purposes right... We need to perceive what we need to perceive to survive, to reproduce, to do the things human beings need to do.
  text: |-
    Donald Hoffman argues that humans do not need to perceive true reality, only what is needed for survival and reproduction, for evolutionary fitness purposes.
- id: 1bf90685-2c2a-4cc7-8288-2d28ccd9601a
  type: opinion
  attestation: second_hand
  speaker:
    id: 62c245fb-1bf5-40f6-843b-c5337dc27915
    name: Phillip, Michael
  provenance_chain:
