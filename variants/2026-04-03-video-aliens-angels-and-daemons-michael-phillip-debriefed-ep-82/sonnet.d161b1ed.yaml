    he talks about there's a realm that he calls Locale 2, which I think in more readily accessible speak would be like the astral realm. and what this realm is like is a realm where you have a non-physical form that is still somewhat body-like, and it has sort of like energetic sensations.
  text: |-
    In Journeys Out of the Body, Robert Monroe describes a realm he calls Locale 2, which Michael Phillip characterises as comparable to the astral realm, where one has a non-physical, body-like form with energetic sensations.
