  date: '1648'
  quote: |-
    I think about the end of the 30 year war in 1648, this was like when the Roman Catholics were at war for basically, it was the separation of church and state. It was taking religion out of politics and that created these sovereign sort of states in Europe
  text: |-
    The Thirty Years' War, involving the Roman Catholics, ended in 1648 and led to the separation of church and state, creating sovereign states in Europe.
