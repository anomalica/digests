    name: Phillip, Michael
  quote: |-
    So the vice version of Mercury would be scheming and cleverness and all of these things where you're trying to use your intellect to trick someone. And what you do is you try to remove that from yourself and then ascend beyond it. And you do that at each planetary sphere so that you can basically defrock yourself of all of these human kinds of vices, and then you actually are able to be reabsorbed back into the oneness of God or whatever.
  text: |-
    Michael Phillip describes the vice associated with Mercury in the hermetic ascent ritual as scheming and cleverness, used to intellectually trick others, which the practitioner must remove from themselves and ascend beyond at each planetary sphere before being reabsorbed into the oneness of God.
