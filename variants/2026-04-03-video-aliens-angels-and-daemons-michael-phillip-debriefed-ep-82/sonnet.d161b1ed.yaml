  text: |-
    Chris Ramsay considers that reports of an ancient Native American burial ground at Skinwalker Ranch are not evidentially meaningful, since digging deep enough almost anywhere will reveal human remains given how long people have lived on Earth.
- id: 40016782-0514-4368-8c66-170ae35b967a
  type: opinion
  attestation: first_hand
  speaker:
    id: 21bbbd82-d947-4e69-9f81-591949405288
    name: Ramsay, Chris
  provenance_chain:
    origin_kind: speaker
    origin: Chris Ramsay
  attribution_in_text: true
  location: 01:52:05.5-01:52:18.8
  quote: |-
    So like you created those spirits now because you all believe so strongly that they exist... and now you're highly suggestible and you create this, and now guess what? People are starting to see shit.
  text: |-
    Chris Ramsay considers that strong belief in the reality of spirits associated with a location, combined with high suggestibility from associated lore, leads people to begin perceiving anomalous phenomena there.
- id: 93a3163d-5a64-45da-b632-bd5f063b3cc1
  type: opinion
  attestation: first_hand
