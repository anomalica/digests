  location: 00:39:18.0-00:39:42.6
  refs:
  - id: 366c91fd-b42d-4de2-8f85-fa70f1191fbf
    name: Hoffman, Donald
  quote: |-
    He argues that based on his work that he did in cognitive science over the course of his whole career, that he actually proved through evolutionary game theory that if you create a population that perceives even 1% of the true reality, they die. They all die off. But if you tune them just for fitness pay off... they'll thrive and they'll grow
  text: |-
    Donald Hoffman used evolutionary game theory in his cognitive science career to argue that a population perceiving even 1% of true reality would die off, while a population tuned purely for fitness payoff would thrive.
- id: b07902e9-2fa2-4fba-ab68-3987be665281
