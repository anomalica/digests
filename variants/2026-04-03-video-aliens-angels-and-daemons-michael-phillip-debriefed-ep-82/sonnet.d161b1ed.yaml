  attribution_in_text: true
  location: 01:53:03.5-01:53:13.3
  quote: |-
    I don't think it has to do with the geography of the place. I don't think it has to do with the history of the place. I think it has to do completely with the energy that you're putting into the place based on the lore that was given to you.
  text: |-
    Chris Ramsay considers that the energy a person invests in a place, based on the lore attached to it, rather than the place's geography or history, determines whether anomalous phenomena manifest there.
