    origin: Chris Ramsay
  attribution_in_text: false
  location: 00:36:00.8-00:36:15.5
  quote: |-
    Without the possibility of being sort of reprimanded for thinking that way, which began sort of the invisible college and had everybody sort of, you know, uh, once we separated church and state, they started separating science and church as well.
  text: |-
    After the separation of church and state, an 'invisible college' began, where ideas could be freely exchanged without fear of reprimand, leading to a separation of science and church as well.
