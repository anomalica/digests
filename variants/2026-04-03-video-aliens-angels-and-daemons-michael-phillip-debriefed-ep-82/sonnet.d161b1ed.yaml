    Well, we know for sure suggestibility is obviously a thing. Like if you just create a psychic atmosphere where people expect something, their minds will put it there, even if it's not there, right?
  text: |-
    Michael Phillip considers that suggestibility is a real phenomenon, such that creating a psychic atmosphere of expectation can cause people's minds to perceive something even when it is not actually there.
- id: eb8b2df7-a2ce-4ea8-aecf-7339fcdd63ec
  type: opinion
  attestation: first_hand
