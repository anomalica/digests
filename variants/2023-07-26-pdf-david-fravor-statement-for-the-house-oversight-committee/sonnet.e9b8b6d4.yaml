    text: |-
      As David Fravor's flight launched from the USS Nimitz (CVN-68) and checked in with the air controller on the USS Princeton (CG-59), they were told that the training exercise was suspended for real-world tasking.
  - id: d2ae713b-068e-4ed4-9b84-8c411a318ca8
