  quote: |-
    BASED ON OUR RECORDS AND TELCON WITH 43SW, WE HAVE TOLD NIO WE KNEW OF NO B-52 OVERFLIGHTS AND NO U.S. AIRCRAFT IN PNG AIRSPACE ON JANUARY 24.
  text: |-
    Based on the Embassy's records and a telephone conversation with the 43rd Strategic Wing, the Embassy told the National Intelligence Organization it knew of no B-52 overflights and no US aircraft in Papua New Guinea airspace on 1985-01-24.
