        name: APG-73 radar
      - id: 9c966ab6-17cb-4617-a9ec-07a3782b2456
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      My crew that launched after we landed experienced significant jamming to the APG–73 radar, which was what we had on board, which is a mechanically scan very high-end system prior to the APG–79 and, yes, it did pretty much everything you could do—range, velocity, aspect—and then it split the lock, then the targeting pod is passive. That is what we were able to get the video on.
    text: |-
      During the 2004 USS Nimitz UAP encounter, the crew that launched after David Fravor's flight landed experienced significant jamming of their APG-73 radar, affecting range, velocity, and aspect data before the radar lock split and the targeting pod switched to passive mode, which is how the video was obtained.
