    text: |-
      David Grusch says that when a Special Access Program (SAP) or controlled access programme has a notification requirement to Congress, it comes through the Periodic Program Review (PPR) process, and the reports go to specific committees such as the Senate Armed Services Committee (SASC) and House Armed Services Committee (HASC).
