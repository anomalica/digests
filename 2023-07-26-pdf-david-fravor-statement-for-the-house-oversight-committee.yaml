    quote: |-
      As we launched off the USS Nimitz, we checked in with the air controller on the USS Princeton, we were told that training was going to be suspended for real world tasking. My wingman joined up and we proceeded towards a contact to the west of our CAP (Combat Air Patrol) point.
    text: |-
      As David Fravor's flight launched from the USS Nimitz (CVN-68) and checked in with the air controller on the USS Princeton (CG-59), they were told the training exercise was being suspended for real-world tasking and were directed toward a contact to the west of their Combat Air Patrol (CAP) point.
