        name: David Fravor
    quote: |-
      As we proceeded to the west and as the air controller counted down the range, we had nothing on our radars and were unaware of what we were going to see when we arrived.
    text: |-
      As David Fravor's flight proceeded west while the air controller counted down the range, they had no radar contact and did not know what they would encounter.
