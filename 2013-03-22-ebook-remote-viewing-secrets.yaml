    refs:
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      The initial targets selected and identified by coordinates were large geographic features, such as islands, rivers, mountains, waterfalls, cityscapes, and the like.
    text: |-
      The initial coordinate remote viewing targets were large geographic features such as islands, rivers, mountains, waterfalls, and cityscapes, identified by map coordinates.
  - id: e4a7a7d2-e505-40ee-b187-10c53da1a5d4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
