        name: Outbounder Remote Viewing
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      There are only two differences between the outbounder type of protocol and the coordinate protocol:
    text: |-
      The only two differences between the Outbounder Remote Viewing protocol and the Coordinate Remote Viewing protocol are the absence of an outbounder at the target site and the manner in which feedback is provided to the viewer.
  - id: 4180bfa9-4af1-466d-866e-887ac9521c68
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:13535-13943
    refs:
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      Since there is no outbounder site that the remote viewer can visit for feedback after the remote viewing has been completed and information evaluated, it becomes necessary to provide the viewer with as much information as is feasible about the original target after the remote viewing has been completed. The person who controls the targeting information or the target pool is usually the person tasked with this.
    text: |-
      In the Coordinate Remote Viewing protocol, since there is no outbounder site the viewer can visit for feedback, the person who controls the targeting information or target pool provides the viewer with as much feedback as feasible about the original target after the remote viewing has been completed.
  - id: a432e4ab-73dd-4810-8ab3-a5df15016607
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
