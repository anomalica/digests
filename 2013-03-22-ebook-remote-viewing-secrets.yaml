    quote: |-
      The first place they looked, of course, was SRI-International, where remote viewing had already been studied for nearly five years, and comments relative to training and gifted versus non-gifted subjects could be found.
    text: |-
      When organising Project STARGATE, the people involved first looked to SRI International, where remote viewing had already been studied for nearly five years.
