    quote: |-
      Examples for some of these are: ERV (Extended Remote Viewing), CRV (first known as Coordinate Remote Viewing, now known as Controlled Remote Viewing), SRV (Scientific Remote Viewing) that is scientific in name only, and TRV (Technical Remote Viewing)[4] a variation on CRV.
    text: |-
      Extended Remote Viewing, Controlled Remote Viewing, Scientific Remote Viewing, and Technical Remote Viewing are all named methods used in remote viewing, with Technical Remote Viewing being a variation on Controlled Remote Viewing.
  - id: 1a6f4d11-5927-4528-9cf6-18a4c8bf8603
