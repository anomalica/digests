        name: Remote Viewing
    quote: |-
      Unless there is a very, clear description given by the viewer of a car, bus, train, plane, boat, etc., it is nearly impossible to evaluate a target while it is moving. The solution, of course, is to stop it from doing so.
    text: |-
      Joseph McMoneagle considers it nearly impossible to evaluate a remote viewing target while it is moving, unless the viewer gives a very clear description of the moving vehicle such as a car, bus, train, plane, or boat.
  - id: ded8f908-b0a0-4ca6-a3d9-1d3d683176c0
    type: opinion
    attestation: first_hand
