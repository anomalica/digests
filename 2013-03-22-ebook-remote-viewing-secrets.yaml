        name: Joseph McMoneagle
    quote: |-
      Most scientists I know agree with this statement. The ones that don't will usually say something like, "What you see is what you get." In other words, they have no expectancy for improvement of any kind through training.
    text: |-
      Joseph McMoneagle states that most scientists he knows agree that remote viewing skill at initial testing is not fixed, unlike some who believe there is no expectation of improvement through training.
  - id: 6c160063-a025-4455-a960-c6b0e2e01655
    type: observation
    attestation: first_hand
    speaker:
