      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Many individuals are openly hostile to remote viewing because some remote viewers refuse to acknowledge God as the eminent power behind their viewing ability.
    text: |-
      Joseph McMoneagle observes that many individuals are openly hostile to remote viewing because some remote viewers refuse to acknowledge God as the power behind their viewing ability.
  - id: e611c405-e3de-4c45-88d2-8abfae72a5f4
    type: observation
    attestation: first_hand
