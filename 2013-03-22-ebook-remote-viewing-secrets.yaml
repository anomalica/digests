    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      When I keep a log, I try to use a lab notebook that has numbered pages and is permanently bound. It's pretty much impossible to mix a sequence of events that way.
    text: |-
      Joseph McMoneagle uses a lab notebook with numbered, permanently bound pages to keep his remote viewing log.
  - id: 05c4bf4d-09c9-4c78-a670-86d0021d5d7b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
