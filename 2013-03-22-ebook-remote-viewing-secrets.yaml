    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      This could be desirable for reducing remote viewing training time, but it isn't necessary. The very art of remote viewing if taught and learned properly produces this kind of a person.
    text: |-
      Joseph McMoneagle believes remote viewing training itself, if properly taught, produces imaginative problem-solving ability, so this is not a necessary prerequisite characteristic.
  - id: 672fbb8e-4de6-4763-bd3d-13cf28acec98
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:20895-21133
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Back in the bad old days, this made sense. It no longer does, in my opinion... We now know that where something takes place in the brain probably isn't as important as the modality of thinking being used by the person.
    text: |-
      Joseph McMoneagle believes the idea that remote viewers need right-brain specialisation characteristics no longer makes sense, since the modality of thinking used is probably more important than where thinking occurs in the brain.
  - id: 85f867a0-2307-4c73-9e20-8770a7a896cb
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:21389-21616
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      It means, a remote viewer is totally open to any possibility—female or male, night or day, open or closed, inside or outside, up or down, etc. If you can't presume to be on either end of a stick, then you must always be in the middle.
    text: |-
      Joseph McMoneagle believes a remote viewer should maintain balance, remaining neutral in the middle between opposing possibilities rather than favouring one end.
  - id: 4e8e58a6-2eda-40e5-9728-667757b78487
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:21843-22086
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Remote viewers have to be so "neutral" that they flow like water wherever they have to flow in order to seek ground truth. Adding a single thought or desire as to where that should be, or how it might be, will automatically put them somewhere else.
    text: |-
      Joseph McMoneagle believes a remote viewer must remain neutral and free of belief or desire about the outcome in order to seek ground truth, since a single thought or desire will bias the result.
  - id: fd636fd0-8814-4cf5-a580-871888941c61
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:22199-22302
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Obviously this requires the ability to become mentally relaxed. However, this is something that can be learned.
    text: |-
      Joseph McMoneagle believes remote viewing subjects need the ability to become mentally relaxed, and that this ability can be learned.
  - id: 0cf660ad-e300-495b-a1f9-5e111ece5ca0
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:22312-22399
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I am a triple A-type personality, but when I want to be, I can look and act like grass growing.
    text: |-
      Joseph McMoneagle describes himself as having a triple A-type personality who can nonetheless become deeply relaxed when he wants to.
  - id: e396a93c-0c3d-4fa4-9f87-74a46395c6b3
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:22600-22716
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: a82c682b-80fb-488c-8a47-3142481c1458
        name: Meditation
    quote: |-
      Almost any form of meditation works in this regard. If you can learn to meditate, you may learn to be a good remote viewer.
    text: |-
      Joseph McMoneagle believes almost any form of meditation can help develop the ability to be a good remote viewer.
  - id: 76c1c4ff-8483-4f62-8f62-53e8892099e4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:22912-23156
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      This has to do with focus, or the ability to cut out distractions that might occur while remote viewing. Another way of stating this is: viewers disassociate from what's around them and associate with the actual target site, person, object, or event.
    text: |-
      Joseph McMoneagle believes remote viewers must be able to reduce their physical arousal level by focusing to cut out distractions, mentally disassociating from their surroundings and associating with the target site, person, object, or event.
  - id: d53bf2e0-d0b2-401c-b33a-be0110630f6f
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:23388-23470
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      This simply means shutting out audio or visual interference through an ability to focus.
    text: |-
      Joseph McMoneagle believes remote viewers must be able to reduce sensory input by shutting out audio or visual interference through focus.
  - id: 87b422b2-91b0-407f-ab59-f8318ec30ddd
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:23961-24172
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      If you do not currently have a general understanding for why you are depressed, angry, frustrated, anxious, bored, or in any other mental state, then you probably are going to have a very tough time with remote viewing.
    text: |-
      Joseph McMoneagle believes a remote viewer needs increased awareness of their own internal processes, feelings, and images, and must be able to understand why they experience emotions such as depression, anger, or anxiety.
  - id: 2628457b-d720-4431-a601-9a13688099d0
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:24698-24974
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      This was largely addressed already, but I would add once again, that I would separate action modes and receptive modes of thinking from the concept of right and left hemispheric functioning. I think they are two separate issues and do not operate as closely in unison as some believe.
    text: |-
      Joseph McMoneagle believes psychic functioning should decrease with action-mode/left-hemispheric functioning and increase with receptive-mode/right-hemispheric functioning, though he considers action/receptive modes and left/right hemispheric functioning to be two separate issues rather than closely linked.
  - id: 48d1d4c1-6cb8-4473-8596-4d9cb8ea9df0
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:25386-25497
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I am sure that time and space in their entirety are illusions, and these very illusions are why all things are related.
    text: |-
      Joseph McMoneagle believes remote viewers must have an altered view of the nature of the world, considering time and space to be illusions and that all things are related because of this.
  - id: 3ca9494b-77b4-42ec-9616-687dfb3f6cb4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:25506-25663
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There is no good or evil involved in remote viewing. There may be yin and yang, constructive and destructive energies, but good or bad exist only within the mind.
    text: |-
      Joseph McMoneagle believes there is no good or evil involved in remote viewing itself, only within the mind.
  - id: 360da6f0-dc65-42d8-87ec-8591f47b0a4f
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:25754-25997
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      But I am saying that you cannot carry these concepts into remote viewing with you. By doing so, you build walls, construct tunnels, and essentially attempt to steer yourself to the information, instead of letting it just fall into your mind's hands.
    text: |-
      Joseph McMoneagle believes personal concepts of good and evil cannot be carried into remote viewing, because doing so builds walls and causes the viewer to steer toward information rather than letting it arrive naturally.
  - id: c784cdb2-3a01-4671-a377-f72133231719
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:26142-26409
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      It is absolutely essential that remote viewers suspend judgment and interpretation of the materials and information they might be receiving. Otherwise, everything you perceive will be tainted with the color of your desire, or shaded by the darkened glass of personal prejudice.
    text: |-
      Joseph McMoneagle believes remote viewers must suspend judgment and interpretation of the material and information they receive, or else it will be tainted by their desires or personal prejudice.
  - id: 1015dc13-e1c1-4a55-9432-3bb166209814
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:26742-26854
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The best anyone can do is to temporarily set prejudice aside. And speaking from experience, that takes years of practice.
    text: |-
      Joseph McMoneagle believes eliminating personal prejudice is very difficult, and that the best anyone can do is temporarily set prejudice aside, which he says takes years of practice.
  - id: 94f8cabe-6a31-4d7a-aae7-1f1e4106ed98
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:27130-27266
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      If you are unable to set your personal wants, desires, likes, dislikes, etc., aside, then you are highly unlikely to make a good remote viewer.
    text: |-
      Joseph McMoneagle believes someone unable to set aside their personal wants, desires, likes, and dislikes is highly unlikely to become a good remote viewer.
  - id: 23e29fd3-9712-4130-a3c5-4b3a24e54a07
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:27348-27698
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      This is critically important to the success of any remote viewing. However, having said that, I must add that it is not really my problem as a remote viewer. Take note, all you scientists, researchers, and applications-oriented people out there; it's up to you to keep me interested, make sure the results are important to me, and not the other way around.
    text: |-
      Joseph McMoneagle believes the act of psychic functioning must be at least momentarily important to the remote viewer, but considers it the responsibility of the scientists, researchers, and applications-oriented people involved to keep the viewer interested rather than his own responsibility.
  - id: 170bad60-a1c6-43a1-9641-bbc5ddf42d53
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:27741-28153
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      1: The types of targets used and their contents. 2: The reasons you give me for doing the remote viewing. –It's importance from a social, historical, cultural, or survival viewpoint, or –You pay sufficiently to buy my interest in the inevitable outcome, or –Ensure that success provides some other form of reward that is intrinsic to the effort (finding a lost child, kidnap victim, or similar sort of thing).
    text: |-
      Joseph McMoneagle believes a remote viewer's interest can be secured through the type and content of targets used, the reasons given for doing the viewing, or sufficient payment for the viewer's interest in the outcome.
  - id: b230ebec-7b86-439f-bd87-8e2b0c2b8ba3
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:28240-28340
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The idea here is that the remote viewer must share in or enjoy the value and reward that comes with success.
    text: |-
      Joseph McMoneagle believes a remote viewer must share in or enjoy the value and reward that comes with a successful session.
  - id: d6a59c98-e138-4818-9144-b18bc3367518
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:28492-28812
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      If they consider themselves to be successful, to be valuable, then it doesn't matter how society or culture might measure success. Such people, secure in their own perceptions, will be better able to deal with the kinds of treatment they are bound to receive from the outside world. This is especially true about remote viewers.
    text: |-
      Joseph McMoneagle believes how a person values their own success matters more than how society measures success, and that people secure in their own self-perception deal better with the treatment they receive from the outside world, which he considers especially true for remote viewers.
  - id: 4d1dac58-7cff-4b45-8430-7345a46720d5
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:28960-29280
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: d122c29f-5a71-49bc-bf04-5106f5307859
        name: United States Army
    quote: |-
      This characteristic works when you have a baseline of comparison. In the military, where you have a large percentage of conformists, this characteristic might have just a tad bit more value. It can also be valuable in a corporate world where you have people who buck the system but still seem to enjoy a large degree of success.
    text: |-
      Joseph McMoneagle believes people liked by their peers but considered different from the norm make better remote viewers, and that this characteristic is more pronounced in contexts with a high baseline of conformity, such as the military, or in corporate settings.
  - id: 93131289-e1a1-4c06-9db4-c15555394a5c
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:29811-30060
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      One should look for a person who consistently demonstrates an ability to find solutions to problems that are not within the norm, or might never have been tried before. Or, maybe a demonstration of actions that are totally unexpected but successful anyway.
    text: |-
      Joseph McMoneagle believes a good candidate for remote viewing consistently demonstrates the ability to find solutions to problems outside the norm or take unexpected but successful actions.
  - id: 8856d817-94b3-4927-9474-b310d2f4d49d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:30169-30323
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      If people decide up front that there are only very delineated or structured approaches to problems, then they are not open enough to enjoy remote viewing success.
    text: |-
      Joseph McMoneagle believes a willingness to pursue new avenues of approach is important because people who limit themselves to fixed, structured approaches are not open enough to succeed at remote viewing.
  - id: 0c3d1dbf-1012-40df-9518-1102755e14fe
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:30422-30660
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In the land of remote viewing, anything is possible. It is usually the surprising information that proves to be correct. The more open someone is to any possibility and the least wedded they are to a fixed reality, the more likelihood of success.
    text: |-
      Joseph McMoneagle believes the more open a person is to any possibility and the less wedded to a fixed reality, the greater their likelihood of success in remote viewing, and that surprising information usually proves to be correct.
  - id: c5a530f1-5655-49c1-adee-68dc06b6a2cf
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:30877-31119
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Someone who is very creative is already half way toward being a good remote viewer. Creative individuals have an instinct that they cherish above all other skills. This is the same instinct that inherently drives a remote viewer to the right answer.
    text: |-
      Joseph McMoneagle believes highly creative individuals are already halfway toward being good remote viewers, since the instinct that drives creativity is the same one that drives a viewer to the correct, often unique, answer.
  - id: 26f6abce-1586-4bd4-b731-65e0a457a89d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:31362-31528
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I believe wherever you find a very creative and successful person, you will also find good material for remote viewing. They are already practicing what they need to learn.
    text: |-
      Joseph McMoneagle believes wherever a very creative and successful person is found, they will also make good material for remote viewing, since they are already practicing the necessary traits.
  - id: 01f29111-6fe6-4d71-83e1-60e25ac1f623
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:31739-32024
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Believe it or not, this is probably one of the most important qualifications. It's important because this is an active display of a person's individuality and internalized strength. By retaining their critical thought in all ways, they are by nature taking the "middle ground" on most issues.
    text: |-
      Joseph McMoneagle believes the capacity for critical thought and unafraid voicing of opinion is one of the most important qualifications for a remote viewer, as it demonstrates individuality, internalised strength, and the ability to take the middle ground.
  - id: 66605828-9e27-4dbc-bdaf-f412792542b9
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:32131-32301
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      There are two kinds of people who generally make terrible remote viewers: ones who under no condition will believe in it, and those who totally buy into it; no questions asked.
    text: |-
      Joseph McMoneagle believes two kinds of people generally make terrible remote viewers: those who will not believe in it under any condition, and those who totally buy into it without question.
  - id: 8c238e5b-4dbc-4c9a-976c-d69059644191
    type: opinion
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: unattributed
      origin: a saying circulated among staff at the remote viewing laboratory
      relay:
        - Joseph McMoneagle
    attribution_in_text: false
    location: ch16:32309-32543
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      We even have a saying that's passed around the lab. "The worst possible participants are the believers." This means people who have become involved in remote viewing who have replaced their critical thinking ability with unquestioned belief.
    text: |-
      There is a saying passed around the remote viewing laboratory that the worst possible participants are the believers, meaning those who replace critical thinking with unquestioned belief.
  - id: d33949fe-b41a-4dc3-adf3-065cbda22763
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:32552-32749
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Historically more damage has been done to remote viewing applications, research, and development by those who have bought it "no questions asked" than by all deliberate assaults on it from outside antagonists.
    text: |-
      Joseph McMoneagle believes historically more damage has been done to remote viewing applications, research, and development by unquestioning believers than by all deliberate outside attacks on the field combined.
  - id: 1ea6cea9-1fd0-4271-b9b7-d4ba908425f9
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:32763-33143
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Critical thinking is essential to ensuring that both applications and research are polished and perfected beyond reproach. Critical thinking is essential to appropriately limiting how and when remote viewing might be used. And critical thinking is essential to weeding out erroneous beliefs, fraud, or any of the other thousands of things that can bring discredit on the field at large.
    text: |-
      Joseph McMoneagle believes critical thinking is essential to polishing and perfecting remote viewing applications and research, to appropriately limiting its use, and to weeding out erroneous beliefs and fraud in the field.
  - id: 3f5ae7c5-cd00-4f3b-8ebc-61694cb150b3
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:33326-33599
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Everyone who participates in remote viewing applications or research has the responsibility to continually challenge the techniques, methods, protocols, testing, evaluations, reporting, and the participants' actions with a critical eye towards improving and perfecting the methods.
    text: |-
      Joseph McMoneagle believes everyone involved in remote viewing applications or research has a responsibility to continually challenge techniques, methods, protocols, testing, evaluations, reporting, and participants' actions with a critical eye toward improvement.
  - id: 3857c148-bd5d-4775-b099-711a055bf00c
    type: administrative
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:34233-34403
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
    quote: |-
      At the outset of the military STARGATE Program, great effort was made to insure that stability. But testing, multiple interviews, and a long term vetting process is very expensive.
    text: |-
      At the outset of the military Project STARGATE, great effort was made to ensure the psychological stability of remote viewing participants through testing, multiple interviews, and a long-term vetting process.
  - id: 2d8b9fc3-68dd-4091-a5de-c0e93e9fff6e
    type: administrative
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:34414-34504
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
    quote: |-
      Later in the program, a decision was made to no longer do this testing in order to reduce costs.
    text: |-
      Later in Project STARGATE, a decision was made to stop the extensive psychological vetting testing of participants in order to reduce costs.
  - id: 22ce907d-f554-48a6-b2d5-633fc22c0007
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:34511-34812
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
    quote: |-
      Without going into specific personalities, I can say that in more than one case, otherwise stable individuals were stripped of their psychological boundaries, and subjected to areas of inquiry that they should not have been. As a result they became quite unstable, emotionally, mentally, or sometimes both.
    text: |-
      Joseph McMoneagle states that after psychological vetting testing was dropped from Project STARGATE, otherwise stable individuals in more than one case were stripped of their psychological boundaries and became emotionally, mentally, or both unstable as a result.
  - id: 5251b89c-040a-4ede-b25c-96544e959969
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:34818-34988
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The field is still struggling with the damage resulting from these individuals' experiences. It is unfortunate for both the field as well as the people who suffered as a result.
    text: |-
      Joseph McMoneagle believes the remote viewing field is still struggling with the damage resulting from destabilised individuals' experiences during military remote viewing training.
  - id: a1a7daa0-3596-4c49-99eb-7c6da30c4f14
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:34997-35289
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      As far as I can see there are no controls whatsoever on who becomes involved in remote viewing in the public arena. Individuals are welcomed through the door, enter sometimes unproven training programs, and are otherwise exposed carte-blanche to processes that unhinge them from their stable environs.
    text: |-
      Joseph McMoneagle observes that in the public remote viewing arena there are no controls on who becomes involved, with individuals welcomed into unproven training programmes and exposed to processes that unhinge them from stable environments.
  - id: 55d6156e-f696-4c7d-8e74-521cac4432fb
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:35299-35554
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      A few ex-military viewers I know attempt to influence and screen those they feel might be damaged by involvement in remote viewing, but even so, this is not done unless the person wanting to participate is overtly acting out in some fashion that warrants exclusion.
    text: |-
      Joseph McMoneagle states that a few ex-military remote viewers he knows attempt to screen and influence those they feel might be damaged by involvement in remote viewing, but only when a participant is overtly acting out.
  - id: 0c51ebea-1c7e-4cbb-930a-bc01bd3b443e
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:35565-35661
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      And, unfortunately, many who now claim expertise in this field make no attempt at all to screen participants.
    text: |-
      Joseph McMoneagle states that many people who now claim expertise in remote viewing make no attempt at all to screen participants for potential harm.
  - id: 5787783f-8ed3-4dc4-9934-7886a9ee754a
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:35676-35955
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 53266a9f-69a3-4718-bac4-ee174c993923
        name: Intuitive Intelligence Applications, Inc.
    quote: |-
      About twenty percent of the people who contact me through my office at Intuitive Intelligence Applications are looking for help in regaining their stable pre-exposure attitudes. Since I am not a psychiatrist or psychologist, I am forced to refer them to qualified counselors for help.
    text: |-
      Joseph McMoneagle states that about twenty percent of people who contact him through his office at Intuitive Intelligence Applications, Inc. are seeking help regaining their stable pre-exposure attitudes after remote viewing involvement, and that he refers them to qualified counselors since he is not a psychiatrist or psychologist.
  - id: 8c4fd63a-a73f-40f3-ba13-ad6f70479dc6
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:37270-37476
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      It is the responsibility of those already involved in remote viewing to evaluate a possible participant prior to exposure, not the participant's requirement to suddenly determine their own instability post initiation.
    text: |-
      Joseph McMoneagle believes it is the responsibility of those already involved in remote viewing to evaluate a possible participant prior to exposure, rather than the participant's responsibility to determine their own instability after starting.
  - id: 2b0c4c5f-72a4-4ba0-b309-3d868fbad1aa
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:37546-37719
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      There is only one way I know of doing this. It's called testing. You demonstrate what remote viewing is and how it works to the individuals and then test them coming in the door.
    text: |-
      Joseph McMoneagle states that the only reliable way of determining the probable skill level of a remote viewer is through testing, demonstrating remote viewing to individuals and then testing them at the outset.
  - id: bd871e6e-a916-4c10-941b-e004c089854f
    type: opinion
    attestation: first_hand
    speaker:
