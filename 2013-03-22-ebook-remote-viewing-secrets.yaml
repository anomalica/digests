  - id: cde4ed95-de7e-4dd6-a9b5-dc04e7db7a32
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:10560-10732
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Remote viewing always operates best when it is used for producing information on something that is known to exist. In other words, one should be assured that the target is real.
    text: |-
      Joseph McMoneagle considers that remote viewing operates best when used for producing information on something known to exist, where the target is real.
  - id: 09727dad-afe7-4cb5-91f0-2381a029c411
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:11690-11784
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      By keeping the viewer blind to the entire target, you can compare his ground plan to the real thing.
    text: |-
      Joseph McMoneagle recommends keeping a remote viewer blind to the entire target so that the viewer's ground plan can be compared to the real target for verification.
  - id: f9025e20-c4d8-4b1a-ba04-bc36c9a5901f
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:12339-12540
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      If you had provided the remote viewer knowledge of the ruins in the first place, you would have given up knowledge about the target which might have provided verification on the veracity of the remote viewing.
    text: |-
      Joseph McMoneagle considers that providing a remote viewer with knowledge of a target in advance would compromise the ability to use the resulting information as verification of the veracity of the remote viewing.
  - id: e767ba98-32bc-45eb-9edf-202b26bf2f2b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:13001-13319
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      This is why UFOs and similar kinds of targets usually make lousy remote viewing targets. What should be understood here is that the remote viewer is always given the least amount of information necessary to put them on the target location, and it should never be directly pertinent to what you are looking for answers to.
    text: |-
      Joseph McMoneagle considers that UFOs and similar targets usually make lousy remote viewing targets because the remote viewer must be given the least amount of information necessary to establish the target location.
  - id: 6b78c286-d288-415f-bbc0-dd81317db3fa
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:13749-13864
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In my experience, the chances of stating UFO material obtained through remote viewing is correct are very close to zero.
    text: |-
      Joseph McMoneagle states that in his experience, the chances of a UFO-related statement obtained through remote viewing being correct are very close to zero.
  - id: 5fe53bd2-c552-40ad-b227-9f80672a2342
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:15237-15416
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      We have equipment that can locate three specific microns amongst trillions, or iron ore from a hundred miles away. Remote viewing is good for pointing this equipment in the right direction.
    text: |-
      Joseph McMoneagle considers remote viewing well suited to producing new leads by assisting in targeting other technologies capable of locating a small number of specific microns amongst trillions, or iron ore from roughly 160 kilometres away.
  - id: bbc3222c-d4cb-40c0-b5fd-ed78650f570c
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:15508-15835
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Remote viewing is very good at filling in the details for events... Where a lot of information has been collected relevant to an event (say a crime), remote viewing is very good at gluing it all together, putting it into a cohesive and understandable pattern, or pointing out the missing pieces.
    text: |-
      Joseph McMoneagle considers remote viewing very good at reconstructing events by filling in missing details, for example gluing together information collected relevant to a crime into a cohesive and understandable pattern.
  - id: 2c9186c3-3ffb-4135-ba28-a12b969b9051
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:15938-16159
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There are unique targeting mechanisms that can be used to aid or assist in decision-making. This is especially true regarding binary problems, e.g., yes or no, go or don't go, buy or don't buy, left or right, up or down, etc.
    text: |-
      Joseph McMoneagle considers remote viewing useful for aiding binary decision-making problems, such as yes-or-no or go-or-don't-go decisions.
  - id: ec5235ea-41b9-48a8-88e8-e02422d3f609
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:16186-16540
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      When used within a very strict protocol, remote viewing can produce some amazing detail about things that have not yet happened, as long as they are descriptive. However, great caution has to be exercised when it comes to timing... Timing, or projecting when something is going to happen or happened, is something remote viewing is generally not very good at.
    text: |-
      Joseph McMoneagle considers that remote viewing, when used within a strict protocol, can produce amazing detail about descriptive things that have not yet happened, but is generally not very good at timing when something will happen or happened.
  - id: 74b90f0f-e8c8-4eff-952b-d4caad2eaada
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:16706-16899
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Targeting a series of numbers, specific words, or statements are examples of less than optimum targets for remote viewing. The way remote viewing works does not currently permit this degree of detail.
    text: |-
      Joseph McMoneagle considers that targeting a series of numbers, specific words, or statements are less than optimum targets for remote viewing because the way remote viewing works does not currently permit this degree of detail.
  - id: 01c42c3b-ebf7-4e59-8a3f-893d3f6e6148
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:17494-17783
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Remote viewing is generally not very good for providing information on mythical creatures, hypothetical events, non-physical properties, or phenomenological types of targets. In other words, it's generally not good for UFOs, the Lock Ness Monster, Sasquatch, or descriptions of heaven and hell
    text: |-
      Joseph McMoneagle considers remote viewing generally not very good for providing information on mythical creatures, hypothetical events, non-physical properties, or phenomenological targets, such as UFOs, the Loch Ness Monster, Sasquatch, or descriptions of heaven and hell.
  - id: cddef718-c00f-435c-ad64-e3d9b686f195
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:18786-18913
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      using remote viewing to identify a UFO base on Jupiter or the dark side of the Moon is totally useless and probably a waste of time.
    text: |-
      Joseph McMoneagle considers that using remote viewing to identify a UFO base on Jupiter or on the far side of the Moon is totally useless and probably a waste of time.
  - id: 2b409157-b6ca-43c0-9c8a-feea6686a20a
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:18920-19223
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Contrary to general opinion, using remote viewing to produce a location is also not a good idea. This is probably one of the least accurate ways of using this capability... I know this will be sad news to those who are looking for a missing child, but unfortunately it is true.
    text: |-
      Joseph McMoneagle considers that using remote viewing to produce a location, such as for a missing child, is generally not a good idea and is one of the least accurate uses of the capability.
  - id: 424020a0-08b8-4275-9989-9286377587eb
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:19418-19671
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Finding something or someone works only where superior police or detective work has been married to the remote viewing ahead of time... In the case of a kidnapping resulting in a missing person, this usually means the victim is dead.
    text: |-
      Joseph McMoneagle considers that finding a missing person via remote viewing works only where superior police or detective work has already been combined with the remote viewing, typically meaning the victim is dead in kidnapping cases.
  - id: e0ca341e-3218-4af2-af70-725302e9a875
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch14:20903-21029
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Except for perhaps five occasions I know about in twenty-five years, I've never seen remote viewing exceed sixty-five percent reliability.
    text: |-
      Joseph McMoneagle has never seen remote viewing exceed sixty-five percent reliability, except on perhaps five occasions in twenty-five years that he knows about.
