    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I ascribe to what would be considered a god by many, but a rule of order by others. In my view, God and the rules by which reality operate are one and the same.
    text: |-
      Joseph McMoneagle personally ascribes to what would be considered by many to be a god, but by others a rule of order, and views God and the rules by which reality operates as one and the same.
  - id: 39febf9d-e523-4a6b-b4bc-f7d901434f78
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:29499-29707
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
