    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I know dozens of avowed and honest skeptics who stated up front their disbelief. Entering the experimental process with an open mind quickly changed their viewpoint.
    text: |-
      Joseph McMoneagle has personally known dozens of avowed and honest skeptics who stated their disbelief in remote viewing up front, and whose viewpoint quickly changed after entering the experimental remote viewing process with an open mind.
  - id: f657e856-f7de-4701-9de6-0e387d1399ec
    type: observation
