        name: Remote Viewing
    quote: |-
      It is the responsibility of those who introduce people to remote viewing (be they scientists, self-appointed instructors, anointed gurus, or an official government agency) to insure that proper guidance is provided with regard to philosophic or theological changes and appropriate roadmaps.
    text: |-
      Joseph McMoneagle believes it is the responsibility of those who introduce people to remote viewing, whether scientists, self-appointed instructors, gurus, or an official government agency, to ensure proper guidance is provided regarding philosophic or theological changes.
  - id: 0b4d178d-5af2-455c-a55e-e4c86655ceb5
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
