    quote: |-
      Statistics should only be developed within a lab, or during the post hoc analysis of research targets, when all of the variables are being controlled.
    text: |-
      Joseph McMoneagle considers that statistics about remote viewing accuracy should only be developed within a laboratory, or during post hoc analysis of research targets, when all variables are being controlled.
  - id: 19e96074-ebd6-43e4-babc-8e1d9d1a3c1f
