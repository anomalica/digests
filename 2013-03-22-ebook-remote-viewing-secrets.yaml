        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Familiarity with the problem seems to bring a better success rate with micro types of targets, even when the familiarity is developed through psychic means alone.
    text: |-
      Joseph McMoneagle observes that familiarity with a problem, even developed through psychic means alone, tends to bring a better success rate with micro-type remote viewing targets.
  - id: 482aee54-e28f-433f-a217-f0b18b2163bb
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:40776-40961
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      This does not preclude the monitor or anyone else in the room with the viewer from being kept totally blind as to the target as well. No one in the room should know that it is the same target.
    text: |-
      Joseph McMoneagle recommends that the monitor and anyone else present with a remote viewer be kept totally blind to the target when the same target is used repeatedly.
  - id: 469c9351-49ff-4f33-9733-7e92f7171bbb
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:40974-41261
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
