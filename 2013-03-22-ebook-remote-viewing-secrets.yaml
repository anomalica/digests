        name: Remote Viewing
    quote: |-
      If you are way off to one end, let's assume the right, you are probably not open enough to allow remote viewing to operate. If you are way off to the left, you are probably too open, too airy or flighty to deal with it. ... Too much of either end of the seesaw will be destructive.
    text: |-
      Joseph McMoneagle believes that being too closed philosophically or theologically (too disbelieving) makes a person insufficiently open to allow remote viewing to operate, and that being too open makes a person unable to acknowledge the rules within which remote viewing must operate; both extremes are destructive.
  - id: e11df735-ee1a-49d1-b3cf-ac2cd253a225
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
