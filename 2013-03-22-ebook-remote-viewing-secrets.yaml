        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In most cases they not only make no effort to address it in any way, they do not even know how, or acknowledge this responsibility.
    text: |-
      Joseph McMoneagle believes that in most cases, those who introduce people to remote viewing make no effort to address philosophic or theological guidance, and do not even know how or acknowledge the responsibility.
  - id: 7713a69d-4518-4f48-a4a0-0e46c8b11984
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
