        name: Joseph McMoneagle
    quote: |-
      In most scientific areas, notebooks are required to be time/dated, and initialed by a second party at the end of the workday.
    text: |-
      Joseph McMoneagle notes that in most scientific areas, experimental notebooks are required to be time- and date-stamped and initialled by a second party at the end of the workday.
