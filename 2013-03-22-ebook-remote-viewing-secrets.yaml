    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      What I have observed over twenty plus years is something like the following: If people are brought into remote viewing and shown encouraging examples of a remote viewer who is successful, and time is spent building confidence in the probability of remote viewing working, then, when tested, they will usually perform well from the outset.
    text: |-
      Based on more than twenty years of observation, Joseph McMoneagle finds that people shown encouraging examples of a successful remote viewer and given time to build confidence usually perform well from the outset when tested.
  - id: 51f958ee-3e27-4bc5-a72f-1b57739fa002
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
