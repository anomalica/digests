        name: Outbounder Remote Viewing
    quote: |-
      An Evaluator (Analyst). ... In either case, the evaluator should have no contact with any member of the out bounder team until after evaluations or analyses have been made and no other visits to the target site are intended.
    text: |-
      In the Outbounder Remote Viewing protocol, the evaluator (analyst) judges the collected material and should have no contact with any member of the outbounder team until after evaluations or analyses have been completed and no further visits to the target site are intended.
