    quote: |-
      If parents come to me and ask that I find their son or daughter, and the son or daughter is over the age of consent, I can do only what the parent would ask a private detective or policeman to do: try to locate the son or daughter, and then attempt to deliver a message of concern from the parents to them. I cannot give the location to the parents directly, as that would be a violation of the son or daughter's privacy.
    text: |-
      Joseph McMoneagle holds that when parents ask him to find an adult son or daughter, he can only try to locate them and deliver a message of concern, not give the location directly to the parents, because doing so would violate the son or daughter's privacy.
