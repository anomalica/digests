      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Some viewers ascribe their ability to God's power, which usually generates hostility from the other side of the fence.
    text: |-
      Joseph McMoneagle observes that some remote viewers ascribe their ability to God's power, which usually generates hostility from others.
  - id: 27a093b9-2c1c-4b28-a5ae-47ce1cde5ad4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
