    quote: |-
      any comments, statements, or rumors you might have heard about any differences in quality, ability, or accuracy between women and men are fabrications. They are simply not true.
    text: |-
      Joseph McMoneagle considers claims of differences in quality, ability, or accuracy between women and men in remote viewing to be fabrications and not true.
