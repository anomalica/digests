        name: Outbounder Remote Viewing
    quote: |-
      Some believe the Outbounder is there to pass telepathic information back to the viewer, but this is probably wrong. ... Usually, a viewer will provide a considerable amount of information that the Outbounder never has direct access to on the target site.
    text: |-
      Joseph McMoneagle considers it probably wrong that the outbounder's role is to pass telepathic information back to the viewer, noting that a remote viewer typically provides considerable information the outbounder never had direct access to at the target site.
