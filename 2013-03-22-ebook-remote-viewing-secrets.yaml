        name: Remote Viewing
    quote: |-
      My observations over many years, leads me to believe that the simpler you can keep the process, the better. The more natural talent you can bring into the room, the better. The fewer conditions you require, or variables you apply, the better.
    text: |-
      Joseph McMoneagle's overall observation from many years is that success in remote viewing is best when the process is kept simple, more natural talent is brought into the room, and fewer conditions or variables are applied.
