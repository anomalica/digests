        name: Remote Viewing
    quote: |-
      The unconscious spontaneous result accounts for more accuracy and detail in remote viewing than any other form of response.
    text: |-
      Joseph McMoneagle considers that unconscious spontaneous results account for more accuracy and detail in remote viewing than any other form of response.
  - id: 985c8dec-d0d6-42b8-8783-d2646658e239
    type: opinion
