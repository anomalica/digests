        name: Remote Viewing
    quote: |-
      This original sealed envelope would be verified still sealed by the witness when the remote viewing session material is recorded. It is then provided to the remote viewer for feedback.
    text: |-
      In a remote viewing session, an original sealed envelope containing targeting material is verified as still sealed by a witness at the time the session material is recorded, and is then provided to the remote viewer for feedback.
  - id: a428abdf-a7f4-4865-9219-2cc3337c1f7a
