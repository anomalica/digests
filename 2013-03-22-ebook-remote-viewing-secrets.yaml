    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: I always provide my customer with interim and final reports on their targets.
    text: |-
      Joseph McMoneagle always provides his customers with interim and final reports on their targets.
