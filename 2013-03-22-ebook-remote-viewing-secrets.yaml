    refs:
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
      - id: a042fed1-7c33-4d46-8340-0b2398034858
        name: Front-Loading (remote viewing)
    quote: |-
      Maps used for dowsing can front-load a viewer with information pertinent to the actual target they will soon be remote viewing, therefore it is always better to do the dowsing after the remote viewing has been accomplished. By then, the Remote Viewer will have developed a much stronger psychic sense about the target and what it might be, which only improves the results of the dowsing.
    text: |-
      Joseph McMoneagle considers it better to perform dowsing after a remote viewing session rather than before, because maps used for dowsing can front-load a viewer with information about the actual target, and performing it afterward lets the remote viewer's stronger psychic sense of the target improve the dowsing results.
  - id: 3808b9f5-2072-46eb-b2f3-12556e85be42
    type: administrative
    attestation: first_hand
