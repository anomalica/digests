        name: Remote Viewing
    quote: |-
      If someone does actually "see" something, it is almost always a close approximation or a close representation of reality, but not reality itself.
    text: |-
      Joseph McMoneagle considers it that when a remote viewer does actually 'see' something during a session, it is almost always a close approximation of reality rather than reality itself.
  - id: 928a7782-1238-43f1-8df0-7baaacb15c1e
