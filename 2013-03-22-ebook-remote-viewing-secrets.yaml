    location: ch17:15105-15282
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      The simple rule is: if you are using photographs as targets, then they are never shown to the viewer till after the remote viewing has been completed, and the results have been evaluated.
    text: |-
      When photographs are used as targets in remote viewing research or study, they are never shown to the viewer until after the remote viewing session has been completed and the results have been evaluated.
  - id: 872e0259-e49b-4ef1-a844-07c023f1615c
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:16095-16315
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In this case the photograph is not generally the target, but is one step removed from it. In other words, the photograph is used to get a viewer to a specific target or element within the target that might be of greater interest.
    text: |-
      In application-based remote viewing targeting, a photograph is typically not itself the target but one step removed, used to direct a viewer to a specific target or element of greater interest.
  - id: 1c93e751-914b-46e2-8322-4f802e35bfa5
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: '110'
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Viewers should not be shown photographs of the specific target of interest. ... one of the beautiful things about remote viewing is a viewer's ability to provide what otherwise would be very surprising information. But this can only be done when they have not been steered into some sort of expectancy, or their boundaries have not been perceptively fenced.
    text: |-
      Joseph McMoneagle advises that a remote viewer should never be shown a photograph of the specific target of interest, since doing so limits the viewer's perceptions to the contents of that photograph and prevents them from providing otherwise surprising information.
  - id: 24484bc6-e27f-4e7e-8152-ffeefb6496e7
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
