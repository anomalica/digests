        name: Joseph McMoneagle
    quote: |-
      For a specific experiment, I list where it's taking place, the pertinent start/stop dates, and times. I list who is present and what their specific jobs are relating to the experiment, what is going to take place in the experiment (both expected as well as observed).
    text: |-
      For a specific experiment, Joseph McMoneagle lists where it takes place, the start and stop dates and times, who is present, their specific jobs, and what is expected and observed to take place.
  - id: f33f04e0-499c-47e1-8a09-bb5bd7c956ab
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
