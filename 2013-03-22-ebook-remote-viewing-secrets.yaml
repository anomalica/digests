        name: Joseph McMoneagle
    quote: |-
      The experimental notebook should be firmly bound and you should not be able to remove pages from it, or add to them. It should have all the pages numbered somewhere in sequential order.
    text: |-
      Joseph McMoneagle recommends that an experimental notebook be firmly bound with pages that cannot be removed or added, all numbered in sequential order.
