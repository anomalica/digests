        name: Remote Viewing
    quote: |-
      Most of the really good remote viewers I know are buried up to their eyeballs in requests for support (mostly from non-paying clients, I would add), and they just don't have time to do all the work this would entail.
    text: |-
      Joseph McMoneagle observes that most of the good remote viewers he knows are overwhelmed with requests for support, mostly from non-paying clients.
