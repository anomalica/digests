      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: I've been building my target pool that I use for practice for about ten years.
    text: |-
      Joseph McMoneagle has been building his own target pool for remote viewing practice for about ten years.
