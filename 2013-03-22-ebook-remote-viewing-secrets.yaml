        name: Front-Loading (remote viewing)
    quote: |-
      BLIND TARGETING: Focusing the remote viewer on a target which the remote viewer is totally blind to, and for which there is no front-loading, or other preparation.
    text: |-
      Blind targeting is focusing the remote viewer on a target to which the remote viewer is totally blind, with no front-loading or other preparation.
