    quote: |-
      This is someone who is not otherwise associated with the remote viewers or anyone else directly involved in the remote viewing effort. It is the person who establishes the target pool.
    text: |-
      In the Outbounder Remote Viewing protocol, the person who establishes the target pool has no contact with anyone else involved in the remote viewing effort, to preclude contamination or sensory leakage to the viewer or judges.
  - id: 4c2c2d5d-2b1a-4de3-b43b-92c85b5469bd
