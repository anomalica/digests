        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: These are commonly referred to as "paths of leakage" or "leakage paths."
    text: |-
      Joseph McMoneagle states that unwanted information transfer during remote viewing sessions is commonly referred to as "paths of leakage" or "leakage paths."
  - id: db2544c3-4b74-4ebe-8fee-d184522e9516
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:14597-14765
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In most cases, people do not cheat—at least consciously. However, in rare cases I have seen people innocently add information after the termination of a remote viewing effort
    text: |-
      Joseph McMoneagle has observed that people rarely knowingly cheat during remote viewing, but in rare cases has seen people innocently add information after the termination of a remote viewing session.
  - id: 42ed77df-9bac-49b6-80e3-f30e6b635858
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:15509-15735
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Just a raised eyebrow can generate a need to expound on something one way or another. In some cases, this could result in an accusation of fraud, even though it might not have been done intentionally, it's best to discard the information.
    text: |-
      Joseph McMoneagle advises that if a remote viewer adds information after a session has been logged or filed, once someone who may know the target has seen it, it is best to discard the information.
  - id: 5c338c8d-1d1a-4225-90cd-eead4494928c
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:16078-16296
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In training, this is usually not the case. Controls, if they exist at all, are minimized. This sometimes provides an opportunity for viewers to accidentally see each other's work; they might sometimes see each other's targets
    text: |-
      Joseph McMoneagle observed that during training for remote viewing, controls over materials and information handling are usually minimised compared to applications, allowing viewers to accidentally see each other's targets or work.
  - id: 4769624b-0b67-4ace-8b68-50badf6e6730
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:17687-17814
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Training targets should stand alone, and be well-defined from their surroundings or other objects or possible targets in their proximity.
    text: |-
      Joseph McMoneagle recommends that remote viewing training targets should stand alone and be well-defined from their surroundings, rather than crowded together with other significant objects.
  - id: d0d7642f-2897-4664-a11a-e74dc0cb4626
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:18097-18242
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Targets should not be too complex. From an instructional as well as a research viewpoint, targets that are too complex are almost impossible to evaluate.
    text: |-
      Joseph McMoneagle recommends that remote viewing training targets should not be too complex, since complex targets are almost impossible to evaluate.
  - id: 2d63b4ad-0701-4ca9-81e6-96a4bd044e80
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:18667-18980
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
      - id: 5884a8ca-9d73-4fe8-a349-9f4a0158dc26
        name: Outbounder Remote Viewing
    quote: |-
      It might seem that Niagara Falls would make a great target, but depending on where the outbounder might be standing, or how the targeting is set up, you could get reams of information that will all be pertinent in some way to the target. A better target would be the observation tower on the Canadian side of the falls.
    text: |-
      Joseph McMoneagle recommends that the observation tower on the Canadian side of Niagara Falls would be a better remote viewing training target than Niagara Falls itself, since Niagara Falls could generate too much pertinent information depending on the viewing setup.
  - id: cd971768-5d0e-4118-8b79-25f49a2b963d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:18991-19095
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Training targets should contain major gestalts. Major features unique to the specific target should be present.
    text: |-
      Joseph McMoneagle recommends that remote viewing training targets should contain major gestalts, unique major features that produce a significant response in viewers.
  - id: 2e7ebc80-a3d6-44f8-acae-d9bec20f2e9c
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:19561-19749
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Limit the list of major gestalts. This has to do with complexity as well. If there are too many variants within the target pool, the viewer essentially gets lost while trying to identify them.
    text: |-
      Joseph McMoneagle recommends limiting the list of major gestalts used for remote viewing training targets, since too many variants in the target pool cause the viewer to get lost trying to identify them.
