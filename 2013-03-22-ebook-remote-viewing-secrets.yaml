        name: Remote Viewing
    quote: |-
      Since it's not possible to confirm out-of-body travel versus garden variety psychic functioning, it is impossible to know if someone is actually seeing the target.
    text: |-
      Joseph McMoneagle considers it impossible to confirm whether out-of-body travel occurs versus ordinary psychic functioning during remote viewing.
  - id: 46935805-5419-444f-aede-7c44b87822c9
    type: opinion
