        name: Joseph McMoneagle
    quote: |-
      What they display in terms of talent is probably somewhere between fifty and one hundred percent of what they will eventually display after training.
    text: |-
      Joseph McMoneagle states that a person's initial test performance typically displays between fifty and one hundred percent of the talent they will eventually display after training.
