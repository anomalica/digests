      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Very proprietary, close-hold, or sensitive corporate materials either passed to you by a customer, or produced on behalf of a customer should be encrypted if stored in computer media; or, as a minimum, be stored within an approved safe or security container.
    text: |-
      Joseph McMoneagle recommends that sensitive corporate materials be encrypted if stored on computer media, or otherwise stored in an approved safe or security container.
  - id: 54743cd9-4827-4d6e-92a6-99cae80d0408
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
