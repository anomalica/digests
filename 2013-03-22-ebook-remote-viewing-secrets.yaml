        name: Blind Targeting
    quote: |-
      1: Always do your remote viewing totally blind to the target—no hints, no front-loading, no one in the room with you who knows what the target is, and no other possibility of information transfer other than through psychic means.
    text: |-
      Joseph McMoneagle advises remote viewers to always work totally blind to the target, with no hints, no front-loading, and no one present who knows what the target is.
  - id: 02d26978-e734-441a-ae5e-c9e623d2c191
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
