    text: |-
      Joseph McMoneagle states that training in Controlled Remote Viewing differs from application of the technique in that, during training, the trainer or monitor knows the actual target, and the system was designed to entrain the viewer with certain unconscious or autonomic responses through a specific set of interactions between the viewer and the trainer.
