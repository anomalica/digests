        name: Joseph McMoneagle
    quote: |-
      At the end of the project, I usually do a summary sheet, which lists anything else that is not to be found in the other material that I might consider important.
    text: |-
      Joseph McMoneagle produces a summary sheet at the end of a project listing anything else considered important that is not found in the other material.
