    quote: Always choose your target randomly and always work it as a blind target.
    text: |-
      Joseph McMoneagle recommends always working a remote viewing target randomly and blind.
  - id: dbe07f0f-785d-442d-bb74-e19bbb7ae1c1
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:14294-14420
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      The results actually speak for themselves. What you find in most cases are very recognizable plateaus. These are like resting places... These can last for weeks or months.
    text: |-
      Joseph McMoneagle states that remote viewers commonly experience recognizable plateaus in progress that can last for weeks or months.
