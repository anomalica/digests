        name: Remote Viewing
    quote: |-
      As one is exposed to remote viewing, it should move those somewhat to the right or left more towards the center or fulcrum point.
    text: |-
      Joseph McMoneagle believes that being exposed to remote viewing should move a person who is philosophically or theologically at an extreme more towards the centre.
  - id: 1cc7c382-4cc0-4b2c-8b5f-8a84bb47ed20
    type: opinion
    attestation: first_hand
