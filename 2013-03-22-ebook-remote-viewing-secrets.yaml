        name: Project STARGATE
    quote: |-
      There were no books or articles that clearly outlined a method for finding someone who might be psychic, nor did any known method for training someone in remote viewing exist.
    text: |-
      When Project STARGATE was being organised, no known method existed for training someone in remote viewing.
