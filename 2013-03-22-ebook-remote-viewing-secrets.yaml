    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Sometimes I will deliberately cull parts or sections of the drawings if it's my perception that they would be confusing or misleading to the customer, based on the narrative. But, this is very rare.
    text: |-
      Joseph McMoneagle sometimes deliberately omits parts of his drawings from reports if he perceives they would be confusing or misleading to the customer, though this is rare.
