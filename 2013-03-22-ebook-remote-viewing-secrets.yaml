    quote: |-
      Most really good remote viewers are a lot more sensitive to information in photographs than the average person.
    text: |-
      Joseph McMoneagle considers most really good remote viewers to be more sensitive to information in photographs than the average person.
  - id: 484d1f74-f599-4bf0-9db1-4dbe883ad1c1
