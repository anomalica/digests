        name: Outbounder Remote Viewing
    quote: |-
      An Outbounder. Of course, this is the person who physically visits the target site, and acts as the target individual or beacon. The Outbounder's job is to simply interact with the site and in that way, provide an address to the target by his or her presence.
    text: |-
      In the Outbounder Remote Viewing protocol, an outbounder is the person who physically visits the target site and acts as the target individual or beacon, interacting with the site to provide an address to the target by their presence.
  - id: 8f8ed37a-5e8a-4a7c-a462-dfcc853f7075
    type: opinion
    attestation: first_hand
