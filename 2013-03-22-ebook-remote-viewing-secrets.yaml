    quote: |-
      almost anyone (the balance of any given population) can demonstrate fairly consistent results sufficient to show functioning beyond chance. Many may lose their interest over time, as a function of losing sight of its relative importance within their lives.
    text: |-
      Joseph McMoneagle believes almost anyone can demonstrate fairly consistent remote viewing results sufficient to show functioning beyond chance, though many may lose interest over time as they lose sight of its relative importance in their lives.
