        name: Outbounder Remote Viewing
    quote: |-
      Monitors sit with viewers while they are doing remote viewing. ... In any case, the monitor is never there to guide, lead, imply, or otherwise interfere with what the remote viewer is doing.
    text: |-
      In the Outbounder Remote Viewing protocol, a monitor sometimes sits with the remote viewer during the session, either to ensure adherence to protocol for research purposes or to help the viewer with collection methodology for application purposes, but never to guide, lead, imply, or otherwise interfere with the viewing.
  - id: b438ab3d-31e7-45c8-8a7b-d42193ed90fc
