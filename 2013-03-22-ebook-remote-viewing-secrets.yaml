        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Work at it for no more than fifteen minutes. Whatever you get in fifteen minutes is probably all you're going to get, initially.
    text: |-
      Joseph McMoneagle recommends practising a remote viewing session for no more than fifteen minutes initially.
