    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The person who runs the training should also keep a very detailed event log, with cross-referenced file numbers. If they don't, you really can't trust their memory either.
    text: |-
      Joseph McMoneagle considers it important that the person running remote viewing training also keep a very detailed event log with cross-referenced file numbers.
