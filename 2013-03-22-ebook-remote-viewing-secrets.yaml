    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      In fact, most scientists that I know who claim to be atheistic do believe there are rules to how reality operates and in most cases they have dug their heels in a lot harder against paranormal phenomenon than those who have a religious bent.
    text: |-
      Joseph McMoneagle observes that most scientists he knows who claim to be atheistic still believe there are rules by which reality operates, and in most cases have been more resistant to accepting paranormal phenomena than those with a religious bent.
  - id: a506400c-06fd-4128-b709-fd534067ca0d
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
