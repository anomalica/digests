    location: ch17:48641-48957
    refs:
      - id: a098a3c1-35d3-4498-b58e-a55d2e8d8a28
        name: Extended Remote Viewing (ERV)
      - id: a82c682b-80fb-488c-8a47-3142481c1458
        name: Meditation
    quote: |-
      Viewers accomplished this by developing their own means of focus or meditation, which in turn induced a very effective self-imposed altered state. This altered state allowed total disassociation from the immediate surroundings and free association with the target's surroundings and events, which were then reported on.
    text: |-
      Joseph McMoneagle explains that Extended Remote Viewing (ERV) viewers developed their own means of focus or meditation to induce a self-imposed altered state, allowing disassociation from immediate surroundings and free association with the target's surroundings and events.
  - id: 1dca1f92-37c2-4884-90f9-5b73bfe32c48
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:48962-49118
    refs:
      - id: a098a3c1-35d3-4498-b58e-a55d2e8d8a28
        name: Extended Remote Viewing (ERV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The surviving remote viewers of the time would tell you that this apparent free form, though viewed by many as difficult to deal with, was effective in the extreme.
    text: |-
      Joseph McMoneagle considers the free-form approach of Extended Remote Viewing (ERV), though viewed by many as difficult to deal with, effective in the extreme.
  - id: a15ce2d0-26ec-4760-9eac-4ced5b59ac78
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:49127-49382
    refs:
      - id: a098a3c1-35d3-4498-b58e-a55d2e8d8a28
        name: Extended Remote Viewing (ERV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The people who generally didn't like this methodology were of course not the people who were required to produce the information, nor were they the ones who were required to analyze it. They were the people who had to "sell the idea" of remote viewing to others.
    text: |-
      Joseph McMoneagle observes that those uncomfortable with Extended Remote Viewing (ERV) methodology were generally not the viewers producing the information nor the analysts, but those who had to sell the idea of remote viewing to others.
  - id: e5266dce-9fd5-4324-8480-d5d7a40cebd3
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:49626-50010
    refs:
      - id: a098a3c1-35d3-4498-b58e-a55d2e8d8a28
        name: Extended Remote Viewing (ERV)
      - id: a82c682b-80fb-488c-8a47-3142481c1458
        name: Meditation
    quote: |-
      Learning the methodology is simple. Through meditation, or other devices, training, etc., you learn to put yourself into a semi-trance state, or disassociate with your immediate surroundings, while maintaining a focus on your end goal, which is to establish an association with whatever the target might be. Then you report on what you might be seeing, feeling, hearing, or otherwise perceiving.
    text: |-
      Joseph McMoneagle describes learning the Extended Remote Viewing (ERV) methodology as putting oneself into a semi-trance state through meditation or other devices while maintaining focus on establishing an association with the target, then reporting on whatever is perceived.
  - id: 2d6152f2-2de7-40fb-b20e-19dbba57c4a6
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:50022-50214
    refs:
      - id: a098a3c1-35d3-4498-b58e-a55d2e8d8a28
        name: Extended Remote Viewing (ERV)
    quote: |-
      The ability to learn this requires a considerable focus and lots of practice, which must all be done within protocol. It is not a cheap way to learn remote viewing, since it is time and labor intensive.
    text: |-
      Joseph McMoneagle states that learning Extended Remote Viewing (ERV) is not a cheap way to learn remote viewing, as it is time- and labour-intensive and requires considerable focus and practice within protocol.
