    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
    quote: |-
      Way back in the beginning, there was concern about a number of things in the STARGATE Project, but probably highest on the list was the stability of the players.
    text: |-
      In the early stages of Project STARGATE, there was concern about the psychological stability of the participants.
  - id: 0623a51d-079c-47f2-9863-e31002b9beb3
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:827-1069
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Reality dictates that if you want to start a project that will be investigating the use of psychics, you can't simply walk into the effort with people who believe in it. Nor, surprisingly, can you walk into the room with people who refuse to believe.
    text: |-
      Joseph McMoneagle considers that a remote viewing project cannot be run using only people who already believe in psychic functioning, nor only people who refuse to believe in it, because both groups will find what they expect to find.
  - id: 91c29b61-c349-4bef-b4d3-358cf63bcfa4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:2598-2866
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      A person who attempts to debunk remote viewing is really someone trying to expose it as a sham or fraud. They enter the scene with a belief that remote viewing is a sham or fraud, so any pretense at being skeptical in a healthy sense of the word is shattered from the outset.
    text: |-
      Joseph McMoneagle considers that a person who sets out to debunk remote viewing enters with a prior belief that it is a sham or fraud, undermining any claim to healthy scepticism.
  - id: 4e9c49e4-ee7c-4d31-9ffe-5585d41f9800
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:3340-3549
    quote: |-
      In my opinion most debunkers or people who walk in the door with their mind made up are either in it for the money and the notoriety, or are operating from some deep-seated and personal fear about the subject matter.
    text: |-
      Joseph McMoneagle considers that most people who act as debunkers do so either for money and notoriety, or from a deep-seated personal fear of the subject.
  - id: 63ec09ed-a99f-4676-91b0-101bfd0ec84b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:4297-4565
    quote: |-
      My best friends in the investigation of the paranormal are honest skeptics. They have a maddening way of seeing things that anyone tied to a belief system will miss. They ferret out possible information leakage paths that even the smartest investigator will sometimes miss.
    text: |-
      Joseph McMoneagle considers that his best friends in paranormal investigation are honest sceptics who help identify possible information leakage paths that even skilled investigators can miss.
  - id: 81c17d32-16db-4fb3-8891-9761d998e628
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:5664-5913
    refs:
      - id: 6dcb2a3a-d3b5-4007-a54a-731918045c8a
        name: Akashic Records
    quote: |-
      If you read the available and not too distant literature, you will find that many still regard parapsychologists as people who believe in spirits, possession, Akashic records, things that go bump in the night, and (shudder), even the existence of a God.
    text: |-
      Joseph McMoneagle observes that many people still regard parapsychologists as believers in spirits, possession, Akashic records, and similar phenomena.
  - id: db140213-4e5f-4cbc-9302-533a3e4aab8d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:8209-8541
    quote: |-
      The paranormal arena is filled with fraud—at least three kinds. The first is actually one of the easiest to detect—that would be deliberate fraud. If you are doing your homework and pursuing the paranormal in an appropriate and scientific manner, your protocol design, peer review, and experimental safeguards should detect most of it.
    text: |-
      Joseph McMoneagle identifies deliberate fraud as one of at least three kinds of fraud present in the paranormal field, and considers it the easiest to detect through protocol design, peer review, and experimental safeguards.
  - id: b1c68708-5a8c-47d3-b6b1-10b7e5ecb073
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:8901-9188
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I long ago accepted the fact that in the study of parapsychology, one must assume there is going to be fraud and take proactive steps to prevent it. This means that in designing remote viewing protocols, you assume everyone is out to fix the results. Yes, that includes experimenters as well.
    text: |-
      Joseph McMoneagle assumes fraud is possible in the study of parapsychology, including on the part of experimenters, and designs remote viewing protocols accordingly.
  - id: 443d4a61-cb85-4a04-90c1-082e14c520f1
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:9561-9711
    quote: |-
      In the labs in which I've worked, they will tell you right up front that they are designing the protocols to prevent fraud, and one shouldn't take it personally.
    text: |-
      Joseph McMoneagle reports that the laboratories in which he has worked design their protocols explicitly to prevent fraud and inform trainees of this up front.
  - id: b1dd4c1e-c342-45a9-a32f-ea6baa83ef43
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:9778-10362
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There is a second kind of fraud, which we can call accidental. I know, there are now lots of raised eyebrows out there. But, there are cases of information leakage in remote viewing experiments that support accidental fraud, or what could be construed as such. That would be where someone does something which s/he honestly believes is okay, simply because s/he's ignorant of the rules. Some psychics would believe that adding information after they've completed a project because they honestly were thinking the information at the time, but just didn't remember to write it down, is okay.
    text: |-
      Joseph McMoneagle identifies a second kind of fraud in remote viewing experiments, which he calls accidental fraud, arising from information leakage such as a psychic adding information after completing a project because it was not written down at the time.
  - id: 8ea0f295-c913-4725-ae48-098210101ef9
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:10519-10819
    quote: |-
      What happens is that it creates an atmosphere that strongly supports the third and most lethal form of fraud—which I call self-delusion. That's where you violate a significant number of smaller issues, allowing a false result, which contributes to altering your own belief that what you are doing is right.
    text: |-
      Joseph McMoneagle identifies a third and, in his view, most lethal form of fraud, which he calls self-delusion, arising from repeatedly violating minor protocol issues until one comes to believe a false result is correct.
  - id: 380ee4b2-6b30-4539-954b-4259d013f67a
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:11293-11406
    refs:
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I have found myself strolling down that path on more than one occasion and suspect that I will find myself there again.
    text: |-
      Joseph McMoneagle reports that he has found himself at risk of self-delusion regarding remote viewing on more than one occasion and expects it may happen again.
  - id: 2f61cd3f-9dab-44c6-bf3f-8a91e8c32d32
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:11542-11907
    quote: |-
      In my twenty plus years of dealing with conditions surrounding the field of the paranormal, I have seen numerous instances where seriously bad calls have been made. Almost without exception, these bad calls were a result of either not taking a person's mental state seriously or not recognizing the impact that exposure to the paranormal might have on a vulnerable individual.
    text: |-
      In over twenty years of working in the field of the paranormal, Joseph McMoneagle observed that serious errors of judgement almost always resulted from failing to take a person's mental state seriously or failing to recognise the impact of paranormal exposure on a vulnerable individual.
  - id: 82c35359-79ed-4a2a-93e3-43cbb55b9efe
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch15:11919-12082
    quote: |-
      Not rank (military or civilian), age, experience, or previously displayed capability in other areas was a good pre-indicator for who could handle it and who could not.
    text: |-
      Joseph McMoneagle observed that neither military nor civilian rank, age, experience, nor previously displayed capability in other areas reliably predicted who could psychologically cope with exposure to the paranormal.
  - id: 0e9645e7-e151-47b5-a624-62a73b4d2e4d
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch15:12087-12379
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
    quote: |-
      The outset of the STARGATE Project involved extensive psychological testing and numerous interviews, as well as a gradual program of exposure, to insure that centered and stable individuals were allowed to participate, individuals who could cope with and integrate what they would be exposed to.
    text: |-
      Project STARGATE originally involved extensive psychological testing, numerous interviews, and a gradual programme of exposure to ensure that only centred and stable individuals were allowed to participate.
