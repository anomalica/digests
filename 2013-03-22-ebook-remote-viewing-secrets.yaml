        name: Remote Viewing
    quote: |-
      Over the years, I've developed a number of techniques for fooling my ego or conscious mind, for lulling it to sleep while I attempt to produce psychic information.
    text: |-
      Joseph McMoneagle developed several personal techniques over the years for lulling his ego or conscious mind to sleep while attempting to produce psychic information.
  - id: 0b10408a-8efc-42fb-a87b-851e27cebe21
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
