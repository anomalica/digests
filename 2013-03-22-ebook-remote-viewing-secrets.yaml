        name: Front-Loading (remote viewing)
    quote: |-
      Ignoring the requirement that a monitor also be blind to a target and inappropriately front loading that individual with too much knowledge about the target will inevitably result in the possibility of inappropriate actions or statements occurring inside the room during the remote viewing.
    text: |-
      Joseph McMoneagle considers that ignoring the requirement that a monitor also be blind to a target, and front-loading that individual with too much knowledge about the target, will inevitably result in the possibility of inappropriate actions or statements occurring inside the room during the remote viewing.
