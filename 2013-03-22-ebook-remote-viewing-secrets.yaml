        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I recommend you teach yourself. I sincerely believe that this is appropriate because I believe that individual perception is more a matter of unlearning than learning.
    text: |-
      Joseph McMoneagle recommends that people teach themselves remote viewing, believing that individual perception is more a matter of unlearning than learning.
