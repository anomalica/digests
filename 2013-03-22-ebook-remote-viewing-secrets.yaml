    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Remote viewers should never analyze their own material. Let someone else do that. This is especially pertinent to the learning process.
    text: |-
      Joseph McMoneagle advises that remote viewers should never analyse their own material, and that someone else should do the analysis instead.
  - id: 4c9f4fcd-81ef-4ae5-99d3-9b9983a5006b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
