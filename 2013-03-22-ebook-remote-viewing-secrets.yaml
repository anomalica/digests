        name: Joseph McMoneagle
    quote: |-
      Requestor's information: that is name, address, phone numbers, contact information, specific tasking or requirement for information, any guidance sheets, materials, or facsimiles they sent pertinent to the task at hand.
    text: |-
      Joseph McMoneagle recommends that, for an applications-type target, records include the requestor's information: name, address, phone numbers, contact information, specific tasking or requirement, and any guidance sheets or materials sent pertinent to the task.
