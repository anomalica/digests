        name: Remote Viewing
    quote: |-
      Remember, any communications between the customer and the remote viewer is forbidden between the time the targeting materials have been passed to the viewer and the final report is mailed.
    text: |-
      Joseph McMoneagle states that any communication between the customer and the remote viewer is forbidden between the time targeting materials are passed to the viewer and the final report is mailed.
