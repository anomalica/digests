    quote: |-
      A remote viewing protocol is a detailed plan of a scientific experiment, treatment, or procedure. It is the first step and a necessary one in the design of an application.
    text: |-
      A remote viewing protocol is defined as a detailed plan of a scientific experiment, treatment, or procedure, and is the first necessary step in designing an application.
  - id: 3de409a9-70c8-474a-839a-fb45b760eabe
    type: administrative
