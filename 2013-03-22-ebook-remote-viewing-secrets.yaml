    quote: |-
      A rule of thumb that I've always used: if loss of the information could be life-threatening, or be devastating to a company or individual, hand deliver it. If it could really do severe damage, then use registered mail. If it would prove embarrassing to an individual or corporation, then use certified, receipt required; and in all other cases, regular First Class Mail.
    text: |-
      Joseph McMoneagle's rule of thumb for transmitting sensitive information is to hand-deliver it if loss could be life-threatening, use registered mail if loss could cause severe damage, use certified mail with receipt required if loss could prove embarrassing, and otherwise use regular First Class Mail.
