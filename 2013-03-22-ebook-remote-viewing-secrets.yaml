        name: Remote Viewing
    quote: |-
      While there is no data to support it, I believe those who are closest to the center generally make the best remote viewers.
    text: |-
      Joseph McMoneagle believes remote viewers who are closest to a psychological centre between male and female characteristics generally make the best remote viewers, though he notes there is no data to support this.
  - id: 79bda586-f79a-4101-961f-86eb52bf9970
