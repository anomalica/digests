        name: Remote Viewing
    quote: |-
      If I'm the viewer, I will usually do the remote viewing separately from the notebook, only because it is registered and filed separately.
    text: |-
      When Joseph McMoneagle is the viewer in an experiment, he usually performs the remote viewing separately from the notebook because it is registered and filed separately.
  - id: b3deb79c-c725-4bcb-b940-81fbc5a1f455
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
