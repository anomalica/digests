        name: Associative Remote Viewing
    quote: |-
      ASSOCIATIVE REMOTE VIEWING (ARV): Using a targeting methodology which allows the remote viewer to operate one level removed from the actual target, in order to address forced choice type questions (yes/no, go/stop, invest/don't invest, etc.).
    text: |-
      Associative Remote Viewing (ARV) is a targeting methodology which allows the remote viewer to operate one level removed from the actual target, in order to address forced-choice questions such as yes/no, go/stop, or invest/don't invest.
  - id: c7569666-a52b-44ae-96e7-605f664c2465
    type: administrative
