    attribution_in_text: false
    location: ch16:38525-38890
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Over time, with almost any training system that stresses a methodology that's used within an appropriate protocol, they will attain polish and more confidence in their ability, and there will be some improvement. However, that improvement will usually range from minimal to probably less than fifty percent of what they walked in the door with as innate or natural talent.
    text: |-
      Joseph McMoneagle observes that with training over time, remote viewers attain polish and confidence, but the resulting improvement usually ranges from minimal to less than fifty percent above their innate natural talent at the outset.
  - id: 7e3ffe2b-0f41-4f16-be17-5d0797d152e2
    type: measurement
    attestation: first_hand
    speaker:
