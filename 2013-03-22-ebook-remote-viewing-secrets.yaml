        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I recommend this log be a permanently bound book, like a diary, as you will be less inclined to pull pages out of it, or attempt to modify something within it.
    text: |-
      Joseph McMoneagle recommends that a remote viewer's activity log be kept as a permanently bound book, like a diary, to reduce the temptation to remove or alter pages.
  - id: 3eb41d71-0736-41d1-9daa-06f977f5c515
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
