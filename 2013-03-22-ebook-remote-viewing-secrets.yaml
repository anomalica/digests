    refs:
      - id: 567ff590-c418-4cb3-a4d8-2b3256329ca0
        name: Ingo Swann
      - id: 6edf90f7-669b-4f91-9f84-e3af6b54f2fc
        name: SRI International
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      As I understand it, one of the psychics working at the lab, Ingo Swann, suggested the answer. They could use map coordinates to identify a specific location on the ground. Hence was born what is now known as the "coordinate system."
    text: |-
      Ingo Swann, one of the psychics working at SRI International, suggested using map coordinates to identify a specific location as a remote viewing target, giving rise to the coordinate targeting system.
  - id: ebf83b05-7724-4cb4-9838-e3166865d98e
    type: observation
    attestation: first_hand
    speaker:
