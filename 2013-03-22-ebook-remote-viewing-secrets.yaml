        name: Remote Viewing
    quote: |-
      Many don't remember the reasons for using the term remote viewing versus any other nom-de-plume, but I do. It was specifically done to identify something that was far and away removed from any other form of psychic functioning.
    text: |-
      Joseph McMoneagle considers the deliberate use of the term "remote viewing" instead of another name intended specifically to distinguish it from any other form of psychic functioning.
