    quote: |-
      There was comment in the IEEE report that suggested that people who could draw were better remote viewers (". . . .drawings they make are in general more accurate than their verbal description." p. 337).
    text: |-
      The Institute of Electrical and Electronics Engineers (IEEE) report on SRI International's remote viewing research stated that the drawings subjects made were in general more accurate than their verbal descriptions.
