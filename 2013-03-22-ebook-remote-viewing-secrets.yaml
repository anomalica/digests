      - id: 6b16c8b6-53f3-4bb8-8109-a1ebc1636931
        name: The Laboratories for Fundamental Research, Cognitive Sciences Laboratory
    quote: |-
      These five occasions had to do with only two viewers, both of whom worked in the Cognitive Sciences Lab.
    text: |-
      The five occasions on which remote viewing exceeded sixty-five percent reliability, known to Joseph McMoneagle, involved only two viewers, both of whom worked in the Cognitive Sciences Laboratory.
  - id: bd22c46f-adcf-43b4-a267-3ae49e2697da
