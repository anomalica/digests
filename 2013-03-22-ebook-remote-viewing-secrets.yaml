        name: Coordinate Remote Viewing
    quote: |-
      In these examples, the viewer can be told the specific tasking (1-4), as long as the target is being targeted through the outbounder, coordinate, or photographic (sealed envelope) protocols.
    text: |-
      A remote viewer can be given specific tasking instructions for a mobile target as long as the target is targeted through the Outbounder Remote Viewing, Coordinate Remote Viewing, or photographic sealed-envelope protocols.
  - id: 9c40ad44-c104-457d-8271-a2e8fb6fc488
    type: opinion
