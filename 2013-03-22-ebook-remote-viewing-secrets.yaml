    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      All my interim, as well as final reports, will include whatever drawings I have made and a detailed narrative of what I've explored.
    text: |-
      Joseph McMoneagle's interim and final reports include the drawings he has made and a detailed narrative of what he explored.
