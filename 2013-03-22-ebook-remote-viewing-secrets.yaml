        name: Russia, Siberia, Tunguska Basin
    quote: |-
      The event site gives the appearance that a huge explosion occurred which leveled trees for a twenty-mile radius.
    text: |-
      Accounts of the Tunguska event indicate that the explosion levelled trees over a radius of approximately 32 kilometres.
