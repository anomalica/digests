        name: Remote Viewing
    quote: |-
      A moving target therefore almost always requires multiple remote viewings at different times, and you must always use targeting material that is itself moving.
    text: |-
      A moving target for remote viewing almost always requires multiple remote viewings performed at different times.
  - id: 154e2dcc-56e7-4d2d-a641-cd913bcfb5e6
    type: opinion
    attestation: first_hand
    speaker:
