        name: Coordinate Remote Viewing
    quote: |-
      All humor aside, lots of things can be targeted using a coordinate system (sealed envelopes), or photographs illustrating ideas, concepts, plans, thoughts, words, and feelings.
    text: |-
      Ideas, concepts, plans, thoughts, words, and feelings can be targeted using a coordinate system with sealed envelopes, or photographs illustrating them.
  - id: 116fc710-167f-4bf0-a48b-f0a2b26e32e7
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:21917-22139
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Some good examples of things that should not be targeted are inaccessible areas like deep space, mythological beliefs or beings, aliens, or other unknowns that might be inaccessible; or for which there is not or cannot be feedback.
    text: |-
      Inaccessible or unverifiable subjects such as deep space, mythological beliefs or beings, and aliens should not be targeted with remote viewing because there cannot be feedback for them.
  - id: af4616f8-4e75-4737-9238-f04dc5840ed5
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch17:22525-22778
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I'm not dead set against targeting things like the possible sites for downed UFOs, or crop circles, because in reality these events may not even be a direct result of UFOs or aliens; in which case verifiable information could be located, thus providing feedback.
    text: |-
      Joseph McMoneagle is not dead set against targeting things such as possible sites for downed UFOs or crop circles with remote viewing, because verifiable information might still be located as feedback.
  - id: 092a8311-2f51-4b18-97d5-84205c7515a0
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:22970-23291
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      It's just that they should be targeted with extreme care and caution, and one should not make assumptions based on whatever information is provided. In other words, if these things are targeted, the targeting should be left to experts who have garnered sufficient experience with good remote viewing protocol to know the differences.
    text: |-
      Targeting subjects assumed to be alien in origin should be left to experts with sufficient experience in good remote viewing protocol.
  - id: a6927ef2-85b1-4c65-bbf5-9ef3210f9a10
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:23305-23507
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Targeting a remote viewer correctly in our time-space is difficult in the extreme. Unverifiable targeting in what might be seven or more dimensions, or beyond our known space/time, only exacerbates the situation.
    text: |-
      Targeting a remote viewer correctly within our time-space is difficult in the extreme, and unverifiable targeting in what might be seven or more dimensions, or beyond known space/time, exacerbates the situation.
  - id: e1752091-4482-42f5-b6d9-e988732fa0c4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:23934-24188
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There is a great risk that if there is no further information available, the remote viewer will invent the information because you have shown an interest. So, if you ask, don't accept the response until it's been obtained more than once over a period of time.
    text: |-
      When a remote viewer brings up a subject like an idea or concept spontaneously during targeting, the person asking should not accept the response as valid until it has been obtained more than once over a period of time, since there is a risk the viewer will invent information if shown interest.
  - id: 89eda714-6078-4f36-a835-487fda28520b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:25681-25895
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Telling viewers that you are interested in what a targeted person might be thinking, even when they don't know that person, generally won't work, because this forces the viewer into what's called a "forced-choice" scenario.
    text: |-
      When targeting thoughts and feelings, telling a viewer that the interest is in what a targeted person is thinking generally will not work because it forces the viewer into a forced-choice scenario.
  - id: 1eeb6de4-fe3d-4461-85a9-cfd82a5d4f0c
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:25905-26128
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There are only a handful of viewers in the world with sufficient experience to deal with a forced-choice scenario, and all of them have more than twenty years of experience in remote viewing while operating under stringent protocols.
    text: |-
      Only a handful of remote viewers in the world have sufficient experience to deal with a forced-choice scenario, and all of them have more than twenty years of experience in remote viewing operating under stringent protocols.
  - id: 25a92db5-cfbe-4165-9d85-135704407f44
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:26793-26998
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      When you are faced with a forced-choice requirement, e.g., is it yes or is it no, is it white or black, do you go or not go, etc., then Associative Remote Viewing (ARV) is usually relied on to provide the answer.
    text: |-
      Associative Remote Viewing (ARV) is usually relied on to provide an answer when a remote viewing task is a forced-choice requirement such as yes or no.
  - id: 229733fe-d8a9-481f-b5e4-54e88f420b9a
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:27162-27497
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: a042fed1-7c33-4d46-8340-0b2398034858
        name: Front-Loading (remote viewing)
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      First, in order for them to understand that a yes or no answer is required and nothing more, you have to tell them about the problem. This automatically front-loads the viewer with too much information. Too much information drives all the wrong things in the viewer's mind. What they "think" comes into play, instead of what they are "viewing."
    text: |-
      Telling a remote viewer about a forced-choice problem so they understand a yes-or-no answer is required front-loads the viewer with too much information, which drives the viewer's thinking rather than their viewing.
  - id: 768cc61b-6430-48b9-ae1b-629bceee96ed
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:27507-27740
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      The viewer's likes and dislikes, preferences for outcome, and even a reluctance to deliver bad news alters the way they respond. So, you have to separate the viewer from the yes/no response in some way—thus the term "Associative" in ARV.
    text: |-
      In Associative Remote Viewing, the viewer's preferences for an outcome and reluctance to deliver bad news can alter how they respond, which is why the viewer must be separated from the yes/no response.
  - id: c5edb116-f4bb-40f3-8845-ea1260d304b2
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:27746-28079
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      The way it works is identical to the Coordinate protocol, with the following change: First we must know what the specific forced-choice question is and the kind of answers it might require... instead of randomly choosing a single target from a pool of possible targets, two targets are chosen: Target A and Target B.
    text: |-
      Associative Remote Viewing works identically to the Coordinate Remote Viewing protocol, except that two targets, Target A and Target B, are chosen rather than one target being randomly selected.
  - id: e1a6a553-28a5-41b3-9e00-04de4e0f414a
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:28306-28455
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      The same person who would normally determine what the target is does all of this. But remember no information is shared with the viewer, monitor, or Analyst.
    text: |-
      In Associative Remote Viewing, no information about which target represents which forced-choice value is shared with the viewer, monitor, or Analyst.
  - id: c10959b9-38fd-4ab2-b1cf-17c0e97b8ffb
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:28886-29133
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      The viewer is then asked to do a remote viewing one day prior to the day the decision must be made on whether or not to invest—let's assume April 30. The tasking is as follows: "Please describe the picture you will be shown at 09:00 A.M. on June 1st."
    text: |-
      In an Associative Remote Viewing session, the viewer is asked to describe the picture they will be shown at a specific future date and time, prior to the day the forced-choice decision must be made.
  - id: d038f94e-a97a-41f6-8963-5089a20153ca
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:29377-29758
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      The Analyst is then given the viewer's results, along with both pictures, and is asked to report which picture the viewer's comments or drawings most closely resembles... This information is passed back to the person who selected the targets, who reports to the person wanting the information that; "You should invest in the stock."
    text: |-
      In Associative Remote Viewing, the Analyst compares the viewer's results to both target pictures and reports which picture the viewer's comments or drawings most closely resemble, and that resemblance determines the recommended forced-choice answer.
  - id: 3ea19238-61dd-474f-a7de-18ea924cbf86
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:30181-30511
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      If the stock did very well, then the person who determined the targets actually hands the viewer the picture of the mountain at 09:00 A.M. that morning... In no case should the viewer ever know what the other picture was, once he has been shown the one determined by the actual outcome.
    text: |-
      In Associative Remote Viewing, once the actual outcome is known, the viewer is shown the picture corresponding to the correct outcome to determine after the fact whether the viewing was accurate, and the viewer should never be told what the other picture was.
  - id: cece1228-c984-4ee1-a95f-0fb6d99c8eac
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:31027-31166
    refs:
      - id: 122c5474-8b82-401b-ac82-e2a300041b32
        name: 'Remote Viewing Secrets: A Handbook'
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
