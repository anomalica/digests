    quote: |-
      It is true that the greater the methodological requirements you bring into play between yourself and the target, the tougher it is to produce the psychic information... there is a huge possibility for distraction
    text: |-
      Joseph McMoneagle considers that the greater the methodological requirements brought into play between the viewer and the target, the tougher it is to produce psychic information, and that there is a possibility for distraction from those requirements.
