        name: Remote Viewing
    quote: |-
      Women are quicker to point out emotion-generating events within the remote viewing. Men are less inclined to talk about them.
    text: |-
      Joseph McMoneagle observed that women are quicker than men to point out emotion-generating events within a remote viewing session.
  - id: 78d2a89d-d7d1-4f66-b600-c133506723de
    type: opinion
    attestation: first_hand
