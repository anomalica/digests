        name: Remote Viewing
    quote: |-
      In remote viewing, a protocol can have many different methods or techniques based on it, but the protocol itself is never altered.
    text: |-
      In remote viewing, a protocol can have many different methods or techniques based on it, but the protocol itself is never altered.
