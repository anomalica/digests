    text: |-
      Joseph McMoneagle observed a high degree of instability in remote viewing in cases where he noted a severe imbalance of male and female characteristics or attributes in a remote viewer.
  - id: a8d07f0b-2d91-4364-9168-7ffc527fcb31
    type: opinion
    attestation: first_hand
