    refs:
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      This alleged that remote viewers could have memorized (at least unconsciously) all of the major land features that can be identified from topographical maps, by their longitude and latitude gridlines. (I interpret this as a nice way of saying we were all cheating. Which of course we weren't.)
    text: |-
      Sceptics raised the theory that remote viewers using the coordinate system could have unconsciously memorised major land features from topographical maps by their longitude and latitude gridlines, an allegation Joseph McMoneagle interprets as effectively accusing the viewers of cheating.
  - id: 4602e95f-a749-450f-83e2-aa4365e1b70c
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:11119-11361
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      So, to deal with the skeptical issues, the military side of the house did what the military does best—they improvised. Instead of using standard grid coordinates that anyone can read, they used military maps, which use a different coordinate system.
    text: |-
      The military side of Project STARGATE used military maps with a different coordinate system than standard grid coordinates, in which letter and number combinations change based on the specific military map used, in an attempt to counter scepticism about eidetic memory.
  - id: c57b12c7-d9fd-4670-8ecb-1457e1e28a18
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:11790-12135
    refs:
      - id: 5ec014d7-24dd-43a2-afa0-6bac966d33a4
        name: Project STARGATE
      - id: c28e8e30-1748-4e98-9b84-02407a8e1e26
        name: Coordinate Remote Viewing
    quote: |-
      So, at least on the military side, we began putting the real map coordinates inside sealed and opaque envelopes, and then we would write false coordinates on the outside. ... Point being, they really had no actual meaning, other than to identify that day's project.
    text: |-
      On the military side of Project STARGATE, real map coordinates were placed inside sealed and opaque envelopes with false coordinates, lacking degrees, minutes, and seconds, written on the outside to serve only as an identifier for that day's project.
  - id: 6bf6768f-d786-4bc1-bed2-b1455f1fa670
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
