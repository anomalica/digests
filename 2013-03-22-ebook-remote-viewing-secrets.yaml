        name: Front-Loading (remote viewing)
    quote: |-
      3: While learning, never, never, never accept hints about the target, accept any form of front-loading, or permit someone who knows what the target is to be in your presence while you are remote viewing.
    text: |-
      Joseph McMoneagle warns remote viewing trainees never to accept hints about the target, front-loading, or the presence of someone who knows the target while remote viewing.
