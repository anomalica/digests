        name: Front-Loading (remote viewing)
      - id: dc12549e-483b-4e35-afae-6c1f14d9acc0
        name: Blind Targeting
    quote: |-
      Remote viewing protocol requires the remote viewer be blind, or have no other form of access to the target they are being asked to provide information on.
    text: |-
      Joseph McMoneagle states that remote viewing protocol requires the remote viewer to be blind, with no other form of access to the target they are being asked to provide information on.
  - id: 11a7d8df-3d02-4e21-a11a-c5f67bed5c55
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:11509-11659
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Most of the training systems in use today do not recognize the necessity for keeping everyone in proximity to the remote viewing totally blind to the target.
    text: |-
      Joseph McMoneagle argues that most training programs for remote viewing do not keep everyone in proximity to the session totally blind to the target, unlike protocol used in applications.
  - id: aa4c9205-3288-46a7-9da9-bbde47c957c4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch18:12499-12688
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      A sensitive person can then do what is called a cold reading: provide information by "reading" the non-verbal feedback they get from the person who knows what is real or not real about the target.
    text: |-
      Joseph McMoneagle states that violations of blind protocol during remote viewing training can allow a sensitive person to perform a cold reading by picking up non-verbal feedback from someone in the room who knows the target.
  - id: 6fdc3165-1c12-4e1c-b07e-e9d227bf70b5
    type: administrative
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
