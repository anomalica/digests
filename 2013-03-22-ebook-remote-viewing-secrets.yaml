        name: Remote Viewing
    quote: |-
      Those who are analyzing the remote viewing material should be told that there is a possibility that the target is a mobile target. Otherwise, they will assume—because elements of information they might be providing do not seem to be connected, one element to another—that what they perceive must be wrong.
    text: |-
      An Analyst working with remote viewing material should be told when there is a possibility that the target is a mobile target, otherwise unconnected elements of information may be wrongly assumed to be incorrect.
  - id: cfc7833e-a984-4ca4-a6ba-b8f28b7ca910
