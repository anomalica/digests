        name: Joseph McMoneagle
    quote: |-
      Overall, while gifted individuals will usually range around one-half of one percent of any given population, almost anyone (the balance of any given population) can demonstrate fairly consistent results sufficient to show functioning beyond chance.
    text: |-
      Joseph McMoneagle estimates that gifted individuals capable of remote viewing usually make up around one-half of one percent of any given population.
