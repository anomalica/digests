      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I'm referring to a person's ability to think critically and to maintain a healthy skepticism regarding the subject matter.
    text: |-
      Joseph McMoneagle considers a healthy scepticism, rather than belief or disbelief, to be the appropriate mental state for a remote viewer.
  - id: 360f75de-d565-4523-9e7f-55cc1eb43ba9
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
