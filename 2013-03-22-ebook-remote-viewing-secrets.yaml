      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Use viewers that are talented in the visual arts. There seems to be a direct link between someone's ability to clearly visualize and their ability to correctly pass along information they perceive.
    text: |-
      Joseph McMoneagle considers that viewers talented in the visual arts tend to have a better ability to clearly visualise and correctly pass along perceived information.
  - id: e60fce7c-4eed-4e8c-9334-3aec0f97585f
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:40453-40598
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Have the viewer attempt to produce remote viewing information on the same target two or three times but do not let them know that they are doing so.
    text: |-
      Joseph McMoneagle recommends having a remote viewer attempt the same target two or three times without informing them that they are repeating the same target.
  - id: 6f80f969-0c31-40c5-bfb7-4f725440e5a4
    type: opinion
    attestation: first_hand
    speaker:
