    text: |-
      Joseph McMoneagle believes almost everyone who has ever been tested in a laboratory shows some degree of remote viewing ability.
  - id: 9406e0b4-e123-4294-b064-5f986e82a7a8
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:1536-1612
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Anyone can remote view; only about one-half of one percent can do it really well.
    text: |-
      Joseph McMoneagle considers that anyone can remote view, but only about one-half of one percent can do it really well.
  - id: 1bac8f0e-f6fa-4667-b3ac-5f533563ab64
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:1619-1806
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Does training make a difference between just being able to do it and doing it really well? Yes, probably some, but not enough that it's going to push you from one end of the scale to the other.
    text: |-
      Joseph McMoneagle believes training can make some difference to remote viewing ability, but not enough to move a person from being merely able to do it to doing it really well.
  - id: 4959109b-c29d-49ad-b2ca-c4593d6565a4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:2459-2685
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I have always strongly recommended that when it comes to training or learning about remote viewing, you should set your own course and proceed with vigor... it requires practice more than anything else.
    text: |-
      Joseph McMoneagle recommends that anyone learning remote viewing set their own course and proceed with vigour, since mastering it requires practice more than anything else.
  - id: 5834e269-3641-49ad-a796-940fcba4a123
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:2728-2884
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Since it's predominantly talent-driven, much like athletic or musical ability, it will demand training from the standpoint of repetition more than anything else.
    text: |-
      Joseph McMoneagle considers remote viewing ability to be predominantly talent-driven, much like athletic or musical ability, requiring training mainly through repetition.
  - id: 0b91c497-5c58-4ae2-9fb3-5f6433895b25
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:3660-3738
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Remember: think of remote viewing as a martial art. It is a way of, and not an end unto itself.
    text: |-
      Joseph McMoneagle regards remote viewing as a martial art: a way of being, not an end in itself.
  - id: 3162b405-90a9-4ea8-9db3-9c698bac851d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:4417-4741
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Almost without exception, anyone first exposed to remote viewing will be able to generate what are considered major gestalts. This means that once they understand what is expected of them, they should, from time-to-time, be able to tell the differences between islands, mountains, deserts, cities, or other major geographic features.
    text: |-
      Joseph McMoneagle states that almost anyone first exposed to remote viewing will be able to generate major gestalts, meaning they can tell the difference between islands, mountains, deserts, cities, or other major geographic features once they understand what is expected of them.
  - id: 99a72926-e527-499d-8d78-c188b2a83c01
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:4751-4823
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: Initially they will be able to do this about twenty-five percent of the time.
    text: |-
      Joseph McMoneagle states that people newly exposed to remote viewing will initially identify major gestalts about twenty-five percent of the time.
  - id: bcf25a83-d7a8-40a9-961e-9feef1278dc4
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:4829-4976
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Those who seem to be good at it—have demonstrable talent—will probably increase their ability to about fifty percent after sufficient exposure and practice... But, I would plan on months.
    text: |-
      Joseph McMoneagle states that people who demonstrate talent for remote viewing will probably increase their gestalt-identification ability to about fifty percent after sufficient exposure and practice, likely taking months.
  - id: 231fbbca-bf32-44ac-8693-189ca3bca3bd
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:5476-5734
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      The majority of people exposed to remote viewing will produce more sophisticated fragments of information about a target such as sensory values like touch, taste, sound, color, as well as dimensional characteristics, mental perceptions or feelings about the site.
    text: |-
      Joseph McMoneagle states that the majority of people exposed to remote viewing will produce sensory-level information about a target, including touch, taste, sound, colour, and dimensional characteristics or mental perceptions about the site.
  - id: d3665808-b7ad-4d98-9cd3-338078429c3b
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:6414-6640
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I receive dozens of phone calls now on a week-to-week basis from people asking me what they are doing wrong. They've taken one training course or another but can't seem to settle down into a high quality or consistent viewing product.
    text: |-
      Joseph McMoneagle receives dozens of phone calls per week from people asking him what they are doing wrong after taking a remote viewing training course.
  - id: 7e124102-b515-44ec-992e-2b749e99ed47
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:6649-6731
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Well, guess what? You're in the 95th percentile of any randomly selected group of humans.
    text: |-
      Joseph McMoneagle states that people who struggle with consistent, high-quality remote viewing after a training course are still within the 95th percentile of any randomly selected group of humans.
  - id: e88f1608-8dc9-40f7-94d8-b2d302a3059f
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
