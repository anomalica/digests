      Joseph McMoneagle states that Controlled Remote Viewing training was never intended for wholesale use within the general population.
  - id: dafa0a53-65d0-45b6-880a-c036fd531fea
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:51496-51703
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      There is an extant copy of a document available over the Internet that is alleged to be a complete CRV manual, but because it is designed to address training, it does not address any of the issues regarding applications.
    text: |-
      Joseph McMoneagle notes there is a document circulating on the Internet alleged to be a complete Controlled Remote Viewing manual, which addresses training but does not address application issues.
  - id: 6d10622b-891e-406c-bdc0-67c177037a7d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:51717-51845
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      But already there are many who are using it as a guide for applications as well as training, introducing further error into the system.
    text: |-
      Joseph McMoneagle observes that many people are using the circulating Controlled Remote Viewing training document as a guide for applications as well as training, introducing further error into the system.
  - id: 2153db24-e99d-4a0d-9221-902784b2ac78
    type: administrative
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:51854-52296
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
    quote: |-
      The premise behind CRV is that all human beings receive and deal with psychic information on a day-to-day basis. The problem is, in order to recognize psychic information and willfully use it, it has to bubble up to cognition, where we can attempt to control it. This automatically allows false data to be introduced by the conscious mind, which introduces error through fantasy, lack of control, emotional reactions to the base information, etc.
    text: |-
      The premise behind Controlled Remote Viewing is that all human beings receive and deal with psychic information on a day-to-day basis, and that in order to recognise and willfully use this information it must bubble up to cognition where it can be controlled, which allows false data to be introduced by the conscious mind through fantasy, lack of control, or emotional reactions.
  - id: 5c4453c8-8b7d-4807-baec-e992d74ceeef
    type: administrative
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:52340-52634
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
    quote: |-
      The rather draconian CRV training system is designed to teach the unconscious mind to deliver commands to the system without going through the cognition process. In other words, if the target's a mountain, then let the hand be commanded to draw a mountain by the subconscious without cognitive interference.
    text: |-
      The Controlled Remote Viewing training system is designed to teach the unconscious mind to deliver commands to the system without going through the cognition process, so that if the target is a mountain, the hand is commanded to draw a mountain by the subconscious without cognitive interference.
  - id: fa2645cd-2e6e-4982-8d29-c2606c96a8a6
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:52649-52998
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      There probably is merit to this theory, in that one can readily demonstrate that a structured or ordered learning system can be used to entrain the subconscious to respond based on psychic input. But, only under the strictest controls of protocol and only after a long and rigorous training period which takes place outside the protocol controlling process.
    text: |-
      Joseph McMoneagle considers there is probably merit to the theory that a structured or ordered learning system can entrain the subconscious to respond based on psychic input, but only under strict protocol controls and after a long, rigorous training period conducted outside the protocol process.
  - id: 3516e022-85b2-42e0-adf4-f8f81af19391
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:53040-53248
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Testing of individuals who have been formally trained with CRV sometimes shows phenomenal responses in training scenarios outside protocols. But these same people fail miserably when forced to operate within protocols.
    text: |-
      Joseph McMoneagle observes that individuals formally trained in Controlled Remote Viewing sometimes show phenomenal responses in training scenarios outside protocols, but fail miserably when forced to operate within protocols.
  - id: e03a6259-b513-4d13-9523-9d7b06430493
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:53264-53675
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Probably because the person doing the training thoroughly understands the training process, but does not understand the basic or underlying theory behind it. Nor do the trainers take into account that students' actual talent level plays a great deal in how well they will do with any methodology in the first place. The trainers have come to put too much faith in a process, which is little understood from the outset.
    text: |-
      Joseph McMoneagle considers that Controlled Remote Viewing trainers often thoroughly understand the training process but do not understand the basic or underlying theory behind it, and put too much faith in a poorly understood process without accounting for students' actual talent level.
  - id: cb78367b-77ba-4ab9-829c-df52ce82ae27
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch17:53684-54157
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      In my opinion, the CRV process was originally designed to produce almost robotic-like responses from an individual, which could be structured to fall into basic categories or differing degrees of information and complexity. These differing degrees or stages are stacked in a linear fashion, and through rigorous training the student works his or her way down through them over and over again, until they are able to automatically respond within specific categories without thinking.
    text: |-
      Joseph McMoneagle's opinion is that the Controlled Remote Viewing process was originally designed to produce almost robotic-like responses from an individual, structured into basic categories or differing degrees of information and complexity, stacked in a linear fashion the student works through repeatedly during training.
  - id: 34daa420-6560-4b0e-887c-771b722cadd8
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:54167-54373
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      It takes an enormous degree of personal discipline to successfully negotiate the CRV training program, after which the cognitive thought process is supposed to have been minimized within the remote viewing process.
    text: |-
      Joseph McMoneagle states that it takes an enormous degree of personal discipline to successfully complete the Controlled Remote Viewing training programme, after which the cognitive thought process is supposed to be minimised within the remote viewing process.
  - id: 507021cc-a905-4611-943c-986e46492fb0
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:54383-54620
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      It actually does eventually instill a very controlled response structure on the person desiring to be a remote viewer. But, in most cases they still walk away with very little understanding for the appropriate protocols and why they are necessary.
    text: |-
      Joseph McMoneagle notes that Controlled Remote Viewing does instill a very controlled response structure on the person desiring to become a remote viewer, though most trainees walk away with little understanding of appropriate protocols and why they are necessary.
  - id: 05965b45-e79e-403b-a988-4d52d780d7a6
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:54756-54999
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The true answer is, yes. It works just about as well as any other training or remote viewing methodology invented over the years. No better or no worse. Ultimately, it is still driven by the natural or innate talent of the student and not the teacher.
    text: |-
      Joseph McMoneagle considers that Controlled Remote Viewing works about as well as any other remote viewing training methodology invented over the years, being ultimately driven by the natural talent of the student rather than the teacher.
  - id: 80773c1a-b03c-4897-a56d-88361c2aee21
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:55394-55530
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 369c64fb-7864-4b6b-aa6a-01a458bdc880
        name: Tarot Cards
      - id: 6f93513f-15c1-4c31-85a5-61cb1cf6ae64
        name: Channeling
      - id: 7fc2f975-f3f5-4dd7-8075-1e1ec4783c88
        name: Automatic Writing
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      In a number of cases, valuable information has been derived from the reading of tarot cards, channeled materials, automatic writing, or scrying.
    text: |-
      Joseph McMoneagle states that valuable information has, in a number of cases, been derived from Tarot Cards, Channeling, Automatic Writing, and Scrying.
  - id: 7e0f5104-6d83-4f0b-8d3d-eb5c79d2485f
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:55741-56128
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 369c64fb-7864-4b6b-aa6a-01a458bdc880
        name: Tarot Cards
      - id: 6f93513f-15c1-4c31-85a5-61cb1cf6ae64
        name: Channeling
      - id: 7fc2f975-f3f5-4dd7-8075-1e1ec4783c88
        name: Automatic Writing
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      The primary problem lies in the fact that these other methods have not traditionally followed the approved protocols that are used for remote viewing. The psychics or others within the room are seldom blind to the target, there is no effort to control the data once collected, and a lot of the reporting is done in hindsight, without the record keeping that is usually found with remote viewing.
    text: |-
      Joseph McMoneagle considers that Tarot Cards, Channeling, Automatic Writing, and Scrying have not traditionally followed the approved protocols used for remote viewing, in that psychics or others in the room are seldom blind to the target, there is no effort to control collected data, and reporting is often done in hindsight without record-keeping.
  - id: 4369177e-a74c-452c-ab37-ead50be47960
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
