      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      4: Retain your sense of humor. Your subconscious is a trickster, a joker. It will play with you. Enjoy the ride. This is important. When it can deliver information no other way, it will deliver it buried in the humor.
    text: |-
      Joseph McMoneagle advises remote viewers to retain their sense of humour, considering the subconscious a trickster that will sometimes deliver information buried in humour.
  - id: b10df5b7-baa4-4e26-9c8a-62c28f4e60a9
