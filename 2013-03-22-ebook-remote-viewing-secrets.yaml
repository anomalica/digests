    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch16:20017-20122
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      The key to degree of artistic talent required really falls on the term "consistency" more than any other thing.
    text: |-
      Joseph McMoneagle considers artistic consistency more important than artistic talent in a remote viewer's drawings, since a person who consistently places figures correctly at the target has more value than one who draws accurately but places them incorrectly.
  - id: 87cbaa17-8e3d-4685-9f1f-6333cbf66aea
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
