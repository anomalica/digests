        name: Joseph McMoneagle
    quote: |-
      I keep my notebooks labeled sequentially, Book One, Book Two, etc., although I seldom use more than a single book for any specific experiment in which I'm required to keep one.
    text: |-
      Joseph McMoneagle labels his own notebooks sequentially, such as Book One and Book Two, though he seldom uses more than a single book per experiment.
