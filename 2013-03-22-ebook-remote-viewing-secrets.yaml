        name: Remote Viewing
    quote: |-
      When it comes to the science of remote viewing, I would recommend trusting absolutely no information that does not originate from a recognized scientific laboratory or spring from a peer-reviewed and appropriately refereed journal.
    text: |-
      Joseph McMoneagle recommends trusting no information about the science of remote viewing that does not originate from a recognized scientific laboratory or a peer-reviewed, refereed journal.
