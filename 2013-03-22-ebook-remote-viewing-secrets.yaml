      - id: 9a13c0a4-721b-4c18-905b-f46dab747fde
        name: Russia, Siberia, Tunguska Basin
    quote: |-
      let us use what is presumed to be the effects of a huge explosion over an isolated area of frozen tundra in the northern territories of Siberia
    text: |-
      Joseph McMoneagle uses as an illustrative example a huge explosion over an isolated area of frozen tundra in the northern territories of Siberia, Russia.
  - id: ef5c898b-4428-4a03-881a-523555f9d726
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:42027-42189
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 9a13c0a4-721b-4c18-905b-f46dab747fde
        name: Russia, Siberia, Tunguska Basin
    quote: |-
      We know it probably occurred sometime within a given 30-day period of a specific date, because of all the rumors coming out of the region, carried by hunters and woodsmen
    text: |-
      In the Tunguska Basin example, local hunters and woodsmen reported rumours indicating the explosion occurred within a given 30-day window.
  - id: 4cc9644b-c610-4443-a4c5-2e2a99986e78
    type: testimony
    attestation: second_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: named
      origin: local residents of the Tunguska Basin area
      relay:
        - reported to Joseph McMoneagle
    attribution_in_text: false
    location: ch17:42332-42420
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 9a13c0a4-721b-4c18-905b-f46dab747fde
        name: Russia, Siberia, Tunguska Basin
    quote: |-
      They have vague recollections of a huge bang followed by strange lights in the sky that night.
    text: |-
      People living near the Tunguska Basin had vague recollections of a huge bang followed by strange lights in the sky on the night of the event.
  - id: 3c36d4aa-f7a6-4ce8-9cea-2183325540b1
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:42427-42599
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 9a13c0a4-721b-4c18-905b-f46dab747fde
        name: Russia, Siberia, Tunguska Basin
    quote: |-
      We actually see on the ground that there are shattered trees three feet in diameter, and they lay outward in what appears to be a blast effect radius from a center or core location.
    text: |-
      At the Tunguska Basin site, shattered trees approximately one metre in diameter were found lying outward in what appeared to be a blast-effect radius from a central location.
  - id: 3d68d2d1-484a-4253-8ccf-fe4a13cbe63a
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:42715-43184
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      We want to use a remote viewer to actually pinpoint the specific date and, if possible, a time for this explosion. We can do this by narrowing the event down to the approximate 72-hour window we've developed from talks with the locals... we simply target the viewer on "center of mass," or the core of the event location. We can do that by providing specific coordinates placed within a sealed envelope.
    text: |-
      Joseph McMoneagle notes that a remote viewer can be tasked to pinpoint the specific date and time of an uncertain event by narrowing the window down to an approximate 72-hour window and targeting on 'center of mass', or the core of the event location, using specific coordinates in a sealed envelope.
  - id: e8155748-0d7a-4f9b-b03e-27ea3ce29c3c
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:44048-44309
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Ask the viewer to provide us with a general description of the location within the envelope. If the viewer indicates that a major event has occurred, then walk them backward in four-hour increments. If no event has occurred, then walk them forward in four-hour increments.
    text: |-
      Joseph McMoneagle describes a methodology in which a monitor asks the viewer to describe the event location within a sealed envelope, then walks the viewer backward in four-hour increments if a major event is indicated, or forward in four-hour increments if no event is indicated.
  - id: dbcb3aee-227d-466b-ba15-dcdddb55c390
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:44323-44451
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      The question inside the envelope should read: "Describe the event that occurred before or after 12:00 Noon (and pick the middle date).
    text: |-
      Joseph McMoneagle describes a target question phrased as: 'Describe the event that occurred before or after 12:00 Noon' using a picked middle date, as part of a time-narrowing remote viewing protocol.
  - id: e195032b-c72b-4984-af73-de4469bb5523
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:44617-44961
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Since they were asked to describe what's identified as a location first, then if they describe the location correctly but not the event, we know they are being accurate but have to move forward in time. If they describe the location and appear to be reporting on the effects from the event, then we know they have to be moved backward in time... we've allowed the viewer to be accurate in a double blind fashion first.
    text: |-
      Joseph McMoneagle explains that once a viewer accurately describes a location without an event, or describes the location and reports effects consistent with an event, the monitor can determine whether to move the viewer forward or backward in time, having already validated accuracy in a double-blind fashion.
  - id: 4f40be42-e35d-47f3-85dd-c875dca76eff
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:45329-45566
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      If you need better accuracy than four hours, you can re-target later using the same method, moving forward or backward in 30 minute epochs. Once a time has been well established, you can then re-target to get more detail about the event itself
    text: |-
      Joseph McMoneagle notes that once time has been well established via four-hour increments, re-targeting can refine accuracy further using 30-minute increments, and further re-targeting can then be used to get more detail about the event itself.
  - id: 1801581c-9cfe-4b24-8c17-45d14e0e83e2
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
