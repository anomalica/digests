    quote: |-
      But as almost anyone can be a black belt in karate, the same holds true for RV'do. All it really takes is a strong desire to succeed, sustained over a fairly long learning curve.
    text: |-
      Joseph McMoneagle compares the achievability of RV'DO to achieving a black belt in karate, stating both require a strong desire to succeed sustained over a fairly long learning curve.
