        name: Remote Viewing
    quote: |-
      In research circumstances where a photograph may have been sealed within the envelope, this photograph is only provided to the viewer for feedback after the judging has been accomplished. This precludes an information leakage path that could exist between the person who is evaluating the remote viewing and the remote viewing itself.
    text: |-
      In remote viewing research where a photograph is sealed within a targeting envelope, the photograph is only provided to the viewer for feedback after judging of the remote viewing session has been completed, to prevent an information leakage path between the person evaluating the session and the viewing itself.
  - id: ab8d3c28-8c6d-493a-90f4-2b77842ae368
    type: administrative
    provenance_chain:
