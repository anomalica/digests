        name: Remote Viewing
    quote: |-
      Most of the targets I've selected I have either photographed myself, or have obtained by looking through thousands of copyright-free photographs available through commercial sources.
    text: |-
      Joseph McMoneagle selected most of his practice targets either by photographing them himself or by obtaining copyright-free photographs from commercial sources.
  - id: 5f733886-d9bf-4e14-8cea-e7f9511dcb61
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
