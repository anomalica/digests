        name: Joseph McMoneagle
    quote: |-
      Everyone who participated in the applications effort should be noted. Sometimes this proves of value when you need to later check a point, or try to recreate the circumstances within which something was determined.
    text: |-
      Joseph McMoneagle recommends that everyone who participated in an applications effort be noted, since this can help later in checking a point or recreating the circumstances.
