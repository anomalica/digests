    text: |-
      At the beginning of Project STARGATE, all of the methods for evaluating or judging remote viewing material were tuned to drawings.
  - id: 0d74e658-0eea-4057-a50b-0441d300dd4d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
