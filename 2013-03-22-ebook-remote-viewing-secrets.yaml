        name: Remote Viewing
    quote: |-
      Therefore it would be a good idea to use a photograph of the victim as targeting material and not something that might have been there at the time of the kidnap, like a victim's car or purse.
    text: |-
      For a kidnap victim who is moved frequently, a photograph of the victim should be used as remote viewing targeting material rather than an object like the victim's car or purse.
