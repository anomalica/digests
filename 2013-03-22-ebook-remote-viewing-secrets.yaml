    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      In most cases, I will use a considerable number of footnotes to try to explain why or how something might have been entering my consciousness.
    text: |-
      Joseph McMoneagle uses a considerable number of footnotes in his reports to explain why or how something might have entered his consciousness during a remote viewing session.
  - id: ba122b07-7ad1-4c00-a1e0-bd8c5e2cf508
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch24:9797-10039
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      I try to keep the records of what I do for the same time limit as required for taxes—a period of six to seven years. After that, I glean whatever I might feel is important from them from a scientific or historical standpoint and then destroy them.
    text: |-
      Joseph McMoneagle keeps records of his remote viewing work for the same time limit required for taxes, a period of six to seven years, after which he extracts what he considers scientifically or historically important and destroys the rest.
  - id: 3b84e823-d129-4908-b9a2-7ac8e65ac359
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch24:10260-10461
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Use the alpha/numeric target identification-number to cross-correlate all materials, but split the materials up into different files. Maintain the different files in different file cabinets, safes, or locations.
    text: |-
      Joseph McMoneagle recommends using an alphanumeric target identification number to cross-correlate all materials while splitting the materials into different files kept in different file cabinets, safes, or locations.
  - id: 39432b98-9b59-46c7-9b3e-7ef7cff43422
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch24:10476-10669
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Shred or otherwise make unreadable, all materials, storage media, or other sources of information identifiably connected to a specific customer, which you are going to throw away, or otherwise discard.
    text: |-
      Joseph McMoneagle recommends shredding or otherwise rendering unreadable all materials connected to a specific customer before discarding them.
  - id: dad1da57-698b-45f2-a556-3ec1d506acc1
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
