        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      2: Always keep your own notebook about what you are thinking and why you are thinking it, with the goal of learning something about your method of internal cognitive processing.
    text: |-
      Joseph McMoneagle advises remote viewers to keep a notebook recording their thoughts and reasoning during sessions, to learn about their own method of internal cognitive processing.
  - id: c20aa2f7-b4cb-4e99-ad3e-1dfc631ec606
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
