      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Actual targeting information that was used to point the viewer in the right direction. How it was given to the viewer, specifically what was said or presented, any questions or inquiries that might have been shared with the viewer while s/he was working on the target.
    text: |-
      Joseph McMoneagle recommends recording the actual targeting information used to point the viewer, including how and what was said or presented, and any questions shared with the viewer during the task.
