    quote: |-
      In remote viewing, using a method without concern for protocol can quickly lead to exaggerated, artificial, or misleading results.
    text: |-
      Joseph McMoneagle considers that using a method in remote viewing without concern for protocol can quickly lead to exaggerated, artificial, or misleading results.
