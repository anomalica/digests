        name: Remote Viewing
    quote: |-
      Since I do not teach remote viewing myself, I've been asked many times over the years to recommend someone who does.
    text: Joseph McMoneagle does not teach remote viewing himself.
  - id: 2a9014ae-f6a1-40e1-a790-fe4e90270c36
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
