        name: Joseph McMoneagle
    quote: |-
      In either case, where you position yourself philosophically or theologically determines your acceptance of how or why some things happen.
    text: |-
      Joseph McMoneagle believes that where a person positions themselves philosophically or theologically determines their acceptance of how or why paranormal things happen.
  - id: f8428f11-8f1b-4346-aa4f-c43f984b255b
    type: opinion
    attestation: first_hand
    speaker:
