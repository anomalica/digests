      This is a form of remote viewing that is used to answer binary questions, like; "Yes or No", "Buy or Sell", "Stop or Go."
    text: |-
      Associative Remote Viewing is a form of remote viewing used to answer binary questions such as yes-or-no, buy-or-sell, or stop-or-go decisions.
