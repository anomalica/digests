      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Viewers should be encouraged to use whatever visual method is necessary to present the best possible picture of what it is they might perceive. This would include all art forms and mediums of expression: clay, drawing, or even construction from wood, metals, and plastics, pre-formed or otherwise.
    text: |-
      Joseph McMoneagle recommends that remote viewers be encouraged to use whatever visual method is necessary, including drawing, clay, or construction from wood, metals, and plastics, to present the best possible picture of what they perceive.
  - id: 545ebdf5-1b21-4c2e-a9d6-d6bcea7db997
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:41296-41402
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      One of the hardest types of targets is an event for which the actual event time or date has not been well-established.
    text: |-
      Joseph McMoneagle considers event-related targets, where the actual event time or date has not been well-established, among the hardest types of remote viewing targets.
  - id: db4421b5-b380-4a87-a67c-a709799304c7
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:41415-41557
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      Many feel that some hint as to what the actual event might be needs to be passed along to the viewer. This is absolutely not what you want to do.
    text: |-
      Joseph McMoneagle advises against passing any hint of what the actual event might be to a remote viewer when the event's date and time are not well-established.
  - id: d68dfb29-6cd1-4d5f-b631-41ce524ab840
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:41882-42018
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
