        name: Remote Viewing
    quote: |-
      Clock speed is not material to the efficacy of using remote viewing. What this means is any derivative or function of time can be used.
    text: |-
      Clock speed is not material to the efficacy of remote viewing, meaning any derivative or function of time can be used when tasking a viewer.
  - id: 102b7e7f-f680-409a-bf02-ab63d9f62b0d
