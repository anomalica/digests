    quote: 'This targeting material should be referred to as: "Sealed envelope: A001389"'
    text: |-
      In a formal remote viewing lab report, the specific targeting material used in an example session is referred to as "Sealed envelope: A001389".
  - id: 5994da18-3d63-4ab7-9e73-61bb0c16a68e
    type: observation
    provenance_chain:
      origin_kind: unattributed
      origin: narration
