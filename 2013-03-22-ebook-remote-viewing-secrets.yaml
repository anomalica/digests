    text: |-
      Joseph McMoneagle considers Controlled Remote Viewing the most commonly referred to or generally accepted method of remote viewing, primarily due to the perceived ease of training and the number of people who claim expertise in teaching it.
  - id: 79e73e18-16d6-4107-9cc1-3bb298e42590
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch17:50755-51038
    refs:
      - id: b83494b0-eac6-4b7c-8852-2c000d801d54
        name: Controlled Remote Viewing (CRV)
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Those who are trained in it are not automatically vaccinated with all the knowledge they need to apply it properly. Something as simple as following an appropriate protocol in setting up the target, as in protocols for proper target handling, is little understood or even unknown to many.
    text: |-
      Joseph McMoneagle considers that those trained in Controlled Remote Viewing are not automatically equipped with all the knowledge needed to apply it properly, including protocols for proper target handling.
  - id: 461ebe13-3d8e-42d6-a107-6174145dbe13
    type: administrative
