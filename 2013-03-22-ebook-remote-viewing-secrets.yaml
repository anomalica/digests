    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      On completion of a project, all materials that are no longer necessary to your own operation should either be returned to the customer through secure means, or should (with their permission) be destroyed.
    text: |-
      Joseph McMoneagle recommends that on completion of a project, materials no longer needed should be returned to the customer through secure means or destroyed with the customer's permission.
