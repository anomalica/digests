        name: Coordinate Remote Viewing
    quote: |-
      Coordinate targets are where information written on the sealed envelope is used to identify the specific target of interest. It can be alpha or numeric, or a combination of both. This identifying data has no relationship to what is contained within the envelope.
    text: |-
      In Coordinate Remote Viewing, coordinate targets use information written on a sealed envelope, which can be alpha or numeric or a combination, to identify the specific target of interest, with no relationship between the identifying data and the envelope's contents.
