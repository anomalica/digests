        name: Remote Viewing
    quote: |-
      If the protocol is an acceptable remote viewing protocol, then, whether the information produced is by looking at a symbol on a deck of cards and psychically interpreting it, or it is produced through the rigors of CRV is not material. The base requirements have been met from a scientific standpoint, so the question is moot.
    text: |-
      Joseph McMoneagle considers that as long as the base requirements of an acceptable remote viewing protocol are met, the specific method of producing information (such as interpreting a symbol on a card versus the rigours of Controlled Remote Viewing) is immaterial from a scientific standpoint.
  - id: ab57b8d4-aa09-44fe-b7cf-f44cb9eeeda6
    type: opinion
