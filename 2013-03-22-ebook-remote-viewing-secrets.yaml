        name: Remote Viewing
    quote: |-
      When a viewer tastes the target, it is only for a few nanoseconds and then contact is broken. The rest of the exercise is internalized processing, or determining when strawberry is important and when it is not.
    text: |-
      Joseph McMoneagle describes contact with a remote viewing target as occurring for only a few nanoseconds before being broken, with the remainder of the exercise being internalised processing.
