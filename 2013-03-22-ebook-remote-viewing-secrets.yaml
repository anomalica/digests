        name: Remote Viewing
    quote: |-
      Humans are cognitive beings, and nothing reaches our waking mind that has not been processed.
    text: |-
      Joseph McMoneagle believes that humans, as cognitive beings, cannot receive remote viewing information at the waking mind without it having been processed.
  - id: 9a87c496-b4c7-4a33-a496-5478adebac74
    type: opinion
