        name: Remote Viewing
    quote: |-
      And as soon as you begin to overlay the mind with forced choice, you are simply reversing the system. You are putting the processing at the fore instead of the end, reducing the breadth of the response parameters, and eliminating unconscious spontaneity.
    text: |-
      Joseph McMoneagle considers that forced-choice training of the mind reduces the breadth of remote viewing response parameters and eliminates unconscious spontaneity.
  - id: 61f1ed01-6d72-4f44-81be-e35721b46c44
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
