      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      3: Initially try and stick with major gestalts, slowly working your way into more detail. Open to whatever your subconscious wants to share with you, when it wants to share it.
    text: |-
      Joseph McMoneagle advises new remote viewers to initially stick with major gestalts and slowly work into more detail, opening to whatever the subconscious wants to share.
  - id: a940a9de-298d-4e86-a819-15151e3c41b5
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
