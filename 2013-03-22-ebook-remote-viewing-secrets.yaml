        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I've spent twenty-one years developing a processing model in my head that seems to work for me about as well as anything might.
    text: |-
      Joseph McMoneagle spent twenty-one years developing a mental processing model for remote viewing.
  - id: 9cee51ad-0468-4146-91d6-a7d1dd2d06b2
    type: testimony
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
