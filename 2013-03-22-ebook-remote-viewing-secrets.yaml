        name: Joseph McMoneagle
    quote: |-
      I've been operating in a science environment for over fourteen years and I can tell you that as hard as one might try to insure that everything goes about as near perfect as possible, things always go wrong.
    text: |-
      Joseph McMoneagle has been operating in a science environment for over fourteen years.
  - id: cfb4d608-9c74-44aa-be1a-6ff4cc03485c
