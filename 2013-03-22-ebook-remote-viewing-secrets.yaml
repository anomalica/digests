        name: Remote Viewing
    quote: |-
      Since it is scientific, it is usually designed and tested within a lab, usually through consensus of researchers... It is then often tested again at other labs with other subjects and replicated before it is used in an application format.
    text: |-
      A remote viewing protocol is designed and tested within a lab through consensus of researchers, then opened to review, evaluation, and publication before being retested and replicated at other labs before use in an application format.
  - id: 56c4ff49-eedb-41dd-8b42-ae2b59d01dab
