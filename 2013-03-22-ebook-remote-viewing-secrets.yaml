      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      When someone is first exposed to remote viewing, where s/he is philosophically on that day and at that time, determines his or her baseline. All changes that occur from that point forward are built upon that baseline.
    text: |-
      Joseph McMoneagle believes that when someone is first exposed to remote viewing, their philosophical position at that time determines their baseline, upon which all subsequent changes are built.
  - id: d5261066-64ae-4b41-8251-a0557c3545a7
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:30126-30429
    refs:
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      There are two kinds of dowsing equipment that are used while remote viewing. One is used in lieu of the Associative Remote Viewing (ARV) method for responding to binary type questions, like "YES" and "NO,” “UP" and "DOWN,” “FORWARD" and "BACKWARD," etc., and one is used for working with locations on a map.
    text: |-
      There are two kinds of dowsing equipment used while remote viewing: one used in lieu of the Associative Remote Viewing (ARV) method for responding to binary questions, and one used for working with locations on a map.
  - id: e4ed6576-3b20-4f13-b6ce-3b351e692213
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:30662-30799
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      The least complicated instrument is the pendulum. You can make a pendulum by tying almost any small weighted object to a short string or cord.
    text: |-
      Joseph McMoneagle recommends that a dowsing pendulum can be made by tying a small weighted object to a short string or cord.
  - id: 213a9c08-bd88-4302-a65b-a99b88939513
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:30805-30968
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      I have found that the finer string or fishing line is best, and using a smaller but heavier weighted object does well, especially where there might be a breeze or wind.
    text: |-
      Joseph McMoneagle has found that fine string or fishing line works best for a dowsing pendulum, and that using a smaller but heavier weighted object performs well, especially where there might be a breeze or wind.
  - id: 7ab3386e-6265-4100-a361-7a64cc1d2307
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:31181-31412
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      I've included pictures of my own pendulum (figure 2a). It also has a small recess under the eye which you can fill with a small bit of whatever you might be looking for, such as gold, water, or threads from someone's clothing (fig 2b).
    text: |-
      Joseph McMoneagle's own dowsing pendulum has a small recess under the eye that can be filled with a small item related to what is being searched for, such as gold, water, or threads from someone's clothing.
  - id: 1c34bb8f-7a54-4e83-bfde-60da59668ea8
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:31427-31580
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      The idea is to hang the pendulum from a short string and then allow your subconscious to control the action of the pendulum while focusing on a specific question.
    text: |-
      Joseph McMoneagle explains that the dowsing pendulum method involves hanging the pendulum from a short string over a map and allowing the subconscious to control its motion while focusing on a specific question.
  - id: e9ee97f3-8bde-40f2-a559-d88e6a3aa95b
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:31939-32208
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      As the pendulum crosses areas of the map in which the ring is not located, it will produce a simple motion that will not change... When you hit the place on the map in which the ring is located, it will suddenly change directions.
    text: |-
      Joseph McMoneagle explains that as a dowsing pendulum crosses areas of a map where a sought object is not located it produces a simple, unchanging motion, and when it crosses the correct location it suddenly changes direction.
  - id: fc943a1f-4650-4b4e-8593-c6cd5ba00ef2
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:32464-32644
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      A simple way to do that would be to hold the pendulum over a blank sheet of paper and simply state, "This is yes," and "This is no." The pendulum should react differently for each statement.
    text: |-
      Joseph McMoneagle recommends calibrating a dowsing pendulum before use by holding it over a blank sheet of paper and stating "This is yes" and "This is no" to observe its differing reactions.
  - id: e79ff038-aea8-4c25-9d3e-c9f3c4661a5d
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:33253-33553
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
      - id: 7c287527-8d72-41d4-adec-5dcf0ce9ad1d
        name: Associative Remote Viewing
    quote: |-
      If you don't have time to set up an ARV protocol to pursue the binary answer to something, you can use your pendulum... I would only use the pendulum for this if I didn't have time to pursue an answer through the use of ARV.
    text: |-
      Joseph McMoneagle recommends using a dowsing pendulum to answer binary questions if there is no time to set up an Associative Remote Viewing (ARV) protocol.
  - id: e86de1bb-2509-4c75-b71a-8cb5b17911e4
    type: opinion
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:33610-33935
    refs:
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      Another simple tool that can be used for dowsing is a straight edge and pencil. These are used for determining a point on a map, grid, or diagram... In order to find a specific point you need to define a horizontal and vertical line. Where they cross will be the point of interest.
    text: |-
      A straight edge and pencil is another dowsing tool used for determining a point on a map, grid, or diagram, by defining a horizontal and vertical line whose crossing point is the point of interest.
  - id: a71342c7-62cc-40e8-b925-ec3ffacc12ef
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:34792-35221
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      There is a shortcut to the above method that does not require a pendulum. You simply give yourself a command to not blink your eyes unless the straight edge is directly over the correct site... You simply try not to blink while sliding the straight edge horizontally or vertically across the map. When you do blink, that is the point at which you should draw your line.
    text: |-
      Joseph McMoneagle describes a blinking method of dowsing that does not require a pendulum, where the practitioner gives themselves a command not to blink unless a straight edge is directly over the correct site while sliding it across a map.
  - id: 828d6cc3-7a2c-4636-9fb9-e2beffb5bcd6
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch25:35354-35693
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: fa84099e-5c8b-4e71-9a62-4bfb8f85c6d8
        name: Dowsing
    quote: |-
      For example, while talking with a stranger you've never met, give yourself the command, "Blink when this person is lying." Or, while at a crime scene if you are wondering where to look for the most important evidence, you might scan the surroundings while at the same time giving yourself the command, "Blink when I'm looking in the right direction."
    text: |-
      Joseph McMoneagle suggests the blinking dowsing method can be used discreetly, such as giving oneself the command "Blink when this person is lying" while talking with a stranger, or "Blink when I'm looking in the right direction" at a crime scene.
  - id: ea57592b-fba8-4945-aaee-ac951818c87c
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:35874-36030
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      Scrying is another way of saying "crystal gazing." It is a way of divining distant, past, or future events based on visions seen in a polished-ball of rock crystal.
    text: |-
      Scrying, also known as crystal gazing, is a way of divining distant, past, or future events based on visions seen in a polished ball of rock crystal.
  - id: 86166b43-421a-42d5-9d20-bee9d767a308
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:36039-36146
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      Divination can also be done by staring at reflections on water or oil, or by peering into a polished metal surface.
    text: |-
      Divination can also be done by staring at reflections on water or oil, or by peering into a polished metal surface.
  - id: 66fadb03-4489-42ce-a6a7-997ea74e7169
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:36155-36287
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      Early divination was done with round, polished metal surfaces in silver or gold, and by peering into the polished sides of precious stones.
    text: |-
      Early divination was done with round, polished metal surfaces made of silver or gold, and by peering into the polished sides of precious stones.
  - id: e54917a3-c299-4a79-a29f-5894874b55b5
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:36295-36410
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      It has existed since around the fifth century but has historically been condemned by the Church as the work of the devil.
    text: |-
      Scrying has existed since around the fifth century but has historically been condemned by the Church as the work of the devil.
  - id: a771c6f1-23d3-4dba-a6cb-e9d9ff207020
    type: observation
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
    location: ch25:36418-36703
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      The way it works is a person usually stares directly into the crystal ball or reflective surface, concentrating for an extended period of time. Eventually, a sort of misting will begin to appear much like a cloud of fog. It's within this mist or fog, that visions are presented to the scryer.
    text: |-
      In scrying, a person stares directly into the crystal ball or reflective surface while concentrating for an extended period, until a misting resembling a cloud of fog begins to appear, within which visions are presented to the scryer.
  - id: e3c64303-003c-431d-b9cc-3377b231c0f6
    type: hearsay
    attestation: second_hand
    provenance_chain:
      origin_kind: anonymous
      origin: scryers described by the source as experts in the practice
    attribution_in_text: false
    location: ch25:37544-37762
    refs:
      - id: be0bcb72-a3be-4817-a288-87a55596ca00
        name: Scrying
    quote: |-
      Expert scryers say the information really isn't in the medium of course. It lies within the mind of the individual. The fog or mist is actually created by the mind and occurs somewhere between the crystal ball and the scryer.
    text: |-
      Expert scryers say the information presented during scrying is not in the medium itself, but lies within the mind of the individual, with the fog or mist created by the mind between the crystal ball and the scryer.
  - id: 806fe2d9-d84c-472a-b256-d76c5eaa0274
    type: opinion
    provenance_chain:
      origin_kind: unattributed
    attribution_in_text: false
