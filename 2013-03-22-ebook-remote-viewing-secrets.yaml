      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch27:8265-8655
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 6edf90f7-669b-4f91-9f84-e3af6b54f2fc
        name: SRI International
      - id: d7b2607a-6412-444d-afc6-4f33dc675e22
        name: Science Applications International Corporation, Inc.
      - id: 6b16c8b6-53f3-4bb8-8109-a1ebc1636931
        name: The Laboratories for Fundamental Research, Cognitive Sciences Laboratory
    quote: |-
      Over the course of their careers, every exceptional viewer studied in the cognitive sciences labs at SRI-International (SRI-I) and Science Applications International Corporation (SAIC) have essentially produced a near flat-line in terms of ability... They are as good walking in the door as they are when they exit.
    text: |-
      Joseph McMoneagle observed that over the course of their careers, every exceptional viewer studied at the SRI International Cognitive Sciences Laboratory and Science Applications International Corporation, Inc. essentially produced a near flat-line in ability, with the best remote viewers performing about as well at the start of their careers as at the end.
  - id: 2bfbeea0-0329-44ab-b71a-7d77cf9e6bda
    type: testimony
    attestation: first_hand
    speaker:
