    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Computer records should always be backed up and the backup copies should be maintained in a separate facility from where the computers are located. This probably should be a safety deposit box at a bank, or within a fire-rated safe somewhere off premises.
    text: |-
      Joseph McMoneagle recommends that computer records be backed up with copies stored in a separate facility from the computers, such as a bank safety deposit box or an off-premises fire-rated safe.
  - id: cb349a3e-5911-4e87-b298-9c0bd8080690
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch24:4834-4949
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Remember, this is a permanent record, so do not rotate the tapes, as you might do with operational software backup tapes.
    text: |-
      Joseph McMoneagle recommends against rotating permanent-record backup tapes the way one would rotate operational software backup tapes.
  - id: d33868ab-7a2a-49f2-a295-0570b0b04683
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: true
    location: ch24:4957-5251
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
    quote: |-
      Computer files should probably be copied and copies maintained by both the originator as well as a witness. The witness should not allow access to their copies of the tapes, except when they may be required in a court of law, or to validate or confirm material and statements in support of the research.
    text: |-
      Joseph McMoneagle recommends that computer files be copied and maintained by both the originator and a witness, with the witness denied access to their copies except for court proceedings or to validate research material.
  - id: 1851acc8-632b-4595-9d97-d0d5629f335e
    type: observation
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
