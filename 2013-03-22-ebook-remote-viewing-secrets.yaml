    quote: |-
      The point here is that the appropriate protocol seems to put all the right puzzle pieces in the right place to allow psychic functioning to take place.
    text: |-
      Joseph McMoneagle's view is that the appropriate remote viewing protocol, rather than the specific method used, is what allows psychic functioning to take place.
