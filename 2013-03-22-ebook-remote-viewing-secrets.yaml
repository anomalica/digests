      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I then "re-taste" the target by opening to it again. I view each re-taste as different from any other... I do this very rapidly three or four times. This begins to produce a feeling regarding the target, an overall concept—what we call a gestalt.
    text: |-
      Joseph McMoneagle's remote viewing processing method involves repeatedly 're-tasting' the target by opening to it again multiple times in rapid succession to build a gestalt.
  - id: 014176bd-419a-4208-ba2c-3e5b37fca2d0
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch18:39142-39256
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I myself am usually totally surprised by the end result. The more surprised I am, the better I know it's going to be.
    text: |-
      Joseph McMoneagle states he is usually totally surprised by the end result of his own remote viewing sessions, and considers greater surprise a sign of better information.
  - id: 974c2b46-21e2-4c9e-81d9-f023ade8c547
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
    location: ch18:39261-39464
    refs:
      - id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
        name: Joseph McMoneagle
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      A lot of times I'm asked if I can tell the difference between good and bad remote viewing. The answer is no. However, if I'm totally surprised by the result, I can almost assure you that it will be good information.
    text: |-
      Joseph McMoneagle states he cannot tell the difference between good and bad remote viewing while producing it, but that being totally surprised by a result is a strong indicator that the information will be good.
  - id: 05b35067-e5d6-43b7-a6cb-7678677c91d9
    type: opinion
    attestation: first_hand
    speaker:
      id: 9caa600b-5ac0-4ec4-b956-10e029417fc8
      name: Joseph McMoneagle
    provenance_chain:
      origin_kind: speaker
      origin: Joseph McMoneagle
    attribution_in_text: false
