    quote: |-
      A method or technique is a systematic procedure or mode of inquiry employed by or proper to a particular discipline or art. In remote viewing, these are always applied within the framework of a protocol.
    text: |-
      A method or technique is a systematic procedure or mode of inquiry employed by or proper to a particular discipline or art, and in remote viewing these are always applied within the framework of a protocol.
