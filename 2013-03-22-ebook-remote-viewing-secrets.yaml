      - id: 9a13c0a4-721b-4c18-905b-f46dab747fde
        name: Russia, Siberia, Tunguska Basin
      - id: 2bc8713a-f7be-4dcc-b083-79e86e86d539
        name: Remote Viewing
    quote: |-
      I would suggest based on remote viewing, that it was actually a fairly large meteorite traveling at a high rate of speed (probably in excess of 60k feet per second), that struck the outer atmosphere layers nearly perpendicular to the bow wave of the earth, dissolving in a single focused cone of energy over the Tunguska Basin, creating damage like a shaped charge would do on the exterior of armor plating.
    text: |-
      Based on remote viewing, Joseph McMoneagle suggests the Tunguska event was caused by a fairly large meteorite travelling at a high speed of roughly 18 kilometres per second that struck the outer atmosphere layers nearly perpendicular to the bow wave of the Earth, dissolving in a single focused cone of energy over the Tunguska Basin and creating damage like a shaped charge would on the exterior of armour plating.
  - id: 949a63a0-1576-4962-a4ea-626c626b9654
