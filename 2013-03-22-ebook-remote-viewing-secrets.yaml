        name: Remote Viewing
    quote: |-
      6: Don't make unsubstantiated claims. It does severe damage to the field and will quickly establish you as a fool.
    text: |-
      Joseph McMoneagle advises against making unsubstantiated claims in remote viewing, considering it damaging to the field and something that will establish the claimant as a fool.
