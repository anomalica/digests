    quote: |-
      In my observation, over twenty-one years, some very good psychic data has been provided by card readers, channelers, automatic writers, and even the momentarily focused skeptic while operating within an appropriate remote viewing protocol.
    text: |-
      Over twenty-one years of observation, Joseph McMoneagle found that good psychic data has been provided by card readers, channelers, automatic writers, and even momentarily focused skeptics while operating within an appropriate remote viewing protocol.
