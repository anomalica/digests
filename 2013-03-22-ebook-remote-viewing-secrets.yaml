        name: Outbounder Remote Viewing
    quote: |-
      Obviously these preclude the use of the Outbounder protocol, unless possibly you are targeting someone who was supposedly abducted by aliens and you have a specific date, time, and place for their alleged abduction
    text: Non-physical targets preclude use of the Outbounder Remote Viewing protocol.
  - id: 5ad48822-f160-42c5-b4f1-867dffe2f460
    type: opinion
    attestation: first_hand
    speaker:
