        name: Second Body
    quote: |-
      It works by what and of whom you think. Let one small stray thought emerge dominantly for just one microsecond, and your course is deviated.
    text: |-
      Robert Monroe found that the automatic navigational system used during out-of-body travel to a destination is guided by what and of whom the traveller thinks, and that a single stray thought can deviate the course.
  - id: f2fb7646-aada-465c-a016-fb324ede4978
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
