        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      The vibrations started to fade, so I backed away, dove into hole, rotated, and sat up. Total time of the entire episode was forty minutes.
    text: |-
      The 1959-02-27 out-of-body episode into Locale III lasted a total of forty minutes.
  - id: 54c2a63c-2d0b-441a-bf6f-a67ad2b04f81
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:12391-12611
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 8aaf4365-1568-4fdf-a5c5-ec3bbcfd88bc
        name: 'topic: 180 degree (out-of-phase-back-away) separation method'
    quote: |-
      The experiment was repeatable by formula: (1) the setting up of the "vibration" condition; followed by (2) a 180° rotation; and (3) the appearance of the "hole." The experiment was performed not once but at least eleven times.
    text: |-
      Robert Monroe performed the hole-and-180-degree-rotation experiment at least eleven times, following the repeatable formula of setting up the vibration condition, performing the 180 degree rotation, and the appearance of the hole.
  - id: 1a6056c2-ae78-4c15-b019-872d8584e722
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:12898-13121
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The blackness of the hole was evidently a matter of my own limitation in "seeing." Through the early experimentation, the restriction of vision was self-imposed, as I felt this was a requisite for maintaining the vibration condition.
    text: |-
      Robert Monroe considers the blackness of the hole to have been a result of his own self-imposed restriction of vision, which he felt necessary to maintain the vibration condition.
  - id: e408dcad-6a75-437e-8b85-034d6bd8c1a2
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:14988-15322
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Locale III, in summary, proved to be a physical-matter world almost identical to our own... There are trees, houses, cities, people, artifacts, and all the appurtenances of a reasonably civilized society... There are roads on which vehicles travel. There are railroads and trains.
    text: |-
      Robert Monroe describes Locale III as a physical-matter world almost identical to Earth, with trees, houses, cities, people, artefacts, homes, families, businesses, roads, vehicles, railroads, and trains.
  - id: 11ed1bac-1e24-46d8-92af-b7915241610f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:15558-15664
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      However, more careful study showed that it can be neither the present nor the past of our physical-matter world.
    text: |-
      Robert Monroe determined that Locale III could not represent either the present or the past of the physical-matter world of Earth.
  - id: 2ed616d6-550b-48ae-8e0c-f6140c744e7d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:15672-15897
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      The scientific development is inconsistent. There are no electrical devices whatsoever. Electricity, electromagnetics, and anything so related are non-existent. No electric lights, telephones, radios, television, or electric power.
    text: |-
      Robert Monroe found no electrical devices in Locale III; electricity, electromagnetics, electric lights, telephones, radios, television, and electric power were all absent.
  - id: a6572fff-4813-48d9-a803-6d460bace851
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:15905-16146
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      No internal combustion, gasoline, or oil were found as power sources. Yet mechanical power is used. Careful examination of one of the locomotives that pulled a string of old-fashioned-looking passenger cars showed it to be driven by a steam engine.
    text: |-
      Robert Monroe found no internal combustion, gasoline, or oil power sources in Locale III, yet mechanical power including steam-engine-driven locomotives was in use.
  - id: a67e956e-e66c-4afd-b3f4-6806446c2f09
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:16154-16376
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      The cars appeared to be made of wood, the locomotive of metal, but of a different shape than our now obsolete types. The track gauge was much smaller than our standard track spacing, smaller than our narrow-gauge mountain railways.
    text: |-
      In Locale III, Robert Monroe observed that the locomotives' cars appeared to be made of wood and the locomotive of metal, of a different shape from Earth's now-obsolete steam locomotives, with a track gauge smaller than Earth's narrow-gauge mountain railways.
  - id: c36c7e98-8e84-4ed9-95a8-5545e2957acd
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:16449-16857
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Neither wood nor coal was used as a thermal source to produce steam. Instead, large vatlike containers were carefully slid from under the boiler, detached, and rolled by small cart into a building with massive thick walls... The contents were "hot," either through heat or radiation. The actions of the technicians all seemed to indicate the latter.
    text: |-
      In Locale III, Robert Monroe observed the servicing of a locomotive in which large vat-like containers, believed to be radioactive or 'hot', were removed from under the boiler by men working behind shields with cautious vigilance and rolled into a thick-walled building instead of using wood or coal as a thermal source.
  - id: 5b3893c3-2dc6-47e5-8cec-aedcf709b761
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:17111-17304
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      The "lane" on which vehicles travel is nearly twice as wide as ours. Their version of our automobile is much larger. Even the smallest has a single bench seat that will hold five to six people abreast.
    text: |-
      In Locale III, Robert Monroe observed that the traffic lane on which vehicles travel is nearly twice as wide as on Earth, and their equivalent of an automobile is much larger, with the smallest holding five to six people abreast on a single bench seat.
  - id: 19d2e973-987b-4f61-8b2c-129dd19a3b3f
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:17312-17572
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      The standard unit has only one fixed seat, that of the driver. Others are much like living-room chairs, placed around a compartment that measures some fifteen by twenty feet. Wheels are used, but without inflated tires. Steering is done by a single horizontal bar.
    text: |-
      In Locale III, Robert Monroe observed that the standard vehicle has only one fixed seat for the driver, other seats resembling living-room chairs around a compartment measuring roughly 4.6 by 6.1 metres, with wheels lacking inflated tyres and steering by a single horizontal bar.
  - id: 27e3679d-3f27-4b61-910e-d3e39c1a8385
    type: measurement
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:17626-17726
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Their movement is not very fast, at something like fifteen to twenty miles per hour. Traffic is not heavy.
    text: |-
      In Locale III, Robert Monroe observed that vehicles moved at roughly twenty-four to thirty-two kilometres per hour and that traffic was not heavy.
  - id: 8d900218-f3ab-456f-8783-4b2e08462f7d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:17734-18018
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Self-powered vehicles exist in the form of a four-wheeled platform which is steered by the feet acting upon the front wheels. A mechanism pumped by the arms transfers the energy to the rear wheels, much like the children's "rowing wagons" of some years back. These are used for short distances.
    text: |-
      In Locale III, Robert Monroe observed self-powered four-wheeled platform vehicles steered by the feet and propelled by an arm-pumped mechanism, similar to children's rowing wagons, used for short distances.
  - id: b620f5c4-139c-4b79-9ccb-74aa4c18fa34
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:18030-18350
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Habits and customs are not like ours. What little has been gleaned implies a historical background with different events, names, places, and dates. Yet, while the stage of man's evolution (the conscious mind translates the inhabitants as men) seems to be identical, technical and social evolution are not completely the same.
    text: |-
      Robert Monroe found that the inhabitants of Locale III appeared to be at the same stage of human evolution as on Earth but that their technical and social evolution was not completely the same, with different habits, customs, historical events, names, places, and dates.
  - id: fe2b4a88-38d2-4584-87a0-849c4643eca6
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:18489-18648
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      the people there were not aware of my presence until I met and "merged" temporarily and involuntarily with one who can only be described as the "I" who lives "there."
    text: |-
      Robert Monroe involuntarily and temporarily merged with and inhabited the body of a person living in Locale III, referred to as "I There", who was not aware of Robert Monroe's presence within him.
  - id: d8bef8e4-5dc2-4ebc-b405-d3b48ed534fc
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:19044-19375
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      My knowledge of him and his activities and his past came from his family, and what was evidently his brain memory-bank... I have wondered what embarrassment I have caused him as a result of the periods of amnesia created by my intrusions. Some must have brought him much distress.
    text: |-
      During these merges into Locale III, Robert Monroe's knowledge of the inhabited person and his past came from the person's family and from what appeared to be the person's brain memory-bank, and Robert Monroe believed his intrusions caused the person periods of amnesia and distress.
  - id: 29083b9e-3731-433c-8ad1-5a1a459dc656
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:19418-19848
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      Here is his life: "I" There—at the first intrusion, was a rather lonely man. He was not particularly successful in his field (architect-contractor), and not too gregarious. He came of what might be classified as a low-income group, and succeeded in going to the equivalent of a minor college. He spent much of his early career in a large city in an ordinary job. He lived on the second floor of a rooming house, and took a bus to work.
    text: |-
      Robert Monroe describes the man in Locale III whom he calls "I There" as a lonely, not particularly successful architect-contractor from a low-income background who attended the equivalent of a minor college, worked an ordinary job in a large city, lived on the second floor of a rooming house, took a bus to work, and made few friends.
  - id: e6b7e1a0-2bb6-4829-8dd2-3ad10a3eee51
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:20286-20388
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      “I” There met Lea, a wealthy young woman with two children, a boy and a girl, both under four years of age.
    text: |-
      Robert Monroe had a recurring intrusion experience in which "I" There (Robert Monroe's out-of-body identity in Locale III) met Lea, a wealthy young woman with two children, a boy and a girl, both under four years of age.
  - id: 8c4c24cb-ac36-46e1-9c2d-45de8f5bd10b
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:20393-20575
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
    quote: |-
      Lea was a sad, wistful, and somewhat preoccupied person, who seemed to have experienced some major tragedy in her life. This had some relationship to her former husband, but was not clear.
    text: |-
      Lea was a sad, wistful, and somewhat preoccupied person who seemed to have experienced a major tragedy in her life, possibly related to her former husband.
  - id: bde320cf-adfb-43e0-8f4b-a70586ed71f6
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:20583-20826
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      “I” There met her quite accidentally, and was deeply attracted to her. The two children found in him a great companion. Lea appeared only mildly interested at this first meeting. Her greatest response lay in his attention to and warmth for the children.
    text: |-
      "I" There met Lea accidentally and was deeply attracted to her, while Lea's children found in him a great companion and Lea herself was only mildly interested at first, responding mainly to his attention to the children.
  - id: 8a8c25bc-8172-46ca-8f2b-7314690b4e5d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:20856-21184
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      an intrusion occurred just as Lea and “I” There had announced to friends—her friends—that they were going to be “married” ... it had been only thirty days (?) since some major event had occurred in Lea’s life (divorce, her husband’s death, or some physical debilitation)
    text: |-
      In a later intrusion, Lea and "I" There announced to friends that they were going to be "married," causing consternation because only about thirty days had passed since a major event in Lea's life, such as a divorce, her husband's death, or a physical debilitation.
  - id: dfc5f124-1cee-4f50-ac72-0b6fed979eb8
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:21355-21603
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Lea and “I” There were living in a house in a semipastoral surrounding. The house sat on a low hill, had long rectangular windows, and very wide eaves much like those of a pagoda. The railroad curved around the hill some three hundred yards in the distance
    text: |-
      In a later intrusion, Lea and "I" There were living together in a house on a low hill in a semipastoral setting, with long rectangular windows and wide eaves resembling those of a pagoda, near a curving railroad track about 270 metres distant.
  - id: ce16336a-c3a8-4968-b465-e1ea0da06511
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
