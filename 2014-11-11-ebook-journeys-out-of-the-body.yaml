        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Here, then, are some procedures that can be applied systematically. They are a distillate of literally hundreds of trial-and-error experiments.
    text: |-
      Robert Monroe's procedures for controlling the State of Vibration are a distillation of hundreds of trial-and-error experiments.
  - id: 77fe1c31-bf90-4e21-9a84-0b03d89a9fec
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:20751-21004
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      *Acclimatization and accommodation*. This is a way of saying that you should let yourself get accustomed to the feel of this unusual condition. All fear and panic must be eliminated when you feel waves like an electric shock without pain permeating your body.
    text: |-
      Robert Monroe recommended, as a first step in controlling the State of Vibration, acclimatisation and accommodation: letting oneself get accustomed to the feel of the vibrational condition and eliminating all fear and panic when experiencing waves like a painless electric shock.
  - id: 646d1033-6b78-4af2-8e51-cc0a946cdcb8
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:21010-21191
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      The best method seems to be to do nothing when they occur. Lie quietly and objectively analyze them until they fade away of their own accord. This usually takes place in about five minutes.
    text: |-
      Robert Monroe advised that the best method during the acclimatisation stage of the State of Vibration is to lie quietly and objectively analyse the vibrations until they fade away, which usually takes about five minutes.
  - id: 439257e3-73ab-40a2-92f7-13fcb99fc0c5
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:21281-21457
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Try to avoid panicky struggling to break the paralytic condition. You can break it by sitting up with great force of will, but you will be disappointed with yourself for doing so.
    text: |-
      Robert Monroe advised avoiding panicky struggling to break the paralytic condition associated with the State of Vibration, noting that it can be broken by sitting up with great force of will, but that doing so leads to disappointment with oneself.
  - id: bcc24b07-28f0-490b-a98d-475359c9563f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:21516-21617
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      *Manipulation and modulation*. Once you have eliminated the fear reactions, you are ready for control steps.
    text: |-
      Robert Monroe's second control step for the State of Vibration is manipulation and modulation, beginning once fear reactions have been eliminated.
  - id: 1f4b5dd3-670a-4c4d-8620-a03662cff1b1
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:21624-21888
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      First, mentally "direct" the vibrations into a ring, or force them all into your head. Then mentally push them down along your body to your toes, then back up to your head. Start them sweeping in a wave over your body rhythmically, from head to toes and then back again.
    text: |-
      Robert Monroe described a technique of mentally directing the vibrations of the State of Vibration into a ring or forcing them into the head, then pushing them down the body to the toes and back up to the head, forming a rhythmic sweeping wave.
  - id: 7f1e607e-1a84-4ed3-befc-056754c8ab94
    type: measurement
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:21989-22108
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      It should take about ten seconds—five down, five back—for the wave to make the complete circuit, from head to toes and back.
    text: |-
      Robert Monroe stated that the complete head-to-toes-and-back circuit of the vibration wave in the State of Vibration should take about ten seconds, five seconds down and five seconds back.
  - id: 5e1a3561-7062-4229-9af1-78b8cdac514e
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:22114-22221
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Practice this until the vibration wave begins instantly upon mental command, and moves steadily until fade-out.
    text: |-
      Robert Monroe recommended practising the vibration-wave technique of the State of Vibration until it begins instantly upon mental command and moves steadily until fade-out.
  - id: 973e39aa-0950-4355-8784-a8c2d658d4bb
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
