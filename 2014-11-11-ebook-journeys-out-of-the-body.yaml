        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      There is no evidence to indicate that this vibrational state has a deleterious effect on either the mind or the physical body.
    text: |-
      Robert Monroe considered that there is no evidence that the State of Vibration has a harmful effect on either the mind or the physical body.
  - id: 42afda8d-23c8-4eaf-a8c1-f62be20ecbd7
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
