    text: |-
      During the 1960-11-21 wall-penetration resistance out-of-body experiment, after pushing with outstretched arms and overcoming a moment of resistance, Robert Monroe passed through the wall and felt and identified every layer of material in it, including the paint, plaster, lath, sheathing, and outer shingles.
