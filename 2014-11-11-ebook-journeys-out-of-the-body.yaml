    date: '1960-06-29'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: b8616928-33a5-49c8-acd5-c84de3ddc5bb
        name: Andrija Puharich
    quote: |-
      6/29/60 Late Evening ... under plan to visit Dr. Andrija Puharich somewhere in California. Moved blindly for a short period, then stopped. Four people were seated around a table... one of the men said, "Don't tell him!"... Time away, eighteen minutes. Comment: No connection with Dr. Puharich's activities at the time, as he reports.
    text: |-
      On 1960-06-29 in the late evening, Robert Monroe attempted an out-of-body visit to Andrija Puharich somewhere in California but instead found himself with four unfamiliar people around a table who displayed wariness and refused to answer his questions, with one man saying "Don't tell him!"; the experience lasted eighteen minutes, and Andrija Puharich later reported no connection to the described scene.
  - id: 564d3f3a-1f56-43ce-bc97-b7987a165ec0
    type: testimony
    attestation: first_hand
