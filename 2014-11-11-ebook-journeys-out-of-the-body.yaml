      - id: 3589fec1-bb3a-4351-b3cf-caf1eb0d85c2
        name: Fear Barrier
    quote: |-
      With no guidelines or specific instructions, this remained a prime fear of mine for several years, until I found a simple answer that made it work every time.
    text: |-
      Robert Monroe states that this fear of being unable to return to the physical body remained a prime fear of his for several years, until he found an answer that worked every time.
  - id: d23732a3-2e17-497c-b954-0e99d0526a75
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
