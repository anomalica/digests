      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
    quote: |-
      First, this Second Body has weight as we understand it. It is subject to gravitational attraction, although much less than the physical body. ... anything that can interpenetrate a wall must have so little density as to be able to sift through the space between the molecular matter structure. Such little density implies very little mass—but it still may be matter.
    text: |-
      Robert Monroe concluded that the Second Body is subject to gravitational attraction, though much less than the physical body, and reasoned that its ability to interpenetrate a wall implies it has very low density and mass while still possibly being matter.
  - id: 1fd307c3-4d1a-49e5-aba2-9c645ef91b79
