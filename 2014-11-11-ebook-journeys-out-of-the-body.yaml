    date: '1958-12-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The moment I did, I heard a voice say in utter excitement and surprise, "Come here quick! Look!" I could see no one.
    text: |-
      On 1958-12-27, during an out-of-body experience, Robert Monroe poked his head through the hole and heard a voice say in excitement, "Come here quick! Look!" but saw no one.
  - id: b347e09a-1931-4102-9c72-28b85f6c0a22
    type: observation
    attestation: first_hand
