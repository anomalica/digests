    quote: |-
      To date, a pattern of consistency has been established: H (Hissing sound) + V (Valve-opening sensation) = F (Future event vision).
    text: |-
      Robert Monroe established a pattern of consistency in his precognitive experiences: a hissing sound plus a valve-opening sensation equals a future event vision.
