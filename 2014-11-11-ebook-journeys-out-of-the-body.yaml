        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      I looked in all directions, and suddenly, there she was. However, she was not alone. A man was with her, standing to her left as she faced me.
    text: |-
      Robert Monroe found the technician in the brightly lit outer room, not alone, but with a man standing to her left.
  - id: 3c670554-528b-4ebc-b127-c9f499518259
    type: observation
