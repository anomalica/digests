        name: Locale II
    quote: |-
      It is an incredible series of crude symbols strung in an arc directly across one section of Locale II. When moving through the area, everyone has to go around this barrier, as it is solid, immovable, immutable.
    text: |-
      The sign Robert Monroe observed in Locale II is an arc of crude symbols strung across one section of Locale II that functions as a solid, immovable barrier that travellers must go around.
