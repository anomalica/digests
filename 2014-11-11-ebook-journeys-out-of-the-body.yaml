    quote: |-
      I opened my eyes, sat up, and called to the technician. She came in, and I told her that I had made it finally, and that I had seen her, however, with a man. She replied that it was her husband.
    text: |-
      After the out-of-body experience, Robert Monroe told the technician that he had seen her together with a man, and she confirmed the man was her husband.
