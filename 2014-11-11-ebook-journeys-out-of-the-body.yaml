    text: |-
      On 1959-03-15 at night, while attempting to follow up on the 1959-03-09 vision by mentally repeating "Father, guide me. Father, tell me the great secret," Robert Monroe experienced a sudden blackout and found himself standing in a room with a high-beamed ceiling.
