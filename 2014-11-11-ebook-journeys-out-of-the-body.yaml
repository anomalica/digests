        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      After a moment, I pulled back, and gently put my hands on her face, one on each cheek, and thanked her for her help. However, there was no direct intelligent objective communication with her other than the above.
    text: |-
      Robert Monroe pulled back from the embrace, put his hands on the technician's face, and thanked her for her help, with no other direct intelligent communication occurring between them.
