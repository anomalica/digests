    quote: |-
      8/15/63 Afternoon / A productive experiment after a long layoff! R.W., a businesswoman whom I know quite well through long work association... has been away this week on her vacation up on the New Jersey coast. I do not know exactly where she is vacationing
    text: |-
      On 1963-08-15, Robert Monroe made an out-of-body attempt to visit R.W., a businesswoman and close friend, while she was on vacation on the New Jersey coast, without knowing her exact location.
  - id: 3cae72d6-58bb-4c3b-bc21-e2f0d06dbe75
