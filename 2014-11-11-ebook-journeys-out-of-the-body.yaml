        name: Richard Gordon
    quote: |-
      After a thorough physical, Dr. Gordon suggested that I had been working too hard, that I get more sleep and take off a little weight. In short, he could find nothing wrong with me physically. He laughed at the possibility of a brain tumor or epilepsy.
    text: |-
      After a thorough physical examination, Richard Gordon found nothing physically wrong with Robert Monroe, suggested he had been working too hard, and recommended more sleep and losing weight, dismissing the possibility of a brain tumour or epilepsy.
  - id: 6460ad2f-8058-4d45-aabe-e18ebd3330f0
    type: observation
    attestation: first_hand
    speaker:
