    quote: |-
      In evaluation of all experiments, there evolved what seemed to be three Second State environments. The first of these was identified as Locale I, for lack of a better nomenclature.
    text: |-
      Locale I is one of three Second State environments identified through evaluation of Robert Monroe's out-of-body experiments.
  - id: eebece31-6820-4e3c-b2ce-ec99e81483d8
