    text: |-
      On 1962-03-18 in the afternoon, E.W. was visiting Robert Monroe and both rested in adjoining rooms around five in the afternoon.
  - id: 80b6d410-db91-4cd8-ba37-a19b22bf0290
    type: testimony
    attestation: first_hand
    speaker:
