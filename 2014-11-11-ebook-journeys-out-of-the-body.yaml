      Feeling something calling for a return to the physical, I swung around and went through the door, and slipped easy back into the physical. Reason for discomfort: dry throat and throbbing ear.
    text: |-
      Robert Monroe returned to the physical body through the door after feeling something calling for a return, ending the experiment with a dry throat and throbbing ear.
