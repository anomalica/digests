    attribution_in_text: false
    location: ch8:19688-19823
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      After a moment, the tugging stopped, and a hand took my wrist, first gently, then very, very firmly, and pulled me out of the physical easily.
    text: |-
      Robert Monroe reported that after the tugging stopped, a hand took his wrist, first gently then very firmly, and pulled him out of the physical body easily.
  - id: 984d0142-1467-48a9-a878-046ff0ce8d76
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
