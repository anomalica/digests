    quote: |-
      I went under the cot, keeping in slight touch with the floor, and floating in a horizontal position, finger tips touching the floor to keep in position, I went slowly through the doorway. I was looking for the technician, but could not find her.
    text: |-
      During the out-of-body experience, Robert Monroe floated in a horizontal position with his fingertips touching the floor and moved through the doorway toward the outer EEG rooms, looking for the technician.
  - id: 08e8e054-4592-4ecb-a7c5-60703bbcc25e
