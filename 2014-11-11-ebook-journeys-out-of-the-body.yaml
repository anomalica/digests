        name: Robert Monroe
    quote: |-
      The vibrations came and went six more times before I got up the courage to try to repeat the experience. When I did, it was an anticlimax. With the vibrations in full force, I thought of floating upward—and I did.
    text: |-
      After the vibrations associated with Robert Monroe's out-of-body experiences recurred six more times, he attempted to deliberately repeat the experience of floating upward.
  - id: cf5ec56f-1475-4f22-81c0-5731218356f5
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
