        name: 'topic: precognition'
    quote: |-
      At first, I paid no particular attention to the phenomenon, attributing the dream visions to release of material from the unconscious. A major event brought it strongly to my attention.
    text: |-
      Robert Monroe initially attributed his dream visions to release of material from the unconscious mind before a major event brought the phenomenon strongly to his attention.
