    text: |-
      On 1961-08-18, after Robert Monroe became distracted by clouds and wished to soar among the mountains and valleys, a friendly thought entered his mind saying "Well, if the soaring is that good, go to it," as if a teacher had given up trying to keep a restless child's attention.
