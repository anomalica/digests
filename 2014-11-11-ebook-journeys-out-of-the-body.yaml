    quote: |-
      I decided to try the "roll-out" method (i.e., start to turn over gently...). I started to feel as if I were turning, and at first thought I truly was moving the physical body. I felt myself roll off the edge of the cot, and braced for the fall to the floor. When I didn't hit immediately, I knew that I
    text: |-
      During the 1966-07-19 EEG Experiment #EEG-5, Robert Monroe attempted the "roll-out" method of separation, feeling himself turning and rolling off the edge of the cot, bracing for a fall to the floor that did not occur.
