    date: '1959-01-21'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      something sharp seemed to dig into the palm of my hand, like a hook, and dug in more deeply when I tried to withdraw it... There were no marks or feeling (although the sensation of the penetration aftereffect was present).
    text: |-
      On 1959-01-21, during an out-of-body experience, something sharp like a hook dug into Robert Monroe's hand when he reached through the hole, and it dug in more deeply as he tried to withdraw, though no marks or feeling were present afterward on his physical hand.
  - id: 3ef7c238-fc9c-4dfd-8d9e-b39ea9d9d88e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
