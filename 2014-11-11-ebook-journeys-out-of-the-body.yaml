    quote: |-
      July 19th, 1966. Arrived at the hospital EEG lab at 9:00 P.M., after driving seventy miles from Richmond.
    text: |-
      On 1966-07-19, Robert Monroe drove approximately 110 kilometres from Richmond, Virginia to arrive at the EEG laboratory of a hospital on a major university campus at 9:00 p.m. for an out-of-body experiment.
  - id: 3bd8fa58-9ce4-413e-931a-100e0d3a7871
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
