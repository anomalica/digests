    date: '1958-12-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      A voice—feminine, soft, low-pitched, and urgent (just as if someone were trying to wake me up from sleep without startling me too much)—called, "Bob! Bob!"
    text: |-
      On 1958-12-05, during an out-of-body experience through the hole, a feminine voice called Robert Monroe's name, "Bob! Bob!", while two hands held his.
  - id: 11c9f03e-2081-4026-94cb-cc88b850bece
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: 12/5/58 Morning
    date: '1958-12-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I asked, "What is your name?" (always looking for evidential material!)... The voice repeated my name, and I repeated my question, still with the two hands holding mine.
    text: |-
      On 1958-12-05, Robert Monroe asked the voice through the hole, "What is your name?" seeking evidential material, but received no clear answer despite repeating the question.
  - id: 0220b863-a943-48da-8463-52ae0e551c9a
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
