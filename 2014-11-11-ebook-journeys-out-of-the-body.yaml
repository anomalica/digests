        name: Robert Monroe
      - id: 8545ac03-0139-4673-b1ed-3c4d5c41f682
        name: Locale I
    quote: |-
      Add to this the fact that your conscious mind may be in conflict with the superconscious as to what should be that destination, and you can begin to appreciate why so many experiments to produce Locale I evidential data have ended in failure.
    text: |-
      Robert Monroe considers that conflict between the conscious mind and the superconscious as to the intended destination explains why many of his experiments intended to produce Locale I evidential data ended in failure.
  - id: 3e0a37a0-7f53-42ac-ac1b-ee747047ddff
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
