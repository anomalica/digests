      - id: 3589fec1-bb3a-4351-b3cf-caf1eb0d85c2
        name: Fear Barrier
    quote: |-
      The second aspect of the fear barrier is also linked with the death fear: will I be able to return to the physical or to get back "in."
    text: |-
      Robert Monroe describes a second aspect of the Fear Barrier as fear of being unable to return to the physical body.
  - id: c5a944be-9751-4b41-a8f1-af0eb508e2e7
