        name: State of Vibration
    quote: |-
      Sometime after dawn that morning... I began vaguely remembering that Mr. Monroe was supposed to try to get me out of my body. I became partially conscious, and felt a sense of “vibration” all around me in the dream world, a “vibration” that had a certain amount of indefinable menace connected with it. In spite of the fear this aroused, I thought that I should try to have an OOBE, but at that point I lost my thread of consciousness, and only remember waking up a while later, feeling that the experiment was a failure.
    text: |-
      Sometime after dawn during the 1970 experiment, Charles T. Tart began dreaming and vaguely remembering that Robert Monroe was supposed to try to get him out of his body, then became partially conscious and felt a sense of vibration around him in the dream world with an indefinable menace, but lost his thread of consciousness before attempting the out-of-the-body experience, and woke feeling the experiment had failed.
