    text: |-
      Robert Monroe found that experiments producing evidential Locale I data were pitifully few in proportion to all his recorded out-of-body experiments.
  - id: 14ed47f2-50d4-4c9f-8f02-3e1c5faaba13
    type: observation
    attestation: first_hand
    speaker:
