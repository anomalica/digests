        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      With the hand around my wrist very firmly, I could feel a part of the arm belonging to the hand (slightly hairy, muscular male). But I could not “see” who belonged to the arm. I also heard my name called once.
    text: |-
      Robert Monroe recorded in his notes an out-of-the-body experience in which a hand held his wrist firmly, he felt a hairy muscular male arm but could not see who it belonged to, and he heard his name called once.
  - id: 0725ad87-ba79-4463-bffa-51548b4e13c5
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch8:20268-20554
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      Then we started to move, with the familiar feeling of something like air rushing around the body. After a short trip (seemed like five seconds in duration), we stopped and the hand released my wrist. There was complete silence and darkness. Then I drifted down into what seemed to be a room.…
    text: |-
      Robert Monroe recorded that during this out-of-the-body experience he felt a sensation like air rushing around his body, the trip seemed to last about five seconds, they stopped, the hand released his wrist, there was complete silence and darkness, and then he drifted down into what seemed to be a room.
  - id: 6f26b3a3-70b3-4613-b6b8-1eb9628ed549
