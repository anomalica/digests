      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I smoothly floated up over the bed, and when I willed myself to stop, I did, floating in mid-air.
    text: |-
      Robert Monroe floated up over his bed and was able to stop and remain floating in mid-air by an act of will.
  - id: bbb9b0b7-8909-4d0e-81d6-6b5a343b772d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:21738-21857
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      There had been no discontinuity in consciousness from the moment I lay down in bed until I got up after the vibrations faded.
    text: |-
      Robert Monroe experienced no discontinuity of consciousness between lying down in bed and returning to his body after the vibrations faded.
  - id: cea93ced-08b2-42bb-b65b-39698d476727
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:22075-22416
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The second time I attempted to disassociate deliberately, I was successful. Again I went up to ceiling height. However, this time I experienced an overwhelmingly strong sexual drive and could think of nothing else. Embarrassed and irritated at myself because of my inability to control this tide of emotion, I returned back into my physical body.
    text: |-
      On his second deliberate attempt to disassociate from his physical body, Robert Monroe again rose to ceiling height but experienced an overwhelming sexual drive and returned to his physical body.
  - id: 7bdb8a84-ddc1-47b8-8116-070df40a473c
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:22423-22501
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It wasn't until some five episodes later that I discovered the secret of such control.
    text: |-
      Robert Monroe discovered how to control the sexual drive that interfered with his out-of-body experiences only after five further episodes.
  - id: 56f740a9-7d8c-42ab-be0a-8361cbef410a
    type: administrative
    attestation: first_hand
    speaker:
