    date: '1963-04-12'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      4/12/63 Late Afternoon ... Utilized countdown technique... Used stretch-out method, seemed to travel unusually long for three-mile trip.… Then I stopped. I looked to see where I was, and found I was sitting on the edge of the roof of a two-story house... Time away, seven minutes, ten seconds.
    text: |-
      On 1963-04-12 in the late afternoon, Robert Monroe attempted an out-of-body visit to a friend using the stretch-out method and, after an unusually long journey for a planned three-mile trip, found himself on the roof edge of a two-story house where a woman in the yard looked up and saw him before fleeing indoors; the experience lasted seven minutes ten seconds.
  - id: 7bd7db41-8236-4355-8e92-2d508683ee75
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
