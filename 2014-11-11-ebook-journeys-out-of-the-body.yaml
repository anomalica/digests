        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
      - id: 6ec7e1e2-f03e-45fa-ad76-dcce74d102a0
        name: USA, North Carolina, Durham
    quote: |-
      it was only through sheer determination that I fought it step by step over to the window and hurled it out. It apparently had no human or intelligence characteristics. It seemed pure animal and about four feet long, like a large dog.
    text: |-
      During the 1960-07-13 Durham out-of-the-body experience, Robert Monroe fought the entity through the room and ejected it out of a window; he estimated it was pure animal, about 1.2 metres long, like a large dog.
  - id: 02718845-9943-4ecb-a836-9ded53dde787
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch18:11861-12050
    date: '1960-07-13'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      By the window, after disposing of it, I turned and realized for the first time that I was not in the physical. (My hand was right through the closed window!) I floated over to the bed... and was back “in.”
    text: |-
      During the 1960-07-13 Durham out-of-the-body experience, after disposing of the entity Robert Monroe realised his hand passed through the closed window, confirming he was not in his physical body, then returned and re-entered his physical body.
  - id: 6520e5fd-b204-46c7-acf4-d6b6eb990a35
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch18:12729-12950
    date: '1960-10-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      I was attacked by something. It had no apparent personality, nor was I able to see it. However, I knew this one was incredibly vicious with an intent to “take” something that was mine which first required getting rid of “me”.
    text: |-
      During an out-of-the-body experience on 1960-10-27 night, Robert Monroe was attacked by an entity that seemed to have no apparent personality and could not be seen, but was intent on 'taking' something of his that first required overpowering him.
  - id: ae5cf40d-3bc4-4f29-ab69-0991694baf2f
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch18:13065-13247
    date: '1960-10-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      This struggle was not like fending off an animal. It was a no-holds-barred affair, silent, terrifyingly fast... We fought for what seemed like hours... Still fighting, I steered the battle in the direction of my physical... I dropped back “in.”
    text: |-
      During the 1960-10-27 out-of-the-body experience, Robert Monroe fought a silent, extremely fast, no-holds-barred struggle against an entity that seemed to know and exploit every weak spot, lasting what seemed like hours before he steered the fight over his physical body and re-entered it to end the struggle.
  - id: 8858dca4-a872-4a60-94af-18fc19447baa
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
