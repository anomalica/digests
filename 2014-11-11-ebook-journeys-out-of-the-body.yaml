        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      The technician removed the electrodes, and I went outside with her and met her husband. He was about her height, curly-haired, and after several conversational amenities, I left.
    text: |-
      After the EEG experiment, the technician removed the electrodes and Robert Monroe went outside with her and met her husband, who was about her height and curly-haired.
