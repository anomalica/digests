    quote: |-
      Comment: In checking with Dr. Puharich, the locale was right, and actions were correct, but he has no memory of visit. Strong overhead light may have caused the reflection of "blond."
    text: |-
      After Robert Monroe's 1961-05-05 out-of-body visit, Andrija Puharich confirmed the described locale and actions were correct but had no memory of the visit himself, and Robert Monroe attributed the perceived blond hair to a strong overhead light reflection.
