        name: Robert Monroe
      - id: c8f09e97-6ecd-485e-a4fc-19d0fcef5d6a
        name: Second State
    quote: |-
      Inconveniently, the best periods for deep relaxation so necessary to create the Second State occur late at night... Less effort is required, and the separation is much more rapid.
    text: |-
      Robert Monroe found that the best periods for the deep relaxation needed to induce the Second State occur late at night, requiring less effort and producing more rapid separation from the physical body.
  - id: a1ece290-fb69-4a01-949b-070efd2f32db
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
