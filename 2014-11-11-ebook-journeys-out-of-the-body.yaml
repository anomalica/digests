        name: 1961-02-23 log-roll cord-tug out-of-body experience (Robert Monroe)
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Something seemed to be holding me back. It was like trying to walk slowly in water, pulling with arms and legs and getting nowhere. Suddenly, there was a tug at my back (not painful), and I cartwheeled backward, in an arc, feet over head, and re-entered the physical.
    text: |-
      During the 1961-02-23 log-roll cord-tug out-of-body experience, Robert Monroe felt something holding him back like walking slowly through water, then felt a tug at his back and cartwheeled backward, feet over head, re-entering his physical body.
  - id: 8dba9b73-838e-4762-a62f-0ebdfc91a8bc
    type: observation
    attestation: first_hand
