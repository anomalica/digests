    quote: |-
      I looked upward to where I felt them, and I saw the shimmering outlines of my arms and hands in exactly the place they felt they were! ... It was like a bright, glowing outline which moved when I felt them move or made them move willfully.
    text: |-
      During the 1958-07-19 glowing-arms outline out-of-body experience, Robert Monroe stretched his arms upward while his physical arms remained folded over his chest, and saw a shimmering, bright glowing outline of his arms and hands at the position he felt them to be, through which he could see the bookshelves beyond.
