    attribution_in_text: false
    location: ch13:17242-17419
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd08b756-aa8e-431d-9a64-5b670d116e29
        name: USA, Pennsylvania, Coshocton
    quote: |-
      Recently, a Catholic priest friend took the trouble to investigate this possibility of past-life monasticism. To my surprise and his delight, there is an obscure monastery near Coshocton.
    text: |-
      A Catholic priest friend of Robert Monroe investigated the possibility of his past-life monasticism and discovered that an obscure monastery exists near Coshocton, Pennsylvania.
  - id: d11f390e-ba2e-4cea-b1ad-c91f311e55aa
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:17645-17921
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      There have been visits to a group that appeared to be in uniform, which operated highly technical equipment and identified themselves as the "Target Army" (the mind's interpretation of what was said). There were hundreds, each waiting for "assignments." Their purpose was not disclosed.
    text: |-
      During visits to Locale II, Robert Monroe encountered an unidentified group operating highly technical equipment, calling itself the "Target Army" (Robert Monroe's mind's interpretation of what was said), comprising hundreds of members each waiting for undisclosed assignments.
  - id: 9cddb0b6-908d-428c-b659-8c3e18b31766
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:17933-18137
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Another visit took me to a well-organized city, where my presence was immediately construed as hostile. Only by taking evasive action—running, hiding, and finally lifting straight up—was I able to avoid "capture."
    text: |-
      On another out-of-body visit, Robert Monroe arrived at a well-organized city in Locale II where his presence was immediately construed as hostile, and he avoided capture only by running, hiding, and lifting straight up.
  - id: e7ecef89-47a3-433f-9302-29c308a0d3b0
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:18461-18632
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: c718238b-f469-415b-8011-ddc12dae13f4
        name: Arrosio LeFranco
    quote: |-
      "Do you know or remember Arrosio LeFranco?" He asked the question bluntly... "I am sure you will remember if you think back," the man said firmly.
    text: |-
      On another out-of-body trip, a conventionally dressed man accosted Robert Monroe and repeatedly asked if he knew or remembered Arrosio LeFranco.
  - id: 91b538e2-bedc-4941-9f70-a5e60851fa97
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:18871-19158
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 96ebb205-53e7-4e54-a1d4-795105d25fd0
        name: 'topic: K recall (return-to-physical technique)'
    quote: |-
      I suddenly went limp, and the man grabbed me. He took one of my arms, and I felt someone else take another, and they started to drag me in the direction of what seemed to be three bright spots of lights. I struggled, and finally broke loose when I remembered to use the "go-to-physical" signal.
    text: |-
      During this encounter, the man and another figure grabbed Robert Monroe's arms and began dragging him toward what seemed to be three bright spots of light, until he broke free by using the go-to-physical return signal.
