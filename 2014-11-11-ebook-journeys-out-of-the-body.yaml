    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The next day the newspaper carried the story of the death of a ten-year-old boy after a lingering illness. He had died in the afternoon, shortly before I had begun the experiment.
    text: |-
      The day after Robert Monroe's second encounter with the boy, a newspaper reported the death of a ten-year-old boy following a lingering illness, who had died in the afternoon shortly before Robert Monroe began the experiment.
  - id: a674ba26-9b6f-43ec-8388-02ef0463658b
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
