    text: |-
      In the 1959-07-05 vision, after the crash Robert Monroe went over to the plane wreck and the pilot, wearing a leather jacket and cap, asked him dazedly why he of all the passengers had been picked to be saved.
  - id: 1a67ec19-3891-403e-ad2e-70d2a01cb010
