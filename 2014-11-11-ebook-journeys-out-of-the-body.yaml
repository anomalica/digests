        name: Robert Monroe
    quote: |-
      Your Supermind (soul?) is stronger and usually makes the decision for you. Like attracts like.
    text: |-
      Robert Monroe believes the Super Mind (soul) usually determines one's destination in Locale II based on one's innermost constant motivations, emotions, and desires, regardless of conscious intent.
  - id: 457d4643-0760-433f-8c83-a079b5aa413e
