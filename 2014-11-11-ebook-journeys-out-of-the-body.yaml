      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:21833-21905
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: Behind the house, “I” There had an office, a one-room building where he worked.
    text: |-
      During this intrusion, "I" There had an office behind the house, a one-room building where he worked.
  - id: 60d06003-66a4-4018-8fe2-6571f3b95c5c
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:21932-22201
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Lea entered the office and came over to the desk just as I had replaced “I” There.... “The workmen want to borrow some of your tools,” she said.... I said there were no men working on the road. With this, she looked at me intently, with a growing suspicion.
    text: |-
      During one intrusion, Robert Monroe replaced "I" There in the office just as Lea entered to say that workmen wanted to borrow some tools, and when Robert Monroe (in the body of "I" There) said no men were working on the road, Lea grew suspicious.
  - id: 260ef567-1e9c-4b0c-84b3-2c1de8d669ab
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:22396-22484
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I was thoroughly unsure of what to do next, so I left his body and returned through the hole.
    text: |-
      Robert Monroe left "I" There's body and returned through the hole after Lea grew suspicious of his answers about the workmen.
  - id: eb18c02f-73c3-4356-96a8-10926bf55707
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:22491-22832
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
    quote: |-
      Another eventful intrusion came when “I” There had set up his laboratory. He was not fully qualified to perform research, but he had decided he could make some kind of new discoveries. He had (perhaps with the assistance of Lea’s wealth) taken a huge storage building, divided it internally into small rooms, and was conducting some kind of experiments.
    text: |-
      In another intrusion, "I" There had set up a laboratory in a huge storage building divided internally into small rooms, possibly with the assistance of Lea's wealth, where he conducted experiments despite not being fully qualified to perform research.
  - id: c3a99ff5-fe3d-4656-bd76-0b89b03815fb
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:22845-23179
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      In the middle of one, I displaced him in his body, but was unable to calculate what was next in his routine. Just then, Lea came in, with visitors, principally to show the kind of work he had achieved in the renovated building. I (in “I” There’s body) stood there unable to speak when Lea asked me to tell them of the work I had been doing.
    text: |-
      During this intrusion, Robert Monroe displaced "I" There in his body in the middle of the laboratory work but was unable to determine what was next in his routine, and stood unable to speak when Lea brought visitors and asked him to describe his work.
  - id: 95967bf3-5293-45a4-83e8-c2905e91840f
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:23307-23589
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I tried to “feel” any pattern of activity that he might have been doing. The best I could get was that he had been trying to develop new forms of theatrical entertainment, designing theater stages, lighting, and sets, all in an attempt to make watching a play a strongly subjective experience.
    text: |-
      Robert Monroe attempted to sense "I" There's pattern of activity and concluded that "I" There had been trying to develop new forms of theatrical entertainment, including designing theatre stages, lighting, and sets, in an attempt to make watching a play a strongly subjective experience.
  - id: f28873c1-62bf-4738-ad63-6d064f8f7b12
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:23738-24041
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      A vacation in the mountains was under way at another intrusion point. “I” There, Lea, and the two children were riding along a winding mountain road, each on the self-propelled vehicle described elsewhere. I “took over” inadvertently just as they were reaching the bottom of one hill and had started up another.
    text: |-
      In another intrusion, "I" There, Lea, and the two children were riding self-propelled vehicles along a winding mountain road during a vacation in the mountains, when Robert Monroe took over inadvertently as they started up a hill.
  - id: 1b13cf4e-8ed6-4d0f-ad18-c6a3de4818a8
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:24050-24349
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      New to the device, I tried to make it go up the next hill, and soon rolled off the road and into a small pile of dirt. The rest waited while I tried to get back on the road, and I muttered that there were better ways to get around than this. This triggered something in Lea, and she suddenly became quiet.
    text: |-
      During this intrusion, Robert Monroe, unfamiliar with the self-propelled vehicle, rolled off the road into a small pile of dirt, and his remark that there were better ways to get around triggered Lea to become suddenly quiet.
  - id: c545241f-feae-4da8-8927-e5d3acb408f1
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:24560-24792
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
    quote: |-
      In later intrusions, “I” There and Lea no longer lived together. He had met with some success, but some action of his alienated her. Alone, he has thought of her constantly, and deeply regretted the weakness that made him displease her.
    text: |-
      In later intrusions, "I" There and Lea no longer lived together after some action of his alienated her, and he thought of her constantly and regretted the weakness that made him displease her.
  - id: d320421a-421c-40e3-99c7-af2d2216961b
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:24797-25033
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
    quote: |-
      He met her casually once, in a large city, and pleaded with her to let him visit her. She told him she would let him do so, and see how things worked out. She lived in the equivalent of an apartment, on the third floor of a residential building.
    text: |-
      "I" There met Lea casually once in a large city and pleaded with her to let him visit her; she agreed to let him do so and see how things worked out, and she lived on the third floor of a residential building.
  - id: 712fc90f-381f-4fe2-8862-1daf3ce0d3c7
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:25065-25240
    refs:
      - id: abba9c9d-276e-4495-84b9-dd088c58dd10
        name: Lea
    quote: |-
      Unfortunately, “I” There lost or forgot the address she gave him, and at the last intrusion, was a lonely and frustrated man.... He was working, but was spending his idle time trying to find Lea and the children.
    text: |-
      At the last intrusion, "I" There had lost or forgotten the address Lea gave him and was a lonely and frustrated man, spending his idle time trying to find Lea and the children.
  - id: 86a85146-be46-4bf4-a739-c2da34d1ac1f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:25828-26110
    refs:
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
      - id: 8545ac03-0139-4673-b1ed-3c4d5c41f682
        name: Locale I
    quote: |-
      The most important assumption is that Locale III and Locale I (Here-Now) are not the same. This is based upon the differences in scientific development. Locale III is not more advanced, perhaps even less so. There is no time in our known history where science was at the Locale III stage.
    text: |-
      Robert Monroe considers that Locale III and Locale I are not the same, based on differences in scientific development, and that Locale III does not correspond to any known period in Locale I's history.
  - id: 25b85e18-6939-49ce-bf7d-a8d84c4ba667
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:26227-26290
    refs:
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: It is not a part of Locale II, where only thought is needed or used.
    text: |-
      Robert Monroe considers that Locale III is not part of Locale II, where only thought is needed or used.
  - id: f086162f-c8b3-416f-9813-0cf9e5f22c9f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:26297-26393
    refs:
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      It might be a memory, racial or otherwise, of a physical earth civilization that predates known history.
    text: |-
      Robert Monroe speculates that Locale III might be a racial or other memory of a physical earth civilisation that predates known history.
  - id: 2ab49b3c-342e-4e36-a0cc-b4746e5af857
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:26402-26522
    refs:
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      It might be another earth-type world located in another part of the universe which is somehow accessible through mental manipulation.
    text: |-
      Robert Monroe speculates that Locale III might be another earth-type world located elsewhere in the universe, accessible through mental manipulation.
  - id: 50021089-4beb-446c-8b08-a9d15d36cd6a
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch14:26536-26698
    refs:
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
      - id: 9f41211f-b806-4236-be0a-7b8d6ac60f1d
        name: 'topic: antimatter theory'
    quote: |-
      It might be an antimatter duplicate of this physical earth-world where we are the same but different, bonded together unit for unit by a force beyond our present comprehension.
    text: |-
      Robert Monroe speculates that Locale III might be an antimatter duplicate of the physical earth-world, bonded unit for unit to it by a force beyond present comprehension.
