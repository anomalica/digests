        name: Second State
    quote: |-
      The most sound conjecture is that all perception in the Second State is achieved by means of some force in the electromagnetic spectrum—by direct magnetic fields either received or induced, or through some force or field yet to be identified—rather than by counterparts of the physical mechanisms.
    text: |-
      Robert Monroe considered that all perception in the Second State is most plausibly achieved by means of some force in the electromagnetic spectrum, by direct magnetic fields either received or induced, or through some as-yet-unidentified force or field.
