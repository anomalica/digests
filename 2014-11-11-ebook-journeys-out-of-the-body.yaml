    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      On one occasion, at least, it seemed to develop into a ring of sparks about two feet in diameter, with the axis of my body in the center of the ring. I could actually see this ring if I closed my eyes. The ring would start at the head and slowly sweep down to my toes and back to the head... The time of the cycle seemed to be some five seconds.
    text: |-
      In one vibration episode, Robert Monroe perceived a ring of sparks about sixty centimetres in diameter, centred on his body's axis, sweeping from head to toes and back in a cycle of about five seconds, visible to him with his eyes closed.
  - id: feede460-6707-45ea-b1bc-7bf601a4d86b
