        name: Robert Monroe
    quote: |-
      “Evening passed uneventfully, and I finally got into bed about 1:40 A.M., still wide awake (north-south position). The cat was lying in bed with me.
    text: |-
      On the evening of the concentration experiment, Robert Monroe got into bed at about 1:40 A.M., still wide awake, in a north-south position, with his cat lying in bed with him.
  - id: 58fd38ae-bb1a-4aa7-bd01-09ded0b796ae
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch8:19122-19395
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      After a long period of calming my mind, a sense of warmth swept over my body, with no break in consciousness, no pre-sleep. Almost immediately, I felt something (or someone) rocking my body from side to side, then tugging at my feet! (I heard the cat let out a complaining yell.)
    text: |-
      Robert Monroe reported that after a long period of calming his mind, a sense of warmth swept over his body with no break in consciousness and no pre-sleep, and he then felt something rocking his body from side to side and tugging at his feet, causing the cat to yell.
  - id: 8416de4a-1688-4716-8f0e-3f243bcb416e
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch8:19402-19542
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 887c485c-7724-4b9a-be31-62907ec3c665
        name: Charles T. Tart
    quote: |-
      I recognized immediately that this had something to do with Charlie’s experiment, and with full trust, did not feel my usual caution (about strangers).
    text: |-
      Robert Monroe recognized that the tugging sensation had something to do with Charles T. Tart's concentration experiment, and, trusting this, did not feel his usual caution about strangers.
  - id: 19f4f699-0566-4253-8887-d93f8a108272
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch8:19554-19682
    refs:
