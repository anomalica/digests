    quote: |-
      The most acceptable is the wave-vibration concept, which presumes the existence of an infinity of worlds all operating at different frequencies, one of which is this physical world.
    text: |-
      Robert Monroe considers the wave-vibration concept the most acceptable theory of Locale II's location, presuming an infinity of worlds operating at different frequencies, one of which is the physical world, interspersed with minimal interaction like electromagnetic wave frequencies.
  - id: c78d2b55-0ec3-4857-bba3-63db483b0f7b
