        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      By this time, you will have noticed the "roughness" of the vibrations at times, as if your body is being severely shaken right down to the molecular or atomic level.
    text: |-
      Robert Monroe described a 'roughness' in the vibrations of the State of Vibration, as if the body is being severely shaken down to the molecular or atomic level.
  - id: 6b49f1d7-1a4a-4cf8-80d6-ea7507f97f8a
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:22478-22544
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: This is accomplished by "pulsing" them mentally to increase their frequency.
    text: |-
      Robert Monroe stated that the roughness of the State of Vibration can be smoothed by mentally 'pulsing' the vibrations to increase their frequency.
  - id: c99ac35f-29aa-4a4b-a963-8a3cb2dda832
    type: measurement
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:22555-22712
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Their original vibratory rate seems to be on the order of some twenty-seven cycles per second (this is the rate of the vibration itself, not the head-to-toe frequency).
    text: |-
      Robert Monroe estimated the original vibratory rate of the State of Vibration to be on the order of about twenty-seven cycles per second, referring to the rate of the vibration itself rather than the head-to-toe sweep frequency.
  - id: 6ec5dcd8-e0ef-4c79-860d-8bd7776d8c30
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:22802-22962
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Your first indication of success is when the vibrations no longer seem rough and shaking. You are well on your way to control when they produce a steady, solid effect.
    text: |-
      Robert Monroe stated that a first indication of success in controlling the State of Vibration is when the vibrations no longer seem rough and shaking, and that mastery is indicated when they produce a steady, solid effect.
  - id: 39722fbd-9286-42a0-b69d-7366066bd8eb
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:22971-23112
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      It is essential that you learn and apply this speed-up process. The faster vibration effect is the form that permits disassociation from the physical.
    text: |-
      Robert Monroe considered learning and applying the speed-up process of the State of Vibration essential, describing the faster vibration effect as the form that permits disassociation from the physical body.
  - id: 493882b1-c7c0-4292-8c64-9f9b127e3122
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:23283-23506
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      They will increase their frequency—like a motor starting up—until the frequency is so high that you are unable to perceive it. At this phase, the sensory effect is one of body warmth, slightly tingling, but not excessively so.
    text: |-
      Robert Monroe described the vibrations of the State of Vibration as increasing in frequency like a motor starting up, until the frequency becomes too high to perceive, at which point the sensory effect is body warmth and slight tingling.
  - id: 9e05f7e0-ec72-4937-830f-c420c5d2caa1
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:23511-23617
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Consistent achievement of this stage is the sign that you are ready for the first physical disassociation experiments.
    text: |-
      Robert Monroe considered that consistent achievement of the imperceptible high-frequency stage of the State of Vibration is the sign of readiness for the first physical disassociation experiments.
  - id: a46fb695-11ca-468e-8c56-c3cceaafd0df
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:23672-23786
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      Beyond this point, I believe you cannot turn back. Ultimately, you will be committed to the reality of this other existence.
    text: |-
      Robert Monroe believed that once a practitioner passes beyond the point of consistently achieving the State of Vibration, they cannot turn back and will become committed to the reality of the out-of-the-body experience (OOBE).
  - id: 2ab6a17f-7abd-472a-8370-f679b654a88a
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:23930-24118
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      For once you have been "opened" to this other reality, you cannot completely shut it out again, try as you might. The pressure of material affairs may sublimate it for a time, but it will return.
    text: |-
      Robert Monroe stated that once opened to the reality of the out-of-the-body experience (OOBE), one cannot completely shut it out again, though the pressure of material affairs may sublimate it for a time before it returns.
  - id: d941209c-aea2-4679-bc93-22c31523a257
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:24126-24276
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      You cannot always stay on guard against its reopening. As you start to sleep or awaken, when you merely relax, the vibrational surge may come without call.
    text: |-
      Robert Monroe described that once a person can no longer stay on guard against the reopening of the State of Vibration, the vibrational surge may come unbidden as one starts to sleep or awaken, or merely relaxes.
  - id: 7316a6ad-25bb-477f-a4d8-67b623903464
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch25:16641-16702
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: In my early experimentation, I encountered this problem many times.
    text: |-
      Robert Monroe encountered the problem of fearing inability to re-enter the physical body many times during his early experimentation with separation from the physical body.
  - id: 3c0b4130-de2c-44a5-b979-415abbef6426
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch25:16782-16855
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      After careful analysis of hundreds of tests, an infallible technique was evolved.
    text: |-
      Robert Monroe developed an infallible return-to-physical-body technique after analysing hundreds of his own out-of-body tests.
  - id: ad709463-bb68-4d39-916f-9521fe16b068
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch25:16864-16938
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: The only guarantee that can be given is that it has continued to work for me.
    text: |-
      Robert Monroe states that his infallible return-to-physical technique has continued to work for him personally, though he offers no guarantee it will work for others.
  - id: 3682853c-e534-4277-a02b-edbcaf3e0e5f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch25:19060-19281
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It may be possible to achieve the latter if you have a deep emotional attachment to the locale, but the experiments to date have shown little success along this line. This, of course, may be due to the personality of the writer.
    text: |-
      Robert Monroe's attempts to travel out-of-body to a specific place rather than to a person have shown little success in his experiments to date, which he suggests may be due to his own personality.
  - id: 16c72ae0-5478-4fb4-bc71-43ff6eea8428
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
