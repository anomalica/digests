    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:7442-7852
    date: '1959-03-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      3/9/59 Night ... As I lay there with the vibrations strong in the dark, the special black darkness I could “see” with my closed eyes, the darkness grew brighter in one spot, as if clouds were parting, rolling back, and unfurling, and finally a white ray of light came through from somewhere above my head. (I could still hear the noises of family activity in the house and was still completely aware of time-space.)
    text: |-
      On 1959-03-09 at night, while Robert Monroe lay with strong vibrations in the dark, the darkness in his closed-eye vision grew brighter as if clouds were parting, and a white ray of light came through from above his head, while he could still hear family activity in the house and remained aware of time-space.
  - id: e258b55b-efb9-4f8b-8084-ba2905bcb403
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: 66-76
    date: '1959-03-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I gathered courage, and asked for the fundamental answer to my basic questions... “Are you sure you do want to know?” It came more from the light ray... “Are you strong enough to take the true answers?”... “Ask your father to tell you of the great secret.”
    text: |-
      On 1959-03-09, Robert Monroe asked a voice emanating from a white ray of light for the fundamental answer to his basic questions, and the voice asked "Are you sure you do want to know?" and "Are you strong enough to take the true answers?" before saying "Ask your father to tell you of the great secret."
  - id: d783cf1b-b3d9-4100-a882-53d40cf03f56
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:9384-9628
    date: '1959-03-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I wrote to my physical father, who was still alive and very interested in these events. I posed the question without giving him the source. He wrote back an elusive answer, stating that there were perhaps a half-hundred, and asking which one I wanted.
    text: |-
      After the 1959-03-09 vision, Robert Monroe wrote to his physical father about the "great secret" without revealing the source of the question, and his father replied evasively, stating there were perhaps a half-hundred such secrets and asking which one Robert Monroe wanted.
  - id: fe792368-5a88-493a-9474-046d143d2020
    type: testimony
