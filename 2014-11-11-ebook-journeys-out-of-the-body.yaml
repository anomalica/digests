        name: Robert Monroe
    quote: 'Reason for recall: Throat dry from oral breathing. Time away, forty-two minutes.'
    text: |-
      The 1962-11-27 misdirected visit lasted forty-two minutes and ended when Robert Monroe felt his throat become dry from oral breathing, prompting his return to the physical body.
  - id: cf0634b6-881f-4ab0-b924-163a9003ddf7
