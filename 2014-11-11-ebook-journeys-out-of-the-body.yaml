      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Paradoxically, the scientist today can conceive far more easily of the possibility of the area here labeled Locale III than that of Locale II. Why? Because it fits his latest discoveries in physics, small bits of evidence he has uncovered in his experiments with matter bombardment, accelerators, cyclotrons, etc.
    text: |-
      Robert Monroe considers Locale III more conceivable to a scientist than Locale II because it fits modern physics discoveries from experiments with matter bombardment, accelerators, and cyclotrons.
  - id: 523a1068-8065-469c-abe4-658bbeb4f927
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:1050-1323
    date: '1958-11-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 8aaf4365-1568-4fdf-a5c5-ec3bbcfd88bc
        name: 'topic: 180 degree (out-of-phase-back-away) separation method'
    quote: |-
      The moment I reached this 180° position (out of phase, opposite polarity?), there was a hole. That's the only way to describe it. To my senses, it seemed to be a hole in a wall which was about two feet thick and stretched endlessly in all directions (in the vertical plane).
    text: |-
      On 1958-11-05, Robert Monroe used the 180 degree (out-of-phase-back-away) separation method during an out-of-body experience and discovered a hole in a wall-like barrier that appeared to stretch endlessly and to be about sixty centimetres thick.
  - id: 212a7837-1735-4f42-a18c-23102d503f46
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:1334-1497
    date: '1958-11-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The periphery of the hole was just precisely the shape of my physical body. I touched the wall, and it felt smooth and hard. The edges of the hole were relatively rough.
    text: |-
      During the 1958-11-05 out-of-body experience, Robert Monroe observed that the periphery of the hole matched the exact shape of his physical body and that the wall felt smooth and hard with relatively rough edges.
  - id: 60228aed-ea4f-40a6-b622-1ec8b6db00e6
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:1562-1924
    date: '1958-11-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Beyond—through the hole—was nothing but blackness. It was not the blackness of a dark room, but a feeling of infinite distance and space, as if I were looking through a window into distant space... My impression, therefore, was of deep, outer space, beyond the solar system, far in an incredible distance.
    text: |-
      During the 1958-11-05 out-of-body experience, Robert Monroe perceived only blackness beyond the hole, which felt like infinite distance and space rather than the darkness of a room, giving the impression of deep outer space beyond the solar system.
  - id: e20f0045-ed97-4279-8aed-a5f80a7a9c73
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:1958-2107
    date: '1958-11-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I moved cautiously through the hole, holding onto its sides, and poked my head through carefully. Nothing. Nothing but blackness. No people, nothing material.
    text: |-
      During the 1958-11-05 out-of-body experience, Robert Monroe moved through the hole and put his head through but found nothing but blackness with no people or material objects present.
  - id: 8f08ca75-aeb9-4240-891b-61bb3a9e78de
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:2248-2357
    date: '1958-11-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It was broad daylight, just as when I had left what seemed a few minutes before. Lapsed time: one hour, five minutes!
    text: |-
      The 1958-11-05 out-of-body experience through the hole lasted one hour and five minutes of elapsed physical time while Robert Monroe felt it was only a few minutes.
  - id: 850b16e5-e07f-4b55-a6f0-f5ae5f3b12a9
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:2631-2787
    date: '1958-11-18'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Carefully, I reached a hand through into the blackness. I was astounded when a hand took mine and shook it! It felt like a human hand, normally warm to the touch.
    text: |-
      On 1958-11-18, during an out-of-body experience, Robert Monroe reached his hand through the hole into the blackness and felt a hand take his and shake it, which felt like a normally warm human hand.
  - id: 17613a69-5a85-4148-861b-ebee2e694053
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
