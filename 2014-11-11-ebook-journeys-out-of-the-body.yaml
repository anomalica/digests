        name: Robert Monroe
    quote: |-
      The person to be visited was performing no reportable act other than lying in bed sound asleep. These were discounted completely as evidence.
    text: |-
      Robert Monroe discounted late-night out-of-body experiments as evidence when the visited person was found merely sleeping, since that act is performed by most people every night.
