        name: USA, North Carolina
    quote: |-
      I am about to leave on what may be the first of four plane trips. This first will be to North Carolina. ... I have made me pause to think, and in view of other incidents, to review the experience related on 7/5/59.
    text: |-
      On 1959-07-24, Robert Monroe reviewed his 1959-07-05 vision before departing on the first of four planned plane trips, the first to North Carolina.
  - id: fc7a7039-27d3-49c7-9632-49cf74bd041a
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
