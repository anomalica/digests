    text: |-
      According to a story an entity called a "Helper" told Robert Monroe, the woman used her entire remaining wealth and power in anger and revenge to have a sign placed in the skies of Locale II so that all who saw it through eternity would know of the dishonesty of the church that had failed to fulfil its promise.
