    date: '1959-02-05'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      suddenly it felt as if I had thrust my hand into electrically charged hot water... The physical hand felt numb and tingling... The numbness and tingling slowly disappeared in about twenty minutes.
    text: |-
      On 1959-02-05, during an out-of-body experience, Robert Monroe felt as if his hand had been thrust into electrically charged hot water when reaching into the hole, leaving his physical hand numb and tingling for about twenty minutes afterward.
  - id: c6e4761b-ae98-465f-b49d-3d3ecc743ed2
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:8014-8176
    date: '1959-02-15'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I shoved away from the hole and performed the stretch-out in a direction exactly on a line away from the hole... I started to move, slowly, and soon accelerated rapidly... Fears about becoming lost began to creep in.
    text: |-
      On 1959-02-15, Robert Monroe pulled himself through the hole and attempted the stretch-out separation method moving away from the hole, accelerating to a very high speed before becoming afraid of being lost and turning back.
  - id: ffbabf58-e09a-42e0-b8d5-547a97f7fc94
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:8751-8847
    date: '1959-02-15'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I dove for it, went through, rotated, and sat up physically. Time away was three hours, fifteen minutes!
    text: |-
      The 1959-02-15 out-of-body excursion away from the hole lasted three hours and fifteen minutes of elapsed time.
  - id: 3e26f778-aa27-4893-94c1-e8f2a4fe450a
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:9053-9269
    date: '1959-02-23'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I immediately felt myself in the presence of someone standing there. I sensed his presence rather than saw him (impression, male)... I dropped thankfully in front of him and sobbed.
    text: |-
      On 1959-02-23, Robert Monroe pulled himself through the hole, stood up, and sensed the presence of a male figure, in front of whom he inexplicably dropped and sobbed before calming down and returning.
  - id: 18ffda41-b55a-424e-9a98-2700852bf417
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:9877-10183
    date: '1959-02-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      I was standing near a building (more like a barn than a house) on what was a wide, meadowlike area... There was what looked like a ladder a hundred feet or so away, and I went to it and realized it was a tower of some kind, about ten feet tall.
    text: |-
      On 1959-02-27, Robert Monroe went through the hole and, upon opening his eyes there, saw a wide meadow-like area with a barn-like building and a tower about three metres tall resembling a ladder.
  - id: 1701ee8c-5ac5-4b7c-98ea-3c58ed18067f
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch14:10307-10499
    date: '1959-02-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I climbed the tower to the top, leaped away in take-off—and fell promptly to the ground with a solid thud!... I held up my hands and arms in the stretch-out position, and went up easily.
    text: |-
      On 1959-02-27, after climbing the tower and leaping in an attempt to fly, Robert Monroe fell to the ground with a solid thud, apparently unable to fly there until using the proper stretch-out procedure.
  - id: d3666d05-1464-4043-bb38-f897c6f8f253
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
