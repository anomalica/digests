        name: Second Body
    quote: |-
      Second, this Second Body is visible under certain conditions. To be visible, it must either reflect or radiate light in the known spectrum, or at the least a harmonic in this area.
    text: |-
      Robert Monroe proposed that the Second Body is visible under certain conditions by either reflecting or radiating light in, or near, the known visible spectrum.
