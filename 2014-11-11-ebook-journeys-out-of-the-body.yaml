    quote: |-
      This time, I let myself float to the floor beside the cot. I fell slowly, and could feel myself passing through the various EEG wires on the way down.
    text: |-
      During the second separation of the EEG experiment, Robert Monroe let himself float to the floor beside the cot and felt himself passing through the various EEG wires on the way down.
