        name: Robert Monroe
    quote: |-
      In the spring of 1958 I was living a reasonably normal life with a reasonably normal family. Because we appreciated nature and quiet, ours was a country environment.
    text: |-
      In the spring of 1958, Robert Monroe was living what he considered a normal life with his family in a country environment.
  - id: 89f7b7bd-3869-4c9d-a32c-bf5f6af4824a
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:2699-2822
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fc757284-847d-48c9-be11-047f3db2771e
        name: 'topic: sleep learning (hypnopaedia)'
    quote: |-
      The only unorthodox activity was my experimentation with techniques of data learning during sleep—with myself as the chief subject.
    text: |-
      Robert Monroe was experimenting with techniques of learning during sleep (sleep learning, or hypnopaedia), using himself as the chief subject.
  - id: 54e5dc92-daa4-4fb1-b56c-5a25a4c487cd
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:2908-3194
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fc757284-847d-48c9-be11-047f3db2771e
        name: 'topic: sleep learning (hypnopaedia)'
    quote: |-
      While the rest of the family had gone to church, I conducted an experiment by listening to a particular tape recording in a highly isolated environment. It was a simple attempt to force concentration on a single intelligentsignal source (aural) with lowered signal input from the other senses.
    text: |-
      On a Sunday afternoon in 1958, while his family was at church, Robert Monroe conducted a sleep-learning experiment by listening to a tape recording in an isolated environment, attempting to force concentration on a single aural signal source with lowered input from other senses.
  - id: fca683dd-6fc3-4038-8d04-dd7fdb93d2ca
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:4032-4205
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      A little over an hour later, I was seized with a severe, iron-hard cramp which extended across my diaphragm or solar plexus area just under my rib cage... it was the first out-of-the-ordinary event, physical or otherwise, that took place.
    text: |-
      Roughly an hour after brunch, Robert Monroe experienced a severe, iron-hard cramp extending across his diaphragm/solar plexus area under his rib cage, which he later described as the first out-of-the-ordinary event that occurred.
  - id: a50c1878-f6bf-419e-b970-4d23dcc2655e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:4368-4673
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Other members of my family who had eaten the same food showed no signs of illness or discomfort... It was not appendicitis, as my appendix had been removed. I could breathe properly in spite of the pain, and my heart appeared normal in pulse rate.
    text: |-
      Robert Monroe ruled out food poisoning, appendicitis, and a cramped abdominal muscle as causes of the cramp, since he could breathe normally, his heart rate was normal, other family members who ate the same food showed no illness, and his appendix had already been removed.
  - id: b82150cc-dc52-4ba7-904b-1ded0ad05f8e
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:5415-5581
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      From one-thirty in the afternoon until around midnight, the cramp and pain continued... Sometime after twelve I fell asleep from pure exhaustion.
    text: |-
      The cramp and pain Robert Monroe experienced persisted from one-thirty in the afternoon until around midnight, and resolved after he fell asleep from exhaustion.
  - id: 9901a94b-562c-4b39-8e5c-d7d67ce58b8b
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:6476-6903
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I had just become prone (head to the north, if that had any meaning), when a beam or ray seemed to come out of the sky to the north at about a 30° angle from the horizon. It was like being struck by a warm light... The effect when the beam struck my entire body was to cause it to shake violently or "vibrate." I was utterly powerless to move.
    text: |-
      Some three weeks after the cramp episode, Robert Monroe experienced a second major event: while lying down for a nap on a Sunday afternoon, a beam or ray appeared to come from the sky to the north at about a 30 degree angle, causing his entire body to shake violently or vibrate, leaving him unable to move.
  - id: 54c7f004-f775-4b14-b183-a8b3e2d740d9
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:7033-7232
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Shocked and frightened, I forced myself to move... As I slowly sat upright on the couch, the shaking and vibration slowly faded away and I was able to move freely.
    text: |-
      Robert Monroe was able to end the vibration episode by forcing himself to sit upright, after which the shaking and vibration slowly faded and he could move freely again.
  - id: 8b90024a-ab88-485a-8145-c07a2357509a
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:7751-8065
    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Within the following six weeks, the same peculiar condition manifested itself nine times. It occurred at different periods and locales, and the only common factor was that it began just after I had lain down for rest or sleep. Whenever it took place, I fought myself to a sitting position, and the "shaking" faded away.
    text: |-
      Within six weeks of the first vibration episode, Robert Monroe experienced the same condition nine more times, always beginning shortly after he lay down for rest or sleep, and each time ending once he sat upright.
  - id: 6027f06e-b896-4165-904c-04a5db2d51c4
