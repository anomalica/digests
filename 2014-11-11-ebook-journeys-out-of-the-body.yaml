      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I telephoned Mr. Monroe that afternoon, and told him only that we would try to direct him across the country to our home at some unspecified time that night, without giving him any further details.
    text: |-
      Charles T. Tart telephoned Robert Monroe on the afternoon of the experiment and told him only that they would try to direct him across the country to their home at an unspecified time that night, without giving further details.
  - id: 3b4f7682-1589-4e32-8b0e-4ec5860388ad
