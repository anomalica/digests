        name: Robert Monroe
    quote: |-
      To date, I have not observed the death process in any experiments... Experiences similar to the following, consistent in content over the past twelve years, may be explained by some other concept.
    text: |-
      As of writing, Robert Monroe had not observed the death process in any of his experiments over the preceding twelve years.
  - id: a7c5df45-edd1-46ea-b07b-26f4c0984aef
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
