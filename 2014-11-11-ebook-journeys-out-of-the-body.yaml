    text: |-
      On 1959-03-15, Robert Monroe encountered a tall, thin, dark-skinned woman in a long robe who told him he had done something wrong and showed him a vision of a girl in a courtyard being forced by authorities to undergo a harmful act performed by a figure representing Robert Monroe within the scene.
