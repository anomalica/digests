    quote: |-
      Behind the first wave is row after row of the strange aircraft, literally hundreds of them. They are not like any airplanes I have seen before. No wings are visible, and each machine is gigantic, some three thousand feet across. Each is shaped like the head of an arrow, V-shaped ... I also feel fear, because I somehow know that these are not manmade.
    text: |-
      On 1961-11-05, Robert Monroe experienced a precognitive vision of hundreds of strange, wingless, arrow-headed aircraft each approximately 900 metres across, emerging in rows from cloud cover, which he sensed were not manmade.
