        name: Robert Monroe
    quote: |-
      Postulate: Locale II is a non-material environment with laws of motion and matter only remotely related to the physical world.
    text: |-
      Robert Monroe postulates that Locale II is a non-material environment with laws of motion and matter only remotely related to the physical world.
  - id: b61ba88d-9fda-4ba1-ad7d-976528af2ee9
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:1122-1416
    refs:
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It is an immensity whose bounds are unknown (to this experimenter), and has depth and dimension incomprehensible to the finite, conscious mind... It is inhabited, if that is the word, by entities with various degrees of intelligence with whom communication is possible.
    text: |-
      Robert Monroe considers Locale II to be an immensity of unknown bounds, with depth and dimension incomprehensible to the finite conscious mind, inhabited by entities of various degrees of intelligence with whom communication is possible.
  - id: bd3d7013-99e2-49a5-bb6b-9e63ee9d8d85
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:1615-1801
    refs:
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Time, by the standards of the physical world, is non-existent. There is a sequence of events, a past and a future, but no cyclical separation. Both continue to exist coterminously with "now."
    text: |-
      In Locale II, time as measured by physical-world standards is non-existent, with a sequence of past and future events that continue to exist coterminously with the present.
  - id: b8dc2202-ab6e-44cd-936d-9f3912a5507d
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:2164-2383
    refs:
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Locale II is a state of being where that which we label thought is the wellspring of existence. It is the vital creative force that produces energy, assembles "matter" into form, and provides channels of perception and communication.
    text: |-
      Robert Monroe considers thought to be the prime creative force in Locale II that produces energy, assembles matter into form, and provides channels of perception and communication.
  - id: b791af1c-9c1b-4ca3-bb42-e4fe358d090c
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:2598-2699
    refs:
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      No cars, boats, airplanes, or rockets are needed for transportation. You think movement, and it is fact.
    text: |-
      In Locale II, no mechanical means of transportation such as cars, boats, airplanes, or rockets are needed, since movement is accomplished by thought alone.
  - id: 306b3c56-bc48-4521-83f4-5310c1f8072e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
