    quote: |-
      Tonight I finally reached E.W. at home. It seems that my aim wasn't too far off. At approximately three twenty-five E.W. was walking down Main Street, and I was following directly over him, as nearly as we can figure.
    text: |-
      During the out-of-body visit to E.W. with physical corroboration, at approximately 3:25pm E.W. was walking down Main Street while Robert Monroe followed directly over him, as they later determined by comparing accounts.
  - id: d1fce119-ddbc-4f14-baf7-c04d406832b9
