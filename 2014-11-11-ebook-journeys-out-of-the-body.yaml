    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      I moved what seemed to be a short distance and stopped suddenly in a bedroom. A boy was lying in the bed, alone. He seemed about ten or eleven in age... The boy was lonely and afraid, and seemed ill. I stayed with him for some time, trying to comfort him, and finally left when he had calmed down, promising I would return.
    text: |-
      In an out-of-body experience, Robert Monroe encountered a lonely, frightened, ill boy about ten or eleven years old alone in a bedroom, comforted him, and left after he calmed down, promising to return.
  - id: 8e24af8d-7e8a-47af-8ef8-b9c10d49627e
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:13167-13415
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Several weeks later, I left the physical and was about to concentrate on a given destination when the same boy moved into view. He saw me and moved close to me. He was bewildered, but not afraid... "What do I do now?"... "Where do I go?"
    text: |-
      Several weeks after his first encounter with the boy, Robert Monroe again encountered the same boy in Locale II, who was bewildered but not afraid, and asked Robert Monroe what to do and where to go.
  - id: 8efb94ff-39d2-4e8d-8483-90d6058e2add
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:13767-14058
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I told him to wait right where he was, that some friends of his would be along shortly, that they would take him where he was supposed to go... Then I became nervous with a signal from the physical body, and patted him on the shoulder and left.
    text: |-
      Robert Monroe told the boy to wait where he was, saying friends would come to take him where he was supposed to go, then left after becoming nervous from a signal from his physical body.
  - id: 618ec8ed-3fe9-486b-b425-118768258eb2
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
