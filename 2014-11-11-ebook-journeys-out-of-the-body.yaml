    quote: |-
      Back into the physical was achieved simply, by thought of return. Opened physical eyes, all was fine, swallowed to wet my dry throat, closed my eyes, let the warmth surge up, then used the same roll-out technique.
    text: |-
      Robert Monroe returned to his physical body simply through the thought of return, opened his physical eyes, swallowed to wet his dry throat, then closed his eyes and used a roll-out technique to separate again.
