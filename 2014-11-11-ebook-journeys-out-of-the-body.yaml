        name: Charles T. Tart
    quote: |-
      Thus the time match with my wife and I beginning to concentrate was extremely good: he felt the tug pulling him from his body within a minute or so of when we started to concentrate.
    text: |-
      Robert Monroe felt a tug pulling him from his body within about a minute of when Charles T. Tart and his wife began to concentrate, matching the timing of the experiment closely.
  - id: 18056860-cdda-416a-9978-dca0000b5f98
    type: observation
