      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      I had been "out" several hundred times, and the evidence showed that I was able to return safely one way or another.
    text: |-
      Robert Monroe states he had been out of his body several hundred times and had returned safely on each occasion.
  - id: 8014358a-ad86-4d70-b3c2-6ea92bed02a1
    type: observation
