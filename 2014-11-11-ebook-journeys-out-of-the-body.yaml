    text: |-
      Robert Monroe identifies auto- or self-hypnosis as one method for achieving relaxation prior to out-of-body experimentation.
  - id: b1ecd6c3-3b2c-41e1-b982-fde858937b5e
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
