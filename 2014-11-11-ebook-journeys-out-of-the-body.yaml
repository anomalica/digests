        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      I nave observed in myself, although I do not like to admit it, which is that I am somewhat afraid of them. Part of me is very interested in the phenomenon scientifically, another part of me is excited at the prospect of personally experiencing it.
    text: |-
      Charles T. Tart admits he is somewhat afraid of out-of-the-body experiences, even though he is scientifically interested in the phenomenon and excited at the prospect of personally experiencing it.
  - id: 6ded657f-6e02-49d9-86ed-1a36be37fc09
    type: opinion
    attestation: first_hand
    speaker:
