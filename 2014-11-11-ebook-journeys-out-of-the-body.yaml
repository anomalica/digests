        name: Second Body
    quote: |-
      Visits to Locale I while in the Second Body should not contain strange beings, events, or places. Unfamiliar, perhaps, but not strange and unknown. If the latter is the case, then perception is distorted.
    text: |-
      Robert Monroe considers Locale I visits should not contain strange beings, events or places, and that if such strangeness occurs it indicates distorted perception.
  - id: 5a40dbf2-fb05-428c-8bd8-b62fd95206cf
    type: observation
