        name: Second State
    quote: |-
      Except in unusual instances, most "visual" input registers in shadings of black and white... For example, a strong light reflecting from the dark hair of a man brings the impression that he is blond rather than dark.
    text: |-
      Robert Monroe observed that during Second State visual perception of Locale I, most visual input registers in shades of black and white, with strong light and shadow producing false colour impressions, such as a dark-haired man appearing blond due to a light reflection.
  - id: 788b4b2d-cfe0-4365-b66f-531da021306f
