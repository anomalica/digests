      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: None of the relaxation-producing drugs that are readily available seem to help.
    text: |-
      Robert Monroe found that none of the readily available relaxation-producing drugs he tried seemed to help with achieving the out-of-body state.
  - id: 32080815-7ed7-4c04-8c6d-84c702bc28d3
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
