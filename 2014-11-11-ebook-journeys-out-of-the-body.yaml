        name: Robert Monroe
      - id: 947b528c-42ae-4a06-b54c-eb35de2999e7
        name: E.W.
    quote: |-
      Almost immediately after I lay down, I heard voices, and it sounded as if E.W. was discussing something with someone else... (E.W. reported he went immediately to sleep, did not speak with anyone prior, and has no recollection of the event at all.)
    text: |-
      On 1962-03-18, Robert Monroe heard what sounded like E.W. discussing something with someone else, but E.W. later reported he had gone immediately to sleep, had not spoken with anyone prior, and had no recollection of the event.
  - id: 8e15e929-d158-438b-b79b-d084687a07e5
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:5253-5652
    date: '1962-03-18'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Immediately after hearing this muffled conversation, I lifted out of my body, and a voice spoke almost over my shoulder. “If you feel you must know, I guess we’ll have to tell you.” With this, someone took me by the arm, and I went along willingly. We traveled what seemed a long distance and ended up in a darkened house. My distinct impression was that it was a club, fraternity, or similar headquarters.
    text: |-
      On 1962-03-18, immediately after hearing a muffled conversation, Robert Monroe lifted out of his body and a voice spoke near his shoulder saying "If you feel you must know, I guess we'll have to tell you," after which someone took him by the arm and led him to a darkened house that he sensed was a club, fraternity, or similar headquarters.
  - id: 7901f192-3c16-45fe-ad54-7f7a054d3590
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:5812-6316
    date: '1962-03-18'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      what looked like a 16mm. film projector started, and I saw a white light frame on a wall or screen... In handwriting, black on the white, was this message: For pure psychic results, take six drops of a chemical in a glass of water... I then saw what looked like film unwinding on the floor, and I thought I had broken the mechanism by tampering with it. This made me nervous, and I headed back for my body to avoid trouble, returned, and re-entered easily.
    text: |-
      On 1962-03-18, during this out-of-body experience, Robert Monroe saw a film projector display a handwritten message reading "For pure psychic results, take six drops of a chemical in a glass of water," and when he tried to reverse the projector to reread it he could not, then saw what looked like film unwinding on the floor and returned to his body believing he had broken the mechanism.
  - id: 4e84c1f3-b651-4439-9533-03c966a2741f
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:6594-6924
    date: '1960-05-03'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      5/3/60 Afternoon ... I lay there, fully conscious, vibrations speeded up to nothing but warmth sensation, eyes closed. I was about to lift out when two hands held a book in front of my closed eyes. The book was riffled, turned around on all sides so that I could see that it was a book. The book was then opened, and I started to read.
    text: |-
      On 1960-05-03 in the afternoon, while lying fully conscious with vibrations increasing to a warmth sensation and preparing to lift out of his body, Robert Monroe experienced two hands holding a book in front of his closed eyes, riffling and turning it so he could see it was a book, then opening it so he could read.
  - id: b8b40f2f-e674-495d-a5b8-544dde058092
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:6930-7234
    date: '1960-05-03'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The gist of what I read was that in order willfully to bring back a condition, it was necessary to recreate the feeling of a similar experience that had occurred in the past... I took this to mean that one should think of the “feeling,” rather than the details of the incident.
    text: |-
      On 1960-05-03, the book shown to Robert Monroe conveyed that in order to willfully bring back a condition, it was necessary to recreate the feeling of a similar experience that had occurred in the past, rather than the details of the incident.
  - id: 26fee3f2-d9fb-4db7-986a-1e5e2bb13ca8
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
