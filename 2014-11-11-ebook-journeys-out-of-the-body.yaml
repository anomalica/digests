        name: Second State
    quote: |-
      The answer may be that the latter is operating on some form of radiation-perception level, or in the case of the individual is more developed than the taste and smell patterns.
    text: |-
      Robert Monroe suggested that the sense of touch in the Second State may operate on some form of radiation-perception level, explaining why it was a prime input source despite an apparent dependence on physical contact.
  - id: e8426dfe-fa5a-4721-9857-cc7102730e72
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
