    quote: My random selection came out 11 P.M. California time, or 2 A.M. east coast time.
    text: |-
      Charles T. Tart randomly selected 11 P.M. California time (2 A.M. east coast time) for the concentration experiment, believing this would occur well after Robert Monroe would be asleep.
  - id: cf55face-c071-41d7-85ec-264edcc6ecc0
    type: observation
    attestation: first_hand
    speaker:
      id: 887c485c-7724-4b9a-be31-62907ec3c665
      name: Charles T. Tart
    provenance_chain:
      origin_kind: speaker
      origin: Charles T. Tart
    attribution_in_text: false
    location: ch8:18425-18613
    refs:
      - id: 887c485c-7724-4b9a-be31-62907ec3c665
        name: Charles T. Tart
    quote: |-
      At 11 P.M. my wife and I began our concentration. At 11:05 P.M. the telephone rang, interrupting it. We did not answer the telephone, but tried to continue our concentration until 11:30 P.M.
    text: |-
      Charles T. Tart and his wife began their concentration at 11 P.M. California time; the telephone rang at 11:05 P.M. interrupting it, and they did not answer but continued concentrating until 11:30 P.M.
  - id: 83b42b86-7156-4e07-b11d-16d86d2ec656
    type: administrative
