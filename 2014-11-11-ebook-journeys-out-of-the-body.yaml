    date: '1960-10-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I lay there and repeated, “My mind and body are open only to constructive forces; in the name of God and good, I am going into normal restful sleep.” I did, and awoke at my usual time in the morning. Before sleep came I had repeated the phrase at least twenty times.
    text: |-
      After the 1960-10-27 experience, Robert Monroe repeated a protective phrase invoking constructive forces and God before falling back asleep, having repeated it at least twenty times.
  - id: e9f6ccd3-53cb-4f84-889e-4cfac0b88cd1
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
