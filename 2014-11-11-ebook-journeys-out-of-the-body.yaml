    date: '1959-07-24'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      For more than ever, I believe that the physical body is but a machine for the use of “I.” Therefore, once “I” have departed, the body should mean nothing.
    text: |-
      Robert Monroe believed that the physical body is but a machine for the use of the "I", and that once the "I" departs, the body should mean nothing.
  - id: 00e7e818-8116-4549-895e-f0d56b2a1d27
