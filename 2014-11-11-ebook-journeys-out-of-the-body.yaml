        name: Robert Monroe
      - id: f8cfa4d4-d175-4a8f-935b-7cadee457891
        name: 1959-10 bus-to-airport and North Carolina trip fulfilment of 1959-07-05 vision
    quote: |-
      This is written some twelve weeks after the previous entry. Four of the twelve weeks were spent in a hospital, the remainder in a recuperative period at home.
    text: |-
      On 1959-10-23, Robert Monroe wrote a follow-up entry some twelve weeks after the previous entry, noting that four of the twelve weeks were spent in a hospital and the remainder in a recuperative period at home.
