    refs:
      - id: f1646012-9f64-4bda-b78a-b38b67cc3291
        name: 1961-01-09 silver cord discovery out-of-body experiment (Robert Monroe)
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: dc625e61-5866-47d0-90b9-ad4037a9b877
        name: Mrs. Bradshaw
      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
    quote: |-
      In response to a question brought up in discussion with Mrs. Bradshaw, I decided to see if there truly was a "cord" between the physical and the Second Body. ... Whatever it was extended out from a spot in my back directly between my shoulder blades ... I felt the base, and it felt exactly like the spread-out roots of a tree radiating out from the basic trunk.
    text: |-
      During the 1961-01-09 silver cord discovery out-of-body experiment, prompted by a discussion with Mrs. Bradshaw about whether a "cord" connected the physical and Second Body, Robert Monroe felt an object extending from a spot in his back between his shoulder blades, with a base like the spread-out roots of a tree.
  - id: c28c1a52-26d4-4e49-8c3e-a1b7b8839512
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch21:18027-18398
    date: '1961-01-09'
    refs:
      - id: f1646012-9f64-4bda-b78a-b38b67cc3291
        name: 1961-01-09 silver cord discovery out-of-body experiment (Robert Monroe)
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I reached outward, and it formed into a "cord," if you can call a two-inch-thick cable a "cord." It was hanging loosely, and I could feel its texture very definitely. It was body-warm to the touch and seemed to be composed of hundreds (thousands?) of tendonlike strands packed neatly together, but not twisted or spiraled. It was flexible, and seemed to have no skin covering.
    text: |-
      During the 1961-01-09 silver cord discovery out-of-body experiment, Robert Monroe found the cord to be roughly five centimetres thick, body-warm to the touch, composed of hundreds or thousands of tendon-like strands packed neatly together without twisting, flexible, and with no skin covering.
  - id: b33b63e3-3e6b-4f72-b395-4cd0d27d97ba
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
