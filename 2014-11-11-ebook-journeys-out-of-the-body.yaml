      10/12/60 Night / The results are so contradictory to what I believed that it must be reported in detail. In our attempts to find some answers, anywhere, we had come in contact with Mrs. M., who purportedly had mediumistic powers.
    text: |-
      On the night of 1960-10-12, Robert Monroe reported an out-of-body experience in which he first consulted Mrs. M., a woman he believed had mediumistic powers, regarding séances.
  - id: fb4fa28a-b19c-4792-a85f-ffc8959e88b9
    type: opinion
    attestation: first_hand
