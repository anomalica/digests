        name: Robert Monroe's 1959 heart attack (coronary occlusion)
    quote: |-
      In every physical examination I ever had, including two the previous week by two different insurance doctors, my heart was always pronounced very sound, with such statements as “You’ll never have to worry about your heart,” and “That’s one thing you won’t die of, any heart problem.”
    text: |-
      Robert Monroe had been examined by two different insurance doctors the previous week, and both pronounced his heart very sound, telling him he would never have to worry about his heart.
