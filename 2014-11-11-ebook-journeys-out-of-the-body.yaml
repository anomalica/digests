        name: Charles T. Tart
    quote: |-
      his continuing description of what our home looked like and what my wife and I were doing was not good at all: he “perceived” too many people in the room, he “perceived” me doing things I didn’t do, and his description of the room itself was quite vague.
    text: |-
      Robert Monroe's description of what Charles T. Tart's home looked like and what Tart and his wife were doing during the out-of-the-body visit was not accurate: he perceived too many people in the room, perceived Tart doing things he did not do, and gave a vague description of the room itself.
  - id: 8cca8ba5-4b28-4c94-90e6-f50782c02195
    type: opinion
    attestation: first_hand
    speaker:
      id: 887c485c-7724-4b9a-be31-62907ec3c665
      name: Charles T. Tart
    provenance_chain:
