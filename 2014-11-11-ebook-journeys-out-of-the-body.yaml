        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      By nine-thirty in the evening, all electrodes had been attached by the technician, who was the only person present when I arrived. I reclined on a temporary cot, in a semi-darkened room...
    text: |-
      During the 1966-07-19 EEG Experiment #EEG-5, a technician attached electrodes to Robert Monroe by 9:30 p.m. while he reclined on a cot in a semi-darkened room.
  - id: 5b839ccd-f488-46bf-8fd1-41d1c8316d56
