        name: 1958-06-11 floating and gravitic-weight out-of-body experience (Robert Monroe)
    quote: |-
      There, in the dim light below me, was the bed. There were two figures lying in the bed. To the right was my wife. Beside her was someone else... I looked more closely, and the shock was intense. *I* was the someone on the bed!
    text: |-
      While floating near the ceiling, Robert Monroe looked down and saw two figures lying in the bed below, his wife and another person, and realised with shock that the second figure was himself.
