        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      I went finally into the fractional relaxation pattern (count up from number one, associating each number with a body part...). After about forty five minutes of this without attaining full relaxation, I decided to take a break, sat up (halfway), and called to the technician.
    text: |-
      During the 1966-07-19 EEG Experiment #EEG-5, Robert Monroe used a fractional relaxation technique of counting up from one while associating each number with a body part, but after about forty-five minutes was unable to attain full relaxation and took a break to smoke a cigarette and talk with the technician.
  - id: 6cca546e-3633-42e0-9b5d-61df889643a1
