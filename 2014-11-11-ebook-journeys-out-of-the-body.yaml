        name: 'EEG Experiment #EEG-5 (1966-07-19)'
    quote: |-
      I tried to attract her attention, and was almost immediately rewarded with a burst of warm joy and happiness that I had finally achieved the thing we had been working for. She was truly excited, and happily and excitedly embraced me.
    text: |-
      During the out-of-body experience, the technician reacted to Robert Monroe's attempt to attract her attention with a burst of warm joy and happiness and embraced him.
  - id: a04fc3b1-1f87-4f03-950e-a9ec384b3b9f
