    date: '1960-10-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The bedclothes were undisturbed, so evidently there was no actual physical motion involved. My wife slept beside me undisturbed... it was most vivid, and certainly did not follow the usual pattern of dreams that I have.
    text: |-
      After the 1960-10-27 experience, Robert Monroe considers it unlikely to have been a dream, noting the bedclothes were undisturbed and his wife slept undisturbed beside him, and that the experience did not follow the usual pattern of his release-type dreams.
  - id: 76110248-382a-4fed-8f08-add4a142812e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
