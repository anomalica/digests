        name: Robert Monroe
      - id: 98ba4490-d1cc-4fdb-a7df-e38e683cc81c
        name: 'topic: precognition'
    quote: |-
      I could not and cannot produce the effect at will. It merely happened or was triggered by some non-conscious mechanism.
    text: |-
      Robert Monroe could not and cannot produce his precognitive vision effect at will; it merely happened or was triggered by some non-conscious mechanism.
  - id: 85671ae6-d85a-441d-b339-5f5356118446
    type: observation
    attestation: first_hand
    speaker:
