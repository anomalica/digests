      origin: Charles T. Tart
    attribution_in_text: true
    location: ch8:21221-21471
    refs:
      - id: 887c485c-7724-4b9a-be31-62907ec3c665
        name: Charles T. Tart
    quote: |-
      This is one of those frustrating events that parapsychologists encounter when working with poorly controlled phenomena. It is not evidential enough to say that it was unquestionably a paranormal effect, yet it is difficult simply to say that nothing happened.
    text: |-
      Charles T. Tart considers this event one of the frustrating cases parapsychologists encounter when working with poorly controlled phenomena, not evidential enough to call unquestionably paranormal, yet difficult to dismiss as nothing having happened.
