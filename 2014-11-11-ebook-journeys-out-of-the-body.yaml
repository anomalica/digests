        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      Only after repeating the process eighteen to twenty times did I finally gather enough courage (and curiosity) to stay out more than a few seconds and observe objectively.
    text: |-
      Robert Monroe states that only after repeating the out-of-body process eighteen to twenty times did he gather enough courage and curiosity to stay out of his body more than a few seconds and observe objectively.
