    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      I ended up in a parklike surrounding, with carefully tended flowers, trees, and grass, much like a large mall with paths crisscrossing the area. There were benches along the paths, and there were hundreds of men and women strolling by, or sitting on the benches. Some were quite calm, others a little apprehensive, and many had a dazed or shocked look of disorientation.
    text: |-
      On one out-of-body visit, Robert Monroe found himself in a parklike setting resembling a large mall with paths, where hundreds of men and women strolled or sat on benches, appearing calm, apprehensive, or dazed with disorientation.
  - id: 8039a297-908f-4834-869e-e90342b4e8a1
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch13:15595-15798
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Somehow I knew that this was a meeting place, where newly arrived waited for friends or relatives. From this Place of Meeting, these friends would take each newcomer to the proper place where he or she "belonged."
    text: |-
      Robert Monroe concluded that the parklike setting he visited in Locale II was a meeting place where newly arrived beings waited for friends or relatives who would take each newcomer to the proper place where they belonged.
  - id: 38a58634-e066-4cea-809d-ffabb142d9b1
    type: testimony
    attestation: first_hand
    speaker:
