        name: 1960-10-10 out-of-body visit to R.W. (Robert Monroe)
    quote: |-
      I then turned to R.W., and I asked if she knew I was there. "Oh yes, I know you are here," she replied (mentally, or with that superconscious communication, as she was still in oral conversation with the two girls).
    text: |-
      Robert Monroe, while out-of-body, asked R.W. if she knew he was there, and she replied mentally that she knew he was there while simultaneously in oral conversation with two girls.
  - id: db3f1c48-6a39-49cd-8b84-aa5b1f2d5fba
