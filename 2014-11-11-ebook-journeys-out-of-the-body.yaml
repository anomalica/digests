        name: State of Vibration
    quote: |-
      9/14/58 ... Early evening, on the porch, into relaxation system. Immediate high-frequency vibration. Experimented flipping in and out of the physical. On one, had difficulty in re-entering. Two hands took my hips and rolled me into proper position. I mentally sent my thanks, but didn’t know who it was.
    text: |-
      On 1958-09-14, in early evening on his porch, Robert Monroe entered a relaxation system and experienced an immediate high-frequency vibration while experimenting with flipping in and out of the physical body, and on one occasion had difficulty re-entering until two hands took his hips and rolled him into proper position.
  - id: 61c03128-a7ea-414e-834a-40795c26ca8e
