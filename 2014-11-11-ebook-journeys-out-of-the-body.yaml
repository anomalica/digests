    quote: |-
      There was the familiar sensation of movement through a light blue blurred area, then I was in what seemed to be a kitchen. R.W. was seated in a chair to the right. She had a glass in her hand. She was looking to my left, where two girls (about seventeen or eighteen, one blond and one brunette)
    text: |-
      During his out-of-body attempt on 1963-08-15, Robert Monroe perceived R.W. seated in a kitchen holding a glass, with two teenage girls, one blonde and one brunette, also seated nearby holding drinks.
  - id: 4768ec89-ab3e-4787-87e6-aa85481251e4
