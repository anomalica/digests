        name: 'topic: precognition'
    quote: |-
      Early in the experimentation, a side effect began to manifest itself. It was not an out-of-body activity as such, but took place in states of deep relaxation prior to any separation.
    text: |-
      Early in Robert Monroe's out-of-body experimentation, a side effect began to manifest that was not an out-of-body activity but occurred during states of deep relaxation prior to any separation.
