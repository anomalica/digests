        name: D.D.
    quote: |-
      During the early morning, the “valve” opened again, and what I saw has concerned me only because it was so vivid. I was about to board a commercial airplane. Standing by the door of the plane waiting was D.D., a man I’ve known for more than ten years.
    text: |-
      On 1959-07-05, during the early morning, Robert Monroe experienced a precognitive vision of boarding a commercial airplane where D.D., a man he had known for more than ten years, was standing by the door of the plane.
  - id: e2927d77-6c35-454f-bd47-35c8945ef576
