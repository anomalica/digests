        name: Fear Barrier
    quote: |-
      The third basic fear was fear of the unknown... Now, suddenly, here is another, completely different set of rules, another world of entirely different possibilities.
    text: |-
      Robert Monroe identifies a third basic fear within the Fear Barrier as fear of the unknown, arising because out-of-body existence follows a completely different set of rules from the physical world.
