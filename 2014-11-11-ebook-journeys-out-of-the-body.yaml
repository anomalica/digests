        name: Second Body
    quote: |-
      It can be inferred from this survey that the majority of activities in the Second Body had to do with humanoid-type intelligences operating in familiar or similar backgrounds and using identifiable objects.
    text: |-
      Robert Monroe observed that most activities in the Second Body involved humanoid-type intelligences operating in familiar or similar backgrounds and using identifiable objects.
