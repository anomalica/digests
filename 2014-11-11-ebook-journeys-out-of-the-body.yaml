        name: Second Body
    quote: |-
      In terms of perceived data, the greatest weakness was found in the attempt to apply known physical, scientific, historical, and social structures to the experiences while in the Second Body.
    text: |-
      Robert Monroe found that the greatest weakness in his classification of perceived data was in applying known physical, scientific, historical, and social structures to experiences while in the Second Body.
