    text: |-
      On 1960-08-03, Robert Monroe experienced a precognitive vision of an airplane passing overhead in trouble with flaps and landing gear lowered, crashing behind a nearby hill, burning slowly with a deep red glow that he recognised as different from an ordinary gasoline fire.
