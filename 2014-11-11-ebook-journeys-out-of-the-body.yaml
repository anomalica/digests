        name: Robert Monroe
    quote: |-
      Thus it is that the only evidential results provable by standard methods of confirmation have taken place while moving about via the Second Body in Locale I.
    text: |-
      The only evidential results provable by standard methods of confirmation in Robert Monroe's out-of-body research took place while travelling via the Second Body in Locale I.
  - id: 7f4f96fa-cb58-4f39-a4f7-b76fc7649118
