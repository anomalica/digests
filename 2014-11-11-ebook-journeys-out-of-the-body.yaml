    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Suddenly, I became fully aware of the situation. I was wide awake. I could see the moonlit landscape through the window... Yet, impossibly, my hand was playing in a pool of water, and my arm felt as if it was stuck down through the floor.
    text: |-
      Robert Monroe described feeling fully awake and aware of his physical surroundings (the moonlit landscape, the bed covers, his own breathing) while simultaneously feeling his arm was stuck down through the floor into a pool of water.
  - id: ba3d7ef5-df42-4713-b63d-3fbb824fff61
    type: observation
    attestation: first_hand
