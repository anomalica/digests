      - id: a69cb66f-4b85-4b59-a1ca-067d21a5640a
        name: mediumship
    quote: |-
      I came away with the definite impression that Mrs. M., although deeply sincere, was acting out some form of split personality when she went into a trance. The 'guides' who took over her body... were to me nothing more or less than manifestations of this.
    text: |-
      Robert Monroe considered that the "guides" who spoke through Mrs. M. during her trance sittings were manifestations of a self-induced hypnotic or split-personality state rather than genuine spirit communication.
