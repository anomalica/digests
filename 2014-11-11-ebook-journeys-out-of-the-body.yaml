      I would have no desire in the world to go to a restaurant in New York City, a place I dislike intensely, if I were having an OOBE, although visiting Carie and her family is always very pleasant.
    text: |-
      Charles T. Tart states he would have no desire to go to a restaurant in New York City, a place he dislikes intensely, whereas visiting Carie and her family is always very pleasant to him.
