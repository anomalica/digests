        name: Robert Monroe
      - id: 0930d7ad-9f49-4012-940d-a97e120af1ad
        name: USA, New York, New York City
    quote: |-
      Slowly, I reached into the hole again. The hand shook mine again, and placed a card in it. I withdrew my hand and "looked" at the card. It gave a specific address... I will have to investigate this address on Broadway, if it is in New York.
    text: |-
      On 1958-11-18, the hand on the other side of the hole placed a card in Robert Monroe's hand giving a specific address, which Robert Monroe intended to investigate as possibly being on Broadway in New York City.
  - id: a6a0fa01-8c3e-4aa0-a82e-bc8aebdd3dd3
    type: observation
    attestation: first_hand
    speaker:
