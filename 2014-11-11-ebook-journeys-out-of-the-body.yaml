        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      Question: What happens to the laboratory animal once the experiment is completed?
    text: |-
      Robert Monroe proposes the hypothesis that humanity may be the equivalent of laboratory animals being used in an experiment by more advanced beings.
  - id: 7f5c19d5-b365-4ffa-a202-9197bd6afae7
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:3524-3661
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 28c8099d-1022-49f0-bffa-ce60c899c628
        name: 'topic: psi force'
      - id: f03e382e-2436-4b80-ab01-b8c4989d964d
        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      Such forces in the order of perception and application are: (1) psionic (creative thought energy), (2) biochemical, (3) nuclear, and (4) gravitational.
    text: |-
      Robert Monroe's laboratory animal hypothesis proposes that sentient beings evolving on a planet first perceive and use psi force (creative thought energy), followed by biochemical, then nuclear, then gravitational forces.
  - id: c4be160c-3bc3-4ac8-9569-cdb7fcf205ee
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:6601-6681
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: f03e382e-2436-4b80-ab01-b8c4989d964d
        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      The researchers discovered the source to be the third planet in a Class 10 star system.
    text: |-
      In Robert Monroe's laboratory animal hypothesis, an advanced intergalactic society detected low-order psi-force emanations from a new society on the third planet of a Class 10 star system and dispatched an ecological team to investigate.
  - id: ea531655-cbc0-41ba-a937-8b85a374514d
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:8462-8648
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: f03e382e-2436-4b80-ab01-b8c4989d964d
        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      When psi communication was attempted, the inhabitants either fled in panic or prostrated themselves and emanated strong psi reactions to the effect that they were in the presence of the Creator.
    text: |-
      In Robert Monroe's laboratory animal hypothesis, the investigating researchers found that the planet's population had no knowledge or use of the psi force and reacted to psi communication either by fleeing in panic or by prostrating themselves as if in the presence of the Creator.
  - id: 467895ec-b47b-4746-bbed-089c2658410b
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:9820-9993
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: f03e382e-2436-4b80-ab01-b8c4989d964d
        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      Routine psi monitoring plus referential advice from non-matter intelligences show that the society in question has surprisingly entered the nuclear stage while still in the biochemical.
    text: |-
      In Robert Monroe's laboratory animal hypothesis, the society under observation entered the nuclear stage of technological development while still in the biochemical stage, an unusual and unexpected sequence.
  - id: a9e601ca-1226-4ad2-aafc-e24e9ef9471e
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:13008-13148
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: f03e382e-2436-4b80-ab01-b8c4989d964d
        name: 'topic: laboratory animal hypothesis (extraterrestrial experimentation premise)'
    quote: |-
      If such communication and/or experimentation was and is now being attempted, it could account for much that is left unanswered in our human history.
    text: |-
      Robert Monroe considers that his laboratory animal hypothesis, if true, could account for much that is unanswered in human history and would recast events historically ascribed to God and his assistants in more prosaic terms.
  - id: 62090f7f-5497-4c67-a496-e038e601ef7b
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:14400-14714
    date: '1960-09-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 98511990-859c-465e-8982-3ce5f50c91de
        name: 1960-09-09 intelligence force beam contact experience (Robert Monroe)
    quote: |-
      I was lying in a north-south position, when I suddenly felt bathed in and transfixed by a very powerful beam that seemed to come from the north, about 30° above the horizon, I was completely powerless, with no will of my own, and I felt as if I were in the presence of a very strong force—in personal contact with it.
    text: |-
      On the night of 1960-09-09, Robert Monroe experienced being bathed in and transfixed by a powerful beam that seemed to come from the north, about 30 degrees above the horizon, leaving him completely powerless.
  - id: edfe2031-1f6f-4a4e-866e-6831e31596a4
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:14721-14957
    date: '1960-09-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 98511990-859c-465e-8982-3ce5f50c91de
        name: 1960-09-09 intelligence force beam contact experience (Robert Monroe)
    quote: |-
      It had intelligence of a form beyond my comprehension, and it came directly (down the beam?) into my head, and seemed to be searching every memory in my mind. I was truly frightened because I was powerless to do anything about this intrusion.
    text: |-
      During the 1960-09-09 intelligence force beam contact experience, Robert Monroe perceived an intelligence entering his head just above the forehead and searching every memory in his mind, which frightened him because he was powerless to stop the intrusion.
  - id: 025e1ef5-12e7-40d3-8520-cfd291098e53
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:14971-15224
    date: '1960-09-09'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 98511990-859c-465e-8982-3ce5f50c91de
        name: 1960-09-09 intelligence force beam contact experience (Robert Monroe)
    quote: |-
      This intelligence force entered my head just above the forehead, and offered no calming thoughts or words. It didn’t seem to be aware of any of my feelings or emotions. It was looking impersonally, hurriedly, and definitely for something specific in my mind.
    text: |-
      During the 1960-09-09 intelligence force beam contact experience, the intelligence force offered no calming thoughts, seemed unaware of Robert Monroe's feelings or emotions, and searched impersonally and hurriedly for something specific before leaving.
  - id: cc6e98a3-10db-41e9-8ff3-257206feb039
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:15374-15873
    date: '1960-09-16'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 08d1c5df-86cb-4be7-8d2b-1f15323ff514
        name: 1960-09-16 pumping station intelligence force contact experience (Robert Monroe)
    quote: |-
      The same impersonal probing, the same power, from the same angle. However, this time I received the firm impression that I was inextricably bound by loyalty to this intelligence force, always had been, and that I had a job to perform here on earth... The impression was that I was manning a “pumping station,” that it was a dirty, ordinary job but it was mine and I was stuck with it, and nothing, absolutely nothing could alter the situation.
    text: |-
      On the night of 1960-09-16, Robert Monroe experienced the same impersonal probing and power from the same angle as on 1960-09-09, and received the impression that he was bound by loyalty to the intelligence force and was assigned a job on earth described as manning a "pumping station".
  - id: f2e8e2db-494c-4575-a067-7e88f8ba02d2
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:15887-16436
    date: '1960-09-16'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 08d1c5df-86cb-4be7-8d2b-1f15323ff514
        name: 1960-09-16 pumping station intelligence force contact experience (Robert Monroe)
    quote: |-
      I got the impression of huge pipes, so ancient they were covered with undergrowth and rust. Something like oil was passing through them, but it was much higher in energy than oil, and vitally needed and valuable elsewhere... there were other force groups here, taking out the same material on some highly competitive basis, and the material was convertible at some distant point or civilization for something very valuable to entities far above my ability to understand.
    text: |-
      During the 1960-09-16 pumping station intelligence force contact experience, Robert Monroe perceived ancient huge pipes covered with rust through which a substance like oil, of much higher energy value, was passing and being extracted by competing force groups for use elsewhere.
  - id: 2a8da526-c1e6-4aa3-8de3-7453194124b6
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:16451-16698
    date: '1960-09-16'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 08d1c5df-86cb-4be7-8d2b-1f15323ff514
        name: 1960-09-16 pumping station intelligence force contact experience (Robert Monroe)
    quote: |-
      Again, the intelligence force moved out and away quickly, and the visitation ended. I got up after a bit, feeling depressed, and went into the bathroom in our house, and actually felt I should wash my hands after working (although my hands were clean).
    text: |-
      After the 1960-09-16 pumping station intelligence force contact experience ended, Robert Monroe felt depressed and had an urge to wash his hands despite them being clean, as if he had been working.
  - id: 161c35f9-b4c6-4882-a6b5-8d8bf618374c
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:16726-16956
    date: '1960-09-30'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 447f890a-4532-4f2f-b7b2-7482c5f0b747
        name: 1960-09-30 breathing-pouch intelligence force contact experience (Robert Monroe)
    quote: |-
      The same pattern as 9/16. Again, there was the feeling of being the pumping station attendant, the approach of the entity down the beam (?), the search of my mind, this time even to see what specifically controlled my breathing apparatus.
    text: |-
      On the night of 1960-09-30, Robert Monroe experienced the same pattern of contact as on 1960-09-16, including the sense of being a pumping station attendant, and this time the entity searched to see specifically what controlled his breathing apparatus.
  - id: 2e4ce5ac-6a71-4b55-87b5-49d3aad003ca
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch28:17090-17267
    date: '1960-09-30'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 447f890a-4532-4f2f-b7b2-7482c5f0b747
        name: 1960-09-30 breathing-pouch intelligence force contact experience (Robert Monroe)
    quote: |-
      a picture was shown (in my mind) of a pouch, possibly two by three inches, and one inch thick, hung on a belt at the waist, with the statement “This is how we are breathing now.”
    text: |-
