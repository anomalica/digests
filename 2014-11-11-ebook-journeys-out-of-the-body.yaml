    date: '1962-11-27'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I concentrated on the man, and asked his name and where he lived. He replied nervously... Comment: Through a check by phone, I have located this family at the address which the man gave me.
    text: |-
      During his 1962-11-27 misdirected out-of-body visit, Robert Monroe asked the man on the bed his name and where he lived, and afterward located the family by telephone at the address the man gave him.
  - id: 5d354a2c-d6b4-4563-b13a-44e749dbdbdf
