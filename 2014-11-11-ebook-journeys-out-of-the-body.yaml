        name: Robert Monroe
    quote: |-
      The following morning I telephoned Mr. Monroe and told him only that the results had been encouraging, and that he should write down an independent account of what he had experienced for later comparison against our independent accounts.
    text: |-
      The morning after the concentration experiment, Charles T. Tart telephoned Robert Monroe and told him only that the results had been encouraging, and asked him to write an independent account of what he had experienced for later comparison.
  - id: 2ace7ad2-3119-45db-94d3-5b698cd4115a
    type: testimony
    attestation: first_hand
    speaker:
