        name: Robert Monroe
    quote: |-
      My fingers seemed to penetrate the rug and touch the floor underneath... My hand touched water. Without excitement, I splashed the water with my fingers.
    text: |-
      During one nighttime vibration episode, Robert Monroe found he could move his fingers, and on pushing his hand downward it seemed to penetrate the rug, the floor, and the ceiling of the room below, where he felt a triangular chip of wood, a bent nail, and sawdust, before his hand touched water.
  - id: 278c9d51-cdb2-4f49-8620-f8b4d3bf040c
    type: testimony
    attestation: first_hand
