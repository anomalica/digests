    text: |-
      During his second attempt in the 1968 California session, Robert Monroe's brain-wave pattern showed much light sleep, so after three quarters of an hour Charles T. Tart called out to him over the intercom to remind him that they wanted him to try to produce an out-of-the-body experience (OOBE).
