    quote: |-
      A third: In the office, the valve opened, to reveal a red light with the words “Oil Pressure.” An hour later, driving home in a nearly new car, the red Oil Warning light flashed on. ... The car had less than five hundred miles since it was new, and had just been checked. The new car had an oil leak.
    text: |-
      In an office, Robert Monroe had a precognitive vision of a red light with the words "Oil Pressure", and an hour later, driving home in a nearly new car with less than 800 kilometres, the red oil warning light flashed on due to an oil leak.
