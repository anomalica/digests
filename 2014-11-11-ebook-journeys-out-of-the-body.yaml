      Desperately, like a diver, I swooped down to my body and dove in. I then felt the bed and the covers, and when I opened my eyes, I was looking at the room from the perspective of my bed.
    text: |-
      Believing he was dying, Robert Monroe dove back down into his body, after which he felt the bed and covers and found himself looking at the room again from his body's normal perspective.
