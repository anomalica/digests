        name: 1960-07-07 Faraday cage out-of-body experiment (Robert Monroe)
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      In thinking it over, quite evidently it was not the wire itself, but the electrical field pattern set up in fundamentally the same shape as the cage, but more flexible. Maybe this could be the basis for a "ghost catcher!"
    text: |-
      Robert Monroe concluded from the 1960-07-07 Faraday cage out-of-body experiment that what obstructed him was not the wire of the cage itself but the electrical field pattern set up in the same shape as the cage, and suggested this could form the basis of a "ghost catcher."
