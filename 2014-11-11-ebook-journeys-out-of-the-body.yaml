      A while later, he reported having produced an OOBE, but being unsure of his orientation, he followed a wire which he thought led to the recording room, and instead found himself outside in a strange area that he never recalled seeing before.
    text: |-
      Robert Monroe reported producing a second out-of-the-body experience (OOBE) during the 1968 California session but, being unsure of his orientation, followed a wire he thought led to the recording room and instead found himself outside in a strange area he never recalled seeing before.
