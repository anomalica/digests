        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      It is as if a surging, hissing, rhythmically pulsating wave of fiery sparks comes roaring into your head. From there it seems to sweep throughout your body, making it rigid and immobile.
    text: |-
      Robert Monroe describes the State of Vibration as manifesting like a surging, hissing, rhythmically pulsating wave of fiery sparks that sweeps into the head and throughout the body, making it rigid and immobile.
  - id: 331f4e11-b9ed-4971-9729-8fccae247046
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
