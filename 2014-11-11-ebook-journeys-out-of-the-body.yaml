        name: Robert Monroe
      - id: 887c485c-7724-4b9a-be31-62907ec3c665
        name: Charles T. Tart
    quote: |-
      Still trusting, and a little excited, I expressed willingness to go to Charlie, if that was where he (it) wanted to lead me.
    text: |-
      Robert Monroe reported that, still trusting and a little excited, he expressed willingness to go to Charlie (Charles T. Tart) if that was where the presence wanted to lead him.
  - id: 1ea51156-09f8-4cd8-a3a2-d5a077ee8012
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
