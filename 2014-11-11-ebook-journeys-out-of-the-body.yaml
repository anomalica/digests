      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
    quote: |-
      However, the trend is reversed when examination is made of the event itself or the action involved. Here it is illustrated that much is beyond my experience and knowledge.
    text: |-
      Robert Monroe found that the events and actions themselves in the Second Body were largely beyond his prior experience and knowledge, in contrast to the familiarity of the intelligences and objects encountered.
