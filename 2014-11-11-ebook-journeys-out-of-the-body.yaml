        name: E.W.
    quote: |-
      I suddenly found myself over a business street, moving slowly about twenty-five feet above the sidewalk ... I recognized the street to be the main street of the town ... noticed a filling station on the corner, where a white car had both rear wheels off in front of two open grease rack doors.
    text: |-
      During the out-of-body visit to E.W. with physical corroboration, Robert Monroe found himself moving roughly 7.6 metres above a sidewalk on the main street of a town, noticing a filling station on the corner with a white car that had both rear wheels off in front of two open grease rack doors.
  - id: 1c40af26-9e1a-47c6-8dec-be36942c32c2
