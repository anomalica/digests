        name: 1960-07-07 Faraday cage out-of-body experiment (Robert Monroe)
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 6126b097-d2bd-45cb-8aab-673c852e1481
        name: Faraday cage
    quote: |-
      I was in the charged Faraday cage (copper screen mesh, above ground, D.C. charge 50kv.). I attempted to move through the cage. I got out of the physical OK, then I seemed to be entangled in a large bag made of flexible wire. The bag gave when I pushed against it, but I couldn't go through it.
    text: |-
      During the 1960-07-07 Faraday cage out-of-body experiment, Robert Monroe attempted to move his out-of-body form through a charged Faraday cage made of copper screen mesh with a 50-kilovolt direct-current charge, and became entangled as if in a flexible wire bag that gave when pushed but could not be passed through.
  - id: 6e386c89-f4f7-4d97-b556-d5c5100aee12
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
