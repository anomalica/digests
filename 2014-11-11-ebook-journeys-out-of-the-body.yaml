        name: USA, Pennsylvania, Coshocton
    quote: '"You were last a monk in Coshocton, Pennsylvania," he replied.'
    text: |-
      During this visit, a man wearing a monk's robe who seemed hauntingly familiar to Robert Monroe told him he had last been a monk in Coshocton, Pennsylvania.
  - id: 759a222b-7340-4042-a886-bb4052a587da
