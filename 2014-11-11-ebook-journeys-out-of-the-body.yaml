      It is Tuesday after the Saturday of the experiment. R.W. returned to work yesterday, and I asked her what she had been doing Saturday afternoon between three and four.
    text: |-
      On the Tuesday after the Saturday experiment, Robert Monroe asked R.W. what she had been doing on Saturday afternoon between three and four o'clock without telling her his reason.
  - id: 684ebf47-c9cf-4da7-ba6c-768105a1bd94
    type: testimony
    attestation: first_hand
    speaker:
