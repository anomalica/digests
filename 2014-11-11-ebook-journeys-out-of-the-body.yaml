    quote: |-
      I held my breath, or thought of so doing, and the panting stopped in my ear. I breathed again, once, twice, then held my breath again. The "body" behind me panted in exact synchronization. The warm body clinging to my back was me!
    text: |-
      During the 1960-05-22 whiskers self-identification out-of-body experience, Robert Monroe determined that when he held his breath the panting of the entity behind him stopped, and when he breathed the panting resumed in exact synchronisation, concluding the warm body clinging to his back was himself.
