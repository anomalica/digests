        name: Robert Monroe
      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Upon disassociating into the Second Body, I started to move rapidly as I concentrated upon the thought, I wish to go where there are higher intelligences... Finally, I stopped. I was in a narrow valley which seemed normal in all respects. There were men and women in ankle-length robes, dark in color.
    text: |-
      While deliberately seeking higher intelligences during an out-of-body experience, Robert Monroe arrived in a narrow valley with men and women wearing ankle-length dark robes.
  - id: 49c3b5a8-b8fd-4397-b2cc-56cbf188ca1b
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
