    quote: |-
      They were in the kitchen-dining area of the cottage from about three-fifteen to four, and she was having a drink, and the girls were having Cokes. They were doing nothing but sitting and talking.
    text: |-
      R.W. reported that she and the two girls were in the kitchen-dining area of the beach cottage from about three-fifteen to four o'clock, with R.W. having a drink and the girls having Cokes, doing nothing but sitting and talking.
