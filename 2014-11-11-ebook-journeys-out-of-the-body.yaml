    quote: |-
      3/5/59 Morning / In a motel in Winston-Salem... the first thing I saw was a boy walking along and tossing a baseball in the air and catching it. A quick shift, and I saw a man trying to put something into the back seat of a car... One person was dealing what looked like large white playing cards around to the others at the table.
    text: |-
      On the morning of 1959-03-05, while staying in a motel in Winston-Salem, Robert Monroe had an out-of-body experience in which he saw a boy tossing a baseball, a man loading an awkward device into a car, and people at a table with a person dealing large white cards.
