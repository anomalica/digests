    quote: |-
      I tried to move the physical arms, but could not do so. I tried to move the glowing arm-outlines, and they "worked" perfectly. I tried to feel with my physical arms, but could determine no sensation. With the glowing outline arms, I clasped my hands together, and they felt completely normal.
    text: |-
      During the 1958-07-19 glowing-arms outline out-of-body experience, Robert Monroe could move and feel sensation with the glowing outline arms while being unable to move or feel sensation with his physical arms.
