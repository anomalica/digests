      Four days later, on a Monday morning in the middle of a quiet, friendly chat in an office, I suffered what was later diagnosed to be a heart attack (coronary occlusion), and was taken to the hospital.
    text: |-
      Four days after landing in North Carolina, on a Monday morning during a quiet chat in an office, Robert Monroe suffered what was later diagnosed as a heart attack (coronary occlusion) and was taken to the hospital.
