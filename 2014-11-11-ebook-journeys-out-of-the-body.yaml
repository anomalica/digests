    quote: |-
      Observation via Second Body in Locale I (Here-Now) proved that the most ordinary functions or actions were subject to misinterpretation, especially when observed out of context.
    text: |-
      Robert Monroe found through observation via the Second Body in Locale I that the most ordinary functions or actions were subject to misinterpretation, especially when observed out of context.
