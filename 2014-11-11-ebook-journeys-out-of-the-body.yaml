    quote: |-
      This time, I stopped right in the middle of the layer as the “fish” came clustering around, attracted by me. Instead of reacting as before, I simply waited, completely immobile. After a few moments, they detached themselves and moved away.
    text: |-
      During an out-of-the-body experience on 1961-11-03 night, Robert Monroe found that remaining completely immobile within a layer of the small fish-like 'sucker' entities caused them to detach and move away, whereas moving caused them to return.
  - id: 60aa3e63-3fc6-4a33-8162-b3164d26978d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch18:11084-11321
    date: '1960-07-13'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
