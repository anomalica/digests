        name: Foster Bradshaw
    quote: |-
      A query from Dr. Bradshaw prompted this one. After being out and close by, I thought I would try to find out if I wear clothes in the non-physical, to try to answer his question. ... I felt my second, non-physical body. There was skin with goose bumps, but no clothes.
    text: |-
      During the 1960-03-18 clothing-question out-of-body experiment, prompted by a question from Foster Bradshaw about whether he wore clothes while out of the physical body, Robert Monroe found that his non-physical body had skin with goose bumps but no clothes.
