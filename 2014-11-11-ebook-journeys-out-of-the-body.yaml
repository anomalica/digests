        name: Robert Monroe
      - id: 98ba4490-d1cc-4fdb-a7df-e38e683cc81c
        name: 'topic: precognition'
    quote: |-
      Immediately thereafter, I would see and semiexperience an event or incident like a dream, except that I retained all of my consciousness and sense awareness. The dream would be superimposed directly over outside stimuli. I could perceive both quite readily.
    text: |-
      During his precognitive visions, Robert Monroe would see and semi-experience an event or incident like a dream, but retained all of his consciousness and sense awareness, with the dream superimposed directly over outside stimuli, perceiving both readily.
  - id: e08fcb8c-292c-4ea9-b82f-781af4fad5f3
    type: observation
    attestation: first_hand
    speaker:
