        name: Robert Monroe
      - id: 3589fec1-bb3a-4351-b3cf-caf1eb0d85c2
        name: Fear Barrier
    quote: |-
      First and foremost, there is the death fear. Because separation from the physical body is much like what is expected at death, early reactions to the experience are automatic.
    text: |-
      Robert Monroe describes the Fear Barrier as having a death fear aspect, arising because separation from the physical body resembles what is expected at death.
  - id: e1e71247-16fb-47be-9d2b-61376669ce62
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
