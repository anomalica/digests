        name: Robert Monroe
    quote: |-
      Barbiturates force a loss of conscious control and only bring a confused state in deeper consciousness.
    text: |-
      Robert Monroe found that barbiturates force a loss of conscious control and produce only a confused state in deeper consciousness.
  - id: db839320-5c40-4945-a069-b1ed8556a632
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
