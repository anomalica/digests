        name: Robert Monroe
    quote: |-
      Dr. Puharich, awake and aware that specific attempts to "visit" him were being made, had no conscious recollection of any such meeting.
    text: |-
      Andrija Puharich, while awake and aware that Robert Monroe was specifically attempting to visit him out-of-body, had no conscious recollection of any such meeting.
