    date: '1959-01-25'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      There was definitely an arm attached to the hand, and a shoulder I was about to explore more, when the vibrations seemed to soften.
    text: |-
      On 1959-01-25, during an out-of-body experience, Robert Monroe felt a hand, then an arm and a shoulder, on the other side of the hole.
  - id: 9fc5675a-94cc-406f-b53d-46fb16ee4c24
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
