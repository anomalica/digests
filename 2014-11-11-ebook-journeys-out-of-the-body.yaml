      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      My first visits to Locale II brought out all the repressed emotional patterns I even remotely considered I had—plus many I didn't know existed. They so dominated my actions that I returned completely abashed and embarrassed at their enormity and my inability to control them.
    text: |-
      Robert Monroe's first visits to Locale II brought out repressed emotional patterns that dominated his actions, causing him to return embarrassed and unable to control them.
  - id: b308753a-3916-4242-8532-09ef3d4e5fc6
