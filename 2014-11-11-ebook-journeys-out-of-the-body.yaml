        name: Robert Monroe
    quote: |-
      I reached down carefully to touch my physical head, and my hands touched feet! ... My left big toe has a thick nail due to a long-ago mashing by a dropped log. This big toe (left) did not! I felt with my hands to the right foot. The big toe on the right foot did have the thick nail. Everything was reversed, like a mirror image.
    text: |-
      During the 1963-02-15 reversed-body physical examination out-of-body experiment, Robert Monroe reached down to examine his physical body and found the positions of his feet reversed like a mirror image, with the thick toenail from an old injury on the right foot instead of the left.
  - id: c445b373-a943-4afc-b51d-dda730adfdd8
