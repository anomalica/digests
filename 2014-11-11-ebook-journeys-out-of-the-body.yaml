        name: Robert Monroe
    quote: |-
      Then he turned and saw me. His face registered utter astonishment, and my "dead" father spoke to me. "What are you doing here!"
    text: |-
      Robert Monroe found his deceased father in a small room, and his father expressed astonishment upon seeing him and asked what he was doing there.
  - id: 1645c000-7d31-4595-9d3a-35ff9ef762ec
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch15:25212-25365
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      My father reached forward, grabbed me under the armpits, and happily swung me high over his head and down again, just as I remembered so well as a small child
    text: |-
      During the out-of-body reunion, Robert Monroe's father grabbed him under the armpits and swung him over his head as he had done when Robert Monroe was a small child.
  - id: 553219c4-a6af-4edf-89f9-e5540bb2a8b2
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch15:25497-25571
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: I asked him how he was feeling. "Much better now," he said. "The pain is gone."
    text: |-
      Robert Monroe's father told him during this out-of-body encounter that he was feeling much better and that the pain was gone.
  - id: 15399306-9a4c-4e94-8542-2d834606fe6e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch15:25779-25860
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      He looked thinner, and about fifty, based upon pictures we have when he was that age.
    text: |-
      Robert Monroe's father appeared thinner and about fifty years old during this out-of-body encounter, based on old photographs Robert Monroe had seen of him at that age.
  - id: b216876d-69b6-4b0e-8326-db69202c9c9c
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:312-460
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      To date, in twelve years of non-physical activities, I find no evidence to substantiate the biblical notions of God and afterlife in a place called heaven.
    text: |-
      After twelve years of non-physical activities, Robert Monroe found no evidence to substantiate the biblical notions of God and an afterlife in a place called heaven.
  - id: b495c875-ed51-4879-a164-4628ee51face
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:1967-2250
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 4c0d1663-a42c-4999-a4d5-457cf2c66089
        name: The Barrier
    quote: |-
      Without warning, I rammed into a solid wall of some impenetrable material...The material was hard and solid, and seemed to be made of huge plates of steel overlapping slightly and welded together. Each had a slight curvature as if part of a globe.
    text: |-
      On a non-physical excursion returning to the physical body, Robert Monroe rammed into a solid wall made of overlapping curved metal plates, which he could not push through in any direction.
  - id: 7f72f84f-7b00-46f6-8ce6-75eae04d4d0c
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:2493-2722
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 4c0d1663-a42c-4999-a4d5-457cf2c66089
        name: The Barrier
    quote: |-
      I prayed. I used every prayer I had ever learned, and made up a few special ones...Nothing happened. I was still plastered against the barrier, unable to get through and back to my physical body.
    text: |-
      Robert Monroe prayed using every prayer he knew while trapped against The Barrier, but the prayers had no effect on getting him through.
  - id: 2e631e43-1fbe-4f30-a7c6-4ae8fba4e7fc
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:4683-4839
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 77da1565-ff20-4fb2-9682-5b8450682a84
        name: Bill
    quote: |-
      I pulled back on the stick. The ship straightened out of the spin immediately and gathered flying speed...We had fallen into an *outside* spin.
    text: |-
      Robert Monroe recalled a prior emergency recovering an aircraft from an outside spin by pulling back on the control stick, contrary to the accepted spin-recovery procedure, together with Bill.
  - id: 6c47a3d0-9ae1-4a5a-8cfb-df6165e7593a
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:5151-5449
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 4c0d1663-a42c-4999-a4d5-457cf2c66089
        name: The Barrier
    quote: |-
      There was just one remaining direction, although my knowledge said definitely it was not right...I did, and only a few moments later, I was back in the physical shaken but safe...away from the barrier, back in the direction from which I had been traveling.
    text: |-
      Robert Monroe got free of The Barrier by moving in the one remaining untried direction: back away from the barrier, in the direction from which he had come.
  - id: 19b38378-809c-4280-95d8-14fe9ea5ae63
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:6248-6455
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The moment I left the physical, I became aware of three beings in the room...They started to pull at me, not hard, but deliberately as if to see what I would do.
    text: |-
      While visiting his brother's family overnight, Robert Monroe separated from his physical body and became aware of three beings in the room who pulled at him deliberately, as if testing him.
  - id: a6f1813d-730b-4e5b-b983-4de474e3493d
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:6657-6770
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 85cdb297-ee0f-4bb6-ae2c-65d55cf12f9a
        name: Jesus Christ
    quote: |-
      So I prayed. Again, I used every prayer I knew. I asked God to help me. I prayed in the name of Jesus Christ for help.
    text: |-
      During the encounter with three beings pulling at him, Robert Monroe prayed to God and prayed in the name of Jesus Christ for help.
  - id: c3afaa36-4ac6-4c08-bf95-83c01f8d3445
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:6839-7003
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The result? My tormentors laughed loudly and worked me over more enthusiastically. "Listen to him pray to his gods," one chuckled, most contemptuously. "Listen to him!"
    text: |-
      One of the three beings mocked Robert Monroe's prayers, saying "Listen to him pray to his gods," and the beings worked him over more enthusiastically after he prayed.
  - id: bb3de050-94c1-4f5d-b2b0-5387cc78f4e8
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:7010-7113
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I think I got a little angry after that. I began to push back, got close to my physical body, and dove in.
    text: |-
      Robert Monroe got back into his physical body by getting angry and pushing back against the three tormenting beings rather than remaining passive.
  - id: a71e0fea-76d8-4c3a-ac57-13425b769e59
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: 70-78
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: 1e1aaafe-eeb9-4c80-895c-05c8a0ccf711
        name: J.
    quote: |-
      Even as I sat up, I heard a child crying...After some ten minutes, the little girl, J., still had not stopped..."She isn't like this. She usually sleeps very soundly."
    text: |-
      After Robert Monroe returned to his physical body following the encounter with three beings, his niece J. was found crying inconsolably in the adjoining bedroom, described by her mother as unusual behaviour since she normally slept soundly.
  - id: f6817b05-a376-4b2b-bdbb-f8c6ab2f71ab
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:8735-8856
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      It is a gray-black hungry ocean where the slightest motion attracts nibbling and tormenting beings...Could this be the borders of hell?
    text: |-
      Robert Monroe describes a layer of Locale II closest to Here-Now as a gray-black hungry ocean where the slightest motion attracts nibbling and tormenting beings, resembling the borders of hell.
  - id: abc1475d-70a9-4ae8-8095-83630f64f03f
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:9988-10286
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      Your destination in the heaven or hell of Locale II seems to be grounded completely within the framework of your deepest *constant* (and perhaps non-conscious) motivations, emotions, and personality drives. The most consistent and strongest of these act as your "homing" device when you enter this realm.
    text: |-
      Robert Monroe considers that a person's destination within the heaven-or-hell aspects of Locale II is determined by that person's own deepest constant motivations, emotions, and personality drives, which act as a "homing" device.
  - id: 75020255-49b4-4415-a484-39de59497a93
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:11140-11361
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      In the midst of normal activity, whatever it may be, there is a distant Signal, almost like heraldic trumpets...It is the Signal that He (or They) is coming through His Kingdom.
    text: |-
      During visits to Locale II, Robert Monroe periodically experienced an event in which a distant Signal, like heraldic trumpets, caused everyone present to stop what they were doing as a being described as "He" or "They" passed through.
  - id: 2f8aec61-a413-403f-a62e-04d1e868d0f2
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:11660-11931
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      At the Signal, each living thing lies down—my impression is on their backs, bodies arched to expose the abdomen (not the genitals), with head turned to one side so that one does not see Him as He passes by. The purpose seems to be to form a living road over which He can travel.
    text: |-
      At the Signal in Locale II, each being present lies down on its back with the abdomen exposed and the head turned aside so as not to see Him as He passes, forming a living road for Him to travel over.
  - id: 4fdd7c1f-d30a-4997-8ff8-ae2f944cfda1
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:11939-12073
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      I have gleaned the idea that occasionally He will select someone from this living bridge, and that person is never seen or heard from again.
    text: |-
      Robert Monroe understood that He occasionally selects someone from the living bridge formed during the Signal event in Locale II, and that person is never seen or heard from again.
  - id: 8061d698-9a4d-4efc-b516-b51440082615
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:12417-12713
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: cd0c971c-84a7-426f-9fab-23d05c50ff8d
        name: Locale II
    quote: |-
      In the several times that I have experienced this, I lay down with the others...As He passes, there is a roaring musical sound and a feeling of radiant, irresistible living force of ultimate power that peaks overhead and fades in the distance.
    text: |-
      Robert Monroe lay down with the other beings during the Signal event in Locale II each time he experienced it, and perceived a roaring musical sound and a feeling of radiant, irresistible living force of ultimate power as He passed.
  - id: 638eb98f-33e1-477a-8674-9982a3810459
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:13478-13835
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Three times I have "gone" to a place that I cannot find words to describe accurately...I am sure that this may be part of the ultimate heaven as our religions conceive it. It must also be the nirvana, the Samadhi, the supreme experience related to us by the mystics of the ages.
    text: |-
      Robert Monroe went to a place he calls "There" or "Home" three times, which he associates with the ultimate heaven of religion, nirvana, and Samadhi as described by mystics.
  - id: adcaa0b2-d559-4782-93c4-3ec7ffb1e925
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: 122-126
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      To me, it was a place or condition of pure peace, yet exquisite emotion...The cloud in which you float is swept by rays of light in shapes and hues that are constantly changing...There is no source from which the Music comes.
    text: |-
      Robert Monroe describes his experience of "There"/"Home" as a place of pure peace and exquisite emotion, like floating in warm soft clouds swept by constantly changing coloured rays of light and surrounded by music with no discernible source.
  - id: 7d4ae3cb-e98f-4870-a80e-4ef9fa6a446f
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:16124-16255
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: d97ad438-f5d3-4395-be1c-990b12c5767d
        name: USA, Hawaii
    quote: |-
      The nameless emotion, longing, nostalgia, sense of destiny that you felt back there when you stared at the cloud-layered sunset in Hawaii...
    text: |-
      Robert Monroe recalled feeling a nameless longing and nostalgia when he had stared at a cloud-layered sunset in Hawaii, prior to his experiences of "There"/"Home".
  - id: 702c4a5a-1744-4e30-95b4-8a138ca1c4db
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:18270-18472
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Each of the three times I went There, I did not return voluntarily. I came back sadly, reluctantly. Someone helped me return. Each time after I returned, I suffered intense nostalgia and loneliness for days.
    text: |-
      Each of the three times Robert Monroe went to "There", he did not return voluntarily and was helped to return by someone, after which he suffered intense nostalgia and loneliness for days.
  - id: f9561b1b-1978-4cd7-a9ed-7f540a282aaf
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:18726-18776
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: So great was it that I have not tried to go There again.
    text: |-
      The intense nostalgia Robert Monroe felt after returning from "There" was severe enough that he stopped trying to go There again.
  - id: ceec4e6a-6bcb-435c-a5c9-19b1019bb91e
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:18802-19133
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Once I tried to simulate There, on *this* world. I remembered as a child swimming in a pool that had underwater deep-hued colored lights set in the walls...Our country home had a swimming pool, so I set to work. We installed underwater lights, and I used color on the lights.
    text: |-
      Robert Monroe attempted to simulate the experience of "There" in physical reality by installing coloured underwater lights and an underwater speaker in the swimming pool at his country home, recalling a childhood pool that had had underwater coloured lights.
  - id: 82b49d35-5259-4b98-8628-9ddc818de1cd
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: true
    location: ch16:19471-19721
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Upon visiting the site of my childhood, the pool I remembered was there, but it did not have colored lights under the water. No one, including old friends who swam with me in the pool, could remember this pool as ever having colored lights under the water.
    text: |-
      Upon revisiting the site of his childhood pool, Robert Monroe found it did not have coloured underwater lights, and no old friends who had swum with him there could remember it ever having had them.
  - id: a400ad4d-dfb0-441f-8849-eddd8791de8d
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch17:75-203
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
      - id: c47eeed7-012c-4679-a42a-4653bbb0ca4c
        name: Journeys Out of the Body
    quote: |-
      One of the greatest enigmas of this whole affair is that someone—or more than one—has been helping me from time to time in such experimentation.
    text: |-
      Robert Monroe believes that one or more unidentified helpers have assisted him during his out-of-body experimentation.
  - id: 1a217e7f-f635-45f8-9790-19a544434c7e
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
