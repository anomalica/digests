    quote: |-
      5/5/61 ... in planned attempt to visit Dr. Puharich... There was a man sitting at the table, writing on paper. He resembled Dr. Puharich, but he was more light or blond-haired. I greeted him, and he looked up and smiled, then stated that he would spend more time on our project...
    text: |-
      On 1961-05-05, Robert Monroe attempted an out-of-body visit to Andrija Puharich and found a man resembling Puharich but with lighter or blond hair sitting at a table writing, who spoke with him about their project before Monroe returned to the physical body.
  - id: fc411b1c-3324-42b8-a647-8efa6528015f
