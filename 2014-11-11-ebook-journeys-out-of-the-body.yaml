        name: 1959-07-05 precognitive airplane crash vision (Robert Monroe)
    quote: |-
      She stated that in a few minutes the pilot would decide whether to take the plane on one of two routes, the one to the left (going around) or the “under the wire” route.
    text: |-
      In the 1959-07-05 vision, a stewardess announced that the pilot would decide between two routes, one going around and one described as the "under the wire" route.
