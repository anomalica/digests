    quote: |-
      This, then, is why the majority of the experimental travel attempts took me involuntarily somewhere into Locale II.
    text: |-
      The majority of Robert Monroe's experimental out-of-body travel attempts took him involuntarily into Locale II rather than to intended physical-world destinations.
