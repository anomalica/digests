        name: Robert Monroe
      - id: 7727393b-dbe0-4308-886b-292acd0b92a0
        name: Locale III
    quote: |-
      I noticed two people, a man and a woman, sitting in chairs near the outside of the building. I couldn't make contact with the man, but the woman... seemed to know I was there.
    text: |-
      On 1959-02-27, Robert Monroe observed two people, a man and a woman, sitting in chairs outside the barn-like building in Locale III, and the woman seemed to sense his presence.
  - id: 05abd181-ad49-4fc4-b135-86e8cf591f12
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
