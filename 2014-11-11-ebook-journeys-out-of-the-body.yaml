        name: 1960-10-10 out-of-body visit to R.W. (Robert Monroe)
    quote: |-
      On Saturday between three and four was the only time there was not a crowd of people in the beach cottage where she was staying. For the first time, she was alone with her niece (dark-haired, about eighteen) and the niece’s friend (about the same age, blond).
    text: |-
      R.W. reported that on the Saturday in question, between three and four o'clock, she was alone in the kitchen-dining area of a beach cottage with her dark-haired niece, about eighteen years old, and the niece's blond friend of about the same age, and that this was the only time that afternoon without a crowd of people present.
  - id: f36159f1-eaed-4fcc-8227-f79575106d0f
