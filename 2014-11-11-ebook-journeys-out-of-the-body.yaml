      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      On an impulse, I got up, went down to the garage, and drove the five miles to his town. ... I got to the same corner on Main Street, and there was the white car in front of the two open doors.
    text: |-
      After the 1960-10-30 out-of-body experience, Robert Monroe physically drove approximately eight kilometres to the town and found the same white car in front of the two open grease rack doors at the corner he had seen while out of body.
  - id: 85565de9-8e7f-444d-ac5c-c5c8679dcbf8
