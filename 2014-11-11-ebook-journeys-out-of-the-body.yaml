        name: Robert Monroe
    quote: |-
      These are brought into "existence," evidently, by three sources. First, they are the product of thought of those who once lived in the physical world... The second source is those who liked certain material things in the physical world... The third source I assume to be a higher order of intelligent beings...
    text: |-
      Robert Monroe attributes the solid matter and artifacts perceived in Locale II to three sources: automatic thought-patterns left by those who once lived in the physical world, deliberate re-creations by those who liked certain physical things, and simulations created by higher intelligent beings to ease the transition of newcomers after death.
  - id: 7be4e3eb-9a25-489a-859a-52c6f6d3875b
