      - id: 1b7966eb-3ca0-4fa8-9b23-38edd9f3fe64
        name: Out-of-the-Body Experience (OOBE)
      - id: 6ec7e1e2-f03e-45fa-ad76-dcce74d102a0
        name: USA, North Carolina, Durham
    quote: |-
      In hotel room in Durham with my wife in bed beside me, late at night... Immediately, I was attacked by something I couldn’t see in the darkness. It fought at the animal level, i.e., tried to bite and scratch.
    text: |-
      During an out-of-the-body experience on 1960-07-13 night in a hotel room in Durham, North Carolina, with his wife beside him in bed, Robert Monroe was attacked by an unseen entity that fought at an animal level, biting and scratching.
  - id: 6e5f3808-52e1-43ea-9ebf-83b4007a405b
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch18:11624-11853
    date: '1960-07-13'
    refs:
