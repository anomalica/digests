      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      nor do I know of any method, place, person, religious practice (that I would be sure of), drug, or anything else in my fund of knowledge, experience, and information that would absolutely guarantee protection against whatever attacked me.
    text: |-
      Robert Monroe states that as of the time of writing, he knew of no method, religious practice, drug, or other means that would guarantee protection against the entities that attacked him during his out-of-the-body experiences.
  - id: b0411bb4-e927-4b32-9ff5-baf62666d838
