        name: Robert Monroe
    quote: |-
      He is one of those whom I would have no difficulty recognizing if I saw again. He was different in that I did get an impression of warm friendliness and comradeship, but he was in some manner not quite the same as I—older, knowledgeable in another field. He was different in that he came forward and offered his help. This was one of the few times that the option was mine.
    text: |-
      Robert Monroe describes the "host" from Chapter 12 as one of the helpers he would have no difficulty recognising again, who gave an impression of warm friendliness and comradeship, seemed older and knowledgeable in another field, and who came forward and offered his help unlike the other helpers.
  - id: b58b4d6f-7110-47eb-a058-07e3fbee1522
