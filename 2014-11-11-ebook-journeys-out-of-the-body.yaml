        name: 1959-07-05 precognitive airplane crash vision (Robert Monroe)
    quote: |-
      It seems that my mind would not accept the precognitive inference of a heart attack. This seemed impossible. Therefore, it selected a catastrophe that was possible in its memory experience, i.e., an airplane crash. ... Thus the heart attack came through in the form of an airplane crash, which was acceptable as a possibility.
    text: |-
      Robert Monroe believed his mind could not accept the precognitive inference of a heart attack because it seemed impossible, and so it selected a catastrophe possible in its memory experience, an airplane crash, to represent the coming heart attack.
