      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It will be very tempting to dismiss Robert Monroe as a madman. I would suggest that you not do that. Neither would I suggest that you take everything he says as absolute truth.
    text: |-
      Charles T. Tart advises readers not to dismiss Robert Monroe as a madman, nor to take everything he says as absolute truth.
  - id: 7d45488f-4d1c-4704-981f-704a66525d00
    type: testimony
    attestation: first_hand
    speaker:
