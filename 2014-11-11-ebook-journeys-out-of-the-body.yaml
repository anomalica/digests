        name: Robert Monroe
    quote: |-
      Fear was the dominant theme—fear of the unknown, of strange beings (non-physical), of "death," of God, of rule-breaking, of discovery, and of pain, to name only a few.
    text: |-
      Fear was the dominant emotional theme in Robert Monroe's early experiences in Locale II, including fear of the unknown, of strange non-physical beings, of death, of God, of rule-breaking, of discovery, and of pain.
