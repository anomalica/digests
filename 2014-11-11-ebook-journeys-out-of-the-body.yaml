      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The point is, I could feel the physical. My hands didn't seem simply to go through it.
    text: |-
      During the 1963-02-15 reversed-body physical examination out-of-body experiment, Robert Monroe was able to feel his physical body with his hands, and his hands did not simply pass through it.
