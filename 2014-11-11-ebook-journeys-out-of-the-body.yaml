        name: Robert Monroe
    quote: |-
      At first, it was suggested that I was fantasizing these communications... This theory received a setback when a number of such communications brought out data known only to the second party.
    text: |-
      Robert Monroe found that a theory that he was fantasizing his reported out-of-body conversations, drawing unconsciously on his existing knowledge of the person visited, was undermined when a number of such communications produced data known only to the second party.
  - id: 171a5e83-28bb-4ab4-9a4a-f397c5c519c5
    type: observation
    attestation: first_hand
    speaker:
