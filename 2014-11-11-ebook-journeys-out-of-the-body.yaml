    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Borderland sleep state. This is perhaps the easiest and most natural method and usually ensures relaxation of both body and mind simultaneously.
    text: |-
      Robert Monroe identifies the borderland sleep state, the delicate edge between sleep and complete wakefulness, as perhaps the easiest and most natural relaxation method for out-of-body experimentation.
  - id: 83576121-bfd7-41c0-8e76-602036b9dc98
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: 62-70
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      Once you have achieved Condition A... Condition B is similar, but with the concentration eliminated... Condition C is a systematic deepening of consciousness while in the B state... Condition D is the achievement of C when one is fully rested and refreshed.
    text: |-
      Robert Monroe describes a four-stage progression of conditions (A through D) of deepening consciousness at the borderland sleep state used in his out-of-body technique.
  - id: 04ef5720-28ee-4736-a2f7-3d992a2e7763
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:11396-11649
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      I can remember, for example, attempting to achieve this state after watching a football game on TV for several hours. All I saw were mind pictures of football players tackling, running, passing, etc. It took at least a half hour for the pattern to fade away.
    text: |-
      Robert Monroe recounts that after watching a football game on television for several hours, he experienced mind pictures of football players tackling, running, and passing when attempting to reach the borderland state, which took about half an hour to fade.
  - id: c3f791ca-86c5-478b-b1d0-03fceb7d9453
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:12471-12631
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      The sense of touch apparently goes first... Smell and taste soon follow. The auditory signals are next, and the last to fade out is vision.
    text: |-
      Robert Monroe describes that in the deepening of consciousness toward the out-of-body state, the sense of touch fades first, followed by smell and taste, then auditory signals, with vision the last sense to fade.
  - id: f86c532e-928f-4dea-a4f4-bfd3eb78daf6
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
