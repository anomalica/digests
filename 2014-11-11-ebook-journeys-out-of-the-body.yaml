        name: Fear Barrier
    quote: |-
      There is one great obstacle to the investigation of the Second Body and the environment in which it operates. Perhaps it is the only major barrier... This is the barrier of blind, unreasoning fear.
    text: |-
      Robert Monroe identifies blind, unreasoning fear as the one great obstacle, and possibly the only major barrier, to the investigation of the Second Body and its environment.
  - id: 0e65d186-2e5c-40ae-a33e-fba7161be1a7
    type: observation
    attestation: first_hand
    speaker:
