      - id: 3bb74877-d34c-4501-a71a-c04909c1ba4e
        name: Richard Gordon
    quote: |-
      With trepidation, I went to our longtime family physician, Dr. Richard Gordon, and explained the symptoms. As an internist and diagnostician, he should have had what answers there may have been.
    text: |-
      Robert Monroe consulted his longtime family physician, Richard Gordon, an internist and diagnostician, about the vibration episodes.
