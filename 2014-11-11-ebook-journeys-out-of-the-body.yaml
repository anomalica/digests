        name: 'topic: precognition'
    quote: |-
      There would be a hissing sound, localized in the forebrain, and I would get the sensation of a small rectangular door, hinged at one end, swinging downward to an angle of about 45°. This exposed a perfectly round hole.
    text: |-
      Robert Monroe experienced a hissing sound localised in the forebrain preceding his precognitive visions, followed by a sensation of a small rectangular door hinged at one end swinging downward to an angle of about 45 degrees, exposing a round hole.
  - id: 95a29641-3f1a-4440-8225-5b45d2fd3bb6
    type: observation
    attestation: first_hand
    speaker:
