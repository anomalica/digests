    quote: |-
      It wasn't a wall, it was the ceiling. I was floating against the ceiling, bouncing gently with any movement I made.
    text: |-
      During a subsequent nighttime vibration episode, Robert Monroe felt something pressing against his shoulder, reached back to touch a smooth wall, then realised it was the ceiling and that he was floating against it, bouncing gently with his movements.
