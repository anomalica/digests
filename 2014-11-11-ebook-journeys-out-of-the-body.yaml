    quote: |-
      The four weeks in the hospital were eased by use of suggestive therapy on recorded tape, which worked wonders with my morale and seemed to speed my recovery.
    text: |-
      During his four weeks in the hospital following the heart attack, Robert Monroe's morale and recovery were eased by suggestive therapy delivered via recorded tape.
