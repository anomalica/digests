    quote: |-
      Shortly after completing the first series of laboratory experiments, I moved from the east coast to California.
    text: |-
      Charles T. Tart moved from the east coast of the United States to California, USA, shortly after completing the first series of laboratory experiments with Robert Monroe.
  - id: eaecf404-6470-4119-89c1-83f38f64289b
    type: administrative
    attestation: first_hand
