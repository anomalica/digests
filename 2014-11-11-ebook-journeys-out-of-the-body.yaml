        name: Robert Monroe
      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
    quote: |-
      The tugging at the legs continued, and I finally managed to separate one Second Body arm, and held it up, feeling around in the dark.
    text: |-
      Robert Monroe reported that as the tugging at his legs continued, he managed to separate one Second Body arm and held it up, feeling around in the dark.
  - id: 7207e544-f283-477f-a0e8-d7b0f6501b34
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
