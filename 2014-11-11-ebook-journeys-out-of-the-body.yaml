        name: Second State
      - id: b6f0ad71-f13b-4966-9ab5-a9fe8ae2894f
        name: Second Body
    quote: |-
      With no other applicable terminology, I began to call the condition the Second State, and the other, non-physical body we seem to possess the Second Body.
    text: |-
      Robert Monroe began calling the condition of leaving the physical body the Second State, and the non-physical body involved the Second Body.
  - id: 3efc6e4f-933a-4457-a3ee-b425f643d29b
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:22950-23195
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It wasn't until the first evidential experience which could be checked that I seriously considered these to be anything but daydreams, hallucinations, a neurotic aberration, the beginnings of schizophrenia, fantasies caused by self-hypnosis, or worse.
    text: |-
      Robert Monroe did not seriously consider his out-of-body experiences to be anything other than daydreams, hallucinations, neurotic aberration, the beginnings of schizophrenia, or fantasies caused by self-hypnosis until his first evidential experience that could be checked.
  - id: e29fdac7-2b5d-43a8-8a4b-7e518a8a6578
    type: opinion
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch9:23203-23508
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      That first evidential experience was indeed a sledgehammer blow. If I accepted the data as fact, it struck hard at nearly all of my life experience to that date, my training, my concepts, and my sense of values. Most of all, it shattered my faith in the totality and certainty of our culture's scientific knowledge.
    text: |-
      Robert Monroe considered his first evidential out-of-body experience a sledgehammer blow that shattered his faith in the totality and certainty of scientific knowledge.
  - id: 25277b0e-00b7-42f0-a631-7827e7c6ef5b
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
