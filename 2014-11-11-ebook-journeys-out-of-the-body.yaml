    date: '1958'
    refs:
      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      It was not a shaking, but more of a "vibration," steady and unvarying in frequency. It felt much like an electric shock running through the entire body without the pain involved. Also, the frequency seemed somewhat below the sixty-cycle pulsation, perhaps half that rate.
    text: |-
      In a subsequent vibration episode Robert Monroe deliberately observed the condition rather than fighting it, and experienced the vibration as a steady, unvarying sensation resembling an electric shock at roughly half the frequency of standard sixty-cycle electrical pulsation.
  - id: f5a18748-df12-41a0-ae92-24cbab86adb6
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
