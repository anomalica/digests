        name: Locale I
    quote: |-
      It consists of people and places that actually do exist in the material, well-known world at the very moment of the experiment.
    text: |-
      Locale I consists of people and places that actually exist in the material world at the moment of the out-of-body experiment.
  - id: af77577d-97e9-4727-87a2-91a036fc5159
