      Examples of these include a visual description of the interior of a house, including paint and trim, that was selected by my wife for us in a Southern city. I recognized it immediately and it was identical to the description in the notes made two years previously. Most unusual was the fact that at the time of the precognition we had no plans or intention of moving south.
    text: |-
      Robert Monroe experienced a precognitive vision of the interior of a house, including its paint and trim, that was later selected by his wife for them in a Southern city, at a time when they had no plans or intention of moving south.
