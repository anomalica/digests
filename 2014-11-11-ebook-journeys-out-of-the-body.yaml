        name: 1959-07-05 precognitive airplane crash vision (Robert Monroe)
    quote: |-
      The group was composed of two older Negro men, an older white man, and the young Negro. They noticed that the plane was about to leave, so they all went down the aisle past me and took their seats.
    text: |-
      In the 1959-07-05 vision, Robert Monroe saw a group including two older Negro men, an older white man, and a young Negro man board the plane together.
