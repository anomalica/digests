        name: Robert Monroe
    quote: |-
      In spite of the complicated-sounding procedure, it is the most natural method for me.
    text: |-
      Robert Monroe states that the borderland sleep state technique is the most natural method for him personally, despite sounding complicated.
  - id: 4659f558-70c7-4b74-bb7a-b7fe9e2a0c0d
