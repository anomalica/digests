        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      A few months after moving, my wife and I decided to set up an experiment. One evening we would concentrate intensely for half an hour, in an attempt to help Mr. Monroe have an OOBE and come to our home.
    text: |-
      A few months after moving to California, Charles T. Tart and his wife set up an experiment in which they would concentrate intensely for half an hour to try to help Robert Monroe have an out-of-the-body experience (OOBE) and come to their home.
  - id: b90fc0f2-e87e-4f6b-9c68-d38b65bd61fb
    type: administrative
    attestation: first_hand
    speaker:
