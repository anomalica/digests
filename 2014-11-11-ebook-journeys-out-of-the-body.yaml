        name: Out-of-the-Body Experience (OOBE)
    quote: |-
      A third part of me knows that an OOBE is something like dying, or opening up part of my mind to an unknown realm, and this third part is not at all anxious to get on with it.
    text: |-
      Charles T. Tart considers an out-of-the-body experience to be something like dying, or opening up part of the mind to an unknown realm.
