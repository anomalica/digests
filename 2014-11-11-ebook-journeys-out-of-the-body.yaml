      - id: f664eac3-734e-435c-b87b-2ac2431134fc
        name: Agnew Bahnson
      - id: f458418e-475a-4f9a-8874-b0bc0dc318c2
        name: astral projection
    quote: |-
      11/27/62 Morning ... Plan was to go to Agnew Bahnson... Was in normal-sized room, bedroom, with three people in it... The little girl looked directly at me and said excitedly, "I know what you are!"... she said, "You're an astral projection!"
    text: |-
      On 1962-11-27 in the morning, Robert Monroe attempted an out-of-body visit to Agnew Bahnson but instead arrived in an unfamiliar bedroom where a young girl, about five or six years old, said to him "I know what you are!" and then identified him as "an astral projection".
  - id: 1b23dfc6-3ac8-4698-be12-d8575573a1da
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
