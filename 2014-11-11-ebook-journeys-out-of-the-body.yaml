      - id: 21cebac3-e83e-436c-93e5-71a6db22690a
        name: Robert Monroe
    quote: |-
      He is a good reporter, a man I have immense respect for, but he is one man, brought up in a particular culture at a particular time, and therefore his powers of observation are limited.
    text: |-
      Charles T. Tart considers Robert Monroe a good reporter and a man he holds in immense respect, while cautioning that Monroe's powers of observation are limited by being one man raised in a particular culture at a particular time.
  - id: 6649e4d7-6a4b-4745-ba92-886747f36e91
    type: opinion
