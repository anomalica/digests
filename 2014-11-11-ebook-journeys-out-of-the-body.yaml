        name: State of Vibration
    quote: |-
      Lie down, in whatever position is most conducive to your state of relaxation, but with your body along a north-south axis, with your head to magnetic north.
    text: |-
      Robert Monroe recommends lying down along a north-south axis with the head to magnetic north as an aid to achieving the State of Vibration.
  - id: bbaec15a-e1ec-4200-aa8e-7c46fffa4eac
    type: testimony
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
