        name: Robert Monroe
    quote: |-
      I yanked my arm out of the floor, pulled it up on the bed, and the vibrations ended soon after. I got up, turned on the light, and looked at the spot beside the bed. There was no hole in the floor or rug.
    text: |-
      After pulling his arm out during the vibration, Robert Monroe checked the spot beside the bed and found no hole in the floor or rug, and no water or evidence on his hand or arm.
