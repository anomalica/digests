        name: Robert Monroe
      - id: fef60716-65c6-4bdf-8c22-5115416412af
        name: State of Vibration
    quote: |-
      Aside from the principal human laboratory—this writer—several other individuals have tried the pattern. Suffice it to say that they have obtained positive results.
    text: |-
      Robert Monroe states that besides himself as the principal human laboratory, several other individuals tried his relaxation and vibration pattern and obtained positive results.
  - id: 5987d8f8-983d-4a4f-9cdc-e6f1777f8c5b
    type: observation
    attestation: first_hand
    speaker:
      id: 21cebac3-e83e-436c-93e5-71a6db22690a
      name: Robert Monroe
    provenance_chain:
      origin_kind: speaker
      origin: Robert Monroe
    attribution_in_text: false
    location: ch24:19199-19376
    refs:
