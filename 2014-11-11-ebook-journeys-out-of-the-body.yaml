        name: Robert Monroe
    quote: |-
      "Why, there's nothing else you can do but look into it and see what it is," Dr. Bradshaw replied. "Anyhow, it doesn't seem you have much choice. If it happened to me, I'd go off in the woods somewhere and keep trying until I found the answer."
    text: |-
      Foster Bradshaw suggested Robert Monroe's vibration experiences might be a form of hallucination and advised him that his only option was to look into it and try to find out what it was.
  - id: e2dac389-aec8-4015-88fe-dceff3650ade
    type: testimony
    attestation: first_hand
    speaker:
