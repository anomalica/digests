        name: William Perry
    quote: |-
      Talked to Mike who said it was like 2-3 times the program budget, but there were times when it went as high as 6-7 times core budget, thought it was absurdly high, said Perry wanted investigation on that but was told to drop it.
    text: |-
      Michael Kostelnik told Thomas Wilson the programme's security budget was typically two to three times the programme budget, but at times went as high as six to seven times the core budget, which Kostelnik thought was absurdly high; William Perry wanted an investigation into that but was told to drop it.
