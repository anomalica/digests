    quote: |-
      TW: Yes, ten days later (mid-June or so). Flew out there
      - Met in their conference room in their secure vault
      - Three of them show up
      ...
      TW: Yes, same 3
    text: |-
      Thomas Wilson flew out ten days later, around mid-June 1997, to meet the same three people who had been on the telephone conference, in their conference room in their secure vault.
