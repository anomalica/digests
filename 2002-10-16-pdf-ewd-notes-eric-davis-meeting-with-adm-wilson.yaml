    text: |-
      Michael Kostelnik declined to say who told him to drop the investigation into the programme's security budget, and instead told Thomas Wilson he could find out something from Judith Daly, Assistant Deputy Under Secretary of Defense for Advanced Development in the Office of the Under Secretary of Defense for Acquisition, Technology and Logistics (OUSDAT).
