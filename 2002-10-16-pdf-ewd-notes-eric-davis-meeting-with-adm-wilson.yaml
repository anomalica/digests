    quote: |-
      TW: I asked; they said they were formed out of necessity to protect themselves after a near disaster in the past almost blew their cover - something to do with an agreement that was reached with a couple of Pentagon SESs overseeing SAPs in those days - were vague about when that was.
    text: |-
      The Watch Committee told Thomas Wilson they were formed out of necessity to protect themselves after a near disaster in the past almost blew their cover, related to an agreement reached with a couple of Pentagon Senior Executive Service (SES) officials overseeing Special Access Programs (SAPs), though they were vague about when that was.
  - id: 4ad25ed3-9a8b-4d65-bb9f-fe0cdec983ac
    type: testimony
    attestation: second_hand
    speaker:
      id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
      name: Thomas Wilson
    provenance_chain:
      origin_kind: named
      origin: The Watch Committee
      relay:
        - The Watch Committee's account to Thomas Wilson
    attribution_in_text: true
    location: char:17349-17670
    refs:
      - id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
        name: Thomas Wilson
      - id: e15fe39a-6f15-4252-af77-a9788b4f91a6
        name: The Watch Committee (contractor access-control committee)
      - id: 29ad02b7-4634-48bc-acf6-6b81b6a281e3
        name: USA, Virginia, The Pentagon
    quote: |-
      - They said years ago in past an audit investigation led to them, and it wasn't supposed to - nearly outed!
      - A battle, a nasty back 'n forth between them and the investigator and his Pentagon chief ensued - like a tug of war for program transparency, they told me - money was the issue - their hiding out became the other issue.
    text: |-
      The Watch Committee told Thomas Wilson that years ago, in the past, an audit investigation led to them and nearly outed them, and a nasty back-and-forth battle ensued between them and the investigator and his Pentagon chief, like a tug of war over programme transparency, with money and their hiding out being the issues.
  - id: e687203d-b792-4bcf-92e5-f0ccc4e06075
    type: testimony
    attestation: second_hand
    speaker:
      id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
      name: Thomas Wilson
    provenance_chain:
