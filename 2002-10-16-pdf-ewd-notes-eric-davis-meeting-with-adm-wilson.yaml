      ...
      TW: Oh, no! I didn't tell them I talked to those guys!
    text: |-
      The programme manager asked Thomas Wilson who he had talked to before calling them, and was unhappy with his answer, but Wilson did not tell them he had talked to William Perry and Paul Kaminski.
  - id: 1400416e-7589-4313-b46a-75623658c3b1
    type: testimony
