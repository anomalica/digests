      - Security director (NSA-retired, a CI expert)
      - Program director
      - Corporate attorney
      - Called themselves "the watch committee," or gate keepers.
    text: |-
      The three people who met Thomas Wilson at the facility were a security director who was a retired National Security Agency (NSA) counterintelligence (CI) expert, a programme director, and a corporate attorney, who called themselves "the watch committee" or gatekeepers.
  - id: 7cfff41a-bce3-42d5-be0e-074adc3f5fa8
