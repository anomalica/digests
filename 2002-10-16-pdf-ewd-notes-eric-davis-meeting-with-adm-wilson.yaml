    refs:
      - id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
        name: Thomas Wilson
    quote: |-
      TW: Because they were part of it - in different compartments, placed in different layers of the compartments pyramid, split up to do different things or parts of it. They're all in same records group, but their connection to each other is not obvious (typical thing but unusual in records).
    text: |-
      Thomas Wilson said the four programmes referred him back to the threesome because they were part of the same programme, placed in different compartments and layers of the compartments pyramid, split up to do different parts of it, all within the same records group though their connection to each other was not obvious.
  - id: 2cda52a0-09fc-468f-8cf0-5b538d9e5be5
