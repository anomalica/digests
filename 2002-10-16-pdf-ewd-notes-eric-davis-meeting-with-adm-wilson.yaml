        name: Thomas Wilson
    quote: |-
      TW: They needed to discuss this (his demand) so hung up. Got called 2 days later and they said they don't want to talk on phone and arranged for face-to-face meeting at their facility.
    text: |-
      The threesome told Thomas Wilson they needed to discuss his demand, hung up, then called back two days later saying they did not want to talk on the phone and arranged a face-to-face meeting at their facility.
  - id: 96ce9937-d09c-4e7b-b509-628f9102ee62
    type: testimony
