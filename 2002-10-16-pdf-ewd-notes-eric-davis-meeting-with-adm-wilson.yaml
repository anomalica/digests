        name: Thomas Wilson
    quote: |-
      TW: 3 programs who said they weren't what/who I was looking for. 4 programs that referred me back to the present threesome.
    text: |-
      Thomas Wilson also called other programme managers, three of whom said they were not what he was looking for, and four of whom referred him back to the threesome he had already contacted.
  - id: 96a43284-04de-45c7-b81c-b478bc013267
    type: testimony
