    quote: |-
      TW: I told I read their program record in the OUSDAT special program records group and wanted to know about their crashed UFO program, what their role in that was, what they had, etc. Also asked if they heard of MJ-12 or some such organization code relating to crashed/recovered UFO craft.
    text: |-
      Thomas Wilson told the programme manager that he had read their programme record in the OUSDAT special programme records group and wanted to know about their crashed UFO programme and their role in it, and also asked if they had heard of Majestic 12 (MJ-12) or a similar organisation code relating to crashed or recovered UFO craft.
  - id: 2cfc9df5-134f-459d-8895-36e57b5660a3
    type: testimony
    attestation: first_hand
