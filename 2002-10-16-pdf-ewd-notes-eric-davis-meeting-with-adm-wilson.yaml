        name: Thomas Wilson
      - id: e15fe39a-6f15-4252-af77-a9788b4f91a6
        name: The Watch Committee (contractor access-control committee)
    quote: |-
      - Some kind of threat was leveled to blow the lid off them so they backed down and let the investigator in to complete his job
      - (They work very hard to keep program hidden)
    text: |-
      The Watch Committee told Thomas Wilson that some kind of threat was leveled to blow the lid off them, so they backed down and let the investigator in to complete his job; the Watch Committee works very hard to keep the programme hidden.
  - id: dac3bd86-6118-408a-9675-475b888d5fb3
    type: testimony
    attestation: second_hand
    speaker:
      id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
      name: Thomas Wilson
    provenance_chain:
