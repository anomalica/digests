        name: Thomas Wilson
      - id: e15fe39a-6f15-4252-af77-a9788b4f91a6
        name: The Watch Committee (contractor access-control committee)
    quote: |-
      TW: He was officially briefed, given tour, shown their program

      EWD: Did they show him a craft? Or hardware they said was "alien" or from a UFO?

      TW: Didn't say more about that.
    text: |-
      The prior investigator was officially briefed and given a tour and shown the programme, but Thomas Wilson said the Watch Committee did not say more about whether they showed him a craft or hardware described as "alien" or from a UFO.
  - id: e30cf449-f005-45e4-9138-763a5df4e65f
    type: testimony
    attestation: second_hand
    speaker:
      id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
      name: Thomas Wilson
    provenance_chain:
      origin_kind: named
      origin: The Watch Committee
      relay:
        - The Watch Committee's account to Thomas Wilson
    attribution_in_text: true
    location: char:18116-18645
    refs:
      - id: 49b7bfb5-6486-4869-a300-32507fa7a0c4
        name: Thomas Wilson
      - id: e15fe39a-6f15-4252-af77-a9788b4f91a6
        name: The Watch Committee (contractor access-control committee)
      - id: 6b699e64-5f68-4aff-87f3-c1a9a5907827
        name: Special Access Programs Oversight Committee (SAPOC)
    quote: |-
      - Said after that episode a formal agreement was struck with Pentagon people (SAPOC) to prevent this in future - didn't want a repeat
      - Special criteria were established in agreement
       - A special circumstance that must meet rigorous access criteria set by contractor committee
      - No USG personnel are to gain access unless they met the criteria - to be administered by contractor committee (program director, attorney, security director) irregardless of the tickets and position USG personnel possessed
      - Literally their way or the highway
    text: |-
      After the prior investigator episode, a formal agreement was struck between the Watch Committee and the Special Access Programs Oversight Committee (SAPOC) establishing special access criteria, administered by the contractor committee (programme director, attorney, security director), requiring US government personnel to meet the criteria regardless of their tickets and position.
  - id: 4a546055-d134-4734-b6e2-79e2b0346404
    type: opinion
    attestation: first_hand
    speaker:
