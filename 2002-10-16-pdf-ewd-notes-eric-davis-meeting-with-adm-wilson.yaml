        name: Defense Intelligence Agency (DIA)
    quote: |-
      TW: I told threesome I wanted formal briefing, tour, etc. - was exploiting my regulatory authority as Deputy Director DIA/Assistant Joint Chief of Staff J-2 - Told them my not being briefed was oversight they needed to correct - I demanded!
    text: |-
      Thomas Wilson told the threesome he wanted a formal briefing and tour, exploiting his regulatory authority as Deputy Director of the Defense Intelligence Agency (DIA) and Assistant Joint Chief of Staff for Intelligence (J-2), telling them that his not being briefed was an oversight they needed to correct, and he demanded it.
  - id: 47e58a5f-14ba-4f10-a257-3f203e03ce00
    type: testimony
    attestation: first_hand
    speaker:
