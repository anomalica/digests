    quote: |-
      There is no discernible evidence that he ever worked for a government UFO program, much less led one.
    text: |-
      The Elizondo Advanced Aerospace Threat Identification Program (AATIP) Claims Investigation concerns the question of whether Luis Elizondo actually worked for or led the government Unidentified Flying Object (UFO) programme known as AATIP, as there is no discernible evidence that he ever worked for the programme, much less led it.
