          2017 NYT Advanced Aerospace Threat Identification Program (AATIP) Story Publication
    quote: |-
      One of the first images in the opening episode of the new History Channel show 'Unidentified: Inside America's UFO Investigation' is a 2017 headline from the New York Times projected on a flickering screen: 'Glowing Auras and 'Black Money': The Pentagon's Mysterious UFO Program.'
    text: |-
      The History Channel show 'Unidentified: Inside America's UFO Investigation' premiered in 2019, with one of its first images being a 2017 headline from The New York Times: 'Glowing Auras and "Black Money": The Pentagon's Mysterious UFO Program.'
