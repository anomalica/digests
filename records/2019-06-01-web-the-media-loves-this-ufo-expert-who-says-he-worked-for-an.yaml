    quote: |-
      the article that 'shocked the world,' the narrator of 'Unidentified' declares, before continuing, 'A clandestine U.S. government program had been investigating UFOs. For eight years, the secret program was run by this man, Lue Elizondo.'
    text: |-
      The narrator of 'Unidentified: Inside America's UFO Investigation' declares that the 2017 New York Times story 'shocked the world' and that 'A clandestine U.S. government program had been investigating UFOs. For eight years, the secret program was run by this man, Lue Elizondo.'
