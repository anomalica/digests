    text: |-
      The Elizondo AATIP Claims Investigation involves the Greenewald–Kari DeLonge email exchange in which Kari DeLonge, a public relations representative for To the Stars Academy of Arts and Science, told John Greenewald that the Advanced Aerospace Threat Identification Program (AATIP) was initially run out of the Defense Intelligence Agency (DIA), but when Luis Elizondo took it over in 2010 as Director, he ran it out of the Office of the Secretary of Defense (OSD) under the Under Secretary of Defense for Intelligence.
