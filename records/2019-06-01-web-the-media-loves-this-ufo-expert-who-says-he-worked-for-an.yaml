        name: Sherwood, Christopher
    quote: |-
      AATIP existed, and it "did pursue research and investigation into unidentified aerial phenomena," Pentagon spokesperson Christopher Sherwood told me.
    text: |-
      The Elizondo AATIP Claims Investigation involves the fact that Pentagon spokesperson Christopher Sherwood confirmed to Keith Kloor that the Advanced Aerospace Threat Identification Program (AATIP) existed and did pursue research and investigation into unidentified aerial phenomena.
