    refs:
      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      Common contextual factors between earlier and modern investigations include a rapidly evolving and dynamic national security environment, concern about technological surprise, intense secrecy related to government military programs, public interest in UAP, perceived bureaucratic barriers, and the persistent lack of quality data.
    text: |-
      Common contextual factors between earlier and modern UAP investigations include a rapidly evolving national security environment, concern about technological surprise, intense secrecy related to government military programmes, public interest in UAP, perceived bureaucratic barriers, and the persistent lack of quality data.
  - id: 16faa48f-5163-4a87-9eb4-9c7584348e7d
    type: opinion
    location: file_page 10, Section II
    refs:
      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      Some contextual factors that were distinct between earlier and modern investigations include: differences in the level of public trust in the government; the large volume of popular culture content related to UAP; the perception within some segments of the population that the USG is hiding extraterrestrial technology; unauthorized disclosures of classified programs mistaken for UAP observations; the proliferation of online sources that reinforce these beliefs; the impact that social media has had on circular reporting; and the rapid spread of misinformation.
    text: |-
      Contextual factors distinct between earlier and modern UAP investigations include differences in the level of public trust in government, the large volume of popular culture content related to UAP, the perception among some that the US Government is hiding extraterrestrial technology, unauthorised disclosures of classified programmes mistaken for UAP observations, the proliferation of online sources reinforcing these beliefs, the impact of social media on circular reporting, and the rapid spread of misinformation.
