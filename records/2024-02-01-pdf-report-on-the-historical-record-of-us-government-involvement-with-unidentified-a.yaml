    text: |-
      The All-Domain Anomaly Resolution Office (AARO) created a secure process in partnership with the highest-level security officials within the DoD, IC, and other organizations to research and investigate alleged hidden UAP programs; AARO was granted full, unrestricted access by all organizations.
