      - id: c7addc48-13fc-4516-9e85-8d624d0ad340
        name: Estimate of the Situation 1948
    quote: |-
      This rejected report may have resulted in the Pentagon's leadership's loss of confidence in the staff at Project SIGN leading to the establishment of Project GRUDGE, which some sources claim possessed an institutional bias for debunking UFO claims.
    text: |-
      The rejection of the 'Estimate of the Situation' report may have resulted in the Pentagon leadership's loss of confidence in Project SIGN staff, leading to the establishment of Project GRUDGE, which some sources claim possessed an institutional bias for debunking UFO claims.
  - id: b7e63152-5ea6-45c3-83e5-9b2e8d4d9921
