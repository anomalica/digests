      - id: 3801cf79-74fd-4365-9686-308375c79262
        name: Project Blue Book
    quote: |-
      These periods are divided into pre- and post-2009 timeframe because this is the year of the standup of the Advanced Aerospace Weapons System Application Program (AAWSAP) and Advanced Aerospace Threat Identification Program (AATIP) efforts. Prior to AAWSAP/AATIP there was about a 40 year gap in UAP investigation programs since the termination of Project BLUE BOOK in 1969.
    text: |-
      The Advanced Aerospace Weapons System Application Program (AAWSAP) and Advanced Aerospace Threat Identification Program (AATIP) were stood up in 2009, marking the dividing line between earlier and modern UAP investigation eras. Prior to AAWSAP/AATIP there was about a 40-year gap in UAP investigation programs since the termination of Project BLUE BOOK in 1969.
