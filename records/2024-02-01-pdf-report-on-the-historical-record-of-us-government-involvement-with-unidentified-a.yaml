      - id: 17e9a273-6b7e-4203-b069-2568d2b57585
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      All investigative efforts, at all levels of classification, concluded that most sightings were ordinary objects and phenomena and the result of misidentification.
    text: |-
      All investigative efforts into unidentified anomalous phenomena (UAP), at all levels of classification, concluded that most sightings were ordinary objects and phenomena and the result of misidentification.
  - id: 6e757024-fd3b-4f57-958c-3e74a6d317e8
    type: opinion
    attestation: first_hand
    location: page 7, Section II Executive Summary
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: 17e9a273-6b7e-4203-b069-2568d2b57585
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
