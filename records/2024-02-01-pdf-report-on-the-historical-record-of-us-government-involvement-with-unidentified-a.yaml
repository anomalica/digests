    quote: |-
      These efforts ranged from formal, distinct programs employing a dedicated staff with some measure of longevity including: Projects SAUCER/SIGN, GRUDGE, and BLUE BOOK, the DoD UAP Task Force (UAPTF) led by the U.S. Navy (USN), the Airborne Object Identification and Management Synchronization Group (AOIMSG), and the All-domain Anomaly Resolution Office (AARO).
    text: |-
      The AARO UAP Historical Record Report, Volume I identifies the following formal, distinct USG UAP investigatory programmes: Projects SAUCER/SIGN, GRUDGE, and BLUE BOOK; the Department of Defense (DoD) Unidentified Aerial Phenomena Task Force (UAPTF) led by the U.S. Navy; the Airborne Object Identification and Management Synchronization Group (AOIMSG); and the All-Domain Anomaly Resolution Office (AARO).
