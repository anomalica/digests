    text: |-
      The USAF published 'The Roswell Report' in 1995, authored by Col Richard L. Weaver ('The Report of the U.S. Air Force Research Regarding the Roswell Incident') and 1st Lt James McAndrew ('Synopsis of Balloon Research Findings'). Secretary of the Air Force Sheila E. Widnall released interviewees from any security obligations.
