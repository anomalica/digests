        name: Non-Human Craft Recovery Programs
    quote: |-
      A consistent theme in popular culture involves a particularly persistent narrative that the USG - or a secretive organization within it - recovered several off-world spacecraft and extraterrestrial biological remains, that it operates a program or programs to reverse engineer the recovered technology, and that it has conspired since the 1940s to keep this effort hidden from the United States Congress and the American public.
    text: |-
      A consistent theme in popular culture involves a persistent narrative that the United States Government (USG) — or a secretive organisation within it — recovered several off-world spacecraft and extraterrestrial biological remains, that it operates programmes to reverse engineer recovered technology, and that it has conspired since the 1940s to keep this effort hidden from Congress and the American public.
