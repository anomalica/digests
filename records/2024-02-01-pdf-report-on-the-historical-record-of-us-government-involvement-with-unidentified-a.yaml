    refs:
      - id: 683a4e29-588d-4a34-925a-8ccfc4a55edf
        name: DNI UAP Preliminary Assessment 2021-06
    quote: |-
      The preliminary assessment concluded that: (1) the limited amount of high-quality reporting on UAP hampers the ability to draw firm conclusions about their nature or intent; (2) in a limited number of incidents, UAP reportedly appeared to exhibit unusual flight characteristics; although those observations could be the result of sensor errors, spoofing, or observer misperception...(3) there are probably multiple types of UAP requiring different explanations...(4) UAP may pose airspace safety issues and a challenge to U.S. national security; and (5) consistent consolidation of reports...will allow for a more sophisticated analysis of UAP.
    text: |-
      The DNI UAP preliminary assessment of 2021-06 concluded that: the limited amount of high-quality reporting hampers the ability to draw firm conclusions; in a limited number of incidents UAP appeared to exhibit unusual flight characteristics; there are probably multiple types of UAP requiring different explanations; UAP may pose airspace safety issues; and standardised reporting across the USG is needed.
