    text: |-
      Following high-level White House discussions, Director of Central Intelligence (DCI) John McCone tasked the CIA to update its evaluation of UFOs in 1964. The CIA's scientific division acquired UFO-sighting case information from the director of the National Investigations Committee on Aerial Phenomena (NICAP), a private organisation founded in 1956.
