      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      This report represents Volume I of the All-domain Anomaly Resolution Office's (AARO) Historical Record Report (HR2) which reviews the record of the United States Government (USG) pertaining to unidentified anomalous phenomena (UAP).
    text: |-
      Volume I of the All-Domain Anomaly Resolution Office's (AARO) Historical Record Report (HR2) reviews the record of the United States Government pertaining to unidentified anomalous phenomena (UAP).
  - id: d0f51c74-e583-4d96-8709-9d93b3ecca78
    type: administrative
    location: file_page 6, Section I
    refs:
      - id: df97d959-b3c3-45f0-827b-53ce253a26b3
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: 498754fb-7980-482c-b877-57fbe17e1889
