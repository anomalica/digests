    quote: |-
      Since 1945, the USG has funded and supported UAP investigations with the goal of determining whether UAP represented a flight safety risk, technological leaps by competitor nations, or evidence of off-world technology under intelligent control.
    text: |-
      Since 1945, the United States Government (USG) has funded and supported unidentified anomalous phenomena (UAP) investigations with the goal of determining whether UAP represented a flight safety risk, technological leaps by competitor nations, or evidence of off-world technology under intelligent control.
  - id: f4dc6f73-58b8-43d8-a723-d5a33ad7283f
    type: opinion
    attestation: first_hand
    location: page 7, Section II Executive Summary
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: 17e9a273-6b7e-4203-b069-2568d2b57585
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      AARO found no evidence that any USG investigation, academic-sponsored research, or official review panel has confirmed that any sighting of a UAP represented extraterrestrial technology.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) found no evidence that any United States Government (USG) investigation, academic-sponsored research, or official review panel has confirmed that any sighting of a UAP represented extraterrestrial technology.
  - id: 5318310b-bf9a-4974-baec-85e6facc618b
    type: opinion
    attestation: first_hand
