  main_event: null
  codenames:
    - codename: KONA BLUE
      refers_to: |-
        A proposed Prospective Special Access Program under the Department of Homeland Security for UAP recovery and reverse-engineering, championed by former AAWSAP/AATIP supporters; never approved by DHS
    - codename: Dragon Lady
      refers_to: |-
        The U-2 high-altitude reconnaissance aircraft developed under Project Aquatone beginning 1954
    - codename: Oxcart
      refers_to: |-
        The A-12 high-altitude reconnaissance aircraft (also designated SR-71 in later variants), developed from 1958
    - codename: CORONA
      refers_to: |-
        The first U.S. photographic reconnaissance satellite program, developed under the WS-117L effort from the late 1950s
    - codename: HAVE Blue
      refers_to: |-
        Lockheed stealth demonstrator aircraft that preceded the F-117A Nighthawk, developed from 1975
    - codename: TACIT Blue
      refers_to: Northrop stealth technology demonstrator aircraft, developed from 1975
    - codename: TATTLETALE
      refers_to: |-
        The GRAB (Galactic Radiation and Background) signals intelligence satellite program, launched September 1960
    - codename: Project BEAR
      refers_to: |-
        Informal name given by Capt. Edward Ruppelt to the contract with Battelle Memorial Institute providing scientific support to Project GRUDGE and Project BLUE BOOK
    - codename: Polecat
      refers_to: |-
        Lockheed Martin unmanned aerial vehicle demonstrator developed under classified programs
    - codename: Sentinel
      refers_to: RQ-170 stealthy unmanned aerial vehicle operated by the U.S. Air Force
    - codename: Dark Star
      refers_to: |-
        Tier III- high-altitude long-endurance unmanned aerial vehicle developed by Lockheed Martin and Boeing
    - codename: Silver Bug
      refers_to: |-
        A U.S. Air Force project associated with the VZ-9AV Avrocar disc-shaped experimental aircraft, from 1958
