  - id: 41a1fa29-c2a3-41b3-a7e8-0e5b3d47a35a
    type: opinion
    attestation: first_hand
    speaker:
      id: 1be4b7b0-f15d-40bf-a9fb-901c9f2112a4
      name: Condon, Edward
    location: page 21, Condon Report Results
    date: 1968-04
    refs:
      - id: faa038f6-788b-417e-a86d-ee2e5ac8866d
        name: Condon Report
    quote: |-
      Our general conclusion is that nothing has come from the study of UFOs in the past 21 years that has added to scientific knowledge. Careful consideration of the record as it is available to us leads us to conclude that further extensive study of UFOs probably cannot be justified in the expectation that science will be advanced thereby.
    text: |-
      The Condon Report concluded: 'Our general conclusion is that nothing has come from the study of UFOs in the past 21 years that has added to scientific knowledge' and that 'further extensive study of UFOs probably cannot be justified in the expectation that science will be advanced thereby.'
  - id: a2577d0c-44cd-425f-8556-823c88b2dd71
    type: observation
    attestation: first_hand
    location: page 21, Condon Report Results
    date: 1968-04
    refs:
      - id: faa038f6-788b-417e-a86d-ee2e5ac8866d
        name: Condon Report
    quote: |-
      The panel also investigated and studied a small number of cases of alleged physical evidence of UFO visitations - from imprints on the ground and residue allegedly left behind from UFO landings (such as a white powder and ethereal strands dubbed "angel hair") - to metallic debris. The panel found ordinary explanations for each of these cases. Some of these cases originated in Brazil, Norway, and Washington, D.C.
    text: |-
      The Condon panel investigated physical evidence including imprints on the ground, residue from alleged UFO landings such as white powder and 'angel hair,' and metallic debris; it found ordinary explanations for each case, with some originating in Brazil, Norway, and Washington D.C.
