        name: AARO UAP Historical Record Report, Volume I
    quote: |-
      One named program was a UAP-related Prospective Special Access Program (PSAP) called KONA BLUE that was proposed to the Department of Homeland Security (DHS) and supported by individuals who believed the USG was hiding off-world technology. The program was never approved by DHS and its supporters never provided empirical evidence to support their claims.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) noted that the KONA BLUE proposed Prospective Special Access Program (PSAP) was proposed to the Department of Homeland Security (DHS) and supported by individuals who believed the USG was hiding off-world technology; the program was never approved by DHS and its supporters never provided empirical evidence to support their claims.
  - id: 70a4c584-c6ed-4f94-9c31-6de57766d817
