domain_claims:
  - id: a9fd4b67-fd4b-4fa1-af5a-54166edff7ee
    type: administrative
    attestation: first_hand
    location: page 7, Section I Introduction
    date: '2024-02-01'
    refs:
      - id: da034ec3-b450-42ba-81ff-552176352dd8
        name: AARO UAP Historical Record Report, Volume I
      - id: a06a6048-b16a-44d0-9881-fe8988764b28
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      This report represents Volume I of the All-domain Anomaly Resolution Office's (AARO) Historical Record Report (HR2) which reviews the record of the United States Government (USG) pertaining to unidentified anomalous phenomena (UAP).
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) Historical Record Report (HR2) Volume I was published in 2024-02 and reviews the record of the United States Government (USG) pertaining to unidentified anomalous phenomena (UAP) since 1945.
  - id: 8d4b8d3f-87bd-4594-801b-cd5195331cc1
    type: administrative
    attestation: first_hand
    location: page 7, Section I Introduction
    date: '2024-02-01'
    refs:
      - id: da034ec3-b450-42ba-81ff-552176352dd8
        name: AARO UAP Historical Record Report, Volume I
      - id: a06a6048-b16a-44d0-9881-fe8988764b28
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      AARO reviewed all official USG investigatory efforts since 1945, researched classified and unclassified archives, conducted approximately 30 interviews, and partnered with Intelligence Community (IC) and Department of Defense (DoD) officials responsible for controlled and special access program oversight, respectively.
    text: |-
      In completing the AARO UAP Historical Record Report, Volume I, the All-Domain Anomaly Resolution Office (AARO) reviewed all official USG investigatory efforts since 1945, researched classified and unclassified archives, conducted approximately 30 interviews, and partnered with Intelligence Community (IC) and DoD officials responsible for controlled and special access program oversight.
