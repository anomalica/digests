  - id: e76f26f7-dde6-4810-8abb-91a3f1c6a88f
    type: administrative
    attestation: first_hand
    location: page 15, Project SIGN Results
    date: 1949-02
    refs:
      - id: dcae0323-af47-4bc7-8bf7-72c863317e0e
        name: Project SAUCER
    quote: |-
      The project evaluated 243 reported UFO sightings, and in February 1949, it concluded that "no definite and conclusive evidence is yet available that would prove or disprove the existence of these unidentified objects as real aircraft of unknown and unconventional configuration."
    text: |-
      Project SIGN evaluated 243 reported UFO sightings and in 1949-02 concluded that 'no definite and conclusive evidence is yet available that would prove or disprove the existence of these unidentified objects as real aircraft of unknown and unconventional configuration.'
  - id: 1a419ce5-759f-4e57-bb5a-716784ea9fc9
    type: administrative
    attestation: first_hand
    location: page 15, Project SIGN Results
    refs:
      - id: dcae0323-af47-4bc7-8bf7-72c863317e0e
        name: Project SAUCER
    quote: |-
      Project SIGN determined that nearly all were caused by either misinterpretation of known objects, hysteria, hallucination, or hoax. It also recommended continued military intelligence control over the investigation of all sightings.
    text: |-
      Project SIGN determined that nearly all UFO reports were caused by either misinterpretation of known objects, hysteria, hallucination, or hoax, and recommended continued military intelligence control over the investigation of all sightings.
  - id: f93f0deb-d9c5-4a43-b9c3-47c6dddcfe7f
    type: hearsay
    attestation: third_hand
    location: page 15, Project SIGN Results
    date: 1948-07
    refs:
      - id: dcae0323-af47-4bc7-8bf7-72c863317e0e
        name: Project SAUCER
      - id: c7addc48-13fc-4516-9e85-8d624d0ad340
        name: Estimate of the Situation 1948
    quote: |-
      Although the historical account is unsubstantiated and derived from only one source, Project SIGN staff in late July 1948 allegedly drafted, signed, and sent a report ("Estimate of the Situation") up the military chain for approval. This report allegedly concluded that UFOs were "interplanetary" in origin, but it was rejected by USAF Chief of Staff General Hoyt S. Vandenberg as lacking proof.
    text: |-
      Project SIGN staff in late 1948-07 allegedly drafted, signed, and sent a report titled 'Estimate of the Situation' up the military chain for approval, concluding that UFOs were 'interplanetary' in origin; the report was rejected by USAF Chief of Staff General Hoyt S. Vandenberg as lacking proof. This historical account is unsubstantiated and derived from only one source.
  - id: 6d262f67-30e8-4239-8bf9-bd9b96f4dba4
    type: opinion
    attestation: third_hand
    location: page 15, Project SIGN Results
    refs:
