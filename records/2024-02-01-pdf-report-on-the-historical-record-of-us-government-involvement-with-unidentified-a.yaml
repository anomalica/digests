      AARO reviewed official USG efforts involving UFOs/UAP since 1945. This research revealed the existence of approximately two dozen separate investigative efforts, depending on how they are counted.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) produced the AARO UAP Historical Record Report, Volume I, reviewing official United States Government (USG) efforts involving UFOs/UAP since 1945, identifying approximately two dozen separate investigative efforts.
