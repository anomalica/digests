    text: |-
      The French government sponsored three comprehensive UAP investigatory programs: GEPAN (1977-1987), SEPRA (1988-2004), and GEIPAN (established 2005). SEPRA concluded the vast majority of cases had ordinary explanations while 28 percent remained unresolved.
