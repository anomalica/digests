      AARO categorized these individuals into three tiers: Tier 1 interviewees are those who have spoken with congressional staff or Members of Congress and have been subsequently referred to AARO; Tier 2 interviewees are those who have been referred to AARO by Tier 1 interviewees; Tier 3 interviewees are AARO-generated interviewees that have a corroborating touchpoint to the principal integrated narrative of reports from Tier 1 and Tier 2 interviewees.
    text: |-
