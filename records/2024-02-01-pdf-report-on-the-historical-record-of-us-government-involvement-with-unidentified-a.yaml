      he needed a range of scientific expertise which he sourced through a contract he dubbed Project BEAR.
    text: |-
      Captain Edward Ruppelt dubbed his contract with the Battelle Memorial Institute (BMI) 'Project BEAR' to provide scientific support to the reorganised Project GRUDGE.
  - id: 23bfedbe-6709-499b-942d-3f172fc53a3b
    type: administrative
    attestation: first_hand
    location: page 16, Project GRUDGE Reestablishment section
    refs:
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
        name: Project GRUDGE Reestablishment
      - id: 95137136-8695-4ad6-813f-01b6529a0d0a
        name: Project GRUDGE Original
    quote: |-
      Unlike the previous Project GRUDGE, he allowed his staff to create an "unknown" category of cases which he hoped would dissuade the forcing of a particular answer to any case.
    text: |-
      The reorganised Project GRUDGE allowed staff to create an 'unknown' category of cases, unlike the previous Project GRUDGE.
  - id: cc13ed2f-1e4b-4015-8b68-9e7a31c097ce
    type: observation
    attestation: second_hand
    speaker:
      id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
      name: Ruppelt, Edward
    location: page 17, Project GRUDGE Reestablishment Results
    refs:
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
        name: Project GRUDGE Reestablishment
      - id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
        name: Ruppelt, Edward
    quote: |-
      The new Project GRUDGE noticed that there was some correlation between sightings and the publication of UFO stories in the media. Capt Ruppelt noted that there were concentrations of cases in the Los Alamos-Albuquerque area, Oak Ridge, White Sands, Strategic Air Command locations, ports, and industrial sites.
    text: |-
      Project GRUDGE (Reestablishment) noticed a correlation between UFO sightings and the publication of UFO stories in the media, and noted concentrations of cases in the Los Alamos-Albuquerque area, Oak Ridge, White Sands, Strategic Air Command locations, ports, and industrial sites.
  - id: ed8da95f-6e27-4abf-9cc6-c8c2839f076f
    type: administrative
    attestation: first_hand
    location: page 17, Project BEAR section
    refs:
      - id: 4179e011-d81c-41fc-92a3-69adc291c07b
        name: Project BEAR
      - id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
        name: Ruppelt, Edward
      - id: ac5af2a7-ae4d-4f29-a4b8-237cfd729007
        name: Battelle Memorial Institute
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
        name: Project GRUDGE Reestablishment
    quote: |-
      Project BEAR was an informal name given by Capt Ruppelt, Chief of Project GRUDGE, to a contract he created with the Battelle Memorial Institute (BMI) to provide scientific support to the new Project GRUDGE. BMI provided technical support, studied the reliability of interviewee information recall from UFO sightings, created an improved debriefing questionnaire for observers, and developed a computer punch-card system.
    text: |-
      Project BEAR was an informal name given by Captain Edward Ruppelt to a contract with the Battelle Memorial Institute (BMI) to provide scientific support; BMI provided technical support, studied reliability of interviewee recall, created an improved debriefing questionnaire, and developed a computer punch-card system for statistical study of UFO reports.
  - id: 6419206c-7f49-4048-a0d0-94cde7592a43
    type: administrative
    attestation: first_hand
    location: page 17, Project BEAR section
    date: '1954'
    refs:
      - id: ac5af2a7-ae4d-4f29-a4b8-237cfd729007
        name: Battelle Memorial Institute
      - id: 1dc1e514-4fc4-4a54-a2ab-89a19f4a6a1d
        name: Air Technical Intelligence Center
      - id: 57a770b5-62d3-48aa-b11a-07e91a472cc8
        name: Special Report No. 14
      - id: 4179e011-d81c-41fc-92a3-69adc291c07b
        name: Project BEAR
    quote: |-
      BMI released a report under the cover of ATIC to maintain its anonymity. Completed in late 1954, the report was titled "Special Report No. 14."
    text: |-
      The Battelle Memorial Institute (BMI) released its Project BEAR report under the cover of the Air Technical Intelligence Center (ATIC) to maintain its anonymity; the report, completed in late 1954, was titled 'Special Report No. 14.'
  - id: 4b6095b8-0ce7-4706-a0a0-a83636d736d7
    type: administrative
    attestation: first_hand
    location: page 17, Project BEAR Results
    refs:
      - id: 57a770b5-62d3-48aa-b11a-07e91a472cc8
        name: Special Report No. 14
      - id: ac5af2a7-ae4d-4f29-a4b8-237cfd729007
        name: Battelle Memorial Institute
    quote: |-
      It concluded that all cases that had enough data were resolved and readily explainable...It also concluded that it was highly improbable that any of these cases represented technology beyond their "present day scientific knowledge."
    text: |-
      Special Report No. 14 concluded that all UFO cases that had enough data were resolved and readily explainable, and that it was highly improbable that any cases represented technology beyond 'present day scientific knowledge.'
  - id: d5eb6791-44ba-4a03-a702-5fe78a8013b3
    type: administrative
    attestation: first_hand
    location: page 17, CIA Special Study Group section
    date: '1952'
    refs:
      - id: e58c44ab-7f58-48ea-814d-f0e6782aec9c
        name: CIA Special Study Group 1952
      - id: e09ff925-d83d-4676-b0e4-8d28872b61f0
        name: CIA
      - id: 2c84b989-a5e9-44f9-bd86-d329b4f4decb
        name: Washington DC UFO Flap 1952
    quote: |-
      After an increase in UFO sightings in 1952, particularly those that gained widespread attention over the Washington, D.C. area during that summer, CIA's Deputy Director for Intelligence, Robert Amory Jr., tasked the CIA Office of Scientific Intelligence's (OSI) Physics and Electronics Division to review UFO cases.
    text: |-
      Following increased UFO sightings in 1952, particularly over the Washington DC area that summer, CIA Deputy Director for Intelligence Robert Amory Jr. tasked the CIA Office of Scientific Intelligence's Physics and Electronics Division to review UFO cases.
  - id: 246a33f9-b2d8-4f2c-8b03-05210e6a18c5
    type: administrative
    attestation: first_hand
    location: page 17, CIA Special Study Group Results
    date: '1952'
    refs:
      - id: e58c44ab-7f58-48ea-814d-f0e6782aec9c
        name: CIA Special Study Group 1952
      - id: 1dc1e514-4fc4-4a54-a2ab-89a19f4a6a1d
        name: Air Technical Intelligence Center
      - id: dcae0323-af47-4bc7-8bf7-72c863317e0e
        name: Project SAUCER
      - id: 95137136-8695-4ad6-813f-01b6529a0d0a
        name: Project GRUDGE Original
    quote: |-
      The Study Group assessed that 90 percent of the reports were explainable and the other 10 percent amounted to "incredible" claims but rejected the notion that they represented Soviet or extraterrestrial technology.
    text: |-
      The CIA Special Study Group reviewed all ATIC data from Projects SIGN through GRUDGE and assessed that 90 percent of reports were explainable while the other 10 percent were 'incredible' claims but did not represent Soviet or extraterrestrial technology.
  - id: f58c1459-57b3-4ce8-8720-ba330907b803
    type: opinion
    attestation: second_hand
    location: page 17-18, CIA Special Study Group Results
    date: '1952'
    refs:
      - id: e58c44ab-7f58-48ea-814d-f0e6782aec9c
        name: CIA Special Study Group 1952
    quote: |-
      The group also studied Soviet press and found no reports of UFOs, leading the group to assume that the Soviets were deliberately suppressing such reports. The Study Group also believed that the Soviets could use reports of UFOs to create hysteria in the United States or overload the U.S. early-warning system.
    text: |-
      The CIA Special Study Group found no Soviet press reports of UFOs and concluded the Soviets were deliberately suppressing such reports, and that the Soviets could use reports of UFOs to create hysteria in the United States or overload the US early-warning system.
