    quote: |-
      The Roswell incident refers to the July 1947 recovery of metallic and rubber debris from a crashed military balloon near Roswell Army Air Field personnel that sparked conspiracy theories and claims that the debris was from an alien spaceship and part of a USG cover-up.
    text: |-
      The Roswell incident refers to the 1947-07 recovery of metallic and rubber debris from a crashed military balloon near Roswell Army Air Field personnel that sparked conspiracy theories and claims that the debris was from an alien spaceship and part of a United States Government cover-up.
