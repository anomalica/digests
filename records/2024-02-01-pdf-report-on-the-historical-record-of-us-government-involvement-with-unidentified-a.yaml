    quote: |-
      Project BEAR was an informal name given by Capt Ruppelt, Chief of Project GRUDGE, to a contract he created with the Battelle Memorial Institute (BMI) to provide scientific support to the new Project GRUDGE.
    text: |-
      Captain Edward Ruppelt dubbed his contract with the Battelle Memorial Institute (BMI) 'Project BEAR.' BMI provided technical support, studied reliability of interviewee information recall, created improved debriefing questionnaires, and developed a computer punch-card system to automate statistical study of UFO reports.
