        name: AARO UAP Historical Record Report, Volume I
    quote: |-
      In 2021, without sufficient justification, the scope of an IC Controlled Access Program was expanded to protect UAP reverse-engineering. This program never recovered or reverse-engineered any UAP or extraterrestrial spacecraft. This IC program was disestablished due to its lack of merit.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) reported that in 2021, without sufficient justification, the scope of an Intelligence Community (IC) Controlled Access Program was expanded to protect UAP reverse-engineering; the program was subsequently disestablished due to its lack of merit and never recovered or reverse-engineered any UAP or extraterrestrial spacecraft.
