    text: |-
      The All-Domain Anomaly Resolution Office (AARO) stated that the executives, scientists, and chief technology officers of companies named by interviewees as allegedly involved in reverse-engineering extraterrestrial technology met with the Director of AARO and denied on the record that they have ever recovered, possessed, or engaged in reverse-engineering of extraterrestrial technology.
  - id: 03264056-0d25-4e78-9924-11d9ead5d5d7
