    quote: |-
      The names AAWSAP and AATIP have been used interchangeably for the name of this program, including on official documentation. Unlike AAWSAP, AATIP was never an official DoD program.
    text: |-
      The AARO UAP Historical Record Report, Volume I notes that the names AAWSAP and AATIP have been used interchangeably, and that unlike AAWSAP, AATIP was never an official DoD programme. After AAWSAP was cancelled, the AATIP moniker was used by some individuals associated with an informal, unofficial UAP community of interest within DoD.
