      The Defense Intelligence Agency (DIA) established the Advanced Aerospace Weapons System Application Program (AAWSAP) in 2009, also known as the Advanced Aerospace Threat Identification Program (AATIP), in coordination with the Office of the Under Secretary of Defense for Intelligence. The contract was awarded to a private sector organisation (identified elsewhere in the document as Bigelow Aerospace).
