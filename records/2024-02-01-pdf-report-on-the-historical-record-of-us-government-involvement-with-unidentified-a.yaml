        name: Advanced Aerospace Threat Identification Program (AATIP)
    quote: |-
      AARO assesses that the inaccurate claim that the USG is reverse-engineering extraterrestrial technology and is hiding it from Congress is, in large part, the result of circular reporting from a group of individuals who believe this to be the case, despite the lack of any evidence. AARO notes that although claims that the USG has recovered and hidden spacecraft date back to the 1940s and 1950s, more modern instances of these claims largely stem from a consistent group of individuals who have been involved in various UAP-related endeavors since at least 2009.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) assessed that inaccurate claims that the USG is reverse-engineering extraterrestrial technology and hiding it from Congress are, in large part, the result of circular reporting from a consistent group of individuals who have been involved in various UAP-related endeavors since at least 2009, many of whom were involved in or supportive of a cancelled Defense Intelligence Agency (DIA) program and the subsequent failed attempt to reestablish it under the Department of Homeland Security (DHS) as KONA BLUE.
  - id: 6e1f62d7-ac30-48f4-b8c3-cdd90948759d
    type: opinion
    attestation: first_hand
    location: page 12
    date: '2024-02-01'
    refs:
      - id: a06a6048-b16a-44d0-9881-fe8988764b28
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: da034ec3-b450-42ba-81ff-552176352dd8
        name: AARO UAP Historical Record Report, Volume I
    quote: |-
      Some literature suggests individual accounts can be unreliable as they are subject to a person's interpretation of sensory data through the filter of their experiences, beliefs, or state of mind during the event. A person who reports a case might be credible, in that they believe the elements of their account to be accurate. However, their reliability, which is their ability to accurately interpret events - as well as to recall and convey those events due to a range of factors - is altogether different from their inherent sincerity.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) noted that some literature suggests individual accounts can be unreliable, as they are subject to a person's interpretation of sensory data through the filter of their experiences, beliefs, or state of mind during the event, distinguishing a witness's credibility (belief in the accuracy of their account) from their reliability (actual ability to accurately interpret and recall events).
  - id: bb9a5ffd-9f02-413d-9d56-3bcf0175e5e6
