      When DIA cancelled this program, its supporters proposed to DHS that they create and fund a new version of AAWSAP/AATIP under a SAP. This proposal, codenamed KONA BLUE, would restart UAP investigations, paranormal research (including alleged 'human consciousness anomalies') and reverse-engineer any recovered off-world spacecraft that they hoped to acquire.
    text: |-
      When the Defense Intelligence Agency (DIA) cancelled the AAWSAP/AATIP programme, its supporters proposed to the Department of Homeland Security (DHS) that they create and fund a new version under a Special Access Program (SAP), codenamed KONA BLUE, to restart UAP investigations, paranormal research, and reverse-engineer any recovered off-world spacecraft. The proposal gained initial traction at DHS to the point where a Prospective Special Access Program (PSAP) was officially requested, but it was eventually rejected by DHS leadership for lacking merit.
