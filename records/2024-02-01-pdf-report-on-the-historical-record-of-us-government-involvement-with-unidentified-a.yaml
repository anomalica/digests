    text: |-
      The French government sponsored three comprehensive UAP investigatory programmes: Groupe d'Etude et d'Information sur les Phénomènes Aérospatiaux Non-identifiés (GEPAN, 1977-1987), Service d'Expertise des Phénomènes de Rentrées Atmosphériques (SEPRA, 1988-2004), and a successor GEIPAN established in 2005. SEPRA concluded that 28 percent of its caseload remained unresolved.
