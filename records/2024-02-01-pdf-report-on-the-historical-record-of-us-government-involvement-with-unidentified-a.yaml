  - id: cf0852db-9be6-4ca9-84f5-976448823d92
    type: administrative
    location: file_page 6, Section I
    refs:
      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      Since 1945, the USG has funded and supported UAP investigations with the goal of determining whether UAP represented a flight safety risk, technological leaps by competitor nations, or evidence of off-world technology under intelligent control.
    text: |-
      Since 1945, the United States Government has funded and supported UAP investigations with the goal of determining whether UAP represented a flight safety risk, technological leaps by competitor nations, or evidence of off-world technology under intelligent control.
  - id: 40a79a6a-0e65-4b51-acec-e6fb0e9623b7
    type: administrative
    location: file_page 6, Section I
    refs:
      - id: df97d959-b3c3-45f0-827b-53ce253a26b3
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      AARO methodology applies both the scientific method and intelligence analysis tradecraft to identify and help mitigate risks UAP may pose to domain safety and to discover, characterize, and attribute potential competitor technological systems.
    text: |-
      AARO methodology applies both the scientific method and intelligence analysis tradecraft to identify and help mitigate risks UAP may pose to domain safety and to discover, characterise, and attribute potential competitor technological systems.
  - id: b019ba3e-1f72-49b2-ae67-2424e29a595c
    type: administrative
    location: file_page 6, Section I
    refs:
      - id: e3ea4ad0-450f-4fd2-ab87-f64a1e7ba6bc
        name: Reverse-engineering of extraterrestrial technology
      - id: e92a8367-1bcd-48ca-beae-676949560eb0
        name: United States Congress
    quote: |-
      A consistent theme in popular culture involves a particularly persistent narrative that the USG - or a secretive organization within it - recovered several off-world spacecraft and extraterrestrial biological remains, that it operates a program or programs to reverse engineer the recovered technology, and that it has conspired since the 1940s to keep this effort hidden from the United States Congress and the American public.
    text: |-
      A persistent narrative in popular culture holds that the United States Government, or a secretive organisation within it, recovered several off-world spacecraft and extraterrestrial biological remains, operates a programme or programmes to reverse-engineer the recovered technology, and has conspired since the 1940s to keep this hidden from the United States Congress and the American public.
  - id: b949f94f-ed95-4b13-b723-cb3498bf9afa
    type: administrative
    location: file_page 6-7, Section I
    refs:
      - id: 498754fb-7980-482c-b877-57fbe17e1889
        name: AARO Historical Record Report (HR2)
      - id: df97d959-b3c3-45f0-827b-53ce253a26b3
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: e3ea4ad0-450f-4fd2-ab87-f64a1e7ba6bc
        name: Reverse-engineering of extraterrestrial technology
    quote: |-
      The goal of this report is not to prove or disprove any particular belief set, but rather to use a rigorous analytic and scientific approach to investigate past USG-sponsored UAP investigation efforts and the claims made by interviewees that the USG and various contractors have recovered and are hiding off-world technology and biological material.
    text: |-
      The goal of the Historical Record Report is not to prove or disprove any particular belief set, but to use a rigorous analytic and scientific approach to investigate past US Government-sponsored UAP investigation efforts and the claims by interviewees that the US Government and various contractors have recovered and are hiding off-world technology and biological material.
  - id: 223c3ccb-b2d4-4916-8c2b-b28b0733a5ff
    type: opinion
    attestation: second_hand
    location: file_page 7, Section II
    refs:
      - id: df97d959-b3c3-45f0-827b-53ce253a26b3
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: eabf6bfa-3904-4ef3-94c0-2dc4e727e817
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      AARO found no evidence that any USG investigation, academic-sponsored research, or official review panel has confirmed that any sighting of a UAP represented extraterrestrial technology.
    text: |-
      AARO found no evidence that any US Government investigation, academic-sponsored research, or official review panel has confirmed that any sighting of a UAP represented extraterrestrial technology.
