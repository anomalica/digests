    quote: |-
      It is important to note that none of the interviewees had firsthand knowledge of these programs - they were not approved for access to nor did they work on these efforts - which likely resulted in misinterpretation of the programs' origins and purpose.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) stated that none of the interviewees who provided accounts of hidden UAP programs had firsthand knowledge of these programs—they were not approved for access to nor did they work on these efforts—which likely resulted in misinterpretation of the programs' origins and purpose.
