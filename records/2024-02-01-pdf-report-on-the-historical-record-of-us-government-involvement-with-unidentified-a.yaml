    text: |-
      Canada's Project Magnet (1950-1954) was run by Department of Transport engineer Wilbert B. Smith, who assessed that UFOs were of extraterrestrial origin and believed he was in personal contact with extraterrestrial beings through telepathy. The Canadian government closed the project, and Smith admitted that his beliefs were his alone and not the government's official position.
