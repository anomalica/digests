    quote: |-
      KONA BLUE traces its origins to the DIA-managed AAWSAP/AATIP program, which was funded through a special appropriation and executed by its primary contractor, a private sector organization. DIA cancelled the program in 2012 due to lack of merit and the utility of the deliverables.
    text: |-
      The KONA BLUE proposal traces its origins to the Defense Intelligence Agency (DIA)-managed Advanced Aerospace Weapon System Applications Program (AAWSAP) / Advanced Aerospace Threat Identification Program (AATIP) programme, which was funded through a special appropriation and executed by a primary private-sector contractor. The DIA cancelled the programme in 2012 due to lack of merit and the utility of the deliverables.
