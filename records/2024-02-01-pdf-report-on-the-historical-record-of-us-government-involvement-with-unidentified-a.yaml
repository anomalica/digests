    text: |-
      The Condon panel investigated a claim by radio broadcaster Frank Edwards in a 1966 book that a piece of a UFO was recovered near Washington D.C. in the summer of 1952; Edwards claimed a U.S. Navy jet fired on a two-foot diameter glowing disc and dislodged a one-pound fragment recovered by a ground team.
