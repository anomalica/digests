        name: GAO Roswell Report 1995
    quote: |-
      Four air accidents were reported by the Army Air Force in New Mexico during July 1947. All involved military aircraft and occurred after July 8, 1947 - the date the RAAF public information office first reported the crash and recovery of a "flying disc" near Roswell.
    text: |-
      The GAO's 1995 Roswell report found that four air accidents were reported by the US Army Air Force in New Mexico during 1947-07, all involving military aircraft occurring after 1947-07-08; no military air accidents were reported in that month for the date of the alleged Roswell crash.
