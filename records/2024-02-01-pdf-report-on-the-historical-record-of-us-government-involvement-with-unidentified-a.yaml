    text: |-
      Project TWINKLE was only able to secure one camera, which was frequently moved between locations, and no photographs of the fireballs were ever taken.
  - id: 04d8160a-3559-4a3e-958e-06a6c3cc41ac
    type: administrative
    attestation: first_hand
    location: page 16, Project GRUDGE Reestablishment section
    date: 1951-10
    refs:
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
        name: Project GRUDGE Reestablishment
      - id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
        name: Ruppelt, Edward
    quote: |-
      In late October 1951, almost two years after Project GRUDGE was disestablished, the USAF's UFO mission was reorganized into another distinct program - also named Project GRUDGE - led by Capt Ruppelt.
    text: |-
      In late 1951-10, the USAF's UFO mission was reorganised into a new programme also named Project GRUDGE, led by Captain Edward Ruppelt.
  - id: dbc119f8-3da1-46cf-ad73-e6667a092585
    type: testimony
    attestation: second_hand
    speaker:
      id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
      name: Ruppelt, Edward
    location: page 16, Project GRUDGE Reestablishment section
    refs:
      - id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
        name: Ruppelt, Edward
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
        name: Project GRUDGE Reestablishment
    quote: |-
      His primary goal was to ensure that there would be "no wild speculation" and that if his staff were "too pro or too con" regarding the off-world origin of UFOs, they would be let go. He claimed to have fired three staff.
    text: |-
      Captain Edward Ruppelt stated that his primary goal was to ensure there would be 'no wild speculation' and that staff who were 'too pro or too con' regarding the off-world origin of UFOs would be let go; he claimed to have fired three staff.
  - id: f4d54799-34af-4c0a-aeac-5b2494725416
    type: administrative
    attestation: second_hand
    speaker:
      id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
      name: Ruppelt, Edward
    location: page 16, Project GRUDGE Reestablishment section
    refs:
      - id: 974ac02d-dbc5-4e4d-b0c3-e05c8462db58
        name: Ruppelt, Edward
      - id: 124d49c4-99fb-4509-b7dc-37a5742417a2
