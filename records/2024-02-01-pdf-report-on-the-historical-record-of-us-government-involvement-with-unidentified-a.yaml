      - id: 2468ac3f-5489-4c47-b07a-6136bc924e26
        name: Confirmation Bias (concept)
    quote: |-
      Similarly, confirmation bias is a recognized subconscious cognitive process whereby a person tends to seek and believe information that supports their hypothesis and to discount information that undermines their hypothesis.
    text: |-
      The All-Domain Anomaly Resolution Office (AARO) cited confirmation bias as a recognized subconscious cognitive process whereby a person tends to seek and believe information that supports their hypothesis and to discount information that undermines their hypothesis, applying this concept to its methodology assumptions.
