        name: United States Intelligence Community (IC)
      - id: 76589dcb-e33e-4960-8ac3-4629971775af
        name: United States Department of Defense (DoD)
    quote: |-
      In completing this report, AARO reviewed all official USG investigatory efforts since 1945, researched classified and unclassified archives, conducted approximately 30 interviews, and partnered with Intelligence Community (IC) and Department of Defense (DoD) officials responsible for controlled and special access program oversight, respectively.
    text: |-
      In completing the Historical Record Report (HR2), AARO reviewed all official United States Government investigatory efforts since 1945, researched classified and unclassified archives, conducted approximately 30 interviews, and partnered with Intelligence Community and Department of Defense officials responsible for controlled and special access program oversight.
