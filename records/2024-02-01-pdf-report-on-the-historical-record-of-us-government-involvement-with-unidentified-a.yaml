        name: Project GRUDGE Original
    quote: |-
      Project GRUDGE investigated 244 reports of UFO sightings. It did not discover any evidence that the UAP sightings represented foreign technology
    text: |-
      Project GRUDGE (Original) investigated 244 reports of UFO sightings and did not discover any evidence that the sightings represented foreign technology.
  - id: 7c6b7048-b73d-42c5-b6dc-5f8def525c32
    type: administrative
