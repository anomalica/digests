        name: Project GRUDGE Original
    quote: |-
      The report recommended that the organization be downsized and de-emphasized because it was believed Project GRUDGE's very existence fueled a "war hysteria" within the public. The USAF subsequently implemented a public affairs campaign designed to persuade the public that UFOs constituted nothing unusual or extraordinary.
    text: |-
      Project GRUDGE (Original) recommended it be downsized and de-emphasised because its existence was believed to fuel 'war hysteria' within the public, and the USAF subsequently implemented a public affairs campaign to persuade the public that UFOs were nothing unusual.
