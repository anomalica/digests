  - id: 648d0ea8-d244-453d-8a91-5cb529d71fd7
    type: opinion
    attestation: first_hand
    location: page 6
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      The proliferation of television programs, books, movies, and the vast amount of internet and social media content centered on UAP-related topics most likely has influenced the public conversation on this topic, and reinforced these beliefs within some sections of the population.
    text: |-
      AARO's opinion is that the proliferation of television programs, books, movies, and the vast amount of internet and social media content centered on UAP-related topics most likely has influenced the public conversation on UAP and reinforced beliefs in extraterrestrial technology within some sections of the population.
  - id: 15ed4efc-fb48-47e8-8e4d-7c904127072f
    type: opinion
    attestation: first_hand
    location: page 9
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      The interviewees and others who have mistakenly associated authentic sensitive national security programs with UAP had incomplete or unauthorized access to these programs; discussion of these programs outside of secure facilities presents a high risk of exposing national security information.
    text: |-
      AARO's opinion is that many individuals mistakenly associated authentic USG classified programs with alien and extraterrestrial activity due to incomplete or unauthorized access to those programs, and that discussion of these programs outside of secure facilities presents a high risk of exposing national security information.
  - id: 48e8f08c-81ac-460d-b89a-e1b1a31bf481
    type: opinion
    attestation: first_hand
    location: page 9
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      AARO assesses that the inaccurate claim that the USG is reverse-engineering extraterrestrial technology and is hiding it from Congress is, in large part, the result of circular reporting from a group of individuals who believe this to be the case, despite the lack of any evidence. AARO notes that although claims that the USG has recovered and hidden spacecraft date back to the 1940s and 1950s, more modern instances of these claims largely stem from a consistent group of individuals who have been involved in various UAP-related endeavors since at least 2009.
    text: |-
      AARO's opinion is that the inaccurate claim that the USG is reverse-engineering extraterrestrial technology and is hiding it from Congress is, in large part, the result of circular reporting from a group of individuals who believe this to be the case, despite the lack of any evidence, and that more modern instances of these claims largely stem from a consistent group of individuals involved in various UAP-related endeavors since at least 2009.
  - id: 87294ee9-ed2b-44c1-83fc-15d1e626aad1
    type: opinion
    attestation: first_hand
    location: page 9
    date: 2024-02
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: 95216c89-d555-4554-8f21-fda5aa9ff3f5
        name: Defense Intelligence Agency (organisation)
      - id: f0d68f71-836e-464f-91c5-b76b71bed6ae
        name: Department of Homeland Security
      - id: d6e9b300-d668-464b-87be-ecff66b34737
        name: KONA BLUE
    quote: |-
      Many of these individuals were involved in or supportive of a cancelled DIA program and the subsequent but failed attempt to reestablish this program under DHS, called KONA BLUE.
    text: |-
      AARO's opinion is that many of the individuals involved in circular UAP reverse-engineering claims were involved in or supportive of a cancelled Defense Intelligence Agency (DIA) program and the subsequent but failed attempt to reestablish this program under the Department of Homeland Security (DHS), called KONA BLUE.
  - id: 0693cede-350a-42e5-bed7-8f151ac28f45
    type: administrative
    attestation: first_hand
    location: page 9
    refs:
      - id: d6e9b300-d668-464b-87be-ecff66b34737
        name: KONA BLUE
      - id: f0d68f71-836e-464f-91c5-b76b71bed6ae
        name: Department of Homeland Security
    quote: |-
      One named program was a UAP-related Prospective Special Access Program (PSAP) called KONA BLUE that was proposed to the Department of Homeland Security (DHS) and supported by individuals who believed the USG was hiding off-world technology. The program was never approved by DHS and its supporters never provided empirical evidence to support their claims.
    text: |-
      KONA BLUE was a proposed UAP-related Prospective Special Access Program (PSAP) proposed to the Department of Homeland Security (DHS) and supported by individuals who believed the USG was hiding off-world technology. The program was never approved by DHS and its supporters never provided empirical evidence to support their claims.
  - id: f312d42c-674e-4f4d-8231-0b190f974b6b
    type: administrative
    attestation: first_hand
    location: page 9
    date: '2021'
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: de157ad1-2c07-4ac8-b70f-2716f968412d
        name: IC Controlled Access Program UAP Expansion
    quote: |-
      In 2021, without sufficient justification, the scope of an IC Controlled Access Program was expanded to protect UAP reverse-engineering. This program never recovered or reverse-engineered any UAP or extraterrestrial spacecraft. This IC program was disestablished due to its lack of merit.
    text: |-
      In 2021, without sufficient justification, the scope of an Intelligence Community (IC) Controlled Access Program was expanded to protect UAP reverse-engineering. This program never recovered or reverse-engineered any UAP or extraterrestrial spacecraft and was disestablished due to its lack of merit.
  - id: 5ceecda3-3577-4e31-8813-5c294b5c9112
    type: administrative
    attestation: first_hand
    location: page 8
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      Interviewees' claims that between 2004 and 2007 the White House requested a research institute in Virginia study the theoretical societal impacts of disclosing that UAP are extraterrestrial in origin; AARO confirmed the study was conducted, but it was not requested by the White House.
    text: |-
      AARO confirmed that between 2004 and 2007 a research institute in Virginia studied the theoretical societal impacts of disclosing that UAP are extraterrestrial in origin, but determined the study was not requested by the White House as interviewees claimed.
  - id: a32745ec-2aa6-45d7-93d3-2c9d92385170
    type: administrative
    attestation: first_hand
    location: page 8
    refs:
      - id: bd6a675f-afbe-4771-b301-c38776b822f6
        name: All-Domain Anomaly Resolution Office (AARO)
      - id: 6423e883-0ed5-48c0-acf3-2ce76ab6d7a1
        name: AARO Interviewee UAP Metal Sample
    quote: |-
      AARO has concluded that a sample from an alleged crashed off-world spacecraft that AARO acquired from a private UAP investigating organization and the U.S. Army is a manufactured, terrestrial alloy and does not represent off-world technology or possess any exceptional qualities. The sample is primarily composed of magnesium, zinc, and bismuth with some other trace elements, such as lead.
    text: |-
      AARO acquired a metal sample from a private UAP investigating organization and the U.S. Army, which was alleged to be from a crashed off-world spacecraft. AARO concluded the sample is a manufactured, terrestrial alloy composed primarily of magnesium, zinc, and bismuth with trace elements including lead, and does not represent off-world technology or possess any exceptional qualities.
