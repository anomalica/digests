    quote: |-
      Claims of "alien bodies" at the Roswell Army Air Force (RAAF) hospital were most likely the result of the conflation of two separate incidents: a 1956 KC-97 aircraft accident in which 11 Air Force members lost their lives; and a 1959 manned balloon mishap in which two Air Force pilots were injured.
    text: |-
      Claims of alien bodies at the Roswell Army Air Field hospital were most likely the result of the conflation of two separate incidents: a 1956 KC-97 aircraft accident in which 11 Air Force members lost their lives, and a 1959 manned balloon mishap in which two Air Force pilots were injured.
