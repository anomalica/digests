      Project GRUDGE was terminated on December 27, 1949, around the time a comprehensive report on its findings was published.
    text: |-
      Project GRUDGE (Original) was terminated on 1949-12-27, around the time a comprehensive report on its findings was published.
  - id: 48daac99-9a9c-4b95-b1d7-8bd20277e3db
    type: administrative
    attestation: first_hand
    location: page 16, Project GRUDGE Results
    refs:
