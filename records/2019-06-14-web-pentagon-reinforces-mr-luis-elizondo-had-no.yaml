    quote: |-
      "I can confirm that the memo you're referring to is authentic. DOD received it and responded to Sen. Reid," Ms. Gough said... "It makes no change to previous statements. Mr. Elizondo had no assigned responsibilities for AATIP while he was in OUSD(I). DIA administered AATIP, and Elizondo was never assigned to DIA. Elizondo did interact with the DIA office managing the program while the program was still ongoing, but he did not lead it."
    text: |-
      Susan Gough's statement to The Black Vault was received on June 13, 2019. She confirmed the Reid memo is authentic, that the Department of Defense (DoD) received it and responded to Senator Reid, and that the Defense Intelligence Agency (DIA) administered the Advanced Aerospace Threat Identification Program (AATIP), and that Luis Elizondo was never assigned to the Defense Intelligence Agency (DIA).
