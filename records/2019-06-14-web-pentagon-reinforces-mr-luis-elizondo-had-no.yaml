    text: |-
      The Elizondo AATIP Role Dispute, 2019 involves Harold Puthoff acknowledging there are misunderstandings about Luis Elizondo's role in the Advanced Aerospace Threat Identification Program (AATIP), and stating that those in the Public Affairs Office are often themselves unknowledgeable about details of highly-classified sensitive programs for security reasons.
