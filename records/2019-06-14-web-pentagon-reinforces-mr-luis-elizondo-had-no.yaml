    quote: |-
      I have been following all the buzz back ‘n forth concerning Elizondo’s role in AATIP, and recognize that there are a number of misunderstandings – for reasonable reasons – given that the public doesn’t have detailed access to daily activities in Pentagon projects/offices. Unfortunately for the public, those not directly connected, e.g., in the Public Affairs Office, are often themselves sketchy about details concerning highly-classified sensitive programs for which they have little-to-no access for security reasons.
    text: |-
      Hal Puthoff considers that the public does not have detailed access to daily activities in Pentagon projects and offices, and that those not directly connected, such as staff in the Public Affairs Office, are often themselves unclear about details concerning highly classified sensitive programs for which they have little to no access.
