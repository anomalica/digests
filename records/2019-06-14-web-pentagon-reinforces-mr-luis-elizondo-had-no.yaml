    quote: |-
      It is unclear how Dr. Puthoff could have worked under Mr. Elizondo's leadership, since AAWSAP/AATIP contracted work began in 2008 at DIA and Mr. Elizondo's alleged leadership began in 2010 at OUSDI when the program was transferred.
    text: |-
      John Greenewald Jr. noted a timeline discrepancy: the Advanced Aerospace Weapon System Applications Program (AAWSAP)/Advanced Aerospace Threat Identification Program (AATIP) contracted work began in 2008 at the Defense Intelligence Agency (DIA), while Luis Elizondo's alleged leadership allegedly began in 2010 at the Office of Under Secretary of Defense for Intelligence (OUSDI) when the program was transferred, raising questions about how Puthoff could have worked under Elizondo's leadership for the full duration.
