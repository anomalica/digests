    quote: |-
      I have no problem asserting that as an AAWSAP [Advanced Aerospace Weapon System Applications Program]/AATIP Contractor & Senior Advisor I continued to attend meetings, provide briefings, gain access to videos, provide Proposed Program Plans, meet with staff, etc., all under the aegis of Elizondo’s leadership and responsibility for maintaining continuity of the Program effort and goals until he resigned.
    text: |-
      As an Advanced Aerospace Weapon System Applications Program (AAWSAP)/Advanced Aerospace Threat Identification Program (AATIP) Contractor and Senior Advisor, Hal Puthoff continued to attend meetings, provide briefings, gain access to videos, provide Proposed Program Plans, and meet with staff, all under the aegis of Luis Elizondo's leadership and responsibility for maintaining continuity of the program effort and goals until Elizondo resigned.
  - id: 17c2c823-3b97-4aa0-b7bd-8b1bb68fbc3c
