    text: |-
      Professor James MacDonald's aim in visiting Australia and New Zealand was to determine whether UFO reports from those countries tallied with US reports—that is, whether UAP constituted a global phenomenon.
  - id: c1119857-a5ca-4b4f-a226-5f04400780c6
