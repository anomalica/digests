    quote: |-
      What's amazing about the Westall story is that it's as if it never happened. It's effectively been wiped from history. And yet, just down the road from this suburban RSL, 55 years ago, students, teachers, local residents looked up into the sky and saw what can only be described as a UFO, a flying saucer.
    text: |-
      Ross Coulthart states that the Westall UFO Sighting has been effectively wiped from history, with students, teachers, and local residents having seen a UAP approximately 55 years before 2021, and those witnesses remaining certain of what they saw.
