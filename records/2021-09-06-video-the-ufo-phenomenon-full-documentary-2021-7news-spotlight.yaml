      This was hovering. The stealth bomber doesn't hover. This thing also showed hypersonic, instantaneous hypersonic velocity. No. It was also whisper quiet. There was no noise of any propulsion system at all.
    text: |-
      Ross Coulthart states that the UAP that Annie Farinaccio saw was hovering and showed hypersonic instantaneous velocity without a sonic boom and with no noise.
