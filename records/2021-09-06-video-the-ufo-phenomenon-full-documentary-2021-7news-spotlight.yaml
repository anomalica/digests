    quote: |-
      Officially, he was working for the US Navy, but in his spare time, he's checking many Australian reports of UFOs and comparing them with American reports. His aim is to see if the reports tally, in short, whether UFOs constitute a global phenomenon.
    text: |-
      James MacDonald was officially working for the US Navy while also investigating Australian and New Zealand UFO reports in his spare time, comparing them with American reports to assess whether UFOs were a global phenomenon.
