    text: |-
      During an encounter Erik Nanstiel woke up standing in a dark gray room with a cylinder running floor to ceiling in the middle, an eight or nine foot (about 2.5 to 2.7 metre) tall brightly lit doorway, and a dozen or more very tall Greys about seven or eight feet (about 2.1 to 2.4 metres) tall observing from the back of the room.
