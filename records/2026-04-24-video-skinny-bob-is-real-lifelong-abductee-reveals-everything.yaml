    quote: |-
      there was more than a dozen voices all at the same time ... I'm like, I did this, like, shut up, go away. And they all shut up at the same time, simultaneously, like a switch had gone off. And then they turned around their backs to me and then went further back against the wall, deeper into the shadows
    text: |-
      Erik Nanstiel heard more than a dozen telepathic voices from the tall Greys at once as gibberish, became upset, mentally told them to shut up and go away, and they all fell silent simultaneously as if a switch had gone off, then withdrew into the shadows while continuing to observe him.
  - id: 465e9832-ff56-4888-bd3e-7a9696e9e06c
