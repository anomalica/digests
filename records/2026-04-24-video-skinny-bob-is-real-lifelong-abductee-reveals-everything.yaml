    text: |-
      The first encounter in which Erik Nanstiel actually saw Greys that he remembers occurred on Saturday 1994-08-20, the third Saturday of the month, in Wheeling, Illinois, where he was sharing a two-bedroom apartment with his childhood best friend Joe, who was away that weekend.
