        name: alien abduction phenomenon
    quote: |-
      They seem to follow family lines. And they have a schedule and they seem to, every 20 years, they'll come for a four-year rotation and they'll come every four to six weeks for four years. So you'll have a rash... like 48 encounters over a four-year period... And then 20 years off and then it happens again.
    text: |-
      Erik Nanstiel believes the beings follow a schedule along family lines, returning every 20 years for a four-year rotation during which they come every four to six weeks, producing roughly 48 or more encounters over the four years before a 20-year gap.
  - id: da36a7b5-9cf6-48e5-8e77-f5dc276cf42a
