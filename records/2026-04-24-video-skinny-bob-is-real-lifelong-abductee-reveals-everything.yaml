    quote: |-
      I had GERD for years and earlier that year ... I started having like really sharp stomach pains the same time my girlfriend was having them. Well, hers ended up being a type of cancer that she had treated and she's fine. But so it made me think, well, did I have stomach cancer or cancer somewhere else in my gut?
    text: |-
      Erik Nanstiel had suffered gastroesophageal reflux disease (GERD) for years and earlier had developed sharp stomach pains at the same time as his girlfriend, whose pains turned out to be a type of cancer she had treated, leading him to wonder whether he had stomach or gut cancer that the doctor creature cured.
  - id: fccc6acf-a479-45d4-bf82-9c8d8d9f7aad
    type: testimony
    attestation: first_hand
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
