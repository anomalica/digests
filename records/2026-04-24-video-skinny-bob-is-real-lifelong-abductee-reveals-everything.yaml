    quote: It started for me when I was a baby, but it started for my mother in the 1950s.
    text: |-
      Erik Nanstiel's abduction experiences began when he was a baby, while his mother's experiences began in the 1950s.
  - id: ba72b869-f30c-45a8-9c85-2a3c3abad2f0
    type: testimony
    attestation: first_hand
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
      name: Nanstiel, Erik
    location: 00:05:01.7-00:05:17.7
    date: '1970'
    refs:
      - id: 0aad9179-33c1-4383-aab7-5eb12429386e
        name: Nanstiel, Erik
    quote: |-
      In 1970, I was, I want to say about spring, like April, May of 1970. I was about 15, 16 months old. And... It started with these white orbs of plasma that would enter my room.
    text: |-
      Around April or May of 1970, when Erik Nanstiel was about 15 to 16 months old, his experiences started with white orbs of plasma entering his room, which recurred on a nearly monthly basis for four years.
  - id: da57b7e9-6394-4013-a76a-6250a46325c6
    type: testimony
    attestation: first_hand
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
      name: Nanstiel, Erik
    location: 00:05:31.7-00:06:04.9
    refs:
      - id: 0aad9179-33c1-4383-aab7-5eb12429386e
        name: Nanstiel, Erik
    quote: |-
      And I remember standing up in my crib you know, with the the wooden bars and just holding on to the railing and and looking at my closet. And as I did this white plasma orb, it was like glowing bright, just came right through my bedroom closet door and cross the room at about the speed of an adult walking. And it came up to my forehead, touch my forehead, and I lost consciousness.
    text: |-
      As an infant, Erik Nanstiel would stand in his crib holding the railing, and a bright glowing white plasma orb would come through his bedroom closet door, cross the room at about the speed of an adult walking, touch his forehead, and he would lose consciousness.
  - id: a4f15734-81bc-4282-b373-60e2542078ef
    type: testimony
    attestation: first_hand
    speaker:
