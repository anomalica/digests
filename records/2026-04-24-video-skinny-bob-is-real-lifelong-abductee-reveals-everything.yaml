    quote: |-
      when i woke up i was back at home i was in my bed And suddenly my GERD was gone, and these sharp pains that I used to have in my stomach were gone. And I'm like, there's no pressure, there's no pain. I push on my belly, it's gone.
    text: |-
      After the encounter Erik Nanstiel woke up at home in his bed and his gastroesophageal reflux disease (GERD) and the sharp stomach pains he had suffered were gone, with no pressure or pain when he pushed on his belly.
  - id: 7b88d366-e6c4-49a1-83e1-48a56812a655
