    quote: |-
      when he was done touching my abdomen, he slumped, he collapsed into his chair and he slumped and he had the saddest look on his face, like he was completely exhausted ... maybe because he was healing me in some way ... i depleted him because it was a bad enough problem maybe i had some kind of cancer and he took care of it because he called it an enemy inside me
    text: |-
      After finishing touching Erik Nanstiel's abdomen, the doctor creature collapsed into its chair, slumped and looked exhausted and sad, which Nanstiel speculated was because it had depleted itself healing him.
