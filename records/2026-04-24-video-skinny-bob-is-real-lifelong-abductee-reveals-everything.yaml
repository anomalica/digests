      there was one type of creature that i uh perceived to be a doctor ... it was a much smaller creature, but it wasn't a short gray. It wasn't a skinny bob. It was something else. It had darker skin ... It was some kind of screen memory where I kept trying to see it as human, but it appeared like a frog ... I thought of the actor Wallace Shawn.
    text: |-
      During the encounter Erik Nanstiel interacted with a creature he perceived as a doctor, smaller than the tall Greys but not a short Grey and not a Skinny Bob, with darker skin, whose face he could not remember because a screen memory made it appear like a frog, leading him to think of the actor Wallace Shawn.
