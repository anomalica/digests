    quote: |-
      this creature came out again but i perceived it to be a different doctor ... he led me to these benches ... he made me sit down on the bench and then he had these very long spindly arms and he stuck it on my abdomen and he was kind of moving his hands up and down. And he said, you have an enemy inside you, but you're going to feel better in a few days.
    text: |-
      A creature Erik Nanstiel perceived as a second doctor led him to benches, sat him down, and using very long spindly arms moved its hands up and down over his abdomen, telling him he had an enemy inside him but would feel better in a few days.
  - id: edf05411-2d27-4d02-9ba3-3800aeab8bda
