    quote: |-
      something happened and i woke up in my garage and i was suspended off the concrete floor and i was tilted forward at a 25 30 degree angle and i was looking down at one of those little skinny bobs
    text: |-
      During Erik Nanstiel's 2020 garage grey encounter, after he woke he found himself suspended off the concrete floor of his garage, tilted forward at a 25 to 30 degree angle, looking down at one of the small Greys.
  - id: 763ee0b6-c51b-4c06-9463-be7156fceca0
    type: testimony
    attestation: first_hand
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
      name: Nanstiel, Erik
    location: 00:01:11.8-00:01:26.4
    date: '2020'
    refs:
      - id: 0aad9179-33c1-4383-aab7-5eb12429386e
        name: Nanstiel, Erik
      - id: c2d8473e-f574-4b90-bb69-705b26d91d22
        name: Erik Nanstiel 2020 garage grey encounter
    quote: |-
      I created a poster. I want to remember your visit. Let me remember you. I will not harm in big block letters on an eight and a half by 11 poster. I printed it out and i taped it on my wall above my headboard. Two weeks later,
    text: |-
      Two weeks before his 2020 garage grey encounter, Erik Nanstiel created a poster reading 'I want to remember your visit. Let me remember you. I will not harm' in large block letters on an A4-size sheet, printed it and taped it on his wall above his headboard, as an attempt to communicate with the beings entering his room.
  - id: e9a3b9a6-4886-4e78-9a73-d23f925e810d
    type: opinion
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
      name: Nanstiel, Erik
    location: 00:01:43.0-00:01:59.5
    refs:
      - id: 0aad9179-33c1-4383-aab7-5eb12429386e
        name: Nanstiel, Erik
      - id: 583f554d-a577-4487-9bd9-6a6d715d10cc
        name: Greys (extraterrestrial beings)
      - id: 6868042d-2525-4808-96f4-d74c1c3522da
        name: alien-human hybridisation programme
    quote: |-
      I think they're desperate. I think that they're trying to survive and I think they want to come here. I think they want to live here on our planet. And they can't do so without borrowing heavily from our gene pool.
    text: |-
      Erik Nanstiel believes the Greys are not evil but desperate, trying to survive and wanting to come and live on Earth, which they cannot do without borrowing heavily from the human gene pool.
  - id: 5aefe718-a911-49cb-9c10-a0822a876cc5
    type: opinion
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
      name: Nanstiel, Erik
    location: 00:01:59.5-00:02:19.4
    refs:
      - id: 0aad9179-33c1-4383-aab7-5eb12429386e
        name: Nanstiel, Erik
      - id: 583f554d-a577-4487-9bd9-6a6d715d10cc
        name: Greys (extraterrestrial beings)
      - id: 98eeed83-96a9-45ef-bb14-cb915d45fc9c
        name: alien abduction phenomenon
    quote: |-
      The word abduction itself doesn't encompass the loss of agency, you know, and to be shown children I can never touch or love or hold or know. That just makes me shake with anger. You know, I hate these people. I hate them.
    text: |-
      Erik Nanstiel expresses hatred toward the Greys, angered at being shown children he can never touch, love, hold or know as part of his abduction experiences.
  - id: 824ba970-082a-487c-96d1-73282f259833
    type: testimony
    attestation: first_hand
    location: 00:02:30.0-00:03:08.1
    date: '1969'
    refs:
      - id: 5d5aa4e3-7bc3-4206-97e9-86ceeb333478
        name: USA, California, San Francisco
    quote: |-
      In 1969, while working at a venue in San Francisco called The Family Dog and the Great Highway, I got involved with a conversation with a gentleman who had walked off the street who started explaining that there were these beings that existed here at a higher vibrational level. He said that they had a physical existence, but they were out of our range of perception. And then he looked at me and said, they'd like to speak to you if you're interested.
    text: |-
      In 1969, a man named Terry, while working at a San Francisco venue called The Family Dog at the Great Highway, had a conversation with a man who walked in off the street and explained that there were beings existing at a higher vibrational level with a physical existence but out of human range of perception, who would like to speak to him.
  - id: 4efcf7fb-7bdf-4af7-887b-fe71faa4176a
    type: opinion
    speaker:
      id: 24d00311-06ac-46a1-a2f5-c99f3f8e21b2
      name: Ramsay, Chris
    location: 00:04:00.1-00:04:43.9
    refs:
      - id: 24d00311-06ac-46a1-a2f5-c99f3f8e21b2
        name: Ramsay, Chris
    quote: |-
      we can learn a fair amount of things from whistleblowers. or from observations in the sky or FLIR footage, but you can't learn about their culture. You can't learn about their origin. You can't learn truly about their technology, unless you speak to an experiencer
    text: |-
      Chris Ramsay considers that one can learn about extraterrestrial culture, origin and technology only by speaking to an experiencer, not from whistleblowers, sky observations or forward-looking infrared (FLIR) footage.
  - id: 13e5bc90-6c13-420a-aee7-8a20dbdb66ea
    type: testimony
    attestation: first_hand
    speaker:
      id: 0aad9179-33c1-4383-aab7-5eb12429386e
