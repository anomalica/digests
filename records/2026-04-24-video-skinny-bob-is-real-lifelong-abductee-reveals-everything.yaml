    quote: |-
      I noticed things starting to go awry in my bedroom in January of 2020... I'd wake up and my bedding was 90 degrees oriented the wrong direction as though it had been completely removed and then put back on the wrong way. I have these black and gold stripes on my duvet and laying across my legs. And then I'd wake up in the morning and it was vertical stripes.
    text: |-
      Beginning in January 2020, Erik Nanstiel noticed things in his bedroom changing between going to bed and waking, the most significant being that his bedding would be reoriented 90 degrees as though removed and put back the wrong way, with his black-and-gold striped duvet running vertically instead of across his legs.
  - id: cc09cd52-a75e-4681-9c9e-08b20fb453ca
