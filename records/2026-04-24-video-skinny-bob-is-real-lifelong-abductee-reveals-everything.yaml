        name: Erik Nanstiel 2020 garage grey encounter
    quote: |-
      I have a back scratcher and a night mask, a sleep mask that I put on on top of the bed... these things always get kicked off onto the floor on the opposite side of the bed... They were neatly placed side by side with each other under the top sheet right next to my body... I wouldn't do that because you'd roll on to this sharp edged back scratcher.
    text: |-
      In early 2020, Erik Nanstiel woke to find his back scratcher and sleep mask, which normally got kicked onto the floor on the opposite side of the bed during a rough night, neatly placed side by side under the top sheet right next to his body, which he found anomalous since he would not place a sharp-edged back scratcher there.
