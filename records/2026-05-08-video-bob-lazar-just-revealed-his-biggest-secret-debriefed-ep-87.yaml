        name: Lazar, Bob
      - id: e3c9c97a-a4dd-4236-8d28-3224f8dcf092
        name: USA, Nevada, S4
    quote: |-
      they said, there are just materials here. We have no clue as to what they are or what interactions they have with the human body.
    text: |-
      Bob Lazar was told there were materials at S4 of unknown identity and unknown interactions with the human body, prompting the immune-system booster.
  - id: b24d6d28-19d4-4614-b557-fd972dd37086
