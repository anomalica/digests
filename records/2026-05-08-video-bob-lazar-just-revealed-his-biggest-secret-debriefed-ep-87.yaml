    text: |-
      Bob Lazar denies that the fluid given to him was part of conditioning or caused a hallucination, stating he was completely clear-headed every time he was at S4.
  - id: ed6b497d-5d90-43f7-ab05-729d7ea38371
    type: testimony
    attestation: first_hand
    speaker:
      id: 5112b573-2154-417d-a0fe-b73c599bbfeb
