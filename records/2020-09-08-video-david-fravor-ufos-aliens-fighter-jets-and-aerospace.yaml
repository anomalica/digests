    text: |-
      David Fravor described the AAV as not aggressive and stated it never manoeuvred offensively against his aircraft, only mirroring his movements.
  - id: d4de520f-2221-4b9d-90b2-34418a660eb8
    type: observation
    attestation: first_hand
    speaker:
