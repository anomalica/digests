        name: West, Mick
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: So I find that at least a plausible explanation of that video.
    text: |-
      Lex Fridman considers Mick West's tracking-loss account a plausible explanation of the 2004 USS Nimitz FLIR1 video.
  - id: d5bc9b41-5aea-411d-b3d9-0da9541d7602
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:42:04.3-02:42:33.7
    refs:
