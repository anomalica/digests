    text: |-
      Mick West is one of the better known people who makes a career out of debunking, approaching UAP situations as a skeptic.
  - id: 9f21364d-6d01-4884-9301-e069e08d96b1
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:31:43.8-02:32:18.4
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
    quote: |-
      How did you know it was about 40 feet long? ... I was at 20,000 feet-ish ... when i look down i know what a hornet looks like looking down on him ... that's why i said 40 feet because it's about hornet size
    text: |-
      David Fravor estimated the Tic Tac object was about 12 metres long, judging it to be roughly the size of an F/A-18 Hornet because he was at about 6,100 metres looking down and had years of experience judging aircraft size from above.
  - id: d9bf4e26-6800-448a-be6d-c18b63b792db
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:32:31.6-02:32:40.1
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
    quote: |-
      everyone came back with the same thing. They're like, yeah, it was about the size of a hornet.
    text: |-
      All four witnesses to the 2004 USS Nimitz incident independently estimated the Tic Tac object to be about the size of an F/A-18 Hornet.
  - id: 2197788e-7538-4423-8dc0-a14610f202b5
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:32:57.7-02:33:17.1
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      your brain believes what your eyes see we are actually trained to do the opposite of that especially when you instrument fly because your brain and eyes can tell you one thing but you got to trust your instruments
    text: |-
      Pilots are trained to distrust what their eyes see and to trust their instruments, because the brain believes what the eyes see, which can be deceptive especially during instrument flying.
  - id: e98a750c-3339-4604-8f89-a36581a561c4
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:33:17.1-02:33:38.0
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      your eyes assume that the runway and your brain assumes that the runway is fixed but you know that the runway is moving so if i try and do stuff visually i would you die ... trying to land on a boat. So we actually use instruments which are counter to your brain.
    text: |-
      When landing on an aircraft carrier at night, relying on vision is fatal because the brain assumes the runway is fixed when in fact the carrier deck is moving, so pilots use instruments instead.
  - id: 805139f6-fd0b-4a32-8671-e128b937a555
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:33:41.0-02:34:28.7
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      It's called the MSDD Multispatial Disorientation Device, or the Spin and Puke. it looks like a giant carousel and you're in these little modules and when you get out you think the thing goes really fast
    text: |-
      Pilot training includes a device called the Multispatial Disorientation Device (MSDD), nicknamed the Spin and Puke, a carousel-like machine with modules that induces false sensations of climbing, descending or motion while the occupant actually moves slowly in circles.
  - id: 6515eacb-300f-4d8d-9936-08e1d93ce53f
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:34:36.1-02:34:51.0
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      even as I'm looking at the Tic Tac, I've got a heads up display that tells me what my airplane's doing ... I can look outside ... but I'm also looking inside to cross-check
    text: |-
      During the Tic Tac sighting in the 2004 USS Nimitz incident, David Fravor had a heads-up display showing his aircraft's state, allowing him to cross-check his outside visual perception against his instruments.
  - id: 386d77ad-b7ba-42e3-ac67-c07793473d03
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:35:13.1-02:36:26.9
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      we call it drawing arrows. So you have to recreate that stuff ... I know where the sun is at ... use the sun relative so you can create this entire battle that went on with arrows so that you can come back and debrief
    text: |-
      Fighter instructors reconstruct dogfights afterwards in a process called drawing arrows, using the sun's known position as a reference because there are no landmarks over open water, to recreate the entire engagement for debriefing.
  - id: c5ae2a6c-b2e6-4500-b9fa-23b79e623621
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:38:10.0-02:38:32.4
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 6fb642e4-e231-44db-a443-ef7fddffb4b5
        name: Top Gun Naval Flight School (Navy Fighter Weapons School)
    quote: |-
      I learned how to fight an airplane with, he's actually one of my best friends, we'll call him Tom ... Tom had just left Top Gun. He was the training officer at Top Gun, so that's the guy. The training officer's the main guy at Top Gun.
    text: |-
      David Fravor learned air combat from a friend, referred to as Tom, who had just left Top Gun where he was the training officer, the main instructor role at the Navy Fighter Weapons School.
  - id: 4c1c484f-ef4b-41a8-bab9-ba305e75a1bd
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:38:32.4-02:38:46.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
    quote: |-
      Tom, when I learned, because I come out of A6 and we really don't fight because it was a bomber. So I get in F-18s and I want to learn how to fight ... The F-A-18 is fighter attack.
    text: |-
      David Fravor came from flying the A-6 Intruder, a bomber in which crews did not practise air combat, and had to learn to dogfight when he transitioned to the F/A-18, which is a fighter attack aircraft.
  - id: de11e904-b952-4adb-bbfa-db5c45c9d86e
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:39:30.9-02:39:43.8
    refs:
