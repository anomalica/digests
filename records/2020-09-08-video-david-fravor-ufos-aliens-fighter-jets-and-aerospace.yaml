      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      One of the girls who everyone knows is incredibly... She's one of the most gifted people I've ever met in my life. She is the vice president of Amazon Air. You can see her on TV. Her name's Sarah.
    text: |-
      One of the female pilots under David Fravor, named Sarah, is the vice president of Amazon Air and appears on television.
  - id: 67932ba0-bd68-4c6a-af4a-8260195ceead
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:58:21.0-00:58:29.2
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      And then I had Paige who ended up taking command. She got out of fighters and went into other platforms. And she was a commanding officer.
    text: |-
      Another female pilot under David Fravor, named Paige, took command as a commanding officer after leaving fighters for other platforms.
  - id: 31348a7d-7533-4e58-b343-e1fa769a5c64
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:58:59.3-00:59:14.2
    quote: |-
      You can't tell if you pass another airplane, you can't tell if there's a man or a woman in it. It really comes down to stick and throttle, the ability to extrapolate where the vehicle's going to be
    text: |-
      Flying skill comes down to stick and throttle and the ability to extrapolate where the aircraft will be, and cannot be told from the outside whether a man or a woman is flying.
  - id: 544fab8e-7f31-46e8-82c0-a43b1b7a44e2
