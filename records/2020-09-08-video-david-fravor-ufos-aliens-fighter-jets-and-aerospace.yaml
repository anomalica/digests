    text: |-
      During the Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16, David Fravor attempted to radar-lock the AAV using the APG-73 radar slewed via his helmet but was unable to achieve a radar lock.
