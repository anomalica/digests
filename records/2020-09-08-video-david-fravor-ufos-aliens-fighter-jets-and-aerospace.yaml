        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: And in some interview somewhere you said, I think it was not from this world.
    text: |-
      In an interview David Fravor said of the Tic Tac object that he thought it was not from this world.
