        name: Fravor, David
      - name: Multispatial Disorientation Device Training
    quote: |-
      It's called the MSDD Multispatial Disorientation Device, or the Spin and Puke. it looks like a giant carousel and you're in these little modules
    text: |-
      US Navy pilots are trained on the Multispatial Disorientation Device (informally called the 'Spin and Puke'), a carousel-like device with sub-modules, to experience and counter vestibular disorientation while flying.
  - id: 117b6368-1c9a-4a17-9fc0-1447268c49d4
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:38:19–02:38:33
    refs:
