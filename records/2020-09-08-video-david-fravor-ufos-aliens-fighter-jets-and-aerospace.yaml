    quote: |-
      the little hornets the legacy hornets f-18s don't have as much gas as the super hornets. So he had launched first and they were going to do him. And then when they knew we were off the deck, they just told him, hey, go to your cap point down south
    text: |-
      The Marine squadron's commanding officer (CO) — who was flying legacy F/A-18 Hornets — had launched first for the AAV intercept mission but was redirected to a southern CAP point when the F/A-18F Super Hornets launched, because the legacy Hornets carry less fuel.
