        name: Project Blue Book
    quote: |-
      I think it's highly possible... if you just look at all the sightings... just look at Project Blue Book... There's a percentage. It's like 10 or 15% of them. They still can't explain... What are the chances that not one of them crashed somewhere on the globe and was recovered.
    text: |-
      David Fravor expressed the opinion that it is highly possible one or more governments on Earth possess recovered non-human technology or biological material, noting that given the percentage of unexplained sightings in Project Blue Book the probability that none ever crashed is very low.
