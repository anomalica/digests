    quote: |-
      really with the exception of the F-15E Strike Eagle and the F-18F Super Hornet, which is the F is a two seater and the G is also a two seater, but it's more of an electronic attack by say, full up fighter, bomber.
    text: |-
      Among modern tactical aircraft, the primary two-seat variants in service are the F-15E Strike Eagle and the F/A-18F Super Hornet (F variant) and F/A-18G (G variant used for electronic attack).
