        name: FLIR1 Video
    quote: |-
      the thing, when it leaves so fast off the screen, the pod can't move fast enough. It has gimbal rates on how fast that thing can move around.
    text: |-
      David Fravor stated that the Airborne Targeting Forward-Looking Infrared (ATFLIR) pod has physical gimbal rate limits on how fast it can move, and when an object leaves the frame so quickly the pod cannot move fast enough to track it.
  - id: 1176028d-d8f8-4052-b48a-4650ed9b6a4b
    type: testimony
    attestation: first_hand
    speaker:
