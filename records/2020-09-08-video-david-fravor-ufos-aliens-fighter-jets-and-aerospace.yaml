    quote: |-
      Bezos alone could buy companies like big companies. Apple's another one. ... just go over to the Gates Foundation and they've got gazillions and gazillions of dollars.
    text: |-
      Jeff Bezos has personal wealth of over one hundred billion dollars, enough to buy large companies, and the Bill & Melinda Gates Foundation also holds vast sums.
