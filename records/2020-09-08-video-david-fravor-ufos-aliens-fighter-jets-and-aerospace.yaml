        name: A-6 Intruder (aircraft)
      - id: 6310191b-bd12-4c66-80dc-a38c714881ff
        name: F-111 (aircraft)
    quote: |-
      That was, in the Navy, that was the only one. The Air Force, the F-111 was a side-by-side, but the Navy, it was the A-6.
    text: |-
      The A-6 Intruder was the only side-by-side seat aircraft in the US Navy; in the US Air Force, the F-111 was a side-by-side aircraft.
