        name: ATFLIR Pod
    quote: |-
      When the pod passes underneath the airplane, so if I'm looking at you and you pass underneath me as it does this, the ball will actually flip around to kind of finish off. And it swaps ends because it's a gimbal. It's not free floating.
    text: |-
      David Fravor explained that there is a theory that the ATFLIR pod appears to flip or swap ends because when the pod passes underneath the aircraft it must rotate to continue tracking, due to its gimbal limitations — but he stated this does not occur when the pod is looking out in front.
  - id: 3429e963-3769-4b2b-bd2c-3db6996c36a0
