        name: United States Navy
    quote: |-
      in the Navy, we were crewed. So I had a primary and a secondary WISO that flew with me... for like all of the deployment.
    text: |-
      In the Navy, pilots were crewed, so David Fravor had a primary and a secondary weapon systems operator who flew with him for the duration of a deployment.
  - id: 5c5de893-a716-4d04-a09c-00545d5f7f97
