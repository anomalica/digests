    text: |-
      Lex Fridman expressed that the Forward-Looking Infrared (FLIR) video, Go Fast video, and Gimbal video are only interesting to him in the context of David Fravor's eyewitness account; without that context, they are relatively low resolution and easier to explain skeptically.
  - id: d7e30a1a-c6b3-4c3e-bc31-1c3cee1be6f9
    type: hearsay
    attestation: second_hand
    speaker:
