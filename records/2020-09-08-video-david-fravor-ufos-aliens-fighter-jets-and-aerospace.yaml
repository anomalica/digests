    refs:
      - id: ced3c1cf-6084-4869-ae54-9a5ba12c2fba
        name: NASA
    quote: |-
      because I have some friends that are astronauts uh they all have to learn russian ... it's what, level five where the test is a phone call
    text: |-
      NASA astronauts are required to learn Russian to a level five proficiency, where the test is a phone call.
  - id: ba5944b5-5dee-4b77-9400-ae403f9ebcbf
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:19:16.6-02:19:40.0
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
