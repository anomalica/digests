        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      I am 99.9%. So 0.1% my eyes deceive me. But remember, if it deceived me, it had to deceive the other four people. So the percentage is even lower.
    text: |-
      David Fravor estimates a 99.9 percent certainty that his eyes did not deceive him during the 2004 USS Nimitz Tic Tac sighting, noting any deception would have had to fool all four witnesses, lowering the probability further.
  - id: a8db7420-5b7d-4efe-9d7f-f707e6f21b73
    type: observation
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
      name: Fridman, Lex
