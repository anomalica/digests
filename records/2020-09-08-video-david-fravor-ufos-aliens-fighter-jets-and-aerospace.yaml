    quote: |-
      There's IR 344 that we used to fly, which would coast in off of Oregon, fly from the land. You'd go out over the ocean, turn around, and then you could practice actually coming in on a coastline.
    text: |-
      Instrument Route 344 (IR-344) was a low-level instrument route used by A-6 crews stationed at Naval Air Station Whidbey Island; it involved flying from land, out over the ocean off Oregon, then turning back to practise a coastline ingress.
  - id: 4e143486-dcea-49a2-859e-1e4fe800f694
