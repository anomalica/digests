      we've got this thing that's been out there floating around for God now, what is it, like 20 years that thing's been up there floating around? So it's getting old, we're gonna have to replace parts
    text: |-
      The International Space Station has been in orbit for about 20 years and is ageing, requiring replacement of parts.
  - id: 94f9c0c0-29e4-405b-9e3d-2e29a0914685
    type: opinion
    attestation: first_hand
    speaker:
