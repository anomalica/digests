    quote: |-
      when Sully flew, when his first officer, that's the co-pilot, showed up, you know, first time they'd met. And this happens all the time in the commercial world.
    text: |-
      In commercial aviation, pilots flying together for the first time on a given day is common; Chesley Sullenberger and his first officer had not met before the day of the famous emergency landing.
