        name: Fravor, David
    quote: |-
      We would typically fly between 420 and 480 knots of ground speed... Between seven and eight miles a minute is what you're flying.
    text: |-
      A-6 Intruder crews typically flew at ground speeds of approximately 780 to 890 kilometres per hour (between 420 and 480 knots), covering seven to eight miles per minute.
