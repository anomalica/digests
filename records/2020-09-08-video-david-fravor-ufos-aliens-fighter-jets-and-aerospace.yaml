        name: Strike Fighter Squadron 122 (VFA-122)
    quote: |-
      you took the hundred there's three at the top of the list that are just naturally gifted aviators they're well well well above average... at the bottom there's the three at the bottom that are going to struggle... If you took the 94 of them in the middle, they're within one mean deviation
    text: |-
      Across the last hundred students tracked at VFA-122, roughly three at the top are naturally gifted aviators well above average, three at the bottom struggle and may not graduate, and the 94 in the middle fall within one mean deviation of each other.
  - id: 34059f27-b034-4144-81d2-337812e369a4
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:00:32.2-01:00:59.1
    refs:
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
