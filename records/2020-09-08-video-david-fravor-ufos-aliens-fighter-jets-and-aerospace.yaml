        name: Fravor, David
    quote: |-
      The highest anxiety and heart rates were coming back to land on board an aircraft carrier.
    text: |-
      During Vietnam War-era carrier operations, pilots wired up for heart rate monitoring showed their highest anxiety and heart rates not during combat missions but when returning to land on the aircraft carrier.
