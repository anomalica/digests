        name: NAS Lemoore
    quote: |-
      they come down and do they're called site visits where they come down and they'll come to lemore california which is where the west coast fighter wing is at for the navy and they go around and start flying sorties with the fleet squadrons.
    text: |-
      Top Gun instructors conduct site visits to fleet squadrons at NAS Lemoore, California, which is the west coast fighter wing for the Navy.
