    quote: |-
      From pure speed, I would say SR-71, I think it's an engineering marvel that was actually developed in the 50s by Kelly Johnson, you know, Skunk Works. the CIA actually made like six companies in order to buy the titanium from Russia to bring it back and build an airplane out of titanium
    text: |-
      David Fravor describes the SR-71 as an engineering marvel, noting it was developed in the 1950s by Kelly Johnson at Lockheed Skunk Works, and that the CIA created shell companies to buy titanium from Russia to build it.
