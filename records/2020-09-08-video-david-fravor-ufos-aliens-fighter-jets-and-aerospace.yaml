        name: Tic Tac Sighting
    quote: |-
      I tried to lock it up because I can move the radar with my head, but I couldn't, it wouldn't lock, the radar wouldn't lock
    text: |-
      David Fravor stated that he attempted to lock the radar onto the AAV by moving it with his head, but was unable to achieve a radar lock.
  - id: f43bb84e-aed8-482d-b034-4fb76b60ac8a
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 02:11:18
    date: '2020'
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
      - id: 71deba35-2336-4f96-9c94-878a7476f886
        name: AAV
      - id: dc995248-b6e1-413e-afef-a8eedbd01074
        name: 2004 Nimitz UAP Encounter
    quote: |-
      so you if you'd asked me in 2004 i just said i don't know if you ask me now so we're coming up on 16 years ago...I would like to think that if we had a technology that would advance mankind leaps and bounds from what we normally do, then it would start coming out
    text: |-
      David Fravor stated that in 2004 he did not know what the AAV was, and that 16 years later (approximately 2020) he still believes humanity has not developed the observed technology.
  - id: 4fb63cb6-caa6-4ab5-a5b8-1a71262ad395
    type: hearsay
    attestation: second_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
