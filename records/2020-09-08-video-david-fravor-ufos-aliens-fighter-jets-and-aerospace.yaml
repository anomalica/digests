    quote: |-
      the back of the Super Hornet has, well, the block twos has about an eight by 10 display for the wizos...The pilots is smaller. It's down between us. It's a six by six between his legs
    text: |-
      The Block 2 F/A-18F Super Hornet rear cockpit features approximately a 20 centimetre by 25 centimetre (eight by ten inch) situational awareness display for the weapon systems operator, while the pilot has a smaller approximately 15 centimetre by 15 centimetre (six by six inch) display.
  - id: 67c1291a-711e-48f1-9967-e3a777d12cec
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
