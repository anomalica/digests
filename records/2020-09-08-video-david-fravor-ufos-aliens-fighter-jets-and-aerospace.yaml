        name: Tic Tac Sighting
    quote: we call it a two circle fight when you're fighting another airplane
    text: |-
      David Fravor described the encounter dynamics with the AAV as a 'two circle fight', the same term used for manoeuvring against another aircraft.
  - id: 4529a9a0-b6f9-4420-8806-82f4ab3cf60f
    type: observation
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
