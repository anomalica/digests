        name: Fravor, David
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      We would typically fly between 420 and 480 knots of ground speed... Between seven and eight miles a minute is what you're flying. That's best. At night.
    text: |-
      A-6 crews typically flew between approximately 780 and 890 kilometres per hour of ground speed, roughly 11 to 13 kilometres a minute, at night.
  - id: 348f7d1d-0eaa-4521-a0b2-3fb8e5002c72
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:32:55.4-00:33:21.8
    refs:
