    quote: |-
      i think it knew we were there when we showed up it's just it's me uh it's kind of like an animal if you've ever been around deer in a field
    text: |-
      David Fravor believed the AAV was aware of the pilots' presence, comparing its initial reaction to a deer that looks up and assesses a distant threat before reacting as the threat moves closer.
