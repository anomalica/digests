        name: Tic Tac Sighting
    quote: |-
      we have a camera in our helmet in the joint helmet there's a little camera but we never use it because it's nauseating to watch...it's the one thing i didn't do is reach down and hit the switch
    text: |-
      David Fravor expressed regret that he did not activate the camera in his Joint Helmet Mounted Cueing System (JHMCS) during the Tic Tac Sighting, which would have recorded a first-person view.
  - id: e0595048-b114-4cf5-aa3e-eef34cefadfe
    type: observation
    attestation: first_hand
    speaker:
