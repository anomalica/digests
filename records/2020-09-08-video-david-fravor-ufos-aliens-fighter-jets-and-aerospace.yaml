        name: 2014-2015 US East Coast UAP encounters
    quote: |-
      The two other videos, Go Fast and Gimbal, were recorded in 2000 something, 14 or 15. on the East Coast of the United States that had different kinds of objects, but they were weird in the same kind of way
    text: |-
      The other two released videos, Go Fast and Gimbal, were recorded in 2014 or 2015 off the East Coast of the United States and involved different objects that were weird in a similar way to the Tic Tac.
  - id: 7f4293dc-3b93-45ad-bf3f-509d733ecf6d
    type: observation
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
