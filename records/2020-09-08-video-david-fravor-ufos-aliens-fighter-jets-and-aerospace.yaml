    quote: |-
      we have a camera in our helmet in the joint helmet there's a little camera but we never use it because it's nauseating to watch…it's the one thing i didn't do is reach down and hit the switch
    text: |-
      During the Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16, David Fravor's Joint Helmet Mounted Cueing System (JHMCS) had a small camera built in but Fravor did not activate it during the encounter; he described this as his one regret from the incident.
  - id: e55be30b-e502-4100-86fe-46216bbeb50f
    type: observation
    attestation: first_hand
    speaker:
