        name: Fravor, David
    quote: |-
      Lex Fridman: As you said on Rogan, by the way, that jamming is an act of war. David Fravor: When you actively jam another platform, yes, it's technically an act of war.
    text: Actively jamming another platform is technically an act of war.
  - id: f3599238-c269-45f9-a0a6-63ebf3e647a3
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:33:01.6-01:33:54.9
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c9b367fb-bfd1-465d-a505-5a3f549bcde4
        name: Underwood, Chad
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      as soon as he commanded the radar to look at that target, the targeting pod goes, oh, what's over there?... when he castles over... he sees it on the targeting pod because the targeting pod is already looking there. And now he's on a passive track, because he's not literally sending any energy out. He's just receiving IR energy from the tic-tac
    text: |-
      When Chad Underwood commanded the F/A-18F Super Hornet radar to look at the Tic Tac, the targeting pod automatically slewed to the same line of sight, and switching the display to the targeting pod put it on a passive track receiving only infrared energy from the object.
  - id: 1aba663c-75bb-462c-9cd9-0a646e50411e
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:33:47.4-01:34:03.3
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      the system itself will track the pixels and the contrast differences... that's where those little bars you see in the video where the bars come up left and right. Lex Fridman: It's doing some vision-based tracking. David Fravor: That's exactly what it is.
    text: |-
      In the FLIR1 video the bars appearing on the display are the targeting pod's vision-based tracking of the object's pixels and contrast differences.
  - id: 80fd458b-de80-4301-a3f6-4660160c8390
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:34:06.5-01:34:35.6
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      there's a narrow medium and wide so wide is far away medium and then narrow and then there's the tv mode and he goes from ir mode to the tv mode... narrow ir mode is only medium tv mode so you can actually get closer with narrow tv mode it's got a better zoom capability... that's when you see it going from a black background to a white background.
    text: |-
      The targeting pod has narrow, medium and wide infrared zoom modes plus a TV mode, and the TV mode's narrow setting provides better zoom capability than the infrared narrow mode; the change between infrared and TV modes is what shows the object going from a black to a white background in the FLIR1 video.
