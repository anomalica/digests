        name: 2004 USS Nimitz UFO incident
    quote: |-
      He locks it up when he goes to lock it up. Now he's putting a bunch of energy on it, but he's telling the radar, stare down that line of sight... build a track file on it, which will tell us how high it is, how fast it is in the direction that it's going... it'll give you indications that I'm being jammed.
    text: |-
      When Chad Underwood locked the radar onto the Tic Tac object during the 2004 USS Nimitz UFO incident, the radar built a track file giving altitude, speed and direction, but it could not lock on and indicated it was being jammed.
  - id: 5802afe6-07e3-42c1-b53f-3b869a945af3
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:32:21.7-01:32:47.1
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      the radar was smart enough to go, that is not a return that I'm expecting, something's messing with me, I'm being jammed. And it shows you, and it puts strobes up, it gives these lines on the radar
    text: |-
      The F/A-18F Super Hornet radar is sophisticated enough to detect when a returned signal has been manipulated in range or velocity, displaying strobes and lines to indicate it is being jammed.
  - id: 4e3667f8-ff2d-4783-9526-b6d42f608796
    type: opinion
    speaker:
