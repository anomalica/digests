        name: SR-71 Blackbird
    quote: the SR-71 still holds the speed record of any plane
    text: The SR-71 Blackbird still holds the speed record for any piloted aircraft.
  - id: 8525a0cb-c2aa-4b79-a9dc-11c87e9b3dd0
