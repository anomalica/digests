        name: USS Nimitz
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
    quote: |-
      And they kept detecting these objects for just about a week. Then comes in like your part of the story, which is on November 14th, I guess it's from the USS Nimitz, you flew and witnessed a 40 foot long white tic-tac shaped object with no wings, flying in ways you've never thought possible
    text: |-
      The USS Princeton detected the objects for about a week before 2004-11-14, when David Fravor flew from the USS Nimitz and witnessed a 12-metre-long white Tic Tac-shaped object with no wings flying in ways he had never thought possible.
  - id: 58173c0a-04d8-4af9-b447-7557ff1de403
    type: opinion
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
