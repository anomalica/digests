    quote: |-
      If you would have put a Chinese flag on the side of it or a Russian flag on the side of it... then it would have got a lot of attention. It would have went high order.
    text: |-
      If the observed object had displayed a Chinese or Russian flag or another country's emblem indicating foreign ownership, it would have received a great deal of high-level attention.
  - id: e35d57bd-cef9-4880-b33c-11d5d2a9f881
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
