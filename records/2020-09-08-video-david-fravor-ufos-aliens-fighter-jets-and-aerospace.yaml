        name: NASA
      - id: 0f39bc18-bf04-42ba-8127-33d988dfed95
        name: International Space Station (ISS)
    quote: |-
      I went to the pinning, two friends of mine. ... it's cool when you're watching your friends doing a spacewalk ... I saw one, he's in the space station while they're doing a spacewalk.
    text: |-
      David Fravor has two friends who are astronauts whose pinning ceremony he attended, and he has watched them perform spacewalks and be aboard the International Space Station via NASA broadcasts.
  - id: f158ddd3-277c-4290-bda1-8cc0069da039
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:19:42.4-02:20:17.2
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      if they're really gonna go you know in years from now go to Mars I think that the moon is the stepping stone to go back to start proving some of the technology
    text: |-
      David Fravor considers the Moon a stepping stone for proving technology before a future mission to Mars.
  - id: d61ae29a-185e-4d7c-8d76-026fae478a6e
    type: opinion
    speaker:
