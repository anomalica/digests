        name: Navy Fighter Weapons School
      - id: 3abbeca9-43a2-4343-9c9f-317fa70d3bfc
        name: Strike Fighter Weapons and Tactics Instructor (SFTI) Programme
    quote: |-
      When you come out of Top Gun, you're called a Strike Fighter Weapons and Tactics Instructor, okay? So you're SFTI. When you come out of that, your job is to go usually to one of the weapons schools on the east or west coast and train the fleet squadrons.
    text: |-
      Graduates of the Navy Fighter Weapons School (Top Gun) receive the title of Strike Fighter Weapons and Tactics Instructor (SFTI) and are assigned to weapons schools on the east or west coast to train fleet squadrons.
  - id: 0e43b1e3-de85-45db-8025-55db265daef5
