        name: Apollo 11 Moon landing
    quote: Because we did this on a less than a compact computer in the 60s
    text: |-
      The Apollo 11 Moon landing was achieved in the 1960s using less computing power than a compact computer.
  - id: 6cbf24bd-d4e4-4ae8-b29b-6557e2fd684b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:20:24.3-02:20:33.7
    date: '1969'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 864c1cbc-a9cb-41e7-821e-c8b6ca1da90f
        name: Apollo 11 Moon landing
    quote: |-
      I have the giant Lego Apollo at home and the lander, and I have one that my dad built me in 1969 right after that.
    text: |-
      David Fravor owns a large Lego Apollo set with the lander, and has a model his father built him in 1969 just after the Apollo 11 Moon landing.
  - id: 048bd5e6-1dc4-4ae4-8552-7d8a5bbba4ea
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:20:33.7-02:20:45.0
    refs:
