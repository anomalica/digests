    quote: |-
      When you look at his video and this is the stuff that isn't out that they don't see because not all the all you see is the FLIR tape. That's the targeting pod, the forward looking infrared receiver.
    text: |-
      The publicly seen FLIR1 video shows only the forward-looking infrared (FLIR) targeting pod footage, not the additional radar display data that Chad Underwood's recording also captured.
  - id: 38240ae1-301d-4a83-a866-4d9e70210898
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
