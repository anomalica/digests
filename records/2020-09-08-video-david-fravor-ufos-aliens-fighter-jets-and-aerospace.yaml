    quote: |-
      the navy does a really good job as does the air force of screening so now what they do when i went you just showed up and you started now what you do is you actually go fly uh piper warriors low wing to see can you are you adaptable to this and there's an evaluation that goes through... then they put you into primary
    text: |-
      The Navy and Air Force screen pilot candidates, including an early evaluation flying Piper Warrior low-wing aircraft to test adaptability before entering primary training.
  - id: 06530a8e-f798-4508-8747-7623d6994dac
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:00:59.1-01:01:22.2
    quote: |-
      although we live in three dimensions like this table is not you know we this is you know this is all has depth with all that uh where it's really relative to aviation we are two-dimensional very two-dimensional
    text: |-
      Although humans live in three dimensions, human perception is effectively two-dimensional relative to the demands of aviation.
  - id: c5ac84a6-86e0-45e3-9073-d6ef882812a9
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:01:33.2-01:01:46.5
    refs:
      - id: 9c54b292-77a5-47ef-9869-0e6be9e8184b
        name: One World Trade Center
      - id: f6709741-df39-4e4b-b357-b113ab6e4fda
        name: Burj Khalifa
    quote: |-
      Let's look at one World Trade Center in New York... It's what, maybe 1,800 feet tall? even the Burj Al Dubai, which is like, what, 20-some hundred feet tall? It's not that big.
    text: |-
      One World Trade Center in New York is roughly 550 metres tall, and the Burj Khalifa in Dubai is roughly 640 metres tall, which David Fravor frames as not large in an aviation sense.
  - id: be097d97-31c9-4b81-ab06-224383abc016
    type: measurement
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:01:46.5-01:02:08.7
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      a Super Hornet to do what a split S is, which is I'm flying, I'm just going to roll the airplane upside down... It's very, very tight and it does it in about roughly about 2,500 feet, give or take a little.
    text: |-
      A Super Hornet performing a split S, rolling inverted and pulling vertically from high to low, completes the manoeuvre in roughly 760 metres of vertical displacement.
  - id: a8bd0c8b-3af4-460f-8196-da2772a52b98
    type: measurement
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:02:13.0-01:02:17.0
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: For example, the A6 in order to do that was about 9,000 feet.
    text: |-
      An A-6 Intruder required roughly 2,700 metres of vertical displacement to perform a split S, compared with roughly 760 metres for a Super Hornet.
  - id: 52f2385e-0581-4edd-97a4-4e97b2cd68ee
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:02:35.8-01:02:48.1
    quote: |-
      how you really get an advantage when you're fighting another airplane is to work in the vertical. because most people will do like one move in the vertical and then they wanna start to flatten out because that's where we're comfortable.
    text: |-
      In air combat an advantage is gained by manoeuvring in the vertical, because most pilots make only one vertical move before flattening out to the horizontal where humans are more comfortable.
  - id: 7a4aea5f-7595-4aa7-8c33-49e706853df5
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:03:11.1-01:03:25.6
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      So the Tic Tac's coming up and I'm at about, and I've been doing this for, at the time, 16 years.
    text: |-
      At the time of the 2004 USS Nimitz encounter, David Fravor had been flying for 16 years.
  - id: 4629dc8c-4cee-4e62-a3d6-4df118ee1ee0
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:03:56.6-01:04:38.8
    quote: |-
      you can trade off kinetic energy speed for altitude which gives you potential energy the other piece is is i can trade some of that kinetic energy for performance
    text: |-
      In max-performance air combat manoeuvring a pilot trades kinetic energy (speed) for altitude (potential energy), or trades kinetic energy for turn performance which bleeds energy off the wings.
  - id: 87cd3cec-1376-4666-983e-1fc46813273a
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:04:12.4-01:04:46.3
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      if i enter the split s at 200 knots and i do it right i'm going to come out at the bottom at probably 200 knots although i lost 2500 feet of potential energy I converted that to kinetic
    text: |-
      A Super Hornet entering a 760-metre split S correctly at approximately 370 kilometres per hour comes out at the bottom at roughly the same speed, having converted lost altitude into the kinetic energy used for the turn.
  - id: c3e9abf6-91ea-4ed4-8fc1-92110adc0ca0
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:04:51.9-01:05:08.6
    quote: |-
      you can have a guy that's behind you that looks like he's going to kill you, but if this jet is at 400 knots and this jet is at 110 knots, this jet's just going to pull away, drive around and kill him in about 30 seconds. All right, it's overall energy package.
    text: |-
      In a dogfight a pursuing aircraft at approximately 740 kilometres per hour against an aircraft slowed to roughly 200 kilometres per hour will pull away, reposition, and win within about 30 seconds, because overall energy package determines the outcome.
  - id: 41ee9cc7-713d-48b5-95f1-5730a3803637
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:05:35.7-01:05:45.3
    refs:
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
      - id: e78d0ea3-a3c6-4014-a4c6-7cf0bebe92c6
        name: Johnson, Kelly
      - id: 9795e9e6-0f72-4ae9-9dcb-ed4bd808f2d7
        name: Lockheed Martin Skunk Works
    quote: |-
      From pure speed, I would say SR-71, I think it's an engineering marvel that was actually developed in the 50s by Kelly Johnson, you know, Skunk Works.
    text: |-
      David Fravor considers the SR-71 Blackbird the greatest aircraft from pure speed and an engineering marvel, developed in the 1950s by Kelly Johnson at Lockheed Martin Skunk Works.
  - id: 30eadec5-c9db-451b-8fac-048fa426a275
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:05:45.3-01:05:58.7
    refs:
      - id: 3f733f14-efe4-414e-8279-44a2cc899199
        name: Central Intelligence Agency (CIA)
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
    quote: |-
      the CIA actually made like six companies in order to buy the titanium from Russia to bring it back and build an airplane out of titanium that we would fly over Russia.
    text: |-
      The CIA set up about six companies to buy titanium from Russia and bring it back to build the titanium SR-71 Blackbird, which would then be flown over Russia.
  - id: 0a16552f-952e-4066-ad04-66749253da78
    type: observation
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
      name: Fridman, Lex
    location: 01:06:01.3-01:06:12.1
    refs:
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
    quote: |-
      By the way, the SR, sorry to interrupt, the SR-71 still holds the speed record of any plane. as far as I can understand.
    text: The SR-71 Blackbird still holds the speed record for any aircraft.
  - id: 9ee29078-e2e5-452f-809a-624de962b33f
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:06:38.9-01:06:41.0
    quote: |-
      you may only be showing like 300 knots but at 300 knots you're really doing 2500 miles an hour over the ground
    text: |-
      At high altitude the air is so thin that an aircraft may show only about 560 kilometres per hour indicated airspeed while travelling around 4,000 kilometres per hour over the ground.
  - id: 4a1f214f-986e-42fa-ac5d-6ab6267261ab
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:06:55.0-01:07:01.1
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      like we would take the airplanes up to 50 000 feet when we had to do full the maintenance check flights on them so when you're doing 200 you know and you know some odd knots you're it's actually slow for the airplane
    text: |-
      Super Hornets were taken up to roughly 15,000 metres for maintenance check flights, where about 200-some knots indicated airspeed is actually slow for the aircraft.
  - id: 28d9aa64-496f-47ea-b46a-98eb0c603b3b
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:07:19.3-01:07:36.1
    refs:
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
      - id: 9fcc0086-6ca6-413b-8882-1e9c9aa197f4
        name: North American X-15
    quote: |-
      when you look at an SR-71 that's flying upwards of, you know, 70 plus thousand feet, the air is so thin, you know, just like the X-15, you can get to a much higher speed, but the relative speed of the air going over you is actually relatively low. So the stresses on the airframe are not like they would be if you were down low.
    text: |-
      An SR-71 Blackbird flying above roughly 21,000 metres, like the X-15, can reach much higher speeds because the air is so thin that the relative airspeed and airframe stresses are comparatively low.
  - id: 2157dfeb-ef47-4875-b746-eedaae21628b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:07:36.1-01:07:59.0
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
      - id: 0edcff73-af2f-4353-b0d9-9d9d883ebe86
        name: White
      - id: 887aeb17-7249-417c-8305-bacf0f4604e9
        name: USA, California, Pebble Beach
    quote: |-
      the fastest i ever got was i was with the uh well soon to be vice admiral white so we had taken a check flight and uh and i got it up to 1.78 i got a super horn up to mach 1.78 and it was and we were struck by pebble beach too
    text: |-
      The fastest David Fravor ever flew was Mach 1.78 in a Super Hornet on a check flight with the soon-to-be Vice Admiral White, off Pebble Beach.
  - id: 0a668965-419a-4a61-a2a4-708c81098afc
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:07:59.0-01:08:13.0
    quote: |-
      you realize in your brain and i did that there's no out if something happens i can't eject the ejection would kill me
    text: |-
      At Mach 1.78 an ejection would kill the pilot, so there was no escape option if something went wrong.
  - id: 6cafa51e-d389-4be4-920d-5758fe0c75d9
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:08:13.0-01:08:33.1
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
      - id: ad4c5ffb-29fc-42b3-a3cc-29ed186d5456
        name: USA, California, Big Sur
      - id: 887aeb17-7249-417c-8305-bacf0f4604e9
        name: USA, California, Pebble Beach
      - id: 99928b66-58d4-4592-bd9a-1f2af9074852
        name: USA, California, Monterey Peninsula
    quote: |-
      it was literally still accelerating when i stopped but i had it was fuel limited and space limited, because I'm off the coast of California, Big Sur, and I'm going, and I can see Pebble Beach out in the distance, the whole Monterey Peninsula.
    text: |-
      During David Fravor's Mach 1.78 run the Super Hornet was still accelerating when he stopped, being limited by fuel and by the available space off the coast of California near Big Sur, with Pebble Beach and the Monterey Peninsula in view.
  - id: 695bd32b-aaff-43c7-99a7-e7353cae1b04
    type: measurement
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:08:34.1-01:08:38.5
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: And you're doing almost 18 miles a minute. I mean, you're screaming.
    text: At Mach 1.78 a Super Hornet is travelling almost 29 kilometres per minute.
  - id: a7e62af0-19b9-4d95-a6ba-7f78fa80a438
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:08:40.9-01:08:47.4
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      the airplane didn't have anything on it. It was a slicked-off Super Hornet, so it was basically just the airplane. No pylons, no pods, no nothing.
    text: |-
      During the high-speed run the Super Hornet was a slicked-off aircraft with no pylons, pods or external stores.
  - id: 52566a1a-1728-4c62-9189-d4822d073863
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:08:53.5-01:09:03.6
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      like the speed brakes that normally we pop out when you're going that fast. They don't, because the super horn, it really doesn't have speed brakes. It, it deforms the flight controls. they don't function
    text: |-
      The Super Hornet does not have functional speed brakes at high speed; instead of popping out a brake, it deforms the flight controls.
  - id: 660eb2c8-50d3-4954-bfdb-afdb5b7779de
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:09:03.6-01:09:27.3
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      you really you're trying to maneuver and when you're going that fast you can't turn because a 7g turn at 1.5 mach is a pretty big turn
    text: |-
      A 7-G turn at Mach 1.5 is a very large turn, making it hard to manoeuvre at such speeds.
  - id: f03e818a-da86-4eb5-bf73-9f8e508729f2
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:09:37.6-01:09:48.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
      - id: d81072b8-2039-4fe1-aaab-e1ab7612c977
        name: USA, California, Naval Air Weapons Station China Lake
      - id: bfd491e5-8e60-456c-bb6c-da2fb39d96f0
        name: USA, California, Edwards Air Force Base
    quote: |-
      We would see it flying when I was flying Hornets, because we, West Coast flies, and it's called R2508, which covers the Navy China Lake area and Edwards. It's a huge area.
    text: |-
      David Fravor saw the SR-71 Blackbird flying while he flew Hornets on the west coast, in airspace called R2508 covering the Navy China Lake area and Edwards, a huge area in California.
  - id: a414bf34-9258-49d0-b55d-0ec9d4069dfa
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:09:48.3-01:09:57.3
    refs:
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
    quote: |-
      we had a guy from Switzerland come out because they had Hornets, and he's like, this is bigger than our whole country.
    text: |-
      A visiting pilot from Switzerland, who flew Hornets, remarked that the R2508 California training airspace was bigger than his whole country.
  - id: 4c4dd286-2e8d-4422-b838-3f8698020a25
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:09:57.3-01:10:14.2
    refs:
      - id: ced3c1cf-6084-4869-ae54-9a5ba12c2fba
        name: NASA
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
      - id: a5c2e103-f1f8-4ba0-ad5c-57a766ebfc8f
        name: USA, California, Palmdale
    quote: |-
      NASA was flying them out of Palmdale and they would take off and they'd go up towards Washington State and Montana and they do a loop. And so you'd see them coming back down, they descend out of, you know, above 60,000... They'd come down and hit the tanker and then they'd go back up.
    text: |-
      NASA flew SR-71 Blackbirds out of Palmdale on a loop heading up towards Washington State and Montana, descending from above roughly 18,000 metres where they formed contrails, refuelling from a tanker, then climbing again.
  - id: 95fb3875-2084-44e5-9cca-599dec8f58dc
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:10:20.9-01:10:54.7
    refs:
      - id: 353d04ee-116e-4ced-be6b-02b3abe2b66d
        name: Lockheed U-2
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
      - id: f0788bc9-f60f-4fb2-bf83-7bcd8a5915e5
        name: Sputnik 1
    quote: |-
      the advent of satellites, you know, cause they're everywhere now... how much of that need was really there because you got to remember when those things started in the 50s sputnik wasn't flying around you know it was it was the u2 and the sr-71 that were out there doing that work
    text: |-
      The reconnaissance need that the U-2 and SR-71 Blackbird met in the 1950s, before satellites existed, has been reduced by satellites, including those now launched by commercial companies.
  - id: 2d2ac6bf-2500-4f82-b25e-90139469fbb0
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:11:01.8-01:11:05.3
    refs:
      - id: 7f7dbb2c-f1a7-4781-a20e-8f3a1a771d6b
        name: SR-71 Blackbird
    quote: |-
      I think the next one is you get into the hypersonics where you don't have to put a person in, it does all kinds of crazy stuff.
    text: |-
      David Fravor considers the next step beyond the SR-71 Blackbird to be hypersonic aircraft that do not carry a person.
  - id: 13726f2e-7e48-4c85-a17e-0eff8aa9b1bd
    type: opinion
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
      name: Fridman, Lex
    location: 01:11:05.3-01:11:29.2
    refs:
