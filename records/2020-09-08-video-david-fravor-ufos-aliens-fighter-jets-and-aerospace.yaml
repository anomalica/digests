        name: 'Lex Fridman Podcast 122: Fravor, 2020-09'
    quote: |-
      The US in the 60s developed a bomber. It was a Mach 3 compression lift bomber called the XB-70... When that got out that we were developing it, the Soviet Union developed the MiG-25, literally a high altitude interceptor to counter that bomber... the last one remaining is in Dayton, Ohio at the museum.
    text: |-
      David Fravor referenced the XB-70 Valkyrie bomber programme as an example of why military secrecy is important, noting that when the US announced it was developing the Mach 3 compression-lift bomber, the Soviet Union developed the MiG-25 interceptor to counter it. He said the last surviving XB-70 is on display in Dayton, Ohio.
