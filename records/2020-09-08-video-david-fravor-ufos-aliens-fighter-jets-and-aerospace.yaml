      you're gonna fly in the mountains at night. You're gonna be at 500 to 1,000 feet above the ground, ripping through fog layers, because you don't need to see outside.
    text: |-
      A-6 Intruder crews flew low-level routes at 150 to 300 metres above the ground at night in mountainous terrain, including through cloud layers, using terrain-mapping radar rather than visual reference.
