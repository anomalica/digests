        name: F/A-18F Super Hornet
    quote: |-
      Lemoore had been a single-seat fighter community since forever. And now all of a sudden, you've got the F-18F coming in, which has the weapon systems operators in the back. that are not pilots
    text: |-
      Lemoore had been a single-seat fighter community before the arrival of the F/A-18F Super Hornet, which carries weapon systems operators in the back who are not pilots.
  - id: 97f8d26e-c788-4eb2-a66a-21787def938b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:23:27.5-00:23:42.5
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      Kenny knew because of my A6 background that I have a switch that I can go one seat, two seat... when you fly two seat, there's a lot of stuff that the pilot will offload and take the advantage of the weapon systems operator
    text: |-
      David Fravor's A-6 background gave him the ability to switch between single-seat and two-seat operations, offloading tasks to a weapon systems operator when flying two-seat.
  - id: 3de9604f-522f-45e0-a9fe-18ae78387ded
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:23:42.5-00:24:11.1
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      i would say that one plus one with two people as well as a minimum of 1.5 because you've got an extra head, you've got extra eyes, you've got someone that can monitor systems, the airplanes can do two things at once
    text: |-
      Adding a second crew member to a two-seat aircraft yields a capability of at least 1.5 times that of a single-seat, providing an extra head, extra eyes, system monitoring, and the ability to do two things at once.
  - id: aa975adc-a9bf-4627-aaec-72108f3186f0
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:25:09.5-00:25:31.3
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      The A6 was really an analog airplane that was built in the 60s. all right and there's been studies done on the crew coordination which is the interaction between the pilot and the bombardier navigator
    text: |-
      The A-6 Intruder was an analog airplane built in the 1960s, and studies were done on crew coordination, the interaction between the pilot and the bombardier navigator.
  - id: de89c7b2-5403-4d0f-8975-5cfdd3a8534d
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
