      the guy who's going to be the bad guys is the ceo of the marine squadron and uh so cheeks is at the other... the little hornets the legacy hornets f-18s don't have as much gas as the super hornets. So he had launched first and they were going to do him. And then when they knew we were off the deck, they just told him, hey, go to your cap point down south
    text: |-
      During the 2004 USS Nimitz UFO incident, the commanding officer of the Marine F/A-18 squadron, nicknamed Cheeks, had launched first to be the adversary but was redirected to a combat air patrol point to the south because the legacy F/A-18 Hornets carry less fuel than the F/A-18F Super Hornets.
  - id: decf2776-dc8a-4b07-89ad-60f502c67fb9
    type: testimony
