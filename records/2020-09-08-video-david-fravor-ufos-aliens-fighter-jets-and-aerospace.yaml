        name: USA, California, San Diego
    quote: |-
      the the exhaust on any a6 or an a6 actually points kind of down and it blows and it's blowing all the standing water on the aircraft that's how hard it's raining and you literally could not see across... and then it was just white because of the water being blown off the deck
    text: |-
      The exhaust on an A-6 Intruder points downward, and during the storm off San Diego it blew the standing rainwater off the deck so hard that visibility across the deck was lost to white spray.
