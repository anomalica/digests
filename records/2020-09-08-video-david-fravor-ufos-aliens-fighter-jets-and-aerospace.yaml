      I come out of A6 and we really don't fight because it was a bomber. So I get in F-18s and I want to learn how to fight because it's a whole other side of the mission.
    text: |-
      David Fravor stated he transitioned from the A-6 Intruder to F/A-18 aircraft and had to learn air combat manoeuvring, since the A-6 was a bomber and did not conduct fighter tactics.
