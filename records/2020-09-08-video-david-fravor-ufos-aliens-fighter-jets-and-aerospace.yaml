        name: A-6 Intruder (aircraft)
    quote: |-
      There's IR 344 that we used to fly, which would coast in off of Oregon, fly from the land. You'd go out over the ocean, turn around, and then you could practice actually coming in on a coastline.
    text: |-
      David Fravor and Chris Sato flew instrument route IR-344, which coasted in off Oregon, flew from land out over the ocean, turned around, and practiced coastline approaches.
  - id: f88e1eef-1c55-453b-b56b-56a8eaa9be02
