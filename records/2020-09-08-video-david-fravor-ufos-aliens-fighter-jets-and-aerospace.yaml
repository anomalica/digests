        name: Hamilton, Lewis
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      it's funny how people can extrapolate stuff who've never operated the system... that's like me going oh my god lewis what were you doing... lewis hamilton right now is you know defending world champion two-time he's four-time four or five-time world champion
    text: |-
      David Fravor considers it unwise for people who have never operated the targeting system to extrapolate conclusions about the 2004 USS Nimitz FLIR1 video, comparing it to telling four or five-time Formula One world champion Lewis Hamilton how to drive a car.
  - id: 9d0a9187-02df-4d6b-add7-628b7dfac546
