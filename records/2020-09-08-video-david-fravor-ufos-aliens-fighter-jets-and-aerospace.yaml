        name: International Space Station (ISS)
    quote: |-
      We realize that space was too expensive for one country to do alone. So we made the International Space Station and we have a conglomerate. It's the one thing that the Russians and the US actually work together on.
    text: |-
      The International Space Station was created as a multinational conglomerate because space exploration was too expensive for one country alone, and is the one thing Russia and the United States work together on.
  - id: eae1bf75-904c-4b06-b5ee-42ca7514297e
