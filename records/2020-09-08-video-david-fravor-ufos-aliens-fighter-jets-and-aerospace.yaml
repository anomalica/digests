    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
    quote: |-
      I was about half and half. So I started off an A6, was a two-seater. Then I went to single-seat F-18s, and I flew those all the way up until 2000 and, let me think, 2001, to the end of 2001. And then I shifted over and started flying the Super Hornets.
    text: |-
      David Fravor's career was roughly half single-seat and half two-seat aircraft; he flew A-6 Intruders (two-seat), then single-seat F/A-18s through approximately end of 2001, then transitioned to Super Hornets.
  - id: 0adccc9f-b686-4177-8b01-c16e3744ddfd
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:22:11
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: e4bafa10-7c08-44ab-a4ba-ccd945a18c1a
        name: Strike Fighter Squadron 41 (VFA-41)
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
    quote: when I had command of VFA-41, I had the two-seat. They were F-squadron.
    text: |-
      When David Fravor commanded Strike Fighter Squadron 41 (VFA-41), the squadron flew the two-seat F/A-18F (F-squadron) variant.
  - id: 913df9d4-ef45-491a-8e25-03baf90744bb
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:22:40
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: e4bafa10-7c08-44ab-a4ba-ccd945a18c1a
        name: Strike Fighter Squadron 41 (VFA-41)
      - id: 9cab0d2d-0ef0-4a07-a4d5-f3e8887ea467
        name: Weitzel (Vice Admiral)
    quote: |-
      I got pulled up because the guy, the people that are XOs, because we fleet up, you go from the number two guy to the number one guy. So the XO becomes the CO... I had worked with now soon-to-be Vice Admiral Weitzel. He was Commander Weitzel at the time, was the EXO.
    text: |-
      David Fravor was selected as commanding officer of Strike Fighter Squadron 41 (VFA-41) after fleetng up from the executive officer position under then-Commander Weitzel (later Vice Admiral Weitzel).
  - id: 1b091041-f420-48e7-86f5-23cf00441dd0
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:23:08
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 3dc850e5-e18d-4e70-a2a7-f64e09c3f72a
        name: NAS Lemoore
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
    quote: |-
      Lemoore had been a single-seat fighter community since forever. And now all of a sudden, you've got the F-18F coming in, which has the weapon systems operators in the back. that are not pilots, they're weapon systems operators, and there's a difference.
    text: |-
      NAS Lemoore had been a single-seat fighter community and experienced challenges integrating the two-seat F/A-18F Super Hornet with weapons systems operators (WSOs) who are not pilots.
  - id: 6e2a5821-e843-4df1-b433-9e1e0b0a7305
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:23:27
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: e4bafa10-7c08-44ab-a4ba-ccd945a18c1a
        name: Strike Fighter Squadron 41 (VFA-41)
    quote: |-
      Kenny knew because of my A6 background that I have a switch that I can go one seat, two seat, one seat, two seat.
    text: |-
      David Fravor's A-6 Intruder background made him adept at transitioning between single-seat and two-seat crew coordination, which was a factor in his selection to command Strike Fighter Squadron 41 (VFA-41).
  - id: 5a3240df-3416-4897-8e4e-e77407a4c209
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:24:04
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
    quote: |-
      it does equal more than one and i would say that one plus one with two people as well as a minimum of 1.5 because you've got an extra head, you've got extra eyes, you've got someone that can monitor systems, the airplanes can do two things at once.
    text: |-
      David Fravor opines that in a two-seat aircraft a pilot plus a weapons systems operator (WSO) provides at minimum 1.5 times the capability of a single-seat aircraft, due to extra situational awareness, system monitoring, and dual-task capability.
  - id: 05193a8c-00d6-4e68-b13d-0ead077f176e
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:33:18
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
    quote: |-
      the Wizzo does all the talking, he's got actually, he uses his feet. That's the weapon systems operator in the back of an F-18F. So he's gonna run, well, the radar kind of runs itself now, but we have a situational awareness display.
    text: |-
      The F/A-18F Super Hornet weapons systems operator (WSO) in the back seat uses feet pedals and manages communications, radar, situational awareness displays, and the targeting pod.
  - id: 288c7da5-10a1-4ada-82b5-20dcd2cc5089
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:33:44
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
      - id: f5ed3bec-9e8a-4c16-8adc-0c7018d54cff
        name: Boeing
    quote: |-
      the back of the Super Hornet has, well, the block twos has about an eight by 10 display for the wizos... The pilots is smaller. It's down between us. It's a six by six between his legs.
    text: |-
      The F/A-18F Super Hornet Block 2 rear cockpit has approximately a 20-by-25-centimetre (eight-by-ten-inch) display for the WSO; the pilot's situational awareness display between the legs is approximately 15 by 15 centimetres (six by six inches).
  - id: 2ba4dae7-0c08-42ce-b3ac-82d256a6311a
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:33:49
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
      - id: f5ed3bec-9e8a-4c16-8adc-0c7018d54cff
        name: Boeing
    quote: and they're getting ready to redesign that Boeing is.
    text: |-
      Boeing was redesigning the pilot situational awareness display layout in the F/A-18F Super Hornet at around the time of the podcast recording.
  - id: e00f7317-0fe9-4bbe-90b2-b97fe8bbcf63
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:33:33
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
      - id: 2ef216de-5e59-4a8e-91f9-e9e9afdffefa
        name: Link-16
      - id: 2ecb3c85-62c8-433a-8237-50812ff1ed4e
        name: Sensor Fusion (aviation)
    quote: |-
      Think of it as a God's eye view... when you looked, it'd be like if you put your airplane and you're looking down, so all the stuff like if you're radar seeing bad guys out in front of you be like looking down going oh i'm right here and now there's bad guys out here and my wingman is over here.
    text: |-
      The F/A-18F's situational awareness display shows a god's-eye view of all aircraft, radar targets, and inter-aircraft data shared over a digital network link.
  - id: f2dbc1dd-3468-4815-88eb-70fbb8f15b8e
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:35:58
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 0a8f86bd-b457-458e-b1c9-4d9747526e57
        name: Joint Helmet Mounted Cuing System
      - id: f7628207-c407-4095-9ccc-0cd122035409
        name: APG-73 Radar
      - id: 0747e983-5004-4c4f-8c0a-c10f77f770b7
        name: ATFLIR Pod
    quote: |-
      you've got a joint helmet mounted queuing system on that basically maps the magnetic field in the cockpit so it can tell where your head's at looking. So if I turn my head to the right, the radar will actually look to the right. The targeting flare will look the right.
    text: |-
      The Joint Helmet Mounted Cueing System (JHMCS) maps the magnetic field in the cockpit to determine where the pilot's head is pointing, slewing the radar and targeting pod to follow the pilot's line of sight.
  - id: fd2cfef6-ee0e-440d-82c7-878ed3c94372
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:36:14
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
      - id: 0a8f86bd-b457-458e-b1c9-4d9747526e57
        name: Joint Helmet Mounted Cuing System
      - id: 0747e983-5004-4c4f-8c0a-c10f77f770b7
        name: ATFLIR Pod
    quote: |-
      the back seater has a helmet on too. So he can look to the left and he can do things. So depending on what sensor he's controlling. So if he's got control of the targeting pod and he looks left, the targeting pod looks left.
    text: |-
      Both pilot and WSO in the F/A-18F wear the Joint Helmet Mounted Cueing System (JHMCS); the WSO can independently slew sensors such as the targeting pod by looking in a given direction.
  - id: 93bcf6ef-1f6f-46a4-9457-b9eba335e506
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:36:47
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 3b048566-4e6e-4ee4-baec-ee9598d1ee39
        name: Joint Direct Attack Munition (JDAM)
      - id: 0a8f86bd-b457-458e-b1c9-4d9747526e57
        name: Joint Helmet Mounted Cuing System
    quote: |-
      you're going to map magnetic resonance and go, oh, look, and I can literally slew my sensors this fast, and then mash a button and transfer high-quality coordinates from a system into a joint JDAM, which is a joint direct attack munition that is the GPS bombs that you see all the time, and then let that thing fly.
    text: |-
      The Joint Direct Attack Munition (JDAM) is a GPS-guided bomb; a pilot can rapidly slew sensors via the Joint Helmet Mounted Cueing System (JHMCS) and transfer coordinates to a JDAM in seconds.
  - id: bd80d897-5333-438f-92d3-f3efc434bb64
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:38:18
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 648bade5-f14f-4a7c-b231-c43362c9c03e
        name: Digital Flight Controls (aircraft)
    quote: |-
      AI systems are usually black and white. When you write the algorithm for an AI system, it's really, it's basically you're taking thought and turning it into a giant math problem... Math problems are, there's a line that says I can or I can't... humans can operate within that grade.
    text: |-
      David Fravor opines that AI flight control systems are largely binary and logic-bound, while human pilots can operate in gray areas outside normal flight envelopes to gain tactical advantage.
  - id: 8b59289f-c030-4933-9de4-c87a58ca1af6
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:39:51
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 6a96413a-2eff-4e3a-8187-90835c32fe6e
        name: F-18F Super Hornet (aircraft)
      - id: 648bade5-f14f-4a7c-b231-c43362c9c03e
        name: Digital Flight Controls (aircraft)
    quote: |-
      the flight control logic in modern airplanes with digital flight controls, they're extremely forgiving. So you can literally, I've done things in Super Hornets that literally even as a pilot inside the airplane, you're just like, wow, I cannot believe it just did that. Like it'll flop ends.
    text: |-
      David Fravor describes modern digital flight controls in the F/A-18F Super Hornet as extremely forgiving, allowing maneuvers that even experienced pilots find surprising.
  - id: 01d0a161-6c60-4286-8191-7b31bf93d8e2
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:16:22
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
    quote: |-
      you're just basically chipping away and gaining advantage, advantage, advantage... you know, just guns only rear quarter where you got to get behind the guy, kind of World War II dog fighting type stuff, then it's literally, it's a very, very fast chess game that happens at, you know, 400 knots, 300 knots, depends.
    text: |-
      David Fravor describes basic fighter maneuvering (BFM) as similar to a fast chess game at approximately 550 to 740 kilometres per hour (300 to 400 knots), where pilots continuously gain incremental advantage through position.
  - id: 9d2f6387-b83a-4f4f-8d26-44b0791a0f8e
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:25:31
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: 2879825c-614b-4e99-b77d-62b5d15f62f8
        name: USA, Washington, Whidbey Island
    quote: I was stationed up in whidbey island washington.
    text: |-
      David Fravor was stationed at NAS Whidbey Island, Washington when flying the A-6 Intruder.
  - id: 95e53f36-2f74-472c-98af-6bff3c0cc61a
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:25:49
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: 0aee5e7e-658c-4d28-876a-71de2531d392
        name: 3D Spatial Awareness in Aviation
    quote: |-
      you do this low-level routes where you're gonna fly in the mountains at night. You're gonna be at 500 to 1,000 feet above the ground, ripping through fog layers, because you don't need to see outside. You're literally flying a little TV screen and a radar.
    text: |-
      A-6 Intruder crews flew night low-level instrument routes (IR routes) at 150 to 300 metres (500 to 1,000 feet) above ground through mountain terrain, navigating by radar without visual reference.
  - id: b8fc9920-1db1-4bf2-ae16-a93a64b2d286
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:26:08
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
    quote: |-
      the airplane had a flare ball it's a target recognition and multi-sensor it was called a tram.
    text: |-
      The A-6 Intruder's Target Recognition and Attack Multi-sensor (TRAM) system was a forward-looking infrared (FLIR) ball mounted on the aircraft.
  - id: da814945-625e-42cc-813f-2c78469a46fc
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:26:31
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
    quote: |-
      the bombardier navigator had a radar. And he was getting raw feed off of a pulse radar in front. Okay. So it's just basically mapping the mountains... he's looking at about 12 and a half miles when we're in the terrain mode where we're dodging mountains.
    text: |-
      The A-6 Intruder's bombardier navigator used a pulse radar scanning approximately 20 kilometres (12.5 miles) ahead of the aircraft in terrain-following mode, providing raw terrain mapping data.
  - id: 49877e1f-1389-4e93-9b94-596cb86f67e0
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:27:49
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
    quote: |-
      there's they're called range bins and there's eight of them. So the very far range bin is the 12 and a half mile, you know, and the closest range bin, it's a thing, it'll be like between like a half a mile and, or a quarter mile to three quarters of a mile.
    text: |-
      The pilot's terrain display in the A-6 Intruder used eight range bins showing radar returns at increasing distances out to approximately 20 kilometres (12.5 miles).
  - id: 668ac5af-503f-443a-8a81-817991fa0d32
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:28:44
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: b0e6a170-dde6-4eea-b383-453b01fbe050
        name: Weapon Systems Trainer (WIST) A-6 Simulator
    quote: |-
      there's been studies done on the crew coordination which is the interaction between the pilot and the bombardier navigator... there were studies done watching a6 crews in our simulators we call it the wist the weapon systems trainer. And it was not even a motion, it just kind of sat there.
    text: |-
      A-6 Intruder crews trained in the Weapon Systems Trainer (WIST) simulator, which did not have motion but could inject terrain scenarios; studies were conducted on crew coordination of A-6 crews in these simulators.
  - id: b1dd13a2-180a-4f76-b8fb-82cd2b64bb93
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:29:27
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: e1733f66-6f21-4202-9264-763fd39c414c
        name: Sato, Chris
      - id: 9c4f4aac-eb01-491d-acb0-4db9035c1d00
        name: Apple Inc
      - id: 0c2efa1f-a689-414c-aedf-876dcd0fc845
        name: MIT
    quote: |-
      my first fleet bombardier navigator who, who's, I'll name him, his name's Chris Sato. He's, works at Apple, pretty high up, MIT grad. I think computer engineering, he's scary smart.
    text: |-
      David Fravor's first fleet bombardier navigator was Chris Sato, an MIT computer engineering graduate who later worked at Apple Inc at a senior level.
  - id: f94eff4e-2f2d-466b-b7e4-9d22be5a2ac9
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:29:40
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 9c4f4aac-eb01-491d-acb0-4db9035c1d00
        name: Apple Inc
      - id: 6043f57b-02fa-4cf5-88c7-a3c7d47c35e9
        name: SAP SE
    quote: |-
      matter of fact, all the guys I flew us, so there's another guy, Matt, who also worked at Apple, who's now at SAP.
    text: |-
      Another bombardier navigator David Fravor flew with in the A-6 Intruder, named Matt, also later worked at Apple Inc and subsequently at SAP SE.
  - id: 4114aa40-b128-46da-808d-500535fe316d
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:29:52
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: e1733f66-6f21-4202-9264-763fd39c414c
        name: Sato, Chris
    quote: |-
      Chris and I, when we started flying together, we were actually the most junior crew in the squadron.
    text: |-
      David Fravor and Chris Sato were the most junior crew in their A-6 Intruder squadron when they began flying together.
