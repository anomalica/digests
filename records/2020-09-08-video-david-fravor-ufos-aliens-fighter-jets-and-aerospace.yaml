        name: Fravor, David
    quote: |-
      I had three female, actually four, one of them didn't fly anymore. She actually lives right around here. She ended up going into aircraft maintenance when she couldn't fly anymore.
    text: |-
      David Fravor had three, actually four, female pilots directly under him, one of whom stopped flying and moved into aircraft maintenance.
  - id: ae801b22-f135-4059-94ee-9cfd6de7317a
    type: testimony
    attestation: first_hand
    speaker:
