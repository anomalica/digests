    quote: in I think it was 62 when Eisenhower warned of the industrial defense complex
    text: |-
      Dwight D. Eisenhower warned of the military-industrial defence complex in approximately 1961.
  - id: e53d7007-bec2-46f3-a022-0dca973467ca
