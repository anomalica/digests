  - id: e13f570d-a98a-46eb-84ef-65059ca4b6ca
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:09:18.3-00:09:46.6
