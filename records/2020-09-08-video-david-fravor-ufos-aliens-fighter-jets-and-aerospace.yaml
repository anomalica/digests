      Lex Fridman: So you haven't really, before then, talked about it much. David Fravor: My wife didn't even really know the whole story.
    text: |-
      Before agreeing to Paco's fightersweep.com blog article, David Fravor had not talked about the Tic Tac incident much, and his wife did not even know the whole story.
  - id: 52d35f3a-e4f1-4f52-a4a7-1abbe63824c3
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:38:46.8-01:39:00.7
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 990ca8a5-667b-409c-8446-a0f11e50d6e0
        name: USS Nimitz
      - id: cda5456b-49ba-4e2d-ba3f-e93540f990a4
        name: Men in Black (1997 film)
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      For about two days, they played the Goofy movies. There's a comic on the back of the Air Wing schedule... first one was a far side, and the second one was me and the guy in my back seat, and it was men in black, but it had our names... protecting the Nimitz battle group type stuff.
    text: |-
      For about two days after the 2004 USS Nimitz UFO incident, the air wing schedule featured comics joking about the encounter, including a Far Side cartoon and a Men in Black image with Fravor's and his backseater's names on it referring to protecting the Nimitz battle group.
  - id: f34bd788-5765-4bc3-b601-28bd5281b096
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:39:15.3-01:39:28.1
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      No one ever came out in suits to talk to us... No, no one came out on a helicopter. No one came out on an airplane.
    text: |-
      After the 2004 USS Nimitz UFO incident, no officials in suits ever came out to interview Fravor's crew, and no one arrived by helicopter or airplane to collect classified material in person, contrary to rumours.
  - id: 6c8807d5-8c0c-4e8f-81a0-395b3b3faf5b
