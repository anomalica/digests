        name: F-18F Super Hornet (aircraft)
    quote: |-
      I started off an A6, was a two-seater. Then I went to single-seat F-18s, and I flew those all the way up until 2000 and, let me think, 2001, to the end of 2001. And then I shifted over and started flying the Super Hornets
    text: |-
      David Fravor flew single-seat F/A-18s from his early career through approximately the end of 2001, then transitioned to flying F/A-18F Super Hornets.
