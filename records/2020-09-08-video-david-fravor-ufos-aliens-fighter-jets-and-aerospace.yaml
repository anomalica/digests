        name: A-6 Intruder (aircraft)
    quote: |-
      We would typically fly between 420 and 480 knots of ground speed... Between seven and eight miles a minute is what you're flying.
    text: |-
      A-6 Intruder crews on instrument routes (IR routes) flew at 780 to 890 kilometres per hour (420 to 480 knots) ground speed, covering approximately 11 to 15 kilometres per minute.
  - id: 84fa68ad-798e-4003-86cf-e2c797a44170
    type: testimony
