        name: United Airlines
    quote: |-
      there's 6,000, 7,000 pilots at United Airlines. You know, your chance of flying with the same guy all the time is slim and none.
    text: |-
      United Airlines has roughly 6,000 to 7,000 pilots, making the chance of flying with the same person consistently very low.
  - id: 6bd6aa2c-ff47-4cbc-b669-4e51552b1842
