        name: Tic Tac Sighting
    quote: |-
      How did you know it was about 40 feet long? I go, okay, so 16 years flying against other airplanes, know what stuff looks like...I said 40 feet because it's about hornet size
    text: |-
      David Fravor estimated the AAV to be approximately 12 metres (40 feet) in length, comparable in size to an F/A-18F Super Hornet, based on 16 years of experience judging aircraft sizes at altitude.
