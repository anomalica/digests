    text: |-
      During the Lex Fridman Podcast 122: Fravor, 2020-09, David Fravor described Chesley Sullenberger's handling of the US Airways Flight 1549 emergency, stating that Sullenberger and his first officer were communicating with each other and with air traffic controllers in the New York area simultaneously while dealing with the bird strike.
