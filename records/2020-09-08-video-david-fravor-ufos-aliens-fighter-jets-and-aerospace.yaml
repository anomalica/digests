        name: Fravor, David
      - id: 75f3784a-4039-4a5f-aa6e-3073b695fda3
        name: F-117A Nighthawk
    quote: |-
      a perfect example in modern times is the 117…it was developed at this time. It flew for this long before it was actually acknowledged by the United States government.
    text: |-
      David Fravor cited the F-117A Nighthawk stealth fighter as a historical example of advanced technology that was developed covertly and operated for years before government acknowledgement, as a comparison point when evaluating whether the AAV could be secret US technology.
  - id: 3e67e9fb-47e6-4f98-b939-bc34ac79e967
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:11:27–02:12:17
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 8a01b2d8-98b8-4499-b9d0-dc9072555bb8
        name: Tic Tac Sighting
    quote: |-
      if we had a technology that would advance mankind leaps and bounds from what we normally do, then it would start coming out…there's a point where you have to look and go, if we had a technology like this that could literally change the way mankind travels
    text: |-
      David Fravor opines that if the US possessed a propulsion technology like that demonstrated by the AAV—capable of descending from above 80,000 feet (approximately 24,000 metres), hovering, and re-ascending—it would advance mankind and should eventually be released, making indefinite concealment illogical.
