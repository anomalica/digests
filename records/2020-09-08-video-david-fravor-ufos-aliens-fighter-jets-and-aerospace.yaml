    quote: |-
      there's usually indicators, there's papers of, hey, this is where we're going. I don't think there's a whole bunch of papers on developing a gravity-based propulsion system
    text: |-
      David Fravor stated that breakthrough propulsion technologies typically have precursor academic publications at leading universities, and he was not aware of a body of papers on gravity-based propulsion sufficient to support the observed AAV capabilities.
