    quote: |-
      everyone came back with the same thing. They're like, yeah, it was about the size of a hornet.
    text: |-
      David Fravor stated that all four aircrew who observed the AAV agreed it was approximately the size of an F/A-18F Super Hornet.
  - id: 833e61fb-e636-4070-8d9a-f8cc9c10f54f
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
