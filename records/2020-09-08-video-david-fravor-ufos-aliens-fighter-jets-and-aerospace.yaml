        name: Sullenberger, Chesley
    quote: |-
      The first officer already knows, hey, silence the alarm. They silence the alarm. The first officer is pulling out the book. He's going through the procedures while Sully's actually flying the airplane, knowing that they've lost their motors.
    text: |-
      David Fravor stated that during the US Airways Flight 1549 emergency, Chesley Sullenberger's first officer silenced the alarm and pulled out the emergency procedures book while Sullenberger flew the aircraft after losing both engines to a bird strike.
