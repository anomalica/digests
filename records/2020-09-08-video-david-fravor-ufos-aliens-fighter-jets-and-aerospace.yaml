        name: 2004 USS Nimitz UFO incident
      - id: 9d75354e-4c14-4ed8-a2e6-2b89e1c6e69a
        name: West, Mick
    quote: |-
      he looks at the FLIR video, and he says that one of the most amazing parts of the FLIR video, for people who haven't seen it, is at the end of it, the Tic Tac flies, or appears to fly very quickly to the left.
    text: |-
      In the 2004 USS Nimitz FLIR1 video, the Tic Tac object appears to fly very quickly to the left and off the screen at the end of the footage.
  - id: 86750cdc-628f-4ede-a0c8-a08c62299f2e
    type: opinion
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
      name: Fridman, Lex
    location: 02:41:31.1-02:41:58.0
    refs:
      - id: 9d75354e-4c14-4ed8-a2e6-2b89e1c6e69a
        name: West, Mick
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      The way to explain that is the tracking system, like we said, it's vision-based tracking, simply loses the object. The tracking loses it. And so it simply allows the object to float off screen because it's no longer tracking it.
    text: |-
      Mick West's explanation for the Tic Tac drifting off the screen in the 2004 USS Nimitz FLIR1 video is that the vision-based tracking system simply loses the object and allows it to float off screen because it is no longer tracking it.
  - id: 639c8bd3-5d8e-4657-a600-5f5d2f988ad4
    type: opinion
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
