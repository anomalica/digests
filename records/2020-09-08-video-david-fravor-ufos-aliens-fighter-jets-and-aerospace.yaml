      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: a4abadd8-1366-4cce-bccc-a5cf0f94827b
        name: F/A-18F
    quote: |-
      I come out of A6 and we really don't fight because it was a bomber. So I get in F-18s and I want to learn how to fight because it's a whole other side of the mission.
    text: |-
      David Fravor transitioned to F/A-18s after flying the A-6 Intruder, and needed to learn air combat maneuvering because the A-6 Intruder was a bomber with no fighter training component.
  - id: b1797b8b-aa5f-4218-b52b-aa2e6c7da505
    type: testimony
    attestation: first_hand
    speaker:
