    quote: |-
      I had just taken over. I had had the squadron for a month... So I'm a brand new CO. I'm the most junior guy as far as a commanding officer goes. for time in the Navy... I think it was the most junior CO for 05 Command in the Navy
    text: |-
      At the time of the 2004 Nimitz incident David Fravor had taken over command of his squadron only a month earlier and was the most junior commanding officer for an O-5 command in the Navy.
  - id: 8c69830d-de12-423e-83d3-0a4a4e319dd5
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 03:53:04.5-02:53:28.4
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      I have 17 air crew and 300 sailors that I'm responsible for. their wellbeing, making sure they're fed... I don't have a lot of time to worry about the Tic Tac.
    text: |-
      At the time of the 2004 Nimitz incident David Fravor was responsible for 17 air crew and 300 sailors as squadron commander and had limited time to focus on the Tic Tac.
  - id: 84fce93c-9ea2-4653-932d-d8214189f48a
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:53:29.5-02:53:47.1
    refs:
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
    quote: |-
      you got the captain of the ship, you got the air wing commander, and you got the admiral. Those are the top three. And you got the CEO of the Princeton, who is a major command guy... everything else is you got all the squadrons, which are O5 command, and you got the small boys that are out there, which is O5 command.
    text: |-
      In the carrier group hierarchy the top three were the captain of the ship, the air wing commander, and the admiral, followed by the commanding officer of the USS Princeton as a major command, with squadrons and the small boys being O-5 commands.
  - id: 0c9c22ac-a614-4cb3-b8f7-6b9d88dbb9fa
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:54:18.0-02:54:29.5
    quote: |-
      When a battle group deploys, especially when you go to the Middle East for what we were doing, the air power is the key. We take our airport with us, we can park it anywhere we want
