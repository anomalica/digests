        name: SpaceX
      - id: 506dd33e-a568-4a5a-b296-3c82db541219
        name: Space Shuttle
      - id: 66c4678e-33d4-4657-9f24-c3d7408b0215
        name: Morton Thiokol
      - id: c8e068c2-9087-4ccf-a9ad-55978d1d02b0
        name: Musk, Elon
    quote: |-
      because he can reuse the boosters, because they come back and land ... like Morton Thichol, we reused them on the space shuttle, but they had to take them all apart and do a bunch of stuff, because they landed in saltwater ... Where Elon gets them down ... they clean them up and they can use them again.
    text: |-
      SpaceX boosters return and land and are reused by being cleaned up rather than fully overhauled, unlike the Space Shuttle solid rocket boosters made by Morton Thiokol which landed in saltwater and had to be taken apart and reassembled.
  - id: f8f7c838-0852-4b31-aaa9-ed5f6ffc8ae2
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:18:43.2-02:19:09.0
    refs:
      - id: 69da6665-d8ec-490c-b589-47e35e6598f2
        name: SpaceX
    quote: the fact that we were paying huge amounts of money to the russian government
    text: |-
      Before SpaceX returned crewed launches to the United States, large amounts of money were being paid to the Russian government for access to space.
  - id: 4cbd58f1-332c-489f-b472-c61816141748
    type: hearsay
    attestation: second_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
