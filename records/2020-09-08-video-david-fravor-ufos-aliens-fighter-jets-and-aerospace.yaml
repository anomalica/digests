    quote: we see this little white tic-tac, because we're about 20,000 feet above it
    text: |-
      David Fravor observed a white Tic Tac-shaped object below his aircraft while flying at approximately 6,000 metres (20,000 feet) altitude; the object's position was first drawn to attention by white water disturbance on the ocean surface.
  - id: 56ff213f-4ee1-4e65-91e7-3175ffcd99ae
    type: observation
    attestation: first_hand
    speaker:
