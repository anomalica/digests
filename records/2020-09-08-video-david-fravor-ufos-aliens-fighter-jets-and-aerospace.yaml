        name: Navy Fighter Weapons School
    quote: |-
      Tom took me out and taught me how to fight because Tom had just left Top Gun. He was the training officer at Top Gun, so that's the guy.
    text: |-
      David Fravor described learning air combat manoeuvring from a friend called Tom (unnamed) who had been training officer at the Navy Fighter Weapons School (Top Gun).
  - id: 00e96767-c36c-4474-a8b3-8bf55a79bfda
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
