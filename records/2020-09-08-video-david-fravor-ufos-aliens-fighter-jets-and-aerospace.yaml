        name: Sato, Chris
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      Chris and I, when we started flying together, we were actually the most junior crew in the squadron.
    text: |-
      Chris Sato and David Fravor were the most junior crew in the A-6 squadron when they started flying together.
  - id: 43a195fb-ab6c-4565-8410-90f8a3690c17
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:30:46.1-00:31:04.5
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      You end up starting to talk in partials because I have to trust him. I can have no doubt that he knows how to do his job.
    text: |-
      As A-6 crews fly together more, they begin to talk in partial sentences rather than full sentences, relying on trust that each knows his job.
  - id: b2804afb-93d5-4a6a-9ef7-a42e5d6afbbc
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:31:55.7-00:32:38.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: e5898397-c599-4357-9f97-6f02ae4b82cf
        name: USA, Washington, Mount St. Helens
    quote: |-
      There's IR 344 that we used to fly, which would coast in off of Oregon... this is right by Mount St. Helens... we're just north of Mount St. Helens is where the route goes
    text: |-
      David Fravor and his bombardier navigator flew IR 344, an instrument route that coasts in off Oregon, near Mount St Helens, coming in from the east just north of the mountain.
  - id: ea2977b4-258c-4631-9fe2-a73a82438d40
    type: measurement
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:31:32.8-00:31:47.8
    refs:
