      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      I got pulled up because the guy, the people that are XOs...I had worked with now soon-to-be Vice Admiral Weitzel. He was Commander Weitzel at the time, was the EXO.
    text: |-
      The then-Commander Weitzel was the executive officer of Strike Fighter Squadron 41 (VFA-41) before David Fravor's command and later became a Vice Admiral.
  - id: 8474fdfe-a894-4800-9280-7696936f0e1e
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:23:08
    refs:
      - id: a1d8ad19-4fdc-40d4-b672-c1c869faeecb
        name: USA, Washington, Lemoore
      - id: 2055bcd3-0fef-4009-87db-8920e3d6f646
        name: F-18F Super Hornet (aircraft)
    quote: |-
      Lemoore had been a single-seat fighter community since forever. And now all of a sudden, you've got the F-18F coming in, which has the weapon systems operators in the back. that are not pilots, they're weapon systems operators
    text: |-
      Naval Air Station Lemoore had been a single-seat fighter community for an extended period before the introduction of the two-seat F/A-18F Super Hornet brought weapon systems operators who are not pilots.
  - id: d334a579-2a3d-46ac-a95a-bf0609f06e84
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:24:01
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
      - id: 2055bcd3-0fef-4009-87db-8920e3d6f646
        name: F-18F Super Hornet (aircraft)
    quote: |-
      one plus one with two people as well as a minimum of 1.5 because you've got an extra head, you've got extra eyes, you've got someone that can monitor systems, the airplanes can do two things at once.
    text: |-
      David Fravor opines that in a two-seat fighter, one pilot plus one weapon systems operator produces at least 1.5 times the effectiveness of a single-seat aircraft, due to the extra head, eyes, systems monitoring, and ability to multitask.
  - id: 5fce9a10-6510-49da-b4fc-f45f667456bd
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:15:22
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      80 solution is typically good enough because if you overthink it you're you're behind...80 solution is good enough you build up a really strong gut for the 80 solution
    text: |-
      David Fravor describes an 80% solution as sufficient in air combat because the fast pace means that overthinking leads to being behind; an 80% solution can always be adjusted.
  - id: 0b3a90ab-5d37-4371-b6cc-4d6218683aa2
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:16:29
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      it's a very, very fast chess game that happens at, you know, 400 knots, 300 knots, depends.
    text: |-
      David Fravor describes air-to-air combat as a very fast chess game occurring at speeds of approximately 740 kilometres per hour (400 knots) or approximately 555 kilometres per hour (300 knots), depending on the engagement.
  - id: 27c04160-9078-4049-a7d0-f7ec4ecdecfa
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:15:04
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      i'm not saying you have to be a genius and super smart to be a fighter pilot matter of fact you don't it really comes down to the ability to think very quickly
    text: |-
      David Fravor states that becoming a fighter pilot does not require being a genius; it primarily requires the ability to think very quickly.
  - id: 4245bb72-ba3a-41ab-92cb-c4606e5905c9
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:38:15
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      AI systems are usually black and white. When you write the algorithm for an AI system, it's really, it's basically you're taking thought and turning it into a giant math problem... a human, we all have gray areas
    text: |-
      David Fravor opines that artificial intelligence (AI) systems for flying fighter aircraft are typically constrained by logical, black-and-white algorithms with defined bounds, whereas human pilots can operate in grey areas and intentionally depart from controlled flight to gain tactical advantage.
  - id: 574e20b5-6e0e-44a2-8122-028c08109c6d
    type: observation
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 00:40:05
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
      - id: 2055bcd3-0fef-4009-87db-8920e3d6f646
        name: F-18F Super Hornet (aircraft)
      - id: a05b79a6-57a8-485d-8776-705e07ab5598
        name: Digital Flight Controls (aircraft)
    quote: |-
      I've done things in Super Hornets that literally even as a pilot inside the airplane, you're just like, wow, I cannot believe it just did that. Like it'll flop ends.
    text: |-
      David Fravor states that he has performed manoeuvres in F/A-18F Super Hornets — including the aircraft flopping ends — that surprised him as a pilot due to the forgiving nature of digital flight controls.
  - id: 62a5e301-15a7-4fc0-9987-3484c6c8d31c
