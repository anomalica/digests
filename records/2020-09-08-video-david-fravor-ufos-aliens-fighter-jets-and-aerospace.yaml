        name: 2004 USS Nimitz UFO incident
      - id: 990ca8a5-667b-409c-8446-a0f11e50d6e0
        name: USS Nimitz
    quote: |-
      we're literally in the middle of workups, and it was a joint workup... This was a two-month at sea period where we actually had to beg for them to let us when the ship pulled in at Thanksgiving so we could run home up to the Central Valley
    text: |-
      At the time of the 2004 Nimitz incident the carrier was in the middle of a joint two-month at-sea workup, during which the crew had to beg to pull in at Thanksgiving to visit family in the Central Valley before returning.
  - id: 5a83b114-9295-4e59-b3e4-f029d50e8ac5
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:52:37.1-02:52:53.7
