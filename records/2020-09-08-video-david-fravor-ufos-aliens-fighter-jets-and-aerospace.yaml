        name: United States Navy
    quote: |-
      That's actually where a lot of military guys go and they retire, they go do stuff like that.
    text: |-
      Many retired United States military personnel go on to work for the major defence contractors.
  - id: 975be3ed-873b-40d2-93ea-76ac9748926b
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:17:47.4-02:18:21.3
    refs:
      - id: 69da6665-d8ec-490c-b589-47e35e6598f2
        name: SpaceX
      - id: 3bbe6750-6363-44d3-98bc-df03895c9023
        name: SpaceX Dragon
      - id: 3e0f36b1-57e0-486f-aeeb-1e20da75efd9
        name: Boeing
      - id: c8e068c2-9087-4ccf-a9ad-55978d1d02b0
        name: Musk, Elon
    quote: |-
      So you got the the SpaceX which is the dragon capsule right and then you've got Boeing ... So Elon did what Boeing has contracted to do in less time for half the money.
    text: |-
      SpaceX delivered the Dragon capsule that Boeing had been contracted to build, doing it in less time and for half the money.
  - id: c5cb9c2f-f798-4023-8147-0a0064c4ce76
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:18:21.3-02:18:43.2
    refs:
