      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      It's a Doppler radar. So when it's in search mode, that's all it's doing... So he gets a return... all you get is a little green square unless it builds a track file on it. But the little green square is just sitting there. It's not moving because it's sitting in one spot in space.
    text: |-
      The F/A-18F Super Hornet radar is a Doppler radar that in search mode throws energy out and looks for a return, displaying a contact as a little green square until it builds a track file on it.
