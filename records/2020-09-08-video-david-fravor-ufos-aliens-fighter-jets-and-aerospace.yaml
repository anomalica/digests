        name: 3D Spatial Awareness in Aviation
    quote: |-
      when you first get together, the interaction, it's almost like you have to rehearse it, you have to know, and you talk in full sentences. The more and more we fly together, Chris could go, I'm showing, and he'd get rising out, and before he finished, I'd say, I've got it. You end up starting to talk in partials.
    text: |-
      David Fravor describes A-6 Intruder crew coordination as developing from full spoken sentences to partial communications as proficiency increased; he and Chris Sato reached a level where partial phrases were sufficient due to deep mutual trust.
  - id: 1b8db539-4d2c-4c1b-ab00-a44577b4aa0f
    type: testimony
    attestation: first_hand
    speaker:
