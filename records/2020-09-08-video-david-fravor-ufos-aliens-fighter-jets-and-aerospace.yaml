    quote: |-
      I'm probably about a half mile away... it just accelerates and disappears... it's literally in less than, you know, probably less than a half second
    text: |-
      David Fravor closed to approximately 800 metres (half a mile) distance from the AAV before it accelerated and disappeared in less than half a second.
