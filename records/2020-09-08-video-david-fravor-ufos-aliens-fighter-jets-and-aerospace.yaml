        name: VFA-41
    quote: |-
      the guy, the people that are XOs, because we fleet up, you go from the number two guy to the number one guy. So the XO becomes the CO. So the executive officer becomes the commanding officer.
    text: |-
      David Fravor states that the executive officer (XO) of a US Navy squadron typically fleets up to become the commanding officer (CO).
  - id: 91179f16-2972-4bb1-84a9-257c969d100b
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
