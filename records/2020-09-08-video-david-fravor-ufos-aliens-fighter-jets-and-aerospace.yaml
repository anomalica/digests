        name: United States Naval Academy
    quote: |-
      I went out to the Nimitz on my, uh, freshman cruise after your freshman year at the Naval Academy, you go out on a ship and you, you're an enlisted person
    text: |-
      During his Naval Academy freshman cruise, the year after his freshman year, David Fravor went out aboard the USS Nimitz as an enlisted person.
  - id: adbcb10f-cd05-470b-afac-779c8b61908e
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
