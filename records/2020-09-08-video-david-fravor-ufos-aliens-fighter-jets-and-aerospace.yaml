        name: USS Princeton
      - id: 0c7cf3c5-77d9-4111-93cd-f697b8ab9a7e
        name: AN/SPY-1 Radar
    quote: |-
      It's got an incredible SPY-1 system, phased array, four panels. So it looks in quadrants.
    text: |-
      The USS Princeton carries the SPY-1 phased array radar system with four panels that looks in quadrants.
  - id: a17da553-5034-43e3-9b0e-51fb9997ffea
    type: observation
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
