      - id: a4abadd8-1366-4cce-bccc-a5cf0f94827b
        name: F/A-18F
    quote: |-
      How did you know it was about 40 feet long?…I know when we saw the Tic Tac, I was at 20,000 feet-ish…i know what a hornet looks like looking down on him because i've done it for all those years…it was about hornet size
    text: |-
      David Fravor estimated the AAV was approximately 40 feet (approximately 12 metres) long, roughly the size of an F/A-18 Hornet, based on his 16 years of experience judging aircraft size from the air.
