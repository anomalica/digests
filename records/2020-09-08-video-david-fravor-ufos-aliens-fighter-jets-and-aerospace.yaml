      when the situation report comes off the ship, that's like third hand. So we tell someone, they tell someone, that person has to write it up. So there's all kinds of inaccuracies in it. But then there's the unofficial official report that's actually pretty well written. There's some errors in it
    text: |-
      A situation report coming off the ship about the Nimitz incident is effectively third-hand information, written up after being relayed from person to person, and contains inaccuracies, whereas the unofficial official report is fairly well written with some errors.
