    quote: |-
      There was never a replacement for the A-6 that I flew. It really became the F-18, which the A-6 could go quite a bit further distance-wise by fuel. Then the Hornet.
    text: |-
      There was no direct replacement aircraft for the A-6 Intruder; the F/A-18 Hornet effectively filled that role, though the A-6 had greater range than the Hornet.
  - id: 183fea4a-6fee-40f7-a2ca-6b21789ca940
    type: testimony
    attestation: first_hand
