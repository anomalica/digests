      - id: 7a2bb9c7-c65e-47c2-91da-8caebb3f1c90
        name: Naval Postgraduate School
    quote: |-
      you've got MIT, you've got Caltech, you've got Stanford, Georgia Tech, Virginia Tech, Carnegie Mellon, I'm just naming schools, Naval Postgraduate School is another one.
    text: |-
      David Fravor cites the Massachusetts Institute of Technology (MIT), Caltech, Stanford, Georgia Tech, Virginia Tech, Carnegie Mellon, and the Naval Postgraduate School as top-tier universities where leading-edge research emerges.
  - id: 2d2598c5-1417-4ac8-ad97-9d9ef5394dcc
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:25:37.6-02:25:43.9
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      Well, I don't like to get into little green men, but I would say that I don't think we've developed it.
    text: |-
      David Fravor does not believe humans developed the Tic Tac object from the 2004 USS Nimitz incident, while avoiding the framing of little green men.
