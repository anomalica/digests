        name: Tic Tac Sighting
    quote: No. Nothing.
    text: |-
      David Fravor felt no aerodynamic wake when flying near the AAV during the Tic Tac Sighting.
  - id: aa6c2865-cbae-46f7-b7f2-644f79766ba9
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
