        name: F/A-18F Super Hornet
    quote: |-
      now the WIZO is behind us... most of the communications that go out of the airplane, the Wizzo does all the talking, he's got actually, he uses his feet
    text: |-
      In the F/A-18F Super Hornet the weapon systems operator (WSO) sits behind the pilot and handles most of the radio communications, using foot controls.
  - id: c7bcf4b2-3e5c-467d-9e33-22d80cda29e5
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:33:33.2-00:33:49.4
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      the block twos has about an eight by 10 display for the wizos... the pilots is smaller. It's a six by six between his legs
    text: |-
      The Block II F/A-18F Super Hornet has about a 20 by 25 centimetre situational awareness display for the weapon systems operator, while the pilot has a smaller display of about 15 by 15 centimetres between his legs.
  - id: 727dc579-b595-4e75-b80f-70d71b0f6648
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
