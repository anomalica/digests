      - id: a27aa19a-d6e1-4c3d-ae11-55ffe1eba627
        name: Tic Tac Sighting
    quote: |-
      I am 99.9%...0.1% my eyes deceive me. But remember, if it deceived me, it had to deceive the other four people. So the percentage is even lower.
    text: |-
      David Fravor assessed the probability that his visual observations of the AAV were mistaken at 0.1 percent, noting that the same mistake would have had to affect all four observers simultaneously.
