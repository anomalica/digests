    quote: |-
      when i got too close to it you know it decided i'm out of here and then it did something that we've never seen the other question is what if i didn't cut across the circle what if i just kept going around a circle
    text: |-
      David Fravor stated that when he cut across the circle to close on the AAV, it accelerated away and departed, and he expressed regret at not simply continuing to circle to observe it.
