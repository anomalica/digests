        name: Raytheon
    quote: |-
      the big three in defense, which is really, you know, Northrop, Lockheed, and Boeing. those are the big ... Raytheon's kind of right, like a subset of that, but they're, Raytheon's pretty big too.
    text: |-
      The three largest United States defence contractors are Northrop Grumman, Lockheed Martin, and Boeing, with Raytheon also large but a subset of that group.
  - id: 80efba7f-16ff-4b33-9721-72259f280153
    type: opinion
