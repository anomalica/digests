    location: 02:43:00.6-02:43:19.7
    refs:
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      when the vehicle starts to move, the bars, the tracking gate starts to open up... The tracking gate will start to open up. But the thing, when it leaves so fast off the screen, the pod can't move fast enough. It has gimbal rates on how fast that thing can move around.
    text: |-
      In the 2004 USS Nimitz FLIR1 video, when the Tic Tac begins to move, the tracking gate starts to open up, and when the object leaves the screen the targeting pod cannot move fast enough because the pod has gimbal rates limiting how fast it can move around.
  - id: 990930be-114e-4fd1-a145-b976b33b3b81
