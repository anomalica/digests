        name: A-6 Intruder
    quote: |-
      one of the squadrons was a VF 41 and a 14 squadron VF 84, uh, an F 14 squadron, and then a couple of a six squadrons
    text: |-
      During David Fravor's Naval Academy cruise aboard the USS Nimitz, the squadrons present included VF-41 and an F-14 squadron VF-84, plus a couple of A-6 squadrons.
  - id: 865d5723-2b85-4a80-8b29-73568774e9ed
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
