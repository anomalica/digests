    quote: Elon did what Boeing has contracted to do in less time for half the money.
    text: |-
      David Fravor opines that SpaceX, under Elon Musk, accomplished what Boeing had contracted to do for human spaceflight in less time and for approximately half the cost.
  - id: 4f2655e8-1d98-4ea5-8650-78d30bb8379b
