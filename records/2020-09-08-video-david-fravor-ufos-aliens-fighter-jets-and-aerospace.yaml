    text: |-
      On the day of the 2004 USS Nimitz encounter, David Fravor's flight of four launched on a training mission that was then cancelled and redirected.
  - id: ab1c432a-fd05-4da1-b1af-5520c3df6ca5
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:15:07.6-01:15:13.5
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
