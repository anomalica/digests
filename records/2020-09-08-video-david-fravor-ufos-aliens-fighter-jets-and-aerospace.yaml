    quote: |-
      Bob is a straightforward, very sane, normal, super smart guy... The stuff that he talks about is not the center of his life. If anything, it ruined his life.
    text: |-
      David Fravor described Bob Lazar as a 'straightforward, very sane, normal, super smart guy' and noted that the things Lazar talks about are not the center of Lazar's life, saying 'if anything, it ruined his life'.
