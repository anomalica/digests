      People were getting shot down a lot. The highest anxiety and heart rates were coming back to land on board an aircraft carrier.
    text: |-
      David Fravor stated that the highest anxiety and heart rates among Navy pilots flying combat missions during Vietnam were recorded not during the missions themselves but when the pilots returned to land on the aircraft carrier.
