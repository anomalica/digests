        name: Tic Tac Sighting
    quote: |-
      was it were we afraid i don't think so i mean and to me it was more curious curiosity overcomes any fear that you would have
    text: |-
      David Fravor stated that he felt no fear during the encounter with the AAV, describing curiosity as overcoming any fear.
  - id: 4c0a6b90-b8b1-4c88-bae3-0ed448db9d1f
    type: observation
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 02:04:23
    date: '2004-11-14'
    refs:
