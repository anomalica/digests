      it creates what's called we call the verbal but when the air flows across the flight deck it drops behind the ship... and then it kicks back up so when you're coming aboard to land it's going to make you go up a little bit and then you're going to fall and you got to con you got to anticipate that to stay on glide
    text: |-
      When a carrier makes its own wind to land aircraft, air flowing across the flight deck drops behind the ship and kicks back up, called the burble, causing a landing aircraft to rise then fall, which pilots must anticipate to stay on glide slope.
