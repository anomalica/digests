      - id: 1f825b50-f9df-408d-84a1-28c8aec10271
        name: Multispatial Disorientation Device Training
    quote: |-
      your eyes do that yeah land your eyes assume that the runway and your brain assumes that the runway is fixed...it's called the MSDD Multispatial Disorientation Device, or the Spin and Puke
    text: |-
      David Fravor stated that pilots are trained to distrust their visual senses and rely on instruments, citing the Multi-Spatial Disorientation Device (known informally as the 'Spin and Puke') as part of that training.
  - id: f8a50b80-5a58-4222-ab5a-92d053dc39c1
    type: observation
    attestation: first_hand
    speaker:
