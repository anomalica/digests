      David Fravor described the observable stages of a night rocket launch from Vandenberg Air Force Base: a narrow exhaust plume at low altitude that spreads outward upon reaching the upper atmosphere, followed by stage separation, and residual cloud formations from exhaust that look unusual to observers who missed the launch.
