        name: Boeing
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: they're, they're getting ready to redesign that Boeing is
    text: Boeing is preparing to redesign the cockpit display of the F/A-18F Super Hornet.
  - id: 48a1c95d-ad02-48da-8490-95cc93c19f38
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:33:33.2-00:34:37.2
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      Think of it as a God's eye view... It's sending it out through the link, so all the airplanes are talking to each other through this digital network
    text: |-
      The situational awareness display in the F/A-18F Super Hornet is a God's eye view linked to all the other airplanes through a digital network, showing the positions of friendly aircraft and targeted threats.
  - id: df07e2e5-5dc9-409f-bfb4-35dc650a63bd
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:34:23.5-00:34:37.2
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      this is the third brain. So we're all looking at it, and the third brain is doing fusion. It's pulling stuff together
    text: |-
      The F/A-18F Super Hornet's third brain performs sensor fusion, pulling together data and identifying which contacts belong to which aircraft.
  - id: ee204a13-e421-4a39-a77f-53e1540dc829
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:35:27.5-00:35:36.0
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      The AI piece would be more of a control loop because of the digital flight controls. So the airplane actually, they had to make the airplane easier to fly.
    text: |-
      The F/A-18F Super Hornet has digital flight controls with a control loop that makes the airplane easier to fly.
  - id: 48fb0691-22b9-4a46-abeb-afeff5351e5b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:35:58.0-00:36:09.7
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      you've got a joint helmet mounted queuing system on that basically maps the magnetic field in the cockpit so it can tell where your head's at looking. So if I turn my head to the right, the radar will actually look to the right.
    text: |-
      The F/A-18F Super Hornet uses a joint helmet-mounted cueing system that maps the magnetic field in the cockpit to track where the pilot's head is looking, slewing the radar and targeting pod to follow head movement.
  - id: 855cbd67-67b9-4c56-b9fb-f4426aef595c
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:36:11.7-00:36:24.9
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      the back seater has a helmet on too. So he can look to the left and he can do things. So depending on what sensor he's controlling.
    text: |-
      Both the pilot and the back-seat weapon systems operator of the F/A-18F Super Hornet wear helmet-mounted cueing systems and can independently slew the sensors they control.
  - id: f9504e7e-7767-4d45-b595-382943253023
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:36:24.9-00:36:34.8
    refs:
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
      - id: 66f42c54-23e1-441b-ad3a-c2618cd447c4
        name: AN/APG-79 Radar
    quote: because it's a phased array radar now, it doesn't really scan
    text: |-
      The F/A-18F Super Hornet has a phased-array radar that does not mechanically scan.
  - id: 588936d9-3734-4e71-a72d-adee627421ef
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:36:47.4-00:37:24.2
    refs:
      - id: 496160fe-b4d1-4ca1-a0b2-026f34331740
        name: Joint Direct Attack Munition (JDAM)
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      transfer high-quality coordinates from a system into a joint JDAM, which is a joint direct attack munition that is the GPS bombs that you see all the time, and then let that thing fly. And I'm solving this problem in seconds, vise minutes.
    text: |-
      A pilot can slew sensors to his head, transfer high-quality coordinates into a Joint Direct Attack Munition (JDAM, a GPS bomb), and launch it, solving a targeting problem in seconds rather than minutes.
  - id: 88a2e2cb-9fe1-45d2-9ef4-41318ecbfd55
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:38:15.3-00:38:45.5
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      AI systems are usually black and white... Math problems are, there's a line that says I can or I can't... where a human, we all have gray areas
    text: |-
      AI systems are usually black and white, operating along a finite line of can or cannot, whereas humans have grey areas and can operate within them.
  - id: b0760f0f-51e1-4106-b80c-e51476a6a2a2
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:38:45.5-00:39:19.5
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      if you know what an em diagram is the energy so it basically says the airplane can fly as slow as this it can go as fast as this it can pull this many g's
    text: |-
      An energy-manoeuvrability (EM) diagram describes an airplane's flight performance, including its minimum and maximum speeds and how many G-forces it can pull based on airfoil design.
  - id: d58af199-476b-4093-8aee-bd801e14df21
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:39:25.8-00:39:46.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      you can go back to World War I, where people intentionally departed the airplane from controlled flight, in order to obtain an advantage, which is that's where the human goes, can I do this?
    text: |-
      In dogfighting, dating back to World War I, pilots have intentionally departed an airplane from controlled flight to obtain an advantage, something a human will do that AI typically will not because AI is written to keep the airplane in controlled flight.
  - id: 7f3982ac-eade-45ab-847c-5879cb1c4e47
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:39:46.3-00:40:09.0
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      the flight control logic in modern airplanes with digital flight controls, they're extremely forgiving. So you can literally, I've done things in Super Hornets... Like it'll flop ends. which defies most logic.
    text: |-
      Modern airplanes with digital flight controls are extremely forgiving, allowing manoeuvres such as flopping the aircraft's ends that defy most logic.
  - id: 666fe039-a914-4ea6-9d5e-3b0f328574c1
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:41:04.7-00:41:21.2
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
    quote: |-
      when Sully flew, when his first officer, that's the co-pilot, showed up, you know, first time they'd met. And this happens all the time in the commercial world.
    text: |-
      When Chesley Sullenberger landed the airplane on the Hudson, he and his first officer (co-pilot) had met for the first time, which is common in the commercial aviation world.
  - id: b02898b2-823e-4bf2-a94c-dfbf942c6c7a
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:41:21.2-00:41:26.9
    refs:
