    quote: |-
      I went out to the Nimitz on my, uh, freshman cruise after your freshman year at the Naval Academy... one of the squadrons was a VF 41 and a 14 squadron VF 84, uh, an F 14 squadron, and then a couple of a six squadrons... I said, I want to do that.
    text: |-
      David Fravor's freshman cruise from the Naval Academy took him to the USS Nimitz, where he first saw the squadrons including Fighter Squadron 41 (VF-41) and Fighter Squadron 84 (both F-14 squadrons) and A-6 squadrons, which inspired him to pursue Navy aviation.
