    location: 00:20:00
    refs:
      - id: 5da4c898-1231-4192-b4c8-c5fcecdf3efc
        name: A-6 Intruder (aircraft)
    quote: |-
      a side-by-side bomber so it's a pilot on the left seat and the bombardier navigators on the right seat it was built in the 60s. It is all weather and it flies low at night and it's got a terrain mapping radar.
    text: |-
      The A-6 Intruder is a side-by-side bomber with the pilot in the left seat and the bombardier navigator in the right seat; it was built in the 1960s, is all-weather, flies low at night, and is equipped with a terrain-mapping radar.
  - id: 73b238de-73df-4d47-904e-89b87e76fc3a
