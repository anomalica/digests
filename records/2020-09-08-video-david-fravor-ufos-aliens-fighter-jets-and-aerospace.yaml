    text: |-
      The F/A-18F Super Hornet's weapon systems operator (WISO) in the rear seat controls communications using foot pedals and operates sensors including the targeting pod.
  - id: 5712eaff-cdd6-4695-8c06-d223c023975b
    type: testimony
    attestation: first_hand
    speaker:
