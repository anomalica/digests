        name: |-
          Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16
    quote: |-
      It wasn't aggressive. You know, there was talk, oh, it flopped behind us. It was never offensive on us. It never did that. It just mirrored us.
    text: |-
      During the Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16, the AAV did not behave aggressively toward the aircrew; David Fravor states it mirrored their movements but never flew into an offensive position or attacked.
  - id: b06902bb-908c-4812-9be9-fa46bb11873d
    type: hearsay
    attestation: second_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:12:25–02:12:55
    date: 2004-11
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 64018145-3755-4e75-9907-a4a80e26c4bc
        name: USS Princeton
      - id: 790f632f-de89-407e-8c58-3983d09ef2c2
        name: |-
          Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16
    quote: |-
      I talked to the controller, he's like, we've seen up to 10 of these things…they tracked a groups of these things coming down, hanging out and going up…these things were coming down when the cruiser tractor from above 80,000 feet…they'd hang out at like 20,000 feet. And then three or four hours later, they'd go back up.
    text: |-
      A USS Princeton radar controller told David Fravor that up to 10 AAV objects had been tracked descending from above approximately 80,000 feet (approximately 24,000 metres), hanging at approximately 20,000 feet (approximately 6,100 metres) for three to four hours, and then returning upward.
  - id: 16fd6779-5335-47d9-ae13-ca2a5c78af38
    type: observation
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:31:42–02:32:19
    date: '2004-11-14'
    refs:
