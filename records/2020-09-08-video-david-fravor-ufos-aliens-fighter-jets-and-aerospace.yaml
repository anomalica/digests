        name: Tic Tac Sighting
    quote: |-
      it's going basically north, south, and then east, west, north. And it's abrupt. It's very abrupt.
    text: |-
      David Fravor observed the Anomalous Aerial Vehicle (AAV) moving abruptly north-south and east-west with no apparent inertia, unlike a helicopter which would decelerate before reversing direction.
