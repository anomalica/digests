    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:49:06.3-02:49:32.6
    refs:
      - id: 3714792a-cebe-4f13-ae2e-a779ddc45ed4
        name: 2014-2015 US East Coast UAP encounters
    quote: |-
      what if the airplane would have actually hit your cool new toy and you got two people that are ejecting or dead and you got a $80 million airplane that's now in the bottom of the Atlantic. Tests are normally done in controlled environments.
    text: |-
      David Fravor argues the objects observed were unlikely to be secret government tests because secret tests are conducted in controlled environments, not where unknowing pilots are conducting exercises with an $80 million aircraft at risk.
  - id: 959a9e8a-98b2-423d-8c0d-2155219be8f1
    type: hearsay
    attestation: second_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:49:38.2-02:50:08.2
    refs:
      - id: 69da6665-d8ec-490c-b589-47e35e6598f2
        name: SpaceX
      - id: c8e068c2-9087-4ccf-a9ad-55978d1d02b0
        name: Musk, Elon
      - id: 1d5c78b9-b3b4-495c-ba40-0c27fc1bd698
        name: Marshall Islands, Kwajalein Atoll
    quote: |-
      they had a rocket go off, they were out in Kwajalein, and when the rocket went up, a fuel line ruptured in the rocket and it ran out of fuel before it got all the way up and it came falling back down... And it actually crashed next to the ATOL and Elon wasn't happy and threw this guy under the bus.
    text: |-
      A SpaceX rocket launched from Kwajalein suffered a ruptured fuel line, ran out of fuel before reaching the top of its flight, fell back down, and crashed next to the atoll, after which Elon Musk threw the responsible engineer under the bus.
  - id: 41e2fba1-7a3c-4227-972b-e8cbf6876074
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:50:48.9-02:51:12.4
    quote: |-
      Like an airplane with digital flight controls, before it even leaves the ground, they've got things over the pitostatic system that are changing what the airplane thinks is the airspeed... it's probably up on jack, so the gear up... they're just changing the pressure on the pedostatic system so they can actually make the flight controls move and they can get all the data back
    text: |-
      A digital flight control aircraft is tested before it leaves the ground by placing the aircraft on jacks with gear up and altering the pitot-static system pressures so the aircraft thinks it is flying, allowing engineers to make the flight controls move and gather data.
  - id: 95618ecc-8179-4ac1-ba9a-0e6de5ce0bcd
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
