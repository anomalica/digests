    location: 00:19:02.3-00:19:16.4
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 990ca8a5-667b-409c-8446-a0f11e50d6e0
        name: USS Nimitz
      - id: 8c3bbe77-01ce-4817-bb50-404fd6291ecd
        name: Fighter Squadron 41 (VF-41)
      - id: 2ee7da03-60dd-4a5e-a22b-cbfafe19b5c6
