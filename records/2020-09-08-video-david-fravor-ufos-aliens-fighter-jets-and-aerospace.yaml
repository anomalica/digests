        name: Strike Fighter Squadron 122 (VFA-122)
    quote: |-
      so i ended up going there and i ended up being the operations officer and training officer okay so we track the last hundred students
    text: |-
      David Fravor was the operations officer and training officer at the Super Hornet training squadron VFA-122.
  - id: 60f14d56-b9e8-4c13-8efb-75c167789fb2
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
