      the difference is actually on the East Coast, the 2014 case, very few people have spoken about it. And even in your situation, very few people have spoken about it.
    text: |-
      Very few people have spoken publicly about the 2014 East Coast UAP case, and very few have spoken about David Fravor's 2004 encounter.
  - id: 510276fd-b339-4f12-a406-0fa259621eeb
    type: testimony
    attestation: first_hand
    speaker:
