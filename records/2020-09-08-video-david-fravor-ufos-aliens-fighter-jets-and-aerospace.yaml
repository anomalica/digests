        name: 2004 USS Nimitz UFO incident
    quote: |-
      I had a commander in a Navy call me about right before the article came out in the New York Times... there was a FOIA request for stuff about the Nimitz incident... do you know of anything else besides the situation reports that come off the ship?
    text: |-
      Shortly before the 2017 New York Times article came out, a Navy commander telephoned David Fravor about a Freedom of Information Act request for material on the Nimitz incident, asking if he knew of anything beyond the ship's situation reports.
  - id: b241a321-5ecc-4bbe-8307-e68ab51ff7ce
