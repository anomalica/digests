        name: USS Nimitz
    quote: |-
      Nimitz is, uh, an aircraft carrier. So it's, uh, four and a half acres of sovereign U S territory that floats around the U S oceans.
    text: |-
      The USS Nimitz is an aircraft carrier, described as four and a half acres of sovereign US territory that floats around the oceans.
  - id: 7c345094-9397-4864-90c6-aa9ac6945ced
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:18:51.2-00:18:58.8
    refs:
      - id: 990ca8a5-667b-409c-8446-a0f11e50d6e0
        name: USS Nimitz
    quote: |-
      the air wing is really the weapons. It does have defensive weapons, but for the most part, it's a giant moving airport is what it is.
    text: |-
      An aircraft carrier's air wing is its primary weaponry; the carrier itself has defensive weapons but is essentially a giant moving airport.
  - id: fba7d2a7-63e7-4f44-8293-97d30a097562
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
