        name: Tic Tac Sighting
    quote: |-
      it actually reoriented its longitudinal axis and it started mirroring us coming up, then it was obviously where we were there and it was really coming up just, you know, you figure I'm at 20 and it's coming up and it ends up getting up to 12
    text: |-
      David Fravor observed that the AAV reoriented its longitudinal axis and started mirroring his aircraft as he descended, rising from the surface up to approximately 3,660 metres (12,000 feet) as he descended from approximately 6,100 metres (20,000 feet).
