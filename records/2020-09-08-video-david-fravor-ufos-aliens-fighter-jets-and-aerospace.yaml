        name: United States Marine Corps
    quote: |-
      there are Marine squadrons that go out to the aircraft carriers, but most of them are land-based, you know, to support the Marines
    text: |-
      Most Marine Corps squadrons are land-based to support the Marines, though some Marine squadrons deploy to aircraft carriers.
  - id: d4dffd39-99e2-462a-ae03-dd8d0cd268b9
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:17:26.9-00:18:00.1
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      My grandfather, who is a big, big part of it, my mom's dad... it was the first funeral I ever went to and it was about three miles long and church was overfilling... He was a beer delivery guy
    text: |-
      David Fravor's maternal grandfather, a beer delivery man, was a major positive influence on him, and his funeral procession was about five kilometres long with an overflowing church.
  - id: db4422c0-e7a1-42e3-8d01-43d2bb895825
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:41:43.7-00:42:06.9
    quote: |-
      in very complex missions like a forward air controller, where we're in the air actually controlling ground assets and supporting ground troops. if you're in a high threat area, which is crazy busy, you have to be melded when you do that. You have to have trained to do that job, otherwise you're gonna be ineffective.
    text: |-
      Forward air control, where a pilot in the air controls ground assets and supports ground troops in a high-threat area, requires a crew that has trained together to be effective.
  - id: 02605d11-3d46-42ea-8253-93b10fe06966
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:42:08.0-00:42:22.9
    quote: |-
      When you get to the commercial world, and I've got tons of friends that fly commercial, there is a standardization. Like, we know that at this point, I'm gonna put this switch, you're gonna do that, and everyone, they know their rules. Captain's gonna do this, first officer's gonna do this.
    text: |-
      Commercial aviation crews operate to a standardisation in which the captain and first officer each have defined roles known to both.
  - id: 08ca763d-d289-4859-99c5-7f8797a00b1b
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:42:22.9-00:42:40.4
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
      - id: 0db4446d-ed9e-414a-b7a7-8ee029e0c811
        name: US Airways
    quote: |-
      so in Sully's case, when they take the birds and they know they've got a problem, and if you've listened to the cockpit recordings of him, the two of them talking... they're also talking to the air traffic controllers in the New York area.
    text: |-
      During the 2009 US Airways Flight 1549 emergency, Chesley Sullenberger and his first officer were communicating both with each other and with air traffic controllers in the New York area.
  - id: 79008373-6565-4141-9f54-a74f802ff79a
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:42:42.4-00:42:51.9
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
    quote: |-
      And the first officer already knows, hey, silence the alarm. They silence the alarm. The first officer is pulling out the book. He's going through the procedures while Sully's actually flying the airplane, knowing that they've lost their motors.
    text: |-
      During the 2009 US Airways Flight 1549 emergency, after the bird strike the first officer silenced the alarm and worked through the procedures from the book while Chesley Sullenberger flew the aircraft, knowing they had lost their engines.
  - id: 5e48bfc9-aaa5-4d2d-aa90-5746dfb3e61d
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:42:51.9-00:42:58.2
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
    quote: |-
      like they're trying to get him to go into an airport into New Jersey. And he realizes not happening.
    text: |-
      During the 2009 US Airways Flight 1549 emergency, air traffic control was trying to direct Chesley Sullenberger to an airport in New Jersey, but he judged it was not achievable.
  - id: 66730e84-de63-4ab3-9098-41411c620c96
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:42:59.2-00:43:05.4
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
      - id: b394c4a1-9a99-45ce-baa3-9202408902a6
        name: USA, New York, Hudson River
    quote: |-
      And he made a decision soon enough so that he could prepare everyone on the airplane that he was going to put this thing in the Hudson River.
    text: |-
      During the 2009 US Airways Flight 1549 emergency, Chesley Sullenberger decided early enough to land in the Hudson River to be able to prepare everyone on the aircraft.
  - id: 4d8f0c11-ee34-4887-8538-b46848b845ff
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:43:07.1-00:43:14.8
    refs:
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
      - id: b394c4a1-9a99-45ce-baa3-9202408902a6
        name: USA, New York, Hudson River
    quote: |-
      every single person walked away from that wreck. The only thing that didn't survive was the airplane, you know, and it got fished out of the Hudson.
    text: |-
      In the 2009 US Airways Flight 1549 ditching, every person walked away and the only thing that did not survive was the aircraft, which was recovered from the Hudson River.
  - id: 13bd8119-a09b-418e-b52a-e0975ffb244c
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:43:36.6-00:43:52.5
    refs:
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
      - id: 1c0d5523-c995-4875-b135-66bd92bf8baa
        name: United States Air Force
    quote: |-
      the commercial industry and the Navy, and the Air Force for all that, we have what's called, we have emergency procedures that we have to know. Like engines on fire, the first three steps, you just have to know what they are, right?
    text: |-
      The US Navy, US Air Force and commercial aviation industry train emergency procedures that pilots must know from memory, such as the first three steps for an engine fire.
  - id: 09fabc9a-ac00-46e0-92b9-99b2c27505d5
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:43:53.2-00:44:00.7
    quote: because the airplanes are designed, they're built to have some time.
    text: |-
      Commercial aircraft are designed to give a crew some time to respond to an emergency.
  - id: 9e171877-abaa-4c26-91a0-35c3bc5957e7
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:44:38.2-00:44:59.5
    refs:
      - id: 44c165ba-7bdd-482b-ae3b-e396a1952cd3
        name: Sullenberger, Chesley
      - id: 69f9cf1a-1492-4607-984a-1d5396bbf25a
        name: 2009 US Airways Flight 1549 Hudson River landing
    quote: |-
      because if you listen to tapes are trying to get it air started the closer he gets to the water the more he's going i'm ditching the airplane
    text: |-
      During the 2009 US Airways Flight 1549 emergency, recordings show the crew attempting to restart the engines in the air, and the closer the aircraft got to the water the more Chesley Sullenberger committed to ditching it.
  - id: 73d9a218-08e0-43c4-8541-0b321a666ec1
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:45:18.1-00:45:30.0
    quote: |-
      it's every six months for commercial, they go back and they do research in the airplane in the simulator where they train to the airplane being broken. You just lost a motor. You just lost another motor.
    text: |-
      Commercial pilots return every six months to a simulator to train flying the aircraft with failures such as losing engines.
  - id: 46883649-dc5e-4dcd-ba1d-9f3d706d8bda
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:45:30.0-00:45:43.1
    refs:
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      it's, you know, we used to refer to it in the Navy as the pain cave where you're going to get in. Because you know that when you get in for your check ride in a simulator that the airplane is going to break.
    text: |-
      In the US Navy, simulator check rides were referred to as the pain cave because the aircraft is guaranteed to break during the session.
  - id: ef1f1bae-10cd-48c1-9dc5-73bc78786c13
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:45:43.1-00:46:08.2
    refs:
      - id: f38b5c00-7a46-45bf-ac8d-e955dd2eff8c
        name: F/A-18 Hornet
    quote: |-
      because there's two hydraulic systems one on each motor... and now I'm flying on a good motor with a bad hydraulic system and without hydraulics the airplane won't fly.
    text: |-
      The F/A-18 has two hydraulic systems, one on each engine, and without hydraulics the aircraft will not fly.
  - id: be34f791-4e0d-491b-82b5-3873b30690bf
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:46:22.7-00:46:50.4
    quote: |-
      we like to joke it's going to stem power, where the functional part of your brain shuts down and you are literally on instinct like an animal. Well, if you've trained so much that that is the instinctive reaction that you're going to have...
    text: |-
      Under extreme stress, the functional part of the brain shuts down and a pilot operates on instinct, which is why training is repeated until the correct reaction is ingrained.
  - id: a57f5baa-dc50-49ef-b60a-d303e57b74ef
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:47:10.7-00:47:29.5
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      because I never thought about when things were really bad, if you're having problems with the airplane, that I was gonna mort and plant it into the ground. It was always, maybe it's an ego thing where you think, I can do this.
    text: |-
      David Fravor never thought, even when an aircraft was in serious trouble, that he would crash and die, instead always believing he could handle it.
  - id: 958dacaa-a5b9-49c1-bcc9-399d2211443f
    type: hearsay
    speaker:
      id: 7eaac853-d863-4210-af67-e165485c02e9
      name: Fridman, Lex
    location: 00:47:41.6-00:48:15.7
    refs:
      - id: ce66a533-662b-4693-8579-8d32f6b1c945
        name: Tyson, Mike
    quote: |-
      we just offline mentioned Mike Tyson... as he's walking up to the ring, he's like, he starts out basically in fear... but as he gets closer and closer to the ring, the confidence grows and grows until, the ego basically takes over to where you think there's no way anybody could defeat me.
    text: |-
      Mike Tyson described starting out in fear as he walked towards the boxing ring, with his confidence growing closer to the ring until ego took over and he believed no one could defeat him.
  - id: 73b4a032-2e8b-4795-bad3-62daf4ce54de
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:48:30.9-00:48:37.4
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      I wouldn't say I was never afraid. I think that would be, I couldn't tell you that anyone I know that wasn't afraid at one time.
    text: |-
      David Fravor was afraid at times during his flying career, and considers that everyone he knew was afraid at one time.
  - id: 37d74e02-03d2-41e0-b265-6c31598aca85
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:48:37.4-00:48:53.7
    refs:
      - id: 18749211-a21c-49c2-b63a-d52db3b911a2
        name: United States Navy
    quote: |-
      especially Navy carrier pilots, it's just, it's usually, especially when you're new and you gotta go out and it's nighttime and there's no moon and the weather sucks and the deck's moving.
    text: |-
      For Navy carrier pilots, the most frightening situation is a moonless night with bad weather and a moving deck on the carrier.
  - id: 6a8ef489-bab4-4444-a5ee-3557f0c79795
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:49:01.1-00:49:13.7
    quote: |-
      They did it during Vietnam. You know, guys would go fly missions... People were getting shot down a lot. The highest anxiety and heart rates were coming back to land on board an aircraft carrier.
    text: |-
      During Vietnam, pilots flying combat missions were wired up to measure physiological responses, and the highest anxiety and heart rates occurred when returning to land on an aircraft carrier rather than during combat.
  - id: 8994db1a-ac37-4082-919e-d6414ab0ead0
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:50:02.4-00:50:14.8
    quote: |-
      now take that and multiply it by like a million because you have no depth perception. What you think is fixed, the runway is actually moving. up and down and left to right
    text: |-
      Landing on a carrier at night is extremely difficult because there is no depth perception and the runway, the carrier deck, is itself moving up, down, left and right.
  - id: d05fa9bd-aa12-4f55-a2ed-9e23aeb0697d
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:51:18.1-00:50:30.8
    quote: |-
      we have two systems uh you know there was a there's an automatic system that's actually uh it stabilizes with the inertials on the ship And then there's the ILS.
    text: |-
      Carrier aircraft have two landing aid systems: an automatic system that stabilises using the ship's inertial sensors, and the Instrument Landing System (ILS).
  - id: e4edb708-e8ee-4757-9b3c-6f6e5699b90b
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:50:30.8-00:50:45.7
    quote: |-
      civilian pilots will tell you that ILS is a precision approach, which gives you azimuth and glide slope... On the carrier, it's not. It's really just a beam that goes out and it's considered a non-precision approach. It's not stabilized at all that.
    text: |-
      On an aircraft carrier the Instrument Landing System (ILS) is just a beam and is considered a non-precision approach that is not stabilised, unlike the civilian precision approach that gives azimuth and glide slope.
  - id: 879d7d04-9eb6-4f68-a7c5-411e4c29480a
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:50:56.7-00:51:08.1
    quote: |-
      the bow goes up and down in the tail like you normally see a ship. And then there's, so that's pitch. And then it has roll... And then it has heave. So the whole boat is going up and down while it's pitching and rolling.
    text: |-
      A ship moves in pitch (bow up and down), roll, and heave (the whole vessel moving up and down), all of which affect a carrier landing.
  - id: 1b92e28a-da26-4e1d-bd8f-3476ff880cd2
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:51:09.8-00:51:39.7
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c9e262ab-e817-4429-a91c-d526b8251825
        name: Sato, Chris
      - id: 844445fd-fb3d-4c6b-98e7-10c917264425
        name: USS Ranger
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      i remember landing as i was with chris uh sato and uh chris and i we were off the uss ranger which is now decommissioned it's sitting getting turned into razor blades um we're flying the old a6
    text: |-
      David Fravor and Chris Sato flew the A-6 Intruder together off the USS Ranger, which is now decommissioned and being scrapped.
  - id: 7a2fe8fc-70b9-4bb8-b8ee-06d93b9d3f7b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:51:09.8-00:51:39.7
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
      - id: 9b237ccd-cb7b-43c0-a9b9-bf7904343656
        name: USA, California, San Diego
    quote: |-
      it was off of san diego and it was just ugly night because san diego always has a marine layer that is about 1200 feet was lower than that that night and it was pouring down rain it was an el nino year and there's thunderstorms all around it was just craziest night i've ever seen out of san diego
    text: |-
      During a night landing off San Diego in an A-6 Intruder, the marine layer was below approximately 370 metres, it was an El Nino year, raining hard with thunderstorms all around, which David Fravor described as the worst night he had seen out of San Diego.
  - id: 648c3fdd-969a-4c2a-843c-321c0e94a874
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:51:39.7-00:51:48.0
    quote: |-
      and your adrenaline is so high that you're shaking i mean you literally can't stop
    text: |-
      After a difficult night carrier landing, adrenaline is so high that a pilot cannot stop shaking.
  - id: d53a7d5b-2df6-415a-ad15-c9405fb8a335
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:51:48.0-00:52:02.2
    quote: |-
      we had spun around out of the landing area and we parked we call it the six-pack so it's right in front of the island... we're sitting right in front of that and we're looking at the landing area so it's like you get front row seats to the concert
    text: |-
      The area on a carrier deck right in front of the island, where parked aircraft face the landing area, is called the six-pack.
  - id: f0bc9d3c-7a47-4104-8cbb-8ee22ed11904
    type: testimony
    attestation: first_hand
    speaker:
