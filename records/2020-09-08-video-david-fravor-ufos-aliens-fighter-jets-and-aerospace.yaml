      - id: adf13ae6-353e-4b31-a89d-124fddc2cdcb
        name: Navy Fighter Weapons School
      - id: 44b6a132-33cb-49fc-8884-d4217fcac22c
        name: Fravor Friend Unnamed Top Gun Training Officer
    quote: |-
      So Tom took me out and taught me how to fight because Tom had just left Top Gun. He was the training officer at Top Gun…The training officer's the main guy at Top Gun.
    text: |-
      David Fravor learned air combat maneuvering from a personal friend (referred to only as 'Tom'), who had served as the training officer at the Navy Fighter Weapons School (Top Gun) and was considered one of the best fighter pilots in the world.
  - id: 3e17b1bd-474e-4738-b6d9-53391453298f
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:38:32–02:38:46
    refs:
