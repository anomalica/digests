    quote: |-
      Mick has had several theories on other of some of the other videos, like one of them, the go fast as a bird and Jeremy Corbell actually did a nice job of saying, no, it's not because... he's on black hot. So the white object is actually colder than the ocean... birds aren't colder than the ocean. They'd be dead.
    text: |-
      David Fravor stated that Mick West proposed the object in the Go Fast video was a bird, but Jeremy Corbell countered this because the sensor was on 'black hot' mode, meaning the white object is actually colder than the ocean, and birds would not be colder than the ocean.
