    quote: |-
      I am 99.9%. So 0.1% my eyes deceive me. But remember, if it deceived me, it had to deceive the other four people. So the percentage is even lower.
    text: |-
      David Fravor states he is 99.9% certain his observation of the AAV was accurate, and that for all four witnesses to be wrong simultaneously reduces the probability even further.
  - id: adb1b936-0cb1-4032-9b53-c813b821dc7c
    type: testimony
    attestation: first_hand
    speaker:
