        name: AAV
      - id: a27aa19a-d6e1-4c3d-ae11-55ffe1eba627
        name: Tic Tac Sighting
    quote: |-
      I think it was a real object...if we were both sitting next to each other, we were looking at it from the exact same angle...with an 8000 foot altitude difference flying...you're getting two different perspectives from two different altitudes over a clear blue
    text: |-
      David Fravor stated that the AAV appeared to be a real physical hard object, not a light projection, noting that two observers at approximately 2,440 metres (8,000 feet) altitude difference were viewing it from different angles over a clear blue ocean.
  - id: b7dc8cb3-0963-49c4-94c0-2ece87d89215
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 02:35:31
    refs:
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      we call it drawing arrows. So you have to recreate that stuff...I know where the sun is at...So now I know as I'm fighting, because in the water you don't have any reference
    text: |-
      David Fravor described the pilot training exercise called 'drawing arrows', where an instructor must accurately reconstruct the sequence of manoeuvres from a dogfight from memory using sun position as a reference when out of sight of land.
  - id: bba0a405-a678-42ed-af3c-9b4014eeba05
    type: observation
    attestation: first_hand
    speaker:
