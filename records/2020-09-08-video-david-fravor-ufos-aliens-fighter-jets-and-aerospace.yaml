    quote: |-
      She's watching me. which is, it's perfect as the story goes on, because it gives us two perspectives, you know, a perspective that's about 8,000 feet above us when that thing disappears.
    text: |-
      David Fravor's wingman (the other pilot, a female officer) maintained high cover at approximately 6,000 metres (20,000 feet) while Fravor descended to intercept the AAV, giving her a 'God's eye view' of both aircraft and the object simultaneously.
