      we would take the airplanes up to 50,000 feet when we had to do full the maintenance check flights on them
    text: |-
      David Fravor flew Super Hornets to approximately 15,000 metres (50,000 feet) altitude during full-power maintenance check flights.
  - id: a3c93f9c-3195-4c86-8e82-2fb94f956230
