    quote: |-
      he goes through all those things, and that's when you see it going from a black background to a white background
    text: |-
      Chad Underwood cycled through all FLIR pod modes — wide, medium, narrow IR, narrow TV — to gather as much data on the AAV as possible; the transitions between modes cause the background to shift from black to white in the released video.
