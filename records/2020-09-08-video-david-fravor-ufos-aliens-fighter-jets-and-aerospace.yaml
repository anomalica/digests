        name: Water Disturbance Cross-Shape
      - name: Star Trek (TV show)
    quote: |-
      it was hanging around that whitewater, and I don't know, was there something there? Was there seamount…I joked on Good Morning America, maybe it's like talking to the whales, kind of like Star Trek
    text: |-
      During the Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16, the AAV was observed hovering over and near a patch of disturbed white water on the ocean surface; David Fravor speculated the AAV might have been 'communicating with something', joking on Good Morning America that it might be communicating with whales, as in Star Trek.
