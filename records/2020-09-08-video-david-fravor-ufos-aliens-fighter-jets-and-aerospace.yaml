        name: AAV
    quote: |-
      it's funny how people can extrapolate stuff who've never operated the system... that would be pretty stupid to me to try and tell lewis hamilton how to drive a car
    text: |-
      David Fravor criticized commentators who theorize about the Anomalous Aerial Vehicle (AAV) video footage without having operated the sensor systems involved, comparing it to telling Lewis Hamilton how to drive a Formula One car.
