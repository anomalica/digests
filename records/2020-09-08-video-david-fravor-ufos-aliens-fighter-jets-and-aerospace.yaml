        name: Wiedemeyer, Scott
    quote: |-
      i knew missy uh we were in actually went through together missy cummings uh we went through primary together... scott wiedemeyer uh the three of us so i went to kingsville scott went to beeville and missy went to meridian so the three of us that we had all went through we got we selected... we all ended up going jets.
    text: |-
      David Fravor flew through primary flight training at the same time as Missy Cummings and Scott Wiedemeyer; all three selected jets out of primary training together.
  - id: 0310d438-1dc2-4e3b-bc58-b8957abfbb4a
