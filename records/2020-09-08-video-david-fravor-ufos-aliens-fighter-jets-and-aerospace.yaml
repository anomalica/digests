    text: |-
      When Chad Underwood returned with the 2004 USS Nimitz FLIR1 video, David Fravor and others sat and watched it many times off the original tapes.
  - id: 843efda0-41b0-4904-b38b-3b3645ad334e
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
