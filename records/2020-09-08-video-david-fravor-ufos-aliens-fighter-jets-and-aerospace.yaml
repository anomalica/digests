    text: |-
      David Fravor does not believe the Tic Tac object from the 2004 USS Nimitz incident was an ice cloud, because ice clouds do not fly around and react to observers.
  - id: b1133dc9-a0a3-49fd-aec1-e19f83c5d4a0
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:08:47.4-02:09:09.5
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      Do I think it was a light? I'd say no ... You would see distortions, I think, as it moved.
    text: |-
      David Fravor does not believe the Tic Tac object from the 2004 USS Nimitz incident was a light or plasma, because plasma would produce visible distortions as it moved.
  - id: 656105d5-7792-475b-a731-6aa6a11992ec
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:09:16.3-02:09:43.5
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      I think it was a hard object. It was aware that we were there. It reacted exactly like if I was another airplane ... It wasn't aggressive. ... It just mirrored us.
    text: |-
      David Fravor believes the Tic Tac object from the 2004 USS Nimitz incident was a hard object that was aware of the aircraft and reacted exactly as another aircraft would, mirroring his movements without being aggressive or offensive.
  - id: 43edb616-f464-4d64-9a99-8bd7d97b2316
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:10:00.6-02:10:26.3
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      when i got too close to it you know it decided i'm out of here and then it it did something that we've never seen
    text: |-
      When David Fravor got too close to the Tic Tac object during the 2004 USS Nimitz incident, the object departed rapidly in a way he had never seen before.
  - id: 3f8a5f7d-86d2-4e32-b07c-b67d734d81f1
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:10:04.9-02:10:51.6
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      we have a camera in our helmet in the joint helmet there's a little camera but we never use it because it's nauseating to watch ... it's the one thing i didn't do is reach down and hit the switch
    text: |-
      David Fravor's aircraft helmet contained a small camera in the joint helmet that was never used because the head movement made the footage nauseating to watch, and his one regret from the 2004 USS Nimitz incident is not switching it on.
  - id: 08784673-e1a3-4faa-88b0-072a4e661474
    type: observation
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:10:26.3-02:10:57.1
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      we didn't go back and because our tapes didn't have anything because we didn't get it on radar ... because I tried to lock it up because I can move the radar with my head, but I couldn't, it wouldn't lock
    text: |-
      During the 2004 USS Nimitz incident, David Fravor's aircraft radar would not lock onto the Tic Tac object despite his attempt, and the tapes captured no data because the object was not captured on radar.
  - id: b33822a4-56a9-49a8-a5b6-5f9fe23ce258
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:11:31.1-02:12:01.0
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: faf33b9e-b2fe-4878-bc5b-204a79bb4c93
        name: gravity-based propulsion
    quote: |-
      let's assume that it didn't have a conventional propulsion system in it, because I don't think it did, I would like to think that if we had a technology that would advance mankind leaps and bounds ... then it would start coming out. But to hide something like that for 16 years
    text: |-
      David Fravor believes the Tic Tac object from the 2004 USS Nimitz incident did not have a conventional propulsion system, and reasons that if humans possessed such a leap in technology it would have started to emerge rather than stay hidden for 16 years.
  - id: 9952dd09-6026-4d0f-bd03-73da8b980a33
    type: observation
    attestation: second_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:12:17.2-02:12:33.4
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
    quote: |-
      these things were coming down when the cruiser tractor from above 80,000 feet, which is space. And they would come down and they would come straight down. They'd hang out at like 20,000 feet. And then three or four hours later, they'd go back up.
    text: |-
      During the 2004 USS Nimitz incident the objects were tracked descending from above approximately 24,000 metres altitude, which is space, coming straight down to hover at around 6,100 metres for three or four hours before ascending again.
  - id: 4c49582d-d8ac-4640-9911-c70c3c5f671b
    type: observation
    attestation: second_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:12:33.4-02:12:39.1
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      And I'm talking hold out in a spot. Well, we all know there's winds. They're not drifting like a balloon. They're just sitting there.
    text: |-
      During the 2004 USS Nimitz incident the objects held a fixed position rather than drifting with the winds like a balloon would.
  - id: 8bc5e160-6f0c-413a-9351-59ab7339fdea
    type: hearsay
    attestation: second_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:12:39.1-02:12:55.2
    date: '2004-11-14'
    refs:
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
    quote: |-
      When I talked to the controller, he's like, we've seen up to 10 of these things. ... they tracked a groups of these things coming down, hanging out and going up.
    text: |-
      A radar controller during the 2004 USS Nimitz incident reported tracking up to 10 of the objects descending, hovering, and ascending.
  - id: 290219db-c9e3-4197-b39d-6509f025c9e6
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:13:25.4-02:13:44.5
    refs:
      - id: ec339458-25c6-4335-85a1-ca339e46f8f8
        name: F-117 Nighthawk
      - id: de58d5ed-956d-4fd7-ac5e-3ff37e27fd64
        name: B-2 Spirit
    quote: |-
      a perfect example in modern times is the 117. because now a lot of the data on the 117 is out, like it was developed at this time. It flew for this long before it was actually acknowledged ... That's the stealth fighter, the original stealth fighter, not the B-2
    text: |-
      The F-117 Nighthawk stealth fighter is an example of a technology that was developed and flown for a period before being acknowledged by the United States government, and is distinct from the B-2 Spirit.
  - id: 0ad97ed3-4664-4651-9ed2-5ad5b54af922
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 02:14:02.6-02:14:48.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: faf33b9e-b2fe-4878-bc5b-204a79bb4c93
        name: gravity-based propulsion
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      there's usually indicators, there's papers of, hey, this is where we're going. I don't think there's a whole bunch of papers on developing a gravity-based propulsion system
    text: |-
      David Fravor argues that a genuine technological leap such as the Tic Tac would normally leave indicators in the form of research papers from top-tier universities, and he does not think there are papers on developing a gravity-based propulsion system.
  - id: b589b34a-e811-4566-b576-3dd106dab338
    type: opinion
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
