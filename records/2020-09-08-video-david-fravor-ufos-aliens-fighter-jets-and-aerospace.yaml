    quote: i was stationed up in whidbey island washington so you've got the cascades
    text: |-
      David Fravor was stationed at Whidbey Island, Washington, where A-6 crews flew low at night in the Cascade mountains.
  - id: cf36aa1a-42f6-45ce-89f9-04e0a7ec0580
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:31:13.5-00:31:49.6
    refs:
      - id: 8798ccee-e1ad-440d-a75a-e4554f5d6e6c
        name: F-111 Aardvark
      - id: f914c56a-658d-4c47-9bb7-8a450f3e989e
        name: B-1 Lancer
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      the 111 the b1 has a system like this but it'll the radar can see and it'll fly it basically flies a straight line so it goes up and over mountains and back down... where the a6 was really manual
    text: |-
      The F-111 Aardvark and the B-1 Lancer have terrain-following radar systems that automatically fly the aircraft over mountains in a straight line, whereas the A-6 Intruder's terrain following was manual.
  - id: 0585757c-74ad-48c3-9da8-cd7483f1ea9d
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:25:49.6-00:26:02.9
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      You're gonna be at 500 to 1,000 feet above the ground, ripping through fog layers, because you don't need to see outside. You're literally flying a little TV screen and a radar.
    text: |-
      On A-6 low-level routes at night in the mountains, the aircraft would fly at 150 to 300 metres above the ground through fog layers, flying on a small TV screen and radar rather than by sight.
  - id: d9e30cf4-d491-40a6-9f31-bc343d7a9cc4
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:26:25.0-00:26:34.0
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      the airplane had a flare ball it's a target recognition and multi-sensor it was called a tram... what it is is the the bombardier navigator had a radar And he was getting raw feed off of a pulse radar in front
    text: |-
      The A-6 Intruder had a flare ball target recognition and multi-sensor system called TRAM, but the terrain-mapping was based on a pulse radar feed used by the bombardier navigator.
  - id: 68668427-7cfe-4a70-b38c-5b104a5aae3c
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:27:13.3-00:27:49.3
    refs:
      - id: 91687522-b681-4c28-b7aa-c170efa860ab
        name: A-6 Intruder
    quote: |-
      he's looking out about 12 and a half miles in front of the airplane so he has the range really scoped down... what the pilot has is there's they're called range bins and there's eight of them
    text: |-
      In the A-6 Intruder, the bombardier navigator looked at his radar out to about 20 kilometres in front of the airplane in terrain mode, while the pilot had a CRT screen of about 10 to 15 centimetres showing eight range bins.
  - id: da759555-17b9-4ec5-98f4-a14f3bcec5ce
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
