    quote: |-
      in I think it was 62 when Eisenhower warned of the industrial defense complex, you know, which it has become everything he warned us of...the big three in defense, which is really, you know, Northrop, Lockheed, and Boeing
    text: |-
      David Fravor credited the remark by President Eisenhower warning about the military-industrial complex, describing it as having come true, and identified the dominant US defence contractors as Northrop, Lockheed, and Boeing, with Raytheon close behind.
