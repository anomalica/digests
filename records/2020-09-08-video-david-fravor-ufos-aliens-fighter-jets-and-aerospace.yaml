      After primary flight training, David Fravor went to Kingsville, Scott Wiedemeyer went to Beeville, and Missy Cummings went to Meridian.
  - id: 24d17c13-8d86-405b-b501-f7667c90fabe
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:20:10
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
    quote: |-
      i ended up getting a6s on the west coast which is a side-by-side bomber so it's a pilot on the left seat and the bombardier navigators on the right seat it was built in the 60s. It is all weather and it flies low at night and it's got a terrain mapping radar.
    text: |-
      David Fravor's first fleet aircraft was the A-6 Intruder, a side-by-side two-seat bomber built in the 1960s, assigned to the west coast, which could fly all-weather at low altitude at night using a terrain-mapping radar.
  - id: 42b99d31-fee2-4239-b4cc-5cad1d7cf65e
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:20:43
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
      - id: db6fda4d-25c6-46b6-a382-68e724388457
        name: F-111 (aircraft)
    quote: |-
      In the Navy, that was the only one. The Air Force, the F-111 was a side-by-side, but the Navy, it was the A-6.
    text: |-
      The A-6 Intruder was the only side-by-side two-seat aircraft in the Navy; the Air Force had the F-111 as a side-by-side aircraft.
  - id: 013f0499-38b0-48ac-9ac3-33dd91f62839
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:20:50
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: f6ff282b-ed75-4fe9-89f1-03d57f79de08
        name: EA-18G Growler (aircraft)
    quote: |-
      The E-A-6Bs just went away a few years ago, and now the E-18G Growler is the replacement for the E-A-6B.
    text: |-
      The EA-18G Growler replaced the EA-6B Prowler as the Navy's electronic attack aircraft.
  - id: b81e50b4-6527-43f9-bb06-6e2382a722bd
    type: testimony
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 00:21:01
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 4c88f475-5def-44ef-8ab0-187cfd2bdd58
        name: A-6 Intruder (aircraft)
    quote: |-
      There was never a replacement for the A-6 that I flew. It really became the F-18, which the A-6 could go quite a bit further distance-wise by fuel.
    text: |-
      There was never a direct replacement for the A-6 Intruder; its role was broadly assumed by the F/A-18 Hornet, though the A-6 had greater range.
  - id: d1df4ef6-e3e6-40f5-ae66-fe8e44d4cbed
