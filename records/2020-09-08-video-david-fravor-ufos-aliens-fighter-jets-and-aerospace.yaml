    quote: |-
      he says that it's possible that you miscalculated the size and the distance of the thing and so on when you were flying around
    text: |-
      Mick West has offered the explanation that David Fravor and the other Nimitz aircrew may have miscalculated the size and distance of the AAV during the 2004-11-14 intercept.
