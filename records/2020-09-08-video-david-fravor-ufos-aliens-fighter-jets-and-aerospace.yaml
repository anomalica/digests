        name: 2014-2015 US East Coast UAP encounters
    quote: |-
      Usually if it's out there and it sees it, it's real. So at first they thought they were ghost tracks when they started seeing stuff, and then they actually threw one of the targeting pods out there. Well, the targeting pod, if there's a heat signature... something's there. It's real.
    text: |-
      With the AN/APG-79 radar, if an object is detected it is generally real; pilots initially thought they were seeing ghost tracks when objects started appearing, then directed a targeting pod which confirmed a heat signature was present.
  - id: 2b7f1f7d-b568-43de-bcdf-0d7b5b24f011
