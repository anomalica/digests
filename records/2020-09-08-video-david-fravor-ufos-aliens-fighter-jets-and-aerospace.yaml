      for an airplane, if you just put me from a standstill…at 100 knots above the water…you can't just start a climb i'd have to lower the nose i'd have to accelerate and then i'd have to start coming up and this thing just like just did it like it was like no big deal
    text: |-
      During the Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16, the AAV appeared to accelerate rapidly from near-stationary flight and climb without needing to lower its nose to gain speed, behaviour David Fravor contrasted with the requirements for a conventional aircraft.
