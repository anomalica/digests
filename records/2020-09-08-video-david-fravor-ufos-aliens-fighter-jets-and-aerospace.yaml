        name: FLIR1 Video
    quote: |-
      The way to explain that is the tracking system, like we said, it's vision-based tracking, simply loses the object. The tracking loses it. And so it simply allows the object to float off screen because it's no longer tracking it.
    text: |-
      Mick West's explanation for the rapid left-movement of the object at the end of the FLIR1 video is that the vision-based tracking system simply lost the object, allowing it to drift off screen.
