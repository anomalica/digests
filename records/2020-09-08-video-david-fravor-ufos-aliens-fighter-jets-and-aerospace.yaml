      when I'm flying the airplane, even as I'm looking at the Tic Tac, I've got a heads up display that tells me what my airplane's doing
    text: |-
      David Fravor stated that during the Tic Tac Sighting he was able to cross-check his visual observations against his heads-up display to confirm what his aircraft was doing.
  - id: 4fb58942-4d77-4dfa-86d1-56f8005b94fd
    type: opinion
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
      name: Fravor, David
    location: 02:39:36
    date: '2004-11-14'
    refs:
