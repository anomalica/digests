      - id: 0f04d1d3-1b90-4e39-af45-5852e313dffa
        name: F/A-18F Super Hornet
    quote: |-
      what he's looking at on his displays is he has basically two radar displays up. He has azimuth and range on the right one, and he has azimuth and elevation on the left one. So this is called the AZL display, and this is basically the PPI, which is you're at the bottom of it.
    text: |-
      In the F/A-18F Super Hornet, the pilot has two radar displays: an azimuth-and-range display on the right and an azimuth-and-elevation (AZL) display on the left, the latter being a plan position indicator (PPI) with the aircraft positioned at the bottom of the square.
  - id: 9e3dae67-e0b0-4f80-92b1-4b1961c00930
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
