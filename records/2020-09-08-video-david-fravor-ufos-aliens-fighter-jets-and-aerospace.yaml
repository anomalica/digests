        name: Massachusetts Institute of Technology (MIT)
    quote: |-
      my first fleet bombardier navigator who... his name's Chris Sato. He's, works at Apple, pretty high up, MIT grad. I think computer engineering, he's scary smart.
    text: |-
      David Fravor's first fleet bombardier navigator was Chris Sato, an MIT graduate in computer engineering who works in a senior position at Apple.
  - id: 900682c9-3432-4e0d-8033-54050c38dd30
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
