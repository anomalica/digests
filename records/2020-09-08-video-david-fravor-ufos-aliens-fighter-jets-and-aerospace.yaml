        name: Fridman, Lex
    quote: |-
      I'm a scientist first and foremost, but an open-minded one... I'm often disheartened by the closed-mindedness of the scientific community. And in equal part, I'm disheartened by the lack of rigor and basic scientific inquiry and study on the part of the conspiracy theorists.
    text: |-
      Lex Fridman describes himself as a scientist who is disheartened by closed-mindedness in the scientific community regarding UFOs and UAPs, and equally disheartened by the lack of scientific rigor in conspiracy theorist circles.
