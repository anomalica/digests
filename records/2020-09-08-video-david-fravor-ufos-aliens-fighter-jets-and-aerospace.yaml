        name: Water Disturbance
    quote: |-
      I joked on Good Morning America, maybe it's like talking to the whales, kind of like Star Trek, you know?
    text: |-
      David Fravor speculated on Good Morning America that the AAV near the water disturbance may have been communicating with whales, making a Star Trek reference.
  - id: b798b094-c482-4c5f-ab79-9a21a451be86
    type: observation
    attestation: first_hand
    speaker:
