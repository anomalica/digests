        name: Fravor, David
      - id: c661e205-9d5f-4c0b-bafc-450bbbd07288
        name: Armstrong, Neil
      - id: 46c8d007-ef16-4e61-8db5-95823dd41ceb
        name: USA, Ohio, Wapakoneta
      - id: 864c1cbc-a9cb-41e7-821e-c8b6ca1da90f
        name: Apollo 11 Moon landing
    quote: |-
      Neil Armstrong's an Ohio boy, and so am I. ... I have a picture of him in a car in Wapakoneta, Ohio at the parade after he walked on the moon, because his parents didn't live far from my aunt and uncle in Wapakoneta
    text: |-
      David Fravor is from Ohio, as is Neil Armstrong, and Fravor has a photograph of Neil Armstrong in a car at the parade in Wapakoneta, Ohio after he walked on the Moon, near where Fravor's aunt and uncle lived.
  - id: 752c9764-85bf-486e-877c-4cef0c82264f
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
