    quote: |-
      I don't think it was a projection. ... I think it was a real object. ... I think all four of us will tell you the same thing.
    text: |-
      David Fravor and the other three witnesses to the 2004 USS Nimitz incident believe the Tic Tac was a real, physical, hard object rather than a light projection.
