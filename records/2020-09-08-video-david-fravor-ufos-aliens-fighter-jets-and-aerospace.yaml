    location: 00:55:13.3-00:55:40.9
    quote: |-
      once you get through your o5 command your flying really starts to tag to come down you know even if you go and you're an air wing commander which is we call them CAG carrier group commander um you're not flying as much as like the normal pilots nor should you be
    text: |-
      Once a Navy pilot completes O-5 command, their flying time begins to decline, and an air wing commander (Carrier Air Group, CAG) flies less than normal pilots to make room for training the next generation.
  - id: fa0830f7-454e-4d7c-8b4d-45edc11c3070
