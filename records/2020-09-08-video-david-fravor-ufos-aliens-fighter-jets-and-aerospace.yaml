    text: |-
      As David Fravor descended towards the Tic Tac object during the 2004 USS Nimitz incident, the object reoriented its longitudinal axis and began mirroring his aircraft as it climbed, rising from below up to approximately 3,700 metres while he was at approximately 6,100 metres.
