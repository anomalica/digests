        name: USS Princeton
    quote: |-
      So on November 10th, 2004, the USS Princeton... they started noticing on November 10th that there is a few objects flying around at 28,000 feet with speed of what I guess is considered a low speed of 120 miles an hour... but on the coast of California.
    text: |-
      The 2004 USS Nimitz encounter began on 2004-11-10 when the USS Princeton detected objects flying at roughly 8,500 metres at what was considered a low speed of about 190 kilometres per hour off the coast of California.
  - id: 2c63ef1a-2637-4350-adf2-71e81c2d8635
    type: testimony
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:11:52.8-01:12:02.9
    refs:
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
    quote: |-
      That's a cruiser... No, helicopter. It has a helicopter pad on the back... It shoots the missiles up.
    text: |-
      The USS Princeton is a cruiser with a helicopter pad on the back rather than a runway, and carries weapons that launch missiles.
  - id: 49f4bcf8-b8e8-45e5-a243-a74129e7b4d7
    type: testimony
    speaker:
