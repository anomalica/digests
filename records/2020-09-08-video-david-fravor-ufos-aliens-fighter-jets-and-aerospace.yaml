    quote: |-
      our main mode of transportation and what people figured out years ago was the internal combustion engine, which led us to jet engines and solid rocket fuel. What if you're in another planet where you figured out the ability to create a gravity field
    text: |-
      David Fravor opined that humans' primary mode of transportation development has been the internal combustion engine leading to jet engines and solid rocket fuel, but civilisations on other planets might have developed gravity field propulsion or electromagnetic propulsion instead.
