        name: SpaceX Falcon 1 Development
    quote: |-
      I know one of the guys that was, he was one of the original employees at SpaceX...he actually worked on the entire Falcon 1 project. He's one of the lead guys on that...There's a book coming out that comes out in about a year on this, the original, the first years of space, first six years of SpaceX. And he's named in the book. And they're supposed to make a movie on it.
    text: |-
      David Fravor stated he has a friend who was one of the original employees at SpaceX and worked as a lead engineer on the Falcon 1 project, and that this friend is named in an upcoming book on SpaceX's first six years with a film adaptation planned.
