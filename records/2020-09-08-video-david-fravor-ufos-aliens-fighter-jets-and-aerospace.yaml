        name: Tic Tac Sighting
      - id: 790f632f-de89-407e-8c58-3983d09ef2c2
        name: |-
          Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16
    quote: |-
      It was aware that we were there. It reacted exactly like if I was another airplane and I had to come up and do something, exactly what I would do.
    text: |-
      David Fravor opines that the AAV was aware of the aircrew's presence and deliberately interacted with them, reacting exactly as another fighter pilot would in an air combat maneuver.
  - id: 2841454e-c537-44ad-be8d-034082cbb6a7
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:11:18–02:14:48
    refs:
      - id: 610d9195-3342-4949-b118-f43bcfb1a17d
        name: Fravor, David
      - id: 8a01b2d8-98b8-4499-b9d0-dc9072555bb8
        name: Tic Tac Sighting
      - id: 0c2efa1f-a689-414c-aedf-876dcd0fc845
        name: MIT
      - id: 7e09f45c-0c7f-4372-bb8f-91a1091f2057
        name: Naval Postgraduate School
      - name: Carnegie Mellon
    quote: |-
      I don't think we've developed it…this is not a, hey, we developed this and we're kind of pushing the edge of technology. this is a giant leap in technology…usually when you have a technology like that, universities…a lot of the leading edge stuff is coming out of the top tier universities
    text: |-
      David Fravor opines that the AAV was not US-developed technology, reasoning that a technology advance of that magnitude would represent a 'giant leap' and would typically be preceded by detectable academic research indicators at leading universities.
  - id: 0a06f194-5184-4417-89c2-1dafac331161
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:13:26–02:13:44
    refs:
