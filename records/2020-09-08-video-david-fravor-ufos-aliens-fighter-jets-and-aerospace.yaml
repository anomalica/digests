    quote: |-
      we ended up in the clouds. Keep in mind, we're between 500 and a thousand feet in the mountains and we're in the clouds. Like you can't see anything. And I had to turn off our red lights that flash, you know, they're called the anti-collision lights because it was reflecting off the clouds.
    text: |-
      David Fravor recounts a night flight near Mount St. Helens in an A-6 Intruder, flying in clouds at 150 to 300 metres (500 to 1,000 feet) and having to turn off anti-collision lights because they reflected off the clouds.
