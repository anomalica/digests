        name: United States Navy
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      all the COs, and several of them are still in the Navy. There's one that is a, I think he just finished up, he was a captain of an aircraft carrier... he'll end up making admiral and all that stuff. Those guys are all my friends, I talk to them daily.
    text: |-
      The commanding officers who were Fravor's contemporaries during the 2004 USS Nimitz UFO incident remain his friends, with several still in the Navy, one having recently served as captain of an aircraft carrier and on track to make admiral.
  - id: b6173e1d-34b3-469b-90f0-d82775bb2f2b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:39:46.8-01:42:08.4
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: 990ca8a5-667b-409c-8446-a0f11e50d6e0
        name: USS Nimitz
      - id: 887ea28f-5245-48ca-ac48-02e6384ef07c
        name: USS Princeton
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      there's a story that both on the Nimitz and the Princeton, folks in a helicopter landed, they showed up, they took the data, quote unquote... and they took it and presumably deleted it... So I'm very protective... No one came out.
    text: |-
      Contrary to a widely told story that people in a helicopter landed on the Nimitz and the Princeton and confiscated and deleted the recordings of the 2004 incident, no such collection of data by outsiders occurred.
  - id: 0ec720c7-731c-422b-91ac-8b36be6d20e6
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:40:33.0-01:41:01.3
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c9b367fb-bfd1-465d-a505-5a3f549bcde4
        name: Underwood, Chad
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      they were chad's tapes so we use those tapes over and over again... i have a budget as a squadron... the tapes are actually classified secret because of the data that's on them
    text: |-
      The recording tapes from the 2004 USS Nimitz UFO incident were Chad Underwood's reusable consumable tapes, purchased from the squadron budget for which Fravor as commanding officer was accountable, and were classified secret because of the data on them.
  - id: 772858b4-fc40-4046-bc69-ca1db81c560b
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:40:30.1-01:41:20.7
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      the intel officers came down from what's called civic cvic which is carrier intel center came down and said, hey, we need the tapes. These guys are gonna come, they're gonna come and get them... someone came to me and said, you know, they're messing with you, they're playing a joke.
    text: |-
      After the 2004 USS Nimitz UFO incident, intelligence officers from the Carrier Intelligence Center (CVIC) came down and took the recording tapes, then someone told Fravor that the intelligence personnel were playing a joke on him by claiming outsiders would come collect them.
  - id: cbc32e94-90ce-4ffa-944e-de562a6785b6
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:41:25.6-01:42:05.1
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      I went down to Civic. And it was a, I think he was a Lieutenant or a Lieutenant JG... I said, hey, I want my tapes back... you have about 30 seconds to get me my tapes before I start tearing this place apart... he literally walked right over to a filing cabinet opened it up they weren't a safe he opened up a filing cabinet and pulled him out and handed him to me
    text: |-
      David Fravor confronted a junior lieutenant in the Carrier Intelligence Center and demanded his tapes back, after which the officer retrieved them from an ordinary filing cabinet (not a safe) and returned them to him.
  - id: 0db3b06a-450a-4f44-9601-af8befc1331e
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:42:11.3-01:42:19.5
    date: '2004'
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: c61fa24a-98d4-479d-befd-7c34beac0396
        name: 2004 USS Nimitz UFO incident
    quote: |-
      I took the tapes back and then I copied the tapes. So I took two brand new eight mil tapes and I copied the sections that I want.
    text: |-
      After retrieving the original tapes from the 2004 USS Nimitz UFO incident, David Fravor copied the relevant sections onto two new 8-millimetre tapes.
  - id: 8b2fc535-4514-449e-b216-c77525b5d55a
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:42:19.5-01:42:31.9
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      there's a rumor too that, oh, the original FLIR video is 10 minutes long... The original video is about a minute, 30 seconds long. What you see on the release video is the entire video.
    text: |-
      Contrary to a rumour that the original FLIR Tic Tac video was 10 minutes long, the original video is about a minute and 30 seconds long, and the publicly released video is the entire video.
  - id: 3b9fcf41-656d-4cfa-b189-68e24133dcae
    type: opinion
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:43:01.6-01:43:40.7
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      the stuff that was on Strangeland and YouTube, you know, someone pulled off of a secret, it looks like a rack... it gets converted to digital and stored on a hard drive and they pulled it off that hard drive and they put it on youtube... the more you copy digital media there's some quality that gets it degrades
    text: |-
      The government-released FLIR1 video appears to have been pulled from a secret equipment rack with tape machines, converted to digital and stored on a hard drive, and each copy of digital media degrades quality, so the released version has unknown copy degradation.
  - id: 0e6274d2-8aee-4253-9cfc-c60945fa6303
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 01:43:30.0-01:43:44.0
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
      - id: f9faa1f2-2455-45a6-a488-24235849cdc4
        name: FLIR1 (Nimitz Tic Tac UAP video, recorded by Chad Underwood)
    quote: |-
      the videos i've seen are right off the original they're high eight tapes that's basically pulled off the back of the display so it's not filmed with cameras it's literally a digital feed that's pulled off the back and put onto a high eight tape... Now it's actually digital to digital. It's not even on tapes anymore.
    text: |-
      The original FLIR1 video Fravor viewed was on Hi8 tapes pulled directly off the back of the cockpit display as a digital feed, not filmed with cameras, and the recording systems later moved to fully digital-to-digital recording.
  - id: 2b7c4db4-dba6-44cc-bc0f-cd82e923108e
    type: testimony
    attestation: first_hand
