        name: USS Princeton
    quote: |-
      these things were coming down when the cruiser tractor from above 80,000 feet, which is space. And they would come down and they would come straight down. They'd hang out at like 20,000 feet. And then three or four hours later, they'd go back up.
    text: |-
      David Fravor described AAVs being tracked coming down from above approximately 24,000 metres (80,000 feet), hovering at approximately 6,100 metres (20,000 feet) for three or four hours, and then returning upward — behaviour reported to him by a radar controller.
