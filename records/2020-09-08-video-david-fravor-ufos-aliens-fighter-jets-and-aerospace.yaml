    location: 00:36:02
    refs:
      - id: c183923f-2ffd-49b2-9ab6-b0df59e5fc5c
        name: Joint Helmet Mounted Cueing System (JHMCS)
      - id: 2055bcd3-0fef-4009-87db-8920e3d6f646
        name: F-18F Super Hornet (aircraft)
      - id: 7f206bdb-dbc7-440e-a505-55853020af3f
        name: Fravor, David
    quote: |-
      you've got a joint helmet mounted queuing system on that basically maps the magnetic field in the cockpit so it can tell where your head's at looking. So if I turn my head to the right, the radar will actually look to the right.
    text: |-
      The joint helmet mounted cueing system (JHMCS) maps the magnetic field in the cockpit to determine pilot head direction; turning the pilot's head causes the radar and targeting pod to slew to the same direction.
  - id: 6ad7c17e-bf08-4e5c-8c36-b10e98c88af2
    type: testimony
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
