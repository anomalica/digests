    quote: |-
      16 years flying against other airplanes, know what stuff looks like…I would argue the fact of, you know, pure experience there's, you know, professional observers, which is what we're actually trained to do
    text: |-
      David Fravor disputes Mick West's size-distance miscalculation hypothesis, stating that his estimate is grounded in 16 years of experience judging aircraft dimensions from the air, and that all four witnesses returned with the same assessment.
