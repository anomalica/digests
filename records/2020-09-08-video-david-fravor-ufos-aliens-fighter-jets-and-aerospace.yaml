      everyone came back with the same thing. They're like, yeah, it was about the size of a hornet.
    text: |-
      All four aircrew who observed the AAV independently returned with the same assessment of its size as being approximately that of an F/A-18 Hornet (approximately 40 feet / 12 metres).
  - id: 135ea203-34c4-42cc-82fd-d8ddff234645
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:05:32–02:05:54
    refs:
