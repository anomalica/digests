        name: Fravor, David
      - id: 300bf530-8c41-4c79-9424-0fe401487dc1
        name: Unidentified Flying Object (UFO)
    quote: |-
      you happen to be one of, at least in my view, one of the most credible witnesses in history of somebody who's witnessed a UFO, literally, an identified flying object. and not only witnessed, but got to, how do you put it, like chase it essentially?
    text: |-
      Lex Fridman considers David Fravor one of the most credible witnesses in history to have witnessed and chased a UFO.
  - id: 0717716f-418b-415d-aa09-dfd88f513b09
    type: testimony
    attestation: first_hand
    speaker:
