        name: Carrier Landing Night Operations
    quote: |-
      your eyes assume that the runway and your brain assumes that the runway is fixed but you know that the runway is moving so if i try and do stuff visually i would you die every time well not every time but you die close to every time trying to land on a boat
    text: |-
      During carrier landing night operations, pilot visual cues are unreliable; pilots must counterintuitively trust their instruments rather than what their eyes and brain suggest, because attempting to land on a carrier ship using only visual cues would be nearly always fatal.
