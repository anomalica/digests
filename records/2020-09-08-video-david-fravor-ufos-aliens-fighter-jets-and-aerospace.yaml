      he was out of the box. He did not think the norm. That's true genius. Had he not thought out of the box and came up with some of his theories, where would we be?
    text: |-
      David Fravor stated that Einstein's out-of-the-box thinking exemplifies the kind of original thought needed to make advances in propulsion physics.
