          Nimitz Carrier Strike Group Anomalous Aerial Vehicle (AAV) Detection Matter, 2004-11-10 to 2004-11-16
    quote: |-
      I think it was a real object…Oh yeah…I think all four of us will tell you the same thing…this was not…a light projection
    text: |-
      David Fravor opines that the AAV was a hard physical object, not a light projection or plasma phenomenon, based on what all four witnesses observed from different angles and altitudes.
  - id: d9b1a0a7-5688-4b95-91fd-edd2d21bd27a
    type: opinion
    attestation: first_hand
    speaker:
      id: 610d9195-3342-4949-b118-f43bcfb1a17d
      name: Fravor, David
    location: 02:09:26–02:09:36
    refs:
