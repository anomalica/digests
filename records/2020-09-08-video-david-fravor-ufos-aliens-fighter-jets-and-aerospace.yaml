        name: Apple Inc.
      - id: dc0eb148-6f49-4456-b2b2-8e49f6b3fab9
        name: SAP SE
    quote: |-
      there's another guy, Matt, who also worked at Apple, who's now at SAP. We did our first night traps together.
    text: |-
      Another A-6 crew member David Fravor flew with, Matt, also worked at Apple and is now at SAP; they did their first night carrier landings together.
  - id: 40709c2c-9417-40e9-a85e-dd2b1d90d197
    type: testimony
    attestation: first_hand
    speaker:
      id: 34e655e7-a5ac-4463-b973-08c3178c3952
      name: Fravor, David
    location: 00:29:48.6-00:29:55.3
    refs:
      - id: 34e655e7-a5ac-4463-b973-08c3178c3952
        name: Fravor, David
