        name: Fravor, David
    quote: |-
      That's where we hold. So it's called a combat air patrol point... we're going to sit on one goal line he's going to sit on the other goal line and when they say go we're going to run at each other and try and do something in the middle of the field and then go back to our set reset points
    text: |-
      A combat air patrol (CAP) point is a position where aircraft hold; in training the two sides hold at opposite ends like goal lines on a football field and run at each other on command to engage in the middle before resetting.
