      - id: 71deba35-2336-4f96-9c94-878a7476f886
        name: AAV
      - id: a27aa19a-d6e1-4c3d-ae11-55ffe1eba627
        name: Tic Tac Sighting
    quote: |-
      can climb from the surface up and then accelerate like it did, like it was like no big deal...if you just put me from a standstill, let's just say slow flight, just get me at 100 knots...you can't just start a climb i'd have to lower the nose i'd have to accelerate and then i'd have to start coming up and this thing just like just did it like it was like no big deal
    text: |-
      David Fravor stated that the AAV accelerated from a low speed or near-standstill into a climb without needing to lower its nose or accelerate first, unlike a conventional aircraft.
  - id: 2f3bd286-ce8a-4b09-af2e-56bde23f9421
    type: observation
    attestation: first_hand
    speaker:
      id: 7f206bdb-dbc7-440e-a505-55853020af3f
