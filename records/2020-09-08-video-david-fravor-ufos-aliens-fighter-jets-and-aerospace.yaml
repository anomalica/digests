        name: 2004 USS Nimitz UFO incident
      - id: faf33b9e-b2fe-4878-bc5b-204a79bb4c93
        name: gravity-based propulsion
    quote: |-
      if I've got a technology that can go up there really quick ... it can go down ... it can actually take Martian soil and then bring it back so we can analyze it here. That's a game changer.
    text: |-
      David Fravor argues that a propulsion technology like the Tic Tac, combined with automation and computing power, could enable uncrewed craft to descend to the Martian surface, take soil samples, and return them to Earth, which currently is not possible.
  - id: ce9f5841-b6b3-42dc-8009-7da0a075fc9a
