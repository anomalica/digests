        name: Massachusetts Institute of Technology (MIT)
    quote: |-
      there's a huge chunk of those brilliant minds that are not american citizens so if you want to get into government stuff and you are not an american citizen it gets really really really hard
    text: |-
      David Fravor notes that a large proportion of brilliant minds at American universities such as MIT are not American citizens, which makes it very difficult for them to work on classified government projects.
  - id: 9a97088e-24cb-4807-a42c-2a248f0c5336
    type: opinion
