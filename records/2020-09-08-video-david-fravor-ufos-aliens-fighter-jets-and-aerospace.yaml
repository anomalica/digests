        name: USA, California, San Diego
    quote: |-
      this ea6b comes in know ugly pass he ends up catching a one wire which is the first one you never want to catch the first one which means you were not really high above the back of the ship when you landed
    text: |-
      During the storm off San Diego, an EA-6B Prowler caught the one wire, the first arresting wire, which a pilot never wants to catch because it means passing low over the back of the ship.
  - id: eeca4368-a398-44bf-b3d0-3bd129e84506
    type: testimony
    attestation: first_hand
    speaker:
