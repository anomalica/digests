    quote: |-
      we call it the rag it's the replacement air group it's where so the the super hornet training squadron there's two of them there's one on the east coast 106 and there's one on the west coast which is vfa 122. 122 is the first one
    text: |-
      The Super Hornet training squadrons are the Replacement Air Group, with VFA-106 on the east coast and VFA-122 on the west coast, the latter being the first one.
  - id: 274cf96b-7642-4f5d-a688-6f9d63316b32
