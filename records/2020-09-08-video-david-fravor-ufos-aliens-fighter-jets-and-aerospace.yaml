        name: General relativity
    quote: |-
      Einstein's the perfect example. I mean, when he started coming up with some of his theories, some of the top physicists in the world were like, dude, you're a nut job. And he's literally proving them, but he didn't have, he proved them in theory. but he didn't have the means to actually do the experiment to prove his theory.
    text: |-
      When Albert Einstein began proposing some of his theories, some of the top physicists in the world dismissed him, and although he proved them in theory he lacked the means to perform the experiments to prove them.
