    location: char:2591-2868
    refs:
      - id: 15f79cad-e99c-4db2-91e2-933b5588f120
        name: Alan Bean
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      Roger. When you look out the AOT in the dark quadrant? You can see these lights - particles of light, flashes of light just seem to come from - in this case, I'm looking in quadrant 1 which is the left one. It's coming from behind me, the left, and they're just sailing off in space.
    text: |-
      During the Apollo 12 Air-to-Ground Voice Transcription, Alan Bean, looking out the Alignment Optical Telescope (AOT) in the dark quadrant of Intrepid, observed particles of light and flashes of light appearing to come from behind him in quadrant 1 and sailing off into space.
  - id: 5995804b-121c-4691-bf22-c396d9429f3c
    type: opinion
    attestation: first_hand
    speaker:
      id: 15f79cad-e99c-4db2-91e2-933b5588f120
      name: Alan Bean
    provenance_chain:
      origin_kind: speaker
      origin: Alan Bean
    attribution_in_text: false
    location: char:2875-3046
    refs:
      - id: 15f79cad-e99c-4db2-91e2-933b5588f120
        name: Alan Bean
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      I was thinking they're dropping from my water boiler, but it looks like some of those things are escaping the Moon. They really haul out of here and just press off at the stars.
    text: |-
      Alan Bean initially thought the light particles seen from Intrepid were dropping from his water boiler, but considered it possible some of them were escaping the Moon.
  - id: 69e6feed-49ec-4b1f-8b24-148d0c0712cd
    type: administrative
    provenance_chain:
      origin_kind: unattributed
      origin: Mission Control communication
    attribution_in_text: false
    location: char:1466-1514
    refs:
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
      - id: 663c59e3-0b99-4577-b723-d5d1337aa119
        name: Apollo 12
    quote: Intrepid, Houston. Your lift-off time is 142:03:47.
    text: |-
      During the Apollo 12 Air-to-Ground Voice Transcription, Mission Control gave Intrepid a lift-off time of ground elapsed time (GET) 142 hours, 3 minutes and 47 seconds.
  - id: 8dda085d-6857-4b2c-a036-c09447f1d28a
    type: observation
    attestation: first_hand
    speaker:
      id: 15f79cad-e99c-4db2-91e2-933b5588f120
      name: Alan Bean
    provenance_chain:
      origin_kind: speaker
      origin: Alan Bean
    attribution_in_text: false
    location: char:3711-4012
    refs:
      - id: 15f79cad-e99c-4db2-91e2-933b5588f120
        name: Alan Bean
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      Got sort of an interesting thing going on AGS right now. I didn't notice earlier, but it may just be because the lights are brighter now. I'm getting an all 8's flash on both the address and the information registers at about one-fifth the brilliance of the normal numbers. And a - It's pulsing every second.
    text: |-
      Alan Bean observed an interesting phenomenon on the Abort Guidance System (AGS) aboard Intrepid: an all-8's flash on both the address and information registers at about one-fifth the brilliance of the normal numbers, pulsing every second.
  - id: 9e980e60-4b03-4d55-a472-6f78c78165cc
    type: observation
    attestation: first_hand
    speaker:
      id: 15f79cad-e99c-4db2-91e2-933b5588f120
      name: Alan Bean
    provenance_chain:
      origin_kind: speaker
      origin: Alan Bean
    attribution_in_text: false
    location: char:4081-4147
    refs:
      - id: 15f79cad-e99c-4db2-91e2-933b5588f120
        name: Alan Bean
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: If I turn down the illumination level just a little bit, it's not noticeable.
    text: |-
      Alan Bean found that turning down the illumination level slightly made the AGS all-8's flash phenomenon on Intrepid not noticeable.
  - id: f6d7c320-dbe1-4533-880c-0aab32a75076
    type: observation
    provenance_chain:
      origin_kind: unattributed
      origin: Mission Control Capcom
    attribution_in_text: false
    location: char:4432-4590
    refs:
      - id: 216fc4ff-02d4-4c00-871b-5b2541b2f690
        name: USA, New York, Bethpage
    quote: |-
      Roger, Al. Fredo is here. He and I have both seen that phenomena on your DEDA during testing of most all the spacecrafts up at Bethpage, and it's probably an EMI.
    text: |-
      Mission Control (a Capsule Communicator identified in the transcript as "Fredo") reported that he and the Capcom speaking had both seen the same Data Entry and Display Assembly (DEDA) flashing phenomenon during ground testing of most Apollo spacecraft at Bethpage, New York, and considered it probably caused by electromagnetic interference (EMI).
  - id: 2b4ca115-acb5-412d-bbdb-2dff43b0d6c2
    type: administrative
    provenance_chain:
      origin_kind: unattributed
      origin: Mission Control Capcom
    attribution_in_text: false
    location: char:4821-4878
    refs:
      - id: 75748cac-be9a-4dd5-bf52-40e41da1bab0
        name: TRW Inc.
    quote: 'Roger. I think TRW''s got a {{illegible: workup}} on this problem.'
    text: |-
      During the Apollo 12 Air-to-Ground Voice Transcription, Mission Control said that TRW Inc. had a workup on the Data Entry and Display Assembly (DEDA) flashing phenomenon problem.
  - id: 94dfd3da-ce31-4796-a462-383b80bb5849
    type: observation
    attestation: first_hand
    speaker:
      id: ea943180-20a7-469d-8fd5-fe4cdc274849
      name: Richard Gordon
    provenance_chain:
      origin_kind: speaker
      origin: Richard Gordon
    attribution_in_text: false
    location: char:5177-5275
    refs:
      - id: ea943180-20a7-469d-8fd5-fe4cdc274849
        name: Richard Gordon
      - id: 332ca538-f67c-4109-8ea0-17b1b7a16782
        name: Yankee Clipper
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      But I don't have you in the sextant. That's okay. Your blinking light's just not blinking, that's all.
    text: |-
      During a rendezvous procedure, Richard Gordon aboard Yankee Clipper was unable to find Intrepid's tracking light in his sextant because the tracking light appeared to have burned out.
  - id: ebdffb06-fab2-4a7a-9fe4-4be6133b89e1
    type: observation
    attestation: first_hand
    speaker:
      id: 41bd9dd4-c0c3-4305-8736-e13b4f374589
      name: Charles "Pete" Conrad
    provenance_chain:
      origin_kind: speaker
      origin: Charles "Pete" Conrad
    attribution_in_text: false
    location: char:5307-5701
    refs:
      - id: 41bd9dd4-c0c3-4305-8736-e13b4f374589
        name: Charles "Pete" Conrad
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      Hey, Houston. It looks like our tracking light's burned out. Dick hasn't been able to find us in his sextant. And on the first nightside pass we had little bits and pieces floating along with us and we could tell that the tracking light was flashing on them. And we still have, I've presumed to think, bits and pieces floating along and nothing's flashing on them, so I'm pretty sure it burned out.
    text: |-
      Charles "Pete" Conrad, aboard Intrepid, reported that on the first nightside pass small bits and pieces of debris floated along with the spacecraft and the tracking light had been seen flashing on them, but that during a subsequent pass the tracking light was no longer flashing on similar floating debris, leading him to conclude the tracking light had burned out.
  - id: b47ec999-4a0c-4688-9ba0-22c0d8378d5c
    type: administrative
    attestation: second_hand
    speaker:
      id: 41bd9dd4-c0c3-4305-8736-e13b4f374589
      name: Charles "Pete" Conrad
    provenance_chain:
