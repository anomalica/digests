      origin: Richard Gordon
      relay:
        - relayed by Charles "Pete" Conrad
    attribution_in_text: false
    location: char:6017-6172
    refs:
      - id: ea943180-20a7-469d-8fd5-fe4cdc274849
        name: Richard Gordon
      - id: 332ca538-f67c-4109-8ea0-17b1b7a16782
        name: Yankee Clipper
      - id: 41bd9dd4-c0c3-4305-8736-e13b4f374589
        name: Charles "Pete" Conrad
    quote: |-
      also, Yankee Clipper informs me he has the television all set up. When we come around the {{illegible: horn}}, we'll come around with the television on in VOX.
    text: |-
      Richard Gordon aboard Yankee Clipper had set up the television camera and told Charles "Pete" Conrad it was ready.
  - id: b908092d-6e2d-4946-af0f-1935ca4f1abc
    type: observation
    provenance_chain:
      origin_kind: unattributed
      origin: Mission Control electrical monitoring
    attribution_in_text: false
    location: char:6310-6406
    refs:
      - id: 3e0124f6-72da-4478-a7aa-94a215653976
        name: Intrepid
    quote: |-
      Roger, Pete. Our electrical watchers say that the current indicates that your tracking light is on.
    text: |-
      Mission Control's electrical monitoring indicated to flight controllers that Intrepid's tracking light was on, contradicting Charles "Pete" Conrad's report that the crew had turned it off.
