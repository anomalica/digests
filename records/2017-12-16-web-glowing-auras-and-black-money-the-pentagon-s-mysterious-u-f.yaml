      In his October 4 resignation letter, Luis Elizondo expressed frustration with limitations on the Advanced Aerospace Threat Identification Program (AATIP), telling Defense Secretary Jim Mattis that 'there remains a vital need to ascertain capability and intent of these phenomena for the benefit of the armed forces and the nation.'
