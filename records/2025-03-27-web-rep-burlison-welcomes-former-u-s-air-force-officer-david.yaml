        name: Grusch Burlison Special Advisor Appointment
    quote: |-
      I'm both immensely humbled and deeply honored to join Congressman Burlison and his amazing team of professionals in pushing for government transparency... I will use all my expertise to support Rep. Burlison and help the US Congress restore full oversight while enabling the Legislative Branch's ability to investigate and hold those accountable who have broken the law and lied not only to our Congress, but also to the Executive Office of the President, Director of National Intelligence, and Department of Justice.
    text: |-
      David Grusch stated he is honoured to join Congressman Eric Burlison and his team in pushing for government transparency, and that he will use his expertise to support Rep. Burlison and help the US Congress restore full oversight and hold accountable those who have broken the law and lied to Congress, the Executive Office of the President, the Director of National Intelligence, and the Department of Justice.
