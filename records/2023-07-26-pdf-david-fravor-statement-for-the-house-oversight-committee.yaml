      The air controller on the ship also had no idea but had been observing these objects on their Aegis combat system for the previous 2 weeks.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: The air controller on USS Princeton had been observing Anomalous Aerial Vehicle (AAV) objects on the Aegis combat system for the previous two weeks prior to 2004-11-14.
