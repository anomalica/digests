    quote: |-
      When we arrived at the location at 20,000 ft, the controller called Merge Plot, which means that our radar blip was now in the same radar resolution cell as the contact.
    text: |-
      Nimitz UAP Intercept, 2004-11-14: David Fravor's flight arrived at the Anomalous Aerial Vehicle (AAV) location at approximately 6,000 metres (20,000 feet) altitude, at which point the air controller called 'Merge Plot', indicating that their radar blip was in the same radar resolution cell as the contact.
