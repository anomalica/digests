    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: The Anomalous Aerial Vehicle (AAV) objects observed on USS Princeton's Aegis combat system were descending from above approximately 24,000 metres (above 80,000 feet) rapidly down to approximately 6,000 metres (20,000 feet), staying for hours, then going straight back up.
