        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      We were attached to Carrier Airwing Eleven and stationed onboard the USS Nimitz (CVN-68).
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: Strike Fighter Squadron 41 (VFA-41) was attached to Carrier Air Wing 11 and stationed aboard USS Nimitz (hull classification CVN-68) in 2004-11.
  - id: c16f2bde-291d-4732-99d4-bc45bc849ec4
    type: testimony
    attestation: first_hand
    speaker:
      id: 7020b0d8-5864-40f3-8398-22e75f69304a
      name: Fravor, David
    location: page 1, paragraph 2
    date: 2004-11
    refs:
      - id: 9c9fb1e2-ac96-4ea3-a8ae-d5926b3a9c70
        name: USS Nimitz
      - id: 50a2352b-ab5b-4256-8502-d39bf8de738d
        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      We were at the beginning of our workup cycle that would prepare us for a combat deployment to the Persian Gulf for operations supporting the ground forces in Iraq.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: In 2004-11, the Nimitz Carrier Strike Group was at the beginning of a workup cycle to prepare for a combat deployment to the Persian Gulf supporting ground forces in Iraq.
  - id: 74bb7492-496c-460c-a365-309391bba8ef
    type: testimony
    attestation: first_hand
    speaker:
      id: 7020b0d8-5864-40f3-8398-22e75f69304a
