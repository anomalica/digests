        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      As we launched off the USS Nimitz, we checked in with the air controller on the USS Princeton, we were told that training was going to be suspended for real world tasking.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: After launching from USS Nimitz on 2004-11-14, David Fravor's flight checked in with the air controller on USS Princeton and was told training was being suspended for real-world tasking.
