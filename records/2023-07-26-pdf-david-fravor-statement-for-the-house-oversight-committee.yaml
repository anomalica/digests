    quote: The Red Air was being flown by our Marine F/A-18 squadron VMFA-232.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: During the 2004-11-14 exercise, the adversary aircraft (callsign 'Red Air') were flown by Marine Fighter Attack Squadron 232 (VMFA-232) in F/A-18s.
