    quote: |-
      In Nov 2004, I was the Commanding Officer of Strike Fighter Squadron Forty-One, the World Famous Black Aces!
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: In 2004-11, David Fravor was the Commanding Officer of Strike Fighter Squadron 41 (VFA-41), known as the Black Aces.
