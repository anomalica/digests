    quote: |-
      As we proceeded to the west and as the air controller counted down the range, we had nothing on our radars and were unaware of what we were going to see when we arrived.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: On approach to the Anomalous Aerial Vehicle (AAV) contact, David Fravor's flight had nothing on their aircraft radars and were unaware of what they were going to see.
