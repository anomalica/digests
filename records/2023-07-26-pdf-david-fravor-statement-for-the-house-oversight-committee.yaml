        name: Fravor, David
      - id: 50a2352b-ab5b-4256-8502-d39bf8de738d
        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      We had been at sea for roughly 2 weeks, and I was scheduled to lead a 2 V 2 Air to Air training exercise.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: David Fravor was scheduled to lead a 2-versus-2 air-to-air training exercise approximately two weeks after putting to sea.
  - id: d67405fe-aa4e-441e-b280-37154cd5a06c
    type: testimony
    attestation: first_hand
    speaker:
