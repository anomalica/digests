    location: page 1, paragraph 2
    refs:
      - id: 50a2352b-ab5b-4256-8502-d39bf8de738d
        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: The at-sea period was scheduled to go from Early November to Late December.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: The at-sea period for the workup was scheduled to run from early 2004-11 to late 2004-12.
  - id: a76c0b55-34ba-429d-8230-11da73e1aaab
    type: testimony
    attestation: first_hand
    speaker:
