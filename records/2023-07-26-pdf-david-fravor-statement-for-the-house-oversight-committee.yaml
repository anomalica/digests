        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      My flight of 2 F/A-18Fs was the Blue Air, the good guys, and we were being controlled by the USS Princeton, CG-59.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: David Fravor's flight of two F/A-18F aircraft (callsign 'Blue Air') was controlled by USS Princeton (hull classification CG-59) during the 2004-11-14 training exercise.
  - id: 21bac868-09f7-44e6-a4ac-c1a91f60e55a
    type: testimony
    attestation: first_hand
    speaker:
      id: 7020b0d8-5864-40f3-8398-22e75f69304a
