      The CAP point is where we would hold prior to commencing our training runs, roughly 40 miles South of the ship.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: The Combat Air Patrol (CAP) point was approximately 64 kilometres (roughly 40 miles) south of USS Nimitz.
