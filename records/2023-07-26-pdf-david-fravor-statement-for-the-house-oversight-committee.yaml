      - id: 50a2352b-ab5b-4256-8502-d39bf8de738d
        name: Fravor House Oversight Committee UAP Testimony, 2023
    quote: |-
      Keep in mind the F/A-18F's are 2 seat aircraft with the pilot in the front and the WSO (Weapons System Officer) in the back seat.
    text: |-
      Fravor House Oversight Committee UAP Testimony, 2023: The F/A-18F is a two-seat aircraft with a pilot in the front seat and a weapons systems officer (WSO) in the rear seat.
  - id: 119eaff8-85c7-45c0-b4a6-0a5ada7d3961
    type: testimony
