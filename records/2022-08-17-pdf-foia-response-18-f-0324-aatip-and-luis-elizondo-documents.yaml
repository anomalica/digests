        name: Elizondo Pentagon Resignation 2017
    quote: |-
      On or about October 4, after Mr. Elizondo had departed the organization, a second resignation letter (Tab C) was delivered to the USDI Chief of Staff office. In this letter, which is formatted as a 'Memorandum for Record' but uses the salutation 'Mr. Secretary,' Mr. Elizondo cites concerns over anomalous aerospace threats as the basis for his resignation. Given the uncertain provenance of the second letter, OUSDI retained a copy but did not provide it to the SecDef office.
    text: |-
      On or about October 4, 2017, after Luis Elizondo had departed the organisation, a second resignation letter formatted as a 'Memorandum for Record' but using the salutation 'Mr. Secretary' was delivered to the USDI Chief of Staff office by someone other than Elizondo. The OUSD(I) retained a copy but did not provide it to the SecDef office due to uncertain provenance.
