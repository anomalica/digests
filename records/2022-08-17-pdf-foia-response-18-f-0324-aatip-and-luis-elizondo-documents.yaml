    quote: |-
      Those with 5 years can opt to collect retirement benefits as early as age 62; those with 10 years can collect at their MRA but will sacrifice 5% for each year they are under 62.
    text: |-
      Under the Deferred Retirement Policy of the Department of Defense, those with five years of federal service can opt to collect retirement benefits as early as age 62; those with ten years can collect at their Minimum Retirement Age (MRA) but sacrifice 5% for each year they are under 62.
