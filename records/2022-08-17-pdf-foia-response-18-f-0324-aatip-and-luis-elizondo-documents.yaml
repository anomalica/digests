      After my phone call with Mr. Elizondo, in which he said he had been secretly working for the Secretary, I checked with two senior officials that have knowledge of special programs; our collective assessment

      was that Mr. Elizondo's claims were not credible, and the letter was not worthy of the Secretary's personal attention.
