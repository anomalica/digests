    quote: |-
      "Deferred Retirement" refers to delayed payment of benefits until certain criteria are met. Deferred retirement applies to those with at least five years of Federal service who depart before reaching their Minimum Retirement Age (MRA) - which is between ages 55-57, depending on year of birth. Those with 5 years can opt to collect retirement benefits as early as age 62; those with 10 years can collect at their MRA but will sacrifice 5% for each year they are under 62.
    text: |-
      A deferred retirement refers to delayed payment of benefits until certain criteria are met, applying to those with at least five years of Federal service who depart before reaching their Minimum Retirement Age (between ages 55 and 57 depending on year of birth); those with five years can collect benefits as early as age 62, and those with ten years can collect at their Minimum Retirement Age but sacrifice 5 percent for each year under 62.
