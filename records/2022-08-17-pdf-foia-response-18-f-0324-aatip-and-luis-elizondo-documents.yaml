        name: Elizondo Second Resignation Letter / Memorandum for Record (2017-10-04)
    quote: |-
      Despite overwhelming evidence at both the unclassified and classified levels, certain individuals in the Department remain staunchly opposed to further research on what could be a tactical threat to our pilots, sailors, and soldiers, and perhaps even an existential threat to our national security.
    text: |-
      Luis Elizondo considered that, despite overwhelming evidence at both unclassified and classified levels, certain individuals in the Department of Defense remained staunchly opposed to further research on anomalous aerospace threats, which he characterised as potentially a tactical threat to pilots, sailors, and soldiers and perhaps an existential threat to national security.
