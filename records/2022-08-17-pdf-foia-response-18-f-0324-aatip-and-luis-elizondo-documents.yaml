    quote: |-
      'Deferred Retirement' refers to delayed payment of benefits until certain criteria are met. Deferred retirement applies to those with at least five years of Federal service who depart before reaching their Minimum Retirement Age (MRA) - which is between ages 55-57, depending on year of birth.
    text: |-
      Garry Reid's memo defines 'Deferred Retirement' as delayed payment of benefits until certain criteria are met, applying to those with at least five years of Federal service who depart before reaching their Minimum Retirement Age (MRA), which is between ages 55-57 depending on year of birth.
