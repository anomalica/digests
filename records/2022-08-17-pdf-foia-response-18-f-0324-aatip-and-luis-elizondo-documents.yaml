        name: Elizondo Pentagon Resignation 2017
    quote: |-
      Mr. Elizondo has provided three different explanations for his sudden resignation. On October 3rd he told his direct supervisor he was resigning because he had a fleeting job opportunity that required his immediate availability. In a memorandum dated October 4th he cited his concerns over inaction within the Department over 'anomalous aerospace threats' as the reason for his resignation. On October 6th, via a phone call, he told me he resigned because his job was too stressful on his family.
    text: |-
      In response to the Secretary of Defense's questions, Garry Reid noted that Luis Elizondo provided three different explanations for his resignation: (1) a fleeting job opportunity requiring immediate availability (to his direct supervisor on October 3); (2) concerns over inaction within the Department over anomalous aerospace threats (memorandum dated October 4); and (3) that his job was too stressful on his family (phone call October 6).
