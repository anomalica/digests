    type: opinion
    speaker:
      id: 42b4162c-5087-4b89-8459-0f0cd77cf948
      name: Elizondo, Luis D.
    location: page 7, para 2
    refs:
      - id: 42b4162c-5087-4b89-8459-0f0cd77cf948
