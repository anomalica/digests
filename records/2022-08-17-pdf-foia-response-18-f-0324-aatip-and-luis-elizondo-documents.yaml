    quote: |-
      "Deferred Retirement" refers to delayed payment of benefits until certain criteria are met. Deferred retirement applies to those with at least five years of Federal service who depart before reaching their Minimum Retirement Age (MRA) - which is between ages 55-57, depending on year of birth.
    text: |-
      Under the Deferred Retirement Policy of the Department of Defense, deferred retirement refers to delayed payment of benefits until certain criteria are met, and applies to those with at least five years of federal service who depart before reaching their Minimum Retirement Age (MRA), which is between ages 55 and 57 depending on year of birth.
