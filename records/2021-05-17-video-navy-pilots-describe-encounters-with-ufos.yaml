        name: Graves, Ryan
    quote: I'd say, you know, the highest probability is it's a threat observation program.
    text: |-
      Ryan Graves assessed the highest probability explanation for the UAPs as a threat observation programme, potentially Russian or Chinese technology.
  - id: 932b310f-7e0a-47e5-b412-89d6a21b9d69
    type: opinion
    attestation: first_hand
