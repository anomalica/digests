        name: Graves, Ryan
    quote: |-
      I am worried, frankly. You know, if these were tactical jets from another country that were hanging out up there, it would be a massive issue. But because it looks slightly different, we're not willing to actually look at the problem in the face.
    text: |-
      Ryan Graves expressed worry that UAPs hovering over restricted airspace were being ignored despite posing a potential security threat equivalent to foreign tactical jets.
