        name: FLIR1 Video
    quote: |-
      We returned to Nimitz. We were taking off our gear. We were talking to one of my crews, who was getting ready to launch. We mentioned it to him, and they went out and luckily got the video that you see, that 90-second video.
    text: |-
      After returning to the USS Nimitz following the Tic Tac Sighting, David Fravor mentioned the encounter to a crew getting ready to launch, and that crew obtained the 90-second video recording subsequently seen publicly.
  - id: a62a9299-3bd4-45f7-9e59-bbc651e3a732
