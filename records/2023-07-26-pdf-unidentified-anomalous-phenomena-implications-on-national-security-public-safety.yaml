        name: Gang of Eight
    quote: |-
      10 U.S. Code Section 119 discusses congressional oversight of SAPs, discusses the DEP/SecDef's ability to waive congressional reporting. However, the Gang of Eight is at least supposed to be notified if a - you know, a waived or a waive bigoted unacknowledged SAP is created and that is public law.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, David Grusch testified that Title 10 U.S. Code Section 119 discusses congressional oversight of Special Access Programs (SAPs) and the Deputy Secretary of Defense's ability to waive congressional reporting, while the Gang of Eight must at minimum be notified of any waived or bigoted unacknowledged SAP that is created.
