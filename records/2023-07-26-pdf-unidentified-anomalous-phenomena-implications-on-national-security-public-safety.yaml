        name: Fravor, David
    quote: For those that do not realize, above 80,000 feet is space.
    text: David Fravor noted that above approximately 24,000 metres is considered space.
  - id: 4f835dee-9d66-417a-907c-52342cd6fd14
    type: testimony
    attestation: first_hand
    speaker:
