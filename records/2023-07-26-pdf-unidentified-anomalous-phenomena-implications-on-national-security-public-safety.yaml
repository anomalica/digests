      when he approached he said that his radar went down. He said that his FLIR system malfunctioned and that he had to manually take this image from one of the lenses and it was not automated in collection as you would typically see in a test mission.
    text: |-
      During the Eglin Air Force Base UAP Incident, when the pilot approached the orb, his radar went down, his forward-looking infrared (FLIR) system malfunctioned, and he had to manually take an image from one of the lenses rather than using automated collection.
