      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      Years later, I was contacted by the other pilot, Alex Dietrich, and asked if I would been contacted and I said no, but I am willing to talk.
    text: |-
      Alex Dietrich contacted David Fravor and asked if he had been contacted regarding the Tic Tac Sighting; Fravor said he had not but was willing to talk.
  - id: ac3d3106-d97e-46ad-83d7-2b4f7e2d6cc2
