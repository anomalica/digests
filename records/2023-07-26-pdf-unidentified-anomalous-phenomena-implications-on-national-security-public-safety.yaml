        name: Graves, Ryan
    quote: |-
      They are similar. Pilots - commercial pilots have less range and less sensors to be able to reach out and look for objects over wide swaths of airspace. And so pilots are seeing them. Commercial pilots are seeing them and they are typically closer
    text: |-
      Commercial pilots are encountering Unidentified Anomalous Phenomena (UAP) similar to those military pilots see, but commercial pilots have less range and fewer sensors and tend to see the objects at closer range.
