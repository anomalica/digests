    quote: I was the commanding officer of the squadron. So, no.
    text: |-
      David Fravor testified that after the Tic Tac Sighting he received no justification from commanding officers because he himself was the commanding officer of the squadron.
  - id: 42be8611-1eb9-4bcd-a46a-e4f255e17dc5
    type: opinion
    attestation: first_hand
    speaker:
      id: dd39321f-5c9b-447b-aac5-012b65d26482
      name: Grusch, David
    location: page 16
    date: '2023-07-26'
    refs:
      - id: dd39321f-5c9b-447b-aac5-012b65d26482
        name: Grusch, David
    quote: |-
      Unless it shows a specific national security vulnerability as it relates to a weakness in a particular defense system.
    text: |-
      David Grusch testified that a reason to withhold older UAP information would be if it reveals a specific national security vulnerability related to a weakness in a particular defense system.
  - id: c8095292-2dc4-427f-8b6a-d40fbc572edb
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
