    quote: |-
      the controller told us that these objects had been observed for over 2 weeks coming down from over 80,000 feet, rapidly descending to 20,000 feet, hanging out for hours and then going straight back up.
    text: |-
      The air controller told David Fravor's flight that the objects had been observed for over 2 weeks, coming down from over approximately 24,000 metres, rapidly descending to approximately 6,000 metres, hanging for hours, then going straight back up.
