  - id: 6713641f-4525-4f3c-a8a1-e6a3a4ef322a
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: page 16
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
      - id: cf901d88-8c63-4a96-b91f-82e4796a6627
        name: Carrier Intelligence Center (CVIC)
      - id: 9dfa3fdf-e016-4792-86bd-b64eec6ad9ff
        name: Carrier Intelligence Center (CVIC) Debrief
    quote: |-
      We had a standard debrief where the backseaters went down to our carrier intel center and briefed would have happened and that was it. No one else talked to us and I was in the top 20 in the battle group. No one came. That captain was aware. The admiral was aware. Nothing was done.
    text: |-
      David Fravor testified that after the Tic Tac Sighting, only a standard debrief occurred where backseat crew went to the Carrier Intelligence Center (CVIC) and briefed what happened; the carrier's captain and admiral were aware but nothing was done.
  - id: 1126199f-5ae1-47fd-93d5-6af39f41efdd
    type: opinion
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: page 14
    date: '2023-07-26'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
      - id: 9eb37385-9b43-4da4-988f-cb10142d5d34
        name: AAV (object)
    quote: |-
      the Tic Tac object we engaged in 2004 was far superior to anything that we had on time, have today, or looking to develop in the next 10 years.
    text: |-
      David Fravor testified that the Tic Tac object encountered in 2004 was far superior to anything the U.S. had at that time, has today, or is looking to develop in the next 10 years.
  - id: 67241889-2f7c-4ba0-9ebd-6284f586ded4
    type: testimony
    attestation: first_hand
    speaker:
      id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
      name: Graves, Ryan
    location: page 15
    date: '2023-07-26'
    refs:
      - id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
        name: Graves, Ryan
    quote: |-
      No. Right now, military witnesses to UAP have limited options for reporting UAP. But more concerning is that the commercial aviation sector has not adapted to the lessons that military has implemented.
    text: |-
      Ryan Graves testified that military aircrew and commercial pilots are not adequately trained and briefed on how to handle UAP encounters, and that the commercial aviation sector has not adapted to lessons the military has implemented.
  - id: 2d50f687-457e-4bf0-be43-b26a71eb3e34
    type: testimony
    attestation: first_hand
    speaker:
      id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
      name: Graves, Ryan
    location: page 15
    date: '2023-07-26'
    refs:
      - id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
        name: Graves, Ryan
    quote: |-
      There is a fear that the stigma associated with this topic is going to lead to professional repercussions either through management or perhaps through their yearly physical check.
    text: |-
      Ryan Graves testified that there is a fear among pilots that reporting UAP sightings will lead to professional repercussions, either through management or yearly physical checks.
  - id: bde3eadc-0aed-4742-8857-7f23fe2832c2
    type: testimony
