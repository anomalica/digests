      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      What is shocking to us is that the incident was never investigated. None of my crew were ever questioned.
    text: |-
      David Fravor testified that the Tic Tac Sighting was never officially investigated and none of his crew were ever questioned about it.
  - id: 8ac80a0b-63b2-4293-983a-77743c454b75
