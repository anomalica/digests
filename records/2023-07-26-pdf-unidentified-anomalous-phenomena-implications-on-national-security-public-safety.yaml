        name: Graves, Ryan
      - id: 73ea89d2-9127-4146-aca4-c071eb52606a
        name: Atlantic UAP Cube-Sphere Encounter
    quote: |-
      A dark gray or a black cube inside of a clear sphere... No wings. No IR energy coming off of the vehicle. Nothing tethering it to the ground.
    text: |-
      The cube-sphere UAP had no wings, emitted no infrared energy, and had nothing tethering it to the ground.
  - id: 1c6c356a-7d08-4a5e-9ac6-f36a35ece950
    type: testimony
    attestation: first_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 48
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
      - id: f7add6f2-3a7a-4b65-8de8-c06bf5ab9349
        name: Americans for Safe Aerospace
    quote: |-
      I came forward because I felt that my colleagues did not have a way to mitigate the safety threat and I wanted to help them. I was trained as an aviation safety officer by the Navy.
    text: |-
      Ryan Graves stated he came forward publicly about UAPs because his colleagues did not have a way to mitigate the safety threat, and he was trained as an aviation safety officer by the Navy.
  - id: 6c5c8178-6feb-47e4-b383-86b9a59ea8dd
