    quote: |-
      It was stated explicitly to me by these test pilots that if you have a UAP experience the best thing you can do for your career is forget it and not tell anyone because any type of reporting, either above the surface or below the surface, does have a perceived consequence to these people.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Matt Gaetz stated that test pilots from the Eglin Air Force Base incident explicitly told him that if a pilot had a UAP experience, the best thing to do for their career was forget it and not tell anyone, because any type of reporting had a perceived career consequence.
