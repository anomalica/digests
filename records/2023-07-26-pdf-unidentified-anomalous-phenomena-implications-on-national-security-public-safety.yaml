        name: Americans for Safe Aerospace
    quote: |-
      I came forward because I felt that my colleagues did not have a way to mitigate the safety threat and I wanted to help them. I was trained as an aviation safety officer by the Navy and this seemed - it just felt right.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that he came forward because his colleagues lacked a way to mitigate the UAP safety threat and he had been trained as an aviation safety officer by the US Navy.
