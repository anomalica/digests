        name: Virginia Beach UAP Near-Miss
    quote: |-
      I was not. I was there when the pilot landed. He canceled the mission after. I was there. He was in the ready room with all his gear on with his mouth open and I asked him what the problem was and he said he almost hit one of those darn things.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves stated he was not in one of the aircraft during the Virginia Beach near-miss but was present in the ready room when the pilot landed, who cancelled the mission and described having almost hit the object.
