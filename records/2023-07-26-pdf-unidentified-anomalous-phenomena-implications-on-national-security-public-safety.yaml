      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      is it true that you saw, in your words, a 40-foot flying Tic Tac shaped object? Commander Fravor. That is correct. For some people that cannot - know what a Tic Tac is it is a giant flying propane tank.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor confirmed that the Tic Tac UAP appeared to be approximately 12 metres (40 feet) long and shaped like a Tic Tac candy, which he described as like a giant flying propane tank.
  - id: 3ea6cb7d-49a8-4514-ac99-15c2608f7f07
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: 29665c49-4682-4620-a357-4b88d588cca1
        name: USS Princeton
      - id: 67c590ed-27d5-463c-8c4f-6ad8e03794eb
        name: USS Nimitz
      - id: 3364b890-363a-4a1f-b55e-2cdeae77a772
        name: E-2C Hawkeye
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      The Princeton tracked it. The Nimitz tracked it. The E2 tracked it. We never saw it on our radars. Our fire control radars never picked it up.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that the USS Princeton, USS Nimitz, and the E-2C Hawkeye all tracked the Tic Tac UAP, but that the fire control radars of the F/A-18 aircraft he was flying never picked it up.
  - id: 7ad254f7-510d-4408-9782-3add84640112
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - name: Underwood, Chad
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
      - id: 86e1f58c-a7a0-43de-9671-461cfea30eea
        name: ATFLIR Pod
      - id: 2ffb8ba9-61d4-4efc-b72b-a2e520764602
        name: AAV Radar Jamming Event
    quote: |-
      The other airplane that took the video did get it on a radar. As soon as it tried to lock it, it jammed the radar, spit the lock and he rapidly switched over to the targeting pod, which you can do in the F-18.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that the second aircraft (flown by Chad Underwood) did get the Tic Tac UAP on radar, but when it tried to lock on, the UAP jammed the radar and the pilot rapidly switched to the ATFLIR targeting pod.
  - id: 6d01323b-3543-4379-8824-5c52a61de5ee
    type: testimony
    attestation: second_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - name: Underwood, Chad
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
      - id: 86e1f58c-a7a0-43de-9671-461cfea30eea
        name: ATFLIR Pod
    quote: |-
      No, there is none. There is no IR plume coming out and Chad, who took the video, went through all the EO, which is black and white TV and the I&R modes and there is no visual signs of propulsion. It is just sitting in space at 20,000 feet.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that Chad Underwood examined the Tic Tac UAP in electro-optical (black and white TV) and IR modes and found no visible signs of propulsion; the object was at approximately 6,000 metres (20,000 feet).
  - id: ef24baab-b87f-4009-8d7c-c3b7ab1d77c3
    type: observation
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      Abruptly, very determinant. It knew exactly what it was doing. It was aware of our presence and it had acceleration rates - I mean, it went from zero to matching our speed in no time at all.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that the Tic Tac UAP moved abruptly, appeared aware of the presence of the aircraft, and went from zero to matching the aircraft's speed almost instantaneously.
  - id: 3e0b6b15-6d96-4e0a-9da6-c00907e86a10
    type: opinion
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2023-07-26'
    refs:
