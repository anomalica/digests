    quote: |-
      On this day we were scheduled for a 2 V 2 air to air training with the USS Princeton as our control. When we launched off, Nimitz, my wingman, was joining up. We were told that the training was going to be suspended and we are going to proceed with real-world tasking.
    text: |-
      On the day of the Tic Tac Sighting, David Fravor's flight was scheduled for a 2 versus 2 air-to-air training exercise with the USS Princeton as controller, but upon launch was told training was suspended for real-world tasking.
  - id: 3788ad05-d6cd-48ea-8d87-8fc2ca24d912
    type: testimony
    attestation: first_hand
