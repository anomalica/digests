    quote: |-
      A dark gray or a black cube inside of a clear sphere...No wings. No IR energy coming off of the vehicle. Nothing tethering it to the ground.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that the pilot described the Virginia Beach near-miss object as a dark gray or black cube inside of a clear sphere, with no wings, no infrared energy, and nothing tethering it to the ground.
