        name: Tic Tac Sighting
    quote: |-
      On this day we were scheduled for a 2 V 2 air to air training with the USS Princeton as our control.
    text: |-
      The day of the Tic Tac encounter, the aircraft were scheduled for a 2v2 air-to-air training exercise with the USS Princeton as their control.
