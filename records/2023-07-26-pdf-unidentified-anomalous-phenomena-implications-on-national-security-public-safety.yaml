        name: Tic Tac Sighting
      - name: AAV
    quote: |-
      I would like to say that the Tic Tac object we engaged in 2004 was far superior to anything that we had on time, have today, or looking to develop in the next 10 years.
    text: |-
      David Fravor stated the Tic Tac object engaged in 2004 was far superior to anything the Navy had at that time, has today, or is looking to develop in the next 10 years.
