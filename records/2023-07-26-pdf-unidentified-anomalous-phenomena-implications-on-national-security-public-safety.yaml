        name: UAP Cube-in-Sphere Object
    quote: |-
      One of these objects was completely stationary at the exact entrance to our working areas, not only geographically but also altitude...The two aircraft flew within about 50 feet of the object and that was a very close visual sighting.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves described the most vivid UAP sighting as a near-miss in which two aircraft flew within approximately 15 metres (50 feet) of a cube-in-sphere object that was completely stationary at the exact entrance to their working area, at the same altitude used by jets operating on the US Eastern Seaboard.
  - id: 0f67864f-66bc-4e6a-b9dc-68c08ec89f4f
    type: observation
    attestation: second_hand
