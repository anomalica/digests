        name: Grusch, David
    quote: |-
      Purely a sense of duty. My first swore an oath when I was a cadet 18 years ago and I still uphold that even out of uniform.
    text: |-
      David Grusch stated he came forward out of a sense of duty, having first sworn an oath as a cadet 18 years before 2023 and continuing to uphold it even out of uniform.
  - id: f29ed059-5f7e-46f5-bca5-09e451c57881
