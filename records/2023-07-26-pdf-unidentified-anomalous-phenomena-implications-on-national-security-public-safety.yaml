        name: Gaetz, Matt
      - id: 31b63f74-bbac-415b-989a-d2a78a1b7ed7
        name: Eglin Air Force Base UAP Incident
    quote: |-
      One of the pilots goes to check out that diamond formation and sees a large floating, what I can only describe as an orb, again, like I said, not of any human capability that I am - that I am aware of.
    text: |-
      During the Eglin Air Force Base UAP Incident, one pilot who investigated the diamond formation saw a large floating orb that Gaetz described as beyond any human capability he was aware of.
  - id: 17c31474-2887-4233-8255-0b75163b0a8a
    type: hearsay
    attestation: second_hand
    speaker:
