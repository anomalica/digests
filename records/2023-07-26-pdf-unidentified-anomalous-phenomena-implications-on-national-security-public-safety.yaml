    quote: |-
      Mr. Grothman. Was this incident the only UAP event that you encountered while you were a pilot? Commander Fravor. Yes, it was.
    text: |-
      The 2004 Tic Tac event was the only UAP event David Fravor encountered during his time as a pilot.
  - id: 1920153e-e9a9-4fd3-8a81-5223fb2b30aa
    type: opinion
    attestation: first_hand
    speaker:
      id: dad8d3e1-3e7c-41f7-bde7-ee0b3b1ba873
      name: Fravor, David
    location: file_page 21
    date: '2023-07-26'
    refs:
      - id: 88ac6375-aedb-446d-af96-240832e6f8b3
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Mr. Grothman. ... do you believe UAPs pose a potential threat to our national security? Commander Fravor. Yes, and here is why. The technology that we faced was far superior than anything that we had, and you could put that anywhere.
    text: |-
      David Fravor considers Unidentified Aerial Phenomena (UAP) a potential threat to United States national security because the technology encountered was far superior to anything the United States possessed and could be deployed anywhere.
  - id: 2c8d3b2d-234b-46cb-948b-701000adc067
    type: opinion
    attestation: first_hand
    speaker:
      id: dad8d3e1-3e7c-41f7-bde7-ee0b3b1ba873
      name: Fravor, David
    location: file_page 21
    date: '2023-07-26'
    refs:
      - id: 88ac6375-aedb-446d-af96-240832e6f8b3
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      If you had one, you captured one, you reverse engineered it, you got it to work, you are talking something that can go into space, go someplace, drop down in a matter of seconds, do whatever it wants, and leave and there is nothing we can do about it. Nothing.
    text: |-
      If a Unidentified Aerial Phenomena (UAP) craft were captured and reverse engineered to work, it would be capable of going into space, descending in a matter of seconds, and leaving, with no means of countering it.
  - id: 0d9ab19a-57bc-42e7-9db5-4cbe97d8edaa
    type: opinion
    attestation: first_hand
    speaker:
      id: 42dda925-5a07-4f07-b01f-16def9700600
      name: Graves, Ryan
    location: file_page 21
    date: '2023-07-26'
    refs:
      - id: 88ac6375-aedb-446d-af96-240832e6f8b3
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      Identifying friend from foe is very important to us, and so when we have unidentified targets, and we continue to ignore those due to a stigma or fear of what it could be that is an opening that our adversaries can take advantage of.
    text: |-
      Ignoring unidentified targets in military and commercial aviation operating space due to stigma or fear creates an opening that adversaries can exploit, given the importance of identifying friend from foe.
  - id: c8c2b3bf-f603-4cf0-89ea-4de68e43f77e
    type: opinion
    speaker:
      id: 42dda925-5a07-4f07-b01f-16def9700600
      name: Graves, Ryan
    location: file_page 21
    date: '2023-07-26'
    refs:
      - id: 88ac6375-aedb-446d-af96-240832e6f8b3
        name: Unidentified Aerial Phenomena (UAP)
    quote: |-
      There needs to be a location where this information is centralized for processing and there needs to be a two-way communication loop so the operators on the front end have a feedback and can get best practices on how to process information, what to do, and to ensure that their reporting is being listened to. Right now, there is not a lot of back and forth.
    text: |-
      Ryan Graves recommends a centralised location for processing Unidentified Aerial Phenomena (UAP) information with a two-way communication loop so front-line operators receive feedback and best practices and know their reporting is heeded.
  - id: 6866849e-10df-433f-b2e1-f3832c50e164
