        name: Grusch, David
    quote: |-
      As a recipient of a lot of those training range reports sometimes we only get contextual, kind of oral reporting...there is a system in place that can handle multiple classifications of data, and that is an issue with the F-35, right. That jet was never built to be an ISR platform, and it is a pain in the butt to get that data off.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Grusch testified that UAP training range reports he received as a recipient were often only contextual oral reporting without attached sensor data, and that the F-35 was not built as an intelligence, surveillance, and reconnaissance (ISR) platform, making data extraction from it difficult.
