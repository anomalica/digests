        name: Tic Tac Sighting
    quote: |-
      Was this incident the only UAP event that you encountered while you were a pilot? Commander Fravor. Yes, it was.
    text: |-
      The Tic Tac incident in 2004 was the only UAP event David Fravor encountered while he was a pilot.
  - id: a9c975a6-6233-485d-8ff5-0c92880c0f1b
    type: testimony
    attestation: first_hand
    speaker:
