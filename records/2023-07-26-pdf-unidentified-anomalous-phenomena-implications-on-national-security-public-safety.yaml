      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      I would say no, just on the performance. It would have just left in a split second.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor expressed the opinion that even an armed US aircraft could not have shot the Tic Tac UAP down due to its performance capabilities.
  - id: 21439b03-7de5-4750-a566-a8900dfd7405
    type: opinion
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 43'
    date: '2023-07-26'
    refs:
