    text: |-
      The Eglin Air Force Base UAP Incident flight crew were on a test mission over the Gulf of Mexico when they observed a sequence of four craft in a clear diamond formation.
  - id: 3a7c3559-13da-4a5b-b01d-660f1d95d31f
    type: hearsay
    attestation: second_hand
    speaker:
