    text: |-
      After the Tic Tac Sighting, the USS Princeton controller reported that the object appeared at the aircraft's combat air patrol (CAP) point approximately 100 kilometres away in less than a minute.
  - id: bed45c57-5257-4d77-a20f-8124728e3b87
