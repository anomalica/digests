        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      Now, if the fastest plane on Earth was trained to do these maneuvers that you saw, would it be capable of doing that? Commander Fravor. No, not even close.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that no aircraft on Earth, even the fastest, could replicate the maneuvers he observed the Tic Tac UAP perform.
  - id: 6554419f-bd08-418e-b07f-3f564e734d49
    type: observation
