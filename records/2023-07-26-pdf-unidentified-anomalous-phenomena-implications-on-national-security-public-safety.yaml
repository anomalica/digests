        name: Department of Defense
    quote: |-
      The military and Department of Defense has stated that UAP represent a critical aviation safety risk. We have not seen that same language being used in the commercial markets.
    text: |-
      Ryan Graves stated that the Department of Defense has stated UAP represent a critical aviation safety risk, but that same language has not been adopted by the commercial aviation market.
