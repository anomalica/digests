        name: University of Houston
    quote: |-
      I was an enlisted Marine, Naval Academy graduate, Navy, flew for 18 years. Got a Master's from University of Houston and I have worked in the private sector for the last what now, 19 - 16 years, 17 years. I do a lot of defense work.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that he was an enlisted Marine, a Naval Academy graduate, flew in the Navy for 18 years, earned a Master's degree from the University of Houston, and had worked in the private sector doing defense work for approximately 16 to 17 years.
  - id: 7827deb1-dd85-4e22-9461-c7765f8a87b3
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2023-07-26'
    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: 29665c49-4682-4620-a357-4b88d588cca1
        name: USS Princeton
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      We were at a work up with all the battle groups...we were doing an air to air defense to hone not only our skills but those of the USS Princeton when they had been tracking them for 2 weeks. The problem was that there was never manned aircraft airborne when they were tracking them and this was the first day.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that on 2004-11-14 he and his colleagues were conducting a workup integrating ships, carrier, and air wing when USS Princeton had been tracking UAP objects for two weeks, and the 2004-11-14 flight was the first day with manned aircraft airborne during the tracking.
  - id: ae7634be-19d8-452e-976f-c9e34dfcf392
    type: observation
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: 'printed_page: 42'
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: a6cf9611-0fec-43d4-83eb-fc56b4e3b038
        name: 2004 Nimitz UAP Encounter
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      It was actually - if you are familiar San Diego, it was a perfect day, light winds, no whitecaps, clear skies. Not a cloud. It was - for flying it was the best.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor described the weather on 2004-11-14 off the coast of San Diego as a perfect day with light winds, no whitecaps, clear skies, and no clouds.
  - id: 97e6251a-17a0-4e10-aaa8-f9da61da57d0
    type: observation
    attestation: first_hand
    speaker:
