        name: Mutual UFO Network (MUFON)
    quote: |-
      I never felt that we were alone with all the planets out there. But I was not a UFO person. I was not watching History Channel and Mufon and all that.
    text: |-
      Before the 2004 encounter David Fravor never felt humanity was alone given all the planets, but was not a UFO enthusiast and did not watch the History Channel or follow the Mutual UFO Network (MUFON).
  - id: 3b710146-9147-44c4-9c8a-29f7cf3bcaf4
    type: opinion
    speaker:
