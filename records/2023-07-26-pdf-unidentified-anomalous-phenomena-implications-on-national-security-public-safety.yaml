    text: |-
      The Tic Tac object observed during the Tic Tac Sighting had no rotors, no rotor wash, and no visible control surfaces such as wings.
  - id: 3a52a717-4506-4829-8688-9b91202b1bce
    type: observation
    attestation: first_hand
