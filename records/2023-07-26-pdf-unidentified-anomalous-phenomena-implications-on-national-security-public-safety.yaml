    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that his aircraft was not armed on 2004-11-14 and that he never felt threatened by the Tic Tac UAP.
  - id: 4ac20bea-6f80-4e0b-9377-00f2f05bfb03
    type: opinion
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
