    quote: |-
      There is certainly some national security concerns when we use our advanced sensors in our tactical jets to be able to identify these objects. However, there is no reason that the objects themselves would be classified.
    text: |-
      Ryan Graves considers there is no reason the UAP objects themselves would be classified, though using advanced sensors in tactical jets to identify them raises national security concerns.
