        name: All-Domain Anomaly Resolution Office (AARO)
    quote: |-
      I think that there is two categories that would be important. One would be kinematics and understanding the specifics of how the vehicle or objects are moving, and the second would be a more zoomed out approach of being able to look at origin and destination after or before the incident as well as getting a better contextual understanding of how these objects are interacting with each other.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that the All-Domain Anomaly Resolution Office (AARO) should prioritize two categories of data for UAP collection: kinematics (how objects are moving) and a broader contextual understanding of UAP origin and destination and how objects interact with each other.
