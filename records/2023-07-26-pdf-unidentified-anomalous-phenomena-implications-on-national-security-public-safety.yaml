        name: Intelligence Community Inspector General
    quote: |-
      As you know, the preponderance of my complaint was classified to the intelligence communities. Both material acquisition and exploitation activity, also baselining the UAPs but not sharing it with, you know, intelligence professionals that are actually doing step briefs to pilots.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, David Grusch testified that the preponderance of his Intelligence Community Inspector General complaint was classified, and included information about material acquisition and exploitation activity, and about baselining UAPs but not sharing that information with intelligence professionals conducting step briefs to pilots.
  - id: c3e1802c-3d8b-4be2-8453-8e50e3dbbcf6
    type: testimony
    attestation: first_hand
