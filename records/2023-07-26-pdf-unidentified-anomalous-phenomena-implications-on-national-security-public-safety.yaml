        name: 2004 Nimitz UAP Encounter
    quote: |-
      I think what we experienced was, like I said, well beyond the material science and the capabilities that we had at the time, that we have currently, or that we are going to have in the next 10 to 20 years.
    text: |-
      David Fravor concluded that what he experienced in the 2004 encounter was well beyond current material science and capabilities, and will remain so for the next 10 to 20 years.
  - id: f574573d-f733-4f4d-ab9f-4ac3e950880d
    type: testimony
    attestation: first_hand
    speaker:
