        name: 2004 Nimitz UAP Encounter
    quote: |-
      We arrived at the location at approximately 20,000 feet... the weather on this day was as close to perfect as you could ask for off the coast of San Diego. Clear skies, light winds, calm seas, no whitecaps from waves. So, the whitewater stood out in a large blue ocean.
    text: |-
      The four crew members arrived at the UAP location at approximately 6,000 metres and observed whitewater off their right side despite calm seas on an otherwise clear day off the coast of San Diego.
  - id: 5123d2ca-3932-4f52-a786-7ee2030d7e91
    type: testimony
    attestation: first_hand
    speaker:
      id: 688e6acb-1e5d-4ea3-a4c6-a9b85603a06f
      name: Fravor, David
    location: page 13
    date: 2004-11
    refs:
      - id: 688e6acb-1e5d-4ea3-a4c6-a9b85603a06f
        name: Fravor, David
      - id: 77aacb13-2c04-41fc-ac60-4dd310448263
        name: Tic Tac Sighting
      - id: 7805c21b-eb8a-45dc-9f18-26ce28623516
        name: 2004 Nimitz UAP Encounter
      - name: AAV
    quote: |-
      All four of us, because we were an F-18F so we had pilots and WSO in the backseat, looked down and saw a white Tic Tac object with a longitudinal axis pointing north south and moving very abruptly over the water like a ping pong ball. There were no rotors, no rotor wash, or any sign of visible control surfaces like wings.
    text: |-
      All four crew members observed a white Tic Tac-shaped object with a longitudinal axis pointing north-south, moving very abruptly over the water with no rotors, rotor wash, or visible control surfaces.
  - id: ac4d1c99-24e9-4e45-a271-0482862f8a11
    type: testimony
    attestation: first_hand
    speaker:
      id: 688e6acb-1e5d-4ea3-a4c6-a9b85603a06f
