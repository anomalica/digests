      It was not until 2009, until Jay Stratton had contacted me to investigate. Unbeknownst to all, he was part of the ATIP program in the Pentagon led by Lue Elizondo.
    text: |-
      David Fravor was first contacted about the Tic Tac Sighting in 2009 by Jay Stratton, who was part of the Advanced Aerospace Threat Identification Program (AATIP) at the Pentagon led by Luis Elizondo.
  - id: 26a66c3b-8812-4183-bb6d-d2ec0bfd4cc7
