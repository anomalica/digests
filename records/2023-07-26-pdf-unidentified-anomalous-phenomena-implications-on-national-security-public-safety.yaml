        name: Vandenberg Air Force Base UAP Sighting
      - id: adafe4d2-96ce-4497-afe9-0a02fce5a9da
        name: Americans for Safe Aerospace
    quote: |-
      In the 2003 timeframe, a large group of Boeing contractors were operating near one of the launch facilities at Vandenberg Air Force Base when they observed a very large 100-yard sighted red square approach the base from the ocean and hover at low altitude over one of the launch facilities. This object remained for about 45 seconds or so before darting off over the mountains.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that around 2003 a large group of Boeing contractors near a launch facility at Vandenberg Air Force Base observed a very large red square object, estimated at approximately 91 metres (100 yards) across, approach from the ocean and hover at low altitude over the launch facility for approximately 45 seconds before darting off over the mountains.
