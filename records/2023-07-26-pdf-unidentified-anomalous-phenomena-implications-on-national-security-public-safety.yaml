    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
    quote: |-
      Right now, military witnesses to UAP have limited options for reporting UAP. But more concerning is that the commercial aviation sector has not adapted to the lessons that military has implemented.
    text: |-
      Ryan Graves stated that military witnesses to UAP currently have limited options for reporting, and the commercial aviation sector has not adapted to lessons the military has implemented.
  - id: c5169ebe-f5e0-49d5-8b28-1b6ed7eceacb
    type: testimony
    attestation: first_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
