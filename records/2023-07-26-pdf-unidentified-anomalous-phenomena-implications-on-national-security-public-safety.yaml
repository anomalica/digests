        name: ATFLIR Pod
    quote: |-
      I have one particular case and that was during the Gimbal incident. The recording on the AT FLIR system shows a single object that rotates. You hear the pilots refer to a fleet of objects that is not visible on the FLIR system and that was something that I witnessed during the debrief as part of the radar data on the situational awareness page.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that during the Gimbal Video incident, the Advanced Targeting Forward-Looking Infrared (ATFLIR) recording shows a single object that rotates, while pilots on the audio can be heard referring to a fleet of objects not visible on the FLIR system, which Graves observed on the radar data during a debrief.
  - id: 8654151c-517b-4d3b-9b10-9ff7dbc1984b
    type: hearsay
    attestation: second_hand
    speaker:
