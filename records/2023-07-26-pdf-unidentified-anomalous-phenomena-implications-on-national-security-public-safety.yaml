      - id: 77aacb13-2c04-41fc-ac60-4dd310448263
        name: Tic Tac Sighting
      - name: AAV
    quote: |-
      the object suddenly shifted its longitudinal axis, aligned it with my aircraft, and began to climb.
    text: |-
      During the Tic Tac encounter, as David Fravor descended, the object shifted its longitudinal axis to align with his aircraft and began to climb.
  - id: 8055465b-7e2b-4e1d-b583-5af67080902c
    type: testimony
    attestation: first_hand
    speaker:
      id: 688e6acb-1e5d-4ea3-a4c6-a9b85603a06f
