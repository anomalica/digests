        name: AAV (object)
    quote: Our wingman, roughly 8,000 feet above us, lost contact also.
    text: |-
      During the Tic Tac Sighting, the wingman aircraft approximately 2,400 metres above Fravor also lost contact with the object simultaneously.
  - id: 695cec66-7cad-4d5e-b1b3-f0a73d4c2853
