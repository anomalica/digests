        name: 2004 Nimitz UAP Encounter
    quote: |-
      And just to confirm, this object had no wings, correct? Commander Fravor. No wings.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that the Tic Tac UAP had no wings.
