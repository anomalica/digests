        name: Graves, Ryan
    quote: |-
      Right now I do not think there is a lot of public options for the everyman to be able to report on this. I think even for professionals that have sensor data that are seeing these on a regular basis they are still hesitant to come forward.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves stated there were currently very limited public options for ordinary members of the public to report UAP sightings, and that even professionals with sensor data were hesitant to come forward.
