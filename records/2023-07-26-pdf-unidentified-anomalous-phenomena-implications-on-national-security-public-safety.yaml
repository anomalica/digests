        name: Graves, Ryan
    quote: |-
      you mentioned that you are working with 30 pilots right now that have had encounters with UAPs.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that he is currently working with approximately 30 pilots who have had UAP encounters.
