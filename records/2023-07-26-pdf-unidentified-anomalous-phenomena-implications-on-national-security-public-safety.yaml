  main_matter:
    name: House Oversight UAP Hearing, 2023-07-26
    type: event
    date: '2023-07-26'
  main_event: null
  codenames:
    - codename: Tic Tac
      refers_to: |-
        White, oblong UAP object observed by David Fravor and crew during the 2004 USS Nimitz incident, named for its resemblance to the Tic Tac candy
    - codename: FOBS
      refers_to: Ryan Graves, former U.S. Navy F-18 pilot and witness, his aviator callsign
    - codename: Black Aces
      refers_to: |-
        Strike Fighter Squadron 41 (VFA-41), commanded by David Fravor at the time of the 2004 Nimitz UAP encounter
    - codename: Red Rippers
      refers_to: |-
        Navy Fighter Attack Squadron 11 (VFA-11), the squadron Ryan Graves was assigned to in 2014
  acronyms:
    - acronym: AARO
      expansion: All-Domain Anomaly Resolution Office
    - acronym: UAPTF
      expansion: Unidentified Aerial Phenomena Task Force
    - acronym: NGA
      expansion: National Geospatial Intelligence Agency
    - acronym: NRO
      expansion: National Reconnaissance Office
    - acronym: VFA-41
      expansion: Strike Fighter Squadron 41
    - acronym: VFA-11
      expansion: Fighter Attack Squadron 11
    - acronym: NAS
      expansion: Naval Air Station
    - acronym: WSO
      expansion: Weapons Systems Officer
    - acronym: FLIR
      expansion: Forward-Looking Infrared
    - acronym: CAP
      expansion: Combat Air Patrol (also used in document as Controlled Access Program)
    - acronym: SAP
      expansion: Special Access Program
    - acronym: SCIF
      expansion: Sensitive Compartmented Information Facility
    - acronym: NDAA
      expansion: National Defense Authorization Act
    - acronym: NHI
      expansion: Non-Human Intelligence
    - acronym: DIA
      expansion: Defense Intelligence Agency
    - acronym: ODNI
      expansion: Office of the Director of National Intelligence
    - acronym: DODSR
      expansion: Department of Defense Prepublication and Security Review
    - acronym: PPD-19
      expansion: Presidential Policy Directive 19
    - acronym: ATIP
      expansion: |-
        Advanced Aerospace Threat Identification Program (referred to as 'ATIP' by Fravor, elsewhere known as AATIP)
    - acronym: APG-73
      expansion: AN/APG-73 airborne radar system fitted to F/A-18 aircraft
