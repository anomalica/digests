      - id: 7805c21b-eb8a-45dc-9f18-26ce28623516
        name: 2004 Nimitz UAP Encounter
    quote: |-
      What is shocking to us is that the incident was never investigated. None of my crew were ever questioned. The tapes were never taken and after a couple days it turned into a great story with friends.
    text: |-
      The Tic Tac incident was never officially investigated; none of Fravor's crew were ever questioned and the tapes were never taken.
