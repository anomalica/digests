        name: Defense Office of Prepublication and Security Review
    quote: |-
      Based on my DODSR security review and what they have determined that is unclassified.
    text: |-
      David Grusch's limit on public disclosure during the hearing was determined by the Defense Office of Prepublication and Security Review's security review, covering only unclassified material.
  - id: 6d0a4cd2-8c50-4ad6-9706-3ed5f0fb3fcf
    type: testimony
    attestation: first_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 47
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
    quote: |-
      Pilots - commercial pilots have less range and less sensors to be able to reach out and look for objects over wide swaths of airspace. And so pilots are seeing them. Commercial pilots are seeing them and they are typically closer.
    text: |-
      Ryan Graves stated that commercial pilots are seeing UAP objects similar to those described by military pilots, and the objects they encounter are typically closer since commercial pilots have less range and fewer sensors.
  - id: 0f924ed6-6a0f-47a4-b045-e5e00bffa571
    type: hearsay
    attestation: second_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 47
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
      - id: a17f54f1-0d0e-4120-860d-3287ba746a7e
        name: Virginia Beach UAP Near-Miss
      - id: 73ea89d2-9127-4146-aca4-c071eb52606a
        name: Atlantic UAP Cube-Sphere Encounter
    quote: |-
      One of these objects was completely stationary at the exact entrance to our working areas, not only geographically but also altitude. So, it was right where all the jets are going, essentially, on the Eastern Seaboard.
    text: |-
      In the Virginia Beach UAP near-miss event, an object described as a dark gray or black cube inside a clear sphere was observed completely stationary at the exact geographic location and altitude of the entrance to the working area on the Eastern Seaboard.
  - id: ba193960-efbd-4934-8a61-2ff475be396d
    type: hearsay
    attestation: second_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 47
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
      - id: a17f54f1-0d0e-4120-860d-3287ba746a7e
        name: Virginia Beach UAP Near-Miss
      - id: 73ea89d2-9127-4146-aca4-c071eb52606a
        name: Atlantic UAP Cube-Sphere Encounter
    quote: |-
      The two aircraft flew within about 50 feet of the object and that was a very close visual sighting.
    text: |-
      Two aircraft flew within approximately 15 metres (50 feet) of the cube-sphere UAP in the Virginia Beach near-miss event.
  - id: fa42024f-8f15-496b-9ed2-f6cedf03ab24
    type: observation
    attestation: first_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 48
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
      - id: a17f54f1-0d0e-4120-860d-3287ba746a7e
        name: Virginia Beach UAP Near-Miss
    quote: |-
      I was not. I was there when the pilot landed. He canceled the mission after. I was there. He was in the ready room with all his gear on with his mouth open and I asked him what the problem was and he said he almost hit one of those darn things.
    text: |-
      Ryan Graves was not in one of the two aircraft during the cube-sphere near-miss but was present when the pilot landed and came into the ready room in full gear with his mouth open saying he almost hit one of the objects.
  - id: c4287247-fc94-46eb-9ab3-b586d1d41de9
    type: hearsay
    attestation: second_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 48
