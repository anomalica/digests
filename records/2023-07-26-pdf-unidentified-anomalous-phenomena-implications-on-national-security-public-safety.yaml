        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      No. I actually said - like I said earlier, I think it defies current material science and the ability to develop that much propulsion and I know there has been some physicists that have done calculations, which is beyond anything that we have.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, David Fravor expressed the opinion that the Tic Tac UAP was not capable of being the product of any nation on Earth, stating it defied current material science and propulsion capability.
