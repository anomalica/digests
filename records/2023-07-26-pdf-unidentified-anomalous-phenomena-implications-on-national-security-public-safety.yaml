    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: Commander Fravor. Yes, it was.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that the 2004 Tic Tac incident was the only Unidentified Anomalous Phenomena (UAP) event he encountered while serving as a pilot.
  - id: 74a59cf1-5dfc-46ac-9968-f59272b4cf58
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: file_page 21, printed_page 17
    date: '2023-07-26'
    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
    quote: |-
      Commander Fravor. Yes, and here is why. The technology that we faced was far superior than anything that we had, and you could put that anywhere.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, David Fravor testified that UAPs pose a potential threat to national security because the technology observed was far superior to anything the United States possessed.
  - id: 6acddf73-69d9-450a-b8e5-068621d47d22
    type: testimony
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: file_page 21, printed_page 17
    date: '2023-07-26'
    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
    quote: |-
      If you had one, you captured one, you reverse engineered it, you got it to work, you are talking something that can go into space, go someplace, drop down in a matter of seconds, do whatever it wants, and leave and there is nothing we can do about it. Nothing.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, David Fravor described the Tic Tac UAP as capable of going into space, dropping down in a matter of seconds, and departing in a manner beyond any U.S. counter-capability.
  - id: 6d0678c5-9480-4c40-a34b-252db5b8fbdc
    type: testimony
    attestation: first_hand
    speaker:
      id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
      name: Graves, Ryan
    location: file_page 21, printed_page 17
    date: '2023-07-26'
    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
        name: Graves, Ryan
    quote: |-
      Identifying friend from foe is very important to us, and so when we have unidentified targets, and we continue to ignore those due to a stigma or fear of what it could be that is an opening that our adversaries can take advantage of.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that UAPs pose a national security threat because unidentified targets in the operating environment create openings that adversaries can exploit, particularly given the risk of misidentifying friend from foe.
  - id: 1efcc992-e3ca-4575-a34d-ce980e49f6c0
    type: testimony
    attestation: first_hand
    speaker:
      id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
      name: Graves, Ryan
    location: file_page 21, printed_page 17
    date: '2023-07-26'
    refs:
      - id: 2ea8697c-666c-4678-814c-68948f421191
        name: House Oversight UAP Hearing, 2023-07-26
      - id: 8aa21b11-068c-4195-91b3-e6dc6fbc4da7
        name: Graves, Ryan
    quote: |-
      There needs to be a location where this information is centralized for processing and there needs to be a two-way communication loop so the operators on the front end have a feedback and can get best practices on how to process information.
    text: |-
      During the House Oversight UAP Hearing, 2023-07-26, Ryan Graves recommended that UAP information be centralized for processing and that a two-way communication loop be established so operators receive feedback and best practices on reporting.
  - id: fe94ab77-64f7-414a-a22f-63c488ba424b
    type: testimony
    attestation: first_hand
    speaker:
      id: dd39321f-5c9b-447b-aac5-012b65d26482
      name: Grusch, David
