        name: Fravor, David
    quote: |-
      I was an accident investigator. So, the biggest thing that you learn...Write it down and do not speculate what you think it is because it will sway your decision. Just write the facts down.
    text: |-
      David Fravor stated he had been an accident investigator and advised UAP witnesses to record facts without speculation about what the object was, to preserve evidentiary value.
