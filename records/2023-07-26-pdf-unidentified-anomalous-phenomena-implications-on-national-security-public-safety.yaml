        name: The New York Times
      - id: d6e75bb7-2682-4296-ad28-b29f3416bc27
        name: 2017 NYT Pentagon UAP Article
    quote: |-
      I was pestered by a friend, and I asked why and he said, you are the one person that they cannot discredit, and you will add credibility to the New York Times article. And so after about six times I said OK.
    text: |-
      David Fravor came forward publicly because a friend told him he was the one person who could not be discredited and that his testimony would add credibility to a New York Times article, prompting him to agree after being asked approximately six times.
  - id: 7afffcc7-390e-4d3b-bdf2-5966ac86741a
    type: opinion
    attestation: first_hand
    speaker:
      id: 94c880df-9b41-4540-8028-fef0240e6efa
      name: Graves, Ryan
    location: printed_page 48
    date: '2023-07-26'
    refs:
      - id: 94c880df-9b41-4540-8028-fef0240e6efa
        name: Graves, Ryan
    quote: |-
      Right now I do not think there is a lot of public options for the everyman to be able to report on this. I think even for professionals that have sensor data that are seeing these on a regular basis they are still hesitant to come forward.
    text: |-
      Ryan Graves stated there is currently very little public option for the general public to report UAP sightings, and even professionals with sensor data who regularly see UAPs remain hesitant to come forward.
