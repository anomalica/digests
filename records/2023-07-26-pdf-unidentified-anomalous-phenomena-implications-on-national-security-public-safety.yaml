        name: Federal Aviation Administration
    quote: |-
      Mr. Graves, one of your main concerns that the FAA currently does not have an official process to receive reports of UAP from pilots or others, correct? Mr. Graves. Correct.
    text: |-
      At the House Oversight UAP Hearing, 2023-07-26, Ryan Graves testified that the Federal Aviation Administration (FAA) currently does not have an official process to receive reports of UAP from pilots or others.
