        name: Carrier Intelligence Center (CVIC)
      - name: Nimitz Carrier Strike Group
    quote: |-
      We had a standard debrief where the backseaters went down to our carrier intel center and briefed would have happened and that was it. No one else talked to us and I was in the top 20 in the battle group. No one came. That captain was aware. The admiral was aware. Nothing was done.
    text: |-
      Following the Tic Tac incident, there was only a standard debrief where the backseaters briefed the carrier intelligence center; no one else questioned the crew.
  - id: 542d6bd2-f7d9-490c-965d-13a9fe0e8943
    type: testimony
    attestation: first_hand
    speaker:
      id: 688e6acb-1e5d-4ea3-a4c6-a9b85603a06f
