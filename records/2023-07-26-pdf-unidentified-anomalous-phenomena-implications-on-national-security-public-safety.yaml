    quote: |-
      PPD-19 process it goes to the intel committees either through PPD-19 or ICD 120. There is not a good way for the intelligence community Inspector General to provide that to other committees, and I asked my information to be sent to the House and Senate Armed Services Committee because there are Title 10 equities at play. But there was no smooth process to do so.
    text: |-
      UAP whistleblower complaints reach the intelligence committees through the Presidential Policy Directive 19 (PPD-19) process or Intelligence Community Directive 120 (ICD 120), but there is no good way for the intelligence community Inspector General to provide them to other committees; David Grusch asked his information to be sent to the House and Senate Armed Services Committees due to Title 10 equities, but there was no smooth process.
