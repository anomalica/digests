      - id: dad8d3e1-3e7c-41f7-bde7-ee0b3b1ba873
        name: Fravor, David
    quote: |-
      I think what we experienced was, like I said, well beyond the material science and the capabilities that we had at the time, that we have currently, or that we are going to have in the next 10 to 20 years.
    text: |-
      David Fravor concluded that what he experienced in 2004 was well beyond the material science and capabilities available at the time, currently, or expected in the next 10 to 20 years.
  - id: ebcebf6f-0b60-48e5-9342-34eed3916487
