      - id: 77aacb13-2c04-41fc-ac60-4dd310448263
        name: Tic Tac Sighting
      - name: AAV
    quote: |-
      Our altitude at this point was about 15,000 feet and a Tic Tac was about 12,000. As we pulled nose onto the object within about a half mile of it, it rapidly accelerated in front of us and disappeared.
    text: |-
      At approximately 4,500 metres altitude, when David Fravor pulled nose onto the Tic Tac within approximately 800 metres of it, the object rapidly accelerated and disappeared.
