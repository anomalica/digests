        name: Water Disturbance
    quote: |-
      we noticed that we saw some whitewater off our right side. It is important to note that the weather on this day was as close to perfect as you could ask for off the coast of San Diego. Clear skies, light winds, calm seas, no whitecaps from waves. So, the whitewater stood out in a large blue ocean.
    text: |-
      During the Tic Tac Sighting, the crew observed a white water disturbance off their right side in otherwise calm seas with clear skies and light winds off the coast of San Diego.
  - id: fe7c1e94-d7ee-4e30-be29-3ee6fe6f6451
    type: observation
    attestation: first_hand
    speaker:
      id: 35b575fb-c118-4ef0-b897-9207203bf57d
      name: Fravor, David
    location: page 13
    date: '2004-11-14'
    refs:
      - id: 35b575fb-c118-4ef0-b897-9207203bf57d
        name: Fravor, David
      - id: bf49b412-95c9-4207-ab9f-03e31b434a69
        name: Tic Tac Sighting
      - id: 05b5b6a8-15d9-47bc-befe-cddf89cc7e67
        name: F/A-18F
      - id: 9eb37385-9b43-4da4-988f-cb10142d5d34
        name: AAV (object)
    quote: |-
      All four of us, because we were an F-18F so we had pilots and WSO in the backseat, looked down and saw a white Tic Tac object with a longitudinal axis pointing north south and moving very abruptly over the water like a ping pong ball.
    text: |-
      During the Tic Tac Sighting, all four crew members of the two F/A-18Fs, including pilots and weapons systems officers in the back seats, saw a white Tic Tac-shaped object with its longitudinal axis pointing north-south, moving very abruptly over the water.
  - id: f5077eee-e66d-41ae-b391-3c01ae81ff3b
    type: observation
    attestation: first_hand
    speaker:
