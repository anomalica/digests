    text: |-
      David Fravor's flight arrived at the location of the Tic Tac at approximately 6,000 metres altitude, at which point the controller called merge plot indicating their radar return was in the same resolution cell as the contact.
  - id: cde6775e-705a-43b7-aac1-41b1a38e61b5
    type: observation
    attestation: first_hand
    speaker:
