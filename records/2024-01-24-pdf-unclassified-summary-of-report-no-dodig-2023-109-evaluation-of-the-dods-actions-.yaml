  - id: 71d1205f-6309-4dbb-af1e-ac6d47b23d87
    type: administrative
    location: printed_page 2, Objective
    refs:
      - id: 76a3f9df-980e-4cf4-b0a2-ed3046c70828
        name: |-
          Evaluation of the DoD's Actions Regarding Unidentified Anomalous Phenomena (DODIG-2023-109)
      - id: 34cb6d19-c6c1-45eb-a988-ff77b84c5f73
        name: United States Department of Defense (DoD)
      - id: 5e6f1c97-7d69-4404-8ab0-a1d4bc0bf8a8
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      The objective of this evaluation was to determine the extent to which the DoD, Military Services, Defense agencies, and Military Department Counterintelligence Organizations (MDCOs) took intelligence, counterintelligence, and force protection actions to detect, report, collect, analyze, and identify unidentified anomalous phenomena (UAP).
    text: |-
      The objective of the evaluation documented in DODIG-2023-109 was to determine the extent to which the United States Department of Defense, Military Services, Defense agencies, and Military Department Counterintelligence Organizations (MDCOs) took intelligence, counterintelligence, and force protection actions to detect, report, collect, analyse, and identify UAP.
  - id: 73f3812d-ce21-4fc3-9207-eb7539b07e7a
    type: administrative
    location: printed_page 2, Background
    refs:
      - id: 63645f54-1d5c-4711-9433-496603199c5d
        name: James M. Inhofe National Defense Authorization Act for Fiscal Year 2023
      - id: 5e6f1c97-7d69-4404-8ab0-a1d4bc0bf8a8
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      The FY 2023 National Defense Authorization Act (NDAA) defined UAP as "unidentified anomalous phenomena," which include: (a) airborne objects that are not immediately identifiable, (b) transmedium objects or devices, and (c) submerged objects or devices that are not immediately identifiable.
    text: |-
      The Fiscal Year 2023 National Defense Authorization Act defined UAP as unidentified anomalous phenomena, which include airborne objects that are not immediately identifiable, transmedium objects or devices, and submerged objects or devices that are not immediately identifiable.
  - id: ad810dac-9868-492f-9870-3cfd2b245085
    type: administrative
    location: printed_page 2, Background
    refs:
      - id: 3fdddd9a-5185-499d-bc2e-c2ff9dd26e74
        name: Office of the Director of National Intelligence (ODNI)
      - id: d576fa79-09b9-4992-9713-aea50b8e5fbe
        name: Preliminary Assessment on UAP
      - id: 5e6f1c97-7d69-4404-8ab0-a1d4bc0bf8a8
        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, U.S. Government or industry developmental programs, foreign adversary systems, and a catchall "other" category.
    text: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, U.S. Government or industry developmental programmes, foreign adversary systems, and a catchall other category.
  - id: c7a7bf98-e4e1-4755-bbb4-fec2b0c11dc9
