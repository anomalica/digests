        name: Unidentified Anomalous Phenomena (UAP)
    quote: |-
      The FY 2022 NDAA defined "transmedium" as objects or devices that are observed to transition between space and the atmosphere, or between the atmosphere and bodies of water, that are not immediately identifiable.
    text: |-
      The Fiscal Year 2022 National Defense Authorization Act defined transmedium as objects or devices that are observed to transition between space and the atmosphere, or between the atmosphere and bodies of water, that are not immediately identifiable.
