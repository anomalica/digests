    text: |-
      In a November 2021 memorandum, the Deputy Secretary of Defense directed the Office of the Under Secretary of Defense for Intelligence and Security (OUSD[I&S]) to establish the Airborne Object Identification and Management Synchronization Group (AOIMSG) as the successor to the Unidentified Aerial Phenomena Task Force (UAPTF) to synchronise efforts across the United States Department of Defense and with other Federal departments and agencies to detect, identify, and characterise objects of interest in special use airspace.
