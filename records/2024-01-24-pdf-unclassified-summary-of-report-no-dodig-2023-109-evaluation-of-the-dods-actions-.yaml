  - id: 57b3feb7-7cfb-421e-9ea7-88659863fa8b
    type: administrative
    attestation: first_hand
    location: page 2, Introduction, Objective
    refs:
      - id: 6754d858-99a1-4f2e-938c-165ec7a87af5
        name: DoD UAP Evaluation, DODIG-2023-109
    quote: |-
      The objective of this evaluation was to determine the extent to which the DoD, Military Services, Defense agencies, and Military Department Counterintelligence Organizations (MDCOs) took intelligence, counterintelligence, and force protection actions to detect, report, collect, analyze, and identify unidentified anomalous phenomena (UAP).
    text: |-
      The objective of the DoD UAP Evaluation, DODIG-2023-109 was to determine the extent to which the DoD, Military Services, Defense agencies, and Military Department Counterintelligence Organizations (MDCOs) took intelligence, counterintelligence, and force protection actions to detect, report, collect, analyze, and identify UAP.
  - id: c2e4471a-5fbb-4496-b835-907ae7c9dd71
    type: administrative
    attestation: second_hand
    location: page 2, Introduction, Background
    date: '2022-12-23'
    refs:
      - id: 4328b949-34f0-4e0d-94e1-c9b8c2985a97
        name: Fiscal Year 2023 (FY2023) National Defense Authorization Act
    quote: |-
      The FY 2023 National Defense Authorization Act (NDAA) defined UAP as "unidentified anomalous phenomena," which include: (a) airborne objects that are not immediately identifiable, (b) transmedium objects or devices, and (c) submerged objects or devices that are not immediately identifiable.
    text: |-
      The FY 2023 National Defense Authorization Act (NDAA) defined UAP as 'unidentified anomalous phenomena,' which include: (a) airborne objects that are not immediately identifiable, (b) transmedium objects or devices, and (c) submerged objects or devices that are not immediately identifiable.
  - id: ec94f8cc-6d0d-469a-aa8b-a97b188f1320
    type: administrative
    attestation: second_hand
    location: page 2, footnote 1
    refs:
      - id: 25002b73-63c5-4b50-a900-7d61aea4324a
        name: FY2022 NDAA UAP Requirements
      - name: Transmedium Travel
    quote: |-
      The FY 2022 NDAA defined "transmedium" as objects or devices that are observed to transition between space and the atmosphere, or between the atmosphere and bodies of water, that are not immediately identifiable.
    text: |-
      The FY 2022 NDAA defined 'transmedium' as objects or devices that are observed to transition between space and the atmosphere, or between the atmosphere and bodies of water, that are not immediately identifiable.
  - id: 6599869b-68dd-44f9-8121-f2288fee1bed
    type: hearsay
    attestation: second_hand
    location: page 2, Introduction, Background
    refs:
      - id: 4f97b438-0419-4f34-b0d3-1152da22c656
        name: DNI UAP Preliminary Assessment 2021-06
      - name: Director of National Intelligence
    quote: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, U.S. Government or industry developmental programs, foreign adversary systems, and a catchall "other" category.
    text: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, US Government or industry developmental programs, foreign adversary systems, and a catchall 'other' category.
  - id: 30fffd0f-c708-4c3d-bc22-b04a66dbdec3
