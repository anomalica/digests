    text: |-
      In Fiscal Year 2019 and Fiscal Year 2020, the United States Congress noted its concern regarding unidentified and unexplained airborne activity in sensitive areas and required the Office of the Under Secretary of Defense for Intelligence and Security (OUSD[I&S]) and the intelligence community to establish an interagency task force and develop a plan to investigate and address the activity.
