  - id: 5ebadcb4-4077-4725-a40f-7e424e1de8fb
    type: hearsay
    attestation: second_hand
    location: page 2, Background
    refs:
      - id: 6bc779f6-22bc-4ec9-bd89-d5190519b8d2
        name: DNI UAP Preliminary Assessment June 2021
      - id: 276ec666-a40c-4046-967d-c7cc682dc76b
        name: Director of National Intelligence
    quote: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP are objects that are not immediately identifiable, lack a single explanation, and fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, U.S. Government or industry developmental programs, foreign adversary systems, and a catchall "other" category.
    text: |-
      According to the Office of the Director of National Intelligence's Preliminary Assessment on UAP, UAP fall into one of five potential explanatory categories: airborne clutter, natural atmospheric phenomena, U.S. Government or industry developmental programs, foreign adversary systems, and a catchall 'other' category.
