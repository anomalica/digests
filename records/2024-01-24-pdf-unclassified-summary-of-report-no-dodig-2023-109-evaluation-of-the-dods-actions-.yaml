        name: Office of Under Secretary of Defense for Intelligence (OUSD(I))
    quote: |-
      In FY 2019 and FY 2020, Congress noted its concern regarding unidentified and unexplained airborne activity in sensitive areas and required the Office of the Under Secretary of Defense for Intelligence and Security (OUSD[I&S]) and the intelligence community (IC) to establish an interagency task force and develop a plan to investigate and address the activity.
    text: |-
      In FY 2019 and FY 2020, Congress noted its concern regarding unidentified and unexplained airborne activity in sensitive areas and required the Office of the Under Secretary of Defense for Intelligence and Security (OUSD(I&S)) and the intelligence community to establish an interagency task force and develop a plan to investigate and address the activity.
