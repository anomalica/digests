    quote: |-
      The FY 2023 National Defense Authorization Act (NDAA) defined UAP as "unidentified anomalous phenomena," which include: (a) airborne objects that are not immediately identifiable, (b) transmedium objects or devices, and (c) submerged objects or devices that are not immediately identifiable.
    text: |-
      The FY 2023 National Defense Authorization Act (NDAA) defined UAP as 'unidentified anomalous phenomena,' which include airborne objects that are not immediately identifiable, transmedium objects or devices, and submerged objects or devices that are not immediately identifiable. This definition was established under Public Law 117-263, signed December 23, 2022.
