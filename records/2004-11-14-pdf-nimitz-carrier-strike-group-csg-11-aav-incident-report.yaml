      The flight descended to between 20-24,000 feet and proceeded to the contact. CDR Fravor did not recall any indications via on-board sensor of the object. Their aircraft was not carrying a Forward Looking Infrared (FLIR) pod onboard.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor descended to between 6,000 and 7,300 metres and proceeded to the contact; he did not recall any indications via on-board sensors and their aircraft was not carrying a forward-looking infrared (FLIR) pod.
