      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor stated the Anomalous Aerial Vehicle (AAV) was 'holding like a Harrier', referring to the AV-8B jet aircraft's ability to hover and perform vertical/short takeoff and landing (V/STOL) via thrust vectoring.
