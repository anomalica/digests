        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      His report differs from CDR Fravor in that he reported the object traveling level at approximately 500-1000 feet at approximately 500 knots.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the FASTEAGLE 01 WSO reported the Anomalous Aerial Vehicle (AAV) travelling level at approximately 150 to 300 metres at approximately 925 kilometres per hour.
