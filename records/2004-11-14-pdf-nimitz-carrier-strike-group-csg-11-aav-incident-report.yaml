      The object, according to the FLIR, appeared stationary (Figure 3). There was no discernable movement from the object with the only closure being a result of the aircraft's movement.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) appeared stationary on Chad Underwood's forward-looking infrared (FLIR) with no discernible movement, only closure resulting from the aircraft's own movement.
