domain_claims:
  - id: c12cf3f9-68c9-4e69-8f68-ef4329383142
    type: administrative
    attestation: first_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: c407cfa8-0e16-4ea9-8f29-0fe270ddd9a6
        name: Nimitz Carrier Strike Group (CSG-11)
    quote: |-
      During the period of approximately 10-16 November 2004, the Nimitz Carrier Strike Group (CSG) was operating off the western coast of the United States in preparation for their deployment to the Arabian Sea.
    text: |-
      During the Nimitz UAP Incident, 2004, the Nimitz Carrier Strike Group (CSG-11) was operating off the western coast of the United States during the period of approximately 2004-11-10 to 2004-11-16 in preparation for deployment to the Arabian Sea.
  - id: 257bebf8-44c4-4868-a3a9-a627fbe29ad0
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 8fb543ec-1e5d-4421-83aa-a2d35af20a2c
        name: USS Princeton
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The USS Princeton on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the CSG.
    text: |-
      During the Nimitz UAP Incident, 2004, the USS Princeton detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the Carrier Strike Group on several occasions.
  - id: 519f8bf3-4290-4ce7-ab02-880fdfced2ca
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The AAVs would descend "very rapidly" from approximately 60,000 feet down to approximately 50 feet in a matter of seconds.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicles (AAVs) would descend very rapidly from approximately 18,000 metres down to approximately 15 metres in a matter of seconds.
  - id: b734bdab-94fb-4094-ad33-24a4de1c2e6d
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      They would then hover or stay stationary on the radar for a short time and depart at high velocities and turn rates.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicles (AAVs) would hover or stay stationary on the radar for a short time and then depart at high velocities and turn rates.
  - id: 91c50d6d-f187-4241-9e3b-1ced756df1c5
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 8fb543ec-1e5d-4421-83aa-a2d35af20a2c
        name: USS Princeton
      - id: 1faf0d13-bb7c-41eb-bd72-73943b0958b3
        name: F/A-18F
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      On 14 November after again detecting the AAV, the USS Princeton took the opportunity of having a flight of two F/A-18Fs returning from a training mission to further investigate the AAV.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the USS Princeton vectored two F/A-18Fs to intercept the Anomalous Aerial Vehicle (AAV) after again detecting it.
  - id: 21119fee-f2cb-491d-ab0f-1b781e522d36
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 8fb543ec-1e5d-4421-83aa-a2d35af20a2c
        name: USS Princeton
      - id: 1faf0d13-bb7c-41eb-bd72-73943b0958b3
        name: F/A-18F
      - id: e5ef562d-1dd0-4e86-9f46-1cd7cca5c3fb
        name: E-2C Hawkeye
    quote: |-
      The USS Princeton took over control of the F/A-18s from the E-2C Airborne Early Warning aircraft
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the USS Princeton took over control of the F/A-18s from the E-2C Hawkeye Airborne Early Warning aircraft.
  - id: fdd27050-abd1-4f2f-b248-d33bd3f96f81
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 1faf0d13-bb7c-41eb-bd72-73943b0958b3
        name: F/A-18F
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      vectored in the F/A-18s for intercept leading to visual contact approximately one mile away from the AAV, which was reported to be "an elongated egg or a 'Tic Tac' shape with a discernable midline horizontal axis"
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the F/A-18Fs achieved visual contact with the Anomalous Aerial Vehicle (AAV) at approximately 1.6 kilometres away, and it was reported to be 'an elongated egg or a Tic Tac shape with a discernible midline horizontal axis'.
  - id: 7da11e64-d81e-4b59-838f-fee53cd2ff28
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      It was "solid white, smooth, with no edges. It was approximately 46 feet in length.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) was described as solid white, smooth, with no edges, and approximately 14 metres in length.
  - id: fa033ea1-a1b9-4099-8d75-796fda779cec
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 1faf0d13-bb7c-41eb-bd72-73943b0958b3
        name: F/A-18F
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
      - id: b09a30cd-b5dd-4876-846c-d2a5c38c6cb1
        name: ATFLIR Pod
    quote: |-
      The F/A-18Fs radar could not obtain a 'lock' on the AAV; however it could be tracked while stationary and at slower speeds with the Forward Looking Infrared (FLIR).
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the F/A-18F radar could not obtain a lock on the Anomalous Aerial Vehicle (AAV), but it could be tracked while stationary and at slower speeds with the forward-looking infrared (FLIR).
  - id: 280db8dd-ee50-4f06-8a8f-bc219c8981c2
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 231f2abb-7725-44b2-841a-d3ce922260b6
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
      - id: 1faf0d13-bb7c-41eb-bd72-73943b0958b3
        name: F/A-18F
    quote: |-
      The AAV did take evasive actions upon intercept by the F/A-18 demonstrating an advanced acceleration (G), aerodynamic, and propulsion capability.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) took evasive action upon intercept by the F/A-18, demonstrating advanced acceleration, aerodynamic, and propulsion capability.
  - id: 52b4ab20-3f2a-4c03-87a9-9987dd474a10
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
      - id: c407cfa8-0e16-4ea9-8f29-0fe270ddd9a6
        name: Nimitz Carrier Strike Group (CSG-11)
    quote: The AAV did not take any offensive action against the CSG
    text: |-
