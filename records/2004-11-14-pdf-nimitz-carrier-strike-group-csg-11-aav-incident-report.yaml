        name: Carrier Strike Group 11 (CSG-11)
    quote: |-
      The USS Princeton was part of the Nimitz Carrier Battle Group, during the period of approximately 10-16 November 2004 while completing Tailored Ships Training Availability (TSTA) in preparation for their deployment to the Arabian Sea.
    text: |-
      During approximately 2004-11-10 to 2004-11-16, the USS Princeton (CG-59) was part of the Nimitz Carrier Battle Group while completing Tailored Ships Training Availability (TSTA) in preparation for deployment to the Arabian Sea.
  - id: d2ee3b68-56e8-40d6-9905-07c12c1666c4
    type: observation
    location: p.3
    date: '2004-11-14'
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
    quote: |-
      During COMPTUX, which is intermediate level training for elements of the Nimitz Carrier Strike Group (CSG) prior to the deployment, the Princeton on several occasions detected multiple AAVs operating in and around the vicinity of the location shown in Figure 1.
    text: |-
      During the Composite Training Unit Exercise (COMPTUEX), the USS Princeton (CG-59) on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the Carrier Strike Group.
  - id: b970671d-bf1c-49d0-b30f-eeca650c3f8c
    type: testimony
    location: p.3
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The Fire Control Officer, {{redacted: ~2 words}} and his technician, FCSS {{redacted: ~2 words}} initially thought the contacts were part of the COMPTUX exercise.
    text: |-
      The Fire Control Officer and his technician aboard the USS Princeton (CG-59) initially thought the Anomalous Aerial Vehicle (AAV) contacts were part of the Composite Training Unit Exercise (COMPTUEX).
  - id: 9972f188-8e89-42d3-9eb4-d639f90820c4
    type: observation
    location: p.3
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: fe4e92e7-cf0f-4a48-818e-139ac34646c3
        name: AN/SPY-1 radar
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      According to Senior Chief {{redacted: ~1 word}} the AAVs would descend from a very high altitude into the scan volume of the AN/SPY-1 at a high velocity. The top of the scan volume would put the AAVs at higher than 60,000 feet.
    text: |-
      The Anomalous Aerial Vehicles (AAVs) detected by the USS Princeton (CG-59) would descend from a very high altitude into the scan volume of the AN/SPY-1 radar at a high velocity, with the top of the scan volume putting the AAVs at higher than approximately 18,000 metres.
  - id: ed7822b1-0390-479c-8361-1ce3b0b00d1f
    type: observation
    location: p.3
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      The AAVs would descend "very rapidly" from approximately 60,000 feet down to approximately 50 feet in a matter of seconds. They would then hover for a short time and depart at high velocities and at turn rates demonstrating an advanced acceleration (G) capability.
    text: |-
      The Anomalous Aerial Vehicles (AAVs) detected by the USS Princeton (CG-59) would descend very rapidly from approximately 18,000 metres down to approximately 15 metres in a matter of seconds, then hover for a short time and depart at high velocities and turn rates demonstrating advanced acceleration (G) capability.
  - id: 35198c9f-30e5-430f-87da-d3b0fd7306e4
    type: opinion
    location: p.3
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      Senior Chief {{redacted: ~1 word}} added that based on his experience, which is 17 years as a Fire Control on Aegis cruisers, the AAV exhibited Ballistic Missile Characteristics in reference to its appearance, velocity, and indications on the radar.
    text: |-
      Based on his 17 years of experience as a Fire Control on Aegis cruisers, the senior chief aboard the USS Princeton (CG-59) assessed that the Anomalous Aerial Vehicle (AAV) exhibited ballistic missile characteristics in its appearance, velocity, and radar indications.
  - id: 7a038a19-0bd0-4341-864a-179c59ca14ea
    type: observation
    location: p.3
    refs:
      - id: fe4e92e7-cf0f-4a48-818e-139ac34646c3
        name: AN/SPY-1 radar
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track of the AAVs and was quickly "dropped" by the radar meaning it was eliminated by the computer to reduce the amount of clutter on the radar, as any other false target is handled.
    text: |-
      Because the AN/SPY-1 radar aboard the USS Princeton (CG-59) was in the mode to handle Air Intercept of conventional aircraft, it never obtained an accurate track of the Anomalous Aerial Vehicles (AAVs) and quickly dropped them to reduce radar clutter, as with any other false target.
  - id: 2ba5ac0d-2529-4118-b922-55e68e747752
    type: opinion
    location: p.3
    refs:
      - id: fe4e92e7-cf0f-4a48-818e-139ac34646c3
        name: AN/SPY-1 radar
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      If the radar were set up in a mode for Ballistic Missile tracking they likely would have had the capability to track the AAV.
    text: |-
      If the AN/SPY-1 radar had been set up in a mode for ballistic missile tracking, the USS Princeton (CG-59) likely would have had the capability to track the Anomalous Aerial Vehicle (AAV).
  - id: e56d249f-a080-437a-b4bf-f99a031daf0e
    type: observation
    location: p.3
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      They were detected three separate times during the week operating off the western coast of the United States and Mexico.
    text: |-
      The Anomalous Aerial Vehicles (AAVs) were detected by the USS Princeton (CG-59) three separate times during the week operating off the western coast of the United States and Mexico.
  - id: 7ed26763-850d-43e2-afae-e03c7a707085
    type: testimony
    location: p.3
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The Tactical Air Officer onboard the Princeton could not identify the radar contact and given the high speed and altitude was perplexed.
    text: |-
      The Tactical Air Officer aboard the USS Princeton (CG-59) could not identify the radar contact and, given the high speed and altitude, was perplexed.
  - id: 9b101a56-1e0e-495b-985a-f395b8c117a8
    type: testimony
    location: p.3
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: fe4e92e7-cf0f-4a48-818e-139ac34646c3
        name: AN/SPY-1 radar
    quote: |-
      The Meteorological Officer (METOC) onboard the Princeton provided a briefing that discussed a high altitude weather phenomena where ice crystals can form and be detected by the AN/SPY-1.
    text: |-
      The Meteorological Officer (METOC) aboard the USS Princeton (CG-59) provided a briefing discussing a high altitude weather phenomenon where ice crystals can form and be detected by the AN/SPY-1 radar.
  - id: ce715b17-d070-4e7f-be92-9315ad4b1ebd
    type: administrative
    location: p.3
    date: '2004-11-14'
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
    quote: |-
      On 14 November 2004, after again detecting an AAV took the opportunity of two F/A-18s airborne in the vicinity to task them for airborne reconnaissance of the AAV.
    text: |-
      On 2004-11-14, after again detecting an Anomalous Aerial Vehicle (AAV), the USS Princeton (CG-59) tasked two airborne F/A-18s in the vicinity for airborne reconnaissance of the AAV.
  - id: 854d9854-0baf-424f-8a85-2601b1dea91a
