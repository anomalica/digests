      - id: 6b2b32e3-425b-4be5-b77b-cbb94445cede
        name: Ballistic Missile Defense
    quote: |-
      the AAV exhibited Ballistic Missile Characteristics in reference to its appearance, velocity, and indications on the radar. Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track
    text: |-
      During the Nimitz UAP Incident, 2004, a USS Princeton Senior Chief with 17 years of Aegis fire control experience assessed that the Anomalous Aerial Vehicle (AAV) exhibited Ballistic Missile characteristics in reference to its appearance, velocity, and radar indications.
  - id: fb31c23d-8712-466b-9654-659918a5f8a4
    type: observation
    attestation: second_hand
    location: page 3, AAV Detection section
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 83aa06e5-6cda-4182-8c25-41a7b4e9f3a3
        name: AN/SPY-1
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      Since the radar was in the mode to handle Air Intercept of conventional aircraft it never obtained an accurate track of the AAVs and was quickly "dropped" by the radar meaning it was eliminated by the computer to reduce the amount of clutter on the radar, as any other false target is handled.
    text: |-
      During the Nimitz UAP Incident, 2004, the AN/SPY-1 radar was in a mode for air intercept of conventional aircraft and never obtained an accurate track of the Anomalous Aerial Vehicles (AAVs); they were dropped by the computer as false targets.
  - id: fdef9166-571f-4778-8bbc-8f93df3bc811
    type: opinion
    attestation: second_hand
    location: page 3, AAV Detection section
    date: 2004-11
    refs:
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
      - id: 83aa06e5-6cda-4182-8c25-41a7b4e9f3a3
        name: AN/SPY-1
      - id: 10ddec84-06c0-419c-bba5-af59663b5abd
        name: Anomalous Aerial Vehicle (AAV)
      - id: 6b2b32e3-425b-4be5-b77b-cbb94445cede
        name: Ballistic Missile Defense
    quote: |-
      If the radar were set up in a mode for Ballistic Missile tracking they likely would have had the capability to track the AAV.
    text: |-
      During the Nimitz UAP Incident, 2004, if the AN/SPY-1 radar had been set up in a ballistic missile tracking mode, it likely would have had the capability to track the Anomalous Aerial Vehicle (AAV).
