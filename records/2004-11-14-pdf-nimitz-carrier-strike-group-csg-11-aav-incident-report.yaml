        name: Water Disturbance
    quote: |-
      the object appeared, according to CDR Fravor: "to recognize us." He assessed this from the fact the object "pointed" (realigned it's axis) in the direction of their aircraft. At this time, according to CDR Fravor, the disturbance on the water ceased.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor stated the Anomalous Aerial Vehicle (AAV) appeared to recognise them, as it realigned its axis in the direction of their aircraft, and at that moment the water disturbance ceased.
