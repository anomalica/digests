    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the FASTEAGLE 01 weapons systems officer (WSO) reported the Anomalous Aerial Vehicle (AAV) travelling level at approximately 150 to 300 metres at approximately 930 kilometres per hour, differing from David Fravor's account.
