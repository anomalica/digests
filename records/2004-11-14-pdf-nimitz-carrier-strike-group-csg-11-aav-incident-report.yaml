        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      According to CDR Fravor, the object's shape was like an elongated egg or a 'Tic Tac' and had a discernable midline horizontal axis. However, the object was uniformly white across the entire body. It was approximately 46 feet in length.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor described the Anomalous Aerial Vehicle (AAV) as shaped like an elongated egg or 'Tic Tac', approximately 14 metres in length, with a discernible midline horizontal axis and uniformly white across the entire body.
  - id: 78223a0d-19dd-4baa-bfc9-501cb743b820
    type: observation
    attestation: second_hand
    location: page 8, F/A-18F Intercept section
    date: '2004-11-14'
    refs:
