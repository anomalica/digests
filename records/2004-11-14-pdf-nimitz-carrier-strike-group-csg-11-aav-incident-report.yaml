    text: |-
      During the Nimitz UAP Incident, 2004, the VMFA-232 commanding officer was flying at approximately 460 kilometres per hour indicated airspeed / 740 kilometres per hour groundspeed at medium altitude of 4,500 to 7,600 metres when he gained radar contact of what he believed to be two F/A-18Fs approaching the Anomalous Aerial Vehicle (AAV) from the west at low altitude of 150 to 1,500 metres.
