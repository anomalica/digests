      Chad Underwood refused an initial request from Carrier Intelligence Center (CVIC) personnel to hand over his recording tapes immediately after the flight, and instead proceeded to the ready room to debrief with David Fravor's flight first, after which copies of the tapes were made and a set was turned in to the intelligence section.
