      During the Nimitz UAP Incident, 2004, the FASTEAGLE 01 weapons systems officer (WSO) noted that sailors in the Carrier Intelligence Center (CVIC) had donned tin-foil caps and wanted to know about the 'UFO flight.' The crew reviewed tapes and described what they had seen.
