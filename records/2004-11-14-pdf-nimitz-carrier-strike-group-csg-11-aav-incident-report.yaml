        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
    quote: |-
      On 14 November following the intercept of the AAV, CDR Fravor reported to CVIC to debrief with Intelligence. He discussed the entire mission and AAV contact with LCDR [redacted] the Carrier Air Wing Intelligence Officer. According to LCDR [redacted] he 'wasn't sure what to do'. He also stated that they 'didn't take it seriously' at first.
    text: |-
      Following the 14 November 2004 intercept, David Fravor reported to the Carrier Intelligence Center (CVIC) to debrief with the Carrier Air Wing Intelligence Officer (a redacted Lieutenant Commander), who admitted he 'wasn't sure what to do' and that they 'didn't take it seriously' at first.
  - id: c5ce1837-6b5d-4f29-922f-baa97c573f95
    type: opinion
    attestation: second_hand
    location: page 12
    date: '2004-11-14'
    refs:
