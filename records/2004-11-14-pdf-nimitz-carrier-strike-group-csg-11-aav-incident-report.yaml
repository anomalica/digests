    quote: |-
      Situational awareness to the object was initially received via sporadic Link-16 tracks (Link-16 is a time division multiple access data-link) via an off-board sensor. Lt {redacted} assumed that the sensor providing the information was the USS Princeton's SPY-1 radar.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, situational awareness to the Anomalous Aerial Vehicle (AAV) was initially received via sporadic Link-16 tracks from an off-board sensor that David Fravor's WSO assumed was the USS Princeton's AN/SPY-1 radar.
