        name: USS Princeton (CG-59)
    quote: |-
      He did not see the object on his radar (raw video) until the USS Princeton directed the contact and gave the E-2 the general direction to steer its radar.
    text: |-
      The Air Control Officer did not see the Anomalous Aerial Vehicle (AAV) on his E-2C radar until the USS Princeton (CG-59) directed the contact and gave the E-2C the general direction to steer its radar.
  - id: a9f357c0-8dcf-4798-a2d8-1e32e5d2aaea
    type: observation
    location: p.5
    refs:
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      LT {{redacted: ~1 word}} initially thought the return was a wave because in a high sea state (4 or greater) the E-2C RADAR can actually detect the waves.
    text: |-
      The Air Control Officer initially thought the E-2C radar return was a wave, because in a high sea state of 4 or greater the E-2C radar can detect waves.
  - id: d5cabf31-834c-4bb2-ba08-e8815d2ec44c
    type: observation
    location: p.5
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
    quote: |-
      Additionally, the target was so low and the return was so faint that without the inputs from the USS Princeton the return would have been missed/ignored.
    text: |-
      The Anomalous Aerial Vehicle (AAV) target was so low and the E-2C radar return so faint that without the inputs from the USS Princeton (CG-59) the return would have been missed or ignored.
  - id: 2d675600-a00e-48c4-9b7a-7a0c61dcd15b
    type: observation
    location: p.5
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      This was even more interesting because the USS Princeton initially reported the target to be at 15,000 - 20,000 feet MSL. Due to the intermittent radar return from the target, velocity was unavailable.
    text: |-
      The USS Princeton (CG-59) initially reported the Anomalous Aerial Vehicle (AAV) target to be at approximately 4,600 to 6,100 metres above mean sea level, and due to the intermittent radar return its velocity was unavailable.
  - id: 2e62129b-b1a5-440c-b2db-8f0ba3819403
    type: administrative
    location: p.5
    date: '2004-11-14'
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Although initially requested by the USS Princeton to attempt a track of the object, the USS Princeton took control of the F/A-18s and the E-2C remained Airborne but was no longer involved in the contact or control. The fighters were being controlled by the USS Princeton for the duration of the contact and intercept.
    text: |-
      During the 2004 USS Nimitz UAP encounter, the USS Princeton (CG-59) took control of the F/A-18s and the E-2C remained airborne but was no longer involved in the contact or control, with the fighters controlled by the USS Princeton for the duration of the contact and intercept.
  - id: 2ba6f1e5-a58d-451c-9c95-84ba5f1c6e85
    type: testimony
    location: p.5
    refs:
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      The E-2 aircrew on board monitored the Air Defense Control (ADC) Net during the contact puzzled while listening to all of the merge calls coming over the net (typical of what you would hear during the Airborne Intercept of an enemy fighter). It was obvious there was something out there and the fighters were taking it seriously.
    text: |-
      The E-2C aircrew monitored the Air Defense Control Net during the contact, hearing merge calls typical of an airborne intercept of an enemy fighter, and concluded the fighters were taking the contact seriously.
  - id: 59259f23-436c-48f4-bb58-e353b459fdcc
    type: observation
    location: p.5
    date: '2004-11-14'
    refs:
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: 2e0e4846-4a0f-42ed-b6c1-a39ea2ecbae2
        name: Strike Fighter Squadron 41 (VFA-41)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      the F/A-18 pilots and weapon system operators (WSOs) from VFA-41 that were able to get both a visual and sensor contact with the AAV on 14 November 2004 at approximately N31 20' W117 10' about 70nm south of the U.S./Mexico Border 30 nm off the Baja Mexico Coast
    text: |-
      On 2004-11-14, F/A-18 pilots and weapon system operators from Strike Fighter Squadron 41 (VFA-41) obtained both visual and sensor contact with the Anomalous Aerial Vehicle (AAV) at approximately N31 20' W117 10', about 130 kilometres south of the U.S./Mexico border and 56 kilometres off the Baja Mexico coast.
  - id: 826e9dd3-26c0-4539-a00e-7c1328429a76
    type: administrative
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: ebbc59cd-bc77-405b-845e-889ff3c21b47
        name: USS Nimitz (CVN-68)
    quote: |-
      Lt. Col {{redacted: ~1 word}} Commanding Officer VMFA-232, was flying a single-seat F/A-18C that launched from the USS Nimitz at approximately 1030L to conduct a Functional Check Flight of an aircraft that had recently completed significant maintenance.
    text: |-
      The Commanding Officer of Marine Fighter Attack Squadron 232 (VMFA-232) was flying a single-seat F/A-18C that launched from the USS Nimitz (CVN-68) at approximately 10:30 local time to conduct a Functional Check Flight of an aircraft that had recently completed significant maintenance.
  - id: 13fdf7ff-1094-443f-841f-92cc50028377
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: |-
      He noted the weather that day was blue skies, no clouds, and unlimited visibility.
    text: |-
      On 2004-11-14, the weather was blue skies, no clouds, and unlimited visibility, according to the Commanding Officer of Marine Fighter Attack Squadron 232 (VMFA-232).
  - id: c01e2870-4be0-4956-92a1-a04e9e34708f
    type: testimony
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      After 30 minutes into his flight he received a radio call from his air controller asking him to investigate an unidentified airborne contact. This was not a standard request.
    text: |-
      About 30 minutes into his flight, the Commanding Officer of Marine Fighter Attack Squadron 232 (VMFA-232) received a non-standard radio call from his air controller asking him to investigate an unidentified airborne contact.
  - id: 8df5f371-824b-4b0a-abbd-af17f0f3520c
    type: testimony
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: |-
      Additionally the controller asked if he had ordnance onboard, which was odd since no controller had ever asked that question during a situation of identifying an unknown contact over U.S. or International territory. He responded that he had no ordnance onboard.
    text: |-
      The air controller asked the Commanding Officer of Marine Fighter Attack Squadron 232 (VMFA-232) if he had ordnance onboard, which was odd as no controller had ever asked that during identification of an unknown contact, and he responded that he had no ordnance onboard.
  - id: 6890f1af-1b61-4252-bffe-3f227514b4f5
    type: observation
    location: p.6
    date: '2004-11-14'
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
    quote: The object was reported to be at "slow speed and low altitude".
    text: |-
      The Anomalous Aerial Vehicle (AAV) was reported to the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer to be at slow speed and low altitude.
  - id: 8606cb8e-727e-41d6-8e4f-fe07d595dcad
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      While enroute at approximately 250 knots indicated/400 knots groundspeed at medium altitude (15-25,000 feet), he gained radar contact of what he believed to be two F/A-18Fs that were approaching the AAV from the west at low altitude (500-5,000 feet).
    text: |-
      While enroute at approximately 460 kilometres per hour indicated and 740 kilometres per hour groundspeed at 4,600 to 7,600 metres altitude, the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer gained radar contact of what he believed to be two F/A-18Fs approaching the Anomalous Aerial Vehicle (AAV) from the west at low altitude of approximately 150 to 1,500 metres.
  - id: cf2884ae-6e3f-4372-ab9d-1aa59617b996
    type: testimony
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The controller informed him to remain above 10,000 feet, as there was other fighter traffic at low altitude investigating the AAV.
    text: |-
      The air controller informed the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer to remain above approximately 3,000 metres as there was other fighter traffic at low altitude investigating the Anomalous Aerial Vehicle (AAV).
  - id: 4e22e0d5-6814-42cb-b8b6-30c847209cd5
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      As he approached approximately 15nm from the AAV descending through approximately 15,000 feet, he could see a water disturbance in the ocean surface. He recalled that the sea state was low (calm).
    text: |-
      As he approached approximately 28 kilometres from the Anomalous Aerial Vehicle (AAV), descending through approximately 4,600 metres, the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer could see a water disturbance on the ocean surface, with the sea state low and calm.
  - id: afa4f2ee-d614-40e5-92d4-4042b5fbdf25
    type: testimony
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      At approximately 5-10 nm away from the AAV, the controller told him to "skip it" and return to his operating area. Since he was close he elected to fly over the water disturbance to try and see what was causing it.
    text: |-
      At approximately 9 to 19 kilometres away from the Anomalous Aerial Vehicle (AAV), the controller told the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer to skip it and return to his operating area, but being close he elected to fly over the water disturbance to see what was causing it.
  - id: 87a618ba-d686-4ffe-b260-fa110a1e7de0
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The disturbance appeared to be 50 to 100 meters in diameter and close to round. It was the only area and type of whitewater activity that could be seen and reminded him of images of something rapidly submerging from the surface like a submarine or ship sinking.
    text: |-
      The water disturbance observed by the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer appeared to be 50 to 100 metres in diameter and close to round, the only area of whitewater activity visible, reminding him of something rapidly submerging like a submarine or ship sinking.
  - id: 8e40d389-b904-450e-aa53-2ce9881b44a9
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      As he was flying away he could see the disturbance clearing and could no longer identify the place where it occurred. He did not see any object or vessel associated with the disturbance either above the surface, on the surface, or below the surface.
    text: |-
      As the Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer flew away, the water disturbance was clearing and he could no longer identify where it had occurred, and he did not see any object or vessel associated with it above, on, or below the surface.
  - id: 0b1b164b-b11a-40f2-afb6-0c8345fbd5ec
    type: observation
    attestation: first_hand
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      He also never made visual contact with the other fighter aircraft that were vectored to the location or the AAV.
    text: |-
      The Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer never made visual contact with the other fighter aircraft vectored to the location or with the Anomalous Aerial Vehicle (AAV).
  - id: e64846bc-b199-4a05-bf06-7101056433b9
    type: opinion
    location: p.6
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      It is possible that the disturbance was being caused by an AAV but that the AAV was 'cloaked' or invisible to the human eye.
    text: |-
      It is possible the water disturbance was being caused by an Anomalous Aerial Vehicle (AAV) that was cloaked or invisible to the human eye.
  - id: 1bd4ed7a-2ef2-4986-97bc-903db775e716
    type: administrative
    location: p.6
    date: '2004-11-14'
    refs:
      - id: ac13d129-b9d6-4a4d-9239-cade8e1fb753
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: ebbc59cd-bc77-405b-845e-889ff3c21b47
        name: USS Nimitz (CVN-68)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Lt Col {{redacted: ~1 word}} recovered aboard the Nimitz at approximately 1200L. He reported to the Carrier Intelligence Center (CVIC) and was asked by his Intelligence Officer, 1stLt {{redacted: ~2 words}} if he saw the "supersonic Tic Tac"?
    text: |-
      The Marine Fighter Attack Squadron 232 (VMFA-232) Commanding Officer recovered aboard the USS Nimitz (CVN-68) at approximately 12:00 local time and was asked by his Intelligence Officer if he saw the 'supersonic Tic Tac'.
  - id: e9d8a504-d3eb-4d77-8761-a2073e07f87c
    type: administrative
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 2e0e4846-4a0f-42ed-b6c1-a39ea2ecbae2
        name: Strike Fighter Squadron 41 (VFA-41)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      CDR Fravor, Commanding Officer VFA-41, was the pilot of FastEagle 01. He and LT {{redacted: ~2 words}} were in the lead aircraft of the first F/A-18F section airborne that day from VFA-41, call sign FastEagle 01.
    text: |-
      David Fravor, Commanding Officer of Strike Fighter Squadron 41 (VFA-41), was the pilot of FastEagle 01, the lead aircraft of the first F/A-18F section airborne from VFA-41 on 2004-11-14.
  - id: 17b45487-4e79-40d5-a319-bf55ebbb9e0c
    type: administrative
    location: p.7
    date: '2004-11-14'
    refs:
      - id: a69284b3-f41c-438a-9410-53aa2e9cf445
        name: Alex Dietrich
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      FASTEAGLE 02 Pilot: LT Alex 'Cardiac' Dietrich, USN/WSO: LCDR {{redacted: ~2 words}}, USN
    text: |-
      Alex Dietrich was the pilot of FastEagle 02 during the 2004 USS Nimitz UAP encounter.
  - id: 5f94ddfb-3823-4af6-b0b0-61e5f60f0fea
    type: administrative
    location: p.7
    date: '2004-11-14'
    refs:
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      After they completed their training the E-2C controller handed them off to the USS Princeton callsign 'Poison' where they received vectors via Bearing Range Altitude Aspect (BRAA) to an unknown contact flying into the working area from the south.
    text: |-
      After completing their training portion, the FastEagle flight was handed off by the E-2C controller to the USS Princeton (CG-59), callsign Poison, where they received Bearing Range Altitude Aspect (BRAA) vectors to an unknown contact flying into the working area from the south.
  - id: c00bb912-0e56-44c0-b7df-22ebbaa7810b
    type: administrative
    location: p.7
    date: '2004-11-14'
    refs:
      - id: d95a625f-2c4a-40cb-accc-a5b24e82d074
        name: AIM-9 Sidewinder
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      LT {{redacted: ~1 word}} told Poison control that they had two captive training AIM-9Ms (CATM-9) and no other ordnance.
    text: |-
      The FastEagle flight carried two captive training AIM-9M Sidewinders and no other ordnance during the 2004-11-14 intercept.
  - id: 17c71e79-f6d7-40be-8849-7fb1f4a024f6
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      CDR Fravor did not recall any indications via on-board sensor of the object. Their aircraft was not carrying a Forward Looking Infrared (FLIR) pod onboard.
    text: |-
      David Fravor did not recall any indication of the object via on-board sensor, and the lead F/A-18F was not carrying a forward-looking infrared (FLIR) pod onboard.
  - id: 5ee2eeb8-4e21-4d21-aad3-0d6ab081a5d7
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 787a947b-f020-4f9a-bac8-72b82e5c1475
        name: AN/APG-73 radar
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      As CDR Fravor remembers it, the Radar Attack Display was clean (no targets). Their F/A-18F had an APG-73 radar and was set to the following parameters: Range While Search (RWS), Range Gated High, 80NM scale
    text: |-
      David Fravor's F/A-18F had an AN/APG-73 radar set to Range While Search (RWS), Range Gated High, on the 150 kilometre scale, and the Radar Attack Display was clean with no targets.
  - id: 6fdef924-e715-4e2a-89f8-794811e57dfc
    type: observation
    location: p.7
    date: '2004-11-14'
    refs:
      - id: a89b8eec-51fe-4f69-bf98-89d3a8957a50
        name: Link-16
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: fe4e92e7-cf0f-4a48-818e-139ac34646c3
        name: AN/SPY-1 radar
    quote: |-
      Situational awareness to the object was initially received via sporadic Link-16 tracks (Link-16 is a time division multiple access data-link) via an off-board sensor. Lt {{redacted: ~1 word}} assumed that the sensor providing the information was the USS Princeton's SPY-1 radar.
    text: |-
      During the 2004-11-14 intercept, situational awareness to the Anomalous Aerial Vehicle (AAV) was initially received via sporadic Link-16 tracks from an off-board sensor, assumed to be the USS Princeton's AN/SPY-1 radar.
  - id: 04992ee1-e63a-4ba1-9ab4-8733eaf18e80
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      According to CDR Fravor the first indication he had of the unknown contact was a visual of a disturbance on the water below the AAV. As he scanned the area he gained a visual on the object.
    text: |-
      The first indication David Fravor had of the unknown contact was a visual of a disturbance on the water below the Anomalous Aerial Vehicle (AAV), after which he gained a visual on the object itself.
  - id: a4192659-0ca2-4380-a286-8f0698f1d6ab
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      when asked to describe the disturbance on the water he stated that it was localized underneath the object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
    text: |-
      David Fravor described the water disturbance as localised underneath the Anomalous Aerial Vehicle (AAV), not appearing as a trail or wake, looking like frothy waves and foam almost as if the water was boiling.
  - id: 19ea9cef-8c4d-421a-b971-55a3e38720e3
    type: observation
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: a69284b3-f41c-438a-9410-53aa2e9cf445
        name: Alex Dietrich
    quote: |-
      At this point CDR Fravor detached FASTEAGLE02, which held at approximately 20,000 feet, and FASTEAGLE01 descended to between 12-16,000 feet.
    text: |-
      During the intercept, David Fravor detached FastEagle 02, which held at approximately 6,100 metres, while FastEagle 01 descended to between approximately 3,700 and 4,900 metres.
  - id: a8858132-d923-4d8c-a36b-a467daf0ecf3
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 4d7e3d87-ae73-4f82-8bbe-fad543b58c7d
        name: Joint Helmet Mounted Cueing System
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      CDR Fravor attempted a "helmet lock" that was unsuccessful. It is important to note that CDR Fravor was using the Joint Helmet Mounted Cuing System which will cue the aircraft sensors such as the radar to 'lock on' to what the pilot is looking at and it also has a recording capability.
    text: |-
      David Fravor attempted an unsuccessful helmet lock using the Joint Helmet Mounted Cueing System during the 2004-11-14 intercept.
  - id: dc17f588-1583-4751-9886-de0b726958bf
    type: testimony
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.7-8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 4d7e3d87-ae73-4f82-8bbe-fad543b58c7d
        name: Joint Helmet Mounted Cueing System
    quote: |-
      CDR Fravor stated that the helmet's recording capability was rarely used therefore he did not think to use it that day.
    text: |-
      David Fravor did not think to use the recording capability of the Joint Helmet Mounted Cueing System that day because its recording capability was rarely used.
  - id: d1aa596d-59ac-402b-9f4b-12fc1e632be3
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c42f4a70-d8a5-4760-8e5a-f6e3adf9bb24
        name: AV-8B Harrier
    quote: |-
      CDR Fravor stated that the object was "holding like a Harrier." (Referring to the AV-8B jet aircraft, which is capable of hovering and Vertical/Short Takeoff and Landing (V/STOL) via thrust vectoring.)
    text: |-
      David Fravor described the Anomalous Aerial Vehicle (AAV) as holding like a Harrier, referring to the AV-8B aircraft capable of hovering and Vertical/Short Takeoff and Landing (V/STOL) via thrust vectoring.
  - id: 370acb8a-2479-4fb1-87b1-1b100cc39912
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      According to CDR Fravor, the object's shape was like an elongated egg or a 'Tic Tac' and had a discernable midline horizontal axis. However, the object was uniformly white across the entire body. It was approximately 46 feet in length.
    text: |-
      David Fravor described the Anomalous Aerial Vehicle (AAV) shape as an elongated egg or 'Tic Tac' with a discernable midline horizontal axis, uniformly white across the entire body, and approximately 14 metres in length.
  - id: 76d1e777-e952-4a3a-b95a-14d583ad9eab
    type: observation
    location: p.8
    date: '2004-11-14'
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      LT {{redacted: ~1 word}} described it as "solid white, smooth, with no edges. It was uniformly colored with no nacelles, pylons, or wings." When asked to describe the appearance, if it glowed or reflected sunlight he said, "neither, it looked like it had a white candy-coated shell, almost like a white board."
    text: |-
      David Fravor's weapon system operator described the Anomalous Aerial Vehicle (AAV) as solid white, smooth, with no edges, uniformly coloured with no nacelles, pylons, or wings, looking like it had a white candy-coated shell almost like a white board, and neither glowing nor reflecting sunlight.
  - id: 33da232c-08da-4fb4-98b1-ef7111b5cb91
    type: observation
    location: p.8
    date: '2004-11-14'
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      His report differs from CDR Fravor in that he reported the object traveling level at approximately 500-1000 feet at approximately 500 knots.
    text: |-
      David Fravor's weapon system operator reported the Anomalous Aerial Vehicle (AAV) travelling level at approximately 150 to 300 metres at approximately 930 kilometres per hour, differing from David Fravor's account.
  - id: 75b32d3a-5a9a-4fd4-9410-5d319fc9e844
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      The object was pointed in a north/south orientation and was moving both north & south and east & west, while maintaining a consistent altitude. These displacements, according to CDR Fravor, were minor.
    text: |-
      The Anomalous Aerial Vehicle (AAV) was pointed in a north/south orientation and was moving both north-south and east-west while maintaining a consistent altitude, with the displacements being minor according to David Fravor.
  - id: 26cda5d9-8c29-4d41-bfec-06af9d404f6a
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      They began the decent as they rolled in from about 10,000ft and approximately 350 knots to take the object close aboard. CDR Fravor pulled nose on and then pulled trail (aft) of the object.
    text: |-
      David Fravor began a descent from about 3,000 metres and approximately 650 kilometres per hour to take a close aboard pass with the Anomalous Aerial Vehicle (AAV) to visually identify it, pulling nose on and then pulling trail aft of the object.
  - id: a5c6d62b-310c-4d1d-b342-542bcf42c2e9
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      As they were maneuvering, the object appeared, according to CDR Fravor: "to recognize us." He assessed this from the fact the object "pointed" (realigned it's axis) in the direction of their aircraft. At this time, according to CDR Fravor, the disturbance on the water ceased.
    text: |-
      As David Fravor manoeuvred, the Anomalous Aerial Vehicle (AAV) appeared to recognise the aircraft by pointing or realigning its axis toward them, and at this time the disturbance on the water ceased.
  - id: 49f52e76-fcc5-443e-99ff-1d6b695fc67d
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
    quote: |-
      As they completed this maneuver, the object ascended quickly and pulled lift vector on and aft of them at a supersonic speed.
    text: |-
      As David Fravor completed his manoeuvre, the Anomalous Aerial Vehicle (AAV) ascended quickly and pulled lift vector on and aft of the F/A-18 at a supersonic speed.
  - id: 37a8de8e-8300-407f-b0a6-e879c938ccae
    type: observation
    location: p.8
    date: '2004-11-14'
    refs:
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Poison initially reported that the "picture was clean" (no contact) but then stated "you're not going to believe this, its at your CAP" meaning that the AAV had flown to their training CAP, which was located in the southern end of the training area and had climbed to approximately 24,000 feet.
    text: |-
      After the Anomalous Aerial Vehicle (AAV) ascended, the USS Princeton (CG-59) initially reported the picture was clean with no contact, then reported the AAV had flown to the flight's training combat air patrol at the southern end of the training area and climbed to approximately 7,300 metres.
  - id: ebbc6ece-e32f-46a4-8678-738fa165207f
    type: observation
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      CDR Fravor stated that the flight attempted to locate both the object and the disturbance with no success. CDR Fravor stated that nothing was seen on the surface or subsurface and that there were no indications of the previous disturbance.
    text: |-
      David Fravor's flight attempted to locate both the Anomalous Aerial Vehicle (AAV) and the water disturbance with no success, and nothing was seen on the surface or subsurface with no indications of the previous disturbance.
  - id: c68d570c-34a2-4208-87cf-d95b1580beb4
    type: administrative
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: ebbc59cd-bc77-405b-845e-889ff3c21b47
        name: USS Nimitz (CVN-68)
    quote: Following the engagement, the flight rejoined and returned to the USS Nimitz.
    text: |-
      Following the engagement, David Fravor's flight rejoined and returned to the USS Nimitz (CVN-68).
  - id: d9603641-0bbf-4ab0-9fcd-08fc5d6e18aa
    type: testimony
    attestation: first_hand
    speaker:
      id: c09e3558-1732-4676-a218-d67d285d98ef
      name: David Fravor
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
    quote: |-
      he stated that- "the jets were brand new, less than 100 hrs on them. They were working perfectly."
    text: |-
      David Fravor reported that the jets were brand new with less than 100 hours on them and were working perfectly, with no indications of system malfunction.
  - id: 1d30f64f-8869-4b4c-b93e-1b218351b39d
    type: testimony
    location: p.8
    date: '2004-11-14'
    refs:
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: a89b8eec-51fe-4f69-bf98-89d3a8957a50
        name: Link-16
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      LT {{redacted: ~1 word}} when asked, said that all aircraft systems were functional. That there were no mission computer issues or avionics issues and that there was no radio or communication interference and that they had entry into the Link-16 network.
    text: |-
      David Fravor's weapon system operator reported that all aircraft systems were functional with no mission computer or avionics issues, no radio or communication interference, and entry into the Link-16 network.
  - id: d7830c4c-0e0b-440f-9587-be77ff203111
    type: administrative
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
    quote: |-
      The flight met up with LT {{redacted: ~2 words}} and LT Chad Underwood's flight in the paraloft and passed what they had seen.
    text: |-
      David Fravor's flight met up with the flight of Chad Underwood in the paraloft and passed on what they had seen.
  - id: 89365686-1146-4348-af28-d37d5a447f9b
    type: observation
    location: p.8
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      LT {{redacted: ~1 word}} noted that the sailors in CIVC had donned tin-foil caps and wanted to know about the "UFO flight."
    text: |-
      When David Fravor's flight proceeded to the Carrier Intelligence Center, the sailors there had donned tin-foil caps and wanted to know about the 'UFO flight'.
  - id: 5bffb4c8-372d-495f-aca6-9c314f702baf
    type: testimony
    location: p.8
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      He was not asked to sign any non-disclosure agreement and he is uncertain how far up the chain the reporting went past his commanding officer.
    text: |-
      The crew of David Fravor's flight was not asked to sign any non-disclosure agreement, and they were uncertain how far up the chain the reporting went past their commanding officer.
  - id: a36832a4-3b68-4334-a8d6-30829178f424
    type: administrative
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 2e0e4846-4a0f-42ed-b6c1-a39ea2ecbae2
        name: Strike Fighter Squadron 41 (VFA-41)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Lt Underwood was a member of VFA-41 and was the Weapons and Sensors Officer (WSO) flying with LT {{redacted: ~2 words}}. They were a part of the second F/A-18F section airborne that day from VFA-41. Their flight launched following the FASTEAGLE flight.
    text: |-
      Chad Underwood was a member of Strike Fighter Squadron 41 (VFA-41) and was the Weapons and Sensors Officer flying in the second F/A-18F section airborne on 2004-11-14, which launched following the FastEagle flight.
  - id: 50df62a6-e23c-40f9-8816-95c76f7d7b7a
    type: administrative
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      FASTEAGLE flight told LT Underwood's flight what they saw and to try to see and record what they could.
    text: |-
      The FastEagle flight told Chad Underwood's flight what they saw and to try to see and record what they could.
  - id: f97dfd26-fd35-4a20-a2e0-fa2f6c2183d6
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
    quote: |-
      According to LT Underwood it was a clear day. There were no clouds and there was a discernable blue horizon. The time was approximately 1500L.
    text: |-
      According to Chad Underwood it was a clear day with no clouds and a discernable blue horizon at approximately 15:00 local time during the second F/A-18F flight on 2004-11-14.
  - id: 4419dbae-a774-4051-b150-e7a36c6e2250
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
    quote: |-
      They flew at 20,000 feet and were flying a max endurance profile at approximately 300 knots ground speed. All on board systems were functioning normally. The radar was in a standard search mode (RWS/ 80NM/ 4bar/ intr) and the FLIR was in L+S slave (the FLIR would point in direction of an L+S track).
    text: |-
      Chad Underwood's jet flew at approximately 6,100 metres on a max endurance profile at approximately 560 kilometres per hour ground speed, with all on-board systems functioning normally, the radar in standard search mode, and the forward-looking infrared (FLIR) in L+S slave.
  - id: 1ddaf609-6205-4ef8-b103-0596c06fe604
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: a89b8eec-51fe-4f69-bf98-89d3a8957a50
        name: Link-16
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      There were no radio or communication interference and they had entry into the Link-16 network. Initial awareness of an object came via the radar. According to the radar display, the initial tracks were at approximately 30-40 nm to the south of the aircraft.
    text: |-
      On Chad Underwood's flight there was no radio or communication interference and they had entry into the Link-16 network, with initial awareness of the object coming via the radar at approximately 56 to 74 kilometres to the south of the aircraft.
  - id: 8d6b293e-f6da-4501-8594-ec136032bd94
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
    quote: |-
      LT Underwood was controlling the radar and FLIR and attempted multiple times to transition the radar to Single Target Track (STT) mode on the object. The radar could not take a lock, the b-sweep would raster around the hit, build an initial aspect vector (which never stabilized) and then would drop and continue normal RWS b-sweep.
    text: |-
      Chad Underwood attempted multiple times to transition the radar to Single Target Track (STT) mode on the object, but the radar could not take a lock; the b-sweep would raster around the hit, build an initial aspect vector that never stabilised, then drop and continue normal Range While Search b-sweep.
  - id: dd8cfc2e-5fef-4537-8690-36ca7bcd31a3
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      When asked, LT Underwood stated that there were no jamming cues (strobe, champagne bubbles, "any normal EA indications"). It "just appeared as if the radar couldn't hack it." The radar couldn't receive enough information to create a single target track file.
    text: |-
      Chad Underwood observed no jamming cues during the radar lock attempts on the Anomalous Aerial Vehicle (AAV), describing it as if the radar could not receive enough information to create a single target track file.
  - id: 0be454eb-7373-45f1-8aab-b56a0d632b5f
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9-10
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The FLIR showed an object at 0 ATA and approximately -5deg elevation (Figure 2). According to LT Underwood, "the target was best guess co-altitude or a few thousand feet below," estimating the object to be between 15-20 thousand feet.
    text: |-
      The forward-looking infrared (FLIR) on Chad Underwood's aircraft showed the Anomalous Aerial Vehicle (AAV) at 0 antenna train angle and approximately -5 degrees elevation, estimated to be co-altitude or a few thousand feet below, between approximately 4,600 and 6,100 metres.
  - id: 62b191d7-a57f-4908-83ee-f40c22f15465
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.9-10
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The object, according to the FLIR, appeared stationary (Figure 3). There was no discernable movement from the object with the only closure being a result of the aircraft's movement. As LT Underwood watched the object it began to move out of FLIR field of view to the left.
    text: |-
      According to the forward-looking infrared (FLIR), the Anomalous Aerial Vehicle (AAV) appeared stationary with no discernable movement, the only closure being a result of the aircraft's movement, before it began to move out of the FLIR field of view to the left.
  - id: a0cfa88e-5c9d-46de-9f8c-cdaaa163fc46
    type: observation
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.10
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      LT Underwood made no attempt to slew the FLIR and subsequently lost situational awareness to the object. The Flight continued with training mission with no further contact with object.
    text: |-
      Chad Underwood made no attempt to slew the forward-looking infrared (FLIR) and subsequently lost situational awareness to the Anomalous Aerial Vehicle (AAV), after which the flight continued the training mission with no further contact.
  - id: 5fe34d4d-3c07-47f4-a9c8-2652d41d5012
    type: testimony
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.11
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      LT Underwood was clear in that he couldn't confirm that it was the same object as described by FASTEAGLE flight. He never had visual, only seeing the object via the FLIR.
    text: |-
      Chad Underwood could not confirm that the object he observed was the same one described by the FastEagle flight, as he never had visual contact and only saw it via the forward-looking infrared (FLIR).
  - id: b31c83b2-b188-4965-a5e2-bc2ee8d96e81
    type: testimony
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.11
    date: '2004-11-14'
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
    quote: |-
      LT Underwood said that the CIVC section attempted to collect his tapes but he refused. They proceeded to their ready room where they debriefed with CDR Fravor and his flight.
    text: |-
      After Chad Underwood's section returned to the ship, the Carrier Intelligence Center section attempted to collect his tapes but he refused, and the flight then debriefed with David Fravor and his flight in the ready room.
  - id: 9e63aca8-cc6b-4333-a134-de9b3b7b839b
    type: testimony
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
      name: Chad Underwood
    location: p.11
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
    quote: |-
      Copies of the tapes were made with a set being turned into the intelligence section. LT Underwood was not asked to sign any non-disclosure agreement and he is uncertain how far up the chain the reporting went past his commanding officer.
    text: |-
      Copies of the tapes from Chad Underwood's flight were made, with a set turned in to the intelligence section, and Chad Underwood was not asked to sign any non-disclosure agreement and was uncertain how far up the chain the reporting went past his commanding officer.
  - id: d732d6fb-5b0f-4472-b958-7d11ff869a57
    type: testimony
    attestation: first_hand
    speaker:
      id: 29f2befa-fe75-484b-a9e8-53a320e66c84
