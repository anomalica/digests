      - id: 3fd3124e-e7aa-4cc2-b50d-fffb03539f2b
        name: Carrier Intelligence Center (CVIC)
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
    quote: |-
      LCDR [redacted] added that they likely would have not given as much attention if it came from a lesser-experienced aviator.
    text: |-
      The Carrier Air Wing Intelligence Officer stated that the Anomalous Aerial Vehicle (AAV) report from David Fravor would not have received as much attention had it come from a lesser-experienced aviator, reflecting the credibility weight given to the source's seniority.
