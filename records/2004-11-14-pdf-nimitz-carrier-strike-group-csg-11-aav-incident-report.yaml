    text: |-
      During the Nimitz UAP Incident, 2004, it was assessed that any live fire from the USS Louisville would have been coordinated throughout the Carrier Strike Group (CSG) and all air traffic would have been well aware of the launch, meaning aircraft would not have been vectored to intercept a US weapon in-flight.
