        name: Combat Air Patrol (CAP)
    quote: |-
      As they completed this maneuver, the object ascended quickly and pulled lift vector on and aft of them at a supersonic speed. CDR Fravor commanded the radar through the Short Range radar set and asked for a picture from Poison. Poison initially reported that the "picture was clean" (no contact) but then stated "you're not going to believe this, its at your CAP" meaning that the AAV had flown to their training CAP, which was located in the southern end of the training area and had climbed to approximately 24,000 feet.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, after the manoeuvre, the Anomalous Aerial Vehicle (AAV) ascended quickly and pulled lift vector on and aft of the F/A-18 at supersonic speed, then disappeared. When David Fravor requested a radar picture from USS Princeton (callsign Poison), Poison initially reported 'picture was clean' then stated 'you're not going to believe this, it's at your CAP', indicating the AAV had flown to their training combat air patrol (CAP) at approximately 7,300 metres altitude.
