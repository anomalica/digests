        name: Nimitz UAP Incident, 2004
    quote: |-
      CAPT [redacted] confirmed that the MISREP was received via email on or about 14 November 2004. Since this MISREP was completed during training and preparation for deployment it was read and acknowledged by 3rd Fleet N2 but was not forwarded to anyone up the chain of command. Additionally CAPT [redacted] stated that it was not likely archived but deleted at some point later as there is no requirement to keep these reports.
    text: |-
      The 3rd Fleet Intelligence deputy N2 confirmed that the Mission Report (MISREP) was received via email on or about 14 November 2004 but was not forwarded up the chain of command and was likely later deleted, as there was no requirement to retain training MISREPs.
  - id: 7c424e04-edb4-40b0-b97e-ca069f762032
