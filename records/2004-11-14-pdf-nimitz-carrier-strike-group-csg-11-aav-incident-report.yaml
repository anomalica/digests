    quote: |-
      When asked, LT Underwood stated that there were no jamming cues (strobe, champagne bubbles, "any normal EA indications"). It "just appeared as if the radar couldn't hack it." The radar couldn't receive enough information to create a single target track file.
    text: |-
      During the Nimitz UAP Incident, 2004, Chad Underwood stated there were no jamming cues — no strobe, champagne bubbles, or normal electronic attack (EA) indications — and that the radar 'just appeared as if it couldn't hack it' because it couldn't receive enough information to create a single target track file.
