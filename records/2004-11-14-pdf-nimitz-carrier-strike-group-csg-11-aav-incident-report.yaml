    text: |-
      The 3rd Fleet Intelligence (N2) Mission Report (MISREP) for the Anomalous Aerial Vehicle (AAV) intercept was received via email on or about 14 November 2004, read and acknowledged, but not forwarded up the chain of command; it was likely later deleted as there is no requirement to keep training MISREPs.
