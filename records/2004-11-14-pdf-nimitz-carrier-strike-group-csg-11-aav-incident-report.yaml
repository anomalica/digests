    quote: |-
      LT {{redacted: ~1 word}} described it as "solid white, smooth, with no edges. It was uniformly colored with no nacelles, pylons, or wings." When asked to describe the appearance, if it glowed or reflected sunlight he said, "neither, it looked like it had a white candy-coated shell, almost like a white board."
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the weapons systems officer (WSO) of FASTEAGLE 01 described the Anomalous Aerial Vehicle (AAV) as 'solid white, smooth, with no edges. It was uniformly colored with no nacelles, pylons, or wings,' and looking 'like it had a white candy-coated shell, almost like a white board.'
