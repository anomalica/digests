    quote: |-
      Situational awareness to the object was initially received via sporadic Link-16 tracks (Link-16 is a time division multiple access data-link) via an off-board sensor. Lt {{redacted: ~1 word}} assumed that the sensor providing the information was the USS Princeton's SPY-1 radar.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor and the weapons systems officer (WSO) received situational awareness of the Anomalous Aerial Vehicle (AAV) initially via sporadic Link-16 tracks from an off-board sensor, which the WSO assumed was the USS Princeton's SPY-1 radar. The Radar Attack Display was clean with no targets.
