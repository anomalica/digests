      LT Underwood said that the CIVC section attempted to collect his tapes but he refused. They proceeded to their ready room where they debriefed with CDR Fravor and his flight. Copies of the tapes were made with a set being turned into the intelligence section.
    text: |-
      During the Nimitz UAP Incident, 2004, after landing, Chad Underwood's flight met in the Carrier Intelligence Center (CVIC). The CVIC section attempted to collect his tapes but he refused. Copies of the tapes were made with a set being turned into the intelligence section.
