      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, after the Anomalous Aerial Vehicle (AAV) departed, the flight attempted to locate both the object and the disturbance with no success. Nothing was seen on or below the surface and there were no indications of the previous disturbance.
