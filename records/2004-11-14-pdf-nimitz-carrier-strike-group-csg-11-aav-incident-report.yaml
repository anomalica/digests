      D.C. Curtis held the rank of Rear Admiral at the time of the Anomalous Aerial Vehicle (AAV) intercept and was the commander of the Nimitz Carrier Strike Group; he subsequently became a Vice Admiral commanding Naval Surface Forces and the Pacific Fleet's Naval Surface Force.
  - id: 3addea33-685f-40a0-9e0d-e06b2c9555c3
