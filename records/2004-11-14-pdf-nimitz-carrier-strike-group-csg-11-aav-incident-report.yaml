    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor stated that the F/A-18s were brand new with less than 100 hours on them and were working perfectly, with all aircraft systems functional, no mission computer or avionics issues, and no radio or communication interference.
