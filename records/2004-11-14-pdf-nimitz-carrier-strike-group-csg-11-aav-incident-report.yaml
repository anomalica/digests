    text: |-
      During the Nimitz UAP Incident, 2004, the USS Louisville is a Los Angeles-class nuclear fast attack submarine that was operating in the vicinity of the USS Nimitz as part of the Carrier Strike Group (CSG) during the detection and intercept of the Anomalous Aerial Vehicle (AAV).
