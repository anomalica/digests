    location: p.11
    refs:
      - id: 29f2befa-fe75-484b-a9e8-53a320e66c84
        name: Chad Underwood
    quote: |-
      When asked LT Underwood couldn't confirm any physiological or psychological feelings that were out of the ordinary. He only expressed a feeling of confusion during the event.
    text: |-
      Chad Underwood could not confirm any physiological or psychological feelings out of the ordinary, only expressing a feeling of confusion during the event.
  - id: 0e85ea1d-8ded-40cf-ba02-0672998ea2d9
    type: administrative
    location: p.11-12
    refs:
      - id: 8aa84b57-4e77-4b65-8126-635654fe4eac
