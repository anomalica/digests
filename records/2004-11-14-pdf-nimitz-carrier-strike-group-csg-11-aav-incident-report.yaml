domain_claims:
  - id: 399d99de-eaca-4e0c-a867-113c5fc916ce
    type: administrative
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 8e0bdf30-7b1f-4865-a429-e727a11ce08e
        name: Nimitz Carrier Strike Group
    quote: |-
      During the period of approximately 10-16 November 2004, the Nimitz Carrier Strike Group (CSG) was operating off the western coast of the United States in preparation for their deployment to the Arabian Sea.
    text: |-
      During the Nimitz UAP Incident, 2004, the Nimitz Carrier Strike Group (CSG) was operating off the western coast of the United States during approximately 2004-11-10 to 2004-11-16 in preparation for deployment to the Arabian Sea.
  - id: eb58aec5-f357-4302-b810-47ced2cc426b
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: aa9c0b94-9098-4a7b-b741-0da1019100da
        name: USS Princeton
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The USS Princeton on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the CSG.
    text: |-
      During the Nimitz UAP Incident, 2004, the USS Princeton on several occasions detected multiple Anomalous Aerial Vehicles (AAVs) operating in and around the vicinity of the Carrier Strike Group (CSG).
  - id: 055a175c-33dc-496f-82dc-3cfe24397adf
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The AAVs would descend "very rapidly" from approximately 60,000 feet down to approximately 50 feet in a matter of seconds.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicles (AAVs) would descend very rapidly from approximately 18,000 metres down to approximately 15 metres in a matter of seconds.
  - id: 59dac58d-6baa-4fe9-abee-8bfe6d17f977
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      They would then hover or stay stationary on the radar for a short time and depart at high velocities and turn rates.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicles (AAVs) would hover or stay stationary on radar for a short time and then depart at high velocities and turn rates.
  - id: 51d41e04-c6a1-41e7-ae65-06d3476816ec
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 9195341c-4ba9-47d7-b709-24b8f45b4049
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
      - id: 4d11273b-4192-48be-a240-480f13327e2b
        name: F/A-18F
    quote: |-
      leading to visual contact approximately one mile away from the AAV, which was reported to be "an elongated egg or a 'Tic Tac' shape with a discernable midline horizontal axis"
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, F/A-18F pilots achieved visual contact with the Anomalous Aerial Vehicle (AAV) at approximately 1.6 kilometres distance, and it was reported to be an elongated egg or 'Tic Tac' shape with a discernible midline horizontal axis.
  - id: 4ac9f123-6855-4ac3-a971-1e3a69810d29
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 9195341c-4ba9-47d7-b709-24b8f45b4049
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      It was "solid white, smooth, with no edges. It was approximately 46 feet in length.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) was described as solid white, smooth, with no edges, and approximately 14 metres in length.
  - id: 870a40b2-4aa2-4409-b735-487265bb056e
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 9195341c-4ba9-47d7-b709-24b8f45b4049
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
      - id: 4d11273b-4192-48be-a240-480f13327e2b
        name: F/A-18F
    quote: |-
      The F/A-18Fs radar could not obtain a 'lock' on the AAV; however it could be tracked while stationary and at slower speeds with the Forward Looking Infrared (FLIR).
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the F/A-18F's radar could not obtain a lock on the Anomalous Aerial Vehicle (AAV); however, the AAV could be tracked while stationary and at slower speeds using the forward-looking infrared (FLIR) system.
  - id: 0c2830f8-6c89-4307-9ca2-88b6b2161009
    type: observation
    attestation: second_hand
    location: page 1, Executive Summary
    date: '2004-11-14'
    refs:
      - id: 9195341c-4ba9-47d7-b709-24b8f45b4049
        name: Nimitz F/A-18F UAP Intercept, 2004-11-14
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
      - id: 4d11273b-4192-48be-a240-480f13327e2b
        name: F/A-18F
    quote: |-
      The AAV did take evasive actions upon intercept by the F/A-18 demonstrating an advanced acceleration (G), aerodynamic, and propulsion capability.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) took evasive actions upon intercept by the F/A-18 demonstrating an advanced acceleration (G), aerodynamic, and propulsion capability.
  - id: 2af48fa7-c609-43d5-ab1b-3a5d447b8496
    type: opinion
    attestation: second_hand
    location: page 1, Executive Summary
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
      - id: 8e0bdf30-7b1f-4865-a429-e727a11ce08e
        name: Nimitz Carrier Strike Group
    quote: |-
      The AAV did not take any offensive action against the CSG; however, given its ability to operate unchallenged in close vicinity to the CSG it demonstrated the potential to conduct undetected reconnaissance leaving the CSG with a limited ability to detect, track, and/or engage the AAV.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicle (AAV) did not take any offensive action against the Carrier Strike Group (CSG); however, given its ability to operate unchallenged in close vicinity to the CSG, it demonstrated the potential to conduct undetected reconnaissance.
  - id: d3e13568-97b6-46cf-9a99-decd97d194d6
    type: opinion
    attestation: second_hand
    location: page 1, Key Assessments
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The Anomalous Aerial Vehicle (AAV) was no known aircraft or air vehicle currently in the inventory of the United States or any foreign nation.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicle (AAV) was assessed as no known aircraft or air vehicle currently in the inventory of the United States or any foreign nation.
  - id: 35f6d58f-a84c-4f8c-ac95-92335e61e407
    type: opinion
    attestation: second_hand
    location: page 1, Key Assessments
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
      - id: 076fc3ee-fba6-4fb0-9636-9d12412717d5
        name: Low Observability Stealth
    quote: |-
      The AAV exhibited advanced low observable characteristics at multiple radar bands rendering US radar based engagement capabilities ineffective.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicle (AAV) exhibited advanced low-observable characteristics at multiple radar bands, rendering US radar-based engagement capabilities ineffective.
  - id: 23a29523-3f36-4456-8ea9-9889586ad261
    type: observation
    attestation: second_hand
    location: page 1, Key Assessments
    date: 2004-11
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      The AAV exhibited advanced aerodynamic performance with no visible control surfaces and no visible means to generate lift.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicle (AAV) exhibited advanced aerodynamic performance with no visible control surfaces and no visible means to generate lift.
