      The FLIR showed an object at 0 ATA and approximately -5deg elevation (Figure 2). According to LT Underwood, "the target was best guess co-altitude or a few thousand feet below," estimating the object to be between 15-20 thousand feet.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, Chad Underwood's forward-looking infrared (FLIR) showed the Anomalous Aerial Vehicle (AAV) at 0 degrees Antenna Train Angle and approximately minus 5 degrees elevation, estimating the object to be between 4,500 and 6,000 metres co-altitude or a few thousand feet below.
