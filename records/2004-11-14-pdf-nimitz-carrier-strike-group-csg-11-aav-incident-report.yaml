    quote: |-
      Capt {{redacted}} confirmed that the CSG leadership asked him if any additional reporting was required and he advised that since they were in a training environment an email based MISREP to 3rd Fleet N2 was the only report required. When asked what he thought the AAV was he replied that he believed it was part of a counterdrug operation based on the area of operations.
    text: |-
      A redacted Captain (CAPT) serving as the CSG-11 Senior Intelligence Officer (N2) advised that since the Carrier Strike Group 11 (CSG-11) was in a training environment, an email-based Mission Report (MISREP) to the 3rd Fleet Intelligence (N2) was the only report required. He personally believed the Anomalous Aerial Vehicle (AAV) was part of a counterdrug operation based on the area of operations.
