    quote: |-
      The flight proceeded to CVIC. LT {redacted} noted that the sailors in CIVC had donned tin-foil caps and wanted to know about the "UFO flight." They reviewed the tapes and described to CIVC what they had seen and what the flight had done.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the FASTEAGLE flight proceeded to the Carrier Intelligence Center (CVIC), where sailors had donned tin-foil caps and wanted to know about the 'UFO flight'; they reviewed the tapes and described what they had seen.
