      According to CDR Fravor, the object's shape was like an elongated egg or a 'Tic Tac' and had a discernable midline horizontal axis. However, the object was uniformly white across the entire body. It was approximately 46 feet in length.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor described the Anomalous Aerial Vehicle (AAV) as shaped like an elongated egg or 'Tic Tac' with a discernible midline horizontal axis, approximately 14 metres long, and uniformly white across the entire body.
