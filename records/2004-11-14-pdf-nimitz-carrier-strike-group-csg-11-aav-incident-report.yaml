      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) began to move out of Chad Underwood's forward-looking infrared (FLIR) field of view to the left; he made no attempt to slew the FLIR and subsequently lost situational awareness.
