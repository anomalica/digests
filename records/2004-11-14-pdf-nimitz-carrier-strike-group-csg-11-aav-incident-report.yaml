        name: Nimitz UAP Incident, 2004
    quote: |-
      Admiral Peter Daly assumed command of the CSG in January 2005 after the intercept and had no knowledge or involvement in this incident.
    text: |-
      Peter Daly assumed command of Carrier Strike Group 11 (CSG-11) in January 2005, after the Anomalous Aerial Vehicle (AAV) intercept, and had no knowledge of or involvement in the incident.
  - id: bf5b36f3-b710-4da5-9da5-2b5cadb67238
    type: administrative
    attestation: first_hand
    location: page 12
    refs:
      - id: 3fd3124e-e7aa-4cc2-b50d-fffb03539f2b
        name: Carrier Intelligence Center (CVIC)
      - id: fe8dcaab-42e7-454c-b8ee-c114c0815c25
        name: Nimitz UAP Incident, 2004
    quote: |-
      Typically most if not all reporting on any CSG mission related air activity is completed in CVIC by the Intelligence personnel. At least one pilot or aircrew member of each flight or aircraft will stop by CVIC to be debriefed by intelligence. Intelligence personnel will then take the information provided by the pilot or aircrew member and complete a mission report (MISREP).
    text: |-
      The standard intelligence reporting process within the Carrier Strike Group required at least one pilot or aircrew member from each flight to debrief with Carrier Intelligence Center (CVIC) personnel, who would then compile a Mission Report (MISREP).
  - id: f40ab248-13fa-4205-9ad2-784e956ecb1f
    type: testimony
    attestation: second_hand
    location: page 12
    date: '2004-11-14'
    refs:
