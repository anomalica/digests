      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor detached FASTEAGLE 02 (Alex Dietrich's aircraft) to hold at approximately 6,000 metres while his aircraft (FASTEAGLE 01) descended to between 3,600 and 4,900 metres.
