    text: |-
      During the Nimitz UAP Incident, 2004, the commanding officer of Marine Fighter Attack Squadron 232 (VMFA-232) (redacted) was flying a single-seat F/A-18C that launched from the USS Nimitz at approximately 1030 local time to conduct a functional check flight of an aircraft that had recently completed significant maintenance.
