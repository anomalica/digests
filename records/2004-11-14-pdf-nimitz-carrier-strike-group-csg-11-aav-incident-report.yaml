      - id: 83aa06e5-6cda-4182-8c25-41a7b4e9f3a3
        name: AN/SPY-1
    quote: |-
      According to Senior Chief {redacted} the AAVs would descend from a very high altitude into the scan volume of the AN/SPY-1 at a high velocity. The top of the scan volume would put the AAVs at higher than 60,000 feet.
    text: |-
      During the Nimitz UAP Incident, 2004, a USS Princeton Senior Chief with 17 years of experience as a fire control operator on Aegis cruisers stated that the Anomalous Aerial Vehicle (AAV) descended from above approximately 18,000 metres into the AN/SPY-1 scan volume at high velocity.
  - id: 5f2c5b77-f947-49cc-aaa9-596a483dd380
    type: opinion
