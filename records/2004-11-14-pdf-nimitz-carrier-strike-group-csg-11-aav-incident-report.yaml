        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      LT {redacted} described it as "solid white, smooth, with no edges. It was uniformly colored with no nacelles, pylons, or wings." When asked to describe the appearance... he said, "neither, it looked like it had a white candy-coated shell, almost like a white board."
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the FASTEAGLE 01 WSO described the Anomalous Aerial Vehicle (AAV) as 'solid white, smooth, with no edges', uniformly coloured with no nacelles, pylons, or wings, and said it looked like it had a white candy-coated shell, almost like a whiteboard.
  - id: b027f228-da48-46e9-9a64-39759e62b47a
    type: observation
    attestation: second_hand
