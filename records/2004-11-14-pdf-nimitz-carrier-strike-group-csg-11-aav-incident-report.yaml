      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      The USS Louisville USS Louisville (SSN-724) is a Los Angeles-class nuclear fast attack submarine. She was operating in the vicinity of the USS Nimitz as part of the CSG during the detection and intercept of the AAV.
    text: |-
      The USS Louisville (SSN-724) is a Los Angeles-class nuclear fast attack submarine that was operating in the vicinity of the USS Nimitz (CVN-68) as part of the Carrier Strike Group during the detection and intercept of the Anomalous Aerial Vehicle (AAV).
  - id: 82fd3d21-d33d-40bb-9b25-f71762c2775c
    type: testimony
    attestation: first_hand
    location: p.12
    date: '2004-11-14'
    refs:
      - id: 8aa84b57-4e77-4b65-8126-635654fe4eac
        name: USS Louisville (SSN-724)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 5ee4362d-c09b-44a8-a3be-8bd9c05f4c78
        name: United States Navy
    quote: |-
      According to former LT {{redacted: ~3 words}} now a civilian working for the US Navy, who was a qualified Submarine Officer onboard the Louisville in November 2004 during the AAV activity there were no unidentified sonar contacts in the vicinity of the aerial sightings or at anytime during the operations off the coast of California.
    text: |-
      A qualified Submarine Officer aboard the USS Louisville (SSN-724) in November 2004 reported there were no unidentified sonar contacts in the vicinity of the aerial sightings or at any time during the operations off the coast of California.
  - id: eedd948f-fbf6-485b-a829-fbb1cce0ea0f
    type: testimony
    location: p.12
    refs:
      - id: 8aa84b57-4e77-4b65-8126-635654fe4eac
        name: USS Louisville (SSN-724)
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      The former commander of the USS Louisville, CAPT {{redacted: ~2 words}} confirmed that there was no anomalous undersea activity during this period.
    text: |-
      The former commander of the USS Louisville (SSN-724) confirmed there was no anomalous undersea activity during the period of the 2004 USS Nimitz UAP encounter.
  - id: 1314057f-b2ba-4136-96c2-c5cc20294467
    type: administrative
    location: p.12
    refs:
      - id: 8aa84b57-4e77-4b65-8126-635654fe4eac
        name: USS Louisville (SSN-724)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      There was a live fire exercise conducted by the USS Louisville during the period of and in the vicinity of the AAV sightings; however, the weapon in use did not match the flight profile or visible characteristics of the AAV.
    text: |-
      A live fire exercise was conducted by the USS Louisville (SSN-724) during and in the vicinity of the Anomalous Aerial Vehicle (AAV) sightings, but the weapon in use did not match the flight profile or visible characteristics of the AAV.
  - id: 63e9114d-539a-46e2-9a4c-c6be8748b47b
    type: administrative
    location: p.12
    refs:
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Additionally any live fire would have been coordinated throughout the CSG and all air traffic would have been well aware of the launch and operation of the weapon system. Aircraft would not have been vectored for the intercept of a US Weapon in-flight.
    text: |-
      Any live fire would have been coordinated throughout the Carrier Strike Group with all air traffic aware of the launch, and aircraft would not have been vectored for the intercept of a US weapon in-flight.
  - id: 9273e4d4-168c-4881-a603-d2f53a0758e6
    type: opinion
    location: p.12
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Based on the lack of detection of any unidentified sonar contacts it is highly unlikely that an AAV operated below the surface of the ocean; it is possible that the AAV demonstrated the ability to be cloaked or invisible to the human eye based on pilot reporting of the water disturbance with no visible craft.
    text: |-
      Based on the lack of detection of any unidentified sonar contacts, it is highly unlikely that an Anomalous Aerial Vehicle (AAV) operated below the surface of the ocean during the 2004 USS Nimitz UAP encounter; it is possible the AAV demonstrated the ability to be cloaked or invisible to the human eye based on pilot reporting of the water disturbance with no visible craft.
  - id: 7dd59068-46c7-4f69-a2dc-58fab3a17adb
    type: opinion
    location: p.12
    refs:
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Based on the assessment of Mr. {{redacted: ~2 words}} if the AAV did operate underwater undetected it would represent a highly advanced capability given the advanced capability of our sensors.
    text: |-
      If the Anomalous Aerial Vehicle (AAV) did operate underwater undetected during the 2004 USS Nimitz UAP encounter, it would represent a highly advanced capability given the advanced capability of US sensors.
  - id: b60307f0-0d82-4183-98ae-2e513399cb4a
    type: administrative
    location: p.12
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 55a1da38-fcd1-4e55-b32b-0782c6391461
        name: Carrier Air Wing 11 (CVW-11)
    quote: |-
      On 14 November following the intercept of the AAV, CDR Fravor reported to CVIC to debrief with Intelligence. He discussed the entire mission and AAV contact with LCDR {{redacted: ~2 words}} the Carrier Air Wing Intelligence Officer.
    text: |-
      On 2004-11-14 following the intercept of the Anomalous Aerial Vehicle (AAV), David Fravor reported to the Carrier Intelligence Center and discussed the entire mission and AAV contact with the Carrier Air Wing Intelligence Officer.
  - id: 0c314912-97b9-4621-839f-64a017861612
    type: testimony
    location: p.12
    date: '2004-11-14'
    refs:
      - id: c09e3558-1732-4676-a218-d67d285d98ef
        name: David Fravor
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 55a1da38-fcd1-4e55-b32b-0782c6391461
        name: Carrier Air Wing 11 (CVW-11)
    quote: |-
      According to LCDR {{redacted: ~1 word}} he "wasn't sure what to do". He also stated that they "didn't take it seriously" at first; however, they had absolutely no reason to question the report from a very experienced and well-respected F/A-18 squadron commanding officer. LCDR {{redacted: ~1 word}} added that they likely would have not given as much attention if it came from a lesser-experienced aviator.
    text: |-
      The Carrier Air Wing Intelligence Officer did not take David Fravor's Anomalous Aerial Vehicle (AAV) report seriously at first, but had no reason to question the report from a very experienced and well-respected F/A-18 squadron commanding officer, and would have given it less attention from a lesser-experienced aviator.
  - id: 4efc059b-7ef3-4c4a-9244-4229357534f6
    type: testimony
    location: p.12
    refs:
      - id: 55a1da38-fcd1-4e55-b32b-0782c6391461
        name: Carrier Air Wing 11 (CVW-11)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      He reported it to the Commander of the Air Wing, CAPT {{redacted: ~2 words}} also a highly experienced aviator but he did not take it very serious.
    text: |-
      The Carrier Air Wing Intelligence Officer reported the Anomalous Aerial Vehicle (AAV) contact to the Commander of the Air Wing, a highly experienced aviator, who did not take it very seriously.
  - id: 99e51739-a256-426e-aadd-b95ed025fe06
    type: administrative
    location: p.12
    date: '2004-11-14'
    refs:
      - id: 55a1da38-fcd1-4e55-b32b-0782c6391461
        name: Carrier Air Wing 11 (CVW-11)
      - id: bc8fbcc7-34d0-4453-95bd-35bd520644b0
        name: F/A-18
      - id: fbf8f962-0e7c-4a4d-a399-0df04134a21b
        name: United States Third Fleet
    quote: |-
      LCDR {{redacted: ~1 word}} completed an email based MISREP. It was submitted via email because the F/A-18s were on a training mission. The email-based report including the FLIR video was sent via a secure system to CAPT {{redacted: ~2 words}} at 3rd Fleet Intelligence, their higher echelon command.
    text: |-
      The Carrier Air Wing Intelligence Officer completed an email-based Mission Report (MISREP), submitted via email because the F/A-18s were on a training mission, sent with the forward-looking infrared (FLIR) video via a secure system to 3rd Fleet Intelligence at the United States Third Fleet.
  - id: 13af7641-3f30-4596-89cf-cc13ef47232e
    type: testimony
    location: p.12-13
    refs:
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Finally, LCDR {{redacted: ~1 word}} admitted and detailed the high level of ridicule that the aircrew experienced over the next few weeks.
    text: |-
      The aircrew involved in the 2004 USS Nimitz UAP encounter experienced a high level of ridicule over the following weeks.
  - id: 9ace2dee-03d8-40c0-a09e-b4c68b0b4c74
    type: administrative
    location: p.12-13
    refs:
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: fbf8f962-0e7c-4a4d-a399-0df04134a21b
        name: United States Third Fleet
    quote: |-
      Capt {{redacted}} confirmed that the CSG leadership asked him if any additional reporting was required and he advised that since they were in a training environment an email based MISREP to 3rd Fleet N2 was the only report required.
    text: |-
      The Carrier Strike Group 11 (CSG-11) Senior Intelligence Officer (N2) advised that, since they were in a training environment, an email-based Mission Report (MISREP) to 3rd Fleet N2 was the only report required.
  - id: 29da0649-6922-48f8-8774-485b436006e6
    type: opinion
    location: p.13
    refs:
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      When asked what he thought the AAV was he replied that he believed it was part of a counterdrug operation based on the area of operations.
    text: |-
      The Carrier Strike Group 11 (CSG-11) Senior Intelligence Officer (N2) believed the Anomalous Aerial Vehicle (AAV) was part of a counterdrug operation based on the area of operations.
  - id: 0c89e506-0be6-4644-8524-38569150afa1
    type: administrative
    location: p.13
    refs:
      - id: fbf8f962-0e7c-4a4d-a399-0df04134a21b
        name: United States Third Fleet
      - id: 5ee4362d-c09b-44a8-a3be-8bd9c05f4c78
        name: United States Navy
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      The 3rd Fleet N2 at the time of the event was CAPT {{redacted}}. CAPT {{redacted}} has since retired from the US Navy and could not be located
    text: |-
      The 3rd Fleet Intelligence Officer (N2) at the time of the 2004 USS Nimitz UAP encounter has since retired from the United States Navy and could not be located.
  - id: bfcb87ac-0177-4de0-bd66-1d7aaa85433a
    type: administrative
    location: p.13
    date: '2004-11-14'
    refs:
      - id: fbf8f962-0e7c-4a4d-a399-0df04134a21b
        name: United States Third Fleet
    quote: |-
      his deputy N2 was CAPT {{redacted}}. CAPT {{redacted}} confirmed that the MISREP was received via email on or about 14 November 2004.
    text: |-
      The deputy 3rd Fleet Intelligence Officer (N2) confirmed that the Mission Report (MISREP) was received via email on or about 2004-11-14.
  - id: dd056a79-5534-411b-a4e2-bf10094cd6eb
    type: administrative
    location: p.13
    date: '2004-11-14'
    refs:
      - id: fbf8f962-0e7c-4a4d-a399-0df04134a21b
        name: United States Third Fleet
    quote: |-
      Since this MISREP was completed during training and preparation for deployment it was read and acknowledged by 3rd Fleet N2 but was not forwarded to anyone up the chain of command. Additionally CAPT {{redacted}} stated that it was not likely archived but deleted at some point later as there is no requirement to keep these reports
    text: |-
      The 2004-11-14 Mission Report (MISREP) was read and acknowledged by 3rd Fleet N2 but was not forwarded to anyone up the chain of command, was not likely archived, and was likely deleted at some point later as there is no requirement to keep such training reports.
  - id: 18e5645e-0e40-46a5-9e7a-976f10a5ea62
    type: administrative
    location: p.13
    refs:
      - id: b0d1121b-e0c5-490b-8d6c-69a234cd1b36
        name: D. C. Curtis
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: f5c6d3de-2607-4a1f-b97b-cecc7a3191f1
        name: Commander, Naval Surface Forces (US Navy)
    quote: |-
      The commander of the Nimitz Carrier Strike Group during the intercept was Rear Admiral D.C. Curtis now a Vice Admiral (VADM) and is commander of Naval Surface Forces and the Pacific Fleet's Naval Surface Force.
    text: |-
      The commander of the Nimitz Carrier Strike Group during the intercept was Rear Admiral D.C. Curtis, now a Vice Admiral and commander of Naval Surface Forces and the Pacific Fleet's Naval Surface Force.
  - id: ab59e186-1ed0-497b-877b-8762f5b2d898
    type: administrative
    location: p.13
    refs:
      - id: b0d1121b-e0c5-490b-8d6c-69a234cd1b36
        name: D. C. Curtis
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
      - id: 228844a4-f0e6-45a4-8552-582ee7de5b21
        name: USS Princeton (CG-59)
      - id: 2e0e4846-4a0f-42ed-b6c1-a39ea2ecbae2
        name: Strike Fighter Squadron 41 (VFA-41)
    quote: |-
      All of the AAV activity was reported to VADM Curtis by the Commanding Officer, USS Princeton and Commanding Officer, VFA-41.
    text: |-
      All of the Anomalous Aerial Vehicle (AAV) activity was reported to Vice Admiral D.C. Curtis by the Commanding Officer of the USS Princeton (CG-59) and the Commanding Officer of Strike Fighter Squadron 41 (VFA-41).
  - id: b56e8eb5-be1f-486f-94bf-d06fe14d5475
    type: administrative
    location: p.13
    refs:
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Capt {{redacted}} was the Director of Operations (N3) for CSG-11 at the time of the intercept. Capt {{redacted}} confirmed that other than the MISREP there was no other official report or statement from the CSG. He also stated that at no time did they consider the AAV a threat to the battle group.
    text: |-
      The Director of Operations (N3) for Carrier Strike Group 11 (CSG-11) confirmed that other than the Mission Report (MISREP) there was no other official report or statement from the CSG, and that at no time did they consider the Anomalous Aerial Vehicle (AAV) a threat to the battle group.
  - id: 63fe5710-4a21-44bd-aa8a-bf848c7e2a11
    type: testimony
    location: p.13
    refs:
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Additionally they had no advanced knowledge of live fire events, US Weapons Testing or any other experimental aircraft operating in the area. Finally, they had never seen anything like this before and never again.
    text: |-
      Carrier Strike Group 11 (CSG-11) had no advanced knowledge of live fire events, US weapons testing, or any other experimental aircraft operating in the area, and had never seen anything like the Anomalous Aerial Vehicle (AAV) before or again.
  - id: 1e1915a8-61b3-41be-aa24-a2d9f9ca81b0
    type: administrative
    location: p.13
    date: '2005-01-01'
    refs:
      - id: 8372f06c-79e2-40ab-b426-7b476f6d7275
        name: Peter Daly
      - id: 66aaf90a-f903-447a-8757-fd952f585dd4
        name: Carrier Strike Group 11 (CSG-11)
      - id: e39f5c07-498f-4121-b640-2844138caba5
        name: 2004 USS Nimitz UAP encounter
    quote: |-
      Admiral Peter Daly assumed command of the CSG in January 2005 after the intercept and had no knowledge or involvement in this incident.
    text: |-
      Admiral Peter Daly assumed command of the Carrier Strike Group in January 2005 after the intercept and had no knowledge or involvement in the 2004 USS Nimitz UAP encounter.
