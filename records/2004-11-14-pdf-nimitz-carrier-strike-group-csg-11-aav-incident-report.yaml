    quote: |-
      As LT Underwood watched the object it began to move out of FLIR field of view to the left. LT Underwood made no attempt to slew the FLIR and subsequently lost situational awareness to the object. The Flight continued with training mission with no further contact with object.
    text: |-
      During the Nimitz UAP Incident, 2004, the Anomalous Aerial Vehicle (AAV) began to move out of Chad Underwood's forward-looking infrared (FLIR) field of view to the left. Chad Underwood made no attempt to slew the FLIR and subsequently lost situational awareness of the object. The flight continued with the training mission with no further contact.
