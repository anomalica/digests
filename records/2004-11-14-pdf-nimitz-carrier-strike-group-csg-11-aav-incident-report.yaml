    text: |-
      Carrier Air Wing 11 (CVW-11) was embarked on the USS Nimitz and comprised Marine Fighter Attack Squadron 232 (VMFA-232) flying F/A-18Cs, Strike Fighter Squadron 41 (VFA-41) flying F/A-18Fs, Electronic Attack Squadron 135 (VAQ-135) flying EA-6Bs, Carrier Airborne Early Warning Squadron 117 (VAW-117) flying E-2Cs, Helicopter Anti-Submarine Squadron 6 (HS-6) flying H-60s, and Fleet Logistics Support Squadron 30 (VRC-30) Det 3 flying C-2As. The document also references VFA-14 flying F/A-18Es and VFA-94 flying F/A-18Cs as part of CVW-11, though these squadrons are noted as not being involved in the Anomalous Aerial Vehicle (AAV) events.
