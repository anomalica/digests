    quote: |-
      As he approached approximately 15nm from the AAV descending through approximately 15,000 feet, he could see a water disturbance in the ocean surface. He recalled that the sea state was low (calm).
    text: |-
      During the Nimitz UAP Incident, 2004, as the VMFA-232 commanding officer approached approximately 25 kilometres from the Anomalous Aerial Vehicle (AAV), descending through approximately 4,500 metres, he could see a water disturbance on the ocean surface. The sea state was low (calm).
  - id: 3259bc22-e857-4853-96d6-4fb06f539e13
    type: hearsay
    attestation: second_hand
    location: page 6
    date: '2004-11-14'
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: a87cc038-44f1-423c-977b-9fa14c3816bb
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: c3c849ee-f005-4b69-9809-19e63553254b
        name: Water Disturbance
    quote: |-
      The disturbance appeared to be 50 to 100 meters in diameter and close to round. It was the only area and type of whitewater activity that could be seen and reminded him of images of something rapidly submerging from the surface like a submarine or ship sinking. It also looked like a possible area of shoal water where the swell was breaking over a barely submerged reef or island.
    text: |-
      During the Nimitz UAP Incident, 2004, the VMFA-232 commanding officer described the water disturbance as approximately 50 to 100 metres in diameter and close to round, the only area of whitewater activity visible, reminiscent of something rapidly submerging from the surface like a submarine or ship sinking, or possibly shoal water where swell was breaking over a barely submerged reef.
  - id: cc72e006-3144-4f29-84b4-83759679ba6d
    type: hearsay
    attestation: second_hand
    location: page 6
    date: '2004-11-14'
    refs:
      - id: 58b111ea-a3e9-4c4b-9590-e574c2d05aeb
        name: Nimitz UAP Incident, 2004
      - id: a87cc038-44f1-423c-977b-9fa14c3816bb
        name: Marine Fighter Attack Squadron 232 (VMFA-232)
      - id: c3c849ee-f005-4b69-9809-19e63553254b
        name: Water Disturbance
      - id: 40e8efd4-ec5b-44e0-bee6-e1f51e5aa80b
        name: Anomalous Aerial Vehicle (AAV)
    quote: |-
      He overflew the disturbance and turned back to the northwest. As he was flying away he could see the disturbance clearing and could no longer identify the place where it occurred. He did not see any object or vessel associated with the disturbance either above the surface, on the surface, or below the surface. ... It is possible that the disturbance was being caused by an AAV but that the AAV was 'cloaked' or invisible to the human eye.
    text: |-
      During the Nimitz UAP Incident, 2004, the VMFA-232 commanding officer overflew the water disturbance, did not see any object or vessel associated with it above, on, or below the surface, and as he flew away the disturbance cleared. It is possible, the report notes, that the disturbance was caused by an Anomalous Aerial Vehicle (AAV) that was cloaked or invisible to the human eye.
