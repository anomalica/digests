    text: |-
      A redacted Naval Flight Officer (NFO) in Carrier Airborne Early Warning Squadron 117 (VAW-117) was the squadron's avionics division officer and would have been responsible for any radar recordings; he confirmed it was not routine to have recordings engaged in the E-2C Hawkeye unless pre-coordinated, which is typically done only during airborne testing of new capabilities.
