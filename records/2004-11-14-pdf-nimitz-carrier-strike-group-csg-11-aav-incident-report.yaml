    text: |-
      The AN/SPY-1 radar operates in the S-band frequency range, providing mid-course guidance for semi-active missiles such as the Evolved Sea Sparrow Missile, SM-2 and SM-3.
  - id: d984637f-f348-4c7c-88b3-70101f43dd26
