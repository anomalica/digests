      High-power UHF Doppler radar that utilizes a rotating antenna within a circular radome mounted atop the aircraft. ... Will monitor and track more than 20,000 targets simultaneously
    text: |-
      The AN/APS-145 radar is a high-power UHF Doppler radar that uses a rotating antenna within a circular radome mounted atop the aircraft and will monitor and track more than 20,000 targets simultaneously.
  - id: 6f207d9a-c2a3-40df-b5d5-b74904b9f1e8
    type: administrative
    location: p.4
    date: '2004-11-14'
    refs:
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: 00525b7a-3ae7-44d8-a86a-0b98d1489142
        name: Carrier Airborne Early Warning Squadron 117 (VAW-117)
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      On 14 November 2004, {{redacted: ~2 words}} E-2C NFO, was in VAW-117 and airborne during the contact. Additionally, he was the squadron's avionics division officer and would be responsible for any and all RADAR recordings, etc...
    text: |-
      On 2004-11-14, an E-2C Naval Flight Officer from Carrier Airborne Early Warning Squadron 117 (VAW-117) was airborne during the Anomalous Aerial Vehicle (AAV) contact and was the squadron's avionics division officer responsible for any radar recordings.
  - id: 766ef188-1a29-4552-8dab-48ee96444aa3
    type: administrative
    location: p.4
    date: '2004-11-14'
    refs:
      - id: 5ea2fc59-cfad-408a-bf24-b88fadfd2ebc
        name: E-2 Hawkeye
      - id: 76f817db-03c2-44c5-86b1-d30eae7ce2f6
        name: anomalous aerial vehicle (AAV)
    quote: |-
      Unfortunately in the E-2C, it is not routine to have any kind of recording engaged unless it is pre coordinated which is typically only used during airborne testing of new capabilities, etc... There was no recording of this event.
    text: |-
      In the E-2C Hawkeye it is not routine to have any kind of recording engaged unless it is pre-coordinated, and there was no recording of the 2004-11-14 Anomalous Aerial Vehicle (AAV) event.
  - id: 3814c9e0-9d2f-4334-8a6e-777af999dd0e
