        name: Nimitz UAP Incident, 2004
    quote: |-
      Capt [redacted] confirmed that the CSG leadership asked him if any additional reporting was required and he advised that since they were in a training environment an email based MISREP to 3rd Fleet N2 was the only report required.
    text: |-
      The Carrier Strike Group 11 (CSG-11) Senior Intelligence Officer (N2) advised CSG leadership that since the intercept occurred in a training environment, an email-based Mission Report (MISREP) to 3rd Fleet N2 was the only report required.
  - id: d925fddf-de38-4bb6-a756-3e62d8b31b94
