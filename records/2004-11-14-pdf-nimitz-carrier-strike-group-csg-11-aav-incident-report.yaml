    quote: |-
      According to CDR Fravor the first indication he had of the unknown contact was a visual of a disturbance on the water below the AAV... he stated that it was localized underneath the object, did not appear as a trail or wake, and looked like frothy waves and foam almost as if the water was boiling.
    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor's first indication of the unknown contact was a visual of a water disturbance below the Anomalous Aerial Vehicle (AAV); he described it as localised underneath the object, not appearing as a trail or wake, and looking like frothy waves and foam almost as if the water was boiling.
