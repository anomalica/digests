    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the APG-73 radar on Chad Underwood's F/A-18F was in Range While Search mode at 150-kilometre scale with 4-bar scan and interleave, and the forward-looking infrared (FLIR) was in Lock and Slaved mode.
