    text: |-
      During the Nimitz UAP Incident, 2004, a live fire exercise was conducted by the USS Louisville during the period and in the vicinity of the Anomalous Aerial Vehicle (AAV) sightings; however, the weapon in use did not match the flight profile or visible characteristics of the AAV.
