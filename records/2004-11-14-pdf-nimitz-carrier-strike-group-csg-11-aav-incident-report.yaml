    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, David Fravor's flight descended to between approximately 6,000 and 7,300 metres and proceeded to the Anomalous Aerial Vehicle (AAV) contact. David Fravor did not recall any indications via on-board sensor and the aircraft was not carrying a forward-looking infrared (FLIR) pod.
