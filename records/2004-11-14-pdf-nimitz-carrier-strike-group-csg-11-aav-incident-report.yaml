        name: Nimitz UAP Incident, 2004
    quote: |-
      Based on all of the conversation with those involved and among the leadership of the various combatants within the CSG, VADM Curtis was a well respected, competent, and thorough Naval Officer. There is no question in anyone's mind that he followed any and all regulations and guidance applicable to his command.
    text: |-
      D.C. Curtis was described by those involved in the Nimitz UAP Incident as a well-respected, competent, and thorough Naval Officer who followed all applicable regulations and guidance.
