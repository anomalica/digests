    quote: |-
      Initial awareness of an object came via the radar. According to the radar display, the initial tracks were at approximately 30-40 nm to the south of the aircraft.
    text: |-
      During the Nimitz UAP Incident, 2004, Chad Underwood's initial awareness of the Anomalous Aerial Vehicle (AAV) came via the radar, with initial tracks at approximately 55 to 75 kilometres to the south of the aircraft.
