    text: |-
      During the Nimitz F/A-18F UAP Intercept, 2004-11-14, the Anomalous Aerial Vehicle (AAV) was pointed in a north-south orientation and was moving both north and south and east and west while maintaining a consistent altitude. David Fravor described these displacements as minor.
