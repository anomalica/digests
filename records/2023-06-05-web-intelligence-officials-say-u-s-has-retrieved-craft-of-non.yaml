    text: |-
      Grusch UAP Whistleblower Disclosure, 2023: Other intelligence officials, both active and retired, with knowledge of these Unidentified Anomalous Phenomena (UAP) programs through their work in various agencies, independently provided similar corroborating information, both on and off the record.
