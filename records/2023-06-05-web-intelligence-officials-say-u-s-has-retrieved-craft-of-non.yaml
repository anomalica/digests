    quote: |-
      A former intelligence official turned whistleblower has given Congress and the Intelligence Community Inspector General extensive classified information about deeply covert programs that he says possess retrieved intact and partially intact craft of non-human origin.
    text: |-
      David Charles Grusch, a former intelligence official turned whistleblower, gave the United States Congress and the Intelligence Community Inspector General (ICIG) extensive classified information about deeply covert programmes that he says possess retrieved intact and partially intact craft of non-human origin.
