      The information, he says, has been illegally withheld from Congress, and he filed a complaint alleging that he suffered illegal retaliation for his confidential disclosures, reported here for the first time.
    text: |-
      Grusch UAP Whistleblower Disclosure, 2023: David Grusch alleged that classified information about Unidentified Anomalous Phenomena (UAP) programs has been illegally withheld from Congress, and he filed a complaint alleging illegal retaliation for his confidential disclosures.
