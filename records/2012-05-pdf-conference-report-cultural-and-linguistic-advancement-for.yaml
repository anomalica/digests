    quote: |-
      Of particular interest were efforts currently underway to consolidate and unify information and LRC strategy across the DoD, something the Canadian Forces (CF) with its current 'ad hoc' approach to implementing culture and language skills and training may wish to monitor.
    text: |-
      The Canadian Forces (CF) currently take an 'ad hoc' approach to implementing culture and language skills and training, and may wish to monitor efforts underway to consolidate and unify Linguistic, Regional and Cultural (LRC) strategy across the Department of Defense (DoD).
