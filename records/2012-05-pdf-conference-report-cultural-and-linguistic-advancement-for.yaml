    text: |-
      Alenka Brown stated that individuals from Afghanistan, speaking generally, process, access or collect information around them from an "emotional-tonal" orientation, while the Department of Defense (DoD) as an organisation and American culture tend to do so from a "tactical-visual" perspective.
